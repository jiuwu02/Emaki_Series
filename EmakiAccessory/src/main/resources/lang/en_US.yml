  help_entry_open: "- <hover:show_text:'<gray>open</gray> <dark_gray>·</dark_gray> <gray>Open your own accessory window</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakiaccessory.use</white><newline><dark_gray>▸</dark_gray> <gray>Argument [page ID] optional, opens the active page when omitted, Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>open</gray></hover> <click:run_command:'%root% open'><green>[ ✦ Run ]</green></click>"
