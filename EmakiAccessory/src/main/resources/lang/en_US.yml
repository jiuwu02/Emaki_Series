# EmakiAccessory English language resource
# Messages use MiniMessage; preserve placeholders documented beside message groups
# version is maintained by resource synchronization when default keys are merged
version: "1.1.9"

console:
  plugin_starting: "[startup] <gray>Starting EmakiAccessory...</gray>"
  plugin_started: "[startup] <green>started</green>"
  plugin_stopped: "[shutdown] <yellow>stopped</yellow>"
  bootstrap_start: "[loader] <gray>Checking configuration files...</gray>"
  bootstrap_complete: "[loader] <green>Default file check complete</green>"
  bootstrap_skip: "[loader] <yellow>Skipped default data generation</yellow>"
  versioned_file_updated: "[loader] <green>Updated bundled file version: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "[loader] <yellow>Failed to copy default resource: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  bootstrap_save_failed: "[loader] <yellow>Failed to save merged resource: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  default_file_missing: "[loader] <yellow>Missing built-in default resource: <red>%path%</red></yellow>"
  directory_create_failed: "[loader] <yellow>Failed to create directory: <red>%path%</red></yellow>"
  config_precheck_passed: "[config] <gray>Config precheck passed: <yellow>%issues%</yellow> issue (s)</gray>"
  config_precheck_failed: "[config] <red>Config precheck failed: <yellow>%issues%</yellow> issue (s)</red>"
  config_precheck_issue: "[config] <gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "[config] <yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "[config] <red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray> (%hint%)</dark_gray>"
    messages:
      passed: "EmakiAccessory configuration precheck passed"
      required_file_missing: "The required file is missing"
      path_not_file: "The specified path is not a file"
      file_not_readable: "The file is not readable"
      required_directory_missing: "The required directory is missing"
      path_not_directory: "The specified path is not a directory"
      directory_not_readable: "The directory is not readable"
  # Console: failed to open editor; placeholders: %item%, %error%
  editor_open_failed: "[editor] <red>Could not open EmakiAccessory editor for %item%  (%error%)</red>"
  # Console: editor GUI template missing; placeholders: %template%
  editor_template_missing: "[editor] <red>Missing EmakiAccessory editor GUI template: %template%</red>"
  # Console: failed to create definition; placeholders: %path%, %error%
  editor_browser_create_failed: "[editor] <red>Could not create definition: %path%  (%error%)</red>"
  # Console: failed to delete definition; placeholders: %path%, %error%
  editor_browser_delete_failed: "[editor] <red>Could not delete definition: %path%  (%error%)</red>"
  # Console: failed to list definition directory; placeholders: %path%, %error%
  editor_browser_list_failed: "[editor] <red>Could not list definition directory: %path%  (%error%)</red>"

general:
  prefix: "<gray>[ <gradient:#F472B6:#C084FC>EmakiAccessory</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to do that</red>"
  players_only: "<red>This command can only be used by a player</red>"
  data_loading: "<yellow>Your accessory data is still loading, try again shortly</yellow>"

gui:
  read_only: "<red>You can only view these accessories, not change them</red>"
  orphan_read_only: "<yellow>This accessory's slot no longer exists; you can only take it out</yellow>"
  orphan_hint: "<dark_gray>Slot removed; cannot be put back once taken</dark_gray>"
  click_unsupported: "<red>The accessory window does not support that click</red>"
  transfer_unsupported: "<red>The accessory window does not support that transfer; move items one slot at a time</red>"
  slot_mismatch: "<red>This accessory only fits <white>%required%</white>, not <white>%slot%</white></red>"
  not_declared: "<red>That item declares no accessory slot and cannot be placed here</red>"
  invalid_returned: "<red>The item in <white>%slot%</white> is not a valid accessory for that slot and was returned to your inventory</red>"
  condition_unmet: "<red>Equip conditions are not met: attributes and skills are disabled</red>"
  durability_broken: "<red>Durability is exhausted: attributes and skills are disabled</red>"
  unique_conflict: "<red>You already have the same accessory in <white>%conflict%</white> on this page</red>"
  page_enable_lore: "<dark_gray>Click to make this page the active one</dark_gray>"
  page_enabled_lore: "<green>This page is active</green>"
  page_switch_lore: "<dark_gray>Click to switch to <white>%page%</white></dark_gray>"
  page_already_enabled: "<yellow>This page is already the active one</yellow>"
  page_unknown: "<red>No such accessory page: <white>%page%</white></red>"
  page_no_permission: "<red>You do not have permission to use accessory page <white>%page%</white></red>"
  session_stale: "<red>Your accessory data was reloaded; close and reopen the accessory window</red>"

durability:
  broken_notify: "<red>The accessory in <white>%slot%</white> ran out of durability; its attributes and skills no longer apply</red>"

command:
  help: |
    <gold>EmakiAccessory commands</gold>
    <yellow>/eacc open [page]</yellow> <gray>- Open the accessory window; the active page when omitted</gray>
    <yellow>/eacc list</yellow> <gray>- List the accessory slots of the active page</gray>
    <yellow>/eacc pages</yellow> <gray>- List every accessory page</gray>
    <yellow>/eacc retrieve <page></yellow> <gray>- Take back every accessory on a page, mainly for pages you cannot open</gray>
    <yellow>/eacc edit [id]</yellow> <gray>- Open the definition editor; opens the browser when id is omitted</gray>
    <yellow>/eacc reload</yellow> <gray>- Reload config, parts, sets and accessory pages</gray>
    <yellow>/eacc debug</yellow> <gray>- Debug toggles</gray>
    <yellow>/eacc admin</yellow> <gray>- Admin commands</gray>
  admin_usage: |
    <gold>Admin commands</gold>
    <yellow>/eacc admin view <player></yellow> <gray>- View accessories  (read-only)</gray>
    <yellow>/eacc admin edit <player></yellow> <gray>- Edit accessories  (online players only)</gray>
    <yellow>/eacc admin clear <player></yellow> <gray>- Clear accessories  (irreversible, logged)</gray>
    <yellow>/eacc admin save</yellow> <gray>- Save all accessory data now</gray>
  open_failed: "<red>Could not open the accessory window; check the GUI layout</red>"
  list_header: "<gold>Accessory slots</gold> <gray>page <white>%page%</white>, used <yellow>%used%</yellow> / <yellow>%max%</yellow></gray>"
  list_entry_filled: "<gray>- <white>%slot%</white> <green>equipped</green></gray>"
  list_entry_empty: "<gray>- <white>%slot%</white> <dark_gray>empty</dark_gray></gray>"
  pages_header: "<gold>Accessory pages</gold> <gray><yellow>%count%</yellow> total</gray>"
  pages_entry: "<gray>- <white>%page%</white> %name% <gray> (<yellow>%count%</yellow> item (s))</gray></gray>"
  pages_entry_enabled: "<gray>- <white>%page%</white> %name% <green>active</green> <gray> (<yellow>%count%</yellow> item (s))</gray></gray>"
  pages_entry_locked: "<gray>- <white>%page%</white> %name% <red>no permission</red> <gray> (<yellow>%count%</yellow> item (s), use retrieve)</gray></gray>"
  page_unknown: "<red>No such accessory page: <white>%page%</white></red>"
  page_no_permission: "<red>You cannot open accessory page <white>%page%</white>; use <white>/eacc retrieve %page%</white> to take its accessories back</red>"
  retrieve_usage: "<yellow>Usage: /eacc retrieve <page></yellow> <gray>takes back every accessory on that page, mainly for pages you cannot open</gray>"
  retrieve_done: "<green>Retrieved accessory page <white>%page%</white></green> <gray><yellow>%count%</yellow> item (s); anything that did not fit was dropped at your feet</gray>"
  retrieve_empty: "<yellow>Accessory page <white>%page%</white> holds no accessories</yellow>"
  retrieve_unknown_page: "<red>No such accessory page: <white>%page%</white></red>"
  retrieve_busy: "<red>Someone else is editing your accessories right now; try again shortly</red>"
  reload_done: "<green>Reload complete</green> <gray>slots <yellow>%slots%</yellow>, sets <yellow>%sets%</yellow>, issues <yellow>%issues%</yellow></gray>"
  # Command: reload elapsed hint; placeholders: %elapsed_ms%
  reload_elapsed: "<gray>Reload took <white>%elapsed_ms%ms</white></gray>"
  unknown_player: "<red>No such player: <white>%player%</white></red>"
  admin_target_offline: "<red>That player is offline; this operation needs them online</red>"
  admin_target_busy: "<red>Someone else is already editing that player's accessories</red>"
  admin_load_failed: "<red>Failed to load accessory data for <white>%player%</white></red>"
  admin_clear_done: "<green>Cleared <white>%player%</white>'s accessories</green> <gray><yellow>%count%</yellow> item (s)</gray>"
  admin_clear_failed: "<red>Could not clear <white>%player%</white>'s accessories; data may not be loaded</red>"
  admin_save_done: "<green>Saved <yellow>%count%</yellow> accessory record (s)</green>"
  debug_unavailable: "<red>Debug features are unavailable right now</red>"

