# EmakiAccessory 简体中文语言资源。
# 消息使用 MiniMessage；保留消息分组旁标明的占位符。
# version 由资源同步流程维护，用于合并新增默认键。
version: "1.1.2"

console:
  plugin_starting: "<gray>正在启动 EmakiAccessory...</gray>"
  plugin_started: "<green>EmakiAccessory 已启动</green>"
  plugin_stopped: "<yellow>EmakiAccessory 已停止</yellow>"
  bootstrap_start: "<gray>正在检查配置文件...</gray>"
  bootstrap_complete: "<green>默认文件检查完成。</green>"
  bootstrap_skip: "<yellow>已跳过默认数据写入。</yellow>"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "<yellow>复制默认资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>保存合并资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  default_file_missing: "<yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  directory_create_failed: "<yellow>创建目录失败: <red>%path%</red></yellow>"
  config_precheck_passed: "<gray>配置预检通过：<yellow>%issues%</yellow> 个提示。</gray>"
  config_precheck_failed: "<red>配置预检失败：<yellow>%issues%</yellow> 个问题。</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray>（%hint%）</dark_gray>"
    messages:
      passed: "EmakiAccessory 配置预检通过。"
      required_file_missing: "缺少必需文件。"
      path_not_file: "指定路径不是文件。"
      file_not_readable: "文件不可读。"
      required_directory_missing: "缺少必需目录。"
      path_not_directory: "指定路径不是目录。"
      directory_not_readable: "目录不可读。"

general:
  prefix: "<gray>[ <gradient:#F472B6:#C084FC>EmakiAccessory</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行这个操作</red>"
  players_only: "<red>这个命令只能由玩家执行</red>"
  data_loading: "<yellow>饰品数据还在加载，请稍后再试</yellow>"

gui:
  read_only: "<red>你只能查看，不能修改这些饰品</red>"
  orphan_read_only: "<yellow>这件饰品所在的槽位已被移除，只能取出</yellow>"
  orphan_hint: "<dark_gray>槽位已移除，取出后无法放回</dark_gray>"
  click_unsupported: "<red>饰品栏不支持这种点击方式</red>"
  transfer_unsupported: "<red>饰品栏不支持这种搬运方式，请逐格放取</red>"
  slot_mismatch: "<red>这件饰品只能戴在 <white>%required%</white>，放不进 <white>%slot%</white></red>"
  unique_conflict: "<red>你已经在同一页的 <white>%conflict%</white> 戴了同一件饰品</red>"
  page_enable_lore: "<dark_gray>点击将本页设为生效页</dark_gray>"
  page_enabled_lore: "<green>本页正在生效</green>"
  page_switch_lore: "<dark_gray>点击切换到 <white>%page%</white></dark_gray>"
  page_already_enabled: "<yellow>本页已经是生效页了</yellow>"
  page_unknown: "<red>找不到饰品页 <white>%page%</white></red>"
  page_no_permission: "<red>你没有权限使用饰品页 <white>%page%</white></red>"

command:
  help: |
    <gold>EmakiAccessory 指令</gold>
    <yellow>/eacc open [页]</yellow> <gray>- 打开饰品栏，不带页时打开生效页</gray>
    <yellow>/eacc list</yellow> <gray>- 列出生效页的饰品槽</gray>
    <yellow>/eacc pages</yellow> <gray>- 列出所有饰品页</gray>
    <yellow>/eacc retrieve <页></yellow> <gray>- 取回该页全部饰品，主要用于没有权限的页</gray>
    <yellow>/eacc reload</yellow> <gray>- 重载配置、部位、套装与饰品页</gray>
    <yellow>/eacc debug</yellow> <gray>- 调试开关</gray>
    <yellow>/eacc admin</yellow> <gray>- 管理指令</gray>
  admin_usage: |
    <gold>管理指令</gold>
    <yellow>/eacc admin view <玩家></yellow> <gray>- 查看饰品（只读）</gray>
    <yellow>/eacc admin edit <玩家></yellow> <gray>- 编辑饰品（仅在线玩家）</gray>
    <yellow>/eacc admin clear <玩家></yellow> <gray>- 清空饰品（不可撤销，会记入日志）</gray>
    <yellow>/eacc admin save</yellow> <gray>- 立刻保存所有饰品数据</gray>
  open_failed: "<red>无法打开饰品栏，请检查界面布局配置</red>"
  list_header: "<gold>饰品槽</gold> <gray>页 <white>%page%</white>，已用 <yellow>%used%</yellow> / <yellow>%max%</yellow></gray>"
  list_entry_filled: "<gray>- <white>%slot%</white> <green>已装备</green></gray>"
  list_entry_empty: "<gray>- <white>%slot%</white> <dark_gray>空</dark_gray></gray>"
  pages_header: "<gold>饰品页</gold> <gray>共 <yellow>%count%</yellow> 页</gray>"
  pages_entry: "<gray>- <white>%page%</white> %name% <gray>(<yellow>%count%</yellow> 件)</gray></gray>"
  pages_entry_enabled: "<gray>- <white>%page%</white> %name% <green>生效中</green> <gray>(<yellow>%count%</yellow> 件)</gray></gray>"
  pages_entry_locked: "<gray>- <white>%page%</white> %name% <red>无权限</red> <gray>(<yellow>%count%</yellow> 件，可用 retrieve 取回)</gray></gray>"
  page_unknown: "<red>找不到饰品页 <white>%page%</white></red>"
  page_no_permission: "<red>你没有权限打开饰品页 <white>%page%</white>，可用 <white>/eacc retrieve %page%</white> 取回其中饰品</red>"
  retrieve_usage: "<yellow>用法：/eacc retrieve <页></yellow> <gray>取回该页全部饰品，主要用于没有权限的页</gray>"
  retrieve_done: "<green>已取回饰品页 <white>%page%</white></green> <gray>共 <yellow>%count%</yellow> 件，背包放不下的已掉在脚下</gray>"
  retrieve_empty: "<yellow>饰品页 <white>%page%</white> 里没有饰品</yellow>"
  retrieve_unknown_page: "<red>找不到饰品页 <white>%page%</white></red>"
  retrieve_busy: "<red>正有其他人在编辑你的饰品，请稍后再试</red>"
  reload_done: "<green>重载完成</green> <gray>槽位 <yellow>%slots%</yellow>，套装 <yellow>%sets%</yellow>，问题 <yellow>%issues%</yellow></gray>"
  unknown_player: "<red>找不到玩家 <white>%player%</white></red>"
  admin_target_offline: "<red>该玩家不在线，无法执行这个操作</red>"
  admin_target_busy: "<red>已有其他人正在编辑这个玩家的饰品</red>"
  admin_load_failed: "<red>读取 <white>%player%</white> 的饰品数据失败</red>"
  admin_clear_done: "<green>已清空 <white>%player%</white> 的饰品</green> <gray>共 <yellow>%count%</yellow> 件</gray>"
  admin_clear_failed: "<red>清空 <white>%player%</white> 的饰品失败，数据可能未加载</red>"
  admin_save_done: "<green>已保存 <yellow>%count%</yellow> 份饰品数据</green>"
  debug_unavailable: "<red>调试功能当前不可用</red>"

