# EmakiAccessory 主配置

version: "1.1.3"

# 对应 lang/<language>.yml。
language: "zh_CN"

# 关闭后不释放缺失的内置数据文件。
release_default_data: true

# 仅在 keepInventory 未启用时允许死亡掉落饰品。
drop_on_death: false

# 优先按 EmakiItem 定义 ID 去重；依赖不可用时回退到原版材质。
unique: true

# ============================================================
# 穿戴槽位声明来源
# ============================================================
# EmakiAttribute active_slot 与 EmakiSkills 技能载荷始终参与；
# 下列来源在此基础上取并集，任一来源命中即允许穿戴。
slot_sources:
  # 从物品 PDC 追加槽位列表。
  pdc:
    enabled: false

    # 完整 NamespacedKey，不改写大小写；先读字符串列表，再按 separator 拆分单字符串。
    key: ""

  # 从物品 Lore 追加槽位列表。
  lore:
    enabled: false

    # 捕获组 1 按 separator 拆分；匹配前去除 MiniMessage 标签并折叠空白。
    # 无效正则仅跳过当前项。
    patterns:
      - "^穿戴部位[:：]\\s*(.+)$"

    # 同时用于 PDC 单字符串回退。
    separator: ","

    # 将 Lore 名称映射到 parts.yml 部位 ID；未列值规范化后原样使用。
    aliases:
      "戒指": "ring"
      "项链": "necklace"
      "腰带": "belt"
      "护符": "charm"

# ============================================================
# 饰品耐久度
# ============================================================
# 关闭时饰品永不扣除耐久度，物品自带的耐久组合同样保持不变。
# 开启后只有「生效页」上的饰品参与扣除，且需要物品本身带耐久上限（max_damage 组件，
# 或材质自带耐久），并按 parts.yml 的部位开关决定是否允许扣除。
# 耐久扣满后该饰品属性、技能与套装件数全部停止生效，物品保留在槽内，
# 可在 GUI 中看到「耐久已耗尽」标识；取出后用 EmakiItem 修复台恢复耐久即可重新生效。
durability:
  # 功能开关；默认关闭。
  enabled: false

  # 玩家每次受到伤害时，每个允许扣除的饰品扣除的耐久度点数；最小 1。
  damage_per_hit: 1

# ============================================================
# 持久化
# ============================================================
persistence:
  # 自动保存间隔，单位：秒；0 或负数仅关闭定时保存，其他保存时机仍生效。
  autosave_seconds: 60

  # 停服等待未完成写入的上限，单位：秒；超时后继续停服并告警。
  drain_timeout_seconds: 10
