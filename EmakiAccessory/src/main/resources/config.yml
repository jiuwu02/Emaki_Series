# EmakiAccessory 主配置
#
# 仅修改明确了解的选项；本文件只控制饰品规则与持久化参数。
# 修改后按插件提供的重载命令应用。
# 文件位置：plugins/EmakiAccessory/config.yml

# version 是配置结构标记，由项目资源同步流程维护，不是功能开关。
version: "1.0.2"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放插件内置的默认数据文件。
# 关闭后只保留已有数据，不主动生成缺失的默认示例。
release_default_data: true

# 是否允许饰品随玩家死亡掉落。
# 仅当本项为 true 且死亡事件未启用 keepInventory 时生效；否则饰品会保留。
drop_on_death: false

# 是否禁止同时装备两个身份相同的饰品。
# 优先按 EmakiItem 定义 ID 判定；EmakiItem 不可用时回退到原版材质判定。
unique: true

# ============================================================
# 持久化
# ============================================================
persistence:
  # 自动保存间隔，单位：秒；设为 0 或负数时关闭定时保存。
  # 关闭定时保存后，仍会在窗口关闭、玩家退出和服务器停用流程中保存。
  autosave_seconds: 60

  # 服务器停用时等待未完成写入的最长时间，单位：秒。
  # 超时后继续停用流程，并保留未完成写入的告警。
  drain_timeout_seconds: 10
