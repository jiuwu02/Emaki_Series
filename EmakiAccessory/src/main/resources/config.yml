# EmakiAccessory 主配置
#
# 仅修改明确了解的选项；本文件只控制饰品规则与持久化参数。
# 修改后按插件提供的重载命令应用。
# 文件位置：plugins/EmakiAccessory/config.yml

# version 是配置结构标记，由项目资源同步流程维护，不是功能开关。
version: "1.0.3"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放插件内置的默认数据文件。
# 关闭后只保留已有数据，不主动生成缺失的默认示例。
release_default_data: true

# 是否允许饰品随玩家死亡掉落。
# 仅当本项为 true 且死亡事件未启用 keepInventory 时生效；否则饰品会保留。
drop_on_death: false

# 是否禁止同时装备两个身份相同的饰品。
# 优先按 EmakiItem 定义 ID 判定；EmakiItem 不可用时回退到原版材质判定。
unique: true

# ============================================================
# 穿戴槽位声明来源
# ============================================================
#
# 一件饰品声明"我能戴在哪些槽位"的额外读取来源。
# EmakiAttribute 的 active_slot 与 EmakiSkills 的技能载荷始终生效，
# 下面两项是在此之上追加的来源，四个来源取并集：任一命中即允许穿戴。
# 都关闭时行为与旧版完全一致。
slot_sources:
  # 从物品的 PDC 读取槽位列表，用于对接第三方插件写入的键。
  pdc:
    enabled: false

    # NamespacedKey 全写，逐字使用服主填写的值，不做大小写改写。
    # 优先按字符串列表读取；读不到时回退为单个字符串并按 separator 切分。
    key: ""

  # 从物品 Lore 用正则读取槽位列表。
  lore:
    enabled: false

    # 每条正则的捕获组 1 是槽位列表文本，按 separator 切分。
    # 匹配前会去除 MiniMessage 标签并折叠空白，写正则时按纯文本书写。
    # 正则写错只记录警告并跳过该条，不影响其他功能。
    patterns:
      - "^穿戴部位[:：]\\s*(.+)$"

    # 槽位列表的分隔符，同时用于 pdc 的字符串回退分支。
    separator: ","

    # Lore 里的中文名到 parts.yml 部位 id 的映射。
    # 部位 id 只能是小写字母、数字和下划线，所以中文槽位名必须在这里转换。
    # 未列出的值按原样规范化后使用。
    aliases:
      "戒指": "ring"
      "项链": "necklace"
      "腰带": "belt"
      "护符": "charm"

# ============================================================
# 持久化
# ============================================================
persistence:
  # 自动保存间隔，单位：秒；设为 0 或负数时关闭定时保存。
  # 关闭定时保存后，仍会在窗口关闭、玩家退出和服务器停用流程中保存。
  autosave_seconds: 60

  # 服务器停用时等待未完成写入的最长时间，单位：秒。
  # 超时后继续停用流程，并保留未完成写入的告警。
  drain_timeout_seconds: 10
