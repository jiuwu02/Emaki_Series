# EmakiAccessory - 饰品栏
#
# 本文件的 version 必须与插件版本保持一致，插件会按 version 合并新增的默认键。
version: "1.0.0"

# 语言文件名，对应 lang/<language>.yml
language: "zh_CN"

# 首次启动时是否释放示例数据（parts.yml、sets/ 下的示例文件）。
# 改为 false 后，已存在的文件不会被覆盖，也不会再补齐缺失的示例。
release_default_data: true

# 死亡时是否掉落饰品。
#
# 为 true 时饰品会被追加到死亡掉落列表里，交给原版死亡流程处理，
# 而不是塞回背包 —— 后者会让同一件饰品同时存在于掉落物和背包中。
# 其他插件已经开启 keepInventory 时本项不生效，饰品一律保留。
drop_on_death: false

# 是否禁止同时装备两件相同饰品。
#
# 判定依据是 EmakiItem 的物品定义 id，不是材质：同一个定义的两件饰品
# 即使等级或词条不同也算重复。缺少 EmakiItem 时本项自动失效
# （没有定义 id 就无法判断"相同"，按材质判定会误伤）。
unique: true

# ---------------------------------------------------------------------------
# 持久化
# ---------------------------------------------------------------------------
persistence:
  # 自动保存间隔（秒）。设为 0 或负数关闭定时保存，
  # 此时仅在关闭窗口、玩家退出和服务器关服时落盘。
  autosave_seconds: 60

  # 关服时等待未落盘写入完成的秒数。
  #
  # 超时后会打印剩余脏数据条数并继续关服，不会无限等待卡住服务器关闭流程。
  drain_timeout_seconds: 10
