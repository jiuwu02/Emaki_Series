# EmakiAccessory 饰品部位定义
# count 展开为 <部位ID>_<从1开始的序号>。
# 部位 ID 仅允许小写字母、数字和下划线，且不能以 _<数字> 结尾；非法 ID 被拒绝。
# 每个实例都需在 GUI 中以同名 accessory_slot 摆放，否则不可用。
# 缩减 count 或删除部位会保留数据，并由 orphan_slot 提供一次性取回。
parts:
  necklace:
    count: 1
    display_name: "<gold>项链</gold>"
    icon: "LIGHT_GRAY_STAINED_GLASS_PANE"

  ring:
    count: 2
    display_name: "<gold>戒指</gold>"
    icon: "LIGHT_GRAY_STAINED_GLASS_PANE"

  belt:
    count: 1
    display_name: "<gold>腰带</gold>"
    icon: "LIGHT_GRAY_STAINED_GLASS_PANE"

  charm:
    count: 2
    display_name: "<gold>护符</gold>"
    icon: "LIGHT_GRAY_STAINED_GLASS_PANE"
