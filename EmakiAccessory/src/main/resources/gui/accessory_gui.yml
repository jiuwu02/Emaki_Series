# ============================================================
# EmakiAccessory 饰品栏界面布局
# ============================================================
# accessory_slot 必须显式声明；键名为 <部位ID>_<从1开始的序号>，并对应 parts.yml 的 count。
# 未声明 type 的格子仅作装饰；同一 accessory_slot 占多格时仅首格生效。
# orphan_slot 只接收当前页已移除槽位的饰品，且只能取出；其他页不参与判定。
# 缺少 orphan_slot 不会删除数据，但玩家只能通过 /eacc retrieve 或恢复配置取回。
# page_enable 将当前页设为唯一生效页；page_switch 的键名必须是目标 page_id。
# parts.yml 中未摆放的槽位不可用并记录警告。
# ============================================================
id: "accessory_gui"
gui_type: CHEST
title: "<dark_gray>饰品栏</dark_gray>"
rows: 6

slots:
  frame:
    slots: "2-7,45-53"
    item:
      source: "black_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  necklace_1:
    slots: [13]
    type: "accessory_slot"
    item:
      source: "light_gray_stained_glass_pane"
      components:
        custom_name: "<gray>项链</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  ring_1:
    slots: [21]
    type: "accessory_slot"
    item:
      source: "light_gray_stained_glass_pane"
      components:
        custom_name: "<gray>戒指</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  ring_2:
    slots: [23]
    type: "accessory_slot"
    item:
      source: "light_gray_stained_glass_pane"
      components:
        custom_name: "<gray>戒指</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  belt_1:
    slots: [22]
    type: "accessory_slot"
    item:
      source: "light_gray_stained_glass_pane"
      components:
        custom_name: "<gray>腰带</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  charm_1:
    slots: [30]
    type: "accessory_slot"
    item:
      source: "light_gray_stained_glass_pane"
      components:
        custom_name: "<gray>护符</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  charm_2:
    slots: [32]
    type: "accessory_slot"
    item:
      source: "light_gray_stained_glass_pane"
      components:
        custom_name: "<gray>护符</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  page_enable:
    slots: [8]
    type: "page_enable"
    item:
      source: "lime_dye"

  main:
    slots: [0]
    type: "page_switch"
    item:
      source: "gold_ingot"

  secondary:
    slots: [1]
    type: "page_switch"
    item:
      source: "iron_ingot"

  orphan:
    slots: "37-43"
    type: "orphan_slot"
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true
