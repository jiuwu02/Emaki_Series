# EmakiAccessory 饰品栏界面布局
#
# 重要：饰品格必须显式写 type: "accessory_slot"，不写 type 的格子只是纯装饰。
#
# 可用的 type：
#   accessory_slot - 饰品格。键名必须等于槽位实例 id，格式为 <部位id>_<序号>，
#                    序号从 1 开始，与 parts.yml 里该部位的 count 对应。
#                    例如 ring 部位 count: 2 就要摆放 ring_1 和 ring_2 两格。
#   orphan_slot    - 孤儿格。parts.yml 缩减部位数量后，被裁掉的槽位里的饰品
#                    会显示在这里供玩家取回，取走后不能再放回。
#                    不摆放孤儿格也不会丢东西：数据仍在文件里，
#                    但玩家没有取回入口，只能靠管理员或改回配置。
#
# 每个 accessory_slot 只能占一格。写成多格时只有第一格生效，其余会记录警告。
# parts.yml 里声明了但这里没摆放的槽位同样会记录警告，且玩家无法使用该槽位。
id: "accessory_gui"
gui_type: CHEST
title: "<dark_gray>饰品栏</dark_gray>"
rows: 6

slots:
  frame:
    slots: "0-8,45-53"
    item:
      source: "BLACK_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  necklace_1:
    slots: [13]
    type: "accessory_slot"
    item:
      source: "LIGHT_GRAY_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>项链</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  ring_1:
    slots: [21]
    type: "accessory_slot"
    item:
      source: "LIGHT_GRAY_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>戒指</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  ring_2:
    slots: [23]
    type: "accessory_slot"
    item:
      source: "LIGHT_GRAY_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>戒指</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  belt_1:
    slots: [22]
    type: "accessory_slot"
    item:
      source: "LIGHT_GRAY_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>腰带</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  charm_1:
    slots: [30]
    type: "accessory_slot"
    item:
      source: "LIGHT_GRAY_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>护符</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  charm_2:
    slots: [32]
    type: "accessory_slot"
    item:
      source: "LIGHT_GRAY_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>护符</gray>"
        lore:
          - "<dark_gray>放入饰品以生效</dark_gray>"

  orphan:
    slots: "37-43"
    type: "orphan_slot"
    item:
      source: "GRAY_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true
