# ============================================================
# EmakiAccessory 饰品页示例 - 收藏饰品页
# ============================================================
# 演示功能: 第二页示例，演示「不同部位组合 + 页面权限限制」。
# 可达方式: gui/accessory_gui.yml 中已补充键名为 example_collection 的 page_switch 格。
#           本页设置了 permission，玩家没有该权限时切页会被拒绝。
# 依赖模块: EmakiAccessory (本模块)；部位来自 parts.yml，布局来自 gui_template。
# 权限节点: emakiaccessory.page.example_collection（示例节点，需由权限插件授予）。
# ============================================================
page_id: "example_collection"
display_name: "<light_purple>收藏饰品页</light_purple>"

order: 4

gui_template: "accessory_gui"
permission: "emakiaccessory.page.example_collection"

# 与 main / secondary 不同的部位组合，只启用腰带与护符。
parts:
  - "belt"
  - "charm"
