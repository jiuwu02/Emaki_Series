# ============================================================
# EmakiAttribute 主配置文件
# ============================================================
# 此文件包含插件的全局设置。修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiAttribute/config.yml
# ============================================================

# 属性系统主配置
# version 由资源同步维护
version: "4.1.0"

# 语言文件 ID
language: zh_CN

# 是否接管未命中白名单的原版伤害
# true 时，所有原版伤害都会进入 EA 结算；未命中的环境伤害会回退到默认伤害类型
# false 时，只有白名单中的伤害原因会进入 EA
hard_lock_damage: true

# 默认伤害类型 ID
default_damage_type: physical

# 资源自然回复间隔，单位 tick
regen_interval_ticks: 20

# 属性同步到 Bukkit 的延迟，单位 tick
sync_delay_ticks: 1

# 默认属性与资源基础值
default_profile:
  resources:
    health:
      display_name: "生命值"
      default_max: 20.0
      min_max: 1.0
      max_max: 2048.0
      sync_to_bukkit: true
      full_on_init: true
    mana:
      display_name: "法力值"
      default_max: 100.0
      min_max: 0.0
      max_max: 99999.0
      sync_to_bukkit: false
      full_on_init: true
  attributes:
    physical_attack: 0.0
    physical_defense: 0.0
    physical_damage_bonus: 0.0
    physical_crit_rate: 0.0
    physical_crit_damage: 150.0
    projectile_attack: 0.0
    projectile_damage_bonus: 0.0
    projectile_crit_rate: 0.0
    projectile_crit_damage: 0.0
    projectile_defense: 0.0
    spell_attack: 0.0
    spell_damage_bonus: 0.0
    spell_crit_rate: 0.0
    spell_crit_damage: 0.0
    spell_defense: 0.0
    health_regen: 0.1
    mana_regen: 0.1

synthetic_hit_feedback:
  # 接管原版伤害后，是否补发击退和受伤音效
  knockback: true
  knockback_strength: 0.4
  hurt_sound: true

# ============================================================
# 属性衰减曲线（Scaling Curves）
# ============================================================
# 当属性值超过阈值时，超出部分按衰减函数折算，防止数值无限膨胀。
# 每个条目定义一个属性的衰减规则:
#   attribute: 属性 ID
#   threshold: 衰减起始阈值（低于此值不受影响）
#   curve_type: 衰减函数类型
#     - "logarithmic": 对数衰减（推荐，平滑且直觉）
#     - "sqrt": 平方根衰减（比对数更激进）
#     - "piecewise_linear": 线性折扣（超出部分乘以 factor）
#   factor: 衰减系数
#     - logarithmic/sqrt: 控制曲线陡峭程度（越大越平缓）
#     - piecewise_linear: 超出部分的保留比例（如 0.5 = 保留 50%）
#
# 示例: 物理攻击超过 500 后对数衰减
# scaling_curves:
#   physical_attack_cap:
#     attribute: "physical_attack"
#     threshold: 500
#     curve_type: "logarithmic"
#     factor: 100
#   physical_defense_cap:
#     attribute: "physical_defense"
#     threshold: 400
#     curve_type: "sqrt"
#     factor: 80
#   crit_rate_cap:
#     attribute: "physical_crit_rate"
#     threshold: 80
#     curve_type: "piecewise_linear"
#     factor: 0.3
scaling_curves: {}

# 允许进入 EA 结算的 DamageCause 白名单
# cause: Bukkit DamageCause
# damage_type: 对应 damage_types/ 下的伤害类型 ID
# damage: 可选；留空时直接使用服务端已经计算好的原版事件伤害。
#         适合摔落、接触、爆炸、燃烧、溺水、虚空、荆棘、龙息、音爆等
#         会随高度、状态或持续叠加变化的来源。
allowed_damage_causes:
  - cause: CONTACT
    damage_type: physical
    enabled: true
  - cause: SUFFOCATION
    damage_type: physical
    enabled: true
  - cause: FALL
