# ============================================================
# EmakiAttribute 主配置文件
# ============================================================
# 此文件包含插件的全局设置。修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiAttribute/config.yml
# ============================================================

# 属性系统主配置
# version 由资源同步维护
version: "4.5.11"

# 语言文件 ID
language: zh_CN

# 是否释放内置示例资源。
# false 时不会自动生成属性、伤害类型、读取规则、词条格式、平衡系数与脚本示例等默认数据。
release_default_data: true

# 物品属性来源策略。
# read_lore_attributes: 是否解析物品 Lore 中的属性词条。
# read_pdc_attributes: 是否读取 EmakiAttribute PDC 属性。
# require_lore_pdc_match: 开启后按属性 ID 逐项要求 Lore 与 PDC 同时存在且数值一致；
#                         一致时仅计入一次，不一致或仅单侧存在时该属性失效。
#                         默认 false，保持 Lore 与 PDC 同 key 相加的既有行为。
attribute_sources:
  read_lore_attributes: true
  read_pdc_attributes: true
  require_lore_pdc_match: false

# 是否接管未命中白名单的原版伤害
# true 时，所有原版伤害都会进入 EA 结算；未命中的环境伤害会回退到默认伤害类型
# false 时，只有白名单或 vanilla_event_damage.enabled 接管的伤害原因会进入 EA
hard_lock_damage: true

# 默认伤害类型 ID
default_damage_type: physical

# 投射物默认伤害类型 ID。
# 弓箭、弩箭、三叉戟等投射物发射时会缓存攻击者当前属性快照，命中时按这里配置的伤害类型结算。
# projectile：使用 projectile_attack / projectile_damage_bonus / projectile_crit_* 等投射物属性。
# physical：使用 physical_attack / physical_damage_bonus / physical_crit_* 等物理属性。
projectile_damage_type: projectile

# 原版事件伤害接管
# enabled: true 时启用「完美接管」——不取消原版伤害事件，只把最终伤害数值替换为 EA 结算值，
#          屏蔽原版护甲/抗性/魔法减伤、保留吸收之心与举盾格挡，原版副作用照常触发
#          （着火僵尸点燃玩家、铁傀儡命中击飞、僵尸击退铁傀儡、荆棘、冻结、盾反等）。
#          此时未在 allowed_damage_causes 中单独配置的原版伤害也会进入 EA 结算。
# enabled: false 时使用「兼容模式」——取消原版事件后由 EA 合成重新施加伤害（含合成击退/受伤音效），
#          只有 allowed_damage_causes 白名单内的伤害原因进入 EA；该模式下原版副作用可能缺失。
# damage_type: 这些未单独映射的原版伤害统一使用的 EA 伤害类型。
#          base_damage 会直接使用 Bukkit 事件里的原版伤害值，适合让原版物品、原版生物也有基础伤害。
vanilla_event_damage:
  enabled: true
  damage_type: physical

# 资源自然回复间隔，单位 tick
regen_interval_ticks: 20

# 属性同步到 Bukkit 的延迟，单位 tick
sync_delay_ticks: 1

# 客户端血量显示压缩。
# enabled: true 时仅缩放玩家客户端血量条显示，不改变真实最大生命值、不改变实际生命值与伤害结算。
# target: 客户端显示目标血量；20 表示最多显示为 20 血（即一排红心）。
health_display_scaling:
  enabled: false
  target: 20.0

# 默认属性与资源基础值
default_profile:
  resources:
    health:
      display_name: "生命值"
      default_max: 20.0
      min_max: 1.0
      max_max: 2048.0
      sync_to_bukkit: true
      full_on_init: true
    mana:
      display_name: "法力值"
      default_max: 100.0
      min_max: 0.0
      max_max: 99999.0
      sync_to_bukkit: false
      full_on_init: true
  attributes:
    physical_attack: 0.0
    physical_defense: 0.0
    physical_damage_bonus: 0.0
    physical_crit_rate: 0.0
    physical_crit_damage: 150.0
    projectile_attack: 0.0
    projectile_damage_bonus: 0.0
    projectile_crit_rate: 0.0
    projectile_crit_damage: 0.0
    projectile_defense: 0.0
    spell_attack: 0.0
    spell_damage_bonus: 0.0
    spell_crit_rate: 0.0
    spell_crit_damage: 0.0
    spell_defense: 0.0
    health_regen: 0.1
    mana_regen: 0.1

synthetic_hit_feedback:
  # 仅在兼容模式（vanilla_event_damage.enabled = false）下生效：
  # 取消原版事件并合成施加伤害后，是否补发击退和受伤音效。
  # 完美接管模式（enabled = true）下原版自身已处理击退与受伤反馈，这些设置不参与。
  knockback: true
  knockback_strength: 0.4
  hurt_sound: true

# ============================================================
# 属性衰减曲线（Scaling Curves）
# ============================================================
# 当属性值超过阈值时，超出部分按衰减函数折算，防止数值无限膨胀。
# 每个条目定义一个属性的衰减规则:
#   attribute: 属性 ID
#   threshold: 衰减起始阈值（低于此值不受影响）
#   curve_type: 衰减函数类型
#     - "logarithmic": 对数衰减（推荐，平滑且直觉）
#     - "sqrt": 平方根衰减（比对数更激进）
#     - "piecewise_linear": 线性折扣（超出部分乘以 factor）
#   factor: 衰减系数
#     - logarithmic/sqrt: 控制曲线陡峭程度（越大越平缓）
#     - piecewise_linear: 超出部分的保留比例（如 0.5 = 保留 50%）
#
# 示例: 物理攻击超过 500 后对数衰减
# scaling_curves:
#   physical_attack_cap:
#     attribute: "physical_attack"
#     threshold: 500
#     curve_type: "logarithmic"
#     factor: 100
#   physical_defense_cap:
#     attribute: "physical_defense"
#     threshold: 400
#     curve_type: "sqrt"
#     factor: 80
#   crit_rate_cap:
#     attribute: "physical_crit_rate"
#     threshold: 80
#     curve_type: "piecewise_linear"
#     factor: 0.3
scaling_curves: {}

# 允许进入 EA 结算的 DamageCause 白名单
# cause: Bukkit DamageCause
# damage_type: 对应 damage_types/ 下的伤害类型 ID
# damage: 可选；留空时直接使用服务端已经计算好的原版事件伤害。
#         适合摔落、接触、爆炸、燃烧、溺水、虚空、荆棘、龙息、音爆等
#         会随高度、状态或持续叠加变化的来源。
allowed_damage_causes:
  - cause: ENTITY_ATTACK
    damage_type: physical
    enabled: true
  - cause: ENTITY_SWEEP_ATTACK
    damage_type: physical
    enabled: true
