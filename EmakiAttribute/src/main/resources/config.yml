# ============================================================
# EmakiAttribute 主配置文件
# ============================================================
# 此文件包含插件的全局设置。修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiAttribute/config.yml
# ============================================================

# 属性系统主配置
# version 由资源同步维护
version: "4.6.3"

# 语言文件 ID
language: zh_CN

# 是否释放内置示例资源。
# false 时不会自动生成属性、伤害类型、读取规则、词条格式、平衡系数与脚本示例等默认数据。
release_default_data: true

# 物品属性来源策略。
# read_lore_attributes: 是否解析物品 Lore 中的属性词条。
# read_pdc_attributes: 是否读取 EmakiAttribute PDC 属性。
# require_lore_pdc_match: 开启后按属性 ID 逐项要求 Lore 与 PDC 同时存在且数值一致；
#                         一致时仅计入一次，不一致或仅单侧存在时该属性失效。
#                         默认 false，保持 Lore 与 PDC 同 key 相加的既有行为。
attribute_sources:
  read_lore_attributes: true
  read_pdc_attributes: true
  require_lore_pdc_match: false

# 是否接管未命中白名单的原版伤害
# true 时，所有原版伤害都会进入 EA 结算；未命中的环境伤害会回退到默认伤害类型
# false 时，只有白名单或 vanilla_event_damage.enabled 接管的伤害原因会进入 EA
hard_lock_damage: true

# 默认伤害类型 ID
default_damage_type: physical

# 投射物默认伤害类型 ID。
# 弓箭、弩箭、三叉戟等投射物发射时会缓存攻击者当前属性快照，命中时按这里配置的伤害类型结算。
# projectile：使用 projectile_attack / projectile_damage_bonus / projectile_crit_* 等投射物属性。
# physical：使用 physical_attack / physical_damage_bonus / physical_crit_* 等物理属性。
projectile_damage_type: projectile

# 原版事件伤害接管
# enabled: true 时启用「完美接管」——不取消原版伤害事件，只把最终伤害数值替换为 EA 结算值，
#          屏蔽原版护甲/抗性/魔法减伤、保留吸收之心与举盾格挡，原版副作用照常触发
#          （着火僵尸点燃玩家、铁傀儡命中击飞、僵尸击退铁傀儡、荆棘、冻结、盾反等）。
#          此时未在 allowed_damage_causes 中单独配置的原版伤害也会进入 EA 结算。
# enabled: false 时使用「兼容模式」——取消原版事件后由 EA 合成重新施加伤害（含合成击退/受伤音效），
#          只有 allowed_damage_causes 白名单内的伤害原因进入 EA；该模式下原版副作用可能缺失。
# damage_type: 这些未单独映射的原版伤害统一使用的 EA 伤害类型。
#          base_damage 会直接使用 Bukkit 事件里的原版伤害值，适合让原版物品、原版生物也有基础伤害。
vanilla_event_damage:
  enabled: true
  damage_type: physical

# 同批次攻击无视目标受伤间隔
# enabled: true 时，同一攻击者在同一属性快照签名与同一伤害类型下产生的多段攻击
#          （多重射击三箭、同一批多投射物、同签名连续命中等）互相不受原版受伤间隔限制，
#          每一段都按 EA 结算值完整掉血；不同攻击者、换手后属性变化、不同伤害类型不共享批次。
# window_ms: 批次有效时间窗，单位毫秒；超过该时间的同签名攻击视为新一轮攻击，重新受受伤间隔限制。
same_signature_ignores_invulnerability:
  enabled: true
  window_ms: 500

# 攻速冷却应用范围
# global：所有攻击都由 EA 接管攻速冷却。物品未写 EA 攻速属性时，
#         按原版当前 ATTACK_SPEED 换算冷却（原版钻石剑 1.6 → 约 13 tick），
#         由 EA 负责拦截过快的攻击。
# attribute_only：只有 Lore/PDC 明确写了 EA 攻速属性（attack_speed 等 GENERIC 攻速属性）
#         的物品才由 EA 拦截；其余物品完全交还原版攻速机制，EA 既不写冷却也不拦截。
#         注意：从 EA 攻速武器换到原版武器时，上一次写入的冷却仍会拦下换手后的第一次攻击。
attack_speed:
  scope: global

# 资源自然回复间隔，单位 tick
regen_interval_ticks: 20

# 属性同步到 Bukkit 的延迟，单位 tick
sync_delay_ticks: 1

# 客户端血量显示压缩。
# enabled: true 时仅缩放玩家客户端血量条显示，不改变真实最大生命值、不改变实际生命值与伤害结算。
# target: 客户端显示目标血量；20 表示最多显示为 20 血（即一排红心）。
health_display_scaling:
  enabled: false
  target: 20.0

# 默认属性与资源基础值
default_profile:
  resources:
    health:
      display_name: "生命值"
      default_max: 20.0
      min_max: 1.0
      max_max: 2048.0
      sync_to_bukkit: true
      full_on_init: true
    mana:
      display_name: "法力值"
      default_max: 100.0
      min_max: 0.0
      max_max: 99999.0
      sync_to_bukkit: false
      full_on_init: true
  attributes:
    physical_attack: 0.0
    physical_defense: 0.0
    physical_damage_bonus: 0.0
    physical_crit_rate: 0.0
    physical_crit_damage: 150.0
    projectile_attack: 0.0
    projectile_damage_bonus: 0.0
    projectile_crit_rate: 0.0
    projectile_crit_damage: 0.0
    projectile_defense: 0.0
    spell_attack: 0.0
    spell_damage_bonus: 0.0
    spell_crit_rate: 0.0
    spell_crit_damage: 0.0
    spell_defense: 0.0
    health_regen: 0.1
    mana_regen: 0.1

synthetic_hit_feedback:
  # 仅在兼容模式（vanilla_event_damage.enabled = false）下生效：
  # 取消原版事件并合成施加伤害后，是否补发击退和受伤音效。
  # 完美接管模式（enabled = true）下原版自身已处理击退与受伤反馈，这些设置不参与。
  knockback: true
  knockback_strength: 0.4
  hurt_sound: true

# 伤害飘字
# 用展示实体在目标上方显示伤害数字，覆盖普通攻击、暴击、生命恢复与闪避。
# 渲染后端由 EmakiCoreLib 的 display.backend 决定，可见范围随后端而不同：
#   packet 后端 - 只有下方 visible_to 指定的相关玩家能看到。
#   bukkit 后端 - 飘字是真实体，附近所有玩家都能看到，visible_to 不生效。
damage_indicator:
  enabled: true
  # 同一目标在该窗口(毫秒)内的多次伤害会累加合并为一个飘字。
  # 与 same_signature_ignores_invulnerability.window_ms 保持一致时，
  # 多重射击的多段命中会显示为一个总伤害而不是一堆数字。0 表示不合并。
  # 窗口内再次命中会让飘字从起点重新抛出。
  merge_window_ms: 500
  # 同一目标每秒最多生成的飘字数，用于抑制 AOE 群伤刷屏。0 表示不限制。
  max_per_target_per_second: 4
  # 可见对象，仅 packet 后端生效：
  #   involved - 仅攻击者与受击者可见(默认)
  #   all      - 附近所有玩家可见
  visible_to: "involved"
  # 不显示飘字的伤害原因。持续伤害每 tick 都会结算，默认全部屏蔽。
  ignored_causes:
    - FIRE_TICK
    - POISON
    - WITHER
    - DROWNING
    - FREEZE
    - SUFFOCATION
    - STARVATION

  # --- 以下为全部触发器的默认表现，可在 triggers.<名称> 下逐键覆盖 ---

  # 飘字存活时长(tick)，同时是一次抛物运动的总时长。
  # 到期由 CoreLib 展示实体服务自动回收。
  lifetime_ticks: 24
  spawn:
    # 相对目标脚部的固定偏移(格)。
    offset:
      x: 0.0
      y: 2.0
      z: 0.0
    # 各轴的随机散布范围(格)，实际取 ±该值，避免同位置飘字完全重叠。0 表示该轴不散布。
    random_offset:
      x: 0.4
      y: 0.15
      z: 0.4
  # 抛物运动。轨迹为 p(t) = v·t + ½·a·t²，由客户端插值渲染，
  # 飘字实体本身不移动，因此不产生传送开销。
  motion:
    enabled: true
    # 关键帧间隔(tick)，同时是客户端插值时长。1 最平滑，值越大包越少、折线感越强。
    step_ticks: 2
    # 抛出初速度(格/tick)。
    speed: 0.30
    # 竖直加速度(格/tick²)，负值下坠。这一项决定抛物线的弯曲程度。
    gravity: -0.030
    direction:
      # 抛出方向模式：
      #   random             - 按下面的 pitch/yaw 区间随机
      #   fixed              - 使用 fixed 指定的向量
      #   away_from_attacker - 沿攻击者到目标的水平方向抛出并叠加 pitch 仰角；
      #                        无攻击者时退化为 random
      mode: "random"
      fixed:
        x: 0.0
        y: 1.0
        z: 0.0
      # 仰角区间(度)，90 为正上方。
      pitch:
        min: 55.0
        max: 85.0
      # 水平角区间(度)。
      yaw:
        min: -180.0
        max: 180.0
    # 出场放大与退场缩小，与位移共用同一条插值通道。
    scale:
      # 出场起始缩放，前 pop_ticks 内线性放大到 1.0。
      pop_from: 0.6
      pop_ticks: 3
      # 退场目标缩放，最后 shrink_ticks 内从 1.0 线性缩到该值。0 表示缩到不可见。
      shrink_to: 0.0
      shrink_ticks: 6

  # 四个触发器。每个触发器可只写需要改的键，未写的键继承上面的默认值。
  # 注意 dodge 还需要闪避判定本身被启用；原版战斗默认不进行闪避判定。
  triggers:
    normal:
      enabled: true
    critical:
      enabled: true
      # 暴击抛得更高更快，并从更小的尺寸弹出以强调打击感。
      motion:
        speed: 0.42
        gravity: -0.036
        scale:
          pop_from: 0.35
          pop_ticks: 4
    heal:
      enabled: true
      # 治疗改为垂直缓慢上浮。
      motion:
        speed: 0.16
        gravity: -0.004
        direction:
          mode: "fixed"
          fixed:
            x: 0.0
            y: 1.0
            z: 0.0
    dodge:
      enabled: true
      motion:
        speed: 0.20
        gravity: -0.016

# ============================================================
# 属性衰减曲线（Scaling Curves）
# ============================================================
# 当属性值超过阈值时，超出部分按衰减函数折算，防止数值无限膨胀。
# 每个条目定义一个属性的衰减规则:
#   attribute: 属性 ID
#   threshold: 衰减起始阈值（低于此值不受影响）
#   curve_type: 衰减函数类型
#     - "logarithmic": 对数衰减（推荐，平滑且直觉）
#     - "sqrt": 平方根衰减（比对数更激进）
#     - "piecewise_linear": 线性折扣（超出部分乘以 factor）
#   factor: 衰减系数
#     - logarithmic/sqrt: 控制曲线陡峭程度（越大越平缓）
#     - piecewise_linear: 超出部分的保留比例（如 0.5 = 保留 50%）
#
# 示例: 物理攻击超过 500 后对数衰减
# scaling_curves:
#   physical_attack_cap:
#     attribute: "physical_attack"
#     threshold: 500
#     curve_type: "logarithmic"
#     factor: 100
#   physical_defense_cap:
#     attribute: "physical_defense"
#     threshold: 400
#     curve_type: "sqrt"
#     factor: 80
#   crit_rate_cap:
#     attribute: "physical_crit_rate"
#     threshold: 80
#     curve_type: "piecewise_linear"
#     factor: 0.3
scaling_curves: {}

# 允许进入 EA 结算的 DamageCause 白名单
# cause: Bukkit DamageCause
# damage_type: 对应 damage_types/ 下的伤害类型 ID
# damage: 可选；留空时直接使用服务端已经计算好的原版事件伤害。
#         适合摔落、接触、爆炸、燃烧、溺水、虚空、荆棘、龙息、音爆等
#         会随高度、状态或持续叠加变化的来源。
allowed_damage_causes:
  - cause: ENTITY_ATTACK
    damage_type: physical
    enabled: true
  - cause: ENTITY_SWEEP_ATTACK
    damage_type: physical
    enabled: true
  - cause: PROJECTILE
    damage_type: physical
    enabled: true
  - cause: CONTACT
    damage_type: physical
    enabled: true
  - cause: SUFFOCATION
    damage_type: physical
    enabled: true
  - cause: FALL
    damage_type: physical
    enabled: true
  - cause: FLY_INTO_WALL
    damage_type: physical
    enabled: true
  - cause: FALLING_BLOCK
    damage_type: physical
    enabled: true
  - cause: FIRE
    damage_type: physical
    enabled: true
  - cause: FIRE_TICK
    damage_type: physical
    enabled: true
  - cause: MELTING
    damage_type: physical
    enabled: true
  - cause: LAVA
    damage_type: physical
    enabled: true
  - cause: DROWNING
    damage_type: physical
    enabled: true
  - cause: DRYOUT
    damage_type: physical
    enabled: true
  - cause: BLOCK_EXPLOSION
    damage_type: physical
    enabled: true
  - cause: ENTITY_EXPLOSION
    damage_type: physical
    enabled: true
  - cause: VOID
    damage_type: physical
    enabled: true
  - cause: LIGHTNING
    damage_type: physical
    enabled: true
  - cause: SUICIDE
    damage_type: physical
    enabled: true
  - cause: KILL
    damage_type: physical
    enabled: true
  - cause: WORLD_BORDER
    damage_type: physical
    enabled: true
  - cause: HOT_FLOOR
    damage_type: physical
    enabled: true
  - cause: CAMPFIRE
    damage_type: physical
    enabled: true
  - cause: CRAMMING
    damage_type: physical
    enabled: true
  - cause: FREEZE
    damage_type: physical
    enabled: true
  - cause: STARVATION
    damage_type: physical
    enabled: true
  - cause: MAGIC
    damage_type: physical
    enabled: true
  - cause: POISON
    damage_type: physical
    enabled: true
  - cause: WITHER
    damage_type: physical
    enabled: true
  - cause: DRAGON_BREATH
    damage_type: physical
    enabled: true
  - cause: THORNS
    damage_type: physical
