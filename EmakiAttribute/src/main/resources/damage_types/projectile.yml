# 投射物伤害流程；字段契约同 physical.yml。

id: projectile

display_name: "投射物伤害"

aliases:
  - ranged
  - projectile_damage
  - arrow

allowed_events:
  - PROJECTILE

hard_lock: true

stages:
  - id: attack
    kind: FLAT_PERCENT
    source: ATTACKER
    mode: ADD
    flat_attributes:
      - projectile_attack
    percent_attributes:
      - projectile_damage_bonus

  - id: crit
    kind: CUSTOM
    source: ATTACKER
    chance_attributes:
      - projectile_crit_rate
    multiplier_attributes:
      - projectile_crit_damage
    expression: "%input% * (1 + (%crit% * (%multiplier% / 100)))"

  - id: defense
    kind: FLAT_PERCENT
    source: TARGET
    mode: SUBTRACT
    flat_attributes:
      - projectile_defense
    expression: "max(0, %input% - %flat%)"

  # 投射物格挡仅在 shield.mode=attribute 时生效，字段同 physical.yml。
  - id: block
    kind: CUSTOM
    source: TARGET
    chance_attributes:
      - block_rate
    multiplier_attributes:
      - block_reduction
    expression: "%input% * (1 - (%target_blocking% * %crit% * (%multiplier% / 100)))"
    min_result: 0

recovery:
  source: ATTACKER
  resistance_source: TARGET
  flat_attributes:
    - percentage_lifesteal
  percent_attributes:
    - lifesteal
  resistance_attributes:
    - lifesteal_resistance

attacker_message: "<gray>[<gold>%damage_type%</gold>]</gray> <green>你对 <white>%target%</white> 造成了 <yellow>%final_damage%</yellow> 点伤害</green>%critical_suffix%"
target_message: "<gray>[<gold>%damage_type%</gold>]</gray> <red>%attacker%</red> 对你造成了 <yellow>%final_damage%</yellow> 点伤害%critical_suffix%"

description: "Projectile damage resolved entirely through Emaki attributes."
