# ============================================================
# EmakiAttribute Lore 格式定义 - 固定值格式
# ============================================================
# 此文件定义了属性在物品 Lore 中的显示格式。
# 当属性值需要写入物品 Lore 时，会使用此格式进行渲染。
# 同时定义了从 Lore 中读取属性值的正则模式。
#
# 文件放置位置: plugins/EmakiAttribute/lore_formats/
# ============================================================

# 格式唯一标识符
id: default_flat

# 显示格式模板
# {name}: 属性显示名称
# {sign}: 正负号（+ 或 -）
# {value}: 属性数值
format: "{name} {sign}{value}"

# 数值精度（小数位数）
precision: 2

# 读取优先级（数值越高越优先匹配）
read_priority: 50

# 读取正则模式
# {Key}: 匹配属性名称
# {Value}: 匹配属性数值；同时支持区间写法 a-b / a~b（如 "1-5"）
#          区间会被解析为「下界 + 随机幅度」，战斗时每次命中在 [a, b] 内取随机值。
#          单值写法（如 "5"）行为不变。
read_patterns:
  - "{Key}.*?: ?{Value}$"
