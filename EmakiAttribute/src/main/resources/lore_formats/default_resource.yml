# ============================================================
# EmakiAttribute Lore 格式定义 - 资源格式
# ============================================================
# 用于资源类属性（如生命值上限、法力值上限等）的 Lore 显示。
#
# 文件放置位置: plugins/EmakiAttribute/lore_formats/
# ============================================================

id: default_resource

format: "{name} {sign}{value}"

precision: 2

read_priority: 60

read_patterns:
  - "{Key}.*?[:：] ?{Value}$"
