# ============================================================
# EmakiAttribute Lore 格式定义 - 百分比格式
# ============================================================
# 用于百分比类属性（如暴击率、增伤倍率等）的 Lore 显示。
#
# 文件放置位置: plugins/EmakiAttribute/lore_formats/
# ============================================================

id: default_percent

format: "{name} {sign}{value}%"

precision: 2

read_priority: 100

read_patterns:
  - "{Key}.*?: ?{Value}%$"
