# ============================================================
# EmakiAttribute Lore 格式定义 - 百分比格式
# ============================================================
# 用于百分比类属性（如暴击率、增伤倍率等）的 Lore 显示。
#
# 文件放置位置: plugins/EmakiAttribute/lore_formats/
# ============================================================

id: default_percent

format: "{name} {sign}{value}%"

precision: 2

read_priority: 100

read_patterns:
  # {Value} 支持单值与区间：如 "10%" 或 "10-20%"。
  # 区间会在每次命中结算对应阶段输入时按 [最小值, 最大值] 随机取值。
  - "{Key}.*?: ?{Value}%$"
