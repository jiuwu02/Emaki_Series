# ============================================================
# EmakiAttribute Lore 格式定义 - 回复速率格式
# ============================================================
# 用于回复类属性（如生命回复、法力回复等）的 Lore 显示。
# 数值后附加 "/秒" 后缀。
#
# 文件放置位置: plugins/EmakiAttribute/lore_formats/
# ============================================================

id: default_regen

format: "%name% %sign%%value%/秒"

precision: 1

read_priority: 80

read_patterns:
  - "%Key%.*?: ?%Value%/秒$"
