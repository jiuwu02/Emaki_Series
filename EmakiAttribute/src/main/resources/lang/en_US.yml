  help_entry_lint: "- <hover:show_text:'<gray>lint</gray> <dark_gray>·</dark_gray> <gray>Check config and resource loading issues</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakiattribute.reload</white> <gray>or </gray><white>emakiattribute.admin</white>'><gray>lint</gray></hover> <click:run_command:'%root% lint'><green>[ ✦ Run ]</green></click>"
