      resource state."
    debug:
      "<gray>/emakiattribute debug <status|player|module|all> [...]</gray> Manage
      debug tracking."
    source: "<gray>/emakiattribute source <player> <attribute></gray> View sources for one attribute."
    trace:
      "<gray>/emakiattribute trace <last|list|export|clear> <player></gray> View
      damage Trace records."
    points:
      "<gray>/emakiattribute points [view|open|add|reset]</gray> View attribute
      points, open the allocation GUI, or allocate parent attributes."
    lint: "<gray>/emakiattribute lint</gray> Check config and resource loading
      issues."

  source:
    usage: "<red>Usage: /ea source <player> <attribute></red>"
    header: "<gray>[EA]</gray> <aqua>%player%</aqua> attribute sources"
    header_filtered: "<gray>[EA]</gray> <aqua>%player%</aqua> attribute sources <yellow>%attribute%</yellow>"
    empty: "<gray>No matching attribute sources.</gray>"
    line: "<gray>-</gray> <yellow>%value%</yellow> <aqua>%attribute%</aqua> <dark_gray>[</dark_gray>%source_type%<dark_gray>]</dark_gray> <white>%source_label%</white>%condition%"
    condition_failed: " <red>inactive</red>"

  trace:
    usage: "<red>Usage: /ea trace <last|list|export|clear> <player></red>"
    unknown_action: "<red>Unknown trace subcommand: %action%</red>"
    list_header: "<gray>[EA]</gray> <aqua>%player%</aqua> recent damage traces: <yellow>%count%</yellow>"
    empty: "<gray>No damage trace. Run /ea debug <player> on to start recording.</gray>"
    none: "<gray>No trace</gray>"
    cleared: "<green>Damage traces cleared.</green>"
    clear_empty: "<gray>No damage trace to clear.</gray>"
    summary: "<gray>#%trace_id%</gray> <white>%attacker%</white> -> <white>%target%</white> <dark_gray>type=</dark_gray><aqua>%damage_type%</aqua> <dark_gray>cause=</dark_gray><aqua>%cause%</aqua> <dark_gray>final=</dark_gray><yellow>%final_damage%</yellow> <dark_gray>mode=</dark_gray><green>%apply_mode%</green>"
