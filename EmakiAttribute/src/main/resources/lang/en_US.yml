# ============================================================
# EmakiAttribute 语言文件 - English
# ============================================================
# 此文件包含插件的所有消息文本，支持 MiniMessage 格式。
# 修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiAttribute/lang/
# ============================================================

# version is maintained by resource sync
version: "4.5.8"
general:
  prefix: "<gray>[ <gradient:#A78BFA:#60A5FA>EmakiAttribute</gradient> ]</gray>"

console:
  plugin_starting: "<gray>Starting...</gray>"
  plugin_started: "<green>Started</green>"
  plugin_stopped: "<yellow>Stopped</yellow>"
  config_precheck_passed: "<gray>Config precheck passed: <yellow>%issues%</yellow> issue(s).</gray>"
  config_precheck_failed: "<red>Config precheck failed: <yellow>%issues%</yellow> issue(s).</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray>(%hint%)</dark_gray>"
    messages:
      passed: "EmakiAttribute configuration precheck passed."
      required_file_missing: "The required file is missing."
      path_not_file: "The specified path is not a file."
      file_not_readable: "The file is not readable."
      required_directory_missing: "The required directory is missing."
      path_not_directory: "The specified path is not a directory."
      directory_not_readable: "The directory is not readable."
      attribute_sources_disabled: "Both Lore and PDC item attribute sources are disabled, so all item attributes are inactive."
      attribute_sources_match_requires_both: "Match mode requires both Lore and PDC attribute reading; otherwise all item attributes are inactive."
  combat_debug_line: "<gray>[CombatDebug][<aqua>%phase%</aqua>]</gray> %message%"
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  config_load_failed: "<red>Config load failed: %error%</red>"
  reload_stage_failed: "<yellow>Reload stage %stage% failed: <red>%error%</red></yellow>"
  vanilla_attribute_resolve_failed: "<yellow>Failed to resolve vanilla attribute
    mapping: <red>%attribute%</red> -> <red>%target%</red></yellow>"
  attribute_key_contains_conflict: "<yellow>[Attribute Registry] Keyword
    containment conflict detected: <aqua>%lower_display_name%</aqua>
    (<white>%lower_id%</white>, priority %lower_priority%) keyword
    <white>%lower_key%</white> contains <aqua>%higher_display_name%</aqua>
    (<white>%higher_id%</white>, priority %higher_priority%) keyword
    <white>%higher_key%</white>. Lower priority causes read failure; raise
    priority or change display_name.</yellow>"
  mmoitems_bridge_unavailable: "<yellow>MMOItems attribute bridge init failed: <red>%error%</red></yellow>"
  mmoitems_stat_resolve_failed:
    "<yellow>MMOItems attribute mapping cannot resolve
    stat: attribute <aqua>%attribute%</aqua> -> <red>%stat%</red></yellow>"
  mmoitems_stat_read_failed: "<yellow>MMOItems attribute mapping read failed:
    attribute <aqua>%attribute%</aqua> -> <red>%stat%</red>
    (<red>%error%</red>)</yellow>"
  attribute_registry_empty: "<yellow>No attributes loaded</yellow>"
  attribute_registry_summary: "<gray>Loaded <yellow>%count%</yellow> attribute(s)</gray>"
  attribute_registry_entry: "<gray>[Attribute Registry]</gray>
    <white>%index%</white> <dark_gray>|</dark_gray> <aqua>%display_name%</aqua>
    <dark_gray>(</dark_gray><white>%id%</white><dark_gray>)</dark_gray>
    <dark_gray>|</dark_gray> <gray>Default</gray>
    <yellow>%default_value%</yellow> <dark_gray>|</dark_gray> <gray>Power</gray>
    <yellow>%attribute_power%</yellow>"
  papi_registered: "<gray>PlaceholderAPI expansion registered</gray>"
  js_attribute_extension_no_result: "no result"
  js_attribute_extension_load_failed: "<yellow>Failed to load JavaScript attribute extension: <white>%script%</white> (<red>%error%</red>)</yellow>"
  js_attribute_extensions_loaded: "<gray>Loaded <yellow>%count%</yellow> JavaScript attribute extension script(s), damage hooks=<yellow>%damage_hooks%</yellow>, damage pipelines=<yellow>%damage_pipelines%</yellow></gray>"
  js_attribute_extension_directory_create_failed: "<yellow>Failed to create JavaScript attribute extension directory: <red>%error%</red></yellow>"
  js_attribute_extension_scan_failed: "<yellow>Failed to scan JavaScript attribute extensions: <red>%error%</red></yellow>"
  js_attribute_blank_id: "<yellow>JavaScript attribute definition ID cannot be blank: <white>%script%</white></yellow>"
  js_attribute_registered: "<gray>Registered JavaScript attribute: <aqua>%id%</aqua> <dark_gray>(%script%)</dark_gray></gray>"
  js_attribute_provider_blank_id: "<yellow>JavaScript attribute provider ID cannot be blank: <white>%script%</white></yellow>"
  js_attribute_provider_registered: "<gray>Registered JavaScript attribute provider: <aqua>%id%</aqua> <dark_gray>(%script%)</dark_gray></gray>"
  js_damage_hook_invalid: "<yellow>JavaScript damage hook requires id and function: <white>%script%</white></yellow>"
  js_damage_hook_registered: "<gray>Registered JavaScript damage hook: <aqua>%id%</aqua> <dark_gray>(%script%)</dark_gray></gray>"
  js_damage_hook_failed: "<yellow>JavaScript damage hook failed: <aqua>%id%</aqua> (<red>%error%</red>)</yellow>"
  js_damage_type_invalid: "<yellow>Invalid JavaScript damage type definition: <white>%script%</white></yellow>"
  js_damage_type_registered: "<gray>Registered JavaScript damage type: <aqua>%id%</aqua> <dark_gray>(%script%)</dark_gray></gray>"
  js_damage_pipeline_invalid: "<yellow>JavaScript damage pipeline requires id and function: <white>%script%</white></yellow>"
  js_damage_pipeline_registered: "<gray>Registered JavaScript damage pipeline: <aqua>%id%</aqua> <dark_gray>(%script%)</dark_gray></gray>"

