  schema_invalid_section: "<red>%type% file %file% has invalid %field% structure</red>"
  schema_invalid_enum: "<red>%type% file %file% has invalid %field% enum value</red>"
  schema_invalid_number: "<red>%type% file %file% has invalid %field% number</red>"
  schema_unsupported_field: "<red>%type% file %file% still contains unsupported %field% field</red>"
  invalid_blank_id: "<red>%type% file %file% has a blank ID</red>"
  duplicate_id: "<red>%type% file %file% has duplicate ID: %id%</red>"
  invalid_lore_pattern: "<red>%attribute% has invalid lore regex: %pattern%  (%error%)</red>"
  load_failed: "<red>Failed to load %type% file %file%: %error%</red>"
  parent_child_bonus_on_non_parent: "<red>%attribute% declares child_bonuses but is not a parent attribute</red>"
  parent_child_bonus_unknown: "<red>Parent attribute %parent% references unknown child attribute: %child%</red>"
  parent_child_bonus_parent_target: "<red>Parent attribute %parent% child_bonuses cannot target another parent attribute: %child%</red>"
  damage_type_parent_attribute_forbidden: "<red>Damage type stages cannot directly reference parent attribute: %attribute%</red>"

script:
  engine_unavailable: "<yellow>GraalJS engine unavailable, script attributes skipped: %reason%</yellow>"
  disabled: "<gray>Script attribute support is disabled  (scripts.enabled = false)</gray>"
  loaded: "<gray>Script attributes loaded: %loaded% succeeded, %skipped% skipped</gray>"
  file_error: "<red>Script %file% failed to load: %error%</red>"
  register_error: "<red>Attribute registration skipped: %error%</red>"
  register_override: "<yellow>Script attribute %id% overrides a registered attribute with the same id</yellow>"
  payload_missing_id: "<gray>%file% is missing the required id field</gray>"
  payload_invalid_enum: "<gray>%file% field %field% has invalid enum value: %value%</gray>"
  payload_invalid_number: "<gray>%file% field %field% is not a valid number: %value%</gray>"
  payload_invalid_list: "<gray>%file% field %field% must be a list of strings</gray>"

