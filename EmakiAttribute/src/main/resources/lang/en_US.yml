  help_entry_reload: "- <hover:show_text:'<gray>reload</gray> <dark_gray>·</dark_gray> <gray>Reload config and lore</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Runs async and prints a reload summary</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakiattribute.reload</white> <gray>or </gray><white>emakiattribute.admin</white>'><gray>reload</gray></hover> <click:run_command:'%root% reload'><green>[ ✦ Run ]</green></click>"
  help_entry_resync: "- <hover:show_text:'<gray>resync</gray> <dark_gray>·</dark_gray> <gray>Re-sync the attribute snapshot of players</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Optional argument: player or all - defaults to yourself, e.g. </gray><white>%root% resync [player]</white><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests players and all</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakiattribute.resync</white> <gray>or </gray><white>emakiattribute.admin</white>'><gray>resync</gray></hover> <click:run_command:'%root% resync'><green>[ ✦ Run ]</green></click>"
  help_entry_preview: "- <hover:show_text:'<gray>preview</gray> <dark_gray>·</dark_gray> <gray>Preview the attribute snapshot of one equipment slot</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Optional arguments: player slot - defaults to your main hand, e.g. </gray><white>%root% preview [player] [slot]</white><newline><dark_gray>▸</dark_gray> <gray>Slots: main_hand/off_hand/helmet/chestplate/leggings/boots</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakiattribute.debug</white> <gray>or </gray><white>emakiattribute.admin</white> <gray>and player only</gray>'><gray>preview</gray></hover> <click:run_command:'%root% preview'><green>[ ✦ Run ]</green></click>"
  help_entry_dump: "- <hover:show_text:'<gray>dump</gray> <dark_gray>·</dark_gray> <gray>Print the current combat attribute snapshot and resource state</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakiattribute.debug</white> <gray>or </gray><white>emakiattribute.admin</white>'><gray>dump</gray></hover> <click:run_command:'%root% help dump'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>player</gray> <dark_gray>·</dark_gray> <gray>player to inspect; required from console</gray><newline><gray>sources</gray> <dark_gray>·</dark_gray> <gray>after the player, show attribute sources</gray><newline><gray>json</gray> <dark_gray>·</dark_gray> <gray>after the player, also print JSON trace data</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_entry_debug: "- <hover:show_text:'<gray>debug</gray> <dark_gray>·</dark_gray> <gray>Debug tracking and combat damage recording switch</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakiattribute.debug</white> <gray>or </gray><white>emakiattribute.admin</white>'><gray>debug</gray></hover> <click:run_command:'%root% help debug'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>status</gray> <dark_gray>·</dark_gray> <gray>show debug status</gray><newline><gray>on</gray> <dark_gray>·</dark_gray> <gray>turn on all debug output</gray><newline><gray>off</gray> <dark_gray>·</dark_gray> <gray>turn off all debug output</gray><newline><gray>player</gray> <dark_gray>·</dark_gray> <gray>toggle player debug tracking</gray><newline><gray>module</gray> <dark_gray>·</dark_gray> <gray>toggle module debug tracking</gray><newline><gray>player name</gray> <dark_gray>·</dark_gray> <gray>toggle combat damage recording for one player</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_entry_source: "- <hover:show_text:'<gray>source</gray> <dark_gray>·</dark_gray> <gray>View every source of one attribute of a player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakiattribute.debug</white> <gray>or </gray><white>emakiattribute.admin</white>'><gray>source</gray></hover> <hover:show_text:'<gray>Argument: player</gray><newline><gray>target online player name</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ player ]</gray></hover> <hover:show_text:'<gray>Argument: attribute ID</gray><newline><gray>attribute ID whose sources to view</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ attribute ID ]</gray></hover>"
