# EmakiAttribute PDC 条件源示例：绑定条件（默认禁用）。
# 启用后读取物品的 bound_player 元数据，并将其与当前玩家名比较；
# 条件通过时，该来源对应的属性贡献才可继续生效。

# 是否启用此条件源（默认禁用，按需开启）
enabled: false

# 条件源标识符
source_id: gem_bind

# 条件块
condition:
  # 条件组合方式
  type: all_of
  # 表达式解析失败时是否视为不满足条件
  invalid_as_failure: true
  # 条件列表
  # type: pdc_meta → 从物品 PDC 中读取指定 key 的值
  # key: PDC 中的键名
  # condition: 条件表达式（%value% 为绑定的玩家名）
  entries:
    - type: pdc_meta
      key: bound_player
      condition: "%value% == %player_name%"
