# EmakiAttribute 条件源：EmakiItem 物品条件。
# 从 EmakiItem 拥有的 condition_expressions 元数据读取条件文本并交给条件引擎求值；
# 元数据不存在时由 require_match: false 跳过该条检查。

# 是否启用此条件源
enabled: true

# 条件源标识符（对应 EmakiItem 写入的 PDC 数据）
source_id: "emakiitem"

# 条件块
condition:
  # 条件组合方式
  type: "all_of"
  # 表达式解析失败时是否视为不满足条件
  invalid_as_failure: true
  # 条件列表
  # type: pdc_meta → 从物品 PDC 中读取指定 key 的值
  # key: condition_expressions → EmakiItem 写入的条件表达式字段
  # pattern: 正则匹配（".+" 表示非空即匹配）
  # condition: "%value%" → 直接将读取到的值作为条件表达式执行
  # require_match: false → 如果 key 不存在则跳过（不视为失败）
  entries:
    - type: pdc_meta
      key: condition_expressions
      pattern: ".+"
      condition: "%value%"
      require_match: false
