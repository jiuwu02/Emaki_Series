# EmakiAttribute 属性定义 - 格挡率
# 详细字段说明参考 physical_attack.yml
#
# 仅在 config.yml 的 shield.mode = attribute 时参与结算。
# 举盾时按此概率触发格挡，触发后的减伤幅度由 block_reduction 决定。
# 实际生效的基线值写在 config.yml 的 default_profile.attributes，此处的 default_value
# 与其他属性保持一致为 0；该值为 0 时格挡永不触发，举盾将完全不减伤。

id: block_rate

display_name: "格挡率"

value_kind: CHANCE

target_type: GENERIC

target_id: block

default_value: 0.0

min_value: 0.0

max_value: 100.0

allow_negative: false

priority: 78

lore_format_id: default_percent

attribute_power: 1.0

description: "Chance to block while raising a shield."
