name: EmakiAttribute
main: emaki.jiuwu.craft.attribute.EmakiAttributePlugin
version: ${project.version}
api-version: "1.21.8"
folia-supported: true
dependencies:
  server:
    EmakiCoreLib:
      load: BEFORE
      required: true
      join-classpath: true
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    MMOItems:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  emakiattribute.use:
    default: true
  emakiattribute.reload:
    default: op
  emakiattribute.resync:
    default: op
  emakiattribute.debug:
    default: op
  emakiattribute.admin:
    default: op
