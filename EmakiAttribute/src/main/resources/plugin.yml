name: EmakiAttribute
main: emaki.jiuwu.craft.attribute.EmakiAttributePlugin
version: ${project.version}
api-version: "1.21"
folia-supported: true
depend:
  - EmakiCoreLib
softdepend:
  - MythicMobs
  - PlaceholderAPI
  - MMOItems
commands:
  emakiattribute:
    aliases: [eattribute, ea]
    permission: emakiattribute.use
permissions:
  emakiattribute.use:
    default: true
  emakiattribute.reload:
    default: op
  emakiattribute.resync:
    default: op
  emakiattribute.debug:
    default: op
  emakiattribute.admin:
    default: op
