<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #0a0d12;
      }
      .icon {
        position: relative;
        width: 256px;
        height: 256px;
        overflow: hidden;
      }
      .plate {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 120% at 26% 16%,
            rgba(255, 255, 255, 0.05) 0%,
            transparent 58%
          ),
          linear-gradient(146deg, #0b1018 0%, #070a0f 62%, #e024921f 100%);
      }
      .wash {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background: radial-gradient(
          96% 96% at 78% 20%,
          #3636f538 0%,
          transparent 64%
        );
      }
      .edge {
        position: absolute;
        inset: 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -1px 0 rgba(0, 0, 0, 0.55);
      }
      svg {
        position: absolute;
        inset: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="plate"></div>
      <div class="wash"></div>
      <svg
        width="256"
        height="256"
        viewBox="0 0 256 256"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.4" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <g filter="url(#glow)">
          <polygon
            points="128.0,34.0 143.3,74.9 187.0,76.8 152.8,104.0 164.4,146.2 128.0,122.0 91.6,146.2 103.2,104.0 69.0,76.8 112.7,74.9"
            fill="#5D5DF5"
            fill-opacity="0.50"
            stroke="#5D5DF5"
            stroke-opacity="0.95"
            stroke-width="2"
          />
          <path
            d="M 72.0 214 L 128.0 166 L 184.0 214"
            fill="none"
            stroke="#5D5DF5"
            stroke-opacity="0.92"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M 72.0 246 L 128.0 198 L 184.0 246"
            fill="none"
            stroke="#5D5DF5"
            stroke-opacity="0.40"
            stroke-width="9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
      </svg>
      <div class="edge"></div>
    </div>
  </body>
</html>
