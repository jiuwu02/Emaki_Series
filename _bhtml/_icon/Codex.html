<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #0a0d12;
      }
      .icon {
        position: relative;
        width: 256px;
        height: 256px;
        overflow: hidden;
      }
      .plate {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 120% at 26% 16%,
            rgba(255, 255, 255, 0.05) 0%,
            transparent 58%
          ),
          linear-gradient(146deg, #0b1018 0%, #070a0f 62%, #f59e0b1f 100%);
      }
      .wash {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background: radial-gradient(
          96% 96% at 78% 20%,
          #d946ef38 0%,
          transparent 64%
        );
      }
      .edge {
        position: absolute;
        inset: 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -1px 0 rgba(0, 0, 0, 0.55);
      }
      svg {
        position: absolute;
        inset: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="plate"></div>
      <div class="wash"></div>
      <svg
        width="256"
        height="256"
        viewBox="0 0 256 256"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.4" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <g filter="url(#glow)">
          <path
            d="M 128.0 72 C 106.0 56 70.0 50 32.0 54 L 32.0 190 C 70.0 186 106.0 192 128.0 208 Z"
            fill="#D946EF"
            fill-opacity="0.26"
            stroke="#D946EF"
            stroke-opacity="0.90"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <path
            d="M 128.0 72 C 150.0 56 186.0 50 224.0 54 L 224.0 190 C 186.0 186 150.0 192 128.0 208 Z"
            fill="#D946EF"
            fill-opacity="0.16"
            stroke="#D946EF"
            stroke-opacity="0.90"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <line
            x1="128.0"
            y1="72"
            x2="128.0"
            y2="208"
            stroke="#D946EF"
            stroke-opacity="0.8"
            stroke-width="3"
          />
          <line
            x1="54.0"
            y1="92"
            x2="108.0"
            y2="89"
            stroke="#D946EF"
            stroke-opacity="0.42"
            stroke-width="2"
          />
          <line
            x1="148.0"
            y1="89"
            x2="202.0"
            y2="92"
            stroke="#D946EF"
            stroke-opacity="0.30"
            stroke-width="2"
          />
          <line
            x1="54.0"
            y1="118"
            x2="108.0"
            y2="115"
            stroke="#D946EF"
            stroke-opacity="0.42"
            stroke-width="2"
          />
          <line
            x1="148.0"
            y1="115"
            x2="202.0"
            y2="118"
            stroke="#D946EF"
            stroke-opacity="0.30"
            stroke-width="2"
          />
          <line
            x1="54.0"
            y1="144"
            x2="108.0"
            y2="141"
            stroke="#D946EF"
            stroke-opacity="0.42"
            stroke-width="2"
          />
          <line
            x1="148.0"
            y1="141"
            x2="202.0"
            y2="144"
            stroke="#D946EF"
            stroke-opacity="0.30"
            stroke-width="2"
          />
          <line
            x1="54.0"
            y1="170"
            x2="108.0"
            y2="167"
            stroke="#D946EF"
            stroke-opacity="0.42"
            stroke-width="2"
          />
          <line
            x1="148.0"
            y1="167"
            x2="202.0"
            y2="170"
            stroke="#D946EF"
            stroke-opacity="0.30"
            stroke-width="2"
          />
        </g>
      </svg>
      <div class="edge"></div>
    </div>
  </body>
</html>
