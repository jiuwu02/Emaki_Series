<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #0a0d12;
      }
      .icon {
        position: relative;
        width: 256px;
        height: 256px;
        overflow: hidden;
      }
      .plate {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 120% at 26% 16%,
            rgba(255, 255, 255, 0.05) 0%,
            transparent 58%
          ),
          linear-gradient(146deg, #0b1018 0%, #070a0f 62%, #22d3ee1f 100%);
      }
      .wash {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background: radial-gradient(
          96% 96% at 78% 20%,
          #a3e63538 0%,
          transparent 64%
        );
      }
      .edge {
        position: absolute;
        inset: 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -1px 0 rgba(0, 0, 0, 0.55);
      }
      svg {
        position: absolute;
        inset: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="plate"></div>
      <div class="wash"></div>
      <svg
        width="256"
        height="256"

        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>

        </defs>
        <g filter="url(#glow)">
          <rect
            x="18"

          <rect

          />
          <rect

            fill="#A3E635"
            fill-opacity="0.30"
            stroke="#A3E635"

          />
          <rect

  </body>
</html>
