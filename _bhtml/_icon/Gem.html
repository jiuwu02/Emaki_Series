<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #0a0d12;
      }
      .icon {
        position: relative;
        width: 256px;
        height: 256px;
        overflow: hidden;
      }
      .plate {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 120% at 26% 16%,
            rgba(255, 255, 255, 0.05) 0%,
            transparent 58%
          ),
          linear-gradient(146deg, #0b1018 0%, #070a0f 62%, #a855f71f 100%);
      }
      .wash {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background: radial-gradient(
          96% 96% at 78% 20%,
          #22d3ee38 0%,
          transparent 64%
        );
      }
      .edge {
        position: absolute;
        inset: 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -1px 0 rgba(0, 0, 0, 0.55);
      }
      svg {
        position: absolute;
        inset: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="plate"></div>
      <div class="wash"></div>
      <svg
        width="256"
        height="256"
        viewBox="0 0 256 256"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.4" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <g filter="url(#glow)">
          <path
            d="M 50.0 102.0 L 82.0 52.0 L 174.0 52.0 L 206.0 102.0 L 128.0 214.0 Z"
            fill="#22D3EE"
            fill-opacity="0.30"
            stroke="#22D3EE"
            stroke-opacity="0.90"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <line
            x1="50.0"
            y1="102.0"
            x2="102.0"
            y2="102.0"
            stroke="#22D3EE"
            stroke-opacity="0.55"
            stroke-width="2"
          />
          <line
            x1="102.0"
            y1="102.0"
            x2="154.0"
            y2="102.0"
            stroke="#22D3EE"
            stroke-opacity="0.55"
            stroke-width="2"
          />
          <line
            x1="154.0"
            y1="102.0"
            x2="206.0"
            y2="102.0"
            stroke="#22D3EE"
            stroke-opacity="0.55"
            stroke-width="2"
          />
          <line
            x1="50.0"
            y1="102.0"
            x2="128.0"
            y2="214.0"
            stroke="#22D3EE"
            stroke-opacity="0.5"
            stroke-width="2"
          />
          <line
            x1="206.0"
            y1="102.0"
            x2="128.0"
            y2="214.0"
            stroke="#22D3EE"
            stroke-opacity="0.5"
            stroke-width="2"
          />
          <line
            x1="102.0"
            y1="52.0"
            x2="102.0"
            y2="102.0"
            stroke="#22D3EE"
            stroke-opacity="0.42"
            stroke-width="1.8"
          />
          <line
            x1="154.0"
            y1="52.0"
            x2="154.0"
            y2="102.0"
            stroke="#22D3EE"
            stroke-opacity="0.42"
            stroke-width="1.8"
          />
          <polygon
            points="82.0,52.0 174.0,52.0 154.0,102.0 102.0,102.0"
            fill="#22D3EE"
            fill-opacity="0.34"
          />
        </g>
      </svg>
      <div class="edge"></div>
    </div>
  </body>
</html>
