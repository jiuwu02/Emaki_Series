<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #0a0d12;
      }
      .icon {
        position: relative;
        width: 256px;
        height: 256px;
        overflow: hidden;
      }
      .plate {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 120% at 26% 16%,
            rgba(255, 255, 255, 0.05) 0%,
            transparent 58%
          ),
          linear-gradient(146deg, #0b1018 0%, #070a0f 62%, #fb923c1f 100%);
      }
      .wash {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background: radial-gradient(
          96% 96% at 78% 20%,
          #f43f5e38 0%,
          transparent 64%
        );
      }
      .edge {
        position: absolute;
        inset: 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -1px 0 rgba(0, 0, 0, 0.55);
      }
      svg {
        position: absolute;
        inset: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="plate"></div>
      <div class="wash"></div>
      <svg
        width="256"
        height="256"
        viewBox="0 0 256 256"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.4" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <g filter="url(#glow)">
          <path
            d="M 128.0 34 L 202.0 66 L 202.0 140 C 202.0 186 168.0 210 128.0 224 C 88.0 210 54.0 186 54.0 140 L 54.0 66 Z"
            fill="#F43F5E"
            fill-opacity="0.34"
            stroke="#F43F5E"
            stroke-opacity="0.90"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <path
            d="M 88.0 134.0 L 116.0 104.0 L 138.0 124.0 L 170.0 82.0"
            fill="none"
            stroke="#F43F5E"
            stroke-opacity="0.95"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle
            cx="170.0"
            cy="82.0"
            r="9"
            fill="#F43F5E"
            fill-opacity="0.95"
          />
        </g>
      </svg>
      <div class="edge"></div>
    </div>
  </body>
</html>
