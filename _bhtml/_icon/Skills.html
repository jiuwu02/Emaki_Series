<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #0a0d12;
      }
      .icon {
        position: relative;
        width: 256px;
        height: 256px;
        overflow: hidden;
      }
      .plate {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 120% at 26% 16%,
            rgba(255, 255, 255, 0.05) 0%,
            transparent 58%
          ),
          linear-gradient(146deg, #0b1018 0%, #070a0f 62%, #7c3aed1f 100%);
      }
      .wash {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background: radial-gradient(
          96% 96% at 78% 20%,
          #3b82f638 0%,
          transparent 64%
        );
      }
      .edge {
        position: absolute;
        inset: 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -1px 0 rgba(0, 0, 0, 0.55);
      }
      svg {
        position: absolute;
        inset: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="plate"></div>
      <div class="wash"></div>
      <svg
        width="256"
        height="256"
        viewBox="0 0 256 256"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.4" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <g filter="url(#glow)">
          <rect
            x="119.0"
            y="96"
            width="18"
            height="132"
            rx="7"
            fill="#3B82F6"
            fill-opacity="0.28"
            stroke="#3B82F6"
            stroke-opacity="0.78"
            stroke-width="2.6"
            transform="rotate(24 128.0 128.0)"
          />
          <line
            x1="182.0"
            y1="76.0"
            x2="208.0"
            y2="76.0"
            stroke="#3B82F6"
            stroke-opacity="0.62"
            stroke-width="3"
            stroke-linecap="round"
          />
          <line
            x1="176.1"
            y1="90.1"
            x2="184.6"
            y2="98.6"
            stroke="#3B82F6"
            stroke-opacity="0.62"
            stroke-width="3"
            stroke-linecap="round"
          />
          <line
            x1="162.0"
            y1="96.0"
            x2="162.0"
            y2="122.0"
            stroke="#3B82F6"
            stroke-opacity="0.62"
            stroke-width="3"
            stroke-linecap="round"
          />
          <line
            x1="147.9"
            y1="90.1"
            x2="139.4"
            y2="98.6"
            stroke="#3B82F6"
            stroke-opacity="0.62"
            stroke-width="3"
            stroke-linecap="round"
          />
          <line
            x1="142.0"
            y1="76.0"
            x2="116.0"
            y2="76.0"
            stroke="#3B82F6"
            stroke-opacity="0.62"
            stroke-width="3"
            stroke-linecap="round"
          />
          <line
            x1="147.9"
            y1="61.9"
            x2="139.4"
            y2="53.4"
            stroke="#3B82F6"
            stroke-opacity="0.62"
            stroke-width="3"
            stroke-linecap="round"
          />
          <line
            x1="162.0"
            y1="56.0"
            x2="162.0"
            y2="30.0"
            stroke="#3B82F6"
            stroke-opacity="0.62"
            stroke-width="3"
            stroke-linecap="round"
          />
          <line
            x1="176.1"
            y1="61.9"
            x2="184.6"
            y2="53.4"
            stroke="#3B82F6"
            stroke-opacity="0.62"
            stroke-width="3"
            stroke-linecap="round"
          />
          <circle
            cx="162.0"
            cy="76"
            r="17"
            fill="#3B82F6"
            fill-opacity="0.9"
            stroke="#3B82F6"
            stroke-opacity="0.95"
            stroke-width="2"
          />
        </g>
      </svg>
      <div class="edge"></div>
    </div>
  </body>
</html>
