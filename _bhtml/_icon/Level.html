<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #0a0d12;
      }
      .icon {
        position: relative;
        width: 256px;
        height: 256px;
        overflow: hidden;
      }
      .plate {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 120% at 26% 16%,
            rgba(255, 255, 255, 0.05) 0%,
            transparent 58%
          ),
          linear-gradient(146deg, #0b1018 0%, #070a0f 62%, #f472b61f 100%);
      }
      .wash {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background: radial-gradient(
          96% 96% at 78% 20%,
          #a855f738 0%,
          transparent 64%
        );
      }
      .edge {
        position: absolute;
        inset: 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -1px 0 rgba(0, 0, 0, 0.55);
      }
      svg {
        position: absolute;
        inset: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="plate"></div>
      <div class="wash"></div>
      <svg
        width="256"
        height="256"
        viewBox="0 0 256 256"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.4" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <g filter="url(#glow)">
          <rect
            x="30"
            y="172"
            width="40"
            height="52"
            rx="6"
            fill="#A855F7"
            fill-opacity="0.16"
            stroke="#A855F7"
            stroke-opacity="0.50"
            stroke-width="2.6"
          />
          <rect
            x="82"
            y="130"
            width="40"
            height="94"
            rx="6"
            fill="#A855F7"
            fill-opacity="0.22"
            stroke="#A855F7"
            stroke-opacity="0.50"
            stroke-width="2.6"
          />
          <rect
            x="134"
            y="88"
            width="40"
            height="136"
            rx="6"
            fill="#A855F7"
            fill-opacity="0.28"
            stroke="#A855F7"
            stroke-opacity="0.50"
            stroke-width="2.6"
          />
          <rect
            x="186"
            y="46"
            width="40"
            height="178"
            rx="6"
            fill="#A855F7"
            fill-opacity="0.75"
            stroke="#A855F7"
            stroke-opacity="0.95"
            stroke-width="2.6"
          />
        </g>
      </svg>
      <div class="edge"></div>
    </div>
  </body>
</html>
