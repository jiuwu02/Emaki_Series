<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>banner</title>
    <style>
      @font-face {
        font-family: "MSYH";
        src: local("Microsoft YaHei");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #0a0d12;
      }
      .banner {
        position: relative;
        width: 1200px; /* 1:4 */
        height: 300px;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        isolation: isolate;
      }
      /* AI artwork sits underneath, desaturated and darkened so type stays legible. */
      .art {
        position: absolute;
        inset: 0;
        filter: saturate(0.85) contrast(1.05);
      }
      .art svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Directional scrim: dense behind the text, clearing toward the artwork side. */
      .scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            100deg,
            rgba(6, 9, 14, 0.96) 0%,
            rgba(6, 9, 14, 0.92) 34%,
            rgba(6, 9, 14, 0.74) 48%,
            rgba(6, 9, 14, 0.3) 62%,
            rgba(6, 9, 14, 0.1) 78%,
            rgba(6, 9, 14, 0.26) 100%
          ),
          radial-gradient(
            90% 120% at 6% 50%,
            rgba(6, 9, 14, 0.55) 0%,
            transparent 60%
          );
      }
      /* Accent wash keyed per module, kept low so it reads as light not as a filter. */
      .wash {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          120% 150% at 88% 18%,
          var(--accent-glow) 0%,
          transparent 62%
        );
        mix-blend-mode: screen;
      }
      .edge {
        position: absolute;
        inset: 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -1px 0 rgba(0, 0, 0, 0.55);
      }
      /* English subtitles run 87-115 characters against 20-39 for Chinese, so
         the text column and subtitle size are set per language by the builder
         rather than shared. */
      .content {
        position: relative;
        height: 100%;
        padding: 0 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--gap, 18px);
        max-width: var(--col, 700px);
      }
      /* Rule carries the same two stops as the title, so the accent reads as
         one gradient across the whole composition. */
      .rule {
        width: 46px;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--accent) 0%,
          var(--accent-2) 100%
        );
        box-shadow: 0 0 18px var(--accent-glow);
      }
      /* One continuous gradient over "Emaki" + suffix, matching the
         <gradient:a:b> prefix each plugin renders in chat. The drop shadow has
         to move to a wrapper: background-clip:text clips text-shadow too. */
      .name {
        font-size: var(--name-size, 62px);
        font-weight: 700;
        letter-spacing: -0.022em;
        line-height: 0.98;
        filter:
          drop-shadow(0 2px 14px rgba(0, 0, 0, 0.8))
          drop-shadow(0 1px 2px rgba(0, 0, 0, 0.9));
      }
      .name .ink {
        background: linear-gradient(
          96deg,
          var(--accent) 0%,
          var(--accent-2) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .desc {
        font-size: var(--desc-size, 24px);
        font-weight: 400;
        line-height: 1.42;
        color: #c3cfdd;
        letter-spacing: 0.005em;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85);
        text-wrap: balance;
        /* Chinese has no spaces, so the default rules allow a break between any
           two characters and split words like "结果" across lines. keep-all
           confines breaks to the punctuation, which is where a reader expects
           them. Harmless for English, which breaks at spaces either way.
           The cost is that a run between two punctuation marks can no longer
           wrap, so an over-long run would overflow instead; _brender guards
           that on every build. */
        word-break: keep-all;
      }
    </style>
  </head>
