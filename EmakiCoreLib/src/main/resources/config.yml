# EmakiCoreLib 主配置
# 为其他 Emaki 模块提供 GUI、展示实体、事件、动作、对话框与语言表能力。

version: "4.8.4"

# 对应 lang/<language>.yml。
language: "zh_CN"

# 当前默认资源释放流程不使用此兼容项。
release_default_data: true

# global_all 启用 CoreLib DebugLogger 的模块默认输出。
debug:
  global_all: false

# 菜单（GUI）渲染后端
gui:
  # 菜单后端类型：
  #   bukkit：使用服务端容器；无需 PacketEvents。
  #   packet：使用 PacketEvents 发包渲染；不可用时回退 bukkit。
  #   auto：有可用 PacketEvents 时使用 packet，否则使用 bukkit。
  # 默认 bukkit，便于在无额外前置时运行。
  backend: "bukkit"
  # 同一玩家两次菜单点击的最小间隔，单位：毫秒；0 表示不限制。
  # 间隔内的后续点击不会交给菜单业务处理。
  click_interval_ms: 100

# 展示实体渲染后端，供伤害飘字、工位文本与物品展示等功能共用。
display:
  # 展示实体后端类型：
  #   bukkit：使用服务端展示实体。
  #   packet：使用 PacketEvents 发送虚拟展示实体；不可用时回退 bukkit。
  #   auto：自动选择可用后端。
  #   inherit：跟随 gui.backend。
  backend: "auto"
  # packet 后端的可见距离，单位：方块。
  view_distance_blocks: 48
  # packet 后端重新计算可见性的间隔，单位：tick。
  refresh_interval_ticks: 20

# MiniMessage 文本渲染
minimessage:
  # 默认取消斜体。原版对物品名称与 Lore 默认套用斜体，开启后 Emaki 系列所有文本
  # (菜单物品名与 Lore、菜单标题、聊天消息、对话框)在未显式声明斜体时一律不倾斜。
  # 这是“默认值”而非强制值：文本中显式写出 <i> 或 <italic> 仍然生效。
  default_no_italic: true

# 服务端侧原版语言表。
# 供仓库名称搜索等需要本地化物品/方块名称的功能使用。
vanilla_language:
  # 是否启用语言表下载与缓存；首次缺少缓存时会访问 Mojang 资源索引。
  # 缓存位于 plugins/EmakiCoreLib/lang-cache/；下载失败时相关本地化功能不可用。
  enabled: false
  # 原版语言 ID，与客户端语言文件名一致，例如 zh_cn、en_us、zh_tw。
  locale: "zh_cn"

# 原版对话框。
# 用于向支持该协议能力的客户端展示文本、输入框与按钮。
dialog:
  # 总开关；关闭后不加载对话框定义，DialogApi 不可用。
  enabled: true
  # 定义文件目录，相对 plugins/EmakiCoreLib/；加载目录内的 .yml 文件。
  directory: "dialogs"

# 统一游戏事件层。
# CoreLib 捕获常见玩法事件并转发给订阅这些事件的 Emaki 模块。
gameplay_events:
  # 总开关；关闭后不再发布共享游戏事件。
  enabled: true
  # 无直接击杀者时保留“最后攻击玩家”的时间，单位：tick。
  last_damager_expire_ticks: 200
  # 保留最后一次酿造台操作归因的时间，单位：tick。
  # 订阅方可以使用更短的业务窗口。
  brew_attribution_expire_ticks: 6000

action:
  # 动作管道的加载期编译上限；超限配置会被拒绝。
  pipeline:
    # every ... times ... 的最大重复次数。
    max_repeat_times: 100
    # run 序列的最大嵌套深度。
    max_sequence_depth: 8
    # if 分支的最大嵌套深度。
    max_branch_depth: 16
  # 长期循环任务的调度与数量限制。
  loop:
    enabled: true
    min_sync_interval: 5t
    min_async_interval: 100ms
    max_times: 7200
    max_active_loops_total: 5000
    max_active_loops_per_player: 16
    max_active_loops_per_plugin: 1000
    cancel_player_loops_on_quit: true
    cancel_plugin_loops_on_disable: true
  # 命名动作序列通过 run <名称> 调用，可传入 key=value 参数。
