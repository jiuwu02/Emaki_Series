# Runtime-neutral item component catalog for Paper.
# Java and Web capability views should treat this resource as the maintained source of known IDs.
components:
  - id: minecraft:max_stack_size
    format: integer 1..99
  - id: minecraft:max_damage
    format: positive integer
  - id: minecraft:damage
    format: non-negative integer
  - id: minecraft:unbreakable
    format: "unit: true, null, or empty map"
    non_valued: true
  - id: minecraft:custom_name
    format: MiniMessage string or vanilla text component map/list
  - id: minecraft:item_name
    format: MiniMessage string or vanilla text component map/list
  - id: minecraft:lore
    format: MiniMessage string/list or vanilla text component list
  - id: minecraft:rarity
    format: common, uncommon, rare, or epic
  - id: minecraft:enchantments
    format: direct enchantment resource id to level map
  - id: minecraft:can_place_on
    format: vanilla adventure predicate map
  - id: minecraft:can_break
    format: vanilla adventure predicate map
  - id: minecraft:attribute_modifiers
    format: direct attribute modifier list
  - id: minecraft:custom_model_data
    format: map containing floats/flags/strings/colors
  - id: minecraft:repair_cost
    format: non-negative integer
  - id: minecraft:enchantment_glint_override
    format: boolean
  - id: minecraft:intangible_projectile
    format: "unit: true, null, or empty map"
    non_valued: true
  - id: minecraft:food
    format: vanilla food properties map
  - id: minecraft:consumable
    format: vanilla consumable map
  - id: minecraft:use_remainder
    format: item stack map
  - id: minecraft:use_cooldown
    format: vanilla cooldown map
  - id: minecraft:damage_resistant
    format: damage type tag map
  - id: minecraft:tool
    format: vanilla tool rules map
  - id: minecraft:weapon
    format: vanilla weapon properties map
  - id: minecraft:enchantable
    format: map containing positive integer value
  - id: minecraft:equippable
    format: vanilla equippable map
  - id: minecraft:repairable
    format: repair item/tag map
  - id: minecraft:glider
    format: "unit: true, null, or empty map"
    non_valued: true
  - id: minecraft:item_model
