  - id: minecraft:item_model
    name: 物品模型
    description: "覆盖物品使用的模型资源 ID。<newline><gray>使用命名空间资源 ID。</gray>"
    icon: minecraft-armor_stand
    format: namespaced resource id
  - id: minecraft:tooltip_style
    name: 提示样式
    description: "切换物品提示框的配色样式。<newline><gray>使用命名空间资源 ID。</gray>"
    icon: minecraft-oak_sign
