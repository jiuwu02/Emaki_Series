# Paper 物品组件目录。
# CoreLib 的 MinecraftItemComponentCatalog 从这里读取可识别的组件 ID、值格式与适用材料；资源缺失或解析失败时会回退到内置目录。
#
# 字段说明：
#   id          组件 ID；省略命名空间时默认 minecraft:
#   name        组件显示名；供 GUI 物品编辑器展示，支持 MiniMessage 字符串
#   description 组件详细说明；作为 GUI 悬浮说明（lore）展示，中文 MiniMessage 字符串，
#               支持用 MiniMessage 的 <newline> 标记换行以实现多行说明
#   icon        组件 GUI 图标所用的物品来源；格式为 minecraft-<material>，其中 <material>
#               必须是真实存在的 Bukkit 材料名（小写），如 minecraft-cooked_beef、minecraft-potion
#   format      值格式说明，供 GUI 编辑器提示与文档展示使用
#   non_valued  无值组件（只可 set/unset/reset，不写值）
#   scope       universal = 对任意物品材料都能真正生效（省略 scope 即视为 universal）；material = 仅对 applies_to 列出的材料有意义，且 applies_to 不得为空
#   applies_to  适用材料 ID 列表（仅 scope: material 需要），GUI 编辑器据此自适应加载专属编辑入口
#
# 说明：本目录是元数据与识别面，运行期是否真正支持由 Paper 组件注册表决定；
# 两者的并集即 `ItemComponentCapability` 面向消费方暴露的能力。

components:
  # ============================================================
  # 通用组件（scope 省略 = universal，任意物品材料均适用）
  # ============================================================
  - id: minecraft:max_stack_size
    name: 最大堆叠数
    description: "设置单个槽位可堆叠的最大数量。<newline><gray>取值 1~99，需与材料自身堆叠上限协调。</gray>"
    icon: minecraft-bundle
    format: integer 1..99
  - id: minecraft:max_damage
    name: 最大耐久
    description: "定义物品可承受的最大耐久值。<newline><gray>决定耐久条上限，须为正整数。</gray>"
    icon: minecraft-anvil
    format: positive integer
  - id: minecraft:damage
    name: 当前耐久损耗
    description: "设置物品当前已损耗的耐久值。<newline><gray>0 表示满耐久，不得为负。</gray>"
    icon: minecraft-iron_sword
    format: non-negative integer
  - id: minecraft:unbreakable
    name: 无法破坏
    description: "使物品不消耗耐久、永不损坏。<newline><gray>无值组件，只可设置或移除。</gray>"
    icon: minecraft-netherite_ingot
    format: "unit: true, null, or empty map"
    non_valued: true
  - id: minecraft:custom_name
    name: 自定义名称
    description: "以斜体样式显示的物品名称。<newline><gray>支持 MiniMessage 或原版文本组件。</gray>"
    icon: minecraft-name_tag
    format: MiniMessage string or vanilla text component map/list
  - id: minecraft:item_name
    name: 物品名称
    description: "不带斜体的物品显示名称。<newline><gray>支持 MiniMessage 或原版文本组件。</gray>"
    icon: minecraft-paper
    format: MiniMessage string or vanilla text component map/list
  - id: minecraft:lore
    name: 物品描述
    description: "在名称下方追加的说明文本。<newline><gray>支持多行 MiniMessage 或文本组件列表。</gray>"
    icon: minecraft-book
    format: MiniMessage string/list or vanilla text component list
  - id: minecraft:rarity
    name: 稀有度
    description: "设置物品的稀有度颜色与提示。<newline><gray>可选 common/uncommon/rare/epic。</gray>"
    icon: minecraft-diamond
    format: common, uncommon, rare, or epic
  - id: minecraft:enchantments
    name: 附魔
    description: "为物品附加附魔及等级。<newline><gray>以附魔资源 ID 到等级映射表示。</gray>"
    icon: minecraft-enchanted_book
    format: direct enchantment resource id to level map
  - id: minecraft:can_place_on
    name: 可放置于
    description: "限定物品可放置方块的冒险谓词。<newline><gray>使用原版冒险模式谓词映射。</gray>"
    icon: minecraft-grass_block
    format: vanilla adventure predicate map
  - id: minecraft:can_break
    name: 可破坏
    description: "限定物品可破坏方块的冒险谓词。<newline><gray>使用原版冒险模式谓词映射。</gray>"
    icon: minecraft-iron_pickaxe
    format: vanilla adventure predicate map
  - id: minecraft:attribute_modifiers
    name: 属性修饰符
    description: "为持有者附加属性加成。<newline><gray>使用直接属性修饰符列表。</gray>"
    icon: minecraft-iron_chestplate
    format: direct attribute modifier list
  - id: minecraft:custom_model_data
    name: 自定义模型数据
    description: "供资源包识别并替换模型。<newline><gray>可包含浮点、标志、字符串与颜色。</gray>"
    icon: minecraft-item_frame
    format: map containing floats/flags/strings/colors
  - id: minecraft:enchantment_glint_override
    name: 附魔光效覆盖
    description: "强制显示或隐藏附魔光效。<newline><gray>布尔值，独立于实际附魔。</gray>"
    icon: minecraft-glow_ink_sac
