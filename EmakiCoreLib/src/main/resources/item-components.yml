  - id: minecraft:custom_data
    name: 自定义数据
    description: "附加任意自定义 NBT 数据。<newline><gray>可用普通映射或 $snbt 原始 SNBT。</gray>"
    icon: minecraft-command_block
    format: "plain map or {$snbt: raw SNBT}"

