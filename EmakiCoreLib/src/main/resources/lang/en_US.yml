      type_required: "<red>[Pipeline] This stage requires type</red>"
      unknown_type: "<red>[Pipeline] Unknown nutrition type %type%</red>"
      no_types: "<gray>[Pipeline] No nutrition types are registered</gray>"
      operation_failed: "<red>[Pipeline] The EmakiCooking nutrition operation failed: %reason%</red>"
