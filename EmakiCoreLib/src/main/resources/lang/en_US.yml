# EmakiCoreLib English language resource.
# Messages use MiniMessage; preserve placeholders documented beside message groups.
# version is maintained by resource synchronization when default keys are merged.

version: "4.8.0"

general:
  prefix: "<gray>[ <gradient:#FF80FF:#00FFFF>EmakiCoreLib</gradient> ]</gray>"

gui:
  backend:
    packet_backend_missing: "<yellow>Menu backend is set to packet, but PacketEvents is not installed (or the packet backend failed to register); falling back to the Bukkit (entity) backend.</yellow>"
    unknown_value: "<yellow>Unknown menu backend <aqua>%value%</aqua>; using the default Bukkit (entity) backend.</yellow>"

console:
  plugin_starting: "<gray>Starting...</gray>"
  plugin_started: "<green>Started</green>"
  plugin_stopped: "<yellow>Stopped</yellow>"
  config_precheck_passed: "<gray>Config precheck passed: <yellow>%issues%</yellow> issue(s).</gray>"
  config_precheck_failed: "<red>Config precheck failed: <yellow>%issues%</yellow> issue(s).</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray>(%hint%)</dark_gray>"
    messages:
      passed: "CoreLib config precheck passed."
      required_file_missing: "Required file does not exist."
      path_not_file: "Path is not a file."
      file_not_readable: "File is not readable."
      required_directory_missing: "Required directory does not exist."
      path_not_directory: "Path is not a directory."
      directory_not_readable: "Directory is not readable."
      unknown_module: "Unknown config precheck module. Available modules: %modules%"
      contributor_failed: "Config precheck contributor failed: %error%"
      loop_max_times_invalid: "max_times must be greater than 0."
      loop_min_sync_interval_invalid: "min_sync_interval cannot be lower than 1 tick."
      loop_min_async_interval_invalid: "min_async_interval cannot be lower than 1 tick."
      loop_active_limits_invalid: "Active loop limits must be greater than 0."
      template_blank_id: "Template ID cannot be blank."
      template_action_unregistered: "Action is not registered during precheck: %action%"
      template_invalid_syntax: "Invalid action syntax at line %line%: %error%"
      template_missing_reference: "Template references a missing template: %template%"
      loop_template_required: "%action% requires template."
      loop_template_missing: "%action% references a missing template: %template%"
      loop_times_numeric: "%action% requires numeric times."
      loop_times_positive: "%action% times must be greater than 0."
      loop_times_exceeds_max: "%action% times exceeds max_times."
      loop_interval_invalid: "%action% requires a valid interval."
      loop_interval_below_min: "%action% interval is lower than the configured minimum."
      loop_initial_delay_invalid: "%action% initial_delay is invalid."
      loop_async_nested_template: "loopasync template cannot include nested usetemplate: %template%"
      loop_async_unsafe_action: "loopasync template contains a non-async-safe action: %action%"
      loop_async_invalid_syntax: "Invalid loopasync template syntax at line %line%: %error%"
      cancel_loop_key_required: "cancelloop requires key."
      cancel_loop_match_invalid: "cancelloop match must be exact or prefix."
      cancel_loop_silent_invalid: "cancelloop silent must be boolean."
      loop_mode_invalid: "%action% mode must be replace, refresh, ignore, or allow_duplicate."
      loop_stop_if_offline_invalid: "%action% stop_if_offline must be boolean."
      loop_stop_if_dead_invalid: "%action% stop_if_dead must be boolean."
      loop_stop_on_failure_invalid: "%action% stop_on_failure must be boolean."
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  economy_bridge_ready: "<gray>Economy bridge connected: <aqua>%provider%</aqua></gray>"
  block_source_bridge_ready: "<gray>Block source connected: <aqua>%provider%</aqua></gray>"
  bstats_registered: "<gray>bStats metrics registered: <aqua>%plugin%</aqua> <dark_gray>(pluginId=%plugin_id%)</dark_gray></gray>"
  bstats_register_failed: "<yellow>bStats metrics registration failed and was skipped: <aqua>%plugin%</aqua> <dark_gray>(pluginId=%plugin_id%, %error%)</dark_gray></yellow>"
  bstats_closed: "<gray>bStats metrics closed: <aqua>%plugin%</aqua></gray>"
  bstats_close_failed: "<yellow>Failed to close bStats metrics: <aqua>%plugin%</aqua> <dark_gray>(%error%)</dark_gray></yellow>"
  bstats_config_directory_create_failed: "<yellow>Failed to create bStats config directory: %path%</yellow>"
  bstats_config_write_failed: "<yellow>Failed to write bStats config: %path% (%error%)</yellow>"
  action_config_load_failed: "<red>Failed to load action config: %error%</red>"
  item_source_bridge_ready: "<gray>Item source connected: <aqua>%library%</aqua></gray>"
  item_source_bridge_waiting: "<gray>Detected <aqua>%library%</aqua>, waiting for item registration: %detail%</gray>"
  item_source_bridge_incompatible: "<yellow><aqua>%library%</aqua> item source not connected: %detail%</yellow>"
  item_source:
    waiting_detail:
      itemsadder: "The plugin is enabled, but item registration has not finished. Wait for its loading flow to complete."
      craftengine: "The plugin is enabled, but its item table has not finished reloading. Wait for its reload event to complete."
      neigeitems: "The plugin is enabled, but its item library has not finished refreshing. Wait for its reload to complete."
      nexo: "The plugin is enabled, but its item table has not finished initializing. Wait for its load event to complete."
      oraxen: "The plugin is enabled, but its item table has not finished initializing. Wait for its load event to complete."
      ecoitems: "The plugin is enabled, but its item registry is not ready yet. Wait for its loading to complete."
      default: "External item registration has not finished. Wait for the dependency plugin to finish loading."
    incompatible_detail: "%library% was detected, but its current API shape is incompatible with the CoreLib adapter."

loader:
  lang_directory_create_failed: "<red>Failed to create language directory: %path%</red>"
  bundled_language_load_failed: "<red>Failed to load bundled language: %error%</red>"
  bundled_resource_missing: "<red>Bundled resource missing: %resource%, cannot write to %path%</red>"
  bundled_resource_write_failed: "<red>Failed to write bundled resource: %path% (%error%)</red>"
  directory_create_failed: "<red>Failed to create directory: %path%</red>"
  invalid_blank_id: "<red>%type% file %file% has a blank ID.</red>"
  duplicate_id: "<red>Skipped duplicate %type% ID %id%: %file%</red>"
  load_failed: "<red>Failed to load %type% file %file%: %error%</red>"

action:
  debug_execution: "<gray>[Action]</gray> <white>phase=%phase%</white>
    <white>id=%id%</white> <gray>args=%args%</gray>"
  execute_failed: "<red>[Action] Failed to execute %action%: %error%</red>"
  register:
    blank_id: "<red>[Pipeline] Stage id is blank; registration refused</red>"
    duplicate_id: "<red>[Pipeline] Duplicate stage id; registration refused</red>"
    registry_unavailable: "<red>[Pipeline] The stage registry is not ready yet; registration refused</red>"
    undeclared_domain: "<red>[Pipeline] Stage %stage% declared no thread domain; registration refused</red>"
    async_needs_target: "<red>[Pipeline] Stage %stage% declares the async domain but requires a target
      (%requirement%); registration refused</red>"
    key_type_conflict: "<red>[Pipeline] Context key %key% type conflict: existing %existing%,
      %stage% declares %declared%</red>"
  diagnostic:
    at_column: "<gray>(column %column%)</gray>"
    at_file: "<gray>(%file% at %key_path%, line %line% column %column%)</gray>"
    candidates: "<gray> Valid values: <white>%candidates%</white></gray>"
    more_problems: "<gray> This line has <yellow>%count%</yellow> more problem(s); they will be reported once this one is fixed.</gray>"
    unknown_reason: "<red>[Pipeline] Validation failed (diagnostic key %reason% has no message yet; please report this key)</red>"
  lex:
    unclosed_quote: "<red>[Pipeline] Unclosed quote; the quote opened at column %column% has no closing quote</red>"
  parse:
    unexpected_token: "<red>[Pipeline] Leftover content that cannot be parsed: %token%</red>"
    empty_pipeline: "<red>[Pipeline] This line contains no stages</red>"
    empty_stage: "<red>[Pipeline] Empty stage name; a stage is required between two | separators</red>"
    missing_pipe: "<red>[Pipeline] Missing separator | before %token%; adjacent stages must be split with |</red>"
    trailing_pipe: "<red>[Pipeline] The line ends with |; a stage must follow it</red>"
    unmatched_bracket_close: "<red>[Pipeline] Extra ] with no matching [</red>"
    unexpected_bracket_open: "<red>[Pipeline] [ cannot appear here; brackets are only for if/else branch bodies</red>"
    unclosed_bracket: "<red>[Pipeline] The [ opened by %keyword% at column %open_column% is never closed; a matching ] is missing</red>"
    branch_missing_condition: "<red>[Pipeline] if has no condition; write it as if <condition> [ ... ]</red>"
    branch_missing_body: "<red>[Pipeline] %keyword% has no branch body wrapped in [ ]</red>"
    empty_branch_body: "<red>[Pipeline] The branch body at column %open_column% is empty; [ ] must contain stages</red>"
    weight_missing_option: "<red>[Pipeline] weight needs at least one \"<weight> [ ... ]\" branch;
      write it as weight 70 [ ... ] 30 [ ... ]</red>"
    weight_named_argument: "<red>[Pipeline] weight values must be unnamed; received the
      name=value form %token%</red>"
    run_missing_sequence: "<red>[Pipeline] run has no sequence name; write it as run <sequence> name=value</red>"
    run_positional_parameter: "<red>[Pipeline] run parameters must be written as name=value; got the bare argument %token%</red>"
    duplicate_argument: "<red>[Pipeline] Argument %argument% appears twice; each argument may only be given once per stage</red>"
    stage_name_is_argument: "<red>[Pipeline] The stage name position holds a name=value form (%token%); a stage name cannot contain =</red>"
  validate:
    empty_pipeline: "<red>[Pipeline] This line contains no stages; at least one stage is required</red>"
    missing_self_source: "<red>[Pipeline] Omitting the source needs the builtin self source, which is
      currently unavailable; write an explicit source stage at the start of the line</red>"
    unknown_stage: "<red>[Pipeline] Unknown stage %token%</red>"
    stage_owner_disabled: "<red>[Pipeline] Stage %stage% is provided by plugin %owner%,
      which is currently disabled</red>"
    multiple_sources: "<red>[Pipeline] A pipeline may only have one source stage; %stage% is the second</red>"
    source_after_action: "<red>[Pipeline] Source stage %stage% cannot follow an action stage; a source must
      come first on the line</red>"
    gate_after_action: "<red>[Pipeline] Gate stage %stage% cannot follow an action stage; the target
      flow has already been consumed</red>"
    missing_required_argument: "<red>[Pipeline] Missing required argument %argument%</red>"
    unknown_argument: "<red>[Pipeline] Unknown argument %token%</red>"
    invalid_argument_type: "<red>[Pipeline] Argument %argument% value %value% is not a valid
      %expected%</red>"
    positional_not_allowed: "<red>[Pipeline] Stage %stage% accepts no bare arguments but got
      <white>%value%</white>; its arguments must be written as name=value</red>"
    too_many_positional_arguments: "<red>[Pipeline] Too many bare arguments: at most %maximum%,
      got %actual%</red>"
    argument_both_named_and_positional: "<red>[Pipeline] Argument %token% was given both named
      and bare</red>"
    missing_context_key: "<red>[Pipeline] Stage %stage% requires context %key%(%type%),
      which phase %phase% does not provide</red>"
    missing_variable: "<red>[Pipeline] Variable %variable% is not provided by phase %phase% or an earlier stage</red>"
    bare_variable_reference: "<red>[Pipeline] Variable %variable% must be written as %expected%, not as a bare placeholder</red>"
    missing_inherited_targets: "<red>[Pipeline] Stage inherited needs a carried target flow, but phase %phase% does not declare one</red>"
    invalid_every_syntax: "<red>[Pipeline] Invalid every syntax; expected %expected%</red>"
    invalid_repeat_times: "<red>[Pipeline] Repeat count %value% is not a valid non-negative
      integer</red>"
    repeat_must_be_literal: "<red>[Pipeline] Repeat count must be a literal, not the placeholder
      %value%</red>"
    repeat_limit_exceeded: "<red>[Pipeline] Repeat count %value% exceeds the limit %maximum%</red>"
    branch_depth_exceeded: "<red>[Pipeline] Branch nesting depth %depth% exceeds the limit
      %maximum%</red>"
    invalid_weight: "<red>[Pipeline] Weight %value% is not a valid number; a weight must be a
      non-negative number, expression, or placeholder</red>"
    negative_weight: "<red>[Pipeline] Weight %value% is negative; a weight must be greater than or
      equal to 0 (use 0 to disable that branch)</red>"
    weight_total_not_positive: "<red>[Pipeline] The weight total is %total%; at least one branch must
      have a weight above 0, otherwise this stage can never select a branch</red>"
    unknown_sequence: "<red>[Pipeline] Unknown sequence %token%</red>"
    missing_sequence_parameter: "<red>[Pipeline] Sequence %sequence% is missing parameter
      %parameter%</red>"
    sequence_cycle: "<red>[Pipeline] Sequence calls form a cycle: %path%</red>"
    thread_domain_undeclared: "<red>[Pipeline] Stage %stage% declared no thread domain</red>"
    async_stage_requires_target: "<red>[Pipeline] Stage %stage% declares the async domain but
      requires a target (%requirement%)</red>"
  run:
    empty_pipeline: "<gray>[Pipeline] This pipeline has no executable stages</gray>"
    stage_unavailable: "<red>[Pipeline] Stage is currently unavailable</red>"
    no_target: "<gray>[Pipeline] No target to act on</gray>"
    all_targets_invalid: "<gray>[Pipeline] Every target became invalid before execution</gray>"
    partial_targets: "<yellow>[Pipeline] Some targets failed</yellow>"
    invalid_condition: "<red>[Pipeline] Condition %condition% could not be evaluated</red>"
    invalid_weight: "<red>[Pipeline] Weight %value% failed to evaluate at runtime or is negative;
      check the placeholders inside it</red>"
    weight_not_rolled: "<gray>[Pipeline] Every weight branch has a weight of 0, so no branch was
      selected this time</gray>"
    unknown_sequence: "<red>[Pipeline] Sequence %sequence% was not found at run time</red>"
    sequence_depth_exceeded: "<red>[Pipeline] Sequence %sequence% exceeds the maximum nesting depth
      %maximum%</red>"
    timeout: "<red>[Pipeline] Stage execution timed out</red>"
    cancelled: "<gray>[Pipeline] Execution was cancelled</gray>"
    owner_disabled: "<red>[Pipeline] The owning plugin is disabled: %error%</red>"
    target_retired: "<gray>[Pipeline] The target became invalid before the delayed run: %error%</gray>"
    timing_without_body: "<gray>[Pipeline] A timing stage has no stages after it</gray>"
    exception: "<red>[Pipeline] A stage threw an exception during execution: %error%</red>"
  task:
    empty_body: "<red>[Pipeline] That sequence has no runnable lines</red>"
    times_out_of_range: "<red>[Pipeline] times is out of range; adjust action.pipeline.max_repeat_times</red>"
    interval_too_small: "<red>[Pipeline] interval is below the configured minimum</red>"
    total_limit_reached: "<red>[Pipeline] The server-wide active task limit has been reached</red>"
    player_limit_reached: "<red>[Pipeline] That player's active task limit has been reached</red>"
    plugin_limit_reached: "<red>[Pipeline] That plugin's active task limit has been reached</red>"
    exception: "<red>[Pipeline] Stage threw an exception: %error%</red>"
  # Builtin source-stage diagnostics.
  source:
    self:
      no_caster: "<gray>[Pipeline] The self source has no caster</gray>"
    inherited:
      no_targets: "<gray>[Pipeline] The inherited source has no targets to inherit</gray>"
    trigger:
      no_trigger: "<gray>[Pipeline] The trigger source has no trigger information</gray>"
      not_online: "<gray>[Pipeline] The player named by trigger is not online</gray>"
    origin:
      no_origin: "<gray>[Pipeline] The origin source has no usable origin</gray>"
    looking_at:
      no_living_caster: "<gray>[Pipeline] looking_at requires a living caster</gray>"
      no_hit: "<gray>[Pipeline] looking_at hit no entity</gray>"
      invalid_ray: "<red>[Pipeline] The range or width of looking_at is invalid</red>"
    nearby:
      no_origin: "<gray>[Pipeline] The nearby source has no usable origin</gray>"
      no_match: "<gray>[Pipeline] nearby found no matching entity</gray>"
      unknown_entity_type: "<red>[Pipeline] Unknown entity type %type% for nearby</red>"
    nearby_players:
      no_origin: "<gray>[Pipeline] The nearby_players source has no usable origin</gray>"
      no_match: "<gray>[Pipeline] nearby_players found no player</gray>"
    offset:
      no_origin: "<gray>[Pipeline] The offset source has no usable origin</gray>"
    at:
      world_required: "<red>[Pipeline] The at source requires world when there is no origin</red>"
      world_not_found: "<red>[Pipeline] World %world% for the at source does not exist</red>"
      relative_without_origin: "<red>[Pipeline] The at source cannot use ~ coordinates without an
        origin</red>"
    player_by_name:
      name_required: "<red>[Pipeline] player_by_name requires name</red>"
      not_online: "<gray>[Pipeline] The player named by player_by_name is not online</gray>"
  gate:
    where:
      condition_required: "<red>[Pipeline] where requires a condition</red>"
      invalid_condition: "<red>[Pipeline] The where condition %condition% cannot be evaluated</red>"
    chance:
      chance_required: "<red>[Pipeline] chance requires a probability</red>"
      invalid_chance: "<red>[Pipeline] The chance probability must be between 0 and 1</red>"
      not_rolled: "<gray>[Pipeline] The chance roll did not pass</gray>"
    limit:
      invalid_count: "<red>[Pipeline] The limit count must be a non-negative integer</red>"
    sort_by:
      unknown_key: "<red>[Pipeline] Unknown sort_by key %key%; expected distance or health</red>"
      unknown_order: "<red>[Pipeline] Unknown sort_by order %order%; expected asc or desc</red>"
    set:
      no_assignment: "<red>[Pipeline] set requires at least one assignment</red>"
    stop:
      stopped: "<gray>[Pipeline] Ended by the stop stage</gray>"
  stage:
    common:
      not_entity: "<gray>[Pipeline] This stage requires an entity target</gray>"
      not_living_entity: "<gray>[Pipeline] This stage requires a living entity target</gray>"
      not_player: "<gray>[Pipeline] This stage requires a player target</gray>"
      not_location: "<gray>[Pipeline] This stage requires a location target</gray>"
      no_location: "<gray>[Pipeline] This stage requires a target with a position</gray>"
    script:
      eval:
        empty_code: "<gray>[Script] Script code is empty, skipped</gray>"
        timeout: "<yellow>[Script] Script execution timed out</yellow>"
        interrupted: "<yellow>[Script] Script execution was interrupted</yellow>"
        error: "<red>[Script] Script execution failed: %error_message%</red>"
    play_sound:
      unknown_sound: "<red>[Pipeline] Unknown sound %sound%</red>"
    spawn_particle:
      unknown_particle: "<red>[Pipeline] Unknown particle %particle%</red>"
    boss_bar:
      id_required: "<red>[Pipeline] Boss bar stages require id</red>"
      unknown_color: "<red>[Pipeline] Unknown boss bar color %color%</red>"
      unknown_style: "<red>[Pipeline] Unknown boss bar style %style%</red>"
      unknown_flag: "<red>[Pipeline] Unknown boss bar flag %flag%</red>"
      show_failed: "<red>[Pipeline] Unable to show a boss bar for id %id%</red>"
      none_active: "<gray>[Pipeline] The target has no active boss bar</gray>"
      not_found: "<gray>[Pipeline] No boss bar found for that id</gray>"
    kill_entity:
      player_target: "<gray>[Pipeline] kill_entity does not act on players; use set_health
        amount=0</gray>"
      already_dead: "<gray>[Pipeline] The target entity is already dead</gray>"
    potion:
      unknown_effect: "<red>[Pipeline] Unknown potion effect %type%</red>"
      effect_absent: "<gray>[Pipeline] The target does not have that potion effect</gray>"
      none_active: "<gray>[Pipeline] The target has no active potion effect</gray>"
    task:
      service_unavailable: "<red>[Pipeline] The long-running task service is unavailable</red>"
      context_unavailable: "<red>[Pipeline] Long-running tasks need a full pipeline context</red>"
      sequence_required: "<red>[Pipeline] start_task requires a sequence</red>"
      unknown_sequence: "<red>[Pipeline] Undefined sequence %sequence%</red>"
      key_required: "<red>[Pipeline] stop_task requires a key</red>"
      none_matched: "<gray>[Pipeline] No task matched that key</gray>"
    item:
      invalid_item_source: "<red>[Pipeline] Item source %item_source% is invalid</red>"
      service_unavailable: "<red>[Pipeline] The item source service is currently unavailable</red>"
      create_failed: "<red>[Pipeline] Unable to create an item from source %item_source%</red>"
      created_air: "<gray>[Pipeline] The item created from that source was air</gray>"
      no_pipeline_item: "<gray>[Pipeline] The pipeline holds no item; use create_item first</gray>"
      unknown_slot: "<red>[Pipeline] Unsupported slot %slot%</red>"
      slot_empty: "<gray>[Pipeline] That slot holds no item</gray>"
      source_mismatch: "<gray>[Pipeline] The item in that slot did not match the requested
        source</gray>"
      not_enough: "<gray>[Pipeline] Not enough matching items</gray>"
      remove_failed: "<red>[Pipeline] Failed to remove the matching items</red>"
      not_damageable: "<gray>[Pipeline] That item is not damageable</gray>"
      no_durability: "<gray>[Pipeline] That item has no durability</gray>"
      already_repaired: "<gray>[Pipeline] That item is already fully repaired</gray>"
      zero_damage: "<gray>[Pipeline] The damage amount must be greater than zero</gray>"
       # EmakiItem stages share this namespace with builtin item stages.
      inspector_unavailable: "<red>[Pipeline] The EmakiItem component inspector is currently unavailable</red>"
      empty_hand: "<gray>[Pipeline] The target's main hand is empty</gray>"
      no_result: "<red>[Pipeline] EmakiItem returned no item</red>"
      component_required: "<red>[Pipeline] This stage requires component</red>"
      bad_component_value: "<red>[Pipeline] Invalid component value: %error%</red>"
      no_target_item: "<red>[Pipeline] No item to act on: no slot, no pipeline item, and no player target</red>"
      target_empty: "<gray>[Pipeline] There is no item at the resolved target</gray>"
      component_exists: "<red>[Pipeline] The component already exists; use item_component_modify</red>"
      component_missing: "<red>[Pipeline] The component does not exist; use item_component_add</red>"
      component_absent: "<gray>[Pipeline] That component is not present on the item</gray>"
      component_unsupported: "<red>[Pipeline] This runtime does not support that component: %issues%</red>"
      patch_failed: "<red>[Pipeline] The component patch failed: %issues%</red>"
      patch_returned_nothing: "<red>[Pipeline] The component patch returned no item</red>"
      patch_error: "<red>[Pipeline] The component patch raised an error: %error%</red>"
    place_block:
      not_placeable: "<gray>[Pipeline] That source is not a placeable block</gray>"
      provider_unavailable: "<gray>[Pipeline] The custom block provider is currently
        unavailable</gray>"
      provider_refused: "<gray>[Pipeline] The custom block provider did not place that block</gray>"
      not_replaceable: "<gray>[Pipeline] The target block is not replaceable</gray>"
      cannot_place: "<gray>[Pipeline] A block cannot be placed at that position</gray>"
      build_denied: "<gray>[Pipeline] Building was denied at that position</gray>"
      place_cancelled: "<gray>[Pipeline] The block placement was cancelled</gray>"
    set_block:
      invalid_material: "<red>[Pipeline] The set_block material %material% or block_data
        %block_data% is invalid</red>"
      not_a_block: "<gray>[Pipeline] The set_block material must be a non-air block</gray>"
    break_block:
      already_air: "<gray>[Pipeline] The target block is already air</gray>"
      cancelled: "<gray>[Pipeline] The block break was cancelled</gray>"
      not_broken: "<gray>[Pipeline] The block was not broken</gray>"
    explosion:
      zero_power: "<gray>[Pipeline] The explosion power must be greater than zero</gray>"
    projectile:
      no_caster_entity: "<gray>[Pipeline] projectile requires a living caster</gray>"
      no_world: "<gray>[Pipeline] The projectile caster is not in any world</gray>"
      no_scheduler: "<red>[Pipeline] projectile has no scheduler available</red>"
    spawn_entity:
      unknown_entity_type: "<red>[Pipeline] Unknown entity type %type%</red>"
      not_spawnable: "<gray>[Pipeline] That entity type is not spawnable</gray>"
    teleport:
      world_not_found: "<red>[Pipeline] Teleport destination world %world% does not exist</red>"
      rejected: "<red>[Pipeline] The teleport was rejected</red>"
    money:
      service_unavailable: "<red>[Pipeline] The economy service is currently unavailable</red>"
      provider_unavailable: "<red>[Pipeline] The economy provider is unavailable: %error%</red>"
      currency_not_found: "<red>[Pipeline] The currency does not exist: %error%</red>"
      insufficient_balance: "<red>[Pipeline] Insufficient balance: %error%</red>"
      invalid_argument: "<red>[Pipeline] Invalid economy argument: %error%</red>"
      failed: "<red>[Pipeline] The economy operation failed: %error%</red>"
      no_result: "<red>[Pipeline] The economy operation returned no result</red>"
    command:
      dispatch_failed: "<red>[Pipeline] Command dispatch failed</red>"
    cast_mythic_skill:
      skill_required: "<red>[Pipeline] cast_mythic_skill requires skill</red>"
      unavailable: "<red>[Pipeline] MythicMobs is currently unavailable</red>"
      cast_failed: "<red>[Pipeline] MythicMobs skill %skill% failed to cast</red>"
      cast_error: "<red>[Pipeline] MythicMobs skill %skill% raised an error: %error%</red>"
    strengthen:
      service_unavailable: "<red>[Pipeline] The EmakiStrengthen service is currently unavailable</red>"
      empty_hand: "<gray>[Pipeline] The target's main hand is empty</gray>"
      rebuild_failed: "<red>[Pipeline] EmakiStrengthen could not rebuild that item</red>"
    gem:
