        component_absent: "<gray>[Pipeline] That component is not present on the item</gray>"
        component_unsupported: "<red>[Pipeline] This runtime does not support that component: %issues%</red>"
        patch_failed: "<red>[Pipeline] The component patch failed: %issues%</red>"
        patch_returned_nothing: "<red>[Pipeline] The component patch returned no item</red>"
        patch_error: "<red>[Pipeline] The component patch raised an error: %error%</red>"
      place_block:
        not_placeable: "<gray>[Pipeline] That source is not a placeable block</gray>"
        provider_unavailable: "<gray>[Pipeline] The custom block provider is currently
          unavailable</gray>"
        provider_refused: "<gray>[Pipeline] The custom block provider did not place that block</gray>"
