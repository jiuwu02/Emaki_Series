        rejected: "<red>[Pipeline] EmakiStorage refused that operation: %reason%</red>"
      attribute:
        service_unavailable: "<red>[Pipeline] The EmakiAttribute service is currently unavailable</red>"
        unknown_damage_cause: "<red>[Pipeline] Unknown damage cause %cause%</red>"
        damage_refused: "<red>[Pipeline] The attribute damage could not be applied</red>"
