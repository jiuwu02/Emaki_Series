# EmakiCoreLib English language resource
# Messages use MiniMessage; preserve placeholders documented beside message groups
# version is maintained by resource synchronization when default keys are merged

version: "5.0.10"

# tags: log/message category head texts; defined centrally by CoreLib, composed by the tagged send interface
tags:
  action: '[ action ]'
  animation: '[ animation ]'
  assembly: '[ assembly ]'
  chat: '[ chat ]'
  command: '[ command ]'
  component: '[ component ]'
  config: '[ config ]'
  debug: '[ debug ]'
  dialog: '[ dialog ]'
  display: '[ display ]'
  economy: '[ economy ]'
  editor: '[ editor ]'
  event: '[ event ]'
  gui: '[ gui ]'
  integration: '[ integration ]'
  item-source: "[ item source ]"
  journal: '[ journal ]'
  loader: '[ loader ]'
  matcher: '[ matcher ]'
  metrics: '[ metrics ]'
  persistence: '[ persistence ]'
  pipeline: '[ pipeline ]'
  refresh: '[ refresh ]'
  registry: '[ registry ]'
  reload: '[ reload ]'
  scheduler: '[ scheduler ]'
  script: '[ script ]'
  shutdown: '[ shutdown ]'
  spawn: '[ spawn ]'
  startup: '[ startup ]'
  text: '[ text ]'
  trigger: '[ trigger ]'

general:
  prefix: "<gray>[ <gradient:#FF80FF:#00FFFF>EmakiCoreLib</gradient> ]</gray>"

gui:
  backend:
    packet_backend_missing: "<yellow>Menu backend is set to packet, but PacketEvents is not installed  (or the packet backend failed to register); falling back to the Bukkit  (entity) backend</yellow>"
    unknown_value: "<yellow>Unknown menu backend <aqua>%value%</aqua>; using the default Bukkit  (entity) backend</yellow>"
  packet_backend_registered: "Registered packet GUI backend (PacketEvents detected)"
  packetevents_not_enabled: "PacketEvents is not enabled yet; the packet GUI backend will be registered automatically once it is enabled"
  packet_backend_registration_failed: "Failed to register packet GUI backend: %error%, EmakiCoreLib will use the Bukkit (entity) backend"

console:
  plugin_starting: "<gray>Starting...</gray>"
  plugin_started: "<green>Started</green>"
  plugin_stopped: "<yellow>Stopped</yellow>"
  gui_backend_shutdown_failed: "<yellow>Menu backend <aqua>%backend%</aqua> failed to shut down: <red>%error%</red></yellow>"
  gui_backend_shutdown_deferred: "<yellow>Menu backend <aqua>%backend%</aqua> could not be shut down on its owner thread and was skipped: <red>%reason%</red></yellow>"
  item_source_bridge_close_failed: "<yellow>Failed to close an item source registration; skipping it: <white>%detail%</white></yellow>"
  config_precheck_passed: "<gray>Config precheck passed: <yellow>%issues%</yellow> issue (s)</gray>"
  config_precheck_failed: "<red>Config precheck failed: <yellow>%issues%</yellow> issue (s)</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray> (%hint%)</dark_gray>"
    messages:
      passed: "CoreLib config precheck passed"
      required_file_missing: "Required file does not exist"
      path_not_file: "Path is not a file"
      file_not_readable: "File is not readable"
      required_directory_missing: "Required directory does not exist"
      path_not_directory: "Path is not a directory"
      directory_not_readable: "Directory is not readable"
      config_keys_missing: "Missing %count% bundled default key (s)"
      fixable_hint: "run check --fix to repair automatically"
      fix_failed: "Auto-fix failed: %path%  (%kind%): %error%"
      unknown_module: "Unknown config precheck module. Available modules: %modules%"
      contributor_failed: "Config precheck contributor failed: %error%"
      loop_max_times_invalid: "max_times must be greater than 0"
      loop_min_sync_interval_invalid: "min_sync_interval cannot be lower than 1 tick"
      loop_min_async_interval_invalid: "min_async_interval cannot be lower than 1 tick"
      loop_active_limits_invalid: "Active loop limits must be greater than 0"
      template_blank_id: "Template ID cannot be blank"
      template_action_unregistered: "Action is not registered during precheck: %action%"
      template_invalid_syntax: "Invalid action syntax at line %line%: %error%"
      template_missing_reference: "Template references a missing template: %template%"
      selector_missing_source: "Selector %selector% has no source"
      selector_recursive_source: "Selector %selector% cannot use select as its own source"
      selector_unknown_source: "Selector %selector% references source %source%, which is not registered; when another module provides it, check that the module is installed"
      selector_condition_missing_field: "Condition %type% requires field %field%"
      selector_condition_invalid_state: "State condition names an unknown state %state%; valid values: %states%"
      loop_template_required: "%action% requires template"
      loop_template_missing: "%action% references a missing template: %template%"
      loop_times_numeric: "%action% requires numeric times"
      loop_times_positive: "%action% times must be greater than 0"
      loop_times_exceeds_max: "%action% times exceeds max_times"
      loop_interval_invalid: "%action% requires a valid interval"
      loop_interval_below_min: "%action% interval is lower than the configured minimum"
      loop_initial_delay_invalid: "%action% initial_delay is invalid"
      loop_async_nested_template: "loopasync template cannot include nested usetemplate: %template%"
      loop_async_unsafe_action: "loopasync template contains a non-async-safe action: %action%"
      loop_async_invalid_syntax: "Invalid loopasync template syntax at line %line%: %error%"
      cancel_loop_key_required: "cancelloop requires key"
      cancel_loop_match_invalid: "cancelloop match must be exact or prefix"
      cancel_loop_silent_invalid: "cancelloop silent must be boolean"
      loop_mode_invalid: "%action% mode must be replace, refresh, ignore, or allow_duplicate"
      loop_stop_if_offline_invalid: "%action% stop_if_offline must be boolean"
      loop_stop_if_dead_invalid: "%action% stop_if_dead must be boolean"
      loop_stop_on_failure_invalid: "%action% stop_on_failure must be boolean"
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  economy_bridge_ready: "<gray>Economy bridge connected: <aqua>%provider%</aqua></gray>"
  block_source_bridge_ready: "<gray>Block source connected: <aqua>%provider%</aqua></gray>"
  bstats_registered: "<gray>bStats metrics registered: <aqua>%plugin%</aqua> <dark_gray> (pluginId=%plugin_id%)</dark_gray></gray>"
  bstats_register_failed: "<yellow>bStats metrics registration failed and was skipped: <aqua>%plugin%</aqua> <dark_gray> (pluginId=%plugin_id%, %error%)</dark_gray></yellow>"
  bstats_closed: "<gray>bStats metrics closed: <aqua>%plugin%</aqua></gray>"
  bstats_close_failed: "<yellow>Failed to close bStats metrics: <aqua>%plugin%</aqua> <dark_gray> (%error%)</dark_gray></yellow>"
  bstats_config_directory_create_failed: "<yellow>Failed to create bStats config directory: %path%</yellow>"
  bstats_config_write_failed: "<yellow>Failed to write bStats config: %path%  (%error%)</yellow>"
  action_config_load_failed: "<red>Failed to load action config: %error%</red>"
  item_source_bridge_ready: "<gray>Item source connected: <aqua>%library%</aqua></gray>"
  item_source_bridge_waiting: "<gray>Detected <aqua>%library%</aqua>, waiting for item registration: %detail%</gray>"
  item_source_bridge_incompatible: "<yellow><aqua>%library%</aqua> item source not connected: %detail%</yellow>"
  item_source:
    waiting_detail:
      itemsadder: "The plugin is enabled, but item registration has not finished. Wait for its loading flow to complete"
      craftengine: "The plugin is enabled, but its item table has not finished reloading. Wait for its reload event to complete"
      neigeitems: "The plugin is enabled, but its item library has not finished refreshing. Wait for its reload to complete"
      nexo: "The plugin is enabled, but its item table has not finished initializing. Wait for its load event to complete"
      oraxen: "The plugin is enabled, but its item table has not finished initializing. Wait for its load event to complete"
      ecoitems: "The plugin is enabled, but its item registry is not ready yet. Wait for its loading to complete"
      default: "External item registration has not finished. Wait for the dependency plugin to finish loading"
    incompatible_detail: "%library% was detected, but its current API shape is incompatible with the CoreLib adapter"
  scripts:
    engine_unavailable: "<red>Script extensions are unavailable; script loading was skipped: %reason%</red>"
    disabled: "<gray>Script extensions are disabled in the config; no scripts were loaded</gray>"
    loaded: "<gray>Script loading finished: <green>%loaded%</green> file (s) loaded, <yellow>%skipped%</yellow> skipped</gray>"
    file_error: "<red>Script file failed to load: <yellow>%file%</yellow> -> %error%</red>"
    register_error: "<red>Script registration was rejected: %error%</red>"
  tag_register_conflict: "<yellow>Tag %key% is already registered by %owner%; duplicate registration from %plugin% was ignored</yellow>"

loader:
  lang_directory_create_failed: "<red>Failed to create language directory: %path%</red>"
  bundled_language_load_failed: "<red>Failed to load bundled language: %error%</red>"
  bundled_resource_missing: "<red>Bundled resource missing: %resource%, cannot write to %path%</red>"
  bundled_resource_write_failed: "<red>Failed to write bundled resource: %path%  (%error%)</red>"
  directory_create_failed: "<red>Failed to create directory: %path%</red>"
  invalid_blank_id: "<red>%type% file %file% has a blank ID</red>"
  duplicate_id: "<red>Skipped duplicate %type% ID %id%: %file%</red>"
  load_failed: "<red>Failed to load %type% file %file%: %error%</red>"
  critical_resource_missing_or_write_failed: "Critical default resources are missing or failed to write: %failures%"
  release_example_dialog_failed: "Failed to release example dialog dialogs/%file%: %error%"
  bundled_resource_release_write_failed: "Failed to write bundled resource %resource%: %error%"
  bundled_resource_release_missing: "Bundled resource missing: %resource%"

action:
  debug_execution: "<gray></gray> <white>phase=%phase%</white>
    <white>id=%id%</white> <gray>args=%args%</gray>"
  execute_failed: "<red>Failed to execute %action%: %error%</red>"
  register:
    blank_id: "<red>Stage id is blank; registration refused</red>"
    duplicate_id: "<red>Duplicate stage id; registration refused</red>"
    registry_unavailable: "<red>The stage registry is not ready yet; registration refused</red>"
    undeclared_domain: "<red>Stage %stage% declared no thread domain; registration refused</red>"
    async_needs_target:
      "<red>Stage %stage% declares the async domain but requires a target
      (%requirement%); registration refused</red>"
    key_type_conflict:
      "<red>Context key %key% type conflict: existing %existing%,
      %stage% declares %declared%</red>"
    condition_reserved: "<red>The target condition id collides with a built-in condition; registration refused</red>"
  selector:
    condition_conflict: "<red>Selector %selector% writes both %field% and entries under condition; use only one</red>"
  diagnostic:
    at_column: "<gray> (column %column%)</gray>"
    at_file: "<gray> (%file% at %key_path%, line %line% column %column%)</gray>"
    candidates: "<gray> Valid values: <white>%candidates%</white></gray>"
    more_problems: "<gray> This line has <yellow>%count%</yellow> more problem (s); they will be reported once this one is fixed</gray>"
    unknown_reason: "<red>Validation failed  (diagnostic key %reason% has no message yet; please report this key)</red>"
  lex:
    unclosed_quote: "<red>Unclosed quote; the quote opened at column %column% has no closing quote</red>"
  parse:
    unexpected_token: "<red>Leftover content that cannot be parsed: %token%</red>"
    empty_pipeline: "<red>This line contains no stages</red>"
    empty_stage: "<red>Empty stage name; a stage is required between two | separators</red>"
    missing_pipe: "<red>Missing separator | before %token%; adjacent stages must be split with |</red>"
    trailing_pipe: "<red>The line ends with |; a stage must follow it</red>"
    unmatched_bracket_close: "<red>Extra ] with no matching [</red>"
    unexpected_bracket_open: "<red>[ cannot appear here; brackets are only for if/else branch bodies</red>"
    unclosed_bracket: "<red>The [ opened by %keyword% at column %open_column% is never closed; a matching ] is missing</red>"
    branch_missing_condition: "<red>if has no condition; write it as if <condition> [ ... ]</red>"
    branch_missing_body: "<red>%keyword% has no branch body wrapped in [ ]</red>"
    empty_branch_body: "<red>The branch body at column %open_column% is empty; [ ] must contain stages</red>"
    weight_missing_option:
      '<red>weight needs at least one "<weight> [ ... ]" branch;
      write it as weight 70 [ ... ] 30 [ ... ]</red>'
    weight_named_argument: "<red>weight values must be unnamed; received the
      name=value form %token%</red>"
    run_missing_sequence: "<red>run has no sequence name; write it as run <sequence> name=value</red>"
    run_positional_parameter: "<red>run parameters must be written as name=value; got the bare argument %token%</red>"
    duplicate_argument: "<red>Argument %argument% appears twice; each argument may only be given once per stage</red>"
    stage_name_is_argument: "<red>The stage name position holds a name=value form  (%token%); a stage name cannot contain =</red>"
    on_error_without_body: '<red>on_error cannot stand alone as a stage; it must follow a stage and wrap its handler in [ ], for example damage amount=3 on_error [ send_message "failed" ]</red>'
    alias_empty: "<red>Alias %alias% expands to nothing</red>"
    alias_cycle: "<red>Alias %alias% expands past %max% levels; aliases likely reference each other in a cycle</red>"
    union_empty: "<red>union must wrap at least one source stage</red>"
    union_only_sources: "<red>Only source stages may appear inside union [ ]</red>"
    parse_if_missing_condition: "<red>parse_if is missing a condition; write it as parse_if <static condition> [ ... ]</red>"
    parse_if_placeholder: "<red>The parse_if condition %condition% contains a placeholder; parse_if is evaluated at compile time and cannot use runtime placeholders  (use if instead)</red>"
    parse_if_not_evaluable: "<red>The parse_if condition %condition% cannot be evaluated at compile time</red>"
  validate:
    empty_pipeline: "<red>This line contains no stages; at least one stage is required</red>"
    missing_self_source:
      "<red>Omitting the source needs the builtin self source, which is
      currently unavailable; write an explicit source stage at the start of the line</red>"
    unknown_stage: "<red>Unknown stage %token%</red>"
    union_not_source: "<red>%stage% inside union is not a source stage</red>"
    nested_on_error:
      "<red>An on_error handler cannot nest another on_error; split it into
      separate pipelines or use retry instead</red>"
    invalid_retry_times: "<red>retry count is not a valid non-negative integer</red>"
    retry_limit_exceeded: "<red>retry count %value% exceeds the limit %maximum%;
      adjust action.pipeline.max_retry_times</red>"
    stage_owner_disabled: "<red>Stage %stage% is provided by plugin %owner%,
      which is currently disabled</red>"
    multiple_sources: "<red>A pipeline may only have one source stage; %stage% is the second. To combine several sources, write union [ ... ]</red>"
    source_after_action:
      "<red>Source stage %stage% cannot follow an action stage; a source must
      come first on the line</red>"
    gate_after_action:
      "<red>Gate stage %stage% cannot follow an action stage; the target
      flow has already been consumed</red>"
    missing_required_argument: "<red>Missing required argument %argument%</red>"
    unknown_argument: "<red>Unknown argument %token%</red>"
    invalid_argument_type:
      "<red>Argument %argument% value %value% is not a valid
      %expected%</red>"
    positional_not_allowed:
      "<red>Stage %stage% accepts no bare arguments but got
      <white>%value%</white>; its arguments must be written as name=value</red>"
    too_many_positional_arguments:
      "<red>Too many bare arguments: at most %maximum%,
      got %actual%</red>"
    argument_both_named_and_positional:
      "<red>Argument %token% was given both named
      and bare</red>"
    missing_context_key: "<red>Stage %stage% requires context %key% (%type%),
      which phase %phase% does not provide</red>"
    missing_variable: "<red>Variable %variable% is not provided by phase %phase% or an earlier stage</red>"
    bare_variable_reference: "<red>Variable %variable% must be written as %expected%, not as a bare placeholder</red>"
    missing_inherited_targets: "<red>Stage inherited needs a carried target flow, but phase %phase% does not declare one</red>"
    invalid_every_syntax: "<red>Invalid every syntax; expected %expected%</red>"
    invalid_repeat_times: "<red>Repeat count %value% is not a valid non-negative
      integer</red>"
    repeat_must_be_literal:
      "<red>Repeat count must be a literal, not the placeholder
      %value%</red>"
    repeat_limit_exceeded: "<red>Repeat count %value% exceeds the limit %maximum%</red>"
    branch_depth_exceeded: "<red>Branch nesting depth %depth% exceeds the limit
      %maximum%</red>"
    invalid_weight:
      "<red>Weight %value% is not a valid number; a weight must be a
      non-negative number, expression, or placeholder</red>"
    negative_weight:
      "<red>Weight %value% is negative; a weight must be greater than or
      equal to 0  (use 0 to disable that branch)</red>"
    weight_total_not_positive:
      "<red>The weight total is %total%; at least one branch must
      have a weight above 0, otherwise this stage can never select a branch</red>"
    unknown_sequence: "<red>Unknown sequence %token%</red>"
    missing_sequence_parameter: "<red>Sequence %sequence% is missing parameter
      %parameter%</red>"
    sequence_cycle: "<red>Sequence calls form a cycle: %path%</red>"
    thread_domain_undeclared: "<red>Stage %stage% declared no thread domain</red>"
    async_stage_requires_target:
      "<red>Stage %stage% declares the async domain but
      requires a target  (%requirement%)</red>"
  run:
    empty_pipeline: "<gray>This pipeline has no executable stages</gray>"
    stage_unavailable: "<red>Stage is currently unavailable</red>"
    no_target: "<gray>No target to act on</gray>"
    all_targets_invalid: "<gray>Every target became invalid before execution</gray>"
    partial_targets: "<yellow>Some targets failed</yellow>"
    invalid_condition: "<red>Condition %condition% could not be evaluated</red>"
    invalid_weight:
      "<red>Weight %value% failed to evaluate at runtime or is negative;
      check the placeholders inside it</red>"
    weight_not_rolled:
      "<gray>Every weight branch has a weight of 0, so no branch was
      selected this time</gray>"
    unknown_sequence: "<red>Sequence %sequence% was not found at run time</red>"
    sequence_depth_exceeded:
      "<red>Sequence %sequence% exceeds the maximum nesting depth
      %maximum%</red>"
    timeout: "<red>Stage execution timed out</red>"
    cancelled: "<gray>Execution was cancelled</gray>"
    owner_disabled: "<red>The owning plugin is disabled: %error%</red>"
    target_retired: "<gray>The target became invalid before the delayed run: %error%</gray>"
    timing_without_body: "<gray>A timing stage has no stages after it</gray>"
    exception: "<red>A stage threw an exception during execution: %error%</red>"
  task:
    empty_body: "<red>That sequence has no runnable lines</red>"
    times_out_of_range: "<red>times is out of range; adjust action.pipeline.max_repeat_times</red>"
    interval_too_small: "<red>interval is below the configured minimum</red>"
    total_limit_reached: "<red>The server-wide active task limit has been reached</red>"
    player_limit_reached: "<red>That player's active task limit has been reached</red>"
    plugin_limit_reached: "<red>That plugin's active task limit has been reached</red>"
    exception: "<red>Stage threw an exception: %error%</red>"
  # Builtin source-stage diagnostics
  source:
    self:
      no_caster: "<gray>The self source has no caster</gray>"
    inherited:
      no_targets: "<gray>The inherited source has no targets to inherit</gray>"
    trigger:
      no_trigger: "<gray>The trigger source has no trigger information</gray>"
      not_online: "<gray>The player named by trigger is not online</gray>"
    origin:
      no_origin: "<gray>The origin source has no usable origin</gray>"
    looking_at:
      no_living_caster: "<gray>looking_at requires a living caster</gray>"
      no_hit: "<gray>looking_at hit no entity</gray>"
      invalid_ray: "<red>The range or width of looking_at is invalid</red>"
    nearby:
      no_origin: "<gray>The nearby source has no usable origin</gray>"
      no_match: "<gray>nearby found no matching entity</gray>"
      unknown_entity_type: "<red>Unknown entity type %type% for nearby</red>"
    nearby_players:
      no_origin: "<gray>The nearby_players source has no usable origin</gray>"
      no_match: "<gray>nearby_players found no player</gray>"
    offset:
      no_origin: "<gray>The offset source has no usable origin</gray>"
    at:
      world_required: "<red>The at source requires world when there is no origin</red>"
      world_not_found: "<red>World %world% for the at source does not exist</red>"
      relative_without_origin:
        "<red>The at source cannot use ~ coordinates without an
        origin</red>"
    player_by_name:
      name_required: "<red>player_by_name requires name</red>"
      not_online: "<gray>The player named by player_by_name is not online</gray>"
    select:
      name_required: "<red>select requires a selector id</red>"
      unknown_selector: "<red>select references selector %name%, which is not defined under action.selectors; defined: %selectors%</red>"
      missing_source: "<red>Selector %selector% has no source configured</red>"
      unknown_source: "<red>Selector %selector% references source %source%, which is not registered</red>"
      unknown_argument: "<red>Source %source% referenced by selector %selector% has no argument %argument%</red>"
      no_match: "<gray>select found no matching target</gray>"
    all_players:
      no_match: "<gray>all_players found no online player</gray>"
    world_players:
      no_world: "<gray>world_players could not resolve the target world</gray>"
      no_match: "<gray>world_players found no player in the target world</gray>"
    ring:
      no_origin: "<gray>The ring source has no usable origin</gray>"
      no_match: "<gray>ring found no entity within [min_radius, max_radius]</gray>"
      unknown_entity_type: "<red>ring entity type %type% is unknown</red>"
    region:
      no_origin: "<gray>The region source has no usable origin</gray>"
      no_match: "<gray>region found no entity in the specified area</gray>"
      unknown_entity_type: "<red>region entity type %type% is unknown</red>"
    op_players:
      no_match: "<gray>op_players found no online OP</gray>"
    random:
      no_pool: "<gray>random has an empty pool to draw from</gray>"
    faction_members:
      no_members: "<red>faction_members requires a member list</red>"
      no_online: "<gray>faction_members has no online member</gray>"
    party:
      no_permission: "<red>party requires a permission node</red>"
      no_match: "<gray>party found no online player with that permission node</gray>"
    dropped_items:
      no_origin: "<gray>The dropped_items source has no usable origin</gray>"
      no_match: "<gray>dropped_items found no item entity</gray>"
    highest_block:
      no_origin: "<gray>The highest_block source has no usable origin</gray>"
      no_block: "<gray>highest_block found no block in that column</gray>"
    players_in_region:
      no_origin: "<gray>The players_in_region source has no usable origin</gray>"
      no_match: "<gray>players_in_region found no player in the area</gray>"
    vertical_block:
      no_origin: "<gray>The vertical_block source has no usable origin</gray>"
    players_by_gamemode:
      unknown_gamemode: "<red>players_by_gamemode game mode %gamemode% is unknown</red>"
      no_match: "<gray>players_by_gamemode found no online player in that mode</gray>"
    players_with_material:
      unknown_material: "<red>players_with_material material %material% is unknown</red>"
      no_match: "<gray>players_with_material found no online player holding that material</gray>"
  gate:
    where:
      condition_required: "<red>where requires a condition</red>"
      invalid_condition: "<red>The where condition %condition% cannot be evaluated</red>"
    filter:
      condition_required: "<red>filter requires predicates</red>"
      invalid_condition: "<red>The filter predicates %condition% cannot be parsed at %token%  (column %position%); available keys: %keys%</red>"
    chance:
      chance_required: "<red>chance requires a probability</red>"
      invalid_chance: "<red>The chance probability must be between 0 and 1</red>"
      not_rolled: "<gray>The chance roll did not pass</gray>"
    limit:
      invalid_count: "<red>The limit count must be a non-negative integer</red>"
    sort_by:
      unknown_key: "<red>Unknown sort_by key %key%; expected distance or health</red>"
      unknown_order: "<red>Unknown sort_by order %order%; expected asc or desc</red>"
    set:
      no_assignment: "<red>set requires at least one assignment</red>"
    stop:
      stopped: "<gray>Ended by the stop stage</gray>"
    sample:
      invalid_count: "<red>sample count must be a non-negative integer</red>"
    distance_filter:
      no_origin: "<gray>distance_filter has no usable origin</gray>"
    where_any:
      conditions_required: "<red>where_any requires at least one predicate</red>"
    where_all:
      conditions_required: "<red>where_all requires at least one predicate</red>"
  stage:
    common:
      not_entity: "<gray>This stage requires an entity target</gray>"
      not_living_entity: "<gray>This stage requires a living entity target</gray>"
      not_player: "<gray>This stage requires a player target</gray>"
      not_location: "<gray>This stage requires a location target</gray>"
      no_location: "<gray>This stage requires a target with a position</gray>"
      invalid_amount: "<red>The amount %amount% is invalid; it must be a non-negative number</red>"
      invalid_positive_amount: "<red>The amount %amount% is invalid; it must be greater than 0</red>"
    set_game_rule:
      no_world: "<gray>set_game_rule has no usable world</gray>"
