# Debug mode messages
debug:
  common:
    placeholder:
      papi_resolved: "PlaceholderAPI resolution complete | source=%source% | before=%before% | after=%after%"
      papi_failed: "PlaceholderAPI resolution failed | source=%source% | error=%error% | text=%text%"
