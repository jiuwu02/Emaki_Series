# ============================================================
# EmakiCoreLib 语言文件 - 简体中文
# ============================================================
# 此文件包含插件的所有消息文本，支持 MiniMessage 格式。
# 修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiCoreLib/lang/
# ============================================================

# Emaki CoreLib 默认语言文件
# version 由资源同步维护
version: "4.2.23"

general:
  prefix: "<gray>[ <gradient:#A78BFA:#60A5FA>EmakiCoreLib</gradient> ]</gray>"

console:
  plugin_starting: "<gray>正在启动...</gray>"
  plugin_started: "<green>启动完成</green>"
  plugin_stopped: "<yellow>已关闭</yellow>"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  economy_bridge_ready: "<gray>经济桥接已接入: <aqua>%provider%</aqua></gray>"
  block_source_bridge_ready: "<gray>已接入方块源: <aqua>%provider%</aqua></gray>"
  bstats_registered: "<gray>bStats 统计已注册: <aqua>%plugin%</aqua> <dark_gray>(pluginId=%plugin_id%)</dark_gray></gray>"
  bstats_register_failed: "<yellow>bStats 统计注册失败，已跳过: <aqua>%plugin%</aqua> <dark_gray>(pluginId=%plugin_id%, %error%)</dark_gray></yellow>"
  bstats_closed: "<gray>bStats 统计已关闭: <aqua>%plugin%</aqua></gray>"
  bstats_close_failed: "<yellow>bStats 统计关闭失败: <aqua>%plugin%</aqua> <dark_gray>(%error%)</dark_gray></yellow>"
  bstats_config_directory_create_failed: "<yellow>无法创建 bStats 配置目录: %path%</yellow>"
  bstats_config_write_failed: "<yellow>无法写入 bStats 配置: %path% (%error%)</yellow>"
  script_engine_disabled: "<gray>脚本引擎已禁用</gray>"
  script_engine_ready: "<gray>脚本引擎已启用 (GraalJS)</gray>"
  script_engine_failed: "<red>脚本引擎初始化失败: %error%</red>"
  scripts_loaded: "<gray>已加载 <yellow>%count%</yellow> 个脚本</gray>"
  mythic_js_bridge_ready: "<gray>MythicMobs JavaScript 技能桥接已就绪</gray>"
  mythic_js_script_missing: "<yellow>MythicMobs JavaScript 技能 <aqua>%mechanic%</aqua> 缺少 script 参数</yellow>"
  js_extension_no_result: "无返回结果"
  js_extension_load_failed: "<red>加载 JavaScript 全局扩展失败: <gray>%script%</gray> (%error%)</red>"
  js_extensions_loaded: "<gray>已加载 <yellow>%count%</yellow> 个 JavaScript 全局扩展脚本，动作=<yellow>%actions%</yellow>，占位符=<yellow>%placeholders%</yellow>，事件=<yellow>%events%</yellow></gray>"
  js_extension_directory_create_failed: "<red>无法创建 JavaScript 全局扩展目录: %error%</red>"
  js_extension_scan_failed: "<red>扫描 JavaScript 全局扩展失败: %error%</red>"
  js_action_blank_id: "<yellow>JavaScript 动作 ID 为空: <gray>%script%</gray></yellow>"
  js_action_registered: "<gray>已注册 JavaScript 动作: <aqua>%id%</aqua> <dark_gray>(%script%)</dark_gray></gray>"
  js_action_register_failed: "<red>注册 JavaScript 动作失败: <aqua>%id%</aqua> (%error%)</red>"
  js_placeholder_blank_id: "<yellow>JavaScript 占位符 ID 为空: <gray>%script%</gray></yellow>"
  js_placeholder_registered: "<gray>已注册 JavaScript 占位符: <aqua>%placeholder%</aqua> <dark_gray>(%script%)</dark_gray></gray>"
  js_event_unsupported: "<yellow>不支持的 JavaScript 事件监听器: <aqua>%event%</aqua> <dark_gray>(%script%)</dark_gray></yellow>"
  js_event_registered: "<gray>已注册 JavaScript 事件监听器: <aqua>%id%</aqua> -> <aqua>%event%</aqua> <dark_gray>(%script%)</dark_gray></gray>"
  js_event_listener_failed: "<red>JavaScript 事件监听器执行失败: <aqua>%id%</aqua> (%error%)</red>"
  js_event_listener_exception: "<red>JavaScript 事件监听器异常: <aqua>%id%</aqua> (%error%)</red>"
  action_config_load_failed: "<red>加载动作配置失败: %error%</red>"
  item_source_bridge_ready: "<gray>已接入物品源: <aqua>%library%</aqua></gray>"
  item_source_bridge_waiting: "<gray>已检测到 <aqua>%library%</aqua>，等待物品注册完成: %detail%</gray>"
  item_source_bridge_incompatible: "<yellow><aqua>%library%</aqua> 物品源未接入: %detail%</yellow>"

loader:
  lang_directory_create_failed: "<red>无法创建语言目录: %path%</red>"
  bundled_language_load_failed: "<red>读取内置语言失败: %error%</red>"
  bundled_resource_missing: "<red>内置资源缺失: %resource%，无法写入 %path%</red>"
  bundled_resource_write_failed: "<red>写入内置资源失败: %path% (%error%)</red>"
  directory_create_failed: "<red>无法创建目录: %path%</red>"
  invalid_blank_id: "<red>%type% 文件 %file% 的 ID 为空。</red>"
  duplicate_id: "<red>跳过重复的 %type% ID %id%: %file%</red>"
  load_failed: "<red>读取 %type% 文件 %file% 失败: %error%</red>"

action:
  debug_execution: "<gray>[Action]</gray> <white>phase=%phase%</white>
    <white>id=%id%</white> <gray>args=%args%</gray>"
  execute_failed: "<red>[Action] 执行 %action% 失败: %error%</red>"

# Debug 模式消息
debug:
  command:
    status_header: "<gold>========== Debug 状态 ==========</gold>"
    status_enabled: "<green>Debug 已开启</green>"
    status_disabled: "<gray>Debug 已关闭</gray>"
    tracked_players: "<gray>追踪玩家: <yellow>%players%</yellow></gray>"
    tracked_modules: "<gray>追踪模块: <yellow>%modules%</yellow></gray>"
    player_added: "<green>已开始追踪玩家: <aqua>%player%</aqua></green>"
    player_removed: "<yellow>已停止追踪玩家: <aqua>%player%</aqua></yellow>"
    module_enabled: "<green>已开启模块追踪: <yellow>%module%</yellow></green>"
    module_disabled: "<yellow>已关闭模块追踪: <gray>%module%</gray></yellow>"
    all_enabled: "<green>已开启全局 Debug（所有玩家+所有模块）</green>"
    all_disabled: "<yellow>已关闭所有 Debug 追踪</yellow>"
    player_not_found: "<red>找不到在线玩家: %player%</red>"
    available_modules: "<gray>可用模块: <yellow>%modules%</yellow></gray>"
  action:
    parse: "解析 Action | 原始=%raw% | 解析结果=%parsed%"
    execute_start: "执行 Action | 类型=%type% | 玩家=%player% | 参数=%params%"
    execute_result: "Action 执行完成 | 类型=%type% | 结果=%result%"
    template_resolve: "模板解析 | 模板=%template% | 展开=%expanded%"
  script:
    load: "加载脚本 | 路径=%path% | 大小=%size%字节"
    execute: "执行脚本 | 路径=%path% | 函数=%function% | 耗时=%duration%ms"
    error: "脚本错误 | 路径=%path% | 错误=%error%"
  item_source:
    resolve: "解析物品来源 | 输入=%input% | 结果=%result%"
    create: "创建物品 | 来源=%source% | 数量=%amount% | 成功=%success%"

# Web Console 调试命令
web_debug:
  request: "[WebDebug][%label%] %method% %uri% → %status% (%elapsed%ms) from %remote%"
  frontend_error: "[WebDebug][前端][ERROR] %message% | source=%source% | detail=%detail% | url=%url% | stack=%stack%"
  frontend_event: "[WebDebug][前端][EVENT] %event% | type=%type% | target=%target% | label=%label% | value=%value% | detail=%detail% | url=%url%"
  event_type:
    click: "点击"
    change: "修改输入"
    submit: "提交表单"
    shortcut: "快捷键"
    login_submit: "提交登录"
    login_success: "登录成功"
    login_failed: "登录失败"
    logout_submit: "请求登出"
  enabled_all: "<green>Web Console 调试模式已开启（前端+后端）</green>"
  enabled_frontend: "<green>Web Console 前端调试已开启（静态资源与扩展脚本）</green>"
  enabled_backend: "<green>Web Console 后端调试已开启（API 请求）</green>"
  disabled_all: "<yellow>Web Console 调试模式已关闭</yellow>"
  disabled_frontend: "<yellow>Web Console 前端调试已关闭</yellow>"
  disabled_backend: "<yellow>Web Console 后端调试已关闭</yellow>"
  disabled_config: "<yellow>Web Console 未启用，无法开启调试日志。请先在 config.yml 中设置 web_console.enabled: true，然后执行 /emakicorelib reload。</yellow>"
  not_running: "<red>Web Console 未运行，无法开启调试日志。请检查启动日志或执行 /emakicorelib reload。</red>"
  no_permission: "<red>你没有权限操作 Web Console 调试模式</red>"

# 命令消息
command:
  no_permission_web: "<red>你没有权限查看 Web Console 链接</red>"
  no_permission_reload: "<red>你没有权限重载 EmakiCoreLib</red>"
  reload_success: "<green>EmakiCoreLib 已重载，Web Console 已按新配置重新启动</green>"
  web_address: "<aqua>Web Console 地址：</aqua><white>%url%</white>"
  web_bind_hint: "<yellow>当前 host 是绑定地址，客户端通常不能直接访问；下面提供本机回退链接</yellow>"
  web_click_open: "<aqua>点击打开：</aqua><click:open_url:'%url%'><hover:show_text:'<yellow>点击在浏览器中打开 Web Console</yellow>'><green><underlined>%url%</underlined></green></hover></click>"
  web_disabled_hint: "<yellow>提示：web_console.enabled 当前为 false，链接可能无法连接</yellow>"
  web_unsafe_password: "<yellow>提示：Web Console 密码为空或仍为默认值，服务会拒绝启动。请修改 web_console.auth.password</yellow>"
  help_header: "<aqua>EmakiCoreLib 命令：</aqua>"
  help_web: "<green>%root% web</green><gray> - 输出可点击的 Web Console 链接</gray>"
  help_reload: "<green>%root% reload</green><gray> - 重载 CoreLib 配置与 Web Console</gray>"
  help_webdebug: "<green>%root% webdebug [frontend|backend|all]</green><gray> - Web Console 启用后开关前端/后端调试日志</gray>"

# Web Console 服务日志
web_console:
  started: "<gray>Web Console 已启动: <aqua>%url%</aqua></gray>"
  start_failed: "<red>Web Console 启动失败</red>"
  unsafe_password: "<red>已启用但密码仍为默认值 change-me，Web Console 拒绝启动。请修改 config.yml 的 web_console.auth.password</red>"
  request_failed: "<red>请求处理失败: %uri%</red>"
  yaml_parse_failed: "<red>解析 web-console.yml 失败</red>"
