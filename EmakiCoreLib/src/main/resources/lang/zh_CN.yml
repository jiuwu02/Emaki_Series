    missing_pipe: "<red>[管道] %token% 之前缺少分隔符 |，相邻两段必须用 | 隔开</red>"
    trailing_pipe: "<red>[管道] 该行以 | 结尾，| 之后还需要写一个段</red>"
    unmatched_bracket_close: "<red>[管道] 多出一个 ]，它没有对应的 [</red>"
    unexpected_bracket_open: "<red>[管道] 这里不能出现 [，方括号只能用于 if/else 的分支体</red>"
    unclosed_bracket: "<red>[管道] %keyword% 在第 %open_column% 列打开的 [ 没有闭合，缺少对应的 ]</red>"
    branch_missing_condition: "<red>[管道] if 缺少条件表达式，应写成 if <条件> [ ... ]</red>"
    branch_missing_body: "<red>[管道] %keyword% 缺少用 [ ] 包裹的分支体</red>"
    empty_branch_body: "<red>[管道] 第 %open_column% 列的分支体是空的，[ ] 之间必须有段</red>"
