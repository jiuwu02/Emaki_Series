    weight_total_not_positive: "<red>[管道] weight 的权重总和为 %total%，至少要有一个分支的权重大于 0，否则该段永远不会选中任何分支</red>"
    unknown_sequence: "<red>[管道] 未知序列 %token%</red>"
    missing_sequence_parameter: "<red>[管道] 序列 %sequence% 缺少参数 %parameter%</red>"
