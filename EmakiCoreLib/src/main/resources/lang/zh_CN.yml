# ============================================================
# EmakiCoreLib 语言文件 - 简体中文
# ============================================================
# 此文件包含插件的所有消息文本，支持 MiniMessage 格式。
# 修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiCoreLib/lang/
# ============================================================

# Emaki CoreLib 默认语言文件
# version 由资源同步维护
version: "4.5.16"

general:
  prefix: "<gray>[ <gradient:#FF80FF:#00FFFF>EmakiCoreLib</gradient> ]</gray>"

gui:
