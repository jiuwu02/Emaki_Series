loader:
  lang_directory_create_failed: "<red>无法创建语言目录: %path%</red>"
  bundled_language_load_failed: "<red>读取内置语言失败: %error%</red>"
  bundled_resource_missing: "<red>内置资源缺失: %resource%，无法写入 %path%</red>"
  bundled_resource_write_failed: "<red>写入内置资源失败: %path% (%error%)</red>"
  directory_create_failed: "<red>无法创建目录: %path%</red>"
  invalid_blank_id: "<red>%type% 文件 %file% 的 ID 为空。</red>"
  duplicate_id: "<red>跳过重复的 %type% ID %id%: %file%</red>"
  load_failed: "<red>读取 %type% 文件 %file% 失败: %error%</red>"

action:
  debug_execution: "<gray>[Action]</gray> <white>phase=%phase%</white> <white>id=%id%</white> <gray>args=%args%</gray>"
  execute_failed: "<red>[Action] 执行 %action% 失败: %error%</red>"
  # 管道加载期校验诊断
  register:
    blank_id: "<red>[管道] 段 id 为空，注册被拒绝</red>"
    duplicate_id: "<red>[管道] 段 id 重复，注册被拒绝</red>"
    registry_unavailable: "<red>[管道] 段注册表尚未就绪，注册被拒绝</red>"
    undeclared_domain: "<red>[管道] 段 %stage% 未声明线程域，注册被拒绝</red>"
    async_needs_target: "<red>[管道] 段 %stage% 声明异步域但要求目标(%requirement%)，注册被拒绝</red>"
    key_type_conflict: "<red>[管道] 上下文键 %key% 类型冲突：已有 %existing%，%stage% 声明 %declared%</red>"
  # 诊断渲染的公共后缀。位置与候选值单独成键，便于翻译时调整顺序或省略。
  diagnostic:
    at_column: "<gray>（第 %column% 列）</gray>"
    at_file: "<gray>（%file% 的 %key_path%，第 %line% 行第 %column% 列）</gray>"
    candidates: "<gray> 可选值: <white>%candidates%</white></gray>"
    more_problems: "<gray> 该行另有 <yellow>%count%</yellow> 处问题，修好这处后会继续提示。</gray>"
    unknown_reason: "<red>[管道] 校验未通过（诊断键 %reason% 尚无对应文案，请反馈该键）</red>"
