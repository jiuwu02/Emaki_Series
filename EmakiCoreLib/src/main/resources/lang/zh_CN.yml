    timeout: "<red>[管道] 段执行超时</red>"
    cancelled: "<gray>[管道] 执行已取消</gray>"
    owner_disabled: "<red>[管道] 所属插件已停用：%error%</red>"
    target_retired: "<gray>[管道] 目标在延迟执行前已失效：%error%</gray>"
