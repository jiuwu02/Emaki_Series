# EmakiCoreLib 数据库配置 (database.yml)
# enabled=false 时不初始化数据库, 全系保持文件持久化; enabled=true 时由 CoreLib 统一建池并下发仓储服务
# MySQL/MariaDB 驱动随插件打包 (共用 mysql-connector-j); PostgreSQL/SQLite 驱动经运行库机制在启动时下载 (Maven Central/阿里云, 同源校验和比对); 修改本文件需重启生效

# 总开关; false=不连接数据库
enabled: false

# 引擎: auto | mysql | mariadb | postgresql | sqlite
#   auto=按 host/url 判引擎: 默认判入 mysql 协议族 (含 mariadb); host 写 jdbc:postgresql:/jdbc:sqlite: 前缀,
#   或写成 .db/.sqlite/.sqlite3 文件路径形态时判为 postgresql/sqlite; 建议按实际引擎显式填写
#   mysql/mariadb 共用 mysql-connector-j; postgresql 走 org.postgresql 驱动; sqlite 为本地文件库, database 填库文件名 (存放于插件数据目录)
engine: auto

host: localhost
port: 3306
database: emaki
username: emaki
# 密码仅存于本文件, 不要提交到版本库
password: ""

# SSL 连接
ssl: false

# 连接池大小
pool_size: 10

# 本服务器在网络内的唯一标识 (跨服租约归属与审计列 updated_by 使用)
server_id: server-1

# 跨服单写权租约
lease:
  # 租约有效期 (秒); 持有期间按 heartbeat_seconds 自动续租
  ttl_seconds: 45
  # 续租心跳间隔 (秒)
  heartbeat_seconds: 15
  # 强占宽限 (秒): 他人租约已过期且超过该宽限后, 才允许 epoch+1 强占
  takeover_seconds: 90

# 数据库不可用时的启动策略: fail=报错拒载 | fallback_file=降级为文件持久化并大声告警
startup_policy: fail
