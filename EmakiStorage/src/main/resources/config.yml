# ============================================================
# EmakiStorage 主配置文件
# ============================================================
# 类 AE2 的 GUI 仓库：单个逻辑槽位可存 long 量级物品，并完整保留原始物品数据。
# 修改后使用 /estorage reload 重载配置、语言与 GUI 模板。
#
# 文件放置位置: plugins/EmakiStorage/config.yml
# ============================================================

# version 由资源同步维护
version: "1.0.7"

# 语言文件 ID
language: "zh_CN"

# 是否写入默认业务数据（unlock_costs.yml）
release_default_data: true

# OP 是否绕过权限限制
op_bypass: false

# ------------------------------------------------------------
# 界面
# ------------------------------------------------------------
gui:
  # 展示区行数，合法范围 1-5，默认 5。
  # 功能区永远独占最后一行，因此实际窗口行数 = storage_rows + 1（上限 6）。
  # 填 >=6 时钳到 5 并记 warning；填 <=0 时钳到 1。
  # 每页展示格数 = storage_rows * 9，功能区槽位 = storage_rows * 9 + offset。
  storage_rows: 5
  # 存入成功后的反馈方式：actionbar | message | none
  # 混用存入（展示区任意槽位 + 固定投入口）下物品可能落到别的页，
  # 关掉反馈玩家会以为物品消失，不建议设为 none
  deposit_feedback: actionbar
  # 取出是否要求光标为空。
  # true 更防手滑，但会让“光标有物品时点条目”从存入变成无操作
  require_empty_cursor_for_withdraw: false

# ------------------------------------------------------------
# 容量
# ------------------------------------------------------------
capacity:
  # 默认开放槽位数（45 = 5 行 x 9，与 gui.storage_rows 默认值一致）。
  # 这只是“默认”部分，与权限档位、命令授予、付费购买的槽位分开累加。
  # 调小此值不会吃掉玩家已授予/已购买的槽位。
  base_slots: 45
  # 槽位总量硬上限。设为 0 表示无限。
  # 注意：设为 0 后单玩家 10 万条目约占 100-200MB 堆内存（推算值，未实测），
  # 多个重度玩家可能耗尽堆内存，请确认服务器内存充足后再放开。
  max_slots: 1000
  # 条目数超过此值时向控制台记录 warning（0 = 不提醒）
  warn_entry_count: 5000
  # 默认单槽堆叠上限。
  # 顶层的 0 = 不限制（等价 Long.MAX_VALUE）；
  # 玩家级与条目级的 0 含义不同，那里表示“继承上一级”
  default_stack_limit: 100

# ------------------------------------------------------------
# 扩容与缩容
# ------------------------------------------------------------
unlock:
  # 容量缩小导致占用超出时的处理策略：
  #   lock_readonly     超出槽位只读，可取出不可存入，取空后释放（推荐）
  #   compact           超出条目自动前滚填补空位，填不下的退化为 lock_readonly
  #   return_inventory  尝试退回背包，装不下的退化为 lock_readonly
  #   reject_change     直接拒绝本次缩容
  # 不提供 drop/delete：不可逆数据丢失不应由配置调整隐式触发
  overflow_policy: lock_readonly
  # 是否开放 GUI 内付费扩容（还需 emakistorage.unlock.purchase 权限）
  purchase_enabled: true
  # 付费档位配置文件（业务数据，不随版本覆盖）
  cost_file: "unlock_costs.yml"

# ------------------------------------------------------------
# 展示
# ------------------------------------------------------------
display:
  # 槽位物品的 amount 表达方式：
  #   percent  用 1-99 表示占用百分比
  #   one      恒为 1，不表达占用率
  # stackLimit 为不限制时自动退化为 one
  amount_mode: percent
  # percent 模式的 amount 刻度上限。
  # max_stack_size 组件合法范围是 1-99，不要改成 100 或更大（未定义行为）
  percent_scale: 99
  # 紧凑数量单位（K/M/B/T/P/E），置空则使用精确数字
  compact_units: ["K", "M", "B", "T", "P", "E"]
  compact_decimals: 2
  # 是否在 lore 中额外显示带千分位的精确数量
  show_exact_amount: true
  # 展示信息插入 lore 的位置：top | bottom
  lore_position: bottom

# ------------------------------------------------------------
# 存取行为
# ------------------------------------------------------------
behavior:
  # 取出时背包装不下的剩余部分：return（回补仓库）| drop（地面掉落）
  overflow_on_withdraw: return
  withdraw_amounts:
    left: 1
    right: 16
    shift_left: 32
    shift_right: 64
  # 中键自定义取出数量
  withdraw_prompt:
    # 是否启用中键自定义数量输入
    enabled: true
    # 输入方式：
    #   auto   - 原版对话框可用则用对话框，否则退回聊天输入(默认)
    #   dialog - 强制对话框；不可用时该交互被禁用
    #   chat   - 强制聊天输入
    # 对话框需要客户端 1.21.6 及以上，并且 EmakiCoreLib 的 dialog.enabled 为 true。
    mode: "auto"
    # 对话框配置。键集与 EmakiCoreLib/dialogs/*.yml 完全一致，
    # 但 id 由插件提供，这里不需要写。
    #
    # title / body 的 text / inputs 的 label / buttons 的 label 与 tooltip
    # 填语言键名时会读取 lang/*.yml；键不存在则按原文渲染，可直接写 MiniMessage。
    #
    # inputs 必须保留一个 key 为 amount 的输入框，否则对话框取不到数量，
    # 该交互会按 mode 回退聊天输入(auto)或被禁用(dialog)。
    dialog:
      title: "dialog.withdraw.title"
      # 玩家按 ESC 是否可以关闭
      can_close_with_escape: true
      # 打开时是否暂停单人游戏
      pause: false
      body:
        - "dialog.withdraw.body"
      inputs:
        - type: "text"
          key: "amount"
          label: "dialog.withdraw.label"
          # 输入长度上限，0 表示不限制
          max_length: 32
      buttons:
        - label: "dialog.confirm"
  deposit_filter:
    mode: blacklist # blacklist | whitelist | off
    entries: [] # CoreLib ItemSource token 列表
  # 是否允许存入带唯一标记（EmakiItem 实例 UUID 等）的物品
  allow_unique_items: true
  # 同一物品单槽存满后，是否自动占用新槽位继续存储。
  #   false（默认）存满即拒绝剩余部分，与旧版行为一致
  #   true         一个条目可跨多格，占用格数 = ceil(数量 / 单槽上限)
  #
  # 例：单槽上限 100，手上 120 个橡木原木。
  #   false → 存入 100，剩余 20 被拒绝
  #   true  → 存入 120，显示为 [100] [20] 两格
  #
  # 跨格条目的多个格子共享同一个数量池：点任意一格取出都从总量扣。
  # 上例取出 20 后总量回到 100，第 2 格自动消失，后面的条目前滚填补。
  #
  # 仍然受总槽位数限制：装不下的部分照旧被拒绝，不会突破 capacity 上限。
  # 注意：开启后 usedSlots 需遍历全部条目累加占用格数（关闭时为 O(1)），
  # 单玩家条目数很大时每次界面刷新的开销会上升。
  # 从 true 改回 false 不丢数据：已超限的条目仍占一格、显示按 100% 截断、
  # 拒绝新存入、可正常取空。
  multi_slot_stacking: false
  # 排序默认值：material_asc|material_desc|name_asc|name_desc|amount_asc|amount_desc
  default_sort: amount_desc
  # 是否允许玩家在 GUI 中切换排序（false 时强制使用 default_sort）
  player_sort_enabled: true

# ------------------------------------------------------------
# 自动拾取
# ------------------------------------------------------------
# 让掉落物直接进入仓库而不占用背包。
# 需要 emakistorage.autopickup 权限，并由玩家用 /storage autopickup 自行开启；
# 开关按玩家保存在各自的 meta.yml 中。
auto_pickup:
  enabled: true
  # 拾取模式：
  #   on_pickup - 玩家拾取物品时决定该掉落物是否直接进入仓库(默认)。
  #               零额外开销，行为可预测，推荐使用。
  #   radius    - 周期扫描玩家附近的掉落物并吸入仓库，类似磁铁效果。
  #               只吸取无主或属于该玩家的掉落物，且尊重拾取延迟。
  mode: "on_pickup"
  # radius 模式的扫描半径(格)，会被 max_radius 夹紧。仅 radius 模式生效。
  radius: 8
  # 半径上限，防止配置过大导致扫描开销失控。
  max_radius: 16
  # radius 模式的扫描间隔(tick)。调小更灵敏但更耗性能。仅 radius 模式生效。
  scan_interval_ticks: 10
  # 新玩家的默认状态。默认关闭，避免既有玩家升级后行为突变。
  default_enabled: false
  # 仓库存不下时的提示节流(毫秒)，0 表示不提示。
  # 拾取是高频事件，设得过小会刷屏。
  # 注意：仓库放不下时会整单交还原版拾取(进背包)，不做部分存入。
  notify_cooldown_ms: 3000

# ------------------------------------------------------------
# 搜索
# ------------------------------------------------------------
search:
  enabled: true
  # 关于按中文名搜索原版物品：
  #   原版物品名由客户端翻译，服务端默认只有英文命名空间键，所以 @营火 搜不到、@campfire 能搜到。
  #   需要中文名搜索时，在 EmakiCoreLib 的 config.yml 中开启 vanilla_language.enabled，
  #   CoreLib 会联网下载一份原版语言表并缓存；此后英文键与中文名都可命中。
  #   未开启或下载失败时搜索行为不变，不会报错。
  # 前缀操作符（可改，避免与物品名冲突）
  operators:
    name: "@"
    lore: "#"
    id: "$"
    exclude: "!"
  # 搜索关键词的输入方式
  input:
    # auto - 对话框可用则用对话框，否则退回聊天输入(默认)
    # dialog - 强制对话框；不可用时搜索输入被禁用
    # chat - 强制聊天输入
    mode: "auto"
    # 聊天输入等待超时（秒）
    timeout: 30
    # 取消聊天输入的关键词
    cancel_keywords: ["取消", "cancel"]
    # 对话框配置，键集同 behavior.withdraw_prompt.dialog。
    # inputs 必须保留一个 key 为 query 的输入框，否则对话框取不到关键词。
    dialog:
      title: "dialog.search.title"
      can_close_with_escape: true
      pause: false
      body:
        - "dialog.search.body"
      inputs:
        - type: "text"
          key: "query"
          label: "dialog.search.label"
          max_length: 64
      buttons:
        - label: "dialog.confirm"
  # 不提供正则搜索：恶意正则会造成 ReDoS 卡服，且子串匹配已够用

# ------------------------------------------------------------
# 持久化
# ------------------------------------------------------------
persistence:
  # 自动保存间隔（秒），0 = 仅在关闭 GUI 与下线时保存。
  # 期间的多次数量变化会合并为一次写盘
  autosave_interval: 300
  # 停用时等待文件 drain 的超时（秒）
  drain_timeout: 10

# ------------------------------------------------------------
# 存取流水日志
# ------------------------------------------------------------
# 只写不读，业务逻辑永不读取这些文件。
logging:
  enabled: true
  # 日志保留天数。过期文件按日删除；某玩家的日志全部过期后其目录一并删除
  retention_days: 30
  # 只记录这些来源（gui/command/api/action），留空 = 全部
  sources: []
  # 注意：ADMIN_SET / ADMIN_GIVE / ADMIN_CLEAR 三类管理员操作强制记录，
  # 不受 enabled 与 sources 影响

debug: false
