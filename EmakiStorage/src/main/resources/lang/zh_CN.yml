  default_file_missing: "[loader] <yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  directory_create_failed: "[loader] <yellow>创建目录失败: <red>%path%</red></yellow>"
  # 控制台: 能力发布被拒绝; 占位符: %reason%
  capability_refused: "[integration] 能力发布被拒绝: %reason%"
  # 控制台: PlaceholderAPI 扩展注册被拒绝
  papi_registration_refused: "[integration] PlaceholderAPI 扩展注册被拒绝"
  # 控制台: PlaceholderAPI 扩展不可用; 占位符: %reason%
  papi_unavailable: "[integration] PlaceholderAPI 扩展不可用: %reason%"
  # 控制台: 为玩家导出仓库失败; 占位符: %player%, %error%
  export_failed: "[command] 为玩家 %player% 导出仓库失败: %error%"
  # 控制台: 界面模板加载问题; 占位符: %issue%
  gui_issue: "%issue%"
  # 控制台: 付费扩容成本文件缺失; 占位符: %file%
  cost_file_missing: "[economy] %file% 缺失或为空; 在提供之前付费扩容已禁用"
  # 控制台: 解锁档位 count_range 无效; 占位符: %range%
  unlock_tier_invalid_range: "[economy] 跳过 count_range 无效的解锁档位: %range%"
  # 控制台: 解锁档位缺少价格; 占位符: %range%
  unlock_tier_no_price: "[economy] 跳过没有配置价格的解锁档位 %range%"
  # 控制台: unlock_costs.yml 回退配置缺少正的 max_amount 保护值
  unlock_fallback_invalid: "[economy] unlock_costs.yml 回退配置需要一个正的 max_amount 保护值; 超出既定档位的付费扩容已禁用"
  # 控制台: 打开编辑界面失败; 占位符: %item%, %error%
  editor_open_failed: "[editor] <red>无法打开 EmakiStorage 编辑界面: %item%  (%error%)</red>"
  # 控制台: 编辑界面模板缺失; 占位符: %template%
  editor_template_missing: "[editor] <red>缺少 EmakiStorage 编辑界面模板: %template%</red>"
  # 控制台: 创建定义失败; 占位符: %path%, %error%
  editor_browser_create_failed: "[editor] <red>无法创建定义: %path%  (%error%)</red>"
  # 控制台: 删除定义失败; 占位符: %path%, %error%
  editor_browser_delete_failed: "[editor] <red>无法删除定义: %path%  (%error%)</red>"
  # 控制台: 列举定义目录失败; 占位符: %path%, %error%
  editor_browser_list_failed: "[editor] <red>无法列举定义目录: %path%  (%error%)</red>"
  # 控制台: 为玩家加载仓库失败; 占位符: %player%, %reason%
  storage_load_failed: "[persistence] 为玩家 %player% 加载仓库失败: %reason%"
  # 控制台: 注册流水线阶段失败; 占位符: %stage%, %reason%
  stage_register_failed: "[registry] 注册流水线阶段 '%stage%' 失败: %reason%"
  config_precheck_passed: "[config] <gray>配置预检通过: <yellow>%issues%</yellow> 个提示</gray>"
  config_precheck_failed: "[config] <red>配置预检失败: <yellow>%issues%</yellow> 个问题</red>"
  config_precheck_issue: "[config] <gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "[config] <yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "[config] <red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray> (%hint%)</dark_gray>"
    messages:
      passed: "EmakiStorage 配置预检通过"
      required_file_missing: "缺少必需文件"
      path_not_file: "指定路径不是文件"
      file_not_readable: "文件不可读"
      required_directory_missing: "缺少必需目录"
      path_not_directory: "指定路径不是目录"
      directory_not_readable: "目录不可读"

