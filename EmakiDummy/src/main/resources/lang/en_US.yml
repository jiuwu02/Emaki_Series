# EmakiDummy English language resource
# Messages use MiniMessage; placeholder syntax is %key%
# version is maintained by the resource sync flow to merge new default keys

version: "1.0.7"

general:
  prefix: "<gray>[ <gradient:#22D3EE:#14B8A6>EmakiDummy</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to run this command</red>"
  invalid_args: "<red>Invalid arguments</red>"
  unknown_command: "<red>Unknown subcommand: %sub%. Use /edummy help for help</red>"

command:
  help_header: "<gray><st>        </st></gray> <gradient:#22D3EE:#14B8A6>EmakiDummy Command Help</gradient> <gray><st>        </st></gray>"
  help_entry_join: "- <hover:show_text:'<gray>join</gray> <dark_gray>·</dark_gray> <gray>Let a dummy join the server</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Omit [name] to generate a name automatically</gray><newline><dark_gray>▸</dark_gray> <gray>Example </gray><white>%root% join Tom</white>'><gray>join</gray></hover> <click:run_command:'%root% join'><green>[ ✦ Run ]</green></click>"
  help_entry_leave: "- <hover:show_text:'<gray>leave</gray> <dark_gray>·</dark_gray> <gray>Disconnect the given dummy</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Argument: name - click to see available values</gray>'><gray>leave</gray></hover> <click:run_command:'%root% help leave name'><yellow>[ ✦ Show values ]</yellow></click>"
  help_entry_say: "- <hover:show_text:'<gray>say</gray> <dark_gray>·</dark_gray> <gray>Make the dummy send chat</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Usage </gray><white>%root% say [name] [text]</white>'><gray>say</gray></hover> <hover:show_text:'<gray>Argument: name</gray><newline><gray>the dummy that speaks</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests online dummies</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ name ]</gray></hover> <hover:show_text:'<gray>Argument: text</gray><newline><gray>the chat text to send</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ text ]</gray></hover>"
  help_entry_cmd: "- <hover:show_text:'<gray>cmd</gray> <dark_gray>·</dark_gray> <gray>Make the dummy run a command</gray><newline><newline><dark_gray>▸</dark_gray> <gray>The leading slash is optional</gray><newline><dark_gray>▸</dark_gray> <gray>Usage </gray><white>%root% cmd [name] [command]</white>'><gray>cmd</gray></hover> <hover:show_text:'<gray>Argument: name</gray><newline><gray>the dummy that runs the command</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests online dummies</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ name ]</gray></hover> <hover:show_text:'<gray>Argument: command</gray><newline><gray>the command text to run, slash optional</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ command ]</gray></hover>"
  help_entry_walk: "- <hover:show_text:'<gray>walk</gray> <dark_gray>·</dark_gray> <gray>Walk the dummy to given coordinates in a straight line</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Usage </gray><white>%root% walk [name] [x] [y] [z]</white>'><gray>walk</gray></hover> <hover:show_text:'<gray>Argument: name</gray><newline><gray>the dummy to move</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests online dummies</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ name ]</gray></hover> <hover:show_text:'<gray>Argument: x y z</gray><newline><gray>target coordinates, type all three numbers</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ x ] [ y ] [ z ]</gray></hover>"
  help_entry_look: "- <hover:show_text:'<gray>look</gray> <dark_gray>·</dark_gray> <gray>Adjust the dummy view angle</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Usage </gray><white>%root% look [name] [yaw] [pitch]</white>'><gray>look</gray></hover> <hover:show_text:'<gray>Argument: name</gray><newline><gray>the dummy to adjust</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests online dummies</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ name ]</gray></hover> <hover:show_text:'<gray>Argument: yaw pitch</gray><newline><gray>yaw and pitch angles, type both numbers</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ yaw ] [ pitch ]</gray></hover>"
  help_entry_interact: "- <hover:show_text:'<gray>interact</gray> <dark_gray>·</dark_gray> <gray>Right click the block in front or at given coordinates</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Argument: name - click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Omit [x] [y] [z] to right click the block in front</gray><newline><dark_gray>▸</dark_gray> <gray>Usage </gray><white>%root% interact [name] [x] [y] [z]</white>'><gray>interact</gray></hover> <click:run_command:'%root% help interact name'><yellow>[ ✦ Show values ]</yellow></click> <hover:show_text:'<gray>Argument: x y z</gray><newline><gray>optional coordinates of the block to right click</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ x ] [ y ] [ z ]</gray></hover>"
  help_entry_attack: "- <hover:show_text:'<gray>attack</gray> <dark_gray>·</dark_gray> <gray>Attack the nearest non-player entity</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Argument: name - click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>A message is shown when no entity is in range</gray>'><gray>attack</gray></hover> <click:run_command:'%root% help attack name'><yellow>[ ✦ Show values ]</yellow></click>"
  help_entry_click: "- <hover:show_text:'<gray>click</gray> <dark_gray>·</dark_gray> <gray>Left click a slot of the currently open window</gray><newline><newline><dark_gray>▸</dark_gray> <gray>A message is shown when the dummy has no open window</gray><newline><dark_gray>▸</dark_gray> <gray>Usage </gray><white>%root% click [name] [slot]</white>'><gray>click</gray></hover> <hover:show_text:'<gray>Argument: name</gray><newline><gray>the dummy whose window is clicked</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests online dummies</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ name ]</gray></hover> <hover:show_text:'<gray>Argument: slot</gray><newline><gray>window slot index, from 0 to 53</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests 0 to 53</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ slot ]</gray></hover>"
  help_entry_list: "- <hover:show_text:'<gray>list</gray> <dark_gray>·</dark_gray> <gray>List online dummies with state and position</gray>'><gray>list</gray></hover> <click:run_command:'%root% list'><green>[ ✦ Run ]</green></click>"
  help_entry_scenario: "- <hover:show_text:'<gray>scenario</gray> <dark_gray>·</dark_gray> <gray>Run or stop a test scenario</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakidummy.admin</white><newline><dark_gray>▸</dark_gray> <gray>Scenario files live in </gray><white>plugins/EmakiDummy/scenarios/</white><newline><dark_gray>▸</dark_gray> <gray>Only one scenario can run at a time</gray>'><gray>scenario</gray></hover> <click:run_command:'%root% help scenario'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>run</gray> <dark_gray>·</dark_gray> <gray>run the given scenario</gray><newline><gray>stop</gray> <dark_gray>·</dark_gray> <gray>stop the given scenario</gray>'><gray>[ ✦ Args ]</gray></click>"
  help_entry_stop_all: "- <hover:show_text:'<gray>stop-all</gray> <dark_gray>·</dark_gray> <gray>Disconnect all dummies and stop the running scenario</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakidummy.admin</white>'><gray>stop-all</gray></hover> <click:run_command:'%root% stop-all'><green>[ ✦ Run ]</green></click>"
  help_entry_help: "- <hover:show_text:'<gray>help</gray> <dark_gray>·</dark_gray> <gray>Show this help page</gray>'><gray>help</gray></hover> <click:run_command:'%root% help'><green>[ ✦ Run ]</green></click>"
  help_scenario_header: "<gray><st>        </st></gray> <gradient:#22D3EE:#14B8A6>EmakiDummy scenario Command Help</gradient> <gray><st>        </st></gray>"
  help_scenario_entry_run: "- <hover:show_text:'<gray>run</gray> <dark_gray>·</dark_gray> <gray>Run the given test scenario</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Argument: scenario ID - click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakidummy.admin</white>'><gray>run</gray></hover> <click:run_command:'%root% help scenario run'><yellow>[ ✦ Show values ]</yellow></click>"
  help_scenario_entry_stop: "- <hover:show_text:'<gray>stop</gray> <dark_gray>·</dark_gray> <gray>Stop the running scenario</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Argument: scenario ID - click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakidummy.admin</white>'><gray>stop</gray></hover> <click:run_command:'%root% help scenario stop'><yellow>[ ✦ Show values ]</yellow></click>"
  help_leave_name_header: "<gray><st>        </st></gray> <gradient:#22D3EE:#14B8A6>EmakiDummy leave [name] values</gradient> <gray><st>        </st></gray>"
  help_attack_name_header: "<gray><st>        </st></gray> <gradient:#22D3EE:#14B8A6>EmakiDummy attack [name] values</gradient> <gray><st>        </st></gray>"
  help_interact_name_header: "<gray><st>        </st></gray> <gradient:#22D3EE:#14B8A6>EmakiDummy interact [name] values</gradient> <gray><st>        </st></gray>"
  help_scenario_run_id_header: "<gray><st>        </st></gray> <gradient:#22D3EE:#14B8A6>EmakiDummy scenario run [scenario ID] values</gradient> <gray><st>        </st></gray>"
  help_scenario_stop_id_header: "<gray><st>        </st></gray> <gradient:#22D3EE:#14B8A6>EmakiDummy scenario stop [scenario ID] values</gradient> <gray><st>        </st></gray>"
  help_value_entry: "- <hover:show_text:'<gray>%value%</gray> <dark_gray>·</dark_gray> <gray>%desc%</gray>'><gray>%value%</gray></hover> <click:run_command:'%run%'><green>[ ✦ Run ]</green></click>"
  help_value_empty: "<dark_gray>( no values available )</dark_gray>"
  help_value_desc_leave_name: "Disconnect dummy %value%"
  help_value_desc_attack_name: "Make dummy %value% attack the nearest non-player entity"
  help_value_desc_interact_name: "Make dummy %value% right click the block in front"
  help_value_desc_scenario_run_id: "Run test scenario %value%"
  help_value_desc_scenario_stop_id: "Stop test scenario %value%"
  help_footer: "<gray><st>                                        </st></gray>"
  join:
    duplicate: "<yellow>Dummy %name% already exists</yellow>"
    limit: "<red>Dummy limit reached: %limit%</red>"
    connecting: "<gray>Dummy %name% is connecting to %host%:%port% ...</gray>"
    failed: "<red>Dummy %name% failed to connect: %reason%</red>"
  leave:
    usage: "<red>Usage: /edummy leave <name></red>"
    not_found: "<yellow>Dummy %name% does not exist</yellow>"
    done: "<green>Dummy %name% disconnected</green>"
  say:
    usage: "<red>Usage: /edummy say <name> <text></red>"
    not_found: "<yellow>Dummy %name% does not exist or has not joined</yellow>"
    sent: "<gray>Dummy %name% sent chat: %text%</gray>"
  cmd:
    usage: "<red>Usage: /edummy cmd <name> <command></red>"
    not_found: "<yellow>Dummy %name% does not exist or has not joined</yellow>"
    sent: "<gray>Dummy %name% ran: %command%</gray>"
  walk:
    usage: "<red>Usage: /edummy walk <name> <x> <y> <z></red>"
    not_found: "<yellow>Dummy %name% does not exist or has not joined</yellow>"
    started: "<gray>Dummy %name% started walking to %x%, %y%, %z%</gray>"
  look:
    usage: "<red>Usage: /edummy look <name> <yaw> <pitch></red>"
    not_found: "<yellow>Dummy %name% does not exist or has not joined</yellow>"
    done: "<gray>Dummy %name% view set to yaw=%yaw% pitch=%pitch%</gray>"
  interact:
    usage: "<red>Usage: /edummy interact <name> [x] [y] [z]</red>"
    not_found: "<yellow>Dummy %name% does not exist or has not joined</yellow>"
    done: "<gray>Dummy %name% right clicked block %block%</gray>"
  attack:
    usage: "<red>Usage: /edummy attack <name></red>"
    not_found: "<yellow>Dummy %name% does not exist or has not joined</yellow>"
    no_target: "<yellow>No attackable entity near dummy %name%</yellow>"
    done: "<gray>Dummy %name% attacked entity #%entity%</gray>"
  click:
    usage: "<red>Usage: /edummy click <name> <slot></red>"
    not_found: "<yellow>Dummy %name% does not exist or has not joined</yellow>"
    no_window: "<yellow>Dummy %name% has no open window right now</yellow>"
    done: "<gray>Dummy %name% clicked slot %slot%</gray>"
  list:
    header: "<gray>Online dummies (%count%):</gray>"
    entry: "<gray>- </gray><white>%name%</white><gray> [</gray><yellow>%state%</yellow><gray>] </gray><gray>@ %position%</gray>"
    empty: "<yellow>No dummies currently</yellow>"
  scenario:
    usage: "<red>Usage: /edummy scenario <run|stop> <scenarioId></red>"
    not_found: "<yellow>Scenario %id% not found (see plugins/EmakiDummy/scenarios/)</yellow>"
    busy: "<yellow>A scenario is already running: %active%</yellow>"
    started: "<gray>Scenario %id% started (players: %players%)</gray>"
    stopped: "<gray>Scenario %id% stopped</gray>"
    none_active: "<yellow>No scenario is currently running</yellow>"
    result: "<gray>Scenario <white>%id%</white> result: <green>%result%</green> (passed %passed%, failed %failed%, elapsed %elapsed%ms)</gray>"
  stopall:
    none: "<gray>No dummies currently</gray>"
    done: "<green>Disconnected all dummies (%count%)</green>"

console:
  plugin_starting: "<gray>Starting dummy test infrastructure...</gray>"
  plugin_started: "<green>EmakiDummy started, connection mode %mode% -> %host%:%port%</green>"
  plugin_stopped: "<gray>EmakiDummy stopped, all dummies and scenarios released</gray>"
  scenarios_loaded: "<gray>Loaded %count% test scenarios</gray>"
  log_retention_removed: "<gray>Log rotation removed %count% expired files</gray>"
  scenario_load_failed: "<red>Scenario load failed: %file% (%reason%)</red>"
