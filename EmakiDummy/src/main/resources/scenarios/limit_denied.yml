id: limit_denied
players:
  - dummy_a
timeout_seconds: 180
steps:
  - action: join_all
  - action: cmd
    player: dummy_a
    command: "/edg editor exit"
  - action: cmd
    player: dummy_a
    command: "/edg leave"
  - action: sleep
    seconds: 1
  - action: say
    player: dummy_a
    text: "确认"
  - action: sleep
    seconds: 2
  - action: cmd
    player: dummy_a
    command: "/edg cancel"
  - action: cmd
    player: dummy_a
    command: "/edg party disband"
  - action: sleep
    seconds: 1
  - action: cmd
    player: dummy_a
    command: "/edg enter test_dungeon"
  - action: sleep
    seconds: 2
  - action: click
    player: dummy_a
    slot: 0
  - action: sleep
    seconds: 1
  - action: click
    player: dummy_a
    slot: 0
  - action: wait_event
    type: DungeonEnterEvent
    timeout: 120
  - action: sleep
    seconds: 3
  - action: cmd
    player: dummy_a
    command: "/edg leave"
  - action: sleep
    seconds: 1
  - action: say
    player: dummy_a
    text: "确认"
  - action: sleep
    seconds: 3
  - action: cmd
    player: dummy_a
    command: "/edg enter test_dungeon"
  - action: expect
    expr: "recv_contains('dummy_a', '进入次数已用尽')"
    timeout: 20
  - action: leave_all
