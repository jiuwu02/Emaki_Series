id: message_isolation
players:
  - dummy_a
  - dummy_b
timeout_seconds: 300
steps:
  - action: join_all
  - action: cmd
    player: dummy_a
    command: "/edg editor exit"
  - action: cmd
    player: dummy_a
    command: "/edg leave"
  - action: say
    player: dummy_a
    text: "确认"
  - action: sleep
    seconds: 2
  - action: cmd
    player: dummy_a
    command: "/edg cancel"
  - action: cmd
    player: dummy_a
    command: "/edg party disband"
  - action: sleep
    seconds: 1
  - action: cmd
    player: dummy_a
    command: "/edg enter test_dungeon"
  - action: sleep
    seconds: 2
  - action: click
    player: dummy_a
    slot: 0
  - action: sleep
    seconds: 1
  - action: click
    player: dummy_a
    slot: 0
  - action: wait_event
    type: DungeonChallengeStartEvent
    timeout: 60
  - action: cmd
    player: dummy_a
    command: "/edg ready"
  - action: wait_event
    type: DungeonEnterEvent
    timeout: 120
  - action: say
    player: dummy_a
    text: "isolation_probe_inside"
  - action: say
    player: dummy_b
    text: "isolation_probe_outside"
  - action: sleep
    seconds: 5
  - action: expect
    expr: "!recv_contains('dummy_b', 'isolation_probe_inside')"
    timeout: 5
  - action: expect
    expr: "!recv_contains('dummy_a', 'isolation_probe_outside')"
    timeout: 5
  - action: cmd
    player: dummy_a
    command: "/edg globalchat on"
  - action: sleep
    seconds: 3
  - action: say
    player: dummy_a
    text: "isolation_probe_global"
  - action: expect
    expr: "recv_contains('dummy_b', 'isolation_probe_global')"
    timeout: 15
  - action: leave_all
