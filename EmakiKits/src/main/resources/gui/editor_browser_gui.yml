# ============================================================
# EmakiKits GUI 配置 - 礼包定义浏览器
# ============================================================
# /emakikits edit 无参打开的礼包文件浏览器: 列出 kits/ 下的礼包文件, 左键打开, 右键删除确认
# 新建礼包走"新建礼包"入口, 输入 ID 后生成最小合法骨架并直接进入编辑
# 5 行布局:0 返回 / 8 关闭 / 1-4 翻页与新建, 无整行空行
# ============================================================
id: "editor_browser_gui"

gui_type: CHEST
title: "<dark_gray>礼包浏览</dark_gray>"

rows: 5

slots:
  doc_entry:
    type: "field_entry"
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34

  back:
    type: "back"
    slots:
      - 0
    item:
      source: "minecraft-oak_door"
      components:
        custom_name: "<yellow>返回</yellow>"
        lore:
          - "<dark_gray>关闭浏览界面</dark_gray>"

  close:
    type: "close"
    slots:
      - 8
    item:
      source: "minecraft-barrier"
      components:
        custom_name: "<red>关闭</red>"
        lore:
          - "<dark_gray>关闭浏览界面</dark_gray>"

  page_prev:
    type: "page_prev"
    slots:
      - 36
    item:
      source: "minecraft-arrow"
      components:
        custom_name: "<gray>上一页</gray>"
        lore:
          - "<dark_gray>点击翻到上一页</dark_gray>"

  page_info:
    type: "page_info"
    slots:
      - 38
    item:
      source: "minecraft-book"
      components:
        custom_name: "<gray>第 <white>%current_page%</white>/<white>%total_pages%</white> 页</gray>"
        lore:
          - "<dark_gray>%menu_title%</dark_gray>"
          - "<dark_gray>礼包数: %entry_count%</dark_gray>"

  page_next:
    type: "page_next"
    slots:
      - 40
    item:
      source: "minecraft-arrow"
      components:
        custom_name: "<gray>下一页</gray>"
        lore:
          - "<dark_gray>点击翻到下一页</dark_gray>"

  new_doc:
    type: "new_doc"
    slots:
      - 42
    item:
      source: "minecraft-lime_dye"
      components:
        custom_name: "<green>新建礼包</green>"
        lore:
          - "<gray>输入新礼包的 ID, 生成最小合法骨架</gray>"
          - "<dark_gray>点击创建</dark_gray>"

  border:
    type: "filler"
    slots:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 9
      - 17
      - 18
      - 26
      - 27
      - 35
      - 37
      - 39
      - 41
      - 43
      - 44
    item:
      source: "minecraft-gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true
