# EmakiKits 礼包定义
#
# 每个顶层键是一个礼包 id; id 仅允许小写字母, 数字, 下划线与连字符
# 不同礼包类型的差异全部由下列配置段表达, 不存在写死在代码里的单一流程
# 修改后使用 /emakikits reload 热重载

kits:
  # ============================================================
  # 入服礼包: first_join 或指定 world 触发, 幂等键按 first/每次入服区分
  # ============================================================
  join_welcome:
    type: "join"
    enabled: true
    display_name: "入服礼包"
    permission: "emakikits.claim"
    join:
      on_first_join: true
      on_every_specified_join: false
      # 新玩家首次入服必须输入老玩家的邀请码 (UUID) 才发放入服礼包
      require_invite_code: true
      invite_code_type: "uuid"
      # 超过该游玩时长 (秒) 仍未绑定即错过窗口, 不补领
      missed_window_seconds: 7200
      worlds: []
    rewards:
      weighted: false
      fixed:
        - type: "item"
          id: "welcome_bread"
          material: "BREAD"
          name: "&a入服面包"
          amount: 8
        - type: "command"
          id: "welcome_msg"
          command: "say %player% 加入了服务器"
      random: []

  # ============================================================
  # 邀新礼包: 奖励对象由 reward_target 决定 (INVITER / INVITEE)
  # ============================================================
  invite_reward:
    type: "invite"
    enabled: true
    display_name: "邀新礼包"
    permission: "emakikits.claim"
    invite:
      reward_target: "INVITER"
      require_new_player: true
      allow_mutual: false
      max_binds_per_invitee: 1
    rewards:
      weighted: false
      fixed:
        - type: "exp"
          id: "invite_exp"
          amount: 50
      random: []

  # ============================================================
  # 每日礼包: 周期键按 cycle.timezone 的日边界生成
  # ============================================================
  daily_login:
    type: "daily"
    enabled: true
    display_name: "每日礼包"
    permission: "emakikits.claim"
    cycle:
      timezone: "Asia/Shanghai"
      # false 表示不补领错过的周期
      allow_makeup: false
    rewards:
      weighted: false
      fixed:
        - type: "command"
          id: "daily_heal"
          command: "effect give %player% minecraft:regeneration 10 1"
      random: []

  # ============================================================
  # 每周礼包: 周期键按周一 00:00 边界
  # ============================================================
  weekly_supply:
    type: "weekly"
    enabled: true
    display_name: "每周礼包"
    permission: "emakikits.claim"
    cycle:
      timezone: "Asia/Shanghai"
      allow_makeup: false
    rewards:
      weighted: false
      fixed:
        - type: "item"
          id: "weekly_iron"
          material: "IRON_INGOT"
          amount: 16
      random: []

  # ============================================================
  # 每月礼包: 周期键按每月 1 日边界
  # ============================================================
  monthly_crate:
    type: "monthly"
    enabled: true
    display_name: "每月礼包"
    permission: "emakikits.claim"
    cycle:
      timezone: "Asia/Shanghai"
      allow_makeup: false
    rewards:
      weighted: false
      fixed:
        - type: "item"
          id: "monthly_diamond"
          material: "DIAMOND"
          amount: 4
      random: []

  # ============================================================
  # CDK 礼包: 全局一次性; 同一 code 全服仅成功一次
  # ============================================================
  cdk_global:
    type: "cdk"
    enabled: true
    display_name: "全局 CDK"
    permission: "emakikits.claim"
    cdk:
      mode: "global_once"
      codes:
        - "WELCOME-2026"
        - "EMAKI-ONLY"
      per_player_limit: 1
    rewards:
      weighted: false
      fixed:
        - type: "item"
          id: "cdk_global_gold"
          material: "GOLD_INGOT"
          amount: 8
      random: []

  # ============================================================
  # CDK 礼包: 每玩家一次; 不同玩家可分别成功
  # ============================================================
  cdk_per_player:
    type: "cdk"
    enabled: true
    display_name: "每人 CDK"
    permission: "emakikits.claim"
    cdk:
      mode: "per_player_once"
      codes:
        - "NEWPLAYER"
      per_player_limit: 1
    rewards:
      weighted: false
      fixed:
        - type: "exp"
          id: "cdk_exp"
          amount: 30
      random: []

  # ============================================================
  # 自选礼包: 校验数量, 权限, 重复与未配置项
  # ============================================================
  choice_starter:
    type: "choice"
    enabled: true
    display_name: "自选礼包"
    permission: "emakikits.claim"
    choice:
      # 复用 CoreLib GUI 模板, 对应 gui/<id>.yml
      gui_template: "choice"
      min_select: 1
      max_select: 2
      options:
        sword:
          display: "新手剑"
          permission: ""
          rewards:
            - type: "item"
              id: "opt_sword"
              material: "IRON_SWORD"
              amount: 1
        bow:
          display: "新手弓"
          permission: ""
          rewards:
            - type: "item"
              id: "opt_bow"
              material: "BOW"
              amount: 1
        vip:
          display: "VIP 专属"
          permission: "emakikits.admin"
          rewards:
            - type: "item"
              id: "opt_vip"
              material: "DIAMOND"
              amount: 2
    rewards:
      weighted: false
      fixed: []
      random: []

  # ============================================================
  # 通用礼包: 固定 + 加权随机 + 混合奖励 + 购买 + 开启次数档位
  # ============================================================
  generic_crate:
    type: "generic"
    enabled: true
    display_name: "通用礼包"
    permission: "emakikits.claim"
    max_claims_total: 0
    limit:
      # 通用礼包限时属性: always / range / cron
      enabled: false
      mode: "always"
      # range 模式使用 ISO-8601 时间戳, 闭区间
      start: ""
      end: ""
      # cron 模式使用 CoreLib 6 字段表达式 (秒 分 时 日 月 周)
      # 例: 每天 20:00 开启, 持续 3600 秒
      cron: "0 0 20 * * *"
      duration_seconds: 3600
      timezone: "Asia/Shanghai"
    purchase:
      enabled: true
      # 价格 > 0 且未检出经济桥时购买一律拒绝
      price: 100.0
      economy_provider: "auto"
      currency_id: ""
      # 0 表示不限购买总次数; 与开启计数互相独立
      max_purchases: 10
      count_pass_to_nested: false
    open:
      enabled: true
      max_opens: 0
      milestones:
        3:
          rewards:
            - type: "exp"
              id: "milestone_3"
              amount: 20
        5:
          rewards:
            - type: "command"
              id: "milestone_5"
              command: "say %player% 累计开启 5 次"
    rewards:
      weighted: true
      fixed:
        - type: "command"
          id: "crate_open_msg"
          command: 'tellraw %player% {"text":"礼包已开启"}'
      random:
        - type: "item"
          id: "roll_common"
          material: "COBBLESTONE"
          amount: 16
          weight: 70
        - type: "item"
          id: "roll_rare"
          material: "DIAMOND"
          amount: 1
          weight: 25
        - type: "nested_kit"
          id: "roll_nested"
          kit_id: "join_welcome"
          weight: 5

  # ============================================================
  # 嵌套子礼包示例: 被 generic_crate 的随机奖励引用
  # 加载期会检测自引用, 循环引用, 缺失引用与递归深度
  # ============================================================
  nested_child:
    type: "generic"
    enabled: true
    display_name: "嵌套子礼包"
    permission: "emakikits.claim"
    rewards:
      weighted: false
      fixed:
        - type: "command"
          id: "child_cmd"
          command: "say 子礼包已发放给 %player%"
      random: []
