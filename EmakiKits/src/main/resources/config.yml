# EmakiKits 礼包模块主配置
#
# 礼包定义全部放在 kits/ 目录下, 一个礼包一个 YAML 文件, id 取自文件内的 id 字段
# 修改后使用 /emakikits reload 热重载
# 文件位置: plugins/EmakiKits/config.yml

version: "1.0.1"
language: "zh_CN"

# 首次启动或 kits/ 目录为空时是否释放内置示例礼包
release_default_data: true

# 所有每日/每周/每月礼包未单独指定 cycle.timezone 时使用此值
timezone: "Asia/Shanghai"

join:
  # 新玩家入服后允许输入老玩家邀请码的游玩时长窗口, 单位秒
  missed_window_seconds: 7200
  invite_code_type: "uuid"

storage:
  backend: "yaml"
  save_delay_ticks: 20
  atomic_writes: true

economy:
  # auto / vault / excellenteconomy; 未装经济桥时价格 > 0 的购买一律拒绝
  provider: "auto"
  currency_id: ""

invite:
  enabled: true
  require_new_player: true
  allow_mutual: false
  max_binds_per_invitee: 1
  new_player_markers:
    - "first_join"

cdk:
  case_sensitive: false
  max_codes_per_kit: 10000

nested:
  # 子礼包递归深度上限, 范围 1-16
  max_depth: 4
  count_pass_to_nested: false
