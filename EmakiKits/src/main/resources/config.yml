# EmakiKits 礼包模块主配置
#
# 控制礼包定义的加载范围, 存储, 经济桥, 邀新判定, CDK, 嵌套边界与入服窗口
# 修改后使用 /emakikits reload 热重载
# 文件位置: plugins/EmakiKits/config.yml

version: "1.0.0"
language: "zh_CN"

# ============================================================
# 全局周期与时区
# ============================================================
# 所有每日/每周/每月礼包未单独指定 cycle.timezone 时使用此值
# 取值必须是 java.time.ZoneId 可解析的 IANA 时区, 如 Asia/Shanghai
timezone: "Asia/Shanghai"

# ============================================================
# 入服与邀新窗口
# ============================================================
join:
  # 新玩家入服后允许输入老玩家邀请码的游玩时长窗口, 单位秒
  # 达到该时长仍未绑定即视为错过, 不补领
  missed_window_seconds: 7200
  # 邀请码类型: uuid 使用老玩家 UUID, name 使用老玩家名
  invite_code_type: "uuid"

# ============================================================
# 存储与持久化
# ============================================================
storage:
  # 当前仅支持 yaml; 保留字段用于显式声明, 不提供第二套实现
  backend: "yaml"
  # 脏数据延迟落盘间隔, 单位 tick, 最小 1
  save_delay_ticks: 20
  # 是否使用 tmp + move 原子替换; 关闭后退化为直接覆盖
  atomic_writes: true

# ============================================================
# 经济桥 (购买扣款)
# ============================================================
# EmakiCoreLib 作为硬依赖提供经济桥; 桥不可用时任何价格 > 0 的购买一律拒绝
economy:
  # auto / vault / excellenteconomy; 由可选桥解释
  provider: "auto"
  # ExcellentEconomy 的货币 id; Vault 留空
  currency_id: ""

# ============================================================
# 邀新全局规则
# ============================================================
invite:
  enabled: true
  # true 时被邀请人必须是首次入服; false 放宽为任意在线玩家
  require_new_player: true
  # false 时禁止邀请人本身已被他人邀请 (防互邀链)
  allow_mutual: false
  # 同一被邀请人最多被绑定次数
  max_binds_per_invitee: 1
  # 新玩家判定标记; 当前实现只使用 first_join
  new_player_markers:
    - "first_join"

# ============================================================
# CDK 全局规则
# ============================================================
cdk:
  # false 时兑换码统一小写比较
  case_sensitive: false
  # 单个礼包允许配置的最大兑换码数量
  max_codes_per_kit: 10000

# ============================================================
# 嵌套礼包
# ============================================================
nested:
  # 子礼包递归深度上限, 范围 1-16
  max_depth: 4
  # 子礼包内部开启计数是否向父礼包传递; 默认不传递
  count_pass_to_nested: false
