# EmakiStructure English language resource
# Messages use MiniMessage; keep placeholders noted beside each message group
# version is maintained by the resource sync flow to merge new default keys

version: "1.0.12"

tags:
  cache: '[ cache ]'
  export: '[ export ]'
  furniture: '[ furniture ]'
  replace: '[ replace ]'
  rollback: '[ rollback ]'

general:
  prefix: "<gray>[ <gradient:#F59E0B:#F97316>EmakiStructure</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to run this command</red>"
  player_only: "<red>This command can only be run by a player</red>"
  invalid_args: "<red>Invalid arguments</red>"
  unknown_command: "<red>Unknown command, run /ems help for a list of commands</red>"

console:
  plugin_starting: "<gray>Starting...</gray>"
  plugin_started: "<green>Startup complete</green>"
  plugin_stopped: "<yellow>Disabled</yellow>"
  bootstrap_start: "<gray>Synchronising bundled resources...</gray>"
  bootstrap_skip: "Skipped default data installation as configured"
  bootstrap_complete: "Bundled resource sync complete"
  bootstrap_copy_failed: "Failed to copy bundled resource: %path%  (%error%)"
  bootstrap_save_failed: "Failed to save versioned resource: %path%  (%error%)"
  default_file_missing: "<yellow>Default resource missing, re-extracted: <white>%path%</white></yellow>"
  directory_create_failed: "<red>Failed to create directory: <white>%path%</white> (%error%)</red>"
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  loader_config_load_error: "<yellow>Failed to load Structure config: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  # placeholders: %count%
  templates_loaded: "<gray>Loaded <yellow>%count%</yellow> structure templates</gray>"
  # placeholders: %path%, %value%, %expected%
  config_issue: "<yellow>Config key <white>%path%</white> value <white>%value%</white> is invalid  (expected <white>%expected%</white>), a valid value was applied</yellow>"
  # placeholders: %template%
  cache_rejected: "<yellow>Template <white>%template%</white> exceeds the cache size limit, it will not be cached</yellow>"
  # placeholders: %count%
  reload_complete: "<green>Reload complete, <white>%count%</white> structure templates</green>"
  # placeholders: %template%, %index%, %type%, %error%
  spawn_entry_failed: "<yellow>Template %template% entry #%index% failed to spawn %type%: %error%</yellow>"
  # placeholders: %file%, %index%, %reason%
  spawn_entry_issue: "<yellow>Spawn point %file% entry #%index% skipped: %reason%</yellow>"
  # placeholders: %file%, %error%
  config_reload_failed: "<red>Failed to parse %file%, previous configuration kept running: %error%</red>"
  # placeholders: %template%, %count%
  template_legacy_skipped: "<yellow>Template <white>%template%</white> has %count% block states that cannot be parsed by the current version, skipped by legacy_policy</yellow>"
  # placeholders: %source%
  furniture_source_ready: "<gray>Furniture source connected: <aqua>%source%</aqua></gray>"
  # placeholders: %namespace%
  custom_block_source_ready: "<gray>Custom block namespace connected: <aqua>%namespace%</aqua></gray>"
  # placeholders: %template%, %structure%
  replace_template_missing: "<yellow>Template <white>%template%</white> referenced by a replace rule does not exist  (structure %structure%), vanilla generation proceeds</yellow>"
  # placeholders: %count%
  rollback_recovering: "<yellow>Detected %count% unfinished transactions, startup rollback in progress, generation is temporarily unavailable</yellow>"
  # placeholders: %count%
  rollback_recovered: "<green>Startup rollback complete, %count% transactions</green>"
  # placeholders: %file%
  rollback_partial: "<red>Transaction %file% could not be fully rolled back, marked rollback-partial  (visible via /ems debug), it will not be retried automatically</red>"
  # placeholders: %template%, %index%, %id%
  furniture_source_absent: "<yellow>Template %template% furniture entry #%index%  (%id%) needs a furniture plugin that is not installed, skipped</yellow>"
  # placeholders: %template%, %index%, %id%
  furniture_place_failed: "<yellow>Template %template% furniture entry #%index%  (%id%) failed to place, entry skipped</yellow>"
  # placeholders: %file%, %index%, %reason%
  furniture_entry_issue: "<yellow>Furniture point %file% entry #%index% skipped: %reason%</yellow>"
  # placeholders: none
  export_furniture_absent: "<gray>0 furniture captured  (no furniture plugin present), any existing furniture companion file was left untouched</gray>"
  # placeholders: none

command:
  usage: "<gray>Usage: /ems &lt;get|select|structure|reload|multiblock|help&gt; ...  (run /ems help for the full list)</gray>"
  help_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiStructure Command Help</gradient> <gray><st>        </st></gray>"
  help_entry_help: "- <hover:show_text:'<gray>help</gray> <dark_gray>·</dark_gray> <gray>Show this help page</gray>'><gray>help</gray></hover> <click:run_command:'%root% help'><green>[ ✦ Run ]</green></click>"
  help_entry_get: "- <hover:show_text:'<gray>get</gray> <dark_gray>·</dark_gray> <gray>Preview-generate a structure template 3 blocks in front of you</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.use</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [template] required, click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [facing] optional, defaults to south, accepts north/east/south/west and their _mirror variants</gray>'><gray>get</gray></hover> <click:run_command:'%root% help get'><yellow>[ ✦ Show values ]</yellow></click>"
  help_entry_select: "- <hover:show_text:'<gray>select</gray> <dark_gray>·</dark_gray> <gray>Select a region: set corners, resize or clear the selection</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>select</gray></hover> <click:run_command:'%root% help select'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>pos1</gray> <dark_gray>·</dark_gray> <gray>set the first corner</gray><newline><gray>pos2</gray> <dark_gray>·</dark_gray> <gray>set the second corner</gray><newline><gray>adjust</gray> <dark_gray>·</dark_gray> <gray>grow or shrink the selection by direction</gray><newline><gray>clear</gray> <dark_gray>·</dark_gray> <gray>clear the current selection</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_entry_structure: "- <hover:show_text:'<gray>structure</gray> <dark_gray>·</dark_gray> <gray>Structure templates: export the selection or place a template</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>structure</gray></hover> <click:run_command:'%root% help structure'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>export</gray> <dark_gray>·</dark_gray> <gray>export the current selection as a structure template</gray><newline><gray>place</gray> <dark_gray>·</dark_gray> <gray>place a structure template at your position</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_entry_reload: "- <hover:show_text:'<gray>reload</gray> <dark_gray>·</dark_gray> <gray>Reload configuration, language and template caches</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.reload</white>'><gray>reload</gray></hover> <click:run_command:'%root% reload'><green>[ ✦ Run ]</green></click>"
  help_entry_multiblock: "- <hover:show_text:'<gray>multiblock</gray> <dark_gray>·</dark_gray> <gray>Multiblock structures: export layouts, place definitions, list and validate</gray><newline><newline><dark_gray>▸</dark_gray> <gray>export/place require permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>list/validate require permission </gray><white>emakistructure.admin</white>'><gray>multiblock</gray></hover> <click:run_command:'%root% help multiblock'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>export</gray> <dark_gray>·</dark_gray> <gray>export the current selection as a multiblock definition</gray><newline><gray>place</gray> <dark_gray>·</dark_gray> <gray>place a multiblock definition at your position</gray><newline><gray>list</gray> <dark_gray>·</dark_gray> <gray>list the loaded multiblock definitions</gray><newline><gray>validate</gray> <dark_gray>·</dark_gray> <gray>validate resolvability of a multiblock definition</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_entry_debug: "- <hover:show_text:'<gray>debug</gray> <dark_gray>·</dark_gray> <gray>Manage Debug mode and diagnostic output</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.admin</white>'><gray>debug</gray></hover> <click:run_command:'%root% help debug'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>status</gray> <dark_gray>·</dark_gray> <gray>show the debug status</gray><newline><gray>on</gray> <dark_gray>·</dark_gray> <gray>turn debug output on</gray><newline><gray>off</gray> <dark_gray>·</dark_gray> <gray>turn debug output off</gray><newline><gray>player</gray> <dark_gray>·</dark_gray> <gray>track or untrack a player</gray><newline><gray>module</gray> <dark_gray>·</dark_gray> <gray>toggle module debug output</gray><newline><gray>action</gray> <dark_gray>·</dark_gray> <gray>action pipeline debugging</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_select_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiStructure select Command Help</gradient> <gray><st>        </st></gray>"
  help_select_entry_first: "- <hover:show_text:'<gray>pos1</gray> <dark_gray>·</dark_gray> <gray>Set the first selection corner at your current position</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>pos1</gray></hover> <click:run_command:'%root% select pos1'><green>[ ✦ Run ]</green></click>"
  help_select_entry_second: "- <hover:show_text:'<gray>pos2</gray> <dark_gray>·</dark_gray> <gray>Set the second selection corner at your current position</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Also serves as the first corner when pos1 is missing</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>pos2</gray></hover> <click:run_command:'%root% select pos2'><green>[ ✦ Run ]</green></click>"
  help_select_entry_adjust: "- <hover:show_text:'<gray>adjust</gray> <dark_gray>·</dark_gray> <gray>Grow or shrink the current selection by direction</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>adjust</gray></hover> <hover:show_text:'<gray>Arguments: operation direction amount</gray><newline><gray>usage select adjust [add|reduce] [direction] [amount], must be typed by you</gray><newline><newline><dark_gray>▸</dark_gray> <gray>add grows, reduce shrinks</gray><newline><dark_gray>▸</dark_gray> <gray>direction front/back/left/right/up/down, relative to your facing</gray><newline><dark_gray>▸</dark_gray> <gray>amount 1-100</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ operation direction amount ]</gray></hover>"
  help_select_entry_clear: "- <hover:show_text:'<gray>clear</gray> <dark_gray>·</dark_gray> <gray>Clear the current selection</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>clear</gray></hover> <click:run_command:'%root% select clear'><green>[ ✦ Run ]</green></click>"
  help_structure_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiStructure structure Command Help</gradient> <gray><st>        </st></gray>"
  help_structure_entry_export: "- <hover:show_text:'<gray>export</gray> <dark_gray>·</dark_gray> <gray>Export the current selection as structure template structures/[name].nbt</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>export</gray></hover> <hover:show_text:'<gray>Argument: name</gray><newline><gray>template name, must be typed by you</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Argument [entities] optional, append it to capture entities too</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ name ]</gray></hover>"
  help_structure_entry_place: "- <hover:show_text:'<gray>place</gray> <dark_gray>·</dark_gray> <gray>Place a structure template at your current position</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [template] required, click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [facing] required, values listed under get, the click example uses south</gray>'><gray>place</gray></hover> <click:run_command:'%root% help structure place'><yellow>[ ✦ Show values ]</yellow></click>"
  help_multiblock_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiStructure multiblock Command Help</gradient> <gray><st>        </st></gray>"
  help_multiblock_entry_export: "- <hover:show_text:'<gray>export</gray> <dark_gray>·</dark_gray> <gray>Export the current selection as multiblock definition multiblocks/[id].yml</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Records the layout only, never places blocks</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>export</gray></hover> <hover:show_text:'<gray>Argument: id</gray><newline><gray>definition ID, must be typed by you</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Argument [force] optional, overwrites an existing same-name definition</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ id ]</gray></hover>"
  help_multiblock_entry_place: "- <hover:show_text:'<gray>place</gray> <dark_gray>·</dark_gray> <gray>Place a multiblock definition at your current position</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [id] required, click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [facing] optional, defaults to south, honored only when the definition allows rotation</gray>'><gray>place</gray></hover> <click:run_command:'%root% help multiblock place'><yellow>[ ✦ Show values ]</yellow></click>"
  help_multiblock_entry_list: "- <hover:show_text:'<gray>list</gray> <dark_gray>·</dark_gray> <gray>List loaded multiblock definitions with instance counts</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.admin</white>'><gray>list</gray></hover> <click:run_command:'%root% multiblock list'><green>[ ✦ Run ]</green></click>"
  help_multiblock_entry_validate: "- <hover:show_text:'<gray>validate</gray> <dark_gray>·</dark_gray> <gray>Validate resolvability of a multiblock definition in the current environment</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Checks unresolvable custom blocks and missing furniture sources</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistructure.admin</white><newline><dark_gray>▸</dark_gray> <gray>Argument [id] required, click to see available values</gray>'><gray>validate</gray></hover> <click:run_command:'%root% help multiblock validate'><yellow>[ ✦ Show values ]</yellow></click>"
  help_debug_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiStructure debug Command Help</gradient> <gray><st>        </st></gray>"
  help_debug_entry_status: "- <hover:show_text:'<gray>status</gray> <dark_gray>·</dark_gray> <gray>Show the current Debug state, tracked players and modules</gray>'><gray>status</gray></hover> <click:run_command:'%root% debug status'><green>[ ✦ Run ]</green></click>"
  help_debug_entry_on: "- <hover:show_text:'<gray>on</gray> <dark_gray>·</dark_gray> <gray>Turn on all debug output</gray>'><gray>on</gray></hover> <click:run_command:'%root% debug on'><green>[ ✦ Run ]</green></click>"
  help_debug_entry_off: "- <hover:show_text:'<gray>off</gray> <dark_gray>·</dark_gray> <gray>Turn off all debug output</gray>'><gray>off</gray></hover> <click:run_command:'%root% debug off'><green>[ ✦ Run ]</green></click>"
  help_debug_entry_player: "- <hover:show_text:'<gray>player</gray> <dark_gray>·</dark_gray> <gray>Track or untrack debug output of one player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Run again for the same player to untrack</gray>'><gray>player</gray></hover> <click:run_command:'%root% help debug player'><hover:show_text:'<gray>Argument: player</gray><newline><gray>an online player name; click to see available players</gray>'><gray>[ ✦ Player ]</gray></hover></click>"
  help_debug_entry_module: "- <hover:show_text:'<gray>module</gray> <dark_gray>·</dark_gray> <gray>Toggle debug output of one module</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Run again for the same module to turn it off</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [module] required, click to see available values</gray>'><gray>module</gray></hover> <click:run_command:'%root% help debug module'><yellow>[ ✦ Show values ]</yellow></click>"
  help_debug_entry_action: "- <hover:show_text:'<gray>action</gray> <dark_gray>·</dark_gray> <gray>Action pipeline debugging: dry-run, static check, registry check</gray>'><gray>action</gray></hover> <click:run_command:'%root% help debug action'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>run</gray> <dark_gray>·</dark_gray> <gray>dry-run or execute one action pipeline</gray><newline><gray>check</gray> <dark_gray>·</dark_gray> <gray>statically check one action pipeline</gray><newline><gray>registry</gray> <dark_gray>·</dark_gray> <gray>check the stage registry</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_debug_action_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiStructure debug action Command Help</gradient> <gray><st>        </st></gray>"
  help_debug_action_entry_run: "- <hover:show_text:'<gray>run</gray> <dark_gray>·</dark_gray> <gray>Dry-run preview or real execution of one action pipeline</gray>'><gray>run</gray></hover> <click:run_command:'%root% help debug action run'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>shadow</gray> <dark_gray>·</dark_gray> <gray>dry-run preview, no real effects</gray><newline><gray>execute</gray> <dark_gray>·</dark_gray> <gray>really run the action pipeline</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_debug_action_entry_check: "- <hover:show_text:'<gray>check</gray> <dark_gray>·</dark_gray> <gray>Statically check one action pipeline: compile and print diagnostics only</gray>'><gray>check</gray></hover> <hover:show_text:'<gray>Argument: pipeline line</gray><newline><gray>one action pipeline text, must be typed by you</gray><newline><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ pipeline line ]</gray></hover>"
  help_debug_action_entry_registry: "- <hover:show_text:'<gray>registry</gray> <dark_gray>·</dark_gray> <gray>Check the action stage registry and print diagnostics</gray>'><gray>registry</gray></hover> <click:run_command:'%root% debug action registry'><green>[ ✦ Run ]</green></click>"
  help_debug_action_run_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiStructure debug action run Command Help</gradient> <gray><st>        </st></gray>"
  help_debug_action_run_entry_shadow: "- <hover:show_text:'<gray>shadow</gray> <dark_gray>·</dark_gray> <gray>Dry-run in shadow mode: prints stage traces, no real effects</gray>'><gray>shadow</gray></hover> <hover:show_text:'<gray>Argument: pipeline line</gray><newline><gray>one action pipeline text, must be typed by you</gray><newline><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ pipeline line ]</gray></hover>"
