  help_entry_structure: "- <hover:show_text:'<gray>structure</gray> <dark_gray>·</dark_gray> <gray>结构模板: 导出选区或放置模板</gray><newline><newline><dark_gray>▸</dark_gray> <gray>需要权限 </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>仅限玩家执行</gray>'><gray>structure</gray></hover> <click:run_command:'%root% help structure'><hover:show_text:'<gray>可选参数</gray><newline><gray>export</gray> <dark_gray>·</dark_gray> <gray>把当前选区导出为结构模板</gray><newline><gray>place</gray> <dark_gray>·</dark_gray> <gray>在你的位置放置结构模板</gray>'><gray>[ ✦ 参数 ]</gray></hover></click>"
  help_entry_reload: "- <hover:show_text:'<gray>reload</gray> <dark_gray>·</dark_gray> <gray>重载配置, 语言与模板缓存</gray><newline><newline><dark_gray>▸</dark_gray> <gray>需要权限 </gray><white>emakistructure.reload</white>'><gray>reload</gray></hover> <click:run_command:'%root% reload'><green>[ ✦ 点击执行 ]</green></click>"
  help_entry_multiblock: "- <hover:show_text:'<gray>multiblock</gray> <dark_gray>·</dark_gray> <gray>多方块结构: 导出布局, 放置定义, 列表与校验</gray><newline><newline><dark_gray>▸</dark_gray> <gray>export/place 需要权限 </gray><white>emakistructure.edit</white><newline><dark_gray>▸</dark_gray> <gray>list/validate 需要权限 </gray><white>emakistructure.admin</white>'><gray>multiblock</gray></hover> <click:run_command:'%root% help multiblock'><hover:show_text:'<gray>可选参数</gray><newline><gray>export</gray> <dark_gray>·</dark_gray> <gray>把当前选区导出为多方块定义</gray><newline><gray>place</gray> <dark_gray>·</dark_gray> <gray>在你的位置放置多方块定义</gray><newline><gray>list</gray> <dark_gray>·</dark_gray> <gray>列出已加载的多方块定义</gray><newline><gray>validate</gray> <dark_gray>·</dark_gray> <gray>校验多方块定义的可解析性</gray>'><gray>[ ✦ 参数 ]</gray></hover></click>"
