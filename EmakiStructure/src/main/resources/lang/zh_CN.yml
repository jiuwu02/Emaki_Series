    # 占位符：%file%、%value%
    positions_invalid: "<red>多方块定义 <white>%file%</white> 的 positions 含非法坐标 %value%。</red>"
    # 占位符：%file%
    blocks_empty: "<red>多方块定义 <white>%file%</white> 不含有效方块成员。</red>"
