  help_entry_help: "- <hover:show_text:'<gray>help</gray> <dark_gray>·</dark_gray> <gray>显示本帮助页</gray>'><gray>help</gray></hover> <click:run_command:'%root% help'><green>[ ✦ 点击执行 ]</green></click>"
  help_entry_get: "- <hover:show_text:'<gray>get</gray> <dark_gray>·</dark_gray> <gray>在你面前 3 格处预览生成结构模板</gray><newline><newline><dark_gray>▸</dark_gray> <gray>需要权限 </gray><white>emakistructure.use</white><newline><dark_gray>▸</dark_gray> <gray>仅限玩家执行</gray><newline><dark_gray>▸</dark_gray> <gray>参数 [模板] 必填, 点击查看当前可选值</gray><newline><dark_gray>▸</dark_gray> <gray>参数 [朝向] 可选, 默认 south, 支持 north/east/south/west 及对应 _mirror 镜像</gray>'><gray>get</gray></hover> <click:run_command:'%root% help get'><yellow>[ ✦ 查看可选值 ]</yellow></click>"
