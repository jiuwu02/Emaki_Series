    # 占位符：%file%、%detail%
    parse_failed: "<red>多方块定义 <white>%file%</white> 解析失败：%detail%</red>"
    # 占位符：%file%、%value%、%expected%
    version_unsupported: "<red>多方块定义 <white>%file%</white> 的 version=<white>%value%</white> 不受支持，期望 %expected%。</red>"
    # 占位符：%file%、%value%、%expected%
    version_outdated: "<red>多方块定义 <white>%file%</white> 的 version=<white>%value%</white> 过旧，当前支持 %expected%，请迁移后使用。</red>"
    # 占位符：%file%、%value%、%expected%
    id_mismatch: "<red>多方块定义 <white>%file%</white> 的 id=<white>%value%</white> 与文件名不一致，期望 %expected%。</red>"
