    entry_invalid: "<red>家具条目结构非法，已跳过。</red>"
    # 占位符：%id%
    id_prefix: "<red>家具 <white>%id%</white> 前缀不受支持，须为 itemsadder/oraxen/nexo/craftengine。</red>"
    # 占位符：%id%
    pos_invalid: "<red>家具 <white>%id%</white> 的 pos 超出模板尺寸。</red>"
    # 占位符：%id%、%value%
    yaw_invalid: "<red>家具 <white>%id%</white> 的 yaw 取值 %value% 非法，期望 0.0-360.0。</red>"
