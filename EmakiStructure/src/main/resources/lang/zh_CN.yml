    pos_invalid: "<red>多方块定义 <white>%file%</white> 条目 #%index% 的 pos=%value% 非法。</red>"
    # 占位符：%file%、%value%、%index%
    pos_duplicate: "<red>多方块定义 <white>%file%</white> 条目 #%index% 的坐标 %value% 重复。</red>"
    # 占位符：%file%、%value%、%index%
    member_exclusive: "<red>多方块定义 <white>%file%</white> 条目 #%index% 的 %value% 同时声明了 block 与 furniture，二者只能择一。</red>"
    # 占位符：%file%、%value%、%allowed%、%index%
