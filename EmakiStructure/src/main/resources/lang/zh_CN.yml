# EmakiStructure 简体中文语言资源
# 消息使用 MiniMessage; 保留消息分组旁标明的占位符
# version 由资源同步流程维护, 用于合并新增默认键

version: "1.0.13"

tags:
  cache: '[ 缓存 ]'
  export: '[ 导出 ]'
  furniture: '[ 家具 ]'
  replace: '[ 替换 ]'
  rollback: '[ 回滚 ]'

general:
  prefix: "<gray>[ <gradient:#F59E0B:#F97316>EmakiStructure</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此命令</red>"
  player_only: "<red>此命令只能由玩家执行</red>"
  invalid_args: "<red>参数错误</red>"
  unknown_command: "<red>未知命令, 请使用 /estructure help 查看帮助</red>"

console:
  plugin_starting: "<gray>正在启动...</gray>"
  plugin_started: "<green>启动完成</green>"
  plugin_stopped: "<yellow>已关闭</yellow>"
  bootstrap_start: "<gray>正在同步默认资源...</gray>"
  bootstrap_skip: "已按配置跳过默认数据释放"
  bootstrap_complete: "默认资源同步完成"
  bootstrap_copy_failed: "复制默认资源失败: %path%  (%error%)"
  bootstrap_save_failed: "保存版本化资源失败: %path%  (%error%)"
  default_file_missing: "<yellow>默认资源缺失, 已重新释放: <white>%path%</white></yellow>"
  directory_create_failed: "<red>创建目录失败: <white>%path%</white> (%error%)</red>"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  loader_config_load_error: "<yellow>读取 Structure 配置失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  # 占位符: %count%
  templates_loaded: "<gray>已加载 <yellow>%count%</yellow> 个结构模板</gray>"
  # 占位符: %path%, %value%, %expected%
  config_issue: "<yellow>配置项 <white>%path%</white> 取值 <white>%value%</white> 非法 (期望 <white>%expected%</white>), 已按合法值处理</yellow>"
  # 占位符: %template%
  cache_rejected: "<yellow>模板 <white>%template%</white> 估算体积超出缓存上限, 本次用完即弃</yellow>"
  # 占位符: %count%
  reload_complete: "<green>重载完成, 共 <white>%count%</white> 个结构模板</green>"
  # 占位符: %template%, %index%, %type%, %error%
  spawn_entry_failed: "<yellow>模板 %template% 条目 #%index% 生物 %type% 生成失败: %error%</yellow>"
  # 占位符: %file%, %index%, %reason%
  spawn_entry_issue: "<yellow>生物点位 %file% 条目 #%index% 被跳过: %reason%</yellow>"
  # 占位符: %file%, %error%
  config_reload_failed: "<red>配置文件 %file% 解析失败, 保留旧配置继续运行: %error%</red>"
  # 占位符: %template%, %count%
  template_legacy_skipped: "<yellow>模板 <white>%template%</white> 有 %count% 个方块状态无法在当前版本解析, 已按 legacy_policy 跳过</yellow>"
  # 占位符: %source%
  furniture_source_ready: "<gray>已接入家具源: <aqua>%source%</aqua></gray>"
  # 占位符: %namespace%
  custom_block_source_ready: "<gray>已接入自定义方块命名空间: <aqua>%namespace%</aqua></gray>"
  # 占位符: %template%, %structure%
  replace_template_missing: "<yellow>替换规则引用的模板 <white>%template%</white> 不存在 (结构 %structure%), 已放行原版生成</yellow>"
  # 占位符: %count%
  rollback_recovering: "<yellow>检测到 %count% 个未完成事务, 启动期回滚进行中, 生成能力暂不可用</yellow>"
  # 占位符: %count%
  rollback_recovered: "<green>启动期回滚完成, 共 %count% 个事务</green>"
  # 占位符: %file%
  rollback_partial: "<red>事务 %file% 回滚未完全成功, 已标记 rollback-partial (可用 /estructure debug 查看), 不再自动重试</red>"
  # 占位符: %template%, %index%, %id%
  furniture_source_absent: "<yellow>模板 %template% 家具条目 #%index% (%id%) 所需家具源未安装, 已跳过</yellow>"
  # 占位符: %template%, %index%, %id%
  furniture_place_failed: "<yellow>模板 %template% 家具条目 #%index% (%id%) 放置失败, 已跳过该条</yellow>"
  # 占位符: %file%, %index%, %reason%
  furniture_entry_issue: "<yellow>家具点位 %file% 条目 #%index% 被跳过: %reason%</yellow>"
  # 占位符: 无
  export_furniture_absent: "<gray>家具 0 条 (无家具插件在场), 已有家具附属配置保持不变</gray>"
  # 占位符: 无

