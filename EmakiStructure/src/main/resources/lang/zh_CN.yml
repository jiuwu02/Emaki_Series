    # 占位符：%type%、%value%
    chance_range: "<red>生物 <white>%type%</white> 的 chance 取值 %value% 非法，期望 0.0-1.0。</red>"
    # 占位符：%type%、%value%、%allowed%
    facing_invalid: "<red>生物 <white>%type%</white> 的 facing 取值 %value% 非法，可用：%allowed%</red>"
    # 占位符：%type%
    pos_invalid: "<red>生物 <white>%type%</white> 的 pos 坐标非法。</red>"
    # 占位符：%type%、%size%
    pos_out_of_bounds: "<red>生物 <white>%type%</white> 的 pos 超出模板尺寸 %size%。</red>"
    # 占位符：%type%、%value%、%expected%
    radius_range: "<red>生物 <white>%type%</white> 的 radius 取值 %value% 非法，期望 %expected%。</red>"
    # 占位符：%type%、%radius%
    radius_out_of_bounds: "<red>生物 <white>%type%</white> 的半径 %radius% 球体超出模板边界。</red>"
