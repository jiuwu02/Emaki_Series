# EmakiStructure 主配置
#
# 控制结构模板导入上限、生成限额、框选会话与结构内生物生成。
# 修改后使用 /ems reload 热重载。
# 文件位置：plugins/EmakiStructure/config.yml

version: "1.0.7"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# ============================================================
# 结构生成
# ============================================================
generate:
  # 单轴尺寸上限 [X, Y, Z]，每项取值 8–512。
  # 选区体积与导入模板共用该上限，超限的选区与模板一律拒绝。
  size_limit: [128, 128, 128]

  # 每 tick 全局写入方块数上限，取值 1–200000。
  # 所有生成任务共享该额度，超额部分排队到下一 tick。
  max_blocks_per_tick: 3000

  # 模板内实体生成策略。
  # all: 全部生成；passive: 过滤敌对与 Boss 类实体；none: 不生成任何实体。
  entity_policy: "all"

  # 落位地形兜底。
  # skip: 结构底面任一列下方无实心支撑即放弃本次生成，绝不空投；
  # keep: 不检查支撑，按当前地形原样落位；
  # fill: 支撑不足的列向下以石头延伸至多 16 格，仍无支撑即放弃本次生成。
  ground_mode: "skip"

  # TPS 低于阈值时线性下调每 tick 写入限额至四分之一，触发时只告警一次。
  adaptive_throttling: true

  # 生成任务在队列中的最长滞留时长，超时中止该次生成。
  # 支持纯数字（秒）或 30s / 5m / 1h / 1d 后缀写法。
  queue_timeout: "60s"

# ============================================================
# 模板缓存
# ============================================================
cache:
  # 缓存条目数上限，最小 1；元数据常驻，方块数据按需加载。
  max_entries: 128

  # 缓存估算字节上限，最小 1；单条目超出该值时不缓存并告警。
  max_bytes: 268435456

# ============================================================
# 框选会话
# ============================================================
selection:
  # 选区会话空闲超时时长，取值 1m–24h；超时后销毁高亮并释放会话。
  session_timeout: "30m"

# ============================================================
# 模板导入
# ============================================================
template:
  # 单个 .nbt 原始文件字节上限，超出拒绝导入。
  import_max_file_bytes: 33554432

  # 跨版本模板中无法解析的方块状态处理方式。
  # reject: 拒绝整个文件；skip: 跳过该条目并告警，生成时该坐标置空气。
  legacy_policy: "reject"

  # 模板调色板条目数上限，超出拒绝导入。
  palette_limit: 4096

  # 单个方块实体 NBT 载荷字节上限，超出拒绝导入。
  block_entity_max_bytes: 65536

# ============================================================
# 结构内生物生成
# ============================================================
spawn:
  # 总开关；关闭后 spawns/ 附属配置配置整体忽略，不加载也不告警。
  enabled: true

  # 单次生成的生物总数上限，取值 1–256；超出即拒绝该附属配置文件。
  max_per_generation: 32

  # 每 tick 生物生成批次上限，取值 1–64。
  batch_per_tick: 8

  # 无法静态判定敌对属性的第三方生物是否按保守策略跳过。
  # false: 放行以保功能完整；true: 缺信息即跳过。
  respect_entity_policy: false

# ============================================================
# 多方块结构增量检测
# ============================================================
detection:
  # 低频兜底巡检间隔；0 表示关闭，启用时不得小于 30s。
  # 巡检只扫描"进行中实例"集合，不做全图遍历。
  sweep_interval: "0"

  # 单次冷命中反推的锚点候选组上限，取值 8–4096。
  # 重启或 reload 后点击既有结构时按此上限截断，超出部分丢弃并记 debug。
  max_cold_checks: 256

  # 每定义每玩家"进行中实例"数量上限，最小 1；超限淘汰最旧的。
  instance_limit: 8

  # "进行中实例"无变化存活时长，最小 1m；超时由巡检清理。
  instance_ttl: "10m"

  # 同一区块坐标变更的合并去抖窗口，最小 0。
  # 支持 500ms 这类毫秒写法（ms 后缀），也支持 30s / 5m。
  debounce: "500ms"

  # 结构被破坏降级后，重新凑齐时是否自动再次触发。
  # false: 仅恢复为活动实例不触发，防止刷动作。
  retrigger_on_reform: false

  # 巡检是否对活动实例做低频抽样复验；默认关闭。
  sample_recheck: false

# ============================================================
# 多方块触发冷却
# ============================================================
cooldown:
  # 全局冷却（同结构跨玩家共享），0 表示无冷却。
  # 支持纯数字（秒）或 30s / 5m 后缀写法。
  global: "0"

  # 单玩家冷却（按结构与玩家分别计时），0 表示无冷却。
  per_player: "0"

# ============================================================
# 原版结构拦截替换（仅作用于尚未生成的区块）
# ============================================================
# 按声明顺序评估，第一条命中即生效并短路；未命中原版结构照常生成。
# 已生成区块与其中既有结构永不改写。
replace_rules:
  # - structure: "minecraft:village_plains"   # 仅匹配 minecraft: 命名空间
  #   template: "village_hub_a"               # 替换用模板名（structures/ 下同名 .nbt）
  #   chance: 0.5                             # 概率 [0.0, 1.0]
  #   worlds: ["world"]                       # 世界白名单，缺省/空 = 全部世界
  #   biomes: ["plains"]                      # 群系白名单，缺省/空 = 不限群系
  #   enabled: true                           # false = 该条不参与匹配
  #   apply_to_existing: false                # 恒为 false，出现 true 即拒载该条并告警

# ============================================================
# 生成事务回滚
# ============================================================
rollback:
  # 总开关；关闭后退回旧语义（生成中断时已放置部分保留），仅调试用。
  enabled: true

  # 单个事务的 delta 快照字节上限，最小 1048576。
  # 快照写入超限即中止本次生成并回滚，绝不留下半生成状态。
  journal_max_bytes: 67108864

# ============================================================
# 家具（Furniture）附属配置
# ============================================================
furniture:
  # 总开关；关闭后 furniture/ 附属配置整体忽略（不加载、不校验、不还原，无告警）。
  enabled: true
