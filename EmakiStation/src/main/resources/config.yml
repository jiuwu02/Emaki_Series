# EmakiStation 主配置
# 控制工作站队列、容量限制、EmakiStorage 通道、持久化与界面刷新。

version: "1.1.3"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放 stations/、gui/、recipes/ 等内置默认示例数据。
# 关闭后只加载已有数据，不主动生成缺失的默认示例。
release_default_data: true

# ============================================================
# 队列默认值；工作站自己的 stations/<id>.yml 可覆盖同名设置。
# ============================================================
queue:
  # 基础队列长度；pending_claim 条目不占用此长度。
  base_length: 3

  # 是否启用 emakistation.queue.<n> 权限分级；取玩家拥有的最高档位。
  permission_tiers: true

  # 队列长度硬上限，权限档与购买额度都不能超过此值。
  max_length: 32

  # 队列计时方式：offline 按时间推进，online 仅在线时推进。
  # offline 表示计时继续，不代表离线玩家立即完成发货。
  progress_mode: "offline"

  # 取消条目时退还已扣材料的比例，通常填写 0.0–1.0。
  cancel_refund_rate: 1.0

  # 队列推进间隔，单位：tick。
  tick_interval: 20

  # 全局配方耗时倍率；小于等于 0 时按 1.0 处理。
  speed_multiplier: 1.0

  # 付费队列位会叠加在基础长度或权限档之上，但最终受 max_length 限制。
  # 权限档替代基础长度；已购额度在此基础上叠加。
  purchase:
    # 全局购买开关；工作站自身还需允许购买才会出售队列位。
    enabled: true

    # 价格档位文件名，相对插件数据目录。
    # 文件缺失或没有有效价格时，购买会被拒绝。

    cost_file: "queue_costs.yml"

# ============================================================
# 容量与输入保护
# ============================================================
limits:
  # 单个玩家可累积的未领取产物数量；达到上限后拒绝新提交。
  max_pending_claim: 100

  # 配方材料种类超过此值时仅记录警告，不阻止加载。
  warn_material_types: 50

  # 单次提交的最大倍率；0 表示不额外限制。
  batch_multiplier_max: 0

# ============================================================
# 仓库通道（EmakiStorage）
# ============================================================
storage:
  # 是否允许工作站调用 EmakiStorage。
  # 实际启用仍取决于 EmakiStorage 是否提供所需能力。
  enabled: true

  # 单批最多操作数；对应 EmakiStorage 的 behavior.batch_max_ops。
  batch_max_ops: 200

# ============================================================
# 持久化
# ============================================================
persistence:
  # 自动保存间隔，单位：秒。
  autosave_interval_seconds: 60

  # 提交成功后是否立即保存队列文件。
  save_on_submit: true

# ============================================================
# 界面
# ============================================================
gui:
  # 同一会话内两次点击的最小间隔，单位：毫秒。
  click_throttle_ms: 200

  # 已打开界面刷新进度显示的间隔，单位：tick。
  refresh_interval_ticks: 20
