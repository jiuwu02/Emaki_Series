# EmakiStation - 通用合成工作站
#
# 本文件的 version 必须与插件版本保持一致，插件会按 version 合并新增的默认键。
version: "1.0.1"

# 语言文件名，对应 lang/<language>.yml
language: "zh_CN"

# 首次启动时是否释放示例数据（stations/、gui/、recipes/ 下的示例文件）。
# 改为 false 后，已存在的文件不会被覆盖，也不会再补齐缺失的示例。
release_default_data: true

# ---------------------------------------------------------------------------
# 队列默认值。每个工作站可以在自己的 stations/<id>.yml 里覆盖同名键。
# ---------------------------------------------------------------------------
queue:
  # 基础队列长度。只有 waiting/running 状态占用长度，pending_claim 不占用
  # （否则背包和仓库同时满的玩家会被自己未领取的产物锁死队列）。
  base_length: 3

  # 是否启用权限分级。启用后 emakistation.queue.<n> 中数字最大的一档生效，
  # 没有任何该前缀权限时保持 base_length 不变。
  permission_tiers: true

  # 权限分级后的硬上限，任何权限都不能突破。
  max_length: 32

  # 队首推进方式：
  #   offline - 按真实时间推进，玩家离线期间继续走时
  #   online  - 仅在玩家在线时累计
  #
  # 注意：offline 只表示"计时继续"，不表示"离线发货"。EmakiStorage 拒绝对离线玩家
  # 做任何写操作，所以离线期间到点的条目只是"已到期"，真正结算发生在玩家下次上线时。
  progress_mode: "offline"

  # 取消队列条目时退还材料的比例（0.0 ~ 1.0）。
  #
  # 不按进度折算。串行单线队列里只有队首有进度，为一个几乎不存在的情况引入
  # 逐条目进度记账不值得，这是有意的简化。
  cancel_refund_rate: 1.0

  # 队列推进任务的间隔（tick）。全服只有这一个定时器，不是每个队列一个。
  tick_interval: 20

  # 全局配方耗时倍率。小于等于 0 时按 1.0 处理。
  speed_multiplier: 1.0

  # 付费队列位。玩家在队列页花钱买到的长度会【叠加】在 base_length 或权限档之上，
  # 但最终仍被上面的 max_length 截断。
  #
  # 和权限档的区别：权限档是"取代"基础长度，已购是"叠加"。这样管理员事后给某个
  # 玩家发权限档，不会把他花钱买的额度吞掉。
  purchase:
    # 全服总开关。关闭后所有工作站都不出售队列位。
    # 单个工作站还需要自己的 queue.allow_purchase 为 true 才会出售。
    enabled: true

    # 价格档位文件名，相对插件数据目录。
    # 文件缺失、为空或没有任何可用价格时，购买一律被拒绝而不是免费放行。
    cost_file: "queue_costs.yml"

# ---------------------------------------------------------------------------
# 容量上限
# ---------------------------------------------------------------------------
limits:
  # 单个玩家最多累积多少条未领取产物。达到上限后拒绝新提交，
  # 避免玩家把队列当无限仓库用。
  max_pending_claim: 100

  # 单个配方材料种类数超过这个值时只记录警告，不阻止加载。
  # 配方材料种类不受 GUI 槽位数限制，这里只是防手滑。
  warn_material_types: 50

  # 单次提交的最大倍率，0 表示不额外限制（仍受材料数量限制）。
  batch_multiplier_max: 0

# ---------------------------------------------------------------------------
# 仓库通道（EmakiStorage）
# ---------------------------------------------------------------------------
storage:
  # 总开关。关闭后 EmakiStation 完全不调用 EmakiStorage。
  #
  # 即使这里为 true，仓库通道仍需要 EmakiStorage 提供 emakistorage:atomic_batch
  # 能力才会启用。缺少该能力时不会退化为逐个 withdraw：那样会让材料在玩家背包里
  # 闪现一次，反而制造可利用的时间窗口。
  #
  # 另外，材料同时来自背包和仓库时，插件优先使用 emakistorage:reservation 能力：
  # 先在仓库挂预留（不真正取出），再扣背包，最后提交预留。中途失败只需释放预留，
  # 而释放不会因为仓库容量不足而失败。EmakiStorage 版本较低、没有这个能力时，
  # 会退化为"先扣仓库、失败再存回"，存回本身可能因容量不足被拒，因此不如预留路径。
  enabled: true

  # 单批最多多少个操作，与 EmakiStorage 的 behavior.batch_max_ops 对应。
  batch_max_ops: 200

# ---------------------------------------------------------------------------
# 持久化
# ---------------------------------------------------------------------------
persistence:
  # 自动保存间隔（秒）。队列文件里的条目对应"已经扣掉的材料"，
  # 所以这个间隔比仓库的自动保存更短。
  autosave_interval: 60

  # 提交成功后是否立刻落盘，而不是等到下一次自动保存。
  #
  # 队列文件和仓库文件是两份独立文件，硬崩溃仍可能让两者不一致
  # （材料已扣但条目未存，或条目已存但扣料未落盘）。每个条目都完整记录了
  # 消耗清单，便于人工对账。彻底消除这个窗口需要跨插件两阶段提交，代价过高。
  save_on_submit: true

# ---------------------------------------------------------------------------
# 界面
# ---------------------------------------------------------------------------
gui:
  # 同一会话内两次点击的最小间隔（毫秒）。
  click_throttle_ms: 200

  # 打开的界面多久重绘一次进度显示（tick）。
  refresh_interval: 20
