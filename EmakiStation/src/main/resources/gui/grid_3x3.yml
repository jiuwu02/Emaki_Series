# EmakiStation 界面布局示例：3x3 输入区
#
# 重要：EmakiStation 的槽位必须显式写 type。CoreLib 的模板解析器只会为少数
# Forge 专用键名自动推断类型，自定义键名不写 type 就只是纯装饰格。
#
# 可用的 type：
#   input             - 玩家放材料的格子（至少要有一个，否则布局校验不通过）
#   recipe_preview    - 显示当前匹配到的配方，点击可在多个匹配间切换
#   material_list     - 列出当前配方的材料需求，可分页
#   channel_toggle    - 切换背包 / 仓库通道
#   batch_multiplier  - 循环切换倍率（左键递增、右键递减、Shift 直接拉满）
#   max_craftable     - 显示最多能做几次，点击直接拉满
#   output_toggle     - 切换产物去向
#   queue_view        - 列出队列条目，点击取消
#   confirm           - 提交
#   prev_page/next_page - 材料列表翻页
#
# 布局形状不限于 3x3。input 可以是 6x9 范围内任意畸形槽位集合，
# 也不决定配方形状语义 —— 匹配始终是无序集合匹配。
id: "grid_3x3"
gui_type: CHEST
title: "<dark_gray>%station_name%</dark_gray>"
rows: 6

slots:
  frame:
    slots: "0-8,45-53"
    item:
      source: "BLACK_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  input:
    slots: "10-12,19-21,28-30"
    type: "input"
    item:
      source: "LIGHT_GRAY_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>放入材料</gray>"
        lore:
          - "<dark_gray>这里不是仓库，关闭界面会把物品还给你</dark_gray>"
        tooltip_display:
          hide_tooltip: false

  recipe_preview:
    slots: [24]
    type: "recipe_preview"
    item:
      source: "CRAFTING_TABLE"
      components:
        custom_name: "<aqua>%recipe_name%</aqua>"
        lore:
          - "<gray>产物: <white>%result_name%</white> x<yellow>%result_amount%</yellow></gray>"
          - "<gray>耗时: <yellow>%duration%</yellow></gray>"
          - "<gray>其他匹配: <yellow>%alternatives%</yellow> 个</gray>"
          - "<dark_gray>点击切换匹配到的其他配方</dark_gray>"
    sounds:
      click:
        sound: "ui.button.click"
        volume: 1.0
        pitch: 1.0

  material_list:
    slots: "37-43"
    type: "material_list"
    item:
      source: "PAPER"
      components:
        custom_name: "<gray>材料</gray>"

  channel_toggle:
    slots: [14]
    type: "channel_toggle"
    item:
      source: "CHEST"
      components:
        custom_name: "<gold>材料来源</gold>"
        lore:
          - "<gray>当前: %channel_state%</gray>"
          - "<dark_gray>点击切换背包 / 仓库</dark_gray>"
    sounds:
      click:
        sound: "ui.button.click"
        volume: 1.0
        pitch: 1.2

  batch_multiplier:
    slots: [15]
    type: "batch_multiplier"
    item:
      source: "COMPARATOR"
      components:
        custom_name: "<gold>倍率 <yellow>x%batch%</yellow></gold>"
        lore:
          - "<gray>左键 <white>递增</white> <dark_gray>|</dark_gray> 右键 <white>递减</white></gray>"
          - "<gray>Shift <white>直接拉满</white></gray>"
    sounds:
      click:
        sound: "ui.button.click"
        volume: 1.0
        pitch: 1.0

  max_craftable:
    slots: [16]
    type: "max_craftable"
    item:
      source: "KNOWLEDGE_BOOK"
      components:
        custom_name: "<gold>最多可做</gold>"
        lore:
          - "<gray><yellow>%max_exact%</yellow> 次</gray>"
          - "<dark_gray>点击直接拉满</dark_gray>"

  output_toggle:
    slots: [23]
    type: "output_toggle"
    item:
      source: "HOPPER"
      components:
        custom_name: "<gold>产物去向</gold>"
        lore:
          - "<gray>当前: %output_state%</gray>"

  queue_view:
    slots: [32, 33, 34]
    type: "queue_view"
    item:
      source: "CLOCK"
      components:
        custom_name: "<aqua>#%index% %recipe%</aqua>"
        lore:
          - "<gray>倍率: x<yellow>%batch%</yellow></gray>"
          - "<gray>剩余: <yellow>%remaining%</yellow></gray>"
          - "<dark_gray>点击取消并退还材料</dark_gray>"

  confirm:
    slots: [25]
    type: "confirm"
    item:
      source: "ANVIL"
      components:
        custom_name: "<green>开始合成</green>"
        lore:
          - "<gray>倍率: x<yellow>%batch%</yellow></gray>"
    sounds:
      click:
        sound: "block.anvil_use"
        volume: 0.6
        pitch: 1.4

  prev_page:
    slots: [36]
    type: "prev_page"
    item:
      source: "ARROW"
      components:
        custom_name: "<yellow>上一页</yellow>"

  next_page:
    slots: [44]
    type: "next_page"
    item:
      source: "ARROW"
      components:
        custom_name: "<yellow>下一页</yellow>"

# 以下两块由 EmakiStation 自己读取，CoreLib 的模板解析器不会处理它们。
virtual_items:
  no_recipe:
    item:
      source: "GRAY_DYE"
      components:
        custom_name: "<gray>没有匹配的配方</gray>"
        lore:
          - "<dark_gray>放入材料后会自动匹配</dark_gray>"

  confirm_blocked:
    item:
      source: "BARRIER"
      components:
        custom_name: "<red>无法合成</red>"
        lore:
          - "<gray>%block_reason%</gray>"

  material_satisfied:
    item:
      components:
        custom_name: "<green>%material%</green>"
        lore:
          - "<gray>需要 <yellow>%required_exact%</yellow></gray>"
          - "<green>拥有 %owned_exact%</green>"

  material_missing:
    item:
      components:
        custom_name: "<red>%material%</red>"
        lore:
          - "<gray>需要 <yellow>%required_exact%</yellow></gray>"
          - "<red>拥有 %owned_exact%</red>"

  queue_entry:
    item:
      components:
        custom_name: "<aqua>#%index% %recipe%</aqua>"

  queue_pending:
    item:
      source: "CHEST_MINECART"
      components:
        custom_name: "<gold>#%index% 待领取</gold>"
        lore:
          - "<gray>产物没能送出，使用 <white>/emakistation claim</white> 领取</gray>"

texts:
  channel_state:
    backpack: "<white>背包</white>"
    storage: "<aqua>仓库</aqua>"
    storage_unavailable: "<white>背包</white> <dark_gray>(仓库不可用)</dark_gray>"
  output_state:
    storage_first: "<aqua>仓库优先</aqua>"
    backpack_first: "<white>背包优先</white>"
    storage_only: "<aqua>仅仓库</aqua>"
    backpack_only: "<white>仅背包</white>"
