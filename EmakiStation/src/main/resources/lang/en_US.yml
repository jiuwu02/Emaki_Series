# EmakiStation English language resource
# Messages use MiniMessage; preserve placeholders documented beside message groups
# version is maintained by resource synchronization when default keys are merged

version: "1.1.9"

console:
  plugin_starting: "[startup] Starting EmakiStation..."
  plugin_started: "[startup] started"
  plugin_stopped: "[shutdown] stopped"
  bootstrap_start: "[loader] <gray>Checking configuration files...</gray>"
  bootstrap_complete: "[loader] <green>Default file check complete</green>"
  bootstrap_skip: "[loader] <yellow>Skipped default data generation</yellow>"
  versioned_file_updated: "[loader] <green>Updated bundled file version: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "[loader] <yellow>Failed to copy default resource: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  bootstrap_save_failed: "[loader] <yellow>Failed to save merged resource: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  default_file_missing: "[loader] <yellow>Missing built-in default resource: <red>%path%</red></yellow>"
  directory_create_failed: "[loader] <yellow>Failed to create directory: <red>%path%</red></yellow>"
  loader_config_load_error: "[config] <yellow>Failed to read config.yml, falling back to defaults</yellow>"
  config_precheck_passed: "[config] <gray>Config precheck passed: <yellow>%issues%</yellow> issue (s)</gray>"
  config_precheck_failed: "[config] <red>Config precheck failed: <yellow>%issues%</yellow> issue (s)</red>"
  config_precheck_issue: "[config] <gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "[config] <yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "[config] <red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray> (%hint%)</dark_gray>"
    messages:
      passed: "EmakiStation configuration precheck passed"
      required_file_missing: "The required file is missing"
      path_not_file: "The specified path is not a file"
      file_not_readable: "The file is not readable"
      required_directory_missing: "The required directory is missing"
      path_not_directory: "The specified path is not a directory"
      directory_not_readable: "The directory is not readable"
      storage_unreachable_material: "Material #%index% of recipe %recipe% declares only a matcher without item_sources, so it can be supplied from the backpack only and is excluded from warehouse lookup"
  editor_open_failed: "[editor] <red>Could not open EmakiStation editor for %item%  (%error%)</red>"
  editor_template_missing: "[editor] <red>Missing EmakiStation editor template: %template%</red>"
  editor_browser_create_failed: "[editor] <red>Could not create definition: %path%  (%error%)</red>"
  editor_browser_delete_failed: "[editor] <red>Could not delete definition: %path%  (%error%)</red>"
  editor_browser_list_failed: "[editor] <red>Could not list definition directory: %path%  (%error%)</red>"

general:
  prefix: "<gray>[ <gradient:#A3E635:#22D3EE>EmakiStation</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to do that</red>"
  players_only: "<red>That command can only be run by a player</red>"
  unknown_command: "<red>Unknown subcommand, use /emakistation help</red>"

command:
  help: |-
    <gray>=== <aqua>EmakiStation</aqua> ===</gray>
    <gray>/emakistation open <station></gray> <dark_gray>-</dark_gray> <white>Open a station</white>
    <gray>/emakistation dismantle <station></gray> <dark_gray>-</dark_gray> <white>Open the dismantle interface</white>
    <gray>/emakistation queue</gray> <dark_gray>-</dark_gray> <white>View your queues</white>
    <gray>/emakistation claim</gray> <dark_gray>-</dark_gray> <white>Claim finished outputs</white>
    <gray>/emakistation cancel <station> <index></gray> <dark_gray>-</dark_gray> <white>Cancel a queued craft</white>
    <gray>/emakistation list [station]</gray> <dark_gray>-</dark_gray> <white>List stations or recipes</white>
    <gray>/emakistation edit [ID]</gray> <dark_gray>-</dark_gray> <white>Open the in-game definition editor</white>
    <gray>/emakistation reload</gray> <dark_gray>-</dark_gray> <white>Reload configuration</white>
  open_usage: "<red>Usage: /emakistation open <station></red>"
  open_failed: "<red>Could not open the station: <gray>%reason%</gray></red>"
  dismantle_usage: "<red>Usage: /emakistation dismantle <station></red>"
  dismantle_failed: "<red>Could not open the dismantle interface: <gray>%reason%</gray></red>"
  cancel_usage: "<red>Usage: /emakistation cancel <station> <index></red>"
  cancel_done: "<green>Cancelled queue entry <yellow>%index%</yellow></green>"
  cancel_failed: "<red>Cancellation failed: <gray>%reason%</gray></red>"
  claim_done: "<green>Claimed <yellow>%count%</yellow> finished crafts</green>"
  claim_failed: "<red>Claim failed: <gray>%reason%</gray></red>"
  queue_empty: "<gray>You have no queued crafts</gray>"
  queue_header: "<gray>[<aqua>%station%</aqua>] queue <yellow>%used%</yellow><gray>/</gray><yellow>%max%</yellow></gray>"
  queue_entry: "<gray> <white>%index%.</white> <aqua>%recipe%</aqua> x<yellow>%batch%</yellow> <dark_gray>|</dark_gray> %state% <dark_gray>|</dark_gray> <yellow>%remaining%</yellow> left</gray>"
  list_station: "<gray>- <aqua>%station%</aqua> <white>%name%</white> <dark_gray> (<yellow>%recipes%</yellow> recipes)</dark_gray></gray>"
  list_recipe: "<gray>- <aqua>%recipe%</aqua> <white>%name%</white> <dark_gray> (<yellow>%duration%</yellow>s)</dark_gray></gray>"
  reload_done: "<green>Reloaded: <yellow>%stations%</yellow> stations, <yellow>%recipes%</yellow> recipes, <yellow>%issues%</yellow> issues</green>"
  # Command: reload elapsed time notice; placeholders: %elapsed%
  reload_elapsed: "<gray>Reload took <white>%elapsed%ms</white></gray>"
  admin_usage: "<red>Usage: /emakistation admin queue <player></red>"
  unknown_station: "<red>Unknown station: <gray>%station%</gray></red>"
  unknown_player: "<red>Unknown player: <gray>%player%</gray></red>"
  debug_unavailable: "<red>Debug output is unavailable right now</red>"

