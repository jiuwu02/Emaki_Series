  dismantle_recipe_cost_missing_currency: "[loader] <yellow>Dismantle recipe %recipe% has a cost section without a currency subsection, treating it as free; the correct form is cost.currency.type / amount  (%file%)</yellow>"
  dismantle_recipe_bad_cost_amount: "[loader] <yellow>Dismantle recipe %recipe% has an invalid cost amount %amount%, treating it as free</yellow>"
  dismantle_recipe_bad_currency: "[loader] <yellow>Dismantle recipe %recipe% has an unknown currency type %type%, treating it as free  (supported: vault / excellent)</yellow>"

