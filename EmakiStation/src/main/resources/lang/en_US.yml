  help_entry_queue: "- <hover:show_text:'<gray>queue</gray> <dark_gray>·</dark_gray> <gray>View all your station queues</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistation.use</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>queue</gray></hover> <click:run_command:'%root% queue'><green>[ ✦ Run ]</green></click>"
