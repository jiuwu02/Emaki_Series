# EmakiStation English language resource.
# Messages use MiniMessage; preserve placeholders documented beside message groups.
# version is maintained by resource synchronization when default keys are merged.

version: "1.1.3"

console:
  plugin_starting: "Starting EmakiStation..."
  plugin_started: "EmakiStation started"
  plugin_stopped: "EmakiStation stopped"
  bootstrap_start: "<gray>Checking configuration files...</gray>"
  bootstrap_complete: "<green>Default file check complete.</green>"
  bootstrap_skip: "<yellow>Skipped default data generation.</yellow>"
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "<yellow>Failed to copy default resource: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>Failed to save merged resource: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  default_file_missing: "<yellow>Missing built-in default resource: <red>%path%</red></yellow>"
  directory_create_failed: "<yellow>Failed to create directory: <red>%path%</red></yellow>"
  loader_config_load_error: "<yellow>Failed to read config.yml, falling back to defaults</yellow>"
  config_precheck_passed: "<gray>Config precheck passed: <yellow>%issues%</yellow> issue(s).</gray>"
  config_precheck_failed: "<red>Config precheck failed: <yellow>%issues%</yellow> issue(s).</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray>(%hint%)</dark_gray>"
    messages:
      passed: "EmakiStation configuration precheck passed."
      required_file_missing: "The required file is missing."
      path_not_file: "The specified path is not a file."
      file_not_readable: "The file is not readable."
      required_directory_missing: "The required directory is missing."
      path_not_directory: "The specified path is not a directory."
      directory_not_readable: "The directory is not readable."
      storage_unreachable_material: "Material #%index% of recipe %recipe% declares only a matcher without item_sources, so it can be supplied from the backpack only and is excluded from warehouse lookup."

general:
  prefix: "<gray>[ <gradient:#A3E635:#22D3EE>EmakiStation</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to do that</red>"
  players_only: "<red>That command can only be run by a player</red>"
  unknown_command: "<red>Unknown subcommand, use /emakistation help</red>"

command:
  help: |-
    <gray>=== <aqua>EmakiStation</aqua> ===</gray>
    <gray>/emakistation open <station></gray> <dark_gray>-</dark_gray> <white>Open a station</white>
    <gray>/emakistation dismantle <station></gray> <dark_gray>-</dark_gray> <white>Open the dismantle interface</white>
    <gray>/emakistation queue</gray> <dark_gray>-</dark_gray> <white>View your queues</white>
    <gray>/emakistation claim</gray> <dark_gray>-</dark_gray> <white>Claim finished outputs</white>
    <gray>/emakistation cancel <station> <index></gray> <dark_gray>-</dark_gray> <white>Cancel a queued craft</white>
    <gray>/emakistation list [station]</gray> <dark_gray>-</dark_gray> <white>List stations or recipes</white>
    <gray>/emakistation reload</gray> <dark_gray>-</dark_gray> <white>Reload configuration</white>
  open_usage: "<red>Usage: /emakistation open <station></red>"
  open_failed: "<red>Could not open the station: <gray>%reason%</gray></red>"
  dismantle_usage: "<red>Usage: /emakistation dismantle <station></red>"
  dismantle_failed: "<red>Could not open the dismantle interface: <gray>%reason%</gray></red>"
  cancel_usage: "<red>Usage: /emakistation cancel <station> <index></red>"
  cancel_done: "<green>Cancelled queue entry <yellow>%index%</yellow></green>"
  cancel_failed: "<red>Cancellation failed: <gray>%reason%</gray></red>"
  claim_done: "<green>Claimed <yellow>%count%</yellow> finished crafts</green>"
  claim_failed: "<red>Claim failed: <gray>%reason%</gray></red>"
  queue_empty: "<gray>You have no queued crafts</gray>"
  queue_header: "<gray>[<aqua>%station%</aqua>] queue <yellow>%used%</yellow><gray>/</gray><yellow>%max%</yellow></gray>"
  queue_entry: "<gray> <white>%index%.</white> <aqua>%recipe%</aqua> x<yellow>%batch%</yellow> <dark_gray>|</dark_gray> %state% <dark_gray>|</dark_gray> <yellow>%remaining%</yellow> left</gray>"
  list_station: "<gray>- <aqua>%station%</aqua> <white>%name%</white> <dark_gray>(<yellow>%recipes%</yellow> recipes)</dark_gray></gray>"
  list_recipe: "<gray>- <aqua>%recipe%</aqua> <white>%name%</white> <dark_gray>(<yellow>%duration%</yellow>s)</dark_gray></gray>"
  reload_done: "<green>Reloaded: <yellow>%stations%</yellow> stations, <yellow>%recipes%</yellow> recipes, <yellow>%issues%</yellow> issues</green>"
  admin_usage: "<red>Usage: /emakistation admin queue <player></red>"
  unknown_station: "<red>Unknown station: <gray>%station%</gray></red>"
  unknown_player: "<red>Unknown player: <gray>%player%</gray></red>"
  debug_unavailable: "<red>Debug output is unavailable right now</red>"

station:
  station_missing_id: "<yellow>Station file is missing its id: %file%</yellow>"
  station_no_channel: "<yellow>Station %station% has both material channels disabled, skipped (%file%)</yellow>"
  recipe_missing_id: "<yellow>Recipe file is missing its id: %file%</yellow>"
  recipe_no_materials: "<yellow>Recipe %recipe% has no usable materials, skipped (%file%)</yellow>"
  recipe_no_outputs: "<yellow>Recipe %recipe% has no outputs, skipped (%file%)</yellow>"
  recipe_bad_amount: "<yellow>Recipe %recipe% has an invalid amount %amount%, entry skipped</yellow>"
  recipe_bad_source: "<yellow>Recipe %recipe% has an unresolvable item source %source% (%file%)</yellow>"
  recipe_legacy_item_source: "<yellow>Recipe %recipe% uses legacy item_source; it remains readable but should migrate to item_sources (%file%)</yellow>"
  recipe_derived_material_identity: "<yellow>Material #%index% of recipe %recipe% lacks explicit material_id, requirement_id, or count_key; it remains readable via index fallback, but should declare stable identities (%file%)</yellow>"
  recipe_source_field_conflict: "<red>Recipe %recipe% declares both item_source and item_sources, so loading is blocked (%file%)</red>"
  recipe_duplicate_material_identity: "<red>Recipe %recipe% repeats or conflicts on material identity %identity%, so loading is blocked (%file%)</red>"
  recipe_many_materials: "<yellow>Recipe %recipe% has %count% material types, above the warning threshold %limit%</yellow>"
  dismantle_recipe_missing_id: "<yellow>Dismantle recipe file is missing its id: %file%</yellow>"
  dismantle_recipe_no_input: "<yellow>Dismantle recipe %recipe% has neither item_sources nor matcher, skipped (%file%)</yellow>"
  dismantle_recipe_bad_input: "<yellow>Dismantle recipe %recipe% has an unresolvable input item source %source% (%file%)</yellow>"
  dismantle_recipe_legacy_input_source: "<yellow>Dismantle recipe %recipe% uses legacy input_source; it remains readable but should migrate to item_sources (%file%)</yellow>"
  dismantle_recipe_bad_source: "<yellow>Dismantle recipe %recipe% has an unresolvable pool item source %source% (%file%)</yellow>"
  dismantle_recipe_empty_pool: "<yellow>Dismantle recipe %recipe% has no usable pool entries, skipped (%file%)</yellow>"

  unknown_station: "That station does not exist"
  unknown_recipe: "That recipe does not exist"
  missing_layout: "The station's GUI layout does not exist"
  bad_batch: "Invalid batch multiplier"
  recipe_not_at_station: "That recipe does not belong to this station"
  recipe_no_permission: "You do not have permission to use that recipe"
  recipe_condition_failed: "You do not meet that recipe's conditions"
  queue_not_loaded: "Queue data is still loading, try again shortly"
  queue_full: "The queue is full"
  pending_claim_full: "Too many unclaimed crafts, claim them first"
  storage_unavailable: "The warehouse channel is unavailable"
  storage_insufficient: "Not enough materials in the warehouse"
  storage_batch_too_large: "Too many material types for one operation"
  storage_bad_request: "Invalid warehouse request"
  insufficient_materials: "Not enough materials"
  no_recipe: "No matching recipe"
  submit_cancelled: "The submission was cancelled by another plugin"
  cancel_pending_claim: "Unclaimed crafts cannot be cancelled, claim them instead"
  cancel_vetoed: "The cancellation was blocked by another plugin"
  refund_partial: "Some materials could not be refunded"
  queue_entry_missing: "That queue entry does not exist"
  queue_load_failed: "Failed to read queue data"
  open_bad_request: "Invalid open request"
  open_failed: "The window could not be opened"
  open_mismatch: "Window validation failed"
  submit_bad_request: "Invalid submit request"
  cancel_bad_request: "Invalid cancel request"
  claim_bad_request: "Invalid claim request"
  claim_failed: "The claim failed"
  cancel_failed: "The cancellation failed"
  snapshot_bad_request: "Invalid query"
  api_backpack_unsupported: "The API does not support the backpack channel; materials must be placed by the player"
  no_recipe_selected: "No dismantle recipe selected"
  dismantle_no_matching_item: "The placed item does not match any dismantle recipe"

precheck:
  passed: "Configuration check passed"
  required_file_missing: "Required file is missing"
  required_directory_missing: "Required directory is missing"

debug:
  station:
    submit: "<gray>[DEBUG][Station] Player <player> submitted recipe <recipe> at station <station>, batch <batch>, queue index <queue_index></gray>"
