command:
  help: |-
    <gray>=== <aqua>EmakiStation</aqua> ===</gray>
    <gray>/emakistation open <工作站></gray> <dark_gray>-</dark_gray> <white>打开工作站界面</white>
    <gray>/emakistation dismantle <工作站></gray> <dark_gray>-</dark_gray> <white>打开分解界面</white>
    <gray>/emakistation queue</gray> <dark_gray>-</dark_gray> <white>查看自己的队列</white>
    <gray>/emakistation claim</gray> <dark_gray>-</dark_gray> <white>领取待领取的产物</white>
    <gray>/emakistation cancel <工作站> <序号></gray> <dark_gray>-</dark_gray> <white>取消队列条目</white>
    <gray>/emakistation list [工作站]</gray> <dark_gray>-</dark_gray> <white>列出工作站或其配方</white>
    <gray>/emakistation edit [ID]</gray> <dark_gray>-</dark_gray> <white>打开游戏内定义编辑器</white>
    <gray>/emakistation reload</gray> <dark_gray>-</dark_gray> <white>重载配置</white>
  open_usage: "<red>用法：/emakistation open <工作站></red>"
  open_failed: "<red>无法打开工作站：<gray>%reason%</gray></red>"
  dismantle_usage: "<red>用法：/emakistation dismantle <工作站></red>"
  dismantle_failed: "<red>无法打开分解界面：<gray>%reason%</gray></red>"
  cancel_usage: "<red>用法：/emakistation cancel <工作站> <序号></red>"
  cancel_done: "<green>已取消第 <yellow>%index%</yellow> 条队列</green>"
  cancel_failed: "<red>取消失败：<gray>%reason%</gray></red>"
  claim_done: "<green>已领取 <yellow>%count%</yellow> 条产物</green>"
  claim_failed: "<red>领取失败：<gray>%reason%</gray></red>"
  queue_empty: "<gray>当前没有任何队列条目</gray>"
  queue_header: "<gray>[<aqua>%station%</aqua>] 队列 <yellow>%used%</yellow><gray>/</gray><yellow>%max%</yellow></gray>"
  queue_entry: "<gray> <white>%index%.</white> <aqua>%recipe%</aqua> x<yellow>%batch%</yellow> <dark_gray>|</dark_gray> %state% <dark_gray>|</dark_gray> 剩余 <yellow>%remaining%</yellow></gray>"
  list_station: "<gray>- <aqua>%station%</aqua> <white>%name%</white> <dark_gray>(<yellow>%recipes%</yellow> 个配方)</dark_gray></gray>"
  list_recipe: "<gray>- <aqua>%recipe%</aqua> <white>%name%</white> <dark_gray>(<yellow>%duration%</yellow>s)</dark_gray></gray>"
