version: "1.0.0"

console:
  plugin_starting: "正在启动 EmakiStation..."
  plugin_started: "EmakiStation 启动完成"
  plugin_stopped: "EmakiStation 已停止"
  bootstrap_start: "正在检查配置文件..."
  loader_config_load_error: "读取 config.yml 失败，已回退到默认配置"

general:
