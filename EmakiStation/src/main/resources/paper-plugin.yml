name: EmakiStation
main: emaki.jiuwu.craft.station.EmakiStationPlugin
version: ${project.version}
api-version: "1.21.8"
folia-supported: true
dependencies:
  server:
    EmakiCoreLib:
      load: BEFORE
      required: true
      join-classpath: true
    EmakiStorage:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  emakistation.use:
    default: true
  # 购买额外队列位。还需要 config.yml 的 queue.purchase.enabled 与
  # 工作站的 queue.allow_purchase 同时为 true。
  #
  # 不放在 emakistation.queue.* 下面是有意的：那个前缀已经被队列长度分级
  # （emakistation.queue.16 这类）占用，混在一起会让两种含义难以分辨。
  emakistation.purchase:
    default: true
  # 使用分解界面（/emakistation dismantle <工作站>）。
  emakistation.dismantle:
    default: true
  emakistation.reload:
    default: op
  emakistation.debug:
    default: op
  emakistation.admin:
    default: op
