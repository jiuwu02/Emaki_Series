# ============================================================
# EmakiSkills 技能示例 - 投射物技能
# ============================================================
# projectile 支持追踪、穿透和粒子；gravity 0 为直线，pierce 0 为不穿透。
# 命中实体与位置不会写回目标流；发射后立即返回，延后效果需使用 after。
# ============================================================

id: "homing_fireball"

display_name: "<gradient:#FF6B35:#FF4500>追踪火球</gradient>"

description:
  - "<gray>发射一颗追踪火球</gray>"
  - "<gray>火球会自动追踪最近的敌人</gray>"
  - "<gray>命中后造成范围火焰伤害</gray>"

icon_material: "fire_charge"

trigger_type: "active"
enabled: true
show_in_slots: true
tags:
  - "attack"
  - "ultimate"
tab_tags:
  - "advanced"

# 冷却时间（tick，20 tick = 1 秒）
cooldown_ticks: 60

# ============================================================
# 技能脚本
# ============================================================
# projectile 不回传命中点，因此 looking_at 在施法时选定并 keep 爆炸中心。
script:
  actions:
    cast:
      - "self | projectile speed=1.2 gravity=0 lifetime=80 hit_radius=0.8 pierce=0 homing=true homing_strength=0.15 particle=flame damage=15 direction=look"
      - "looking_at range=20 | keep"

    hit:
      - "nearby radius=3 limit=20 | damage amount=8"
      - "inherited | spawn_particle particle=explosion count=3"
      - "inherited | play_sound sound=minecraft:entity.generic.explode volume=0.8 pitch=1.2"
