id: attack_passive
display_name: "<gradient:#FFD166:#EF476F>命中回响</gradient>"
description:
  - "<gray>被动技能示例：命中实体时自动触发</gray>"
  - "<gray>玩家不可在 GUI 中修改此技能的触发器</gray>"
icon_material: "ECHO_SHARD"
trigger_type: "passive"
passive_triggers:
  - "attack"
cooldown_ticks: 40
global_cooldown_ticks: 0
lore_aliases:
  - "命中回响"
ui_category: "passive"
sort_order: 100
enabled: true
resource_costs: []

skill_parameters:
  echo_damage:
    type: "expression"
    expression: "6 + ({level} - 1) * 2.5"
    decimals: 1
    min: 0

  echo_chance:
    type: "expression"
    expression: "15 + ({level} - 1) * 3"
    decimals: 0
    max: 40

  sound_pitch:
    type: "expression"
    expression: "1 + ({level} - 1) * 0.03"
    decimals: 2

  echo_tag:
    type: "string"
    value: "echo_{trigger_id}_{level}"

  can_chain:
    type: "boolean"
    expression: "{level} >= 4 && {trigger_id} == 'attack'"
    default: false

variables:
  echo_message: "<aqua>命中回响触发，追加 {echo_damage} 点伤害。</aqua>"

script:
  enabled: true
  mode: "native"
  stop_on_failure: true

  actions:
    cast:
      - "@chance={echo_chance}% particle particle=sonic_boom at=target count=1"
      - "@chance={echo_chance}% playsound
        sound=entity.allay.ambient_without_item at=caster volume=0.8
        pitch={sound_pitch}"

    hit:
      - "damage target=target amount={echo_damage} damage_type=spell
        element=echo"
      - "sendmessage target=caster text=\"{echo_message}\""

upgrade:
  enabled: true
  max_level: 8
  gui_template: "upgrade/default"

  economy:
    enabled: true
    currencies:
      - provider: "vault"
        currency_id: ""
        base_cost: 800
        cost_formula: "{base_cost} * {target_level}"
        display_name: "<gold>金币</gold>"

  success_rates:
    2: 100.0
    3: 95.0
    4: 90.0
    5: 80.0
    6: 70.0
    7: 60.0
    8: 50.0

  failure_penalty: "none"

  levels:
    2:
      materials:
        - item_sources:
            - "minecraft-amethyst_shard"
          amount: 3
      actions:
        success: []
        failure: []

    4:
      materials:
        - item_sources:
            - "minecraft-echo_shard"
          amount: 1
      parameters:
        echo_chance:
          type: "constant"
          value: 30
          decimals: 0
      actions:
        success:
          - "sendmessage text=\"<aqua>命中回响达到 IV，触发概率获得额外提升。</aqua>\""
        failure: []

    8:
      materials:
        - item_sources:
            - "minecraft-echo_shard"
          amount: 3
      success_rate: 50.0
      actions:
        success:
          - "broadcastmessage text=\"<aqua>{player}</aqua>
            <gray>将命中回响提升至满级。</gray>\""
        failure: []
