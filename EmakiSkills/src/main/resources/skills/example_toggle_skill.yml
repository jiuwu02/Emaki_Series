# ============================================================
# EmakiSkills 技能定义示例 - 战意激发
# ============================================================
# 演示功能: 主动自身增益技能 + 多段药水效果 + 本地资源 + 材料升级。
# 触发方式: 主动技能，绑定主动触发器槽位后在施法模式中释放。
# 依赖模块: EmakiSkills (本模块) 与 EmakiCoreLib 内置动作 give_potion_effect；
#           不依赖 Vault/PAPI/MythicMobs。
# 如何获得: 管理员执行 /eskills grant <玩家> example_toggle_skill。
#
# 实际形态说明: EmakiSkills 的触发器体系只提供主动触发器与 passive_triggers，
#               释放流程只有 cast / hit / miss / fail 四个阶段，没有技能级的
#               toggle（开/关状态）支持，因此本示例不能做成开关型技能，
#               改为「一次性主动自身增益」形态演示。
# ============================================================

id: "example_toggle_skill"

display_name: "<gold>战意激发</gold>"

description:
  - "<gray>短时间内提升自身力量与移动速度</gray>"
  - "<gray>适合在战斗爆发前使用</gray>"

icon_material: "blaze_powder"

trigger_type: "active"
show_in_slots: true

cooldown_ticks: 240
global_cooldown_ticks: 30

lore_aliases:
  - "战意激发"
tags:
  - "buff"
tab_tags:
  - "example"
ui_category: "buff"
sort_order: 60

enabled: true

resource_costs:
  - type: "local-resource"
    target_id: "example_resource"
    amount: 12.0
    operation: "consume"
    failure_message: "<red>示例魔力不足，无法激发战意。</red>"

variables:
  buff_duration:
    type: "expression"
    value: "160 + (%level% - 1) * 40"
    decimals: 0
    min: 20

  buff_message:
    type: "random_text"
    lines:
      - "<gold>战意燃烧，力量涌动！</gold>"
      - "<gold>你的斗志被彻底点燃。</gold>"

script:
  enabled: true
  mode: "native"
  stop_on_failure: false

  actions:
    cast:
      - "self | give_potion_effect type=strength level=1 duration=%var.buff_duration%t particles=false icon=true"
      - "self | give_potion_effect type=speed level=1 duration=%var.buff_duration%t particles=false icon=true"
      - "self | spawn_particle particle=flame count=18 extra=0.1"
      - "self | play_sound sound=minecraft:block.beacon.activate volume=1 pitch=1.2"
      - 'self | send_message text="%var.buff_message%"'

upgrade:
  enabled: true
  max_level: 3
  economy:
    enabled: false
  success_rates:
    2: 100.0
    3: 80.0
  failure_penalty: "none"
  levels:
    2:
      materials:
        - item_sources:
            - "minecraft-blaze_powder"
          amount: 8
    3:
      materials:
        - item_sources:
            - "minecraft-golden_carrot"
          amount: 4
      actions:
        success:
          - 'send_message text="<gold>战意激发达到满级。</gold>"'
