# ============================================================
# EmakiSkills 技能定义示例
# ============================================================
# 此文件定义了一个完整的主动技能，展示所有可用字段和推荐写法。
# EmakiSkills 支持主动技能（玩家手动触发）和被动技能（事件自动触发）。
# 技能通过脚本系统执行具体效果，支持表达式参数和升级系统。
#
# 文件放置位置: plugins/EmakiSkills/skills/
# 文件名即为技能的内部标识，加载时自动注册。
# ============================================================

# 技能唯一标识符（必填）
id: "example_skill"

# 技能显示名称（支持 MiniMessage 格式）
display_name: "<gradient:#FF6B35:#FF4500>火球术</gradient>"

# 技能描述（显示在 GUI 中）
description:
  - "<gray>向前方发射一颗炽热的火球</gray>"
  - "<gray>命中目标后造成火焰法术伤害</gray>"

# GUI 中显示的图标材质
icon_material: "fire_charge"

# ============================================================
# 触发配置
# ============================================================
# trigger_type: 触发类型
#   - "active": 主动技能（玩家通过绑定的触发器手动释放）
#   - "passive": 被动技能（由 passive_triggers 指定的事件自动触发）
# passive_triggers: 被动技能的触发事件列表（仅 passive 类型使用）
#   - "attack": 攻击实体时
#   - "damaged": 受到伤害时
#   - "kill": 击杀实体时
trigger_type: "active"

# ============================================================
# 冷却配置
# ============================================================
# cooldown_ticks: 技能冷却时间（tick，20 tick = 1 秒）
# global_cooldown_ticks: 全局冷却（释放此技能后，所有技能共享的冷却）
cooldown_ticks: 100
global_cooldown_ticks: 20

# ============================================================
# GUI 显示配置
# ============================================================
# lore_aliases: 技能的别名列表（用于 Lore 匹配识别）
# tags: 技能标签；可用于装备数量限制和分类筛选
# required_skills: 装备此技能前必须已经装备的技能 ID
# conflicting_skills: 不能与此技能同时装备的技能 ID
# show_in_slots: 是否允许显示在玩家主动技能槽选择列表中；false 常用于装备强制触发器技能
# ui_category: GUI 中的分类标签（attack/defense/utility/passive）
# sort_order: 在 GUI 中的排序权重（数字越小越靠前）
lore_aliases:
  - "火球术"
  - "烈焰弹"
tags:
  - "attack"
tab_tags:
  - "starter"
required_skills: []
conflicting_skills:
  - "ice_bolt"
show_in_slots: true
ui_category: "attack"
sort_order: 1

# 是否启用此技能
enabled: true

# ============================================================
# 释放条件
# ============================================================
# 技能释放前检查的条件表达式。
# type: 条件组合方式（all_of / any_of）
condition:
  type: "all_of"
  entries:
    - "%level% >= 1"

# ============================================================
# 资源消耗
# ============================================================
# 释放技能时消耗的资源。
# type: 资源类型
#   - "local-resource": EmakiSkills 本地资源（如本地 mana）
#   - "ea-resource": EmakiAttribute 资源（如 EA 的 mana 当前值）
#   - "attribute-check" / "ea-attribute-check": 检查 EA 属性值（不消耗，仅检测）
#   - "auraskills-mana": AuraSkills 法力值
#   - "mmocore-mana" / "mythiclib-mana": MMOCore/MythicLib 法力值
# target_id: 资源 ID；外部 mana 类型暂时仅保留为可读标识，默认写 mana
# amount: 消耗/检查的数量
# operation: 操作类型（consume = 消耗）
# failure_message: 资源不足时的提示消息
resource_costs:
  - type: "local-resource"
    target_id: "mana"
    amount: 30.0
    operation: "consume"
    failure_message: "魔力不足，需要 30 点魔力"

# ============================================================
# 技能参数
# ============================================================
# 定义技能的数值参数，支持表达式（可引用 %level% 等变量）。
# type: 参数类型
#   - "expression": 表达式类型（根据等级动态计算）
#   - "constant": 常量类型（固定值）
#   - "string": 字符串类型
#   - "boolean": 布尔类型
# decimals: 小数位数
# min/max: 数值范围限制
skill_parameters:
  damage:
    type: "expression"
    expression: "18 + (%level% - 1) * 4"
    decimals: 1
    min: 0

  radius:
    type: "expression"
    expression: "2 + floor((%level% - 1) / 3) * 0.5"
    decimals: 2
    min: 1

# ============================================================
# 技能变量
# ============================================================
# 用于脚本中的占位符替换。支持表达式字符串和布尔表达式。
# 注意：技能的 variables 是脚本内部使用的，不同于其他插件的 effects 变量。
variables:
  ignite_ticks: "40 + (%level% - 1) * 6"
  element: "fire"
  empowered: "%level% >= 5 && %has_target% == 1"
  impact_message: "<gold>火球术命中 %target_name%，造成 %damage% 点火焰伤害。</gold>"

# ============================================================
# 技能脚本
# ============================================================
# 定义技能的具体执行逻辑。
# mode: 脚本模式（"native" = 内置动作系统）
# stop_on_failure: 某个动作失败时是否停止后续动作
# actions: 动作阶段
#   cast: 释放阶段（粒子、音效、射线检测等）
#   hit: 命中阶段（伤害、点燃、特效等）
#   miss: 未命中阶段（提示、粒子等）
script:
  enabled: true
  mode: "native"
  stop_on_failure: true

  actions:
    cast:
      - "sound sound=entity.blaze.shoot volume=1 pitch=1.05"
      - "particle particle=flame at=caster count=24 speed=0.02"
      - "ray range=18 width=%radius% save=target"

    hit:
      - "damage target=target amount=%damage% damage_type=spell element=%element%"
      - "@if='%level% >= 3' ignite target=target ticks=%ignite_ticks%"
      - "@if='%empowered% == true' particle particle=explosion at=target count=1"
      - 'message target=caster text="%impact_message%"'

    miss:
      - "particle particle=smoke at=look count=8 speed=0.01"
      - 'message target=caster text="<gray>火球术没有命中目标。</gray>"'

# ============================================================
# 技能升级配置
# ============================================================
# 技能可以通过消耗材料和金币来升级，提升参数数值。
upgrade:
  enabled: true
  max_level: 10
  gui_template: "upgrade/default"

  # 升级经济配置
  economy:
    enabled: true
    currencies:
      - provider: "vault"
        currency_id: ""
        base_cost: 1200
        cost_formula: "%base_cost% * %target_level%"
        display_name: "<gold>金币</gold>"

  # 各等级升级成功率
  success_rates:
    2: 100.0
    3: 100.0
    4: 95.0
    5: 90.0
    6: 80.0
    7: 70.0
    8: 60.0
    9: 50.0
    10: 40.0

  # 升级失败惩罚: "none"（无）/ "downgrade"（降级）/ "reset"（重置）
  failure_penalty: "none"

  # 各等级详细配置
  levels:
    2:
      materials:
        - item_sources:
            - "minecraft-blaze_powder"
          amount: 2
      actions:
        success: []
        failure: []

    # 里程碑等级：参数覆盖
    5:
      materials:
        - item_sources:
            - "minecraft-blaze_rod"
          amount: 1
      # parameters: 覆盖技能参数（此等级及以上使用新的计算方式）
      parameters:
        radius:
          type: "constant"
          value: 3.5
          decimals: 2
      actions:
        success:
          - 'sendmessage text="<yellow>火球术达到 V，爆炸范围进一步扩大。</yellow>"'
        failure: []

    # 满级
    10:
      # 单独覆盖此等级的经济配置
      economy:
        enabled: true
        currencies:
          - provider: "vault"
            currency_id: ""
            base_cost: 20000
            cost_formula: "%base_cost%"
            display_name: "<gold>金币</gold>"
      materials:
        - item_sources:
            - "minecraft-nether_star"
          amount: 1
      success_rate: 40.0
      actions:
        success:
          - 'broadcastmessage text="<gold>%player%</gold> <yellow>将火球术提升至满级！</yellow>"'
        failure: []
