# ============================================================
# EmakiSkills JavaScript 脚本技能示例
# ============================================================
# GraalVM JavaScript 可读取上下文与目标状态；返回值仅进入动作结果的 script_result，
# 不写回变量、不生成占位符，也不筛选或替换管道目标。后续计算请使用 variables.expression。
# ============================================================

id: "example_js_skill"
display_name: "<gradient:#00D9FF:#0080FF>智能法术</gradient>"
description:
  - "<gray>使用 JavaScript 脚本计算伤害</gray>"
  - "<gray>根据目标生命值动态调整伤害倍率</gray>"
icon_material: "enchanted_book"

trigger_type: "active"
cooldown_ticks: 120
global_cooldown_ticks: 20

lore_aliases:
  - "智能法术"
tags:
  - "attack"
  - "advanced"
tab_tags:
  - "script"
ui_category: "attack"
sort_order: 100
show_in_slots: true
enabled: true

condition:
  type: "all_of"
  entries:
    - "%level% >= 1"

resource_costs:
  - type: "local-resource"
    target_id: "mana"
    amount: 50.0
    operation: "consume"
    failure_message: "魔力不足，需要 50 点魔力"

# ============================================================
# 技能变量
# ============================================================
# base_damage 为脚本读取的基础伤害；crit_threshold 为目标生命值比例阈值。
variables:
  base_damage:
    type: "expression"
    value: "20 + (%level% - 1) * 5"
    decimals: 1
    min: 0

  crit_threshold:
    type: "expression"
    value: "0.3"
    decimals: 2
    min: 0
    max: 1

# ============================================================
# 技能脚本 - JavaScript 用法示例
# ============================================================
# 三个 JS Stage 均需 code；timeout 单位毫秒，默认 5000，<=0 也回退 5000。
script:
  enabled: true
  mode: "native"
  stop_on_failure: true

  actions:
    cast:
      - "self | play_sound sound=block.enchantment_table.use volume=1 pitch=1.2"

      - "looking_at range=20 width=2 | keep"

    hit:
      # js_compute：纯计算脚本
      # js_compute 无需目标，绑定 context；当前目标为玩家时另绑 player。context 可读取 var.* 变量。
      - 'js_compute code="return context.getVariable(''var.base_damage'');" timeout=500'

      # 实际伤害由 variables 段的表达式决定，不依赖 JS 返回值。
      - "inherited | damage amount=%var.base_damage%"

      # base_damage 随等级增长；30 点分支从 3 级起命中。
      - "if %var.base_damage%>=30 [ inherited | spawn_particle particle=crit_magic count=32 extra=0.15 ]"
      - "if %var.base_damage%<30 [ inherited | spawn_particle particle=enchant count=16 extra=0.08 ]"

      # js_entity：操作实体的脚本
      # js_entity 仅对已有的玩家目标执行，绑定 player/context；非玩家静默跳过，返回值不筛选目标。
      # nearby.type 必须是合法 EntityType，不支持 hostile 等分组名。
      - 'nearby radius=5 limit=3 type=zombie | js_entity code="return player.getHealth();" timeout=300'

      - "nearby radius=5 limit=3 type=zombie | damage amount=%var.base_damage%"

      # js_location：读取位置的脚本
      # js_location 需要位置目标，绑定 location/context；关联玩家时另绑只读 player。
      # 返回值不生成坐标，也不提供 count/index/baseX/baseY/baseZ。
      - 'inherited | js_location code="return location.getBlockY();" timeout=500'
      - "inherited | spawn_particle particle=end_rod count=12 extra=0.05"

      - 'send_message text="<aqua>智能法术命中</aqua>"'

    miss:
      - "self | spawn_particle particle=smoke count=12 extra=0.02"
      - 'send_message text="<gray>智能法术未命中目标</gray>"'

# ============================================================
# 升级配置
# ============================================================
upgrade:
  enabled: true
  max_level: 5

  economy:
    enabled: true
    currencies:
      - provider: "vault"
        currency_id: ""
        base_cost: 2000
        cost_formula: "%base_cost% * %target_level%"
        display_name: "<gold>金币</gold>"

  success_rates:
    2: 100.0
    3: 95.0
    4: 90.0
    5: 85.0

  failure_penalty: "none"

  levels:
    2:
      materials:
        - item_sources:
            - "minecraft-lapis_lazuli"
          amount: 8
    3:
      materials:
        - item_sources:
            - "minecraft-lapis_block"
          amount: 2
    5:
      materials:
        - item_sources:
            - "minecraft-enchanted_book"
          amount: 1
      actions:
        success:
          - 'send_message text="<aqua>智能法术达到满级，伤害计算更加精准！</aqua>"'
