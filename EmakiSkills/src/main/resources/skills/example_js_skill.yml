# ============================================================
# EmakiSkills JavaScript 脚本技能示例
# ============================================================
# 此文件展示如何使用 GraalVM JavaScript 脚本扩展技能逻辑。
# JS 脚本可以实现 DSL 无法表达的复杂计算、条件判断和动态参数。
#
# 适用场景：
#   - 复杂的伤害计算公式（基于多个属性的非线性函数）
#   - 条件分支逻辑（多层嵌套判断）
#   - 动态坐标计算（随机偏移、圆形/球形分布）
#   - 字符串拼接和格式化（动态消息生成）
# ============================================================

id: "example_js_skill"
display_name: "<gradient:#00D9FF:#0080FF>智能法术</gradient>"
description:
  - "<gray>使用 JavaScript 脚本计算伤害</gray>"
  - "<gray>根据目标生命值动态调整伤害倍率</gray>"
icon_material: "enchanted_book"

trigger_type: "active"
cooldown_ticks: 120
global_cooldown_ticks: 20

lore_aliases:
  - "智能法术"
tags:
  - "attack"
  - "advanced"
tab_tags:
  - "script"
ui_category: "attack"
sort_order: 100
show_in_slots: true
enabled: true

condition:
  type: "all_of"
  entries:
    - "%level% >= 1"

resource_costs:
  - type: "local-resource"
    target_id: "mana"
    amount: 50.0
    operation: "consume"
    failure_message: "魔力不足，需要 50 点魔力"

# ============================================================
# 技能变量
# ============================================================
# base_damage: 基础伤害值，会被脚本读取并作为计算基数
# crit_threshold: 暴击判定阈值（目标生命值百分比）
variables:
  base_damage:
    type: "expression"
    value: "20 + (%level% - 1) * 5"
    decimals: 1
    min: 0
  
  crit_threshold:
    type: "expression"
    value: "0.3"
    decimals: 2
    min: 0
    max: 1

# ============================================================
# 技能脚本 - JavaScript 示例
# ============================================================
# 本示例展示三种 JS Stage 的使用方法：
#   1. js_compute: 计算数值并存入变量（伤害倍率计算）
#   2. js_entity: 筛选/标记实体目标（低血量目标标记）
#   3. js_location: 计算动态坐标（圆形偏移粒子效果）
script:
  enabled: true
  mode: "native"
  stop_on_failure: true

  actions:
    cast:
      # 播放释放音效
      - "self | play_sound sound=block.enchantment_table.use volume=1 pitch=1.2"
      
      # 射线检测并保存目标
      - "looking_at range=20 width=2 | keep"

    hit:
      # ============================================================
      # 示例 1: js_compute - 计算动态伤害倍率
      # ============================================================
      # 根据目标当前生命值百分比动态调整伤害：
      #   - 生命值高于 80%：100% 伤害
      #   - 生命值 30%-80%：线性递增到 150%
      #   - 生命值低于 30%：200% 暴击伤害
      #
      # script: JavaScript 代码，可访问以下对象：
      #   - player: BukkitPlayerExport（执行者）
      #   - target: BukkitPlayerExport（目标，仅 js_entity 可用）
      #   - context: EmakiContextExport（上下文变量）
      #   - Math/Array/Promise 等 ECMAScript 标准库
      #
      # timeout_ms: 脚本超时时间（毫秒），超时后强制中断
      # result_var: 脚本返回值存入的变量名，后续可用 %result_var% 引用
      - |
        js_compute script="""
          const targetHealth = context.getVariable('target.health');
          const targetMaxHealth = context.getVariable('target.maxHealth');
          const healthPercent = targetHealth / targetMaxHealth;
          const critThreshold = context.getVariable('var.crit_threshold');
          
          let multiplier = 1.0;
          if (healthPercent < critThreshold) {
            // 低血量暴击
            multiplier = 2.0;
          } else if (healthPercent < 0.8) {
            // 中血量线性递增
            multiplier = 1.0 + (0.8 - healthPercent) * 1.0;
          }
          
          // 返回值会存入 damage_multiplier 变量
          return multiplier;
        """ timeout_ms=500 result_var=damage_multiplier
      
      # 使用脚本计算的倍率应用伤害
      - "inherited | damage amount=%var.base_damage%*%damage_multiplier%"
      
      # 根据倍率播放不同的粒子效果
      - "if %damage_multiplier%>=2.0 [ inherited | spawn_particle particle=crit_magic count=32 extra=0.15 ]"
      - "if %damage_multiplier%<2.0 [ inherited | spawn_particle particle=enchant count=16 extra=0.08 ]"

      # ============================================================
      # 示例 2: js_entity - 动态实体筛选
      # ============================================================
      # 筛选附近所有生命值低于 30% 的敌对实体，对它们造成额外伤害
      #
      # script: 返回 true 保留实体，返回 false 过滤掉
      # target 对象代表当前正在判断的实体
      - |
        nearby type=hostile range=5 |
        js_entity script="""
          const health = target.getHealth();
          const maxHealth = target.getMaxHealth();
          return (health / maxHealth) < 0.3;
        """ timeout_ms=300 |
        damage amount=%var.base_damage%*0.5
      
      # ============================================================
      # 示例 3: js_location - 动态坐标计算
      # ============================================================
      # 在目标周围生成圆形分布的粒子效果
      # 每个粒子的位置通过 JS 脚本计算（三角函数 + 随机偏移）
      #
      # count: 生成的坐标数量
      # script: 返回相对偏移量的数组 [x, y, z]
      # 脚本内可用特殊变量：
      #   - index: 当前是第几个坐标（0 到 count-1）
      #   - baseX/baseY/baseZ: 基准坐标（inherited 目标的位置）
      - |
        inherited |
        js_location count=12 script="""
          const angle = (index / 12) * Math.PI * 2;
          const radius = 1.5 + Math.random() * 0.5;
          const offsetX = Math.cos(angle) * radius;
          const offsetZ = Math.sin(angle) * radius;
          const offsetY = 0.5 + Math.random() * 0.3;
          return [offsetX, offsetY, offsetZ];
        """ timeout_ms=500 |
        spawn_particle particle=end_rod count=1

      # 发送伤害消息，包含动态计算的倍率
      - 'send_message text="<aqua>智能法术命中，伤害倍率: %damage_multiplier%x</aqua>"'

    miss:
      - "self | spawn_particle particle=smoke count=12 extra=0.02"
      - 'send_message text="<gray>智能法术未命中目标</gray>"'

# ============================================================
# 升级配置
# ============================================================
upgrade:
  enabled: true
  max_level: 5
  
  economy:
    enabled: true
    currencies:
      - provider: "vault"
        currency_id: ""
        base_cost: 2000
        cost_formula: "%base_cost% * %target_level%"
        display_name: "<gold>金币</gold>"
  
  success_rates:
    2: 100.0
    3: 95.0
    4: 90.0
    5: 85.0
  
  failure_penalty: "none"
  
  levels:
    2:
      materials:
        - item_sources:
            - "minecraft-lapis_lazuli"
          amount: 8
    3:
      materials:
        - item_sources:
            - "minecraft-lapis_block"
          amount: 2
    5:
      materials:
        - item_sources:
            - "minecraft-enchanted_book"
          amount: 1
      actions:
        success:
          - 'send_message text="<aqua>智能法术达到满级，伤害计算更加精准！</aqua>"'
