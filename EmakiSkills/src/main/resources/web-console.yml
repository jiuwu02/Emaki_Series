# EmakiSkills WebUIEdit 声明式注册
# 仅声明结构信息与资源入口，展示文案由前端扩展 i18n 注册。

module:
  tone: skills
  icon: '<svg viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 8a8 8 0 110 16 8 8 0 010-16zM19 11v5l4 3M19 2v4M19 32v4M7 19H3M35 19h-4M9 9l3 3M29 9l-3 3M13 26l-3 3M25 26l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'

files:
  - path: "config.yml"
    kind: CONFIG
  - path: "skills/**/*.yml"
    kind: CONFIG
  - path: "resources/**/*.yml"
    kind: CONFIG
  - path: "gui/**/*.yml"
    kind: GUI
    editor: "emakiskills:gui"

extensions:
  - id: "emakiskills:gui-surface"
    resource: "web-extensions/emakiskills-gui-surface.js"
