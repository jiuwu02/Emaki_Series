# EmakiSkills 主配置
#
# 控制技能槽、技能来源、施法模式、触发器与原生脚本执行限制。
# 修改后按插件提供的重载命令应用。
# 文件位置：plugins/EmakiSkills/config.yml

# version 是配置结构标记，由项目资源同步流程维护，不是功能开关。
version: "2.7.9"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放插件内置的默认技能数据。
release_default_data: true

slots:
  # 默认技能槽数量；小于 1 的值会按 1 处理。
  default_count: 3

# 装备技能来源；默认合并 Lore 与 PDC，严格模式只保留两侧共同的技能 ID。
skill_sources:
  read_lore_skills: true
  read_pdc_skills: true
  require_lore_pdc_match: false

# 技能标签装备数量限制。
# 技能定义里的 tags 命中这里的标签时，玩家最多只能同时把该标签的技能装备到对应数量。
# 例如：tags 包含 ultimate 的技能最多装备 1 个；tags 包含 mobility 的技能最多装备 2 个。
skill_tags:
  equip_limits:
    ultimate: 1
    mobility: 2

cast_mode:
  # 兼容保留项；当前运行时会把施法模式入口固定为 F。
  entry_key: "f"
  # 玩家重新加入后是否恢复上次的施法模式状态。
  restore_last_state_on_join: true

cast_timing:
  # 任意技能成功释放后的全局延迟，单位：tick；0 表示关闭。
  forced_global_cast_delay_ticks: 0

actionbar:
  # 是否启用技能状态 ActionBar。
  enabled: true
  # 刷新间隔，单位：tick；小于 1 的值会按 1 处理。
  refresh_interval_ticks: 10
  # 施法模式下的显示模板。
  template_cast_mode: "<gold>施法模式</gold> %slot_1% %slot_2% %slot_3%
    <gray>延迟:</gray> %forced_delay%"
  # 非施法模式下的显示模板；空值会回退到源码默认文本，而不是关闭显示。
  template_idle: ""

# 原生技能脚本执行器。
script_engine:
  # 总开关。
  enabled: true
  # 未单独指定时使用的脚本模式。
  default_mode: "native"
  # 某条动作失败后是否停止当前阶段。
  stop_on_failure: true
  # 单个阶段允许的最大脚本行数；小于 1 的值会按 1 处理。
  max_lines_per_phase: 64
  # 单条动作允许处理的最大目标数；小于 1 的值会按 1 处理。
  max_targets_per_action: 16
  # 是否输出脚本执行调试信息。
  debug: false

# 主动触发器定义；incompatible_with 为空表示不声明互斥触发器。
triggers:
  left_click:
    display_name: "[左键]"
    enabled: true
    incompatible_with:
      - shift_left_click

  right_click:
    display_name: "[右键]"
    enabled: true
    incompatible_with:
      - shift_right_click

  shift_left_click:
