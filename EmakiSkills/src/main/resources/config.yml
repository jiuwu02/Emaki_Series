# ============================================================
# EmakiSkills 主配置文件
# ============================================================
# 此文件包含插件的全局设置。修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiSkills/config.yml
# ============================================================

# 主配置
# version 由资源同步维护
version: "2.6.12"

# 语言文件 ID
language: "zh_CN"

# 是否写入默认资源
release_default_data: true

slots:
  # 默认技能槽数量
  default_count: 3

# 装备技能来源。默认合并 Lore 与物品 PDC；严格模式只保留同一物品、同一槽位中两侧共同的技能 ID。
skill_sources:
  read_lore_skills: true
  read_pdc_skills: true
  require_lore_pdc_match: false

# 技能标签装备数量限制。
# 技能定义里的 tags 命中这里的标签时，玩家最多只能同时把该标签的技能装备到对应数量。
# 例如：tags 包含 ultimate 的技能最多装备 1 个；tags 包含 mobility 的技能最多装备 2 个。
skill_tags:
  equip_limits:
    ultimate: 1
    mobility: 2

cast_mode:
  # F 键用于进入/退出施法模式。
  # G 键为客户端本地按键，Spigot 服务端无法监听，ProtocolLib/PacketEvents 也无法获取。
  entry_key: "f"
  # 重登后是否恢复上次的施法模式
  restore_last_state_on_join: true

cast_timing:
  # 任意技能成功释放后的全局延迟，单位 tick
  # 0 表示关闭
  forced_global_cast_delay_ticks: 0

actionbar:
  enabled: true
  # 刷新间隔，单位 tick
  refresh_interval_ticks: 10
  # 施法模式下的显示模板
  template_cast_mode: "<gold>施法模式</gold> %slot_1% %slot_2% %slot_3%
    <gray>延迟:</gray> %forced_delay%"
  # 非施法模式下的显示模板，空字符串表示不显示
  template_idle: ""

# 原生技能脚本引擎
script_engine:
  enabled: true
  default_mode: "native"
  stop_on_failure: true
  max_lines_per_phase: 64
  max_targets_per_action: 16
  debug: false

# 触发器配置
triggers:
  left_click:
    display_name: "[左键]"
    enabled: true
    incompatible_with:
      - shift_left_click

  right_click:
