# 被动触发器设置
passive_trigger_settings:
  # timer 被动触发器的检查间隔，单位 tick
  timer_interval_ticks: 20
  # combo_attack 连击触发器的超时间隔，单位 tick
  # 超过此间隔未攻击则连击计数重置
  combo_timeout_ticks: 60

# 被动触发器配置
