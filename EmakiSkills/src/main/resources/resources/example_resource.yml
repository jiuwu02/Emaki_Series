# ============================================================
# EmakiSkills 本地资源定义示例
# ============================================================
# 本地资源仅保存在技能数据中，不与 EmakiAttribute 自动互通。
# 已使用 EA 同名资源时，技能费用应改用 ea-resource，避免并存两套数值。
# 资源 ID 取自 id，与文件名无关。
# ============================================================

id: "example_resource"

display_name: "<gradient:#4DA6FF:#00BFFF>魔力</gradient>"

# 资源上限（默认最大值）
max: 100.0

# 初始当前值（玩家首次加载时的资源量）
default_current: 100.0

# 自然回复量（每次回复增加的数值）
regen_amount: 2.0

# 回复间隔（tick，20 tick = 1 秒）
regen_interval_ticks: 20

# 当前值范围限制
# clamp_min: 最小值（不会低于此值）
# clamp_max: 最大值（不会超过此值；<= 0 时回退到 max）
clamp_min: 0.0
clamp_max: 100.0
