# ============================================================
# EmakiSkills 本地资源定义示例
# ============================================================
# 此文件定义了一个 EmakiSkills 本地维护的资源（如魔力、能量等）。
# 本地资源只保存在技能数据中，不会自动与 EmakiAttribute 互通。
#
# 适合使用本地资源的场景：
#   - 只想让技能系统单独维护一套能量
#   - 服务器没有启用 EmakiAttribute
#   - 不希望技能消耗接入 EA 资源系统
#
# 如果服务器已经统一使用 EmakiAttribute 的 mana，
# 建议不要再保留同名本地资源，避免出现两套 mana 并存。
# 此时应在技能的 resource_costs 中使用 "ea-resource" 类型：
#   resource_costs:
#     - type: "ea-resource"
#       target_id: "mana"
#       amount: 30.0
#       operation: "consume"
#       failure_message: "法力不足，需要 30 点法力"
#
# 文件放置位置: plugins/EmakiSkills/resources/
# 文件名仅用于组织和错误诊断；资源内部标识由必填 id 字段决定，加载时按 id 注册。
# ============================================================

# 资源唯一标识符（必填）
id: "example_resource"

# 资源显示名称（支持 MiniMessage 格式）
display_name: "<gradient:#4DA6FF:#00BFFF>魔力</gradient>"

# 资源上限（默认最大值）
max: 100.0

# 初始当前值（玩家首次加载时的资源量）
default_current: 100.0

# 自然回复量（每次回复增加的数值）
regen_amount: 2.0

# 回复间隔（tick，20 tick = 1 秒）
regen_interval_ticks: 20

# 当前值范围限制
# clamp_min: 最小值（不会低于此值）
# clamp_max: 最大值（不会超过此值；<= 0 时回退到 max）
clamp_min: 0.0
clamp_max: 100.0
