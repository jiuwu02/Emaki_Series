# ============================================================
# EmakiForge GUI 配置 - 锻造界面
# ============================================================
# 玩家进行锻造操作的主界面
#
# 文件放置位置: plugins/EmakiForge/gui/
# ============================================================
id: "forge_gui"

gui_type: CHEST
title: "<dark_gray>锻造台 - %recipe%</dark_gray>"

rows: 5

slots:
  top_frame:
    slots:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    item:
      source: "BLACK_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  side_frame:
    slots:
      - 36
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
      - 44
    item:
      source: "BLACK_STAINED_GLASS_PANE"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  core_frame:
    slots:
      - 9
      - 12
      - 15
      - 17
      - 18
      - 21
      - 24
      - 25
      - 26
      - 27
      - 28
      - 30
      - 33
      - 35
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<dark_gray>"
        tooltip_display:
          hide_tooltip: true

  blueprint_inputs:
    slots:
      - 10
      - 19
    type: "blueprint_inputs"
    item:
      source: "guster_banner_pattern"
      components:
        custom_name: "<light_purple>放入图纸</light_purple>"
        lore:
          - "<gray>配方会按图纸物品源自动匹配"

  capacity_display:
    slots:
      - 16
    type: "capacity_display"
    item:
      source: "BLAST_FURNACE"
      components:
        custom_name: "<gray>锻造容量</gray>"
        lore:
          - "<gray>当前容量: <yellow>%current%</yellow>"
          - "<gray>容量上限: <gold>%max%</gold>"
          - "<gray>状态: %capacity_state%</gray>"
          - ""
          # %blueprint_requirements% 每项各占一行，条目文案见 lang 的 gui.blueprint.*
          # 一张图纸可被多个配方使用，配方未确定时按配方分组列出（最多 3 组）
          # 数量口径是「已放入 GUI 的量 / 需要的量」，不是背包里的量
          - "%blueprint_requirements%"

  required_materials:
    slots:
      - 20
      - 11
      - 29
    type: "required_materials"
    item:
      source: "BARRIER"
      components:
        custom_name: "<gold>放入必需材料</gold>"
        lore:
          - "<gray>这里会接收配方固定材料"

  optional_materials:
    slots:
      - 13
      - 14
      - 22
      - 23
      - 31
      - 32
    type: "optional_materials"
    item:
      source: "BARRIER"
      components:
        custom_name: "<green>放入可选材料</green>"
        lore:
          - "<gray>可选材料会按配方生效并消耗容量"

  confirm:
    slots:
      - 34
    type: "confirm"
    item:
      source: "ANVIL"
      components:
        custom_name: "<green>确认锻造</green>"
        lore:
          - "<gray>当前容量: <yellow>%current%/%max%</yellow>"
          - "<yellow>点击后开始执行锻造"
    sounds:
      click:
        sound: "ui.button.click"
        volume: 1.0
        pitch: 1.0

virtual_items:
  confirm_blocked:
    item:
      source: "BARRIER"
      components:
        custom_name: "<red>无法锻造</red>"
        lore:
          - "<gray>当前容量: <yellow>%current%/%max%</yellow></gray>"
          - "<red>可选材料容量已超出上限</red>"
          - "<gray>减少材料后再试一次</gray>"

texts:
  capacity_state:
    waiting: "<gray>等待图纸</gray>"
    overflow: "<red>已超限</red>"
    warning: "<gold>接近上限</gold>"
    normal: "<green>正常</green>"
