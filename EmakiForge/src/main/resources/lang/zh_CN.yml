# EmakiForge 简体中文语言资源
# 消息使用 MiniMessage; 保留消息分组旁标明的占位符
# version 由资源同步流程维护, 用于合并新增默认键

version: "4.8.7"

general:
  prefix: "<gray>[ <gradient:#F59E0B:#EF4444>EmakiForge</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此操作</red>"
  player_only: "<red>此命令只能由玩家执行</red>"
  unknown_command: "<red>未知命令</red>"
  invalid_args: "<red>参数错误</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>配置已重载</green>"
  reload_fail: "<red>配置重载失败</red>"
  reload_summary: "<gray>已重载配方 %recipes% 个, GUI %guis% 个</gray>"

command:
  help:
    header: "<gold>========== Emaki Forge 帮助 ==========</gold>"
    footer: "<gold>========================================</gold>"
    line: "<yellow>%cmd%</yellow> <gray>- %desc%</gray>"
    commands:
      help: "显示帮助信息"
      forge: "打开独立锻造台"
      book: "打开配方图鉴"
      reload: "重载配置文件"
      "list <type>": "列出指定类型配置"
      debug: "管理 Debug 模式"
      "convert-legacy [confirm]": "把 recipes/ 的旧 item_sources 转换为 matcher"
      editor: "打开锻造资源编辑器"
      "edit recipe <id>": "编辑指定配方, 省略 ID 打开定义浏览器"
      "create recipe [id]": "在定义浏览器中创建新配方"
      "delete recipe <id>": "在定义浏览器中删除配方"
  debug:
    # 命令: 锻造运行状态调试输出; 占位符: %status%, %generation%, %gui%, %recipes%, %issues%, %source_states%, %reload_candidates%, %reload_installed%, %reload_failed%, %reload_stale%, %gui_stale%, %execution_stale%, %settlement_failures%, %last_ms%
    runtime: "<gray>EmakiForge 运行状态:</gray> <white>status=%status% generation=%generation% gui=%gui% recipes=%recipes% issues=%issues% source_states=%source_states% reload_candidates=%reload_candidates% reload_installed=%reload_installed% reload_failed=%reload_failed% reload_stale=%reload_stale% gui_stale=%gui_stale% execution_stale=%execution_stale% settlement_failures=%settlement_failures% last_ms=%last_ms%</white>"
    # 命令: 配方加载报告调试输出; 占位符: %generation%, %files%, %parsed%, %skipped%, %registered%, %duplicates%, %executable%, %gui_visible%, %issues%, %warnings%, %hash%, %duration_ms%, %source_statuses%
    recipe_load: "<gray>EmakiForge 配方加载:</gray> <white>generation=%generation% files=%files% parsed=%parsed% skipped=%skipped% registered=%registered% duplicates=%duplicates% executable=%executable% gui_visible=%gui_visible% issues=%issues% warnings=%warnings% hash=%hash% duration_ms=%duration_ms% source_statuses=%source_statuses%</white>"
  convert_legacy:
    header: "<gold>========== 旧 item_sources 转换 (%mode%, 共 %files% 个文件) ==========</gold>"
    mode:
      dry_run: "预演"
      apply: "写入"
    file: "<yellow>%file%</yellow> <gray>- %status% %detail%</gray>"
    backup: "<gray>  已备份为 <white>%backup%</white></gray>"
    diff_line: "<gray>  %line%</gray>"
    summary: "<gray>转换 %converted% 个, 无旧键 %skipped% 个, 键冲突 %conflict% 个, 无法转换 %unconvertible% 个, 失败 %failed% 个</gray>"
    breakdown: "<gray>其中: 直接转为 matcher 并移除旧键 <white>%plain%</white> 处, 与原有 matcher 合并为 all_of 以保持判定等价 <white>%merged%</white> 处, 补写 matcher 但保留旧键 (仍用于取物, 扣除或计数)<white>%duplicated%</white> 处</gray>"
    file_merged: "<gray>  合并为 all_of <white>%merged%</white> 处, 保留旧键 <white>%duplicated%</white> 处, 直接转换 <white>%plain%</white> 处</gray>"
    dry_run_hint: "<yellow>以上为预演结果, 未写入任何文件. 执行 <white>/emakiforge convert-legacy confirm</white> 才会写入并备份原文件</yellow>"
    nothing_to_do: "<gray>没有需要转换的配置</gray>"
    status:
      converted: "可转换"
      no_legacy_block: "无旧键"
      conflict: "键冲突, 已保留原样"
      unconvertible: "无等价写法, 已保留原样"
      failed: "转换失败, 已保留原样"
  list:
    header: "<gold>========== %type% 列表 ==========</gold>"
    recipes_header: "<gold>========== 配方列表  (共 %count% 条) ==========</gold>"
    blueprints_header: "<gold>========== 图纸列表  (共 %count% 条) ==========</gold>"
    materials_header: "<gold>========== 材料列表  (共 %count% 条) ==========</gold>"
    recipe_line: "<yellow>%id%</yellow> <gray>- %name%</gray>"
    blueprint_line: "<yellow>%id%</yellow> <gray>- %name%</gray>"
    material_line:
      "<yellow>%id%</yellow> <gray>- %name%  (消耗: %capacity%, 加成:
      +%bonus%)</gray>"

