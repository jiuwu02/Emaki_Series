# ============================================================
# EmakiForge 主配置文件
# ============================================================
# 此文件包含插件的全局设置。修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiForge/config.yml
# ============================================================

# 锻造系统主配置
# version 由资源同步维护
version: "4.3.7"

# 语言文件 ID
language: "zh_CN"

# 是否写入默认资源
release_default_data: true

quality:
  # 品质池。每项是一个可编辑记录：name 为品质名，weight 为抽取权重，multiplier 为结果倍率。
  tiers:
    - name: "平庸"
      weight: 60
      multiplier: 1.0
    - name: "精良"
      weight: 30
      multiplier: 1.05
    - name: "有缺"
      weight: 10
      multiplier: 0.95
    - name: "优质"
      weight: 5
      multiplier: 1.1
    - name: "无暇"
      weight: 2
      multiplier: 1.15
    - name: "完美"
      weight: 1
      multiplier: 1.2

  # 随机失败时的回退品质
  default_tier: "平庸"

  guarantee:
    # 连续锻造达到阈值后的品质保底
    enabled: true
    threshold: 60
    minimum: "无暇"

  item_meta:
    # 是否将品质写入名称和 Lore
    enabled: true
    tiers:
      有缺:
        name_actions:
          - action: "prepend_prefix"
            value: "<color:#733333>[有缺] </color>"
        lore_actions: []
        action: []
      平庸:
        name_actions:
          - action: "prepend_prefix"
            value: "<color:#999999>[平庸] </color>"
        lore_actions: []
        action: []
      精良:
        name_actions:
          - action: "prepend_prefix"
            value: "<color:#1F871F>[精良] </color>"
        lore_actions: []
        action: []
      优质:
        name_actions:
          - action: "prepend_prefix"
            value: "<color:#00FF00>[优质] </color>"
        lore_actions: []
        action: []
      无暇:
        name_actions:
          - action: "prepend_prefix"
            value: "<color:#4B64C8>[无暇] </color>"
        lore_actions: []
        action:
          - 'broadcastmessage
            text="<color:#4B64C8>%player_name%锻造出了一个无暇品质的<show_item></color>"'
      完美:
        name_actions:
          - action: "prepend_prefix"
            value: "<color:#FFD700>[完美] </color>"
        lore_actions: []
        action:
          - 'broadcastmessage
            text="<color:#FFD700>%player_name%锻造出了一个完美品质的<show_item></color>"'

number_format:
  default: "0.##"
  integer: "0"
  percentage: "0.##%"

permission:
  # OP 是否跳过锻造条件检查
  op_bypass: false

condition:
  # 条件表达式解析失败时，是否视为条件不通过
  invalid_as_failure: true

history:
  enabled: true
  auto_save: true
  # 自动保存间隔，6000 tick = 5 分钟
  save_interval: 6000
