# ============================================================
# EmakiForge 示例配方：护甲锻造（example_armor_forge）
# ============================================================
# 演示功能：
#   1. 不同材料提供不同的 EmakiAttribute 属性（physical_defense / health / dodge_chance）
#   2. 材料附带 EmakiSkills 技能（es_skill，多个技能 ID）
#   3. 可选材料的名称前缀与 Lore 追加
# 如何触发：
#   安装 EmakiForge 后执行 /ef forge，放入 minecraft-book 作为图纸，
#   再放铁锭、皮革与可选紫水晶碎片。
# 依赖：
#   EmakiAttribute / EmakiSkills 未安装时，ea_attribute 与 es_skill 效果会走空操作，
#   锻造照常完成，只是不写入属性与技能；其余材料效果仍然生效。
# ============================================================

id: "example_armor_forge"
display_name: "<aqua>示例护甲锻造</aqua>"

blueprint_requirements:
  - id: "example_armor_blueprint"
    item_sources:
      - "minecraft-book"
    amount: 1

materials:
  # ---- 必选材料：铁锭（物理防御）----
  - material_id: "armor_iron"
    count_key: "armor_iron"
    audit_id: "armor_iron"
    item_sources:
      - "minecraft-iron_ingot"
    amount: 4
    capacity_cost: 8
    effects:
      - type: "variables"
        variables:
          physical_defense: 6
      - type: "ea_attribute"
        ea_attributes:
          physical_defense: 6.0
      - type: "lore_action"
        lore_actions:
          - action: "insert_below"
            anchor: "锻造属性:"
            content:
              - "<gray>物理防御: <blue>+%physical_defense%</blue></gray>"

  # ---- 必选材料：皮革（生命与闪避）----
  - material_id: "armor_leather"
    count_key: "armor_leather"
    audit_id: "armor_leather"
    item_sources:
      - "minecraft-leather"
    amount: 2
    capacity_cost: 3
    effects:
      - type: "variables"
        variables:
          max_health: 4
          dodge_chance: 2
      - type: "ea_attribute"
        ea_attributes:
          health: 4.0
          dodge_chance: 2.0

  # ---- 可选材料：紫水晶碎片（生命、技能与名称前缀）----
  - material_id: "armor_amethyst"
    count_key: "armor_amethyst"
    audit_id: "armor_amethyst"
    item_sources:
      - "minecraft-amethyst_shard"
    amount: 1
    optional: true
    capacity_cost: 6
    effects:
      - type: "variables"
        variables:
          max_health: 6
      - type: "ea_attribute"
        ea_attributes:
          health: 6.0
      - type: "es_skill"
        es_skills:
          - "example_skill"
          - "guardian_aura"
      - type: "name_action"
        name_actions:
          - action: "prepend_prefix"
            value: "<light_purple>[紫晶] </light_purple>"

forge_capacity: 22
optional_material_limit: 2

quality:
  enabled: true
  custom_pool:
    - "平庸-60-1.0"
    - "精良-30-1.05"
    - "优质-10-1.12"

result:
  success:
    outputs:
      - item_source: "minecraft-diamond_chestplate"
    name_actions:
      - action: "replace"
        value: "<aqua>示例护甲</aqua>"
    lore_actions:
      - action: "append"
        content:
          - ""
          - "<gray>锻造属性:"
          - "<dark_gray>由 %player% 锻造"
          - "<dark_gray>EmakiForge 护甲锻造示例"

actions:
  pre:
    - 'send_action_bar text="<gray>皮革与铁片正在成型……</gray>"'
  success:
    - "play_sound sound=BLOCK_ANVIL_USE volume=1 pitch=1"
  failure:
    - 'send_message text="<red>锻造前置步骤失败，本次锻造已中止。</red>"'
