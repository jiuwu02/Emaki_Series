# ============================================================
# EmakiForge 锻造配方示例
# ============================================================
# 此文件定义了一个完整的锻造配方，展示所有可用字段和推荐写法。
# 锻造系统允许玩家通过组合多种材料来创造新物品，
# 每种材料可以提供不同的属性、技能和外观效果。
# 锻造容量系统限制了单次锻造可以使用的材料总量。
#
# 文件放置位置: plugins/EmakiForge/recipes/
# 文件名即为配方的内部标识，加载时自动注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称（支持 MiniMessage 格式）
display_name: "<gold>烈焰之剑锻造配方</gold>"

# ============================================================
# 锻造容量
# ============================================================
# 所有材料的 capacity_cost 总和不能超过此值。
# 玩家需要在容量限制内选择材料组合。
forge_capacity: 35

# ============================================================
# 蓝图需求
# ============================================================
# 锻造前必须拥有的物品（不消耗，仅检测持有）。
# 用于实现"需要先获得配方图纸"的玩法。
blueprint_requirements:
  - item_sources:
      - "minecraft-enchanted_book"
    amount: 1

# ============================================================
# 材料列表
# ============================================================
# 每种材料定义了:
#   item_sources: 材料物品来源
#   amount: 需要的数量
#   capacity_cost: 占用的锻造容量
#   optional: 是否为可选材料（默认 false）
#   effects: 此材料提供的效果列表
#
# effects 支持的类型:
#   - type: "variables"       → 表达式引擎变量（用于 Lore 占位符渲染）
#   - type: "ea_attribute"    → EmakiAttribute PDC 属性
#   - type: "es_skill"        → EmakiSkills 技能附加
#   - type: "name_action"     → 修改物品名称
#   - type: "lore_action"     → 修改物品 Lore
#   - type: "capacity_bonus"  → 扩展锻造容量（特殊类型）
materials:
  # ---- 基础材料：铁锭（提供物理属性）----
  - item_sources:
      - "minecraft-iron_ingot"
    amount: 3
    capacity_cost: 5
    effects:
      - type: "variables"
        variables:
          physical_damage: 5
          max_health: 2
      - type: "ea_attribute"
        ea_attributes:
          physical_attack: 5.0
          max_health: 2.0
        # ea_attribute_meta: 属性元数据（可选）
        ea_attribute_meta:
          source_material: "iron_ingot"
      - type: "lore_action"
        lore_actions:
          - action: "insert_below"
            anchor: "锻造属性:"
            content:
              - "<gray>物理伤害: <red>+{physical_damage}"
              - "<gray>生命值: <green>+{max_health}"

  # ---- 基础材料：烈焰粉（提供火焰属性 + 技能 + 名称修改）----
  - item_sources:
      - "minecraft-blaze_powder"
    amount: 1
    capacity_cost: 10
    effects:
      - type: "variables"
        variables:
          fire_damage: 10
          critical_chance: 5
      - type: "ea_attribute"
        ea_attributes:
          fire_damage: 10.0
          physical_crit_rate: 5.0
      # 附加技能（支持列表和单个简写两种形式）
      - type: "es_skill"
        es_skills:
          - "flame_strike"
        es_skill: "flame_passive"
      # 修改物品名称
      - type: "name_action"
        name_actions:
          - action: "append_suffix"
            value: "<red> [烈焰]"
      - type: "lore_action"
        lore_actions:
          - action: "insert_below"
            anchor: "锻造属性:"
            content:
              - "<red>火焰伤害: +{fire_damage}"
              - "<yellow>暴击率: +{critical_chance}%"

  # ---- 可选材料：火焰弹（额外火焰属性）----
  - item_sources:
      - "minecraft-fire_charge"
    amount: 1
    optional: true
    capacity_cost: 12
    effects:
      - type: "variables"
        variables:
          fire_damage: 12
          critical_chance: 4
      - type: "ea_attribute"
        ea_attributes:
          fire_damage: 12.0
          physical_crit_rate: 4.0
      - type: "lore_action"
        lore_actions:
          - action: "append"
            content:
              - "<red>火焰伤害: +{fire_damage}"
              - "<yellow>暴击率: +{critical_chance}%"

  # ---- 可选材料：羽毛（移动速度）----
  - item_sources:
      - "minecraft-feather"
    amount: 1
    optional: true
    capacity_cost: 8
    effects:
      - type: "variables"
        variables:
          movement_speed: 3
          dodge_chance: 2
      - type: "ea_attribute"
        ea_attributes:
          movement_speed: 3.0
          dodge_chance: 2.0

  # ---- 可选材料：回响碎片（魔法穿透）----
  - item_sources:
      - "minecraft-echo_shard"
    amount: 1
    optional: true
    capacity_cost: 15
    effects:
      - type: "variables"
        variables:
          magic_penetration: 6
          spell_crit_rate: 3
      - type: "ea_attribute"
        ea_attributes:
          magic_penetration: 6.0
          spell_crit_rate: 3.0

  # ---- 可选材料：下界之星（扩展容量，不占用容量）----
  - item_sources:
      - "minecraft-nether_star"
    amount: 1
    optional: true
    capacity_cost: 0
    effects:
      # capacity_bonus: 特殊效果类型，增加锻造容量上限
      - type: "capacity_bonus"
        value: 20

# ============================================================
# 可选材料数量限制
# ============================================================
# 单次锻造最多可以使用的可选材料种类数。
optional_material_limit: 3

# ============================================================
# 品质系统
# ============================================================
# 锻造结果会随机获得一个品质等级，影响最终属性。
# custom_pool: 自定义品质池（空列表使用全局默认品质池）
# guarantee: 保底机制（连续锻造一定次数后保证获得指定品质）
quality:
  enabled: true
  custom_pool: []
  guarantee:
    enabled: true
    attempts: 60
    minimum: "无暇"

# ============================================================
# 锻造结果
# ============================================================
# 定义锻造成功后产出的物品及其外观修改。
# item_sources: 结果物品的来源
# meta_actions: 对结果物品的名称和 Lore 修改
# actions: 锻造成功时执行的动作
result:
  item_sources:
    - "minecraft-diamond_sword"
  meta_actions:
    name_actions:
      - action: "replace"
        value: "<gold>烈焰锻剑</gold>"
    lore_actions:
      - action: "append"
        content:
          - "<gray>锻造属性:"
          - ""
          - "<dark_gray>由 {player} 锻造"
          - "<dark_gray>EmakiForge 示例配方"
  actions:
    - 'sendmessage text="<green>锻造成功! 获得了 {forge_result_item_name}</green>"'
    - "playsound sound=minecraft:block.anvil.use volume=1 pitch=1"

# ============================================================
# 锻造流程动作
# ============================================================
# pre: 锻造开始前执行的动作
# success: 锻造成功后执行的动作（在 result.actions 之后）
# failure: 锻造失败时执行的动作
actions:
  pre:
    - 'sendactionbar text="<gray>烈焰之力正在熔铸...</gray>"'
  success: []
  failure:
    - 'sendmessage text="<red>锻造前置操作失败: {forge_failure_reason}</red>"'
