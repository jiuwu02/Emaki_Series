# ============================================================
# EmakiForge 锻造配方示例
# ============================================================
# 材料效果累计，但 capacity_cost 总和受 forge_capacity 限制。
# 配方 ID 取自 id，与文件名无关。
# ============================================================

id: "example_recipe"

display_name: "<gold>烈焰之剑锻造配方</gold>"

# ============================================================
# 锻造容量
# ============================================================
# 所有材料的 capacity_cost 总和不能超过此值。
# 玩家需要在容量限制内选择材料组合。
forge_capacity: 35

# ============================================================
# 蓝图需求
# ============================================================
# 锻造前必须拥有的物品（不消耗，仅检测持有）。
# 用于实现"需要先获得配方图纸"的玩法。
# 判定由两个同级字段共同决定，两者是 AND 关系：
#   item_sources: 允许的物品源。省略表示不限来源。
#   matcher:      组件、PDC、Lore 等非物品源条件。省略表示不加额外条件。
# 两者都省略时该条目永不命中。
# ⚠ matcher 内禁止写物品源条件，物品源一律写在同级 item_sources。
# 可选的 id 字段决定计数身份：不写时按 item_sources 派生（稳定），
# 纯 matcher 条目则退化为按 matcher 内容派生的哈希键——改动 matcher 内容会让键漂移，
# 所以纯 matcher 条目建议显式写 id。
# ⚠ 写法差异（易错点）：
#   物品源简写用连字符：  "minecraft-enchanted_book"
#   组件 ID / path 里的资源 ID 用冒号： "minecraft:sharpness"
# ⚠ 判定顺序：同一物品按条目声明顺序取第一个匹配者，先声明的宽条件会
#   遮蔽后声明的窄条件。若要两条并存，务必把窄条件写在前面。
# 同一种图纸的多种可接受形态，写成多个 id 相同的条目：计数按 id 聚合，
# 玩家持有任一形态都算满足，不会被当成两种图纸要求同时持有。
blueprint_requirements:
  # 同一逻辑需求"配方图纸"的两种可接受形态，用相同 id 聚合计数：
  #   ① 带 custom_model_data 标记的知识书（"官方发放的配方图纸"），窄条件写在前
  #   ② 普通附魔书
  - id: blueprint_accepted
    item_sources:
      - "minecraft-knowledge_book"
    amount: 1
    matcher:
      type: component
      component: custom_model_data
      path: "floats[0]"
      operator: "=="
      value: 1.0

  - id: blueprint_accepted
    item_sources:
      - "minecraft-enchanted_book"
    amount: 1

# ============================================================
# 材料列表
# ============================================================
# 每种材料定义了:
#   item_sources: 材料物品来源
#   amount: 需要的数量
#   capacity_cost: 占用的锻造容量
#   optional: 是否为可选材料（默认 false）
#   effects: 此材料提供的效果列表
# effects 支持的类型:
#   - type: "variables"       → 表达式引擎变量（用于 Lore 占位符渲染）
#   - type: "ea_attribute"    → EmakiAttribute PDC 属性
#   - type: "es_skill"        → EmakiSkills 技能附加
#   - type: "name_action"     → 修改物品名称
#   - type: "lore_action"     → 修改物品 Lore
#   - type: "capacity_bonus"  → 扩展锻造容量（特殊类型）
# 材料判定由两个同级字段共同决定，两者是 AND 关系：
#   item_sources: 允许的物品源。省略表示不限来源。
#   matcher:      组件、PDC、Lore 等非物品源条件。省略表示不加额外条件。
# 两者都省略时该材料永不命中。
# ⚠ matcher 内禁止写物品源条件，物品源一律写在同级 item_sources。
# 三类身份职责分离：
#   material_id: 选择、GUI 与 lookup 的稳定身份。
#   count_key:   数量聚合与消费身份；不同 material_id 可以共享同一 count_key。
#   audit_id:    成品审计与刷新身份。
# 未声明时按 material_id、item_sources 或 matcher 摘要兼容派生；生产配置建议显式声明三者。
# ⚠ 写法差异（易错点）：
#   物品源简写用连字符：  "minecraft-iron_ingot"
#   组件 ID / path 里的资源 ID 用冒号： "minecraft:sharpness"
# ⚠ 判定顺序：同一物品按材料声明顺序取第一个匹配者，先声明的宽条件会
#   遮蔽后声明的窄条件。窄条件请写在前面。
materials:
  # ---- 基础材料：铁锭（提供物理属性）----
  - material_id: iron_base
    count_key: iron_base
    audit_id: iron_base
    item_sources:
      - "minecraft-iron_ingot"
    amount: 3
    capacity_cost: 5
    effects:
      - type: "variables"
        variables:
          physical_damage: 5
          max_health: 2
      - type: "ea_attribute"
        ea_attributes:
          physical_attack: 5.0
          max_health: 2.0
      - type: "lore_action"
        lore_actions:
          - action: "insert_below"
            anchor: "锻造属性:"
            content:
              - "<gray>物理伤害: <red>+%physical_damage%"
              - "<gray>生命值: <green>+%max_health%"

  # ---- 基础材料：烈焰粉（提供火焰属性 + 技能 + 名称修改）----
  - material_id: blaze_core
    count_key: blaze_core
    audit_id: blaze_core
    item_sources:
      - "minecraft-blaze_powder"
    amount: 1
    capacity_cost: 10
    effects:
      - type: "variables"
        variables:
          fire_damage: 10
          critical_chance: 5
      - type: "ea_attribute"
        ea_attributes:
          fire_damage: 10.0
          physical_crit_rate: 5.0
      # 附加技能
      - type: "es_skill"
        es_skills:
          - "flame_strike"
          - "flame_passive"
      # 修改物品名称
      - type: "name_action"
        name_actions:
          - action: "append_suffix"
            value: "<red> [烈焰]"
      - type: "lore_action"
        lore_actions:
          - action: "insert_below"
            anchor: "锻造属性:"
            content:
              - "<red>火焰伤害: +%fire_damage%"
              - "<yellow>暴击率: +%critical_chance%%"

  # ---- 可选材料：火焰弹（额外火焰属性）----
  - material_id: fire_charge_additive
    count_key: fire_charge_additive
    audit_id: fire_charge_additive
    item_sources:
      - "minecraft-fire_charge"
    amount: 1
    optional: true
    capacity_cost: 12
    effects:
      - type: "variables"
        variables:
          fire_damage: 12
          critical_chance: 4
      - type: "ea_attribute"
        ea_attributes:
          fire_damage: 12.0
          physical_crit_rate: 4.0
      - type: "lore_action"
        lore_actions:
          - action: "append"
            content:
              - "<red>火焰伤害: +%fire_damage%"
              - "<yellow>暴击率: +%critical_chance%%"

  # ---- 可选材料：羽毛（移动速度）----
  - material_id: feather_additive
    count_key: feather_additive
    audit_id: feather_additive
    item_sources:
      - "minecraft-feather"
    amount: 1
    optional: true
    capacity_cost: 8
    effects:
      - type: "variables"
        variables:
          movement_speed: 3
          dodge_chance: 2
      - type: "ea_attribute"
        ea_attributes:
          movement_speed: 3.0
          dodge_chance: 2.0

  # ---- 可选材料：回响碎片（魔法穿透）----
  - material_id: echo_additive
    count_key: echo_additive
    audit_id: echo_additive
    item_sources:
      - "minecraft-echo_shard"
    amount: 1
    optional: true
    capacity_cost: 15
    effects:
      - type: "variables"
        variables:
          magic_penetration: 6
          spell_crit_rate: 3
      - type: "ea_attribute"
        ea_attributes:
          magic_penetration: 6.0
          spell_crit_rate: 3.0

  # ---- 可选材料：下界之星（扩展容量，不占用容量）----
  - material_id: capacity_star
    count_key: capacity_star
    audit_id: capacity_star
    item_sources:
      - "minecraft-nether_star"
    amount: 1
    optional: true
    capacity_cost: 0
    effects:
      # capacity_bonus: 特殊效果类型，增加锻造容量上限
      - type: "capacity_bonus"
        value: 20

  # ---- matcher 示例①：任何"锋利 III 以上"的附魔物品 ----
  # 不限定物品源（不写 item_sources），只看组件取值：enchantments 组件下 minecraft:sharpness 的等级。
  # path 写附魔的资源 ID（冒号形式）；operator 支持 >= > <= < == != 等。
  # 这类材料显式写 material_id 固定身份，避免键随 matcher 内容漂移导致成品审计失配。
  - material_id: inherited_sharpness_source
    count_key: inherited_sharpness_source
    audit_id: inherited_sharpness_source
    matcher:
      type: component
      component: enchantments
      path: "minecraft:sharpness"
      operator: ">="
      value: 3
    amount: 1
    optional: true
    capacity_cost: 6
    effects:
      - type: "variables"
        variables:
          inherited_sharpness: 4
      - type: "ea_attribute"
        ea_attributes:
          physical_attack: 4.0

  # ---- matcher 示例②：三项品相条件满足任意两项即可 ----
  # at_least + required_count: 子条件里至少成立 required_count 条才算匹配。
  # 组合五态：all_of（全部成立）/ any_of（任一成立）/ none_of（全部不成立）
  #          / at_least（至少 N 条）/ exactly（恰好 N 条）。
  # 后两者需配合 required_count；子条件写在 matchers 列表里，可继续嵌套。
  # 这里同时演示三种不同的组件读取方式：
  #   rarity      → 枚举值，用 == 比较
  #   custom_name → 文本组件，用 contains 做子串匹配
  #   unbreakable → 单元组件（无值），只支持 exists / absent
  - material_id: masterwork_source
    count_key: masterwork_source
    audit_id: masterwork_source
    matcher:
      type: at_least
      required_count: 2
      matchers:
        - type: component
          component: rarity
          operator: "=="
          value: epic
        - type: component
          component: custom_name
          operator: contains
          value: "锻"
        - type: component
          component: unbreakable
          operator: exists
    amount: 1
    optional: true
    capacity_cost: 10
    effects:
      - type: "variables"
        variables:
          masterwork_bonus: 8
      - type: "ea_attribute"
        ea_attributes:
          physical_attack: 8.0
      - type: "name_action"
        name_actions:
          - action: "append_suffix"
            value: "<light_purple> [名匠]"

  # ---- 示例③：物品源 + 组件条件同时成立 ----
  # 顶层 item_sources 限定来源、matcher 追加组件条件，两者按 AND 同时成立才命中，
  # 用于把一类物品收窄为"官方发放的那一批"。
  # 注意两种写法的分隔符差异：item_sources 用连字符，component/path 用冒号。
  - material_id: marked_amethyst
    count_key: marked_amethyst
    audit_id: marked_amethyst
    item_sources:
      - minecraft-amethyst_shard
    matcher:
      type: component
      component: custom_model_data
      path: "floats[0]"
      operator: "=="
      value: 1.0
    amount: 1
    optional: true
    capacity_cost: 4
    effects:
      - type: "variables"
        variables:
          durability_bonus: 5
      - type: "ea_attribute"
        ea_attributes:
          max_health: 5.0

# ============================================================
# 可选材料数量限制
# ============================================================
# 单次锻造最多可以使用的可选材料种类数。
optional_material_limit: 3

# ============================================================
# 品质系统
# ============================================================
# 锻造结果会随机获得一个品质等级，影响最终属性。
# custom_pool: 自定义品质池（空列表使用全局默认品质池）
# guarantee: 保底机制（连续锻造一定次数后保证获得指定品质）
quality:
  enabled: true
  guarantee:
    enabled: true
    attempts: 60
    minimum: "无暇"

# ============================================================
# 锻造结果
# ============================================================
# 定义锻造成功后的结果分支，结构与 Cooking 配方的 result.<branch> 保持一致。
# success.outputs: 成功分支产物列表；Forge 当前使用第一项作为主产物
# success.name_actions: 对结果物品名称执行的动作链
# success.lore_actions: 对结果物品 Lore 执行的动作链
# success.actions: 锻造成功并生成结果后执行的动作
result:
  success:
    outputs:
      - item_source: "minecraft-iron_block"
        amount: 1
    name_actions:
      - action: "replace"
        value: "<gold>烈焰锻剑</gold>"
    lore_actions:
      - action: "append"
        content:
          - "<gray>锻造属性:"
          - ""
          - "<dark_gray>由 %player% 锻造"
          - "<dark_gray>EmakiForge 示例配方"
    actions:
      - 'send_message text="<green>锻造成功! 获得了 %var.forge_result_item_name%</green>"'
      - "play_sound sound=minecraft:block.anvil.use volume=1 pitch=1"

# ============================================================
# 锻造流程动作
# ============================================================
# pre: 锻造开始前执行的动作
# success: 锻造成功后执行的动作（在 result.success.actions 之后）
# failure: 锻造失败时执行的动作
actions:
  pre:
    - 'send_action_bar text="<gray>烈焰之力正在熔铸...</gray>"'
  failure:
    - 'send_message text="<red>锻造前置操作失败: %var.forge_failure_reason%</red>"'

# success_rate 默认 100；低于 100 时按概率失败。
# failure_outcomes 仅在失败时按权重选取；未配置时默认全额返还材料。
# 合法类型：return_materials、consume_materials、partial_consume、fixed_quality、
# byproduct、economy_penalty、downgrade_quality。
