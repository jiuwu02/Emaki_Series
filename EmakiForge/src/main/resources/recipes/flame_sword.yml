id: "flame_sword"

display_name: "<gold>烈焰之剑锻造配方</gold>"

forge_capacity: 35

blueprint_requirements:
  - item_sources:
      - "minecraft-enchanted_book"
    amount: 1

materials:
  - item_sources:
      - "minecraft-iron_ingot"
    amount: 3
    capacity_cost: 5
    effects:
      - type: "variables"
        variables:
          physical_damage: 5
          max_health: 2
      - type: "lore_action"
        lore_actions:
          - action: "append"
            content:
              - "<gray>物理伤害: <red>+{physical_damage}"
              - "<gray>生命值: <green>+{max_health}"

  - item_sources:
      - "minecraft-blaze_powder"
    amount: 1
    capacity_cost: 10
    effects:
      - type: "variables"
        variables:
          fire_damage: 10
          critical_chance: 5
      - type: "name_action"
        name_actions:
          - action: "append_suffix"
            value: "<red> [烈焰]"
      - type: "lore_action"
        lore_actions:
          - action: "append"
            content:
              - "<red>火焰伤害: +{fire_damage}"
              - "<yellow>暴击率: +{critical_chance}%"

  - item_sources:
      - "minecraft-fire_charge"
    amount: 1
    optional: true
    capacity_cost: 12
    effects:
      - type: "variables"
        variables:
          fire_damage: 12
          critical_chance: 4
      - type: "lore_action"
        lore_actions:
          - action: "append"
            content:
              - "<red>火焰伤害: +{fire_damage}"
              - "<yellow>暴击率: +{critical_chance}%"

  - item_sources:
      - "minecraft-feather"
    amount: 1
    optional: true
    capacity_cost: 8
    effects:
      - type: "variables"
        variables:
          movement_speed: 3
          dodge_chance: 2

  - item_sources:
      - "minecraft-echo_shard"
    amount: 1
    optional: true
    capacity_cost: 15
    effects:
      - type: "variables"
        variables:
          magic_penetration: 6
          spell_crit_rate: 3

  - item_sources:
      - "minecraft-nether_star"
    amount: 1
    optional: true
    capacity_cost: 0
    effects:
      - type: "capacity_bonus"
        value: 20

optional_material_limit: 3

condition_type: "all_of"

conditions: []

quality:
  enabled: true
  custom_pool: []
  guarantee:
    enabled: true
    attempts: 60
    minimum: "无暇"

result:
  item_sources:
    - "minecraft-diamond_sword"
  meta_actions:
    name_actions:
      - action: "replace"
        value: "<gold>烈焰锻剑</gold>"
    lore_actions:
      - action: "append"
        content:
          - "<gray>锻造属性:"
          - "<dark_gray>由 EmakiForge 示例配方锻造"
  actions:
    - 'sendmessage text="<green>锻造成功! 获得了 {forge_result_item_name}</green>"'
    - "playsound sound=minecraft:block.anvil.use volume=1 pitch=1"

actions:
  pre:
    - 'sendactionbar text="<gray>烈焰之力正在熔铸...</gray>"'
  success: []
  failure:
    - 'sendmessage text="<red>锻造前置操作失败: {forge_failure_reason}</red>"'
