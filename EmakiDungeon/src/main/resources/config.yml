# EmakiDungeon 主配置
#
# 控制副本实例, 组队, 命令拦截, 消息隔离与全局限流
# 重载不会中断运行中实例, 仅对新创建的副本生效
# 文件位置: plugins/EmakiDungeon/config.yml

version: "1.0.45"
language: "zh_CN"

# DEBUG 锚日志开关与审计保留天数 (按日切分)
debug:
  enabled: false
  retention-days: 30

# 全局并发实例世界上限 (含补位态世界)
limit:
  max-instances: 20

# 副本内命令管控: 白名单/黑名单模式与参数级规则列表
# 规则 = 命令根 + 参数模式, 玩家名统一写 player 占位
commands:
  mode: blacklist
  rules:
  #  - "/tpa player"
  #  - "/tpa accept"

# 逃逸命令黑名单 (支持通配符), 判定优先级最高, 不可被副本放行条目豁免
escape:
  blacklist:
  #  - "/tp *"
  #  - "/back"

# 队伍人数上限与默认邀请模式 (public / apply / invite)
party:
  max-size: 4
  invite-mode: public

# 组队招募板与本服自动匹配 (不做跨服)
matchmaking:
  enabled: true
  # 0 表示沿用 party.max-size; 有效值 2..party.max-size
  target-size: 0
  # 招募过期秒数, <= 0 表示不过期
  recruit-ttl-seconds: 300

# 断线重连宽限期 (秒): 0 表示关闭 (维持原有行为), 超期回归按孤儿快照恢复
recovery:
  reconnect-grace-seconds: 0

# 全局收听默认值 (每玩家可用 /edungeon globalchat 覆盖)
isolation:
  global-chat-default: false

# 次数限制的默认时区, 留空表示使用服务器时区
general:
  timezone: ""

# 个人奖励箱: 启用后副本产出进入奖励箱 (/edungeon rewards), 关闭则副本产出直接进入玩家背包
rewardbox:
  enabled: true

# GraalJS 脚本宿主: plugins/EmakiDungeon/scripts/<副本ID>.js 随实例启动自动装载, 实例销毁即释放
# timeout-ms 为单段脚本处理器超时上限 (毫秒), fail-on-error 为脚本异常停用时是否判定本局副本失败
script:
  enabled: true
  timeout-ms: 5000
  fail-on-error: false

# 运行期性能告警阈值: MSPT P95 (毫秒), 堆内存斜率 (MB/分钟), 写队列持续积压 (秒)
# 超阈值即控制台告警并写入审计日志, 该项阈值 <= 0 表示关闭该项监测
monitor:
  mspt-p95-ms: 55
  mspt-p95-enter-ms: 200
  memory-slope-mb-per-min: 64
  queue-backlog-seconds: 5

# 玩家数据持久化后端: file=本地文件 | database=共享数据库 (需 EmakiCoreLib database.yml 启用)
storage:
  backend: file

# Folia 挂起世界全局上限, 达限按满载拒绝新挑战并告警, 重启回收
folia:
  held-worlds-max: 10

# 副本生命周期 Action 管道 (经 CoreLib Action 段派发, 段 id 即键名)
# 支持: dungeon_enter, dungeon_exit, dungeon_room_clear, dungeon_gate_open,
# dungeon_wave_start, dungeon_score, dungeon_complete, dungeon_fail,
# dungeon_reward, dungeon_ending, dungeon_destroy
action:
  # dungeon_enter:
  #   - 'self | send_message text="<green>进入副本</green>"'
  # dungeon_fail:
  #   - 'self | send_message text="<red>门票已消耗 (原因: %var.reason%)</red>"'
  # dungeon_exit:
  #   - 'self | send_message text="<green>门票已原样退还: %var.ticket_refunded% (副本 %var.dungeon%)</green>"'

# ============================================================
# 随机地牢生成配置 (仅 type: random 副本使用)
# 本段不带独立 version: 配置指纹经 seed.persist-config-fingerprint 以 config_hash 形式随实例记录持久化。
# 加载期 schema 校验失败时整份拒绝并保留上一份合法配置, 错误逐字段输出到控制台。
# 旧版独立文件 random-dungeon.yml 已下线, 不再读取。
# ============================================================
random-dungeon:
  # 1. 结构模板注册视图(生成期参数)。模板结构字段(标签/门锚点/掩码/权重等)由采集命令落库在
  #    plugins/EmakiDungeon/world/<副本ID>/structures/<模板ID>.yml(+.nbt) 即该副本的模板库,
  #    此处只登记生成期权重与额度。
  #    weight: 第二阶段抽样权重, 0 表示不参与随机仍可被必选引用;
  #           显式登记时覆盖模板内权重(采集 GUI 结构页可设, 随模板落库), 未登记时取模板 weight(缺省 1)
  #    min-count/max-count: 数量区间, max-count 0 表示不限
  room-types: {}

  # 2. 房量区间: N = clamp(base + round((p - 1) * growth-per-player), min, max)
  #    硬约束: min 不小于全部必选规则 min-count 之和加 3
  room-count:
    base: 12
    min: 8
    max: 40
    growth-per-player: 2

  # 4. 标签必选规则(自定义标签, 无全局固定类别)
  #    min-count 至少 1; max-count 0 表示不限
  #    placement-rule: root | deepest | branch-percentile
  #    percentile: 分位带起点 50-70, 带宽 20 个百分点(仅 branch-percentile 生效)
  mandatory: {}

  # 5. 连接走廊规则
  #    link-mode: force(全走廊) | default(逐边 50%) | off(全直连, 高差非 0 候选非法)
  #    截面固定 1x3; slope 固定 1:1; overlap-policy 唯一值 reject
  #    含垂直段时水平投影上限 = length-max + 高差
  corridor:
    link-mode: default
    template-ref: ""
    width: 1
    height: 3
    length-min: 2
    length-max: 8
    max-turns: 1
    slope: 1
    max-height-diff: 8
    overlap-policy: reject
    floor-block: stone

  # 6. 朝向规则: 与模板级 rotations/mirrorable 取交集, 合法集合内均匀选取
  orientation:
    rotations: [0, 90, 180, 270]
    mirror-axis: none
    selection: uniform

  # 7. 藏宝图: enabled 且 granularity=room 时 room-count.max 必须不大于 64
  #    target-icons: 自定义标签 -> 内置图标键(star/skull/chest/flag/dot/gate/stairs/ring), 未映射标签不显示目标图标
  treasure-map:
    enabled: true
    granularity: room
    pixels-per-room: 2
    update-interval-ticks: 5
    show-unexplored-outline: true
    floor-markers: true
    target-icons: {}

  # 8. 种子策略: source auto | fixed | replay
  #    replay 须提供目标实例记录标识, config_hash 不一致拒绝并报差异字段
  #    persist-config-fingerprint 固定 true, 配 false 非法
  seed:
    source: auto
    fixed-value: 0
    persist-config-fingerprint: true

  # 9. 随机实例世界: 启动随机副本时新建实例世界的生成类型 (air=空岛/normal=主世界/nether=下界/end=末地)
  #    编辑世界与普通副本实例不看此项, 始终跟随原始地图自身的生成设置
  world:
    type: air
    prewarm-radius-chunks: 2
    simulation-distance: 6

  # 10. 编辑器(模板采集)
  editor:
    max-template-bytes: 4194304
    allow-entity-capture: false
    overwrite-policy: reject

  # 11. 性能上限: blocks-per-tick 与既有实例写队列预算一致
  limits:
    blocks-per-tick: 8192
    compute-budget-ms: 50
    build-budget-ticks: 300
    max-template-blocks: 2000000
    max-layout-backtracks: 1000
    concurrent-instances: 4
