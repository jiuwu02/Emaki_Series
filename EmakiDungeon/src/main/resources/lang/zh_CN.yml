    <gray>========== </gray><gradient:#1E3A8A:#8B5CF6>EmakiDungeon 命令</gradient><gray> ==========</gray>
    <gray>/edg help</gray> <white>查看命令帮助</white>
    <gray>/edg list</gray> <white>查看副本列表</white>
    <gray>/edg enter <副本ID></gray> <white>进入副本 (组队时由队长发起)</white>
    <gray>/edg leave</gray> <white>退出当前副本</white>
