# EmakiDungeon 简体中文语言资源
# 消息使用 MiniMessage; 保留消息分组旁标明的占位符
# version 由资源同步流程维护, 用于合并新增默认键

version: "1.0.0"

general:
  prefix: "<gray>[ <gradient:#93C5FD:#60A5FA>EmakiDungeon</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此命令</red>"
  player_only: "<red>此命令只能由玩家执行</red>"
  invalid_args: "<red>参数错误</red>"
  unknown_command: "<red>未知命令, 请使用 /edg help 查看帮助</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>配置已重载</green>"

command:
  help: |
    <gray>========== </gray><gradient:#93C5FD:#60A5FA>EmakiDungeon 命令</gradient><gray> ==========</gray>
    <gray>/edg help</gray> <white>查看命令帮助</white>
    <gray>/edg list</gray> <white>查看副本列表</white>
    <gray>/edg enter <副本ID></gray> <white>进入副本 (组队时由队长发起)</white>
    <gray>/edg leave</gray> <white>退出当前副本</white>
    <gray>/edg cancel</gray> <white>取消进入等待</white>
    <gray>/edg ready</gray> <white>确认准备</white>
    <gray>/edg party <create|invite|accept|deny|kick|leave|disband|chat></gray> <white>组队操作</white>
    <gray>/edg stats [玩家] [副本ID]</gray> <white>查询次数与成绩</white>
    <gray>/edg rank <副本ID></gray> <white>查看排行榜</white>
    <gray>/edg globalchat <on|off></gray> <white>切换全局消息收听</white>
    <gray>/edg editor <副本ID></gray> <white>打开地图内编辑器</white>
    <gray>/edg admin <instances|stop|status|reload|validate|poolreset|clearslots></gray> <white>管理命令</white>
  unknown: "<red>未知子命令: <command>, 请使用 /edg help</red>"
  list:
    empty: "<yellow>暂无可用副本</yellow>"
    header: "<gray>可用副本:</gray>"
    entry: "<gray>- </gray><white><dungeon></white>"
  enter:
    usage: "<red>用法: /edg enter <副本ID></red>"
  leave:
    no_instance: "<red>你当前不在副本实例中</red>"
    confirm_hint: "<yellow>输入 确认 退出本次副本, 输入 取消 放弃</yellow>"
    aborted: "<gray>已取消退出</gray>"
  party:
    usage: "<red>用法: /edg party <create|invite|accept|deny|kick|leave|disband|chat></red>"
  denied_escape: "<red>该命令在本副本受限 (逃逸黑名单): <command></red>"
  denied_mode: "<red>该命令在本副本受限 (命令管控): <command></red>"

challenge:
