    sidebar: "Entering wait: <dungeon>"
  enter:
    dungeon_missing: "<red>Dungeon does not exist or config is invalid: <dungeon></red>"
    no_dungeon_permission: "<red>You lack permission to enter dungeon <dungeon></red>"
    party_error: "<red>Failed to create party: <code></red>"
    not_leader: "<red>Only the leader can start a challenge</red>"
    already_started: "<yellow>Your party already has a challenge in progress</yellow>"
    party_busy: "<yellow>Your party already has an active dungeon challenge</yellow>"
    invalid_difficulty: "<red>Invalid difficulty: <difficulty></red>"
    invalid_mode: "<red>Invalid drop mode: <mode></red>"
    party_missing: "<red>Party data missing, challenge cancelled</red>"
    member_offline: "<red>A party member is offline, cannot start the challenge</red>"
    dungeon_full: "<yellow>Dungeon is full right now, retry after existing parties finish</yellow>"
    full: "<yellow>Dungeon is full (pool or global limit reached), retry after existing parties finish</yellow>"
    cooldown: "<yellow><player> is still on entry cooldown, <seconds>s remaining</yellow>"
    daily_limit: "<yellow><player> has used up entry attempts, wait for the period reset (<seconds>s)</yellow>"
    weekly_limit: "<yellow><player> has used up this week's challenge attempts, resets in <seconds>s</yellow>"
    monthly_limit: "<yellow><player> has used up this month's challenge attempts, resets in <seconds>s</yellow>"
    daily_window: "<red>Outside the daily challenge window, retry in <seconds>s</red>"
    weekly_day: "<red>Today is not an allowed challenge weekday, retry in <seconds>s</red>"
    monthly_week: "<red>Current week of the month is not an allowed challenge week, retry in <seconds>s</red>"
  cancel:
    no_session: "<yellow>No active challenge to cancel</yellow>"
  ready:
    no_session: "<yellow>No active challenge to confirm</yellow>"

gui:
  difficulty:
    title: "Select Difficulty"
    name: "<white>Difficulty: <option></white>"
    lore: "<gray>Click to pick this difficulty</gray>"
  mode:
    title: "Select Drop Mode"
