# EmakiDungeon English language resource
# Messages use MiniMessage; keep the placeholders noted next to each group
# version is maintained by the resource sync flow for merging new default keys

version: "1.0.0"

general:
  prefix: "<gray>[ <gradient:#93C5FD:#60A5FA>EmakiDungeon</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to run this command</red>"
  player_only: "<red>This command can only be executed by a player</red>"
  invalid_args: "<red>Invalid arguments</red>"
  unknown_command: "<red>Unknown command, use /edg help for help</red>"
  reloading: "<gray>Reloading configuration...</gray>"
  reload_success: "<green>Configuration reloaded</green>"

command:
  help: |
    <gray>========== </gray><gradient:#93C5FD:#60A5FA>EmakiDungeon Commands</gradient><gray> ==========</gray>
    <gray>/edg help</gray> <white>Show command help</white>
    <gray>/edg list</gray> <white>List dungeons</white>
    <gray>/edg enter <dungeonId></gray> <white>Enter a dungeon (party leader starts a challenge)</white>
    <gray>/edg leave</gray> <white>Leave the current dungeon</white>
    <gray>/edg cancel</gray> <white>Cancel entering wait</white>
    <gray>/edg ready</gray> <white>Confirm ready</white>
    <gray>/edg party <create|invite|accept|deny|kick|leave|disband|chat></gray> <white>Party actions</white>
    <gray>/edg stats [player] [dungeonId]</gray> <white>Query limits and records</white>
    <gray>/edg rank <dungeonId></gray> <white>Show leaderboard</white>
    <gray>/edg globalchat <on|off></gray> <white>Toggle global chat listening</white>
    <gray>/edg editor <dungeonId></gray> <white>Open the in-world editor</white>
    <gray>/edg admin <instances|stop|status|reload|validate|poolreset|clearslots></gray> <white>Admin commands</white>
  unknown: "<red>Unknown subcommand: <command>, use /edg help</red>"
  list:
    empty: "<yellow>No dungeons available</yellow>"
    header: "<gray>Available dungeons:</gray>"
    entry: "<gray>- </gray><white><dungeon></white>"
  enter:
    usage: "<red>Usage: /edg enter <dungeonId></red>"
  leave:
    no_instance: "<red>You are not inside a dungeon instance</red>"
    confirm_hint: "<yellow>Type confirm to leave this dungeon, or cancel to stay</yellow>"
    aborted: "<gray>Leave cancelled</gray>"
  party:
    usage: "<red>Usage: /edg party <create|invite|accept|deny|kick|leave|disband|chat></red>"
  stats:
    header: "<gray>Dungeon stats for <player>:</gray>"
    entry: "<gray>- <dungeon>: </gray><limits>"
    limit_daily: "<gray>Daily: </gray><white><used>/<total></white>"
    limit_weekly: "<gray>Weekly: </gray><white><used>/<total></white>"
    limit_monthly: "<gray>Monthly: </gray><white><used>/<total></white>"
    limit_cooldown: "<gray>Cooldown: </gray><white><seconds>s</white>"
    no_limits: "<white>No entry limits</white>"
    best: "<gray>  Best: </gray><white><score></white> <gray>| time </gray><white><duration></white>"
  rank:
    usage: "<red>Usage: /edg rank <dungeonId></red>"
    empty: "<yellow>No leaderboard records yet for <dungeon></yellow>"
    header: "<gray>Leaderboard for <dungeon> (top 10):</gray>"
    entry: "<gold>#<place></gold> <white><score></white> <gray>pts | </gray><white><duration></white> <gray>| </gray><yellow><difficulty></yellow> <gray>| </gray><white><members></white>"
  globalchat:
    usage: "<red>Usage: /edg globalchat <on|off></red>"
  denied_escape: "<red>This command is restricted in this dungeon (escape blacklist): <command></red>"
  denied_mode: "<red>This command is restricted in this dungeon (command rules): <command></red>"

challenge:
  entered: "<green>Entered dungeon <dungeon> (<instance>)</green>"
  preparing: "<yellow>Prepare confirmation started, run /edg ready or click the confirm button (within <seconds>s)</yellow>"
  preparing_expired: "<red>Prepare confirmation timed out, challenge cancelled</red>"
  member_ready: "<gray><player> is ready (<ready>/<total>)</gray>"
  cancelled: "<yellow>Challenge cancelled (reason: <reason>)</yellow>"
  wait:
    bossbar: "Preparing dungeon world: <dungeon> (any member may cancel with /edg cancel)"
    chat: "<yellow>Preparing dungeon world: <dungeon>, any member may cancel with /edg cancel, wait timeout auto-cancels</yellow>"
    sidebar: "Entering wait: <dungeon>"
  enter:
    dungeon_missing: "<red>Dungeon does not exist or config is invalid: <dungeon></red>"
    no_dungeon_permission: "<red>You lack permission to enter dungeon <dungeon></red>"
    party_error: "<red>Failed to create party: <code></red>"
    not_leader: "<red>Only the leader can start a challenge</red>"
    already_started: "<yellow>Your party already has a challenge in progress</yellow>"
    party_busy: "<yellow>Your party already has an active dungeon challenge</yellow>"
    invalid_difficulty: "<red>Invalid difficulty: <difficulty></red>"
    invalid_mode: "<red>Invalid drop mode: <mode></red>"
    party_missing: "<red>Party data missing, challenge cancelled</red>"
    member_offline: "<red>A party member is offline, cannot start the challenge</red>"
    dungeon_full: "<yellow>Dungeon is full right now, retry after existing parties finish</yellow>"
    full: "<yellow>Dungeon is full (pool or global limit reached), retry after existing parties finish</yellow>"
    cooldown: "<yellow><player> is still on entry cooldown, <seconds>s remaining</yellow>"
    daily_limit: "<yellow><player> has used up entry attempts, wait for the period reset</yellow>"
  cancel:
    no_session: "<yellow>No active challenge to cancel</yellow>"

gui:
  difficulty:
    title: "Select Difficulty"
    name: "<white>Difficulty: <option></white>"
    lore: "<gray>Click to pick this difficulty</gray>"
  mode:
    title: "Select Drop Mode"
    name: "<white>Drop mode: <option></white>"
    lore: "<gray>Click to pick this mode</gray>"
  confirm:
    title: "Prepare Confirmation"
    name: "<green>Click to ready up</green>"
    lore: "<gray>Click to confirm entering the dungeon</gray>"
  wait:
    title: "Entering Wait"
    cancel_name: "<red>Cancel Entry</red>"
    cancel_lore: "<gray>Click to cancel this challenge</gray>"

party:
  chat_format: "<gradient:#93C5FD:#60A5FA>[Party]</gradient> <gold><player></gold>: <white><message></white>"
  invite_sent: "<yellow>Invited <player> to the party</yellow>"
  invite_received: "<yellow><player> invited you to a party, /edg party accept to join, /edg party deny to refuse</yellow>"
  apply_received: "<yellow><player> asked to join your party, /edg party accept to approve, /edg party deny to refuse</yellow>"
  apply_denied: "<yellow><player> declined your join request</yellow>"
  kicked: "<red>You were removed from the party by <player></red>"
  leader_transferred: "<yellow>Leadership transferred to <player></yellow>"
  member_joined: "<green><player> joined the party</green>"
  chat_enabled: "<green>Party channel enabled, your messages are visible to the party only</green>"
  chat_disabled: "<yellow>Party channel disabled</yellow>"
  result:
    already_in_party: "<red>You are already in a party</red>"
    target_in_party: "<red>The target player is already in another party</red>"
    target_busy: "<red>The target player is in a dungeon challenge</red>"
    party_full: "<red>The party is full</red>"
    not_leader: "<red>Only the leader can do this</red>"
    not_in_party: "<red>You are not in a party</red>"
    mode_denied: "<red>Invite mode is invite-only, you must be invited first</red>"
    invalid_target: "<red>Target player is offline or invalid: <player></red>"
    busy_party: "<yellow>Your party is in a dungeon challenge, new members are not accepted</yellow>"

recovery:
  reconnected: "<green>Reconnected, returned to dungeon instance (<instance>)</green>"
  orphan_restored: "<yellow>Instance has ended, restored inventory and state from the entry snapshot and returned you to your origin</yellow>"
  exited: "<green>Left the dungeon and restored your state (<instance>)</green>"
  evacuated: "<yellow>Dungeon ended, restored from snapshot and returned you to your origin</yellow>"

snapshot:
  missing: "<red>Snapshot missing, cannot restore (<instance>)</red>"

guard:
  teleport_blocked: "<red>Teleporting out of this world is not allowed inside a dungeon</red>"
  boundary_pullback: "<yellow>You crossed the dungeon boundary, pulled back to spawn</yellow>"

globalchat:
  enabled: "<green>Global chat listening enabled, messages reach inside and outside the dungeon</green>"
  disabled: "<yellow>Global chat listening disabled, messages stay inside the instance</yellow>"

drop:
  chest_locked: "<red>This reward chest must be opened before settlement, loot cannot be taken now</red>"
  roll:
    won: "<green>ROLL won: <white><item></white> x<amount></green>"
    distributed: "<gray>This drop batch was auto-rolled (<count> items)</gray>"

settle:
  partial: "<yellow>Settlement partially completed, some rewards may be missing, audited</yellow>"

flow:
  option:
    prompt: "<yellow>Pick an option: </yellow><gray>%options%</gray><yellow> (type a number or id)</yellow>"
    expired: "<yellow>Selection timed out, nothing chosen</yellow>"
    invalid: "<red>Invalid selection</red>"
  spectator:
    entered: "<yellow>No respawn charges left, switched to spectator mode</yellow>"
  fail:
    returned: "<red>Dungeon failed (%reason%), returned to your origin</red>"
  temp_item:
    full: "<yellow>Inventory full, some temp items (<item>) could not be granted</yellow>"
  timer:
    warning: "<yellow><seconds> seconds remaining</yellow>"

player:
  died: "<red>%player% died, respawn charges left: %remaining%</red>"

console:
  plugin_starting: "EmakiDungeon is starting"
  plugin_stopped: "EmakiDungeon has stopped"
  world_create_failed: "Instance world creation failed | dungeon=%dungeon% | world=%world%, retrying in 30s"
  world_dispose_held: "Instance world unload or delete failed, held for cleanup on restart | dungeon=%dungeon% | world=%world%"
  instances_load_failed: "Failed to load instances.yml, startup residual scan skipped | error=%error%"
  residual_delete_failed: "Startup scan failed to delete residual directory | world=%world%"
  residual_cleaned: "Startup scan cleaned residual worlds | count=%count%"
  active_world_missing: "Running instance lost its world handle, scheduled for disposal | dungeon=%dungeon% | world=%world%"
  pool_reserve_invalidated: "Reserve world failed inspection and will be rebuilt from template | dungeon=%dungeon% | world=%world%"
  dungeon_config_invalid: "Invalid dungeon config, skipped | dungeon=%dungeon% | error=%error%"
  world_command_deferred: "World command dual-limit deferral | world=%world% | total=%count%"
  parties_load_failed: "Failed to load parties.yml, party snapshots not restored | error=%error%"
  command_map_wrap_failed: "CommandMap wrap failed, plugin-dispatch interception entry inactive | error=%error%"
  action_corelib_unavailable: "CoreLib Action API unavailable, segment registration skipped"
  action_dispatch_failed: "Action segment dispatch failed | segment=%segment% | error=%error%"
  instance_crashed: "Instance loop crashed | instance=%instance% | error=%error%"
  flow_file_failed: "Failed to create flow YAML | dungeon=%dungeon% | error=%error%"
  flow_load_failed: "Failed to load flow YAML, empty definition used | instance=%instance% | error=%error%"

debug:
  instance_created: "Instance created | world=%instance%"
  instance_destroyed: "Instance destroyed | world=%instance% | trigger=%trigger%"
  pool_reserve: "Pool reserve | dungeon=%dungeon% | active=%active%"
  player_entered: "Player entered instance | player=%player% -> world=%instance%"
  party_created: "Party created | party=%party%"
  party_invite_sent: "Party invite sent | party=%party% | target=%target%"
  party_apply_sent: "Party join apply sent | party=%party% | target=%target%"
  party_join: "Player joined party | party=%party% | player=%player%"
  party_leave: "Player left party | party=%party% | player=%player%"
  challenge_opened: "Challenge opened | dungeon=%dungeon% | party=%party%"
  challenge_start: "Difficulty and mode picked | dungeon=%dungeon% | difficulty=%difficulty% | mode=%mode%"
  ready_all: "All members ready | dungeon=%dungeon% | party=%party%"
  instance_full: "Dungeon full, denied | dungeon=%dungeon%"
  instance_assigned: "Reserve world assigned | world=%instance% | dungeon=%dungeon%"
  command_denied: "Command denied | command=%command% | source=%source%"
  snapshot_repacked: "Snapshot repacked | instance=%instance%"
  reconnected_instance: "Reconnected into instance | instance=%instance%"
  orphan_restored: "Orphan snapshot restored | instance=%instance%"
  exit_restored: "Exit restored | instance=%instance% | reason=%reason%"
  temp_item_granted: "Temp item granted | instance=%instance% | item=%item% | amount=%amount%"
  temp_item_removed: "Temp item removed | instance=%instance% | items=%items%"
  player_died: "Player died | player=%player% | instance=%instance% | remaining=%remaining%"
  limit_recorded: "Entry attempt recorded | dungeon=%dungeon% | day_bucket=%day%"
  limit_denied: "Entry limit denied | dungeon=%dungeon% | member=%member% | verdict=%verdict%"
  settle_step_failed: "Settlement step failed | command=%command% | error=%error% | instance=%instance%"
  settle_step_skipped: "Settlement step skipped | command=%command% | player=%player% | instance=%instance%"
