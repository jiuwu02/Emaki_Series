# EmakiDungeon 副本默认配置模板
#
# 重载时复制到各副本世界文件夹生成 config.yml (已存在不覆盖), 承载副本元数据与副本级规则
# 不提供 schema 版本兼容, 加载期按当前结构严格校验
# 文件位置: plugins/EmakiDungeon/world/<副本ID>/config.yml

version: "1.0.0"
language: "zh_CN"

# 副本元数据
display-name: "示例副本"
description: "一份用于演示的线性副本配置"
difficulty-group: "default"

# 副本类型: normal=常规副本, random=随机生成地牢 (区域采集与 /edungeon random create 仅该类型可用)
# 未知类型在加载期告警并静默回退 normal
type: normal

# 实例内常驻 HUD (默认关闭; channel 仅 bossbar / scoreboard, 非法值静默回退 bossbar)
hud:
  enabled: false
  channel: bossbar

# 进入与失败判定
enter:
  timeout-seconds: 1800
  prepare-window-seconds: 10
  wait-channel: bossbar
  wait-timeout-seconds: 60

# 前置解锁: 以 CoreLib 条件行列表为唯一判定源, entries 空 = 不限制
# 布尔判定示例: "%emakidungeon_data_<dungeonId>_cleared% == true"
unlock:
  type: all_of
  required_count: 0
  invalid_as_failure: true
  entries: []
  on_fail:
    message: ""

# 入场门票: enabled=false 不消耗; item 支持原版 Material 名或 EmakiItem id;
# 系统侧失败(世界准备超时/实例创建失败/插件异常)原样退还, 玩家侧失败不退还
ticket:
  enabled: false
  item: ""
  amount: 1

# 该副本实例世界占用上限 (含补位态世界), 达上限提示等待重试
pool:
  max-worlds: 5
  warm-reserves: 2

# 挑战限制: 日历门 + 三层次数串联, 判定顺序 月 > 周 > 日, 任一层不满足或耗尽即不可进入
# count 为 0 表示该层次数不限; days 取 1-7 (1=周一 ... 7=周日); weeks 取 1-6 (当月第几周, 周一起始)
# time-window 格式 "HH:mm-HH:mm", 支持跨午夜, 留空表示全天
# 示例: 每月第 3 周的周五/周六/周日 15:00-17:00 可挑战, 每日 2 次:
#  limits:
#    daily:
#      count: 2
#      time-window: "15:00-17:00"
#    weekly:
#      count: 0
#      days: [5, 6, 7]
#    monthly:
#      count: 0
#      weeks: [3]
#    cooldown-seconds: 0
limits:
  daily:
    count: 1
    time-window: ""
  weekly:
    count: 0
    days: []
  monthly:
    count: 0
    weeks: []
  cooldown-seconds: 0

# 副本实例的仿真距离与实体上限, 各实例世界独立生效
world:
  simulation-distance: 6
  entity-limit: 0

# 难度动态调整三项: 怪物属性倍率, 掉落数量倍率, 玩家剩余重生次数
difficulty:
  normal:
    mob-multiplier: 1.0
    drop-multiplier: 1.0
    respawn-count: 3
  hard:
    mob-multiplier: 1.5
    drop-multiplier: 1.2
    respawn-count: 1

# 贡献评分权重与满分 (time-weight 为 0 时关闭时间维度; >0 且 target-time-seconds >0 时生效)
# 时间评分 = time-weight * min(1, target-time-seconds / 实际用时秒数), 复用结算已算出的 durationMs
score:
  damage-weight: 1.0
  kill-weight: 1.0
  heal-weight: 1.0
  death-weight: 1.0
  defense-weight: 1.0
  time-weight: 0.0
  target-time-seconds: 0.0
  max: 100.0

# 掉落等级定义与队长可选分配模式 (五种: free / roll / killer / score / share)
# drop.levels 仅在评分贡献模式下参与分配权重
drop:
  levels:
    common: 1
    rare: 3
    epic: 5
  default-mode: free
  mode-allowed:
    - free
    - roll
    - killer
    - score
    - share

# 副本级命令放行条目 (语法同全局 commands.rules): 可豁免常规模式判定, 不可豁免逃逸黑名单
commands:
  allow:
  #  - "/home"

# 交互白名单: 容器与漏斗行为, 漏斗默认关闭
interaction:
  containers: true
  hoppers: false

# 倒计时档位秒数, 触发 CoreLib 发送消息 Action
timer:
  messages:
    - 300
    - 60
    - 10

# 命令链结算步骤, 可引用 EmakiItem/EmakiLevel
settlement:
  commands:
  #  - "eitem give %player% reward_key 1"

# 榜单条数上限与超限淘汰
leaderboard:
  max-entries: 100

# ============================================================
# 随机地牢生成配置 (仅 type: random 的副本生效)
#
# 该段随副本下放, 每个副本在它自己的 config.yml 里独立配置随机生成参数。
# 插件顶层 config.yml 不再承载随机段, 副本之间互不影响。
# 本段不带独立 version: 配置指纹经 seed.persist-config-fingerprint 以 config_hash 形式随实例记录持久化。
# 加载期 schema 校验失败时该副本的随机生成被拒绝并在控制台报出字段, 其他副本不受影响。
# ============================================================
random:
  # 1. 结构模板注册视图(生成期参数)。模板结构字段(标签/门锚点/掩码/权重等)由采集命令落库在
  #    plugins/EmakiDungeon/world/<副本ID>/structures/<模板ID>.yml(+.nbt) 即本副本的模板库,
  #    此处只登记生成期权重与额度。
  #    weight: 第二阶段抽样权重, 0 表示不参与随机仍可被必选引用;
  #           显式登记时覆盖模板内权重(采集 GUI 结构页可设, 随模板落库), 未登记时取模板 weight(缺省 1)
  #    min-count/max-count: 数量区间, max-count 0 表示不限; min-count 是主动保证(分配阶段先占座)
  #    只有 structure-type: room 的模板参与房间抽样, 走廊模板登记在此也不会被抽成房间
  #    示例: 强制 room_2 出现且只出现一次
  #      room_2:
  #        min-count: 1
  #        max-count: 1
  room-types: {}

  # 2. 房量区间: N = clamp(base + round((p - 1) * growth-per-player), min, max)
  #    硬约束: min 不小于全部必选规则 min-count 之和加 3
  room-count:
    base: 12
    min: 8
    max: 40
    growth-per-player: 2

  # 4. 标签必选规则(自定义标签, 无全局固定类别)
  #    min-count 至少 1; max-count 0 表示不限
  #    placement-rule: root | deepest | branch-percentile
  #    percentile: 分位带起点 50-70, 带宽 20 个百分点(仅 branch-percentile 生效)
  mandatory: {}

  # 5. 连接走廊规则
  #    link-mode 决定房间与房间之间用什么方式相连:
  #      force   —— 必须走走廊, 房间贴边直连一律判非法; 该方向连不出走廊就不产生这条连接
  #      default —— 走廊与贴边直连都参与候选, 由搜索按权重选择
  #      off     —— 只允许贴边直连, 走廊一律不生成
  #    同层的门与门恒为零高差: 走廊不会随机抬升, 同层房间的地板与门洞绝对齐平。
  #    高度差只来自模板自身的门锚点 Y 位置 (例如自行制作的双层走廊, 两层门 Y 不同),
  #    此时由门的 vertical-delta / floor-delta 显式声明, 引擎不做随机化。
  #    template-ref: 指向 structure-type=corridor 的模板时, 走廊段强制使用该模板并逐段平铺;
  #                  留空则由 corridor-types 按权重抽样 (见第 5b 节), 无候选时回退程序化地板
  #    tile-gap: 相邻模板段之间留空块数 0-8
  #    走廊截面宽高不在这里声明: 门锚点的宽高在采集期由框选实测得出, 走廊截面直接跟随
  #    所用门的宽高, 因此 1x1、2x1 等不同尺寸的门可以同时存在, 各自生成对应截面的走廊。
  #    slope 固定 1:1; overlap-policy 唯一值 reject
  #    含垂直段时水平投影上限 = length-max + 高差
  corridor:
    link-mode: default
    template-ref: ""
    length-min: 2
    length-max: 8
    max-turns: 1
    slope: 1
    max-height-diff: 8
    overlap-policy: reject
    floor-block: stone
    tile-gap: 0

  # 5b. 走廊模板登记(生成期权重)
  #     与 room-types 同构; 走廊按权重抽样, 支持多个走廊模板共存。
  #     未在此登记的走廊模板按其自带 weight 参与抽样; weight 为 0 时不参与随机。
  #     走廊模板的采集方式与房间相同 (structure-type: corridor), 模块节点同样参与生成。
  #     若 corridor.template-ref 非空, 则以该模板为准, 本节不生效。
  #     示例:
  #       corridor-types:
  #         corridor_1:
  #           weight: 2
  #         corridor_2:
  #           weight: 1
  corridor-types: {}

  # 6. 朝向规则: 模板级 rotatable/mirrorable 与全局两层 AND
  #    rotatable: 全局旋转开关, false 时全部模板只保留原始朝向
  #    mirror-axis: none | x, 仅 x 时模板级 mirrorable=true 才产生镜像变体
  orientation:
    rotatable: true
    mirror-axis: none

  # 7. 拓扑形状
  #    生成路径只有一条: 三维约束拼接 (见第 8 节)。房间的连接关系由实际拼出来的几何决定,
  #    不再先定死拓扑形状再往格子里填房间, 因此不存在"树/链需要多少度"的硬性要求。
  #    style: constraint(默认) | branch | chain | mixed
  #      branch / chain / mixed 是旧树状拓扑引擎的取值, 已下线; 填这些值会在加载期归一化为
  #      constraint 并照常生成, 不会拒绝既有配置, 也不再有任何树/链形状语义。
  #    chain-chance: 已弃用, 仅为保持配置指纹稳定而保留, 不再影响生成
  #    max-loops-percent: 环路数上限占房量的百分比 0-100; 0 关闭环路
  topology:
    style: constraint
    chain-chance: 50
    max-loops-percent: 15

  # 8. 三维约束生成 (始终生效)
  #    mode: floors(明确楼层) | free(自由三维生长)
  #      floors —— 尽量覆盖多个楼层; 但完全服从模板池: 池里没有任何 up/down 竖门锚点时,
  #                可达楼层自动收敛为 1 层, 不会为一个永远够不到的楼层空转搜索
  #    floor-count: 楼层总数 1-16 (受模板池实际竖向能力约束)
  #    floor-spacing: 程序楼梯单次抬升的步数 3-128 (不再用于划分楼层; 楼层由门锚点的 Y 位置推导)
  #    floor-max-slope: 同层允许的最大高差 0..floor-spacing-1
  #    template-connections: 是否允许两块模板直接以门对接(含 up/down 竖门上下叠接)
  #    procedural-connections: 是否允许在门之间程序生成走廊与楼梯
  #    跨层连接一律由普通房间/走廊模板的 up/down 竖门或 floor-delta 声明驱动,
  #    不再有专门的 structure-type: transition 过渡结构 (该类型已下线, 旧模板加载时会被跳过并告警)
  #    loop-chance / vertical-chance: 环路与竖向扩展概率 0-100
  #    horizontal-margin / vertical-margin: 非连接面的间隔距离
  #    max-search-states: 搜索状态上限, 触及即明确失败, 防止坏模板池无限搜索
  spatial:
    mode: floors
    floor-count: 3
    floor-spacing: 12
    floor-max-slope: 2
    template-connections: true
    procedural-connections: true
    loop-chance: 20
    vertical-chance: 30
    horizontal-margin: 1
    vertical-margin: 1
    max-search-states: 50000

  # 9. 藏宝图: enabled 且 granularity=room 时 room-count.max 必须不大于 64
  #    target-icons: 自定义标签 -> 内置图标键(star/skull/chest/flag/dot/gate/stairs/ring), 未映射标签不显示目标图标
  treasure-map:
    enabled: true
    granularity: room
    pixels-per-room: 2
    update-interval-ticks: 5
    show-unexplored-outline: true
    floor-markers: true
    target-icons: {}

  # 10. 种子策略: source auto | fixed | replay
  #    replay 须提供目标实例记录标识, config_hash 不一致拒绝并报差异字段
  #    persist-config-fingerprint 固定 true, 配 false 非法
  seed:
    source: auto
    fixed-value: 0
    persist-config-fingerprint: true

  # 11. 随机实例世界: 启动随机副本时新建实例世界的生成类型 (air=空岛/normal=主世界/nether=下界/end=末地)
  #    编辑世界与普通副本实例不看此项, 始终跟随原始地图自身的生成设置
  world:
    type: air
    prewarm-radius-chunks: 2
    simulation-distance: 6

  # 12. 编辑器(模板采集)
  editor:
    max-template-bytes: 4194304
    allow-entity-capture: false
    overwrite-policy: reject

  # 13. 性能上限: blocks-per-tick 与既有实例写队列预算一致
  #     compute-budget-ms: 三维约束拼接的搜索预算; 50ms 在 12 房量下会频繁触发 budget 早退,
  #     默认取 500ms。搜索失败只影响本次生成, 不影响服务器主线程 (搜索在异步线程内做)。
  limits:
    blocks-per-tick: 8192
    compute-budget-ms: 500
    build-budget-ticks: 300
    max-template-blocks: 2000000
    max-layout-backtracks: 1000
    concurrent-instances: 4
