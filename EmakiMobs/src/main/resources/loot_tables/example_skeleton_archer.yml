# ============================================================
# EmakiMobs 掉落表示例 - 骷髅弓手
# 演示：多掉落池、权重、set_count / looting_enchant 函数、
#       chance 概率过滤与 EmakiItem 物品集成。
# mob_id 必须与 mobs/example_skeleton_archer.yml 的 id 完全一致。
# ============================================================
mob_id: example_skeleton_archer

pools:
  # 主材料池：每次死亡抽 2 次，按权重选条目
  main:
    rolls: 2
    entries:
      bone:
        item: "minecraft:bone"
        weight: 10
        functions:
          count:
            type: set_count
            count:
              min: 1
              max: 3
          looting:
            type: looting_enchant
            count:
              min: 0
              max: 1
      arrow:
        item: "minecraft:arrow"
        weight: 8
        functions:
          count:
            type: set_count
            count:
              min: 2
              max: 6
          looting:
            type: looting_enchant
            count:
              min: 0
              max: 2

  # 装备池：概率掉落原版装备
  equipment:
    rolls: 1
    entries:
      bow:
        item: "minecraft:bow"
        weight: 1
        chance: 0.10
      chainmail_helmet:
        item: "minecraft:chainmail_helmet"
        weight: 1
        chance: 0.05

  # EmakiItem 物品必须写在 emaki_item 键下；没装 EmakiItem 时整条跳过
  emaki:
    rolls: 1
    entries:
      example_ring:
        emaki_item: "example_ring"
        weight: 3
        chance: 0.03
      example_charm:
        emaki_item: "example_charm"
        weight: 2
        chance: 0.02
