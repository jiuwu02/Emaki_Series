# ============================================================
#  精英僵尸掉落表
#  mob_id 必须与对应生物定义的 id 字段完全一致
# ============================================================
mob_id: elite_zombie

pools:
  # 主掉落池：普通材料
  main:
    rolls: 1          # 每次死亡在本池中随机抽取 1 次
    entries:
      rotten_flesh:
        item: "minecraft:rotten_flesh"
        weight: 10    # 权重越高，抽到概率越大
        functions:
          count:
            type: set_count
            count:
              min: 2
              max: 5
          looting:
            type: looting_enchant
            count:
              min: 0
              max: 1

      iron_nugget:
        item: "minecraft:iron_nugget"
        weight: 6
        functions:
          count:
            type: set_count
            count:
              min: 2
              max: 4

      iron_ingot:
        item: "minecraft:iron_ingot"
        weight: 2
        functions:
          count:
            type: set_count
            count:
              min: 1
              max: 2

  # 稀有掉落池：精英装备（概率过滤）
  rare:
    rolls: 1
    entries:
      iron_sword:
        item: "minecraft:iron_sword"
        weight: 1
        # chance: 在此条目被选中的前提下，额外的概率过滤（0.0~1.0）
        chance: 0.15
        functions:
          count:
            type: set_count
            count:
              min: 1
              max: 1

  # EmakiItem 集成示例（需安装 EmakiItem 并定义对应物品 ID）
  # emakiitem_drop:
