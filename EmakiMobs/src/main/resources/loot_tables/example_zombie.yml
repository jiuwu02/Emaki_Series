# EmakiMobs 掉落表示例 - 示例精英僵尸
# mob_id 必须与对应生物定义的 id 字段完全一致。

mob_id: example_zombie

pools:
  main:
    rolls: 1
    entries:
      rotten_flesh:
        item: "minecraft-rotten_flesh"
        weight: 10
        functions:
          count:
            type: set_count
            count:
              min: 1
              max: 3
          looting:
            type: looting_enchant
            count:
              min: 0
              max: 1
      iron_nugget:
        item: "minecraft-iron_nugget"
        weight: 3
        chance: 0.25
        functions:
          count:
            type: set_count
            count:
              min: 1
              max: 2
