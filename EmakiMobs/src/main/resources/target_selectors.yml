selectors:
  highest_threat:
    mode: highest
    score:
      - type: threat

  nearest:
    mode: lowest
    score:
      - type: distance

  lowest_health:
    mode: lowest
    score:
      - type: health

  first_blood:
    mode: first_damager

  gear_hunter:
    range: 24
    mode: highest
    filter:
      - "%player_health% > 4"
    score:
      - type: equipment
        table: vanilla_tiers
        factor: 1.0
      - type: threat
        factor: 0.5

  the_wealthy:
    range: 32
    mode: highest
    score:
      - type: expression
        value: "%vault_eco_balance% / 1000"
      - type: expression
        value: "%emakiattribute_attribute_power% / 100"
