# 分数快照的基础调度间隔（tick）。在线玩家超过单轮上限时，单个玩家的实际刷新周期会按批次数增加。
# 设为 0 表示关闭快照：equipment、expression 与 health 恒为 0，配置了 filter 的选择器没有合格候选。
snapshot_interval_ticks: 20

# 每轮最多派发多少名在线玩家到其 owner 线程重算；超出的玩家顺延到后续轮次。
# 完整刷新一轮的打分求值次数 = 在线玩家数 ×（被引用的装备表数 + 去重后的表达式数）。
# 每个配置了 filter 的选择器还会为每名玩家额外求值一次条件块。
snapshot_players_per_tick: 20

equipment_tables:
