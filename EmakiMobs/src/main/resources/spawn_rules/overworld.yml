# ============================================================
#  主世界刷新规则 — 覆盖所有六种刷新类型的完整示例
# ============================================================
rules:
  # ── natural：拦截原版 CreatureSpawnEvent ─────────────────
  # 当原版尝试在满足条件的位置刷新生物时，以一定概率替换为自定义生物。
  - mob_id: elite_zombie
    type: natural
    biomes:
      - plains
      - forest
      - dark_forest
      - meadow
    y_range: [-64, 50] # 只在此 Y 范围内生效
    light_level_max: 7 # 光照等级不超过此值才触发
    replacement_chance: 0.08 # 8% 概率将原版生物替换为精英僵尸
    max_nearby: 3 # 32 格内同 id 生物不超过此数量；0 = 不限
    count:
      min: 1
      max: 1

  # ── structure：结构内定时刷新 ────────────────────────────
  # 在玩家进入指定结构附近时，按 active_spawn 定时补充生物。
  # structures 列表使用 NamespacedKey 格式（minecraft:xxx）。
  - mob_id: bone_lord
    type: structure
    structures:
      - minecraft:stronghold # 要塞
    max_nearby: 1 # 同一结构内最多存在 1 只骨骼领主
    active_spawn:
      interval_ticks: 6000 # 每 5 分钟（6000t）检查一次
      require_player_nearby: 64 # 64 格内必须有玩家才触发
    count:
      min: 1
      max: 1

  # ── biome：定时扫描 + 生物群系过滤 ──────────────────────
  # 每隔 interval_ticks tick 为每名在线玩家在附近寻找地表位置，
  # 若位置属于指定生物群系且满足 conditions，则尝试刷新。
  - mob_id: jungle_stalker
    type: biome
    biomes:
      - jungle
      - bamboo_jungle
      - sparse_jungle
    interval_ticks: 600 # 每 30 秒（600t）尝试一次
    distance:
      min: 16 # 距玩家最近刷新距离（格）
      max: 48
    conditions:
      light_max: 7 # 光照不超过 7
      require_surface: false # 是否要求地表（有天空访问权限）
    max_nearby: 2
    count:
      min: 1
      max: 2

  # ── player_relative：跟随玩家定时刷新 ───────────────────
  # 每隔 interval_ticks tick，在每名玩家附近随机地点刷新。
  # 适合稀有的"伴随玩家"类生物，如精英巡逻兵。
  # （此条已注释，解除注释并配置自定义 mob_id 后可用）
  # - mob_id: elite_zombie
  #   type: player_relative
  #   distance:
  #     min: 24
  #     max: 64
  #   require_sky_access: false   # 是否要求刷新点可见天空
  #   max_global: 10              # 全服最多同时存在此数量；0 = 不限
  #   interval_ticks: 12000       # 每 10 分钟（12000t）尝试一次
  #   count:
  #     min: 1
  #     max: 1

  # ── day_interval：游戏日计时刷新 ────────────────────────
  # 每隔 interval_days 个游戏日，在玩家附近刷新一次。
  # 适合周期性 Boss 或稀有事件，如"第七天"机制。
  # （此条已注释，解除注释并配置自定义 mob_id 后可用）
  # - mob_id: bone_lord
  #   type: day_interval
  #   interval_days: 3            # 每 3 个游戏日触发一次
  #   on_day_start: true          # true = 天亮时触发；false = 任意时间
  #   distance_from_player:
  #     min: 20
  #     max: 50
  #   max_global: 2               # 全服最多同时存在 2 只
  #   count:
  #     min: 1
  #     max: 1

  # ── custom：自定义定时刷新（最灵活） ────────────────────
  # 定时为玩家附近随机地点刷新，可叠加生物群系过滤。
  # 适合特定地区的巡逻小队、资源守卫等场景。
  # （此条已注释，解除注释并配置自定义 mob_id 后可用）
  # - mob_id: elite_zombie
  #   type: custom
  #   interval_ticks: 1200        # 每 60 秒（1200t）尝试一次
  #   distance:
  #     min: 16
  #     max: 64
  #   biomes:                     # 留空列表则不限生物群系
  #     - plains
  #   max_nearby: 4
  #   count:
  #     min: 1
  #     max: 2
