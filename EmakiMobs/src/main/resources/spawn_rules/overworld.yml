# ============================================================
# 主世界刷新规则；当前加载器仅接受 natural 与 autonomous。
# 其他 type 会记录为未知并跳过。
# ============================================================
rules:
  # natural 拦截满足条件的 CreatureSpawnEvent，并按概率替换为自定义生物。
  - mob_id: elite_zombie
    type: natural
    biomes:
      - plains
      - forest
      - dark_forest
      - meadow
    y_range: # 只在此 Y 范围内生效
      - -64
      - 50
    light_level_max: 7 # 光照等级不超过此值才触发
    replacement_chance: 0.08 # 8% 概率将原版生物替换为精英僵尸
    max_nearby: 3 # 32 格内同 id 生物不超过此数量；0 = 不限
    count:
      min: 1
      max: 1

  - mob_id: bone_lord
    type: structure
    structures:
      - minecraft:stronghold # 要塞
    max_nearby: 1 # 同一结构内最多存在 1 只骨骼领主
    active_spawn:
      interval_ticks: 6000 # 每 5 分钟（6000t）检查一次
      require_player_nearby: 64 # 64 格内必须有玩家才触发
    count:
      min: 1
      max: 1

  - mob_id: jungle_stalker
    type: biome
    biomes:
      - jungle
      - bamboo_jungle
      - sparse_jungle
    interval_ticks: 600 # 每 30 秒（600t）尝试一次
    distance:
      min: 16 # 距玩家最近刷新距离（格）
      max: 48
    conditions:
      light_max: 7 # 光照不超过 7
      require_surface: false # 是否要求地表（有天空访问权限）
    max_nearby: 2
    count:
      min: 1
      max: 2
