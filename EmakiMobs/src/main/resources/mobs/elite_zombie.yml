# ============================================================
# 精英僵尸 — 完整特性示例
# 演示：自定义属性、EA 属性集成、技能触发器、
#        威胁仇恨表、Boss 血条、自定义掉落表
# ============================================================
id: elite_zombie
type: zombie
display_name: "<gradient:#ff4444:#ffaa00>精英僵尸</gradient>"

# ── 基础组件 ────────────────────────────────────────────────
# 直接映射到 Minecraft 实体属性/组件。
# ComponentMapper 支持 max_health / movement_speed / attack_damage /
# follow_range / knockback_resistance / armor / armor_toughness /
# custom_name / custom_name_visible / persistent / loot_table 等字段。
components:
  max_health: 80.0
  movement_speed: 0.28
  attack_damage: 7.0
  follow_range: 40.0
  knockback_resistance: 0.3
  armor: 4.0
  custom_name: "<gradient:#ff4444:#ffaa00>精英僵尸</gradient>"
  custom_name_visible: true
  persistent: true
  # loot_table 值格式：<namespace>:entities/<mob_id>
  # 对应 plugins/EmakiMobs/loot_tables/elite_zombie.yml
  loot_table: "emakimobs:entities/elite_zombie"

# 击杀该生物获得的原版经验值
experience: 80

# ── EmakiAttribute 集成（可选）──────────────────────────────
# 需要安装 EmakiAttribute 插件方可生效。
# 键名与 EmakiAttribute 中定义的属性 ID 完全一致。
# 注意：health / mana 一类 RESOURCE 型属性对非玩家实体无效，
# 想抬高怪物血量上限请用下方 components.max_health 或 EA 的 max_health_vanilla。
ea_attributes:
  STR: 15
  VIT: 10
  AGI: 5

# ── 动作触发器（可选）──────────────────────────────────────
# 由 EmakiCoreLib 的动作管道执行，不需要安装 EmakiSkills。
# 每个触发器对应一组 CoreLib 动作管道字符串（Action Pipeline）。
#
# 可用触发器：
#   on_spawn       — 生物刷出时（在 MobFactory 中立即执行）
#   on_death       — 生物死亡时；context: killer（击杀者，可为 null）
#   on_target      — 锁定新目标时；context: target
#   on_damage_give — 对目标造成伤害时；context: target, damage
#   on_damage_take — 受到伤害时；context: attacker（可为 null）, damage
#   on_kill        — 击杀实体时；context: victim
#   on_shoot       — 射出弹射物时
#   on_explode     — 爆炸时（Creeper 等）
#   on_teleport    — 传送时
#   on_transform   — 变形时（如僵尸猪灵转化）
#
# 动作字符串格式：[选择器 |] 动作名 [参数=值 ...]
actions:
  on_spawn:
    - "nearby radius=20 type=player | send_message text='<red>⚠ <bold>精英僵尸</bold>降临！'"
  on_death:
    - "nearby radius=50 type=player | send_message text='<green>✦ 精英僵尸已被击败！'"
    - "killer | give_exp amount=80"
  on_damage_give:
    - "target | apply_effect type=SLOWNESS duration=60 amplifier=0"
  on_damage_take:
    - "self | particle type=FLAME count=10 offset_x=0 offset_y=1 offset_z=0"

# ── 威胁仇恨表 ──────────────────────────────────────────────
# 启用后，生物会优先攻击威胁值最高的玩家，而非距离最近的玩家。
# 移除本节或设 enabled: false 可关闭。
threat:
  enabled: true
  max_range: 48.0 # 超出此范围则不计入威胁
  weights:
    damage: 1.0 # 每点伤害产生的威胁值
    healing: 0.5 # 治疗队友每点产生的威胁值（奶妈仇恨）
  decay:
    rate: 0.05 # 每秒威胁自然衰减比例（0.05 = 5%/s）
    out_of_range: true # 玩家离开 max_range 后立即清空其威胁值

# ── Boss 血条 ────────────────────────────────────────────────
# 在 range 范围内的所有玩家界面顶部显示该生物的血量。
# 移除本节可关闭 Boss 血条。
# color:  RED / GREEN / BLUE / YELLOW / PURPLE / PINK / WHITE
# style:  SOLID / SEGMENTED_6/10/12/20 / NOTCHED_6/10/12/20
boss_bar:
  title: "<gradient:#ff4444:#ffaa00>精英僵尸</gradient>"
  color: RED
  style: NOTCHED_10
  range: 60.0
