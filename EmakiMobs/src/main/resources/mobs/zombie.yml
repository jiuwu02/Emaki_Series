# ============================================================
# 类型覆写示例 — 强化原版僵尸
# 当 id 与原版 EntityType 名称完全相同时（此处均为 zombie），
# TypeOverrideApplicator 会监听 CreatureSpawnEvent，对所有
# 自然刷新的该类型生物自动应用本配置的 components 和 ea_attributes。
# ⚠ 注意：type_override 会影响服务器上 所有 自然刷新的僵尸，
#    包括其他插件或 vanilla 刷新的僵尸。请在确认后再启用。
#    如果只需要特定刷新点的自定义生物，使用独立 id 并配合
#    spawn_rules/ 中的 natural 类型规则代替。
# ============================================================
id: zombie # 与 type 同名 → 自动激活 type_override
type: zombie
display_name: "强化僵尸"

# 小幅提升原版僵尸的属性（不修改太多以维持游戏平衡）
components:
  max_health: 22.0
  movement_speed: 0.27
  attack_damage: 3.5

experience: 8
# 不覆写 loot_table，保留原版掉落逻辑
