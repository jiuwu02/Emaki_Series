  reload_complete: "<green>重载完成，共 <white>%count%</white> 个生物定义。</green>"

loader:
  lang_directory_create_failed: "无法创建语言目录: %path%"
  bundled_language_load_failed: "读取内置语言文件失败: %error%"
  bundled_resource_missing: "内置资源缺失: %resource%，无法写入 %path%"
  directory_create_failed: "无法创建 %type% 目录: %path%"
  invalid_blank_id: "%type% ID 为空: %file%"
