# EmakiMobs 简体中文语言资源。
# 消息支持 MiniMessage；修改后通过插件的 reload 命令应用。
# version 由资源同步流程维护，用于合并新增默认键。

version: "1.0.4"

general:
  prefix: "<gray>[ <gradient:#86EFAC:#34D399>EmakiMobs</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此命令。</red>"
  player_only: "<red>此命令只能由玩家执行。</red>"
  player_not_found: "<red>未找到目标玩家。</red>"
  invalid_args: "<red>参数错误。</red>"
  unknown_command: "<red>未知命令，请使用 /emakimobs help 查看帮助。</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>配置已重载。</green>"

console:
  plugin_starting: "<gray>正在启动...</gray>"
  plugin_started: "<green>启动完成</green>"
  plugin_stopped: "<yellow>已关闭</yellow>"
  bootstrap_start: "<gray>正在同步默认资源...</gray>"
  bootstrap_complete: "默认资源同步完成。"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "已按配置跳过默认数据释放。"
  default_file_missing: "内置资源不存在: %path%"
  bootstrap_copy_failed: "复制默认资源失败: %path% (%error%)"
  bootstrap_save_failed: "保存版本化资源失败: %path% (%error%)"
  directory_create_failed: "创建目录失败: %path%"
  mobs_loaded: "<gray>已加载 <yellow>%count%</yellow> 个生物定义</gray>"
  reload_complete: "<green>重载完成，共 <white>%count%</white> 个生物定义。</green>"
  custom_actions_registered: "<gray>已向 CoreLib 注册 <yellow>%registered%</yellow>/<yellow>%expected%</yellow> 个自定义动作组件。</gray>"
  custom_action_registration_failed: "<yellow>注册 CoreLib %kind% <white>%id%</white> 失败：<red>%reason%</red></yellow>"
  custom_action_rebuild_hook_failed: "<yellow>无法安装 CoreLib 动作重建回调；CoreLib 重载后自定义动作可能不可用。</yellow>"

loader:
  lang_directory_create_failed: "无法创建语言目录: %path%"
  bundled_language_load_failed: "读取内置语言文件失败: %error%"
  bundled_resource_missing: "内置资源缺失: %resource%，无法写入 %path%"
  directory_create_failed: "无法创建 %type% 目录: %path%"
  invalid_blank_id: "%type% ID 为空: %file%"
  duplicate_id: "重复的 %type% ID %id%，来源 %file%"
  load_failed: "读取 %type% 文件失败: %file% (%error%)"
  invalid_config: "%type% 配置无效: %file%"
  type:
    mob: "生物"
    loot_table: "战利品表"
    spawn_rule: "生成规则"

command:
  spawn_success: "<green>已在目标位置生成 <white>%mob_id%</white>。</green>"
  spawn_unknown: "<red>未知生物 ID：<white>%mob_id%</white></red>"
  spawn_no_target: "<red>无法确定生成位置，请指定在线玩家。</red>"
  reload_success: "<green>重载完成，共 <white>%count%</white> 个生物定义。</green>"
  usage: "<gray>用法：/emakimobs spawn <id> [玩家] | reload</gray>"
  no_permission: "<red>你没有权限执行此命令。</red>"

# Debug 模式消息
