# EmakiMobs 简体中文语言资源。
# 消息支持 MiniMessage；修改后通过插件的 reload 命令应用。
# version 由资源同步流程维护，用于合并新增默认键。

version: "1.0.8"

general:
  prefix: "<gray>[ <gradient:#86EFAC:#34D399>EmakiMobs</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此命令。</red>"
  player_only: "<red>此命令只能由玩家执行。</red>"
  player_not_found: "<red>未找到目标玩家。</red>"
  invalid_args: "<red>参数错误。</red>"
  unknown_command: "<red>未知命令，请使用 /emakimobs help 查看帮助。</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>配置已重载。</green>"

console:
  plugin_starting: "<gray>正在启动...</gray>"
  plugin_started: "<green>启动完成</green>"
  plugin_stopped: "<yellow>已关闭</yellow>"
  bootstrap_start: "<gray>正在同步默认资源...</gray>"
  bootstrap_complete: "默认资源同步完成。"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "已按配置跳过默认数据释放。"
  default_file_missing: "内置资源不存在: %path%"
  bootstrap_copy_failed: "复制默认资源失败: %path% (%error%)"
  bootstrap_save_failed: "保存版本化资源失败: %path% (%error%)"
  directory_create_failed: "创建目录失败: %path%"
  mobs_loaded: "<gray>已加载 <yellow>%count%</yellow> 个生物定义</gray>"
  reload_complete: "<green>重载完成，共 <white>%count%</white> 个生物定义。</green>"
  custom_actions_registered: "<gray>已向 CoreLib 注册 <yellow>%registered%</yellow>/<yellow>%expected%</yellow> 个自定义动作组件。</gray>"
  custom_action_registration_failed: "<yellow>注册 CoreLib %kind% <white>%id%</white> 失败：<red>%reason%</red></yellow>"
  custom_action_rebuild_hook_failed: "<yellow>无法安装 CoreLib 动作重建回调；CoreLib 重载后自定义动作可能不可用。</yellow>"
  config_precheck_passed: "<gray>配置预检通过：<yellow>%issues%</yellow> 个提示。</gray>"
  config_precheck_failed: "<red>配置预检失败：<yellow>%issues%</yellow> 个问题。</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray>（%hint%）</dark_gray>"
    messages:
      passed: "EmakiMobs 配置预检通过。"
      required_file_missing: "缺少必需文件。"
      path_not_file: "指定路径不是文件。"
      file_not_readable: "文件不可读。"
      required_directory_missing: "缺少必需目录。"
      path_not_directory: "指定路径不是目录。"
      directory_not_readable: "目录不可读。"
      mobs_max_health_stacking: "生物 %mob_id% 同时配置了 components.max_health 与 ea_attributes.max_health_vanilla，两者叠加，最终上限为二者之和。"

loader:
  lang_directory_create_failed: "无法创建语言目录: %path%"
  bundled_language_load_failed: "读取内置语言文件失败: %error%"
  bundled_resource_missing: "内置资源缺失: %resource%，无法写入 %path%"
  directory_create_failed: "无法创建 %type% 目录: %path%"
  invalid_blank_id: "%type% ID 为空: %file%"
  duplicate_id: "重复的 %type% ID %id%，来源 %file%"
  load_failed: "读取 %type% 文件失败: %file% (%error%)"
  invalid_config: "%type% 配置无效: %file%"
  unknown_entity_type: "未知的实体类型 %type%: %file%"
  deprecated_key: "%file% 仍在使用旧键 %old_key%，请改为 %new_key%（旧键将在下一个大版本移除）"
  type:
    mob: "生物"
    loot_table: "战利品表"
    spawn_rule: "生成规则"

command:
  spawn_success: "<green>已在目标位置生成 <white>%mob_id%</white>。</green>"
  spawn_no_target: "<red>无法确定生成位置，请指定在线玩家。</red>"
  spawn_usage: "<gray>用法：/emakimobs spawn <mob_id> [玩家]</gray>"
  reload_success: "<green>重载完成，共 <white>%count%</white> 个生物定义。</green>"
  list_header: "<gray>生物定义 <white>%page%</white>/<white>%pages%</white> 页，共 <white>%count%</white> 个：</gray>"
  list_entry: "<dark_gray>-</dark_gray> <white>%mob_id%</white> <gray>(%entity_type%)</gray>"
  list_empty: "<yellow>当前没有已加载的生物定义。</yellow>"
  list_page_out_of_range: "<red>页码 %page% 超出范围，当前共 %pages% 页。</red>"
  invalid_page: "<red>无效页码：<white>%page%</white>。页码必须从 1 开始。</red>"
  info_usage: "<gray>用法：/emakimobs info <mob_id></gray>"
  info_result: "<gray><white>%mob_id%</white>：类型=%entity_type%，组件=%components%，EA 属性=%attributes%，技能触发器=%triggers%，掉落表=%loot_table%</gray>"
  value_yes: "是"
  value_no: "否"
  count_success: "<green>受管生物 <white>%mob_id%</white> 当前数量：<white>%count%</white>。</green>"
  kill_usage: "<gray>用法：/emakimobs kill <mob_id> [半径]</gray>"
  kill_success: "<green>已移除 <white>%count%</white> 个 <white>%mob_id%</white> 受管生物。</green>"
  kill_radius_player_only: "<red>指定半径时必须由玩家执行，半径中心为执行者位置。</red>"
  invalid_radius: "<red>无效半径：<white>%radius%</white>。半径必须是非负有限数字。</red>"
  unknown_mob: "<red>未知生物 ID：<white>%mob_id%</white></red>"
  debug_unavailable: "<red>DEBUG 控制器当前不可用。</red>"
  operation_failed: "<red>命令操作 %operation% 执行失败，请查看服务器日志。</red>"
  usage: "<gray>用法：/emakimobs <spawn|reload|list|info|kill|count|debug> ...</gray>"
  no_permission: "<red>你没有权限执行此命令。</red>"

# Debug 模式消息
