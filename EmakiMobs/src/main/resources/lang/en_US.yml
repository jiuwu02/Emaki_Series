# EmakiMobs English language resource.
# Messages use MiniMessage; preserve placeholders documented beside message groups.
# version is maintained by resource synchronization when default keys are merged.

version: "1.0.10"

general:
  prefix: "<gray>[ <gradient:#86EFAC:#34D399>EmakiMobs</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to run this command.</red>"
  player_only: "<red>This command can only be used by a player.</red>"
  player_not_found: "<red>Player not found.</red>"
  invalid_args: "<red>Invalid arguments.</red>"
  unknown_command: "<red>Unknown command. Use /emakimobs help for help.</red>"
  reloading: "<gray>Reloading configuration...</gray>"
  reload_success: "<green>Configuration reloaded.</green>"

console:
  plugin_starting: "<gray>Starting...</gray>"
  plugin_started: "<green>Started</green>"
  plugin_stopped: "<yellow>Stopped</yellow>"
  bootstrap_start: "<gray>Syncing default resources...</gray>"
  bootstrap_complete: "Default resource sync complete."
  versioned_file_updated: "<green>Auto-updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "Default data release skipped by configuration."
  default_file_missing: "Bundled resource not found: %path%"
  bootstrap_copy_failed: "Failed to copy default resource: %path% (%error%)"
  bootstrap_save_failed: "Failed to save versioned resource: %path% (%error%)"
  directory_create_failed: "Failed to create directory: %path%"
  mobs_loaded: "<gray>Loaded <yellow>%count%</yellow> mob definition(s)</gray>"
  reload_complete: "<green>Reload complete with <white>%count%</white> mob definition(s).</green>"
  custom_actions_registered: "<gray>Registered <yellow>%registered%</yellow>/<yellow>%expected%</yellow> custom action component(s) with CoreLib.</gray>"
  custom_action_registration_failed: "<yellow>Failed to register CoreLib %kind% <white>%id%</white>: <red>%reason%</red></yellow>"
  custom_action_rebuild_hook_failed: "<yellow>Could not install the CoreLib action rebuild callback; custom actions may be unavailable after a CoreLib reload.</yellow>"
  config_precheck_passed: "<gray>Config precheck passed: <yellow>%issues%</yellow> note(s).</gray>"
  config_precheck_failed: "<red>Config precheck failed: <yellow>%issues%</yellow> problem(s).</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "FATAL"
      error: "ERROR"
      warn: "WARN"
      info: "INFO"
    hint: " <dark_gray>(%hint%)</dark_gray>"
    messages:
      passed: "EmakiMobs config precheck passed."
      required_file_missing: "Required file is missing."
      path_not_file: "Path is not a file."
      file_not_readable: "File is not readable."
      required_directory_missing: "Required directory is missing."
      path_not_directory: "Path is not a directory."
      directory_not_readable: "Directory is not readable."
      mobs_max_health_stacking: "Mob %mob_id% configures both components.max_health and ea_attributes.max_health_vanilla; they stack, so the final cap is their sum."

loader:
  lang_directory_create_failed: "Failed to create language directory: %path%"
  bundled_language_load_failed: "Failed to read bundled language file: %error%"
  bundled_resource_missing: "Bundled resource missing: %resource%, cannot write to %path%"
  directory_create_failed: "Failed to create %type% directory: %path%"
  invalid_blank_id: "%type% ID is blank: %file%"
  duplicate_id: "Duplicate %type% ID %id% from %file%"
  load_failed: "Failed to read %type% file: %file% (%error%)"
  invalid_config: "Invalid %type% configuration: %file%"
  unknown_entity_type: "Unknown entity type %type%: %file%"
  deprecated_key: "%file% still uses the legacy key %old_key%; rename it to %new_key% (the legacy key will be removed in the next major version)"
  target_selectors_load_failed: "Failed to read target selector file %file%: %error%"
  target_selectors_section_missing: "Target selector file %file% is missing the selectors section"
  target_selector_invalid_slot: "Equipment weight table %table% contains invalid slot %slot%; skipped"
  target_selector_invalid_item: "Equipment weight table %table% contains unavailable item %item%; skipped"
  target_selector_invalid_mode: "Target selector %selector% contains invalid mode %mode%; skipped"
  target_selector_invalid_score: "Target selector %selector% contains invalid score type %type%; skipped"
  target_selector_unknown_table: "Target selector %selector% references missing equipment weight table %table%; skipped"
  target_selector_invalid_expression: "Target selector %selector% contains invalid expression %expression%; skipped"
  type:
    mob: "mob"
    loot_table: "loot table"
    spawn_rule: "spawn rule"

command:
  spawn_success: "<green>Spawned <white>%mob_id%</white> at target location.</green>"
  spawn_no_target: "<red>Could not determine a spawn location. Please specify an online player.</red>"
  spawn_usage: "<gray>Usage: /emakimobs spawn <mob_id> [player]</gray>"
  reload_success: "<green>Reloaded with <white>%count%</white> mob definition(s).</green>"
  list_header: "<gray>Mob definitions page <white>%page%</white>/<white>%pages%</white>, <white>%count%</white> total:</gray>"
  list_entry: "<dark_gray>-</dark_gray> <white>%mob_id%</white> <gray>(%entity_type%)</gray>"
  list_empty: "<yellow>No mob definitions are currently loaded.</yellow>"
  list_page_out_of_range: "<red>Page %page% is out of range; there are %pages% page(s).</red>"
  invalid_page: "<red>Invalid page: <white>%page%</white>. Pages start at 1.</red>"
  info_usage: "<gray>Usage: /emakimobs info <mob_id></gray>"
  info_result: "<gray><white>%mob_id%</white>: type=%entity_type%, components=%components%, EA attributes=%attributes%, skill triggers=%triggers%, loot table=%loot_table%</gray>"
  value_yes: "yes"
  value_no: "no"
  count_success: "<green>Managed mob <white>%mob_id%</white> count: <white>%count%</white>.</green>"
  kill_usage: "<gray>Usage: /emakimobs kill <mob_id> [radius]</gray>"
  kill_success: "<green>Removed <white>%count%</white> managed <white>%mob_id%</white> mob(s).</green>"
  kill_radius_player_only: "<red>A radius requires a player sender and is centered on that player.</red>"
  invalid_radius: "<red>Invalid radius: <white>%radius%</white>. Use a finite non-negative number.</red>"
  unknown_mob: "<red>Unknown mob ID: <white>%mob_id%</white></red>"
  debug_unavailable: "<red>The debug controller is currently unavailable.</red>"
  operation_failed: "<red>Command operation %operation% failed. Check the server log.</red>"
  usage: "<gray>Usage: /emakimobs <spawn|reload|list|info|kill|count|debug> ...</gray>"
  no_permission: "<red>You do not have permission to run this command.</red>"

debug:
  target_selector_expression_failed: "Target selector expression %expression_id% failed: %error%"
