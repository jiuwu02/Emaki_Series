  help_entry_help: "- <hover:show_text:'<gray>help</gray> <dark_gray>·</dark_gray> <gray>Show this help page</gray>'><gray>help</gray></hover> <click:run_command:'%root% help'><green>[ ✦ Run ]</green></click>"
  help_entry_spawn: "- <hover:show_text:'<gray>spawn</gray> <dark_gray>·</dark_gray> <gray>Spawn a managed mob of one definition</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakimobs.spawn</white><newline><dark_gray>▸</dark_gray> <gray>Argument [mob ID] required, click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [player] optional, defaults to yourself, online players are Tab completed</gray>'><gray>spawn</gray></hover> <click:run_command:'%root% help spawn'><yellow>[ ✦ Show values ]</yellow></click>"
  help_entry_reload: "- <hover:show_text:'<gray>reload</gray> <dark_gray>·</dark_gray> <gray>Reload configuration and all mob definitions</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakimobs.reload</white>'><gray>reload</gray></hover> <click:run_command:'%root% reload'><green>[ ✦ Run ]</green></click>"
  help_entry_list: "- <hover:show_text:'<gray>list</gray> <dark_gray>·</dark_gray> <gray>List the loaded mob definitions page by page</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakimobs.list</white><newline><dark_gray>▸</dark_gray> <gray>Argument [page] optional, defaults to page 1, Tab completed</gray>'><gray>list</gray></hover> <click:run_command:'%root% list'><green>[ ✦ Run ]</green></click>"
  help_entry_info: "- <hover:show_text:'<gray>info</gray> <dark_gray>·</dark_gray> <gray>Show type, components, triggers and loot of one mob definition</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakimobs.info</white><newline><dark_gray>▸</dark_gray> <gray>Argument [mob ID] required, click to see available values</gray>'><gray>info</gray></hover> <click:run_command:'%root% help info'><yellow>[ ✦ Show values ]</yellow></click>"
  help_entry_count: "- <hover:show_text:'<gray>count</gray> <dark_gray>·</dark_gray> <gray>Count the current live managed mobs</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakimobs.count</white><newline><dark_gray>▸</dark_gray> <gray>Argument [mob ID] optional, omit to count all, Tab completed</gray>'><gray>count</gray></hover> <click:run_command:'%root% count'><green>[ ✦ Run ]</green></click>"
  help_entry_find: "- <hover:show_text:'<gray>find</gray> <dark_gray>·</dark_gray> <gray>Find managed mobs in range, list entries teleport on click</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakimobs.count</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [mob ID] required, click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [radius] optional, in blocks, omit for unlimited range</gray>'><gray>find</gray></hover> <click:run_command:'%root% help find'><yellow>[ ✦ Show values ]</yellow></click>"
  help_entry_kill: "- <hover:show_text:'<gray>kill</gray> <dark_gray>·</dark_gray> <gray>Remove managed mobs</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakimobs.admin</white><newline><dark_gray>▸</dark_gray> <gray>Argument [mob ID|all] required, click to see available values including all</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [radius] optional, centered on the sender, player only when given</gray>'><gray>kill</gray></hover> <click:run_command:'%root% help kill'><yellow>[ ✦ Show values ]</yellow></click>"
  help_entry_tp: "- <hover:show_text:'<gray>tp</gray> <dark_gray>·</dark_gray> <gray>Teleport to one managed mob</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakimobs.admin</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>tp</gray></hover> <hover:show_text:'<gray>Argument: UUID</gray><newline><gray>UUID of a managed mob, must be typed by you</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Usually triggered by the click-to-teleport entries of find</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ UUID ]</gray></hover>"
  help_entry_debug: "- <hover:show_text:'<gray>debug</gray> <dark_gray>·</dark_gray> <gray>Manage Debug mode and diagnostic output</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakimobs.debug</white>'><gray>debug</gray></hover> <click:run_command:'%root% help debug'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>status</gray> <dark_gray>·</dark_gray> <gray>show the debug status</gray><newline><gray>on</gray> <dark_gray>·</dark_gray> <gray>turn debug output on</gray><newline><gray>off</gray> <dark_gray>·</dark_gray> <gray>turn debug output off</gray><newline><gray>player</gray> <dark_gray>·</dark_gray> <gray>track or untrack a player</gray><newline><gray>module</gray> <dark_gray>·</dark_gray> <gray>toggle module debug output</gray><newline><gray>action</gray> <dark_gray>·</dark_gray> <gray>action pipeline debugging</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_entry_edit: "- <hover:show_text:'<gray>edit</gray> <dark_gray>·</dark_gray> <gray>Open the in-game editor for a definition</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakimobs.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [id] optional, omit to open the browser, Tab completed</gray>'><gray>edit</gray></hover> <click:run_command:'%root% edit'><green>[ ✦ Run ]</green></click>"
  help_debug_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiMobs debug Command Help</gradient> <gray><st>        </st></gray>"
  help_debug_entry_status: "- <hover:show_text:'<gray>status</gray> <dark_gray>·</dark_gray> <gray>Show the current Debug state, tracked players and modules</gray>'><gray>status</gray></hover> <click:run_command:'%root% debug status'><green>[ ✦ Run ]</green></click>"
  help_debug_entry_on: "- <hover:show_text:'<gray>on</gray> <dark_gray>·</dark_gray> <gray>Turn on all debug output</gray>'><gray>on</gray></hover> <click:run_command:'%root% debug on'><green>[ ✦ Run ]</green></click>"
  help_debug_entry_off: "- <hover:show_text:'<gray>off</gray> <dark_gray>·</dark_gray> <gray>Turn off all debug output</gray>'><gray>off</gray></hover> <click:run_command:'%root% debug off'><green>[ ✦ Run ]</green></click>"
  help_debug_entry_player: "- <hover:show_text:'<gray>player</gray> <dark_gray>·</dark_gray> <gray>Track or untrack debug output of one player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Run again for the same player to untrack</gray>'><gray>player</gray></hover> <click:run_command:'%root% help debug player'><hover:show_text:'<gray>Argument: player</gray><newline><gray>an online player name; click to see available players</gray>'><gray>[ ✦ Player ]</gray></hover></click>"
  help_debug_entry_module: "- <hover:show_text:'<gray>module</gray> <dark_gray>·</dark_gray> <gray>Toggle debug output of one module</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Run again for the same module to turn it off</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [module] required, click to see available values</gray>'><gray>module</gray></hover> <click:run_command:'%root% help debug module'><yellow>[ ✦ Show values ]</yellow></click>"
  help_debug_entry_action: "- <hover:show_text:'<gray>action</gray> <dark_gray>·</dark_gray> <gray>Action pipeline debugging: dry-run, static check, registry check</gray>'><gray>action</gray></hover> <click:run_command:'%root% help debug action'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>run</gray> <dark_gray>·</dark_gray> <gray>dry-run or execute one action pipeline</gray><newline><gray>check</gray> <dark_gray>·</dark_gray> <gray>statically check one action pipeline</gray><newline><gray>registry</gray> <dark_gray>·</dark_gray> <gray>check the stage registry</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_debug_action_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiMobs debug action Command Help</gradient> <gray><st>        </st></gray>"
  help_debug_action_entry_run: "- <hover:show_text:'<gray>run</gray> <dark_gray>·</dark_gray> <gray>Dry-run preview or real execution of one action pipeline</gray>'><gray>run</gray></hover> <click:run_command:'%root% help debug action run'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>shadow</gray> <dark_gray>·</dark_gray> <gray>dry-run preview, no real effects</gray><newline><gray>execute</gray> <dark_gray>·</dark_gray> <gray>really run the action pipeline</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_debug_action_entry_check: "- <hover:show_text:'<gray>check</gray> <dark_gray>·</dark_gray> <gray>Statically check one action pipeline: compile and print diagnostics only</gray>'><gray>check</gray></hover> <hover:show_text:'<gray>Argument: pipeline line</gray><newline><gray>one action pipeline text, must be typed by you</gray><newline><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ pipeline line ]</gray></hover>"
  help_debug_action_entry_registry: "- <hover:show_text:'<gray>registry</gray> <dark_gray>·</dark_gray> <gray>Check the action stage registry and print diagnostics</gray>'><gray>registry</gray></hover> <click:run_command:'%root% debug action registry'><green>[ ✦ Run ]</green></click>"
  help_debug_action_run_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiMobs debug action run Command Help</gradient> <gray><st>        </st></gray>"
