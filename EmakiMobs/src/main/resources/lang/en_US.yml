  find_header: "<gray>Managed mobs in range for <white>%mob_id%</white>: <white>%count%</white>  (radius %radius%):</gray>"
  find_empty: "<yellow>No matching managed mobs in range</yellow>"
  # placeholders: %mob_id%, %uuid%, %health%, %max_health%
  find_entry_hover: "<white>%mob_id%</white> <gray>UUID %uuid%</gray><newline><gray>Health %health%/%max_health%</gray><newline><gray>Click to teleport to this mob</gray>"
  # placeholders: %hover%, %uuid%, %mob_id%, %distance%, %world%, %x%, %y%, %z%
  find_entry: "<dark_gray>-</dark_gray> <hover:show_text:'%hover%'><click:run_command:'/emobs tp %uuid%'><green>Click to teleport</green></click></hover> <white>%mob_id%</white> <gray>%world% %x%, %y%, %z%  (%distance% blocks)</gray>"
  # placeholders: %count%
  find_truncated: "<dark_gray>... %count% more not shown</dark_gray>"
  tp_usage: "<gray>Usage: /emobs tp &lt;uuid&gt; - teleport to a managed mob  (triggered from the find list)</gray>"
