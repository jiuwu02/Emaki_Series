  value_yes: "yes"
  value_no: "no"
  count_success: "<green>Managed mob <white>%mob_id%</white> count: <white>%count%</white></green>"
  kill_usage: "<gray>Usage: /emobs kill &lt;mob_id|all&gt; [radius] - 'all' removes every managed mob</gray>"
  kill_success: "<green>Removed <white>%count%</white> managed <white>%mob_id%</white> mob (s)</green>"
  kill_all_success: "<green>Removed all managed mobs, <white>%count%</white> in total</green>"
  find_usage: "<gray>Usage: /emobs find &lt;mob_id&gt; [radius] - list managed mobs in range  (click an entry to teleport)</gray>"
