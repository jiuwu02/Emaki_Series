# EmakiMobs 主配置
# 控制自定义生物定义、掉落表、自然生成规则与原版类型覆写。

version: "1.0.2"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放插件内置的默认生物与掉落示例数据。
release_default_data: true

# 兼容保留项；当前实现不使用该值控制停用排空。
drain_timeout_seconds: 30

# 实体模型渲染与动画设置。
model:
  # 使用的模型后端：auto 自动选择（优先 ModelEngine，其次 BetterModel）、
  # model_engine 强制 ModelEngine、better_model 强制 BetterModel。
  # 对应后端插件未安装时模型功能静默降级为无模型模式。
  api: "auto"
  # 模型视距（格）：ModelEngine 在近距/中距用它设置模型可见范围；
  # BetterModel 不使用该值，是否显示由后端自身的跟踪范围决定。
  view_distance: 48.0
  # 距离分级（LOD）边界（格）。判据是该生物到最近玩家的距离，
  # 每 movement_check_interval_ticks 评估一次，仅在档位变化时下发给模型后端：
  #   距离 ≤ near        → NEAR
  #   near < 距离 ≤ mid  → MID
  #   距离 > mid         → FAR（mid 与 far 之间同样是 FAR）
  # 当前两个后端对 NEAR 与 MID 的处理完全相同（正常渲染，没有中间降频）；
  # FAR 时 ModelEngine 把模型视距设为 0、BetterModel 暂停该模型的 tracker。
  # far 只用于限定「附近是否有玩家」的搜索半径（far + 8）与远距早退判定，
  # 不是隐藏分界点；请保持 far ≥ mid，否则 MID 档不可达。
  lod:
    near: 16.0
    mid: 32.0
    far: 48.0
  # 移动状态（idle/walk/run）检测周期（tick）。
  movement_check_interval_ticks: 5
  # 死亡动画播完后延迟多少 tick 再卸载模型实体。
  death_detach_delay_ticks: 40
  # 判定为行走与奔跑的水平速度阈值（格/tick）。
  walk_speed_threshold: 0.12
  run_speed_threshold: 0.28
  # 各标准动作切换时的过渡混合时长（tick）。
  transitions:
    idle_fade_ticks: 5
    walk_fade_ticks: 5
    run_fade_ticks: 5
    death_fade_ticks: 0
    hurt_fade_ticks: 2
    attack_fade_ticks: 3
    skill_fade_ticks: 3
    interact_fade_ticks: 3
