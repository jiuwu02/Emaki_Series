# EmakiMobs 主配置
#
# 控制自定义生物定义、掉落表、自然生成规则与原版类型覆写。
# 修改后按插件提供的重载命令应用。
# 文件位置：plugins/EmakiMobs/config.yml

# version 是配置结构标记，由项目资源同步流程维护，不是功能开关。
version: "1.0.7"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放插件内置的默认生物与掉落示例数据。
release_default_data: true

# 兼容保留项；当前实现不使用该值控制停用排空。
drain_timeout_seconds: 30
