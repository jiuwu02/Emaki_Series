# ============================================================
# EmakiCooking 物品显示调整 - 熟鸡肉
# ============================================================
# 此文件定义了特定物品在各烹饪设备上的显示参数。
# 当物品被放置在烹饪设备上时，会按照此处的配置调整
# 物品展示实体的位置、旋转和缩放。
#
# 文件放置位置: plugins/EmakiCooking/item_adjustments/
# 文件名格式: "提供者-物品ID.yml"
# ============================================================

# 匹配的物品来源
item_sources:
  - "minecraft-cooked_chicken"

# ============================================================
# 各设备上的显示参数
# ============================================================
# offset: 位置偏移（相对于设备中心）
# rotation: 旋转角度（x/y/z 轴）
#   支持范围格式如 "-12.0-22.0" 表示随机范围
# scale: 缩放比例
stations:
  wok:
    offset:
      x: 0.53
      y: 1.01
      z: 0.57
    rotation:
      x: 78.0
      y: -18
      z: "-12.0-22.0"
    scale:
      x: 0.64
      y: 0.64
      z: 0.64
