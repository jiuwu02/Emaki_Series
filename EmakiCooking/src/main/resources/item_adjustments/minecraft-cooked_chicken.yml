# ============================================================
# EmakiCooking 物品显示调整 - 熟鸡肉
# ============================================================
# 文件名格式为“提供者-物品 ID.yml”；stations 调整匹配物品的展示变换。
# ============================================================

item_sources:
  - "minecraft-cooked_chicken"

# offset 相对设备中心；rotation 按 x/y/z 轴旋转，"-12.0-22.0" 表示随机范围；
# scale 控制缩放。
stations:
  wok:
    offset:
      x: 0.53
      y: 1.01
      z: 0.57
    rotation:
      x: 78.0
      y: -18
      z: "-12.0-22.0"
    scale:
      x: 0.64
      y: 0.64
      z: 0.64
