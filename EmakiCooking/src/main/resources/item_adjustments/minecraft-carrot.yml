# ============================================================
# EmakiCooking 物品显示调整 - 胡萝卜
# ============================================================
# 此文件定义了特定物品在各烹饪设备上的显示参数。
# 当物品被放置在烹饪设备上时，会按照此处的配置调整
# 物品展示实体的位置、旋转和缩放。
#
# 文件放置位置: plugins/EmakiCooking/item_adjustments/
# 文件名格式: "提供者-物品ID.yml"
# ============================================================

# 匹配的物品来源
item_sources:
  - "minecraft-carrot"

# ============================================================
# 各设备上的显示参数
# ============================================================
# offset: 位置偏移（相对于设备中心）
# rotation: 旋转角度（x/y/z 轴）
#   支持范围格式如 "-28.0-18.0" 表示随机范围
# scale: 缩放比例
stations:
  chopping_board:
    offset:
      x: 0.54
      y: 1.01
      z: 0.52
    rotation:
      x: 90.0
      y: 0.0
      z: 24.0
    scale:
      x: 0.72
      y: 0.72
      z: 0.72

  wok:
    offset:
      x: 0.47
      y: 1.0
      z: 0.45
    rotation:
      x: 88.0
      y: 12.0
      z: "-28.0-18.0"
    scale:
      x: 0.56
      y: 0.56
      z: 0.56
