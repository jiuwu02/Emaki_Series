# ============================================================
# EmakiCooking 物品显示调整 - 胡萝卜
# ============================================================
# 文件名格式为“提供者-物品 ID.yml”；stations 调整匹配物品的展示变换。
# ============================================================

item_sources:
  - "minecraft-carrot"

# offset 相对设备中心；rotation 按 x/y/z 轴旋转，"-28.0-18.0" 表示随机范围；
# scale 控制缩放。
stations:
  chopping_board:
    offset:
      x: 0.54
      y: 1.01
      z: 0.52
    rotation:
      x: 90.0
      y: 0.0
      z: 24.0
    scale:
      x: 0.72
      y: 0.72
      z: 0.72

  wok:
    offset:
      x: 0.47
      y: 1.0
      z: 0.45
    rotation:
      x: 88.0
      y: 12.0
      z: "-28.0-18.0"
    scale:
      x: 0.56
      y: 0.56
      z: 0.56
