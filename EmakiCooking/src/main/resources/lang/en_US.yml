  grinder:
    title: "<gold>Grinder</gold>"
    grinding: "<gray>Grinding... <yellow>%seconds%</yellow>s left</gray>"
    item: "<white>%item%</white>"
  steamer:
    title: "<gold>Steamer</gold>"
    burning: "<gray>Burning <yellow>%burning_time%</yellow>s</gray>"
    moisture: "<gray>Moisture <aqua>%moisture%</aqua></gray>"
    steam: "<gray>Steam <white>%steam%</white></gray>"
    progress: "<gray>Progress <yellow>%progress%</yellow></gray>"
    idle: "<yellow>Waiting for fuel/water</yellow>"
  oven:
    title: "<gold>Oven</gold>"
    heat: "<gray>Heat <yellow>%heat%</yellow></gray>"
