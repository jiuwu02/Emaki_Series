# ============================================================
# EmakiCooking 语言文件 - English
# ============================================================
# 此文件包含插件的所有消息文本，支持 MiniMessage 格式。
# 修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiCooking/lang/
# ============================================================

# version is maintained by resource sync
version: "4.0.2"

general:
  prefix: "<gray>[ <gradient:#A78BFA:#60A5FA>EmakiCooking</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to perform this action.</red>"
  player_only: "<red>This command can only be executed by a player.</red>"
  unknown_command: "<red>Unknown command.</red>"
  invalid_args: "<red>Invalid arguments.</red>"
  no_item_in_hand: "<red>You are not holding an inspectable item in your main hand.</red>"
  input_rejected: "<red>This item is not a valid recipe input for this station.</red>"
  reloading: "<gray>Reloading configuration...</gray>"
  reload_success: "<green>Configuration reloaded.</green>"
  reload_summary: "<gray>Reloaded %recipes% recipes, %resources% GUI resources.</gray>"

command:
  help:
    header: "<gold>========== EmakiCooking Help ==========</gold>"
    footer: "<gold>=======================================</gold>"
    line: "<yellow>%cmd%</yellow> <gray>- %desc%</gray>"
    desc:
      help: "Show help information"
      reload: "Reload configuration, language and recipe directories"
      inspect: "Inspect main-hand item CoreLib source identifier"
      nutrition: "Query or adjust player nutrition values"
      debug: "Manage Debug mode"
  inspect:
    header: "<gold>========== Held Item Inspection ==========</gold>"
    line: "<yellow>%key%</yellow> <gray>- %value%</gray>"

nutrition:
  disabled: "<yellow>The nutrition system is currently disabled.</yellow>"
  usage: "<gray>Usage: /ec nutrition get [player] [type] | set|add|remove <player> <type> <value></gray>"
  unknown_type: "<red>Unknown nutrition type: <yellow>%type%</yellow></red>"
  player_not_found: "<red>Online player not found: <yellow>%player%</yellow></red>"
  invalid_amount: "<red>Invalid amount: <yellow>%amount%</yellow></red>"
  value: "<gray>%player%'s <yellow>%type%</yellow> nutrition: <white>%value%</white></gray>"
  list_header: "<gold>========== Nutrition of %player% ==========</gold>"
  list_line: "<yellow>%type%</yellow> <gray>:</gray> <white>%value%</white><gray>/%max%</gray>"
  modified: "<green>Updated %player%'s <yellow>%type%</yellow> nutrition: <gray>%old% →</gray> <white>%new%</white></green>"
  modify_failed: "<red>Failed to modify nutrition: <gray>%reason%</gray></red>"

console:
  plugin_starting: "<gray>Starting...</gray>"
  plugin_started: "<green>Started</green>"
  plugin_stopped: "<yellow>Stopped</yellow>"
  config_precheck_passed: "<gray>Config precheck passed: <yellow>%issues%</yellow> issue(s).</gray>"
  config_precheck_failed: "<red>Config precheck failed: <yellow>%issues%</yellow> issue(s).</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray>(%hint%)</dark_gray>"
    messages:
      passed: "Cooking config precheck passed."
      required_file_missing: "Required file does not exist."
      path_not_file: "Path is not a file."
      file_not_readable: "File is not readable."
      required_directory_missing: "Required directory does not exist."
      path_not_directory: "Path is not a directory."
      directory_not_readable: "Directory is not readable."
      recipe_directory_missing: "Recipe directory does not exist."
      recipe_directory_not_readable: "Recipe directory is not readable."
      station_state_directory_missing: "Station state directory does not exist."
      station_state_directory_not_readable: "Station state directory is not readable."
      station_storage: "Station storage precheck: %station% source %source% -> %backend%"
      station_storage_inspect_anchor: "Backend depends on the actual anchor BlockState; inspect a placed station."
      station_storage_block_pdc: "Placed vanilla %material% supports BLOCK_PDC."
      station_storage_yaml_fallback: "YAML fallback unless the placed block is TileState."
  bootstrap_start: "<white>Checking default files...</white>"
  bootstrap_complete: "<green>Default file check complete.</green>"
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "<yellow>Skipped default data generation.</yellow>"
  bootstrap_copy_failed: "<yellow>Failed to copy default resource:
    <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>Failed to save merged resource:
    <red>%path%</red> <gray>(%error%)</gray></yellow>"
  default_file_missing: "<yellow>Missing built-in default resource: <red>%path%</red></yellow>"
  directory_create_failed: "<yellow>Failed to create directory: <red>%path%</red></yellow>"
  loader_config_load_error: "<yellow>Failed to load EmakiCooking config:
    <red>%path%</red> <gray>(%error%)</gray></yellow>"
  station_recipes_loaded: "<gray>Loaded %station% <yellow>%count%</yellow> recipe(s)</gray>"
  block_source_bridge_ready: "<gray>Block source connected: <aqua>%provider%</aqua></gray>"
  block_source_bridge_unavailable: "<yellow>Block source unavailable: %provider% (%error%)</yellow>"
  nutrition_bridge_ready: "<gray>Nutrition consume source connected: <aqua>%provider%</aqua></gray>"
  nutrition_bridge_unavailable: "<yellow>Nutrition consume source unavailable: %provider% (%error%)</yellow>"
  station_name:
    chopping_board: "Chopping Board"
    wok: "Wok"
    grinder: "Grinder"
    steamer: "Steamer"
    oven: "Oven"
    juicer: "Juicer"
    fermentation_barrel: "Fermentation Barrel"

loader:
  type:
    recipe: "%station% recipe"
  station:
    chopping_board: "Chopping Board"
    wok: "Wok"
    grinder: "Grinder"
    steamer: "Steamer"
    oven: "Oven"
    juicer: "Juicer"
    fermentation_barrel: "Fermentation Barrel"
  error:
    empty_document: "Empty document"
    missing_field: "Missing field: %path%"
  lang_directory_create_failed: "<yellow>Unable to create language directory: <red>%path%</red></yellow>"
  bundled_language_load_failed: "<yellow>Failed to load bundled language: <red>%error%</red></yellow>"
  directory_create_failed: "<yellow>Unable to create %type% directory: <red>%path%</red></yellow>"
  invalid_blank_id: "<yellow>%type% ID is blank: <red>%file%</red></yellow>"
  duplicate_id: "<yellow>Duplicate %type% ID <red>%id%</red>, source
    <gray>%file%</gray></yellow>"
  load_failed: "<yellow>Failed to load %type% file: <red>%file%</red>
    <gray>(%error%)</gray></yellow>"

chopping_board:
  too_fast: "<yellow>Too fast, please wait a moment.</yellow>"
  wrong_tool: "<yellow>You need to hold the configured kitchen knife to chop.</yellow>"
  cannot_cut: "<red>The placed ingredient has no available chopping board recipe.</red>"
  not_enough_input: "<yellow>Not enough ingredients on the board. Required <white>%required%</white>, current <white>%current%</white>.</yellow>"
  progress: "<gray>Chopping progress:
    <yellow>%current%</yellow>/<yellow>%required%</yellow></gray>"
  completed: "<green>Chopping board processing complete:
    <yellow>%recipe%</yellow></green>"
  item_placed: "<gray>Placed <yellow>%amount%</yellow> ingredient(s). Board now has <yellow>%total%</yellow>/<yellow>%required%</yellow>.</gray>"
  item_returned: "<gray>Retrieved <yellow>%amount%</yellow> ingredient(s) from the chopping board.</gray>"
  cut_hurt: "<red>You cut yourself, taking %damage% damage.</red>"

grinder:
  busy: "<yellow>The grinder is running, please wait.</yellow>"
  no_recipe: "<red>No matching grinder recipe for the current item.</red>"
  started: "<gray>Grinding started, estimated <yellow>%seconds%</yellow> seconds
    to complete.</gray>"
  completed: "<green>Grinding complete: <yellow>%recipe%</yellow></green>"

wok:
  no_item: "<yellow>There are no ingredients in the wok to work with.</yellow>"
  no_heat: "<red>No valid heat source under the wok, cannot start cooking.</red>"
  too_fast: "<yellow>Stirring too fast, please try again later.</yellow>"
  wrong_tool:
    "<yellow>You need to hold the configured spatula to stir or inspect
