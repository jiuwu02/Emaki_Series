    progress: "<gray>Cuts <yellow>%current%</yellow>/<yellow>%required%</yellow></gray>"
    hint_add: "<aqua>Add more ingredients</aqua>"
    hint_cut: "<aqua>Hold a knife to chop</aqua>"
    no_recipe: "<red>No available recipe</red>"
  wok:
    title: "<gold>Wok</gold>"
    heat: "<gray>Heat <yellow>%heat%</yellow></gray>"
    stir: "<gray>Stirs <yellow>%count%</yellow></gray>"
    ingredients_header: "<gray>Ingredients:</gray>"
    ingredient_line: "<white>- %item% x%amount%</white>"
    predicted: "<gray>Predicted: <aqua>%recipe%</aqua></gray>"
