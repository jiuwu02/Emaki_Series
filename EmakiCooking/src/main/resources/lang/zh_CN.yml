# EmakiCooking 简体中文语言资源。
# 消息使用 MiniMessage；保留消息分组旁标明的占位符。
# version 由资源同步流程维护，用于合并新增默认键。

version: "4.3.1"

general:
  prefix: "<gray>[ <gradient:#22C55E:#FACC15>EmakiCooking</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此操作。</red>"
  player_only: "<red>此命令只能由玩家执行。</red>"
  unknown_command: "<red>未知命令。</red>"
  invalid_args: "<red>参数错误。</red>"
  no_item_in_hand: "<red>你的主手当前没有可检查的物品。</red>"
  input_rejected: "<red>该物品不是此工位可用配方输入。</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>配置已重载。</green>"
  reload_summary: "<gray>已重载配方 %recipes% 个，GUI 资源 %resources% 个。</gray>"

command:
  help:
    header: "<gold>========== EmakiCooking 帮助 ==========</gold>"
    footer: "<gold>=======================================</gold>"
    line: "<yellow>%cmd%</yellow> <gray>- %desc%</gray>"
    desc:
      help: "显示帮助信息"
      reload: "重载配置、语言与配方目录"
      inspect: "检查主手物品的 CoreLib 来源标识"
      nutrition: "查询或调整玩家营养值"
      "convert-legacy [confirm]": "把旧 item_sources 识别位合并为 matcher"
      debug: "管理 Debug 模式"
  convert_legacy:
    header: "<gold>========== 旧 item_sources 转换（%mode%，共 %files% 个文件） ==========</gold>"
    mode:
      dry_run: "预演"
      apply: "写入"
    file: "<yellow>%file%</yellow> <gray>- %status% %detail%</gray>"
    backup: "<gray>  已备份为 <white>%backup%</white></gray>"
    diff_line: "<gray>  %line%</gray>"
    summary: "<gray>转换 %converted% 个、无旧键 %skipped% 个、键冲突 %conflict% 个、无法转换 %unconvertible% 个、失败 %failed% 个。</gray>"
    breakdown: "<gray>其中：直接转为 matcher 并移除旧键 <white>%plain%</white> 处、与原有 matcher 合并为 all_of 以保持判定等价 <white>%merged%</white> 处、补写 matcher 但保留旧键（仍用于取物、扣除或计数）<white>%duplicated%</white> 处。</gray>"
    file_merged: "<gray>  合并为 all_of <white>%merged%</white> 处、保留旧键 <white>%duplicated%</white> 处、直接转换 <white>%plain%</white> 处</gray>"
    dry_run_hint: "<yellow>以上为预演结果，未写入任何文件。执行 <white>/emakicooking convert-legacy confirm</white> 才会写入并备份原文件。</yellow>"
    nothing_to_do: "<gray>没有需要转换的配置。</gray>"
    status:
      converted: "可转换"
      no_legacy_block: "无旧键"
      conflict: "键冲突，已保留原样"
      unconvertible: "无等价写法，已保留原样"
      failed: "转换失败，已保留原样"
  inspect:
    header: "<gold>========== 手持物品检查 ==========</gold>"
    line: "<yellow>%key%</yellow> <gray>- %value%</gray>"

nutrition:
  disabled: "<yellow>营养系统当前未启用。</yellow>"
  usage: "<gray>用法: /ec nutrition get [玩家] [类型] | set|add|remove <玩家> <类型> <数值></gray>"
  unknown_type: "<red>未知的营养类型: <yellow>%type%</yellow></red>"
