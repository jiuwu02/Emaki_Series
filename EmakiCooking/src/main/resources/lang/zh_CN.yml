      path_not_file: "路径不是文件"
      file_not_readable: "文件不可读"
      required_directory_missing: "必需目录不存在"
      path_not_directory: "路径不是目录"
      directory_not_readable: "目录不可读"
      recipe_directory_missing: "配方目录不存在"
      recipe_directory_not_readable: "配方目录不可读"
      station_state_directory_missing: "工位状态目录不存在"
      station_state_directory_not_readable: "工位状态目录不可读"
      station_storage: "工位存储预检: %station% 来源 %source% -> %backend%"
