  bootstrap_complete: "[loader] <green>默认文件检查完成</green>"
  versioned_file_updated: "[loader] <green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "[loader] <yellow>已跳过默认数据写入</yellow>"
  bootstrap_copy_failed: "[loader] <yellow>复制默认资源失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  bootstrap_save_failed: "[loader] <yellow>保存合并资源失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  default_file_missing: "[loader] <yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  directory_create_failed: "[loader] <yellow>创建目录失败: <red>%path%</red></yellow>"
  loader_config_load_error:
    "[loader] <yellow>读取 EmakiCooking 配置失败: <red>%path%</red>
    <gray> (%error%)</gray></yellow>"
  station_recipes_loaded: "[loader] <gray>已加载%station% <yellow>%count%</yellow> 个配方</gray>"
  block_source_bridge_ready: "[integration] <gray>已接入方块源: <aqua>%provider%</aqua></gray>"
  block_source_bridge_unavailable: "[integration] <yellow>方块源不可用: %provider%  (%error%)</yellow>"
  nutrition_bridge_ready: "[integration] <gray>已接入营养食用源: <aqua>%provider%</aqua></gray>"
  nutrition_bridge_unavailable: "[integration] <yellow>营养食用源不可用: %provider%  (%error%)</yellow>"
  # 控制台: 工位恢复类型不匹配; 占位符: %type%, %coordinate%
  station_restore_skipped_mismatch: "[persistence] <gray>工位恢复报告: 类型不匹配 type=%type% coordinate=%coordinate%</gray>"
  # 控制台: 工位方块实体丢失已替换; 占位符: %type%, %coordinate%
  station_restore_lost_block_entity: "[persistence] <gray>工位恢复报告: 方块实体丢失已替换 type=%type% coordinate=%coordinate%</gray>"
  # 控制台: 重载进度-加载配置
  reload_loading_configs: "[reload] <gray>正在加载配置...</gray>"
  # 控制台: 重载进度-应用配置
  reload_applying: "[reload] <gray>正在应用配置...</gray>"
  # 控制台: 重载进度-完成
  reload_complete: "[reload] <gray>重载完成</gray>"
  # 控制台: 重载阶段失败; 占位符: %stage%, %error%
  reload_stage_failed: "[reload] <yellow>重载阶段 %stage% 失败: %error%</yellow>"
  # 控制台: 烹饪完成恢复失败; 占位符: %error%
  completion_recovery_failed: "[completion] <yellow>烹饪完成恢复失败: %error%</yellow>"
