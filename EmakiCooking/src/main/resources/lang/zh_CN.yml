  opened: "<gray>发酵桶已打开。</gray>"
  open_failed: "<red>发酵桶 GUI 打开失败。</red>"
  no_recipe: "<red>当前食材组合无法发酵。</red>"
  started: "<gray>发酵已开始，预计 <yellow>{seconds}</yellow> 秒后完成。</gray>"
  fermenting: "<gray>正在发酵，剩余 <yellow>{seconds}</yellow> 秒。</gray>"
  collected: "<green>已收取发酵产物。</green>"
  info: "<gray>发酵状态：<yellow>{status}</yellow> | 剩余时间：<yellow>{seconds}</yellow>秒 | 进度：<yellow>{progress}</yellow></gray>"
  status_idle: "未开始"
  status_fermenting: "发酵中"
  status_early_ready: "可提前收取"
  status_completed: "已完成"
  status_over: "过度发酵"
  collected_early: "<yellow>已提前收取发酵产物。</yellow>"
  collected_over: "<gold>已收取过度发酵产物。</gold>"
