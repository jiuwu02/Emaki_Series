    animation_end: "翻炒动画结束 | 工位=%station%"
  display:
    create: "创建展示实体 | 工位=%station% | 后端=%backend% | 物品=%item%"
    remove: "移除展示实体 | 工位=%station% | 数量=%count%"
    update: "更新展示实体 | 工位=%station% | 变更=%change%"
