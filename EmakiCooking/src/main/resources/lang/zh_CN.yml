  nutrition_threshold_skipped: "[scheduler] <yellow>已跳过 %player% 的营养阈值评估: 调用线程不拥有该玩家且无可用执行调度器</yellow>"
  # 控制台: 营养阈值评估重新路由失败; 占位符: %player%
  nutrition_threshold_reroute_failed: "[scheduler] <yellow>重新路由 %player% 的营养阈值评估失败: 实体任务调度被拒绝</yellow>"
  # 控制台: 发酵桶恢复时状态无效; 占位符: %coordinate%
  station_restore_rejected_invalid_fermentation_state: "[persistence] <gray>工位恢复报告: 发酵桶状态无效 coordinate=%coordinate%</gray>"
  # 控制台: 发酵桶恢复时槽位 ID 迁移被拒; 占位符: %coordinate%, %recipe%
  station_restore_rejected_slot_migration: "[persistence] <gray>工位恢复报告: 发酵桶槽位 ID 迁移被拒绝 coordinate=%coordinate% recipe=%recipe%</gray>"
  # 控制台: 发酵桶破坏时槽位 ID 迁移被拒; 占位符: %coordinate%
  station_break_rejected_slot_migration: "[persistence] <gray>工位破坏报告: 发酵桶槽位 ID 迁移被拒绝 coordinate=%coordinate%</gray>"
  # 控制台: 发酵桶交互时槽位 ID 迁移被拒; 占位符: %coordinate%
  station_interaction_rejected_slot_migration: "[persistence] <gray>工位交互报告: 发酵桶槽位 ID 迁移被拒绝 coordinate=%coordinate%</gray>"
  # 控制台: 发酵桶 GUI 身份迁移被拒; 占位符: %coordinate%
  station_gui_rejected_identity_migration: "[persistence] <gray>工位 GUI 报告: 发酵桶身份迁移被拒绝 coordinate=%coordinate%</gray>"
  station_name:
    chopping_board: "砧板"
    wok: "炒锅"
    grinder: "研磨机"
    steamer: "蒸锅"
    oven: "烤箱"
