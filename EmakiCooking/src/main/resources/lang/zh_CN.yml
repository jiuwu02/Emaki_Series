  stage_register_failed: "[startup] <yellow>注册流水线阶段 '%stage%' 失败: %reason%</yellow>"
  # 控制台: 执行旧版烹饪奖励失败; 占位符: %error%
  reward_legacy_execute_failed: "[reward] <yellow>执行旧版烹饪奖励失败: %error%</yellow>"
  # 控制台: 烹饪奖励输出物品无效; 占位符: %output%, %recipe%
  reward_output_invalid: "[reward] <yellow>输出物品为空或空气, output_map=%output% recipe=%recipe%</yellow>"
  # 控制台: 创建来源物品返回 null; 占位符: %source%, %amount%
  reward_source_create_null: "[reward] <yellow>itemSourceService.createItem 对 source=%source% amount=%amount% 返回 null</yellow>"
  # 控制台: 组装预览与直接创建均返回 null; 占位符: %source%, %type%, %id%
  reward_source_resolve_null: "[reward] <yellow>组装预览与直接 createItem 对 source=%source% type=%type% id=%id% 均返回 null</yellow>"
