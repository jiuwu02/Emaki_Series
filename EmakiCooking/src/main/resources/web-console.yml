# EmakiCooking Web Console 声明式注册
# 仅声明后端发现信息；字段文案、表单 schema 与编辑器描述由前端扩展注册。

module:
  name: "Cooking 烹饪"
  summary: "工位、展示实体、输入规则"
  tone: cooking

files:
  - title: "烹饪系统配置"
    path: "config.yml"
    kind: CONFIG
    comment: "烹饪系统主配置，包含工位、展示实体和输入规则。"
  - title: "烹饪 GUI 模板"
    path: "gui/**/*.yml"
    kind: GUI
    editor: "emakicooking:gui"
    comment: "烹饪工位 GUI 模板文件。"

extensions:
  - id: "emakicooking:gui-surface"
    resource: "web-extensions/emakicooking-gui-surface.js"
