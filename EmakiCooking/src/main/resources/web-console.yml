# EmakiCooking Web Console 声明式注册
# 仅声明结构信息与资源入口，不承载展示文案。

module:
  tone: cooking
  icon: '<svg viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10 21h18l-2 8H12l-2-8zM8 21h22M13 16c-1.5-2 .8-3.5-.3-5M19 16c-1.5-2 .8-3.5-.3-5M25 16c-1.5-2 .8-3.5-.3-5M14 29l-2 3M24 29l2 3M15 21c1.2 2 6.8 2 8 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'

files:
  - path: "config.yml"
    kind: CONFIG
  - path: "recipes/**/*.yml"
    kind: CONFIG
  - path: "lang/**/*.yml"
    kind: CONFIG
  - path: "gui/**/*.yml"
    kind: GUI
    editor: "emakicooking:gui"

extensions:
  - id: "emakicooking:gui-surface"
    resource: "web-extensions/emakicooking-gui-surface.js"
