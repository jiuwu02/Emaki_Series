# ============================================================
# EmakiCooking 主配置文件
# ============================================================
# 此文件包含插件的全局设置。修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiCooking/config.yml
# ============================================================

# 烹饪系统主配置
# 原版物品 / 方块来源支持以下写法：
# minecraft-iron_axe / mc-iron_axe / v-iron_axe / iron_axe
# 不再接受 minecraft:iron_axe
# version 由资源同步维护
version: "3.3.8"

# 语言文件 ID
language: "zh_CN"

# 是否写入默认 recipes
release_default_data: true

input_rules:
  # 严格模式：只允许能继续匹配当前工位配方的物品进入工位输入。
  only_recipe_items: true

display_entities:
  # auto: 有 PacketEvents 时使用虚拟展示实体；不可用时回退 Bukkit 真实 ItemDisplay
  # packet_events: 优先使用 PacketEvents，加载失败仍回退 Bukkit
  # bukkit: 始终使用 Bukkit 真实 ItemDisplay
  backend: auto
  view_distance_blocks: 48
  refresh_interval_ticks: 20
  wok:
    layout_radius: 0.26
  # 工位运行态文本展示实体（结果 / 过程 / 下一步引导）
  # 文本实体跟随上面的 backend；只在工位运行时显示，结束/清空/取回/破坏后移除
  text:
    enabled: true
    # billboard: fixed / vertical / horizontal / center（始终朝向玩家）
    billboard: center
    # 文本最大行宽（像素）
    line_width: 200
    # 背景色 ARGB 整数；0 表示完全透明（无背景框）。半透明黑示例：1056964608
    background: 0
    # 是否渲染文字阴影
    shadow: true
    # 是否透视（穿墙可见）
    see_through: false
    defaults:
      # 文本相对工位方块的偏移（默认悬于方块上方居中）
      offset:
        x: 0.5
        y: 1.6
        z: 0.5
      scale:
        x: 1.0
        y: 1.0
        z: 1.0
    # 工位级覆盖；省略的工位继承 defaults，enabled 省略时默认 true
    stations:
      chopping_board:
        enabled: true
      wok:
        enabled: true
      grinder:
        enabled: true
      steamer:
        enabled: true
      oven:
        enabled: true
      juicer:
        enabled: true
      fermentation_barrel:
        enabled: true

display_adjustments:
  defaults:
    item:
      offset:
        x: 0.5
        y: 1.02
        z: 0.5
      rotation:
        x: 90.0
        y: 0.0
        z: 0.0
      scale:
        x: 0.5
        y: 0.5
        z: 0.5
    block:
      offset:
        x: 0.5
        y: 1.125
        z: 0.5
      rotation:
        x: 0.0
        y: 90.0
        z: 0.0
      scale:
        x: 0.25
        y: 0.25
        z: 0.25

  station_defaults:
    # 工位级展示覆盖；当前主要给炒锅预留
    wok:
      item:
        rotation:
          z: "0.0-90.0"

# 四类工位运行配置
# block_item_sources 支持同时列出多个方块来源，命中任意一个即可作为对应工位：
#   - minecraft-iron_block
#   - craftengine-emaki:wok
#   - itemsadder-emaki:wok
#   - nexo-wok
stations:
  chopping_board:
    # 砧板方块来源
    block_item_sources:
      - minecraft-oak_log
    # 省略时继承 input_rules.only_recipe_items
    only_recipe_items: true
    interactions:
      place_input: shift_left_click
      process: shift_left_click
      return_input: right_click
    # 结果物是否直接掉落
    drop_result: true
    # 是否检查空间限制
    space_restriction: false
    # 交互最小间隔，单位毫秒
    interaction_delay_ms: 1000
    # 识别为厨刀的物品来源
    tool_item_sources:
      - minecraft-iron_axe
    cut_damage:
      enabled: true
      chance: 10
      value: 2
    actions:
      cut:
        - 'playsound sound=entity.player.attack.strong volume=0.7 pitch=1.3'
        - 'particle type=BLOCK_CRACK count=4 offset_x=0.1 offset_y=0.1 offset_z=0.1'
      complete:
        - 'playsound sound=entity.player.levelup volume=0.8 pitch=1.5'
        - 'particle type=HAPPY_VILLAGER count=6 offset_x=0.3 offset_y=0.2 offset_z=0.3'
      place:
        - 'playsound sound=block.wood.place volume=0.6 pitch=1.0'

  wok:
    # 炒锅方块来源
    block_item_sources:
      - minecraft-iron_block
    interactions:
      add_ingredient: shift_left_click
      stir: shift_left_click
      serve: shift_left_click
      return_ingredient: shift_left_click
      inspect: shift_right_click
    drop_result: true
    # 是否要求手持碗才能出锅
    need_bowl: true
    # 两次翻炒之间的最小间隔，单位毫秒
    stir_delay_ms: 5000
    # 锅状态超时后按过火处理，单位毫秒
    timeout_ms: 30000
    # 放入食材时是否点亮下方热源外观；锅清空后会尝试熄灭
    ignite_heat_source: true
    # 未命中配方或结果无效时的默认产物来源
    invalid_result_item_sources:
      - minecraft-stone
    # 识别为锅铲的物品来源
    spatula_item_sources:
      - minecraft-iron_shovel
    # 下方方块命中 source 后，解析为对应火候等级
    # 自定义热源没有可直接切换的 lit 状态时，可增加 lit_item_sources 作为替换兜底
    heat_levels:
      - item_sources:
          - minecraft-campfire
        level: 1
      - item_sources:
          - minecraft-magma_block
        level: 2
      - item_sources:
          - minecraft-lava
        level: 3
    # 翻炒动画配置
    stir_animation:
      enabled: true
      # 动画总时长，单位 tick（20 tick = 1 秒）
      duration_ticks: 20
      # 食材抛起高度，单位格
      height: 1.0
      # 旋转轴：x / y / z
      rotation_axis: x
      # 旋转角度（度）
      rotation_degrees: 360.0
    scald_damage:
      enabled: true
      value: 2
    failure:
      enabled: true
      chance: 5
      item_sources:
        - minecraft-bone_meal
    actions:
      stir:
        - 'playsound sound=entity.player.attack.sweep volume=0.8 pitch=1.2'
        - 'particle type=FLAME count=6 offset_x=0.2 offset_y=0.1 offset_z=0.2'
      add_ingredient:
        - 'playsound sound=entity.item.pickup volume=0.6 pitch=1.0'
        - 'particle type=SMOKE count=3 offset_x=0.15 offset_y=0.1 offset_z=0.15'
      serve:
        - 'playsound sound=entity.experience_orb.pickup volume=1.0 pitch=1.2'
        - 'particle type=HAPPY_VILLAGER count=8 offset_x=0.3 offset_y=0.2 offset_z=0.3'

  grinder:
    # 研磨机方块来源
    block_item_sources:
      - minecraft-grindstone
    interactions:
      start: shift_left_click
    drop_result: true
    # 后台检查周期，单位 tick
    check_delay_ticks: 20
    actions:
      start:
        - 'playsound sound=block.grindstone.use volume=0.7 pitch=1.0'
        - 'particle type=SMOKE count=3 offset_x=0.15 offset_y=0.15 offset_z=0.15'
      running:
        - 'particle type=SMOKE count=2 offset_x=0.15 offset_y=0.15 offset_z=0.15'
      complete:
        - 'playsound sound=entity.experience_orb.pickup volume=0.8 pitch=1.2'
        - 'particle type=HAPPY_VILLAGER count=5 offset_x=0.3 offset_y=0.2 offset_z=0.3'

  steamer:
    # 蒸锅主体方块来源；GUI 细节在 gui/steamer.yml
    block_item_sources:
      - minecraft-barrel
    interactions:
      open: shift_right_click
      fuel: right_click
      moisture: right_click
    drop_result: true
    # 热源方块来源。自定义方块没有可直接切换的 lit 状态时，可使用对象写法作为替换兜底：
    # - item_sources: [craftengine-emaki:heater]
    #   lit_item_sources: [craftengine-emaki:heater_lit]
    # - item_sources: [itemsadder-emaki:heater]
    #   lit_item_sources: [itemsadder-emaki:heater_lit]
    # - item_sources: [nexo-heater]
    #   lit_item_sources: [nexo-heater_lit]
    heat_item_sources:
      - minecraft-furnace
      - minecraft-smoker
      - minecraft-blast_furnace
    # 加燃料后是否点亮下方热源外观
    ignite_heat_source: true
    # 蒸锅燃料；duration_seconds 为增加的燃烧时间
    fuels:
      - item_sources:
          - minecraft-stick
        duration_seconds: 5
      - item_sources:
          - minecraft-coal
        duration_seconds: 80
      - item_sources:
          - minecraft-charcoal
        duration_seconds: 80
    # 水分输入规则
    moisture_rules:
      - input_item_sources:
          - minecraft-water_bucket
        item_sources:
          - minecraft-bucket
        moisture: 120
      - input_item_sources:
          - minecraft-potion
        item_sources:
          - minecraft-glass_bottle
        moisture: 40
    # 蒸汽耗尽时是否重置全部进度
    reset_progress_when_steam_empty: true
    # 每个周期最多将多少 moisture 转成 steam
    steam_production_efficiency: 10
    # 每次 steam 消耗换算成多少进度
    steam_conversion_efficiency: 1
    # 每个周期的基础 steam 消耗量
    steam_consumption_efficiency: 1
    actions:
      fuel:
        - 'playsound sound=item.bucket.empty volume=0.6 pitch=1.0'
        - 'particle type=FLAME count=3 offset_x=0.1 offset_y=0.1 offset_z=0.1'
      moisture:
        - 'playsound sound=ambient.underwater.enter volume=0.6 pitch=1.2'
        - 'particle type=SPLASH count=5 offset_x=0.2 offset_y=0.1 offset_z=0.2'

  oven:
    # 烤炉主体方块来源；GUI 细节在 gui/oven.yml
    block_item_sources:
      - minecraft-smoker
    interactions:
      open: shift_right_click
      fuel: shift_left_click
      inspect: shift_left_click
    drop_result: true
    # 火力处于 min-max 时才推进烤制计时；过低或过高都会暂停
    heat:
      min: 20
      max: 80
      decay_per_second: 5
    # 烤炉燃料；一次潜行左键会同时增加燃烧时间和火力
    fuels:
      - item_sources:
          - minecraft-stick
        duration_seconds: 5
        heat: 10
      - item_sources:
          - minecraft-coal
        duration_seconds: 80
        heat: 35
      - item_sources:
          - minecraft-charcoal
        duration_seconds: 80
        heat: 35
    actions:
      fuel:
        - 'playsound sound=item.bucket.empty volume=0.6 pitch=1.0'
        - 'particle type=FLAME count=3 offset_x=0.1 offset_y=0.1 offset_z=0.1'

  juicer:
    # 榨汁机方块来源；GUI 细节在 gui/juicer.yml
    block_item_sources:
      - minecraft-cauldron
    interactions:
      open: shift_right_click
      process: shift_left_click
      inspect: left_click
      serve: shift_left_click
    drop_result: true
    only_recipe_items: true
    require_container: true
    # 榨汁机内部默认最大流体容量，单位 ml
    max_fluid_ml: 1000
    # 默认每次容器盛取需要的流体量，单位 ml
    default_serving_ml: 250
    container_item_sources:
      - minecraft-glass_bottle
    drop_completed_result_on_break: false
    actions:
      press:
        - 'playsound sound=block.piston.extend volume=0.6 pitch=1.2'
        - 'particle type=DRIPPING_WATER count=3 offset_x=0.1 offset_y=0.1 offset_z=0.1'
      complete:
        - 'playsound sound=entity.experience_orb.pickup volume=0.8 pitch=1.2'
        - 'particle type=HAPPY_VILLAGER count=5 offset_x=0.3 offset_y=0.2 offset_z=0.3'
      serve:
        - 'playsound sound=item.bucket.fill volume=0.7 pitch=1.0'
        - 'particle type=SPLASH count=4 offset_x=0.2 offset_y=0.1 offset_z=0.2'

  fermentation_barrel:
    # 发酵桶方块来源；GUI 细节在 gui/fermentation_barrel.yml
    block_item_sources:
      - minecraft-barrel
    interactions:
      open: shift_right_click
      start: shift_left_click
      inspect: right_click
      serve: shift_left_click
    drop_result: true
    pause_when_open: true
    require_sealed: true
    only_recipe_items: true
    actions:
      start:
        - 'playsound sound=block.barrel.close volume=0.7 pitch=1.0'
        - 'particle type=SMOKE count=3 offset_x=0.15 offset_y=0.1 offset_z=0.15'
      collect:
        - 'playsound sound=block.barrel.open volume=0.7 pitch=1.0'
        - 'particle type=HAPPY_VILLAGER count=6 offset_x=0.3 offset_y=0.2 offset_z=0.3'
