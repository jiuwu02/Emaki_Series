# EmakiCooking 主配置
# 控制工位交互、展示实体、七类工位运行参数与营养系统。
# 原版物品/方块来源使用 minecraft-iron_axe、mc-iron_axe、v-iron_axe 或 iron_axe；
# 不使用 minecraft:iron_axe 这种冒号写法。
version: "4.3.0"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放内置的 recipes 等默认示例数据。
release_default_data: true

# 全局禁用工位交互的世界列表；命中后不接管方块交互。

input_rules:
  # 严格模式：只允许能继续匹配当前工位配方的物品进入工位输入。
  only_recipe_items: true

display_entities:
  # 展示后端：auto 自动选择；packet_events 优先 PacketEvents；bukkit 使用真实展示实体。
  # PacketEvents 后端不可用时会回退 Bukkit。
  backend: auto
  # packet 后端可见距离，单位：方块。
  view_distance_blocks: 48
  # packet 后端可见性刷新间隔，单位：tick。
  refresh_interval_ticks: 20
  wok:
    # 炒锅内食材展示布局半径，单位：方块。
    layout_radius: 0.26
  # 工位运行时的结果、过程与下一步提示文本；生命周期跟随工位状态。
  text:
    enabled: true
    # billboard: fixed / vertical / horizontal / center（始终朝向玩家）
    billboard: center
    # 文本最大行宽（像素）
    line_width: 200
    # 背景色 ARGB 整数；0 表示完全透明（无背景框）。半透明黑示例：1056964608
    background: 0
    shadow: true
    see_through: false
    defaults:
      # 文本相对工位方块的偏移（默认悬于方块上方居中）
      offset:
        x: 0.5
        y: 1.6
        z: 0.5
      scale:
        x: 1.0
        y: 1.0
        z: 1.0
    # 工位级覆盖；省略的工位继承 defaults，enabled 省略时默认 true
    stations:
      chopping_board:
        enabled: true
      wok:
        enabled: true
      grinder:
        enabled: true
      steamer:
        enabled: true
      oven:
        enabled: true
      juicer:
        enabled: true
      fermentation_barrel:
        enabled: true

display_adjustments:
  defaults:
    item:
      offset:
        x: 0.5
        y: 1.02
        z: 0.5
      rotation:
        x: 90.0
        y: 0.0
        z: 0.0
      scale:
        x: 0.5
        y: 0.5
        z: 0.5
    block:
      offset:
        x: 0.5
        y: 1.125
        z: 0.5
      rotation:
        x: 0.0
        y: 90.0
        z: 0.0
      scale:
        x: 0.25
        y: 0.25
        z: 0.25

  station_defaults:
    # 工位级展示覆盖；当前主要给炒锅预留
    wok:
      item:
        rotation:
          z: "0.0-90.0"

# 七类工位运行配置。
# block_item_sources 任一项命中即可识别工位，支持 minecraft、CraftEngine、
# ItemsAdder、Nexo 与 Oraxen 的 ItemSource shorthand。
stations:
  chopping_board:
    # 砧板方块来源
    block_item_sources:
      - minecraft-oak_log
    # 省略时继承 input_rules.only_recipe_items
    only_recipe_items: true
    interactions:
      place_input: shift_left_click
      process: shift_left_click
      return_input: right_click
    # 结果物是否直接掉落
    drop_result: true
    # 是否检查空间限制
    space_restriction: false
    # 交互最小间隔，单位毫秒
    interaction_delay_ms: 1000
    # 识别为厨刀的判定：完全由 tool_matcher 决定，必填，缺失则没有物品能当厨刀
    tool_matcher:
      type: item_source
      sources:
        - minecraft-iron_axe
    cut_damage:
      enabled: true
      chance: 10
      value: 2
    actions:
      cut:
        - "play_sound sound=entity.player.attack.strong volume=0.7 pitch=1.3"
        - "spawn_particle particle=BLOCK_CRACK count=4 offset_x=0.1 offset_y=0.1 offset_z=0.1"
      complete:
        - "play_sound sound=entity.player.levelup volume=0.8 pitch=1.5"
        - "spawn_particle particle=HAPPY_VILLAGER count=6 offset_x=0.3 offset_y=0.2 offset_z=0.3"
      place:
        - "play_sound sound=block.wood.place volume=0.6 pitch=1.0"

  wok:
    # 炒锅方块来源
    block_item_sources:
      - minecraft-iron_block
    interactions:
      add_ingredient: shift_left_click
      stir: shift_left_click
      serve: shift_left_click
      return_ingredient: shift_left_click
      inspect: shift_right_click
    drop_result: true
    # 是否要求手持碗才能出锅
    need_bowl: true
    # 两次翻炒之间的最小间隔，单位毫秒
    stir_delay_ms: 5000
    # 锅状态超时后按过火处理，单位毫秒
    timeout_ms: 30000
    # 放入食材时是否点亮下方热源外观；锅清空后会尝试熄灭
    ignite_heat_source: true
    # 未命中配方或结果无效时的默认产物来源
    invalid_result_item_sources:
      - minecraft-stone
    # 识别为锅铲的判定：完全由 spatula_matcher 决定，必填，缺失则没有物品能当锅铲
    spatula_matcher:
      type: item_source
      sources:
        - minecraft-iron_shovel
    heat_levels:
      - item_sources:
          - minecraft-campfire
        level: 1
      - item_sources:
          - minecraft-magma_block
        level: 2
      - item_sources:
          - minecraft-lava
        level: 3
    # 翻炒动画配置
    stir_animation:
      enabled: true
      # 动画总时长，单位 tick（20 tick = 1 秒）
      duration_ticks: 20
      # 食材抛起高度，单位格
      height: 1.0
      # 旋转轴：x / y / z
      rotation_axis: x
      # 旋转角度（度）
      rotation_degrees: 360.0
    scald_damage:
      enabled: true
      value: 2
    failure:
      enabled: true
      chance: 5
      item_sources:
        - minecraft-bone_meal
    actions:
      stir:
        - "play_sound sound=entity.player.attack.sweep volume=0.8 pitch=1.2"
        - "spawn_particle particle=FLAME count=6 offset_x=0.2 offset_y=0.1 offset_z=0.2"
      add_ingredient:
        - "play_sound sound=entity.item.pickup volume=0.6 pitch=1.0"
        - "spawn_particle particle=SMOKE count=3 offset_x=0.15 offset_y=0.1 offset_z=0.15"
      serve:
        - "play_sound sound=entity.experience_orb.pickup volume=1.0 pitch=1.2"
        - "spawn_particle particle=HAPPY_VILLAGER count=8 offset_x=0.3 offset_y=0.2 offset_z=0.3"

  grinder:
    # 研磨机方块来源
    block_item_sources:
      - minecraft-grindstone
    interactions:
      start: shift_left_click
    drop_result: true
    # 后台检查周期，单位 tick
    check_delay_ticks: 20
    actions:
      start:
        - "play_sound sound=block.grindstone.use volume=0.7 pitch=1.0"
        - "spawn_particle particle=SMOKE count=3 offset_x=0.15 offset_y=0.15 offset_z=0.15"
      running:
        - "spawn_particle particle=SMOKE count=2 offset_x=0.15 offset_y=0.15 offset_z=0.15"
      complete:
        - "play_sound sound=entity.experience_orb.pickup volume=0.8 pitch=1.2"
        - "spawn_particle particle=HAPPY_VILLAGER count=5 offset_x=0.3 offset_y=0.2 offset_z=0.3"

  steamer:
    # 蒸锅主体方块来源；GUI 细节在 gui/steamer.yml
    block_item_sources:
      - minecraft-barrel
    interactions:
      open: shift_right_click
      fuel: right_click
      moisture: right_click
    drop_result: true
    # 热源方块来源。自定义方块没有可直接切换的 lit 状态时，可使用对象写法作为替换兜底：
    heat_item_sources:
      - minecraft-furnace
      - minecraft-smoker
      - minecraft-blast_furnace
    # 加燃料后是否点亮下方热源外观
    ignite_heat_source: true
    # 蒸锅燃料；duration_seconds 为增加的燃烧时间
    # 每条燃料的判定完全由 matcher 决定，必填，缺失该条燃料永不命中
    # 与烤炉同理：燃料取【首个命中】，窄条目必须写在同物品源的宽条目【之前】。
    fuels:
      # 名字含"油浸"的木棍视为助燃物，燃烧时间显著延长。
      # 物品源与组件条件用 all_of 绑在一起，两者同时成立才算这条燃料。
      # 原版木棍不带 custom_name，故全新服务器上这一条不命中，
      # 普通木棍仍落到下面的宽条目取 5 秒，默认体验不变。
      - matcher:
          type: all_of
          matchers:
            - type: item_source
              sources:
                - minecraft-stick
            - type: component
              component: custom_name
              operator: contains
              value: "油浸"
        duration_seconds: 40
      - matcher:
          type: item_source
          sources:
            - minecraft-stick
        duration_seconds: 5
      - matcher:
          type: item_source
          sources:
            - minecraft-coal
        duration_seconds: 80
      - matcher:
          type: item_source
          sources:
            - minecraft-charcoal
        duration_seconds: 80
    # 水分输入规则
    # 投入物的判定完全由 input_matcher 决定，必填，缺失该条规则永不命中
    # 注意：input_matcher 只管"投入的那一枚"；item_sources 是产出的空容器，
    #       它不是判定位，仍按物品源构造产物，保持原样即可
    moisture_rules:
      - input_matcher:
          type: item_source
          sources:
            - minecraft-water_bucket
        item_sources:
          - minecraft-bucket
        moisture: 120
      - input_matcher:
          type: item_source
          sources:
            - minecraft-potion
        item_sources:
          - minecraft-glass_bottle
        moisture: 40
    # 蒸汽耗尽时是否重置全部进度
    reset_progress_when_steam_empty: true
    # 每个周期最多将多少 moisture 转成 steam
    steam_production_efficiency: 10
    # 每次 steam 消耗换算成多少进度
    steam_conversion_efficiency: 1
    # 每个周期的基础 steam 消耗量
    steam_consumption_efficiency: 1
    actions:
      fuel:
        - "play_sound sound=item.bucket.empty volume=0.6 pitch=1.0"
        - "spawn_particle particle=FLAME count=3 offset_x=0.1 offset_y=0.1 offset_z=0.1"
      moisture:
        - "play_sound sound=ambient.underwater.enter volume=0.6 pitch=1.2"
        - "spawn_particle particle=SPLASH count=5 offset_x=0.2 offset_y=0.1 offset_z=0.2"

  oven:
    # 烤炉主体方块来源；GUI 细节在 gui/oven.yml
    block_item_sources:
      - minecraft-smoker
    interactions:
      open: shift_right_click
      fuel: shift_left_click
      inspect: shift_left_click
    drop_result: true
    # 火力处于 min-max 时才推进烤制计时；过低或过高都会暂停
    heat:
      min: 20
      max: 80
      decay_per_second: 5
    # 烤炉燃料；一次潜行左键会同时增加燃烧时间和火力
    # 每条燃料的判定完全由 matcher 决定，必填，缺失该条燃料永不命中
    # 燃料按本列表顺序取【首个命中】，命中即停。因此窄条目必须写在同物品源的
    # 宽条目【之前】，否则会被前面的宽条目先命中而永不生效。
    fuels:
      # 名字含"精炼"的煤炭视为优质燃料，燃烧更久、火力更高。
      # 物品源与组件条件用 all_of 绑在一起，两者同时成立才算这条燃料。
      # 原版煤炭不带 custom_name，因此在全新服务器上这一条不会命中，
      # 普通煤炭仍按下面的宽条目取 80 秒 / 火力 35，默认体验不变。
      - matcher:
          type: all_of
          matchers:
            - type: item_source
              sources:
                - minecraft-coal
            - type: component
              component: custom_name
              operator: contains
              value: "精炼"
        duration_seconds: 160
        heat: 50
      - matcher:
          type: item_source
          sources:
            - minecraft-stick
        duration_seconds: 5
        heat: 10
      - matcher:
          type: item_source
          sources:
            - minecraft-coal
        duration_seconds: 80
        heat: 35
      - matcher:
          type: item_source
          sources:
            - minecraft-charcoal
        duration_seconds: 80
        heat: 35
    actions:
      fuel:
        - "play_sound sound=item.bucket.empty volume=0.6 pitch=1.0"
        - "spawn_particle particle=FLAME count=3 offset_x=0.1 offset_y=0.1 offset_z=0.1"

  juicer:
    # 榨汁机方块来源；GUI 细节在 gui/juicer.yml
    block_item_sources:
      - minecraft-cauldron
    interactions:
      open: shift_right_click
      process: shift_left_click
      inspect: right_click
      serve: shift_left_click
    drop_result: true
    only_recipe_items: true
    require_container: true
    # 榨汁机内部默认最大流体容量，单位 ml
    max_fluid_ml: 1000
    # 默认每次容器盛取需要的流体量，单位 ml
    default_serving_ml: 250
    # 盛取容器的判定：完全由 container_matcher 决定，必填，缺失则没有物品能当容器
    container_matcher:
      type: item_source
      sources:
        - minecraft-glass_bottle
    actions:
      press:
        - "play_sound sound=block.piston.extend volume=0.6 pitch=1.2"
        - "spawn_particle particle=DRIPPING_WATER count=3 offset_x=0.1 offset_y=0.1 offset_z=0.1"
      complete:
        - "play_sound sound=entity.experience_orb.pickup volume=0.8 pitch=1.2"
        - "spawn_particle particle=HAPPY_VILLAGER count=5 offset_x=0.3 offset_y=0.2 offset_z=0.3"
      serve:
        - "play_sound sound=item.bucket.fill volume=0.7 pitch=1.0"
        - "spawn_particle particle=SPLASH count=4 offset_x=0.2 offset_y=0.1 offset_z=0.2"

  fermentation_barrel:
    # 发酵桶方块来源；GUI 细节在 gui/fermentation_barrel.yml
    block_item_sources:
      - minecraft-barrel
    interactions:
      open: shift_right_click
      start: shift_left_click
      inspect: right_click
      serve: shift_left_click
    drop_result: true
    pause_when_open: true
    only_recipe_items: true
    actions:
      start:
        - "play_sound sound=block.barrel.close volume=0.7 pitch=1.0"
        - "spawn_particle particle=SMOKE count=3 offset_x=0.15 offset_y=0.1 offset_z=0.15"
      collect:
        - "play_sound sound=block.barrel.open volume=0.7 pitch=1.0"
        - "spawn_particle particle=HAPPY_VILLAGER count=6 offset_x=0.3 offset_y=0.2 offset_z=0.3"

# ============================================================
# 营养系统
# ============================================================
# 营养类型在 nutrition/<id>.yml 中定义，数值限制在对应类型的 min～max 范围内。
# 食物规则、阈值 actions 与营养操作段均使用 CoreLib 动作流水线。
# 可用营养动作：cooking_add_nutrition、cooking_remove_nutrition、
# cooking_set_nutrition、cooking_reset_nutrition、cooking_clear_nutrition。
# add/remove/set 需要 type 与 amount，并作用于当前动作目标玩家。
# PlaceholderAPI 占位符：%emakicooking_nutrition_<type>%、
# %emakicooking_nutrition_<type>_max%、%emakicooking_nutrition_<type>_min%、
# %emakicooking_nutrition_combo_count_<规则id>%。
nutrition:
  # 是否启用营养系统。
  enabled: true
  # 玩家营养数据定时保存间隔，单位：秒；0 表示不启用定时保存。
  save_interval_seconds: 300

  # 食物来源：食用命中 matcher 的物品时，应用 nutrition 与 actions。
  # 每条规则的判定完全由 matcher 决定，必填，缺失该条规则永不命中。
  # 按物品源判定就写 type: item_source，sources 支持 minecraft、craftengine、
  # itemsadder、nexo、oraxen、mmoitems、neigeitems 来源。
  # 要收窄成"名字含【慢炖】的苹果"这类条件，就换成 all_of 组合写法（见第一条注释）。
  food_sources:
    - matcher:
        type: item_source
        sources:
          - minecraft-apple
          - minecraft-sweet_berries
      nutrition:
        fruit: 20
    - matcher:
        type: item_source
        sources:
          - minecraft-golden_apple
          - minecraft-enchanted_golden_apple
      nutrition:
        fruit: 35
        sugar: 10
    - matcher:
        type: item_source
        sources:
          - minecraft-carrot
          - minecraft-potato
          - minecraft-beetroot
      nutrition:
        vegetable: 20
    - matcher:
        type: item_source
        sources:
          - minecraft-cooked_beef
          - minecraft-cooked_porkchop
          - minecraft-cooked_chicken
          - minecraft-cooked_mutton
      nutrition:
        protein: 25
    - matcher:
        type: item_source
        sources:
          - minecraft-cake
          - minecraft-cookie
          - minecraft-pumpkin_pie
      nutrition:
        sugar: 30
      actions:
        - "play_sound sound=entity.player.burp volume=1.0 pitch=1.0"
    - matcher:
        type: item_source
        sources:
          - minecraft-bread
          - minecraft-baked_potato
      nutrition:
        grain: 25

  thresholds:
    # 单营养类型阈值：某营养类型满足条件时触发；从满足跌回不满足时触发 on_recover。
    # types 为空表示适用于全部营养类型。采用边沿触发，不会每次数值变化都重复执行。
    single:
      # 示例：任意营养类型 >= 80 时给玩家持续饱和 BUFF（用循环动作实现），跌回 <80 时取消循环
      - id: well_fed
        value: 80
        compare: ">="
        actions:
          # 用长期任务持续给 BUFF；key 绑定玩家与营养类型，避免重复。
          # times 受 EmakiCoreLib 的 action.loop.max_times 限制。
          # 营养跌回阈值下方时由 on_recover 取消；玩家离线时也会停止。
          - "start_task sequence=nutrition_well_fed times=100 interval=40t key=nutrition_wellfed:%caster.uuid%:%var.nutrition_type% on_conflict=replace stop_when_offline=true"
        on_recover:
          - "stop_task key=nutrition_wellfed:%caster.uuid%:%var.nutrition_type%"

    # 组合阈值：当满足条件的营养类型数量达到 required_count 时触发（还原膳食均衡"5 大营养满了反胃"）。
    # required_count 默认 5，可自配，不强制等于营养类型总数。
    combo:
      - id: overeat
        # 参与统计的营养类型；为空表示统计全部营养类型
        # 每个营养类型达到该值算"已满"
        value: 100
        compare: ">="
        # 需要多少个营养类型同时达到上述值才触发反胃
        required_count: 5
        actions:
          # 反胃提示 + 催吐效果
          - "send_message text=<red>你吃得太撑了，开始反胃……"
          - "play_sound sound=entity.player.burp volume=1.0 pitch=0.8"
          - "give_potion_effect type=NAUSEA level=1 duration=200"
          # 启动长期任务：每 2 秒扣除全部营养各 5 点，直到某营养跌到 0。
          # 序列内的 stop_task 会在水果营养 <=0 时结束任务。
          # times 受 EmakiCoreLib 的 action.loop.max_times 限制。
          - "start_task sequence=nutrition_decay times=100 interval=40t key=nutrition_overeat:%caster.uuid% on_conflict=replace stop_when_offline=true"
        on_recover:
          - "stop_task key=nutrition_overeat:%caster.uuid%"
