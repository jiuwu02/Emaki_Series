name: EmakiCooking
main: emaki.jiuwu.craft.cooking.EmakiCookingPlugin
version: ${project.version}
api-version: "1.21"
folia-supported: true
depend:
  - EmakiCoreLib
softdepend:
  - PlaceholderAPI
  - CraftEngine
  - ItemsAdder
  - Nexo
  - Oraxen
  - PacketEvents
  - MMOItems
  - NeigeItems
commands:
  ecooking:
    aliases: [ec]
    permission: emakicooking.use
permissions:
  emakicooking.use:
    default: true
  emakicooking.reload:
    default: op
  emakicooking.inspect:
    default: op
  emakicooking.admin:
    default: op
  emakicooking.debug:
    default: op
  emakicooking.station.chopping_board.use:
    default: true
  emakicooking.station.chopping_board.cut:
    default: true
  emakicooking.station.wok.use:
    default: true
  emakicooking.station.wok.stir:
    default: true
  emakicooking.station.wok.serve:
    default: true
  emakicooking.station.grinder.use:
    default: true
  emakicooking.station.steamer.use:
    default: true
  emakicooking.station.steamer.fuel:
    default: true
  emakicooking.station.steamer.moisture:
    default: true
  emakicooking.station.oven.use:
    default: true
  emakicooking.station.oven.fuel:
    default: true
  emakicooking.station.juicer.use:
    default: true
  emakicooking.station.juicer.press:
    default: true
  emakicooking.station.juicer.collect:
    default: true
  emakicooking.station.fermentation_barrel.use:
    default: true
  emakicooking.station.fermentation_barrel.start:
    default: true
  emakicooking.station.fermentation_barrel.collect:
    default: true
  emakicooking.nutrition.use:
    default: true
  emakicooking.nutrition.admin:
    default: op
