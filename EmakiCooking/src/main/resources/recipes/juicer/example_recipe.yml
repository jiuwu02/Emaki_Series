# ============================================================
# EmakiCooking 榨汁机配方示例
# ============================================================
# 此文件定义了一个榨汁机（Juicer）配方，展示所有可用字段和推荐写法。
# 榨汁机是按压型烹饪设备，玩家需要多次按压来榨取液体，
# 然后用容器收集成品。
#
# 文件放置位置: plugins/EmakiCooking/recipes/juicer/
# 文件名即为配方的内部标识，加载时自动注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称
display_name: "苹果汁"

# ============================================================
# 输入食材
# ============================================================
# 放入榨汁机的原料物品。
input:
  item_sources:
    - "minecraft-apple"

# ============================================================
# 榨汁参数
# ============================================================
# presses_required: 完成榨汁所需的按压次数
presses_required: 5

# ============================================================
# 液体配置
# ============================================================
# id: 液体类型标识
# display_name: 液体显示名称
# amount_ml: 每次榨取产生的液体量（毫升）
fluid:
  id: "apple_juice"
  display_name: "苹果汁"
  amount_ml: 180

# ============================================================
# 容器配置
# ============================================================
# item_sources: 用于收集液体的容器物品
# serving_ml: 每个容器可装的液体量（毫升）
container:
  item_sources:
    - "minecraft-glass_bottle"
  serving_ml: 250

# 使用此配方所需的权限节点
permission: "emakicooking.recipe.apple_juice"

# ============================================================
# 完成条件（true/false 动作分支）
# ============================================================
# 字段说明详见 chopping_board/example_recipe.yml。
condition:
  condition_type: all_of
  conditions:
    - "%player_level% >= 1"
  true_actions:
    - 'sendmessage text="<aqua>榨汁条件满足。</aqua>"'
  false_actions:
    - 'sendmessage text="<red>榨汁条件不满足。</red>"'
  block_output_on_false: false

# ============================================================
# 榨汁结果
# ============================================================
# success: 榨汁完成后的结果分支
#   outputs: 产出物品列表
#   actions: 完成时执行的动作
result:
  success:
    outputs:
      - item_sources:
          - "minecraft-honey_bottle"
        amount: 1
    actions:
      - 'sendmessage text="<aqua>榨汁完成。</aqua>"'
