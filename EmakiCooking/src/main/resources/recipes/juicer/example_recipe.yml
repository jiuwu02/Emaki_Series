# ============================================================
# EmakiCooking 榨汁机配方示例
# ============================================================
# 榨汁机是按压型烹饪设备，玩家需要多次按压来榨取液体，
# 然后用容器收集成品。
# ============================================================

id: "example_recipe"

display_name: "苹果汁"

# ============================================================
# 输入食材
# ============================================================
# 放入榨汁机的原料物品。判定完全由 matcher 决定，必填，缺失这条配方永不命中。
input:
  matcher:
    type: item_source
    sources:
      - minecraft-apple

# ============================================================
# 榨汁参数
# ============================================================
# presses_required: 完成榨汁所需的按压次数
presses_required: 5

# ============================================================
# 液体配置
# ============================================================
# id: 液体类型标识
# display_name: 液体显示名称
# amount_ml: 每次榨取产生的液体量（毫升）
fluid:
  id: "apple_juice"
  display_name: "苹果汁"
  amount_ml: 180

# ============================================================
# 容器配置
# ============================================================
# matcher: 判定哪个物品算合格容器，必填，缺失则本配方无法盛取
#          写在这里会覆盖 config.yml 的 stations.juicer.container_matcher
# serving_ml: 每个容器可装的液体量（毫升）
container:
  matcher:
    type: item_source
    sources:
      - minecraft-glass_bottle
  serving_ml: 250

permission: "emakicooking.recipe.apple_juice"

# ============================================================
# 完成条件（true/false 动作分支）
# ============================================================
condition:
  type: all_of
  entries:
    - "%player_level% >= 1"
  on_pass:
    actions:
      - 'send_message text="<aqua>榨汁条件满足。</aqua>"'
  on_fail:
    actions:
      - 'send_message text="<red>榨汁条件不满足。</red>"'
    block_output: false

# ============================================================
# 榨汁结果
# ============================================================
# success: 榨汁完成后的结果分支
#   outputs: 产出物品列表
#   actions: 完成时执行的动作
result:
  success:
    outputs:
      - item_sources:
          - "minecraft-honey_bottle"
        amount: 1
    actions:
      - 'send_message text="<aqua>榨汁完成。</aqua>"'
