# ============================================================
# EmakiCooking 砧板配方示例
# ============================================================
# 此文件定义了一个砧板（Chopping Board）配方，展示所有可用字段。
# 砧板是交互型加工设备，玩家需要多次点击来切割食材。
# 使用砧板需要手持工具（如刀），工具会受到耐久损耗。
#
# 文件放置位置: plugins/EmakiCooking/recipes/chopping_board/
# 文件名仅用于组织和错误诊断；配方内部标识由必填 id 字段决定，加载时按 id 注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称
display_name: "切制胡萝卜"

# ============================================================
# 输入食材
# ============================================================
# 放在砧板上的原料物品。
# amount: 每次完成切割需要并消耗的数量；砧板会一次性接收主手整叠并累计数量。
input:
  matcher:
    type: item_source
    sources:
      - "minecraft-carrot"
  amount: 1

  # ----------------------------------------------------------
  # matcher：输入判定的唯一入口
  # ----------------------------------------------------------
  # 判定完全由 matcher 决定，它是必填项，缺失这条配方永不命中。
  # 按物品源判定就写 type: item_source（上面即是）；要收窄到"这一枚够不够格"，
  # 就用 all_of 把物品源与组件条件绑在一起，见下例。
  #
  # 注意书写差异：
  #   物品源简写用【连字符】       —— "minecraft-carrot"
  #   组件 ID / path 用【冒号】     —— component: custom_name / path: "minecraft:sharpness"
  #
  # 下例含义：必须是胡萝卜，且物品名里带"极上"二字，才算这条配方的输入。
  # 要启用就用它【替换】上方那条 matcher，不要两条并留。
  #
  # matcher:
  #   type: all_of
  #   matchers:
  #     - { type: item_source, sources: ["minecraft-carrot"] }
  #     - { type: component, component: custom_name, operator: contains, value: "极上" }
  #
  # 更多可用写法：
  #   operator 可选 exists / absent / == / != / > / >= / < / <=
  #                contains / starts_with / ends_with / regex
  #                has_key / has_value / size
  #   组合类型 all_of(and) / any_of(or) / none_of(not)
  #           at_least + required_count / exactly + required_count
  #
  # 例：附魔锋利 >= 3，且不是被标记为"次品"的物品
  # matcher:
  #   type: all_of
  #   matchers:
  #     - { type: component, component: enchantments, path: "minecraft:sharpness", operator: ">=", value: 3 }
  #     - type: none_of
  #       matchers:
  #         - { type: component, component: custom_name, operator: contains, value: "次品" }

# ============================================================
# 切割参数
# ============================================================
# cuts_required: 完成切割所需的点击次数；当为 1 时，可对已放入的一批食材连续切割
# tool_damage: 每次切割对工具造成的耐久损耗
cuts_required: 3
tool_damage: 1

# 使用此配方所需的权限节点
permission: "emakicooking.recipe.cut_carrot"

# ============================================================
# 完成条件（pass/fail 动作分支）
# ============================================================
# condition: 配方完成时评估的条件块（独立于 permission 权限门槛）。
#   type: 组合方式 all_of / any_of / none_of / at_least / exactly
#   required_count: 当 type 为 at_least / exactly 时生效
#   entries: 条件表达式列表，支持 %player_level% 等花括号变量与比较运算符
#   on_pass.actions: 条件成立时执行的动作
#   on_fail.actions: 条件不成立时执行的动作
#   on_fail.block_output: 条件不成立时是否阻止产出（默认 false，仅执行 fail 动作，产出照常）
# 留空或不配置 condition 块则始终视为成立。玩家离线时同样视为成立。
condition:
  type: all_of
  entries:
    - "%player_level% >= 3"
  on_pass:
    actions:
      - 'send_message text="<green>条件满足，切制成功。</green>"'
  on_fail:
    actions:
      - 'send_message text="<red>等级不足 3 级，无法切出金胡萝卜。</red>"'
    block_output: true

# ============================================================
# 切割结果
# ============================================================
# success: 切割完成后的结果分支
#   outputs: 产出物品列表
#   actions: 完成时执行的动作
result:
  success:
    outputs:
      - item_sources:
          - "minecraft-golden_carrot"
        amount: 1
    actions:
      - 'send_message text="<green>砧板处理完成。</green>"'

# ============================================================
# 工具损坏覆盖
# ============================================================
# 自定义工具损坏的概率和数值（覆盖默认的 tool_damage）。
# chance: 触发额外损坏的概率（百分比）
# value: 额外损坏的耐久值
damage_override:
  chance: 5
  value: 1
