# ============================================================
# EmakiCooking 砧板配方示例
# ============================================================
# 此文件定义了一个砧板（Chopping Board）配方，展示所有可用字段。
# 砧板是交互型加工设备，玩家需要多次点击来切割食材。
# 使用砧板需要手持工具（如刀），工具会受到耐久损耗。
#
# 文件放置位置: plugins/EmakiCooking/recipes/chopping_board/
# 文件名即为配方的内部标识，加载时自动注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称
display_name: "切制胡萝卜"

# ============================================================
# 输入食材
# ============================================================
# 放在砧板上的原料物品。
input:
  item_sources:
    - "minecraft-carrot"

# ============================================================
# 切割参数
# ============================================================
# cuts_required: 完成切割所需的点击次数
# tool_damage: 每次切割对工具造成的耐久损耗
cuts_required: 3
tool_damage: 1

# 使用此配方所需的权限节点
permission: "emakicooking.recipe.cut_carrot"

# ============================================================
# 切割结果
# ============================================================
# outputs: 切割完成后的产出物品列表
# actions: 切割完成时执行的动作
result:
  outputs:
    - item_sources:
        - "minecraft-golden_carrot"
      amount: 1
  actions:
    - 'sendmessage text="<green>砧板处理完成。</green>"'

# ============================================================
# 工具损坏覆盖
# ============================================================
# 自定义工具损坏的概率和数值（覆盖默认的 tool_damage）。
# chance: 触发额外损坏的概率（百分比）
# value: 额外损坏的耐久值
damage_override:
  chance: 5
  value: 1
