# ============================================================
# EmakiCooking 烤炉配方示例
# ============================================================
# 此文件定义了一个烤炉（Oven）配方，展示所有可用字段和推荐写法。
# 烤炉是温度敏感型烹饪设备，玩家需要控制温度在合适范围内，
# 并在正确的时间取出食物，否则会烤焦或未熟。
#
# 文件放置位置: plugins/EmakiCooking/recipes/oven/
# 文件名仅用于组织和错误诊断；配方内部标识由必填 id 字段决定，加载时按 id 注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称
display_name: "烤马铃薯"

# ============================================================
# 输入食材
# ============================================================
# 放入烤炉的原料物品。判定完全由 matcher 决定，必填，缺失这条配方永不命中。
input:
  matcher: { type: item_source, sources: ["minecraft-potato"] }

# ============================================================
# 烘烤参数
# ============================================================
# bake_time_seconds: 基础烘烤时间（秒）
# baking: 烘烤品质控制
#   perfect_heat: 完美温度范围（min-max）
#   perfect_required_ratio: 在完美温度范围内的时间占比要求（0.0-1.0）
#   overbake_seconds: 超时多少秒后视为烤焦
bake_time_seconds: 20

baking:
  perfect_heat:
    min: 45
    max: 60
  perfect_required_ratio: 0.7
  overbake_seconds: 10

# 使用此配方所需的权限节点
permission: "emakicooking.recipe.baked_potato"

# ============================================================
# 完成条件（true/false 动作分支）
# ============================================================
# 字段说明详见 chopping_board/example_recipe.yml。
# 烤炉会在烤制完成（普通/完美/过烤）时统一评估此条件。
condition:
  type: all_of
  entries:
    - "%player_level% >= 2"
  on_pass:
    actions:
      - 'send_message text="<gold>烤制条件满足。</gold>"'
  on_fail:
    actions:
      - 'send_message text="<red>烤制条件不满足。</red>"'
    block_output: false

# ============================================================
# 烘烤结果
# ============================================================
# success: 烘烤完成后的普通结果分支
# perfect: 完美火力完成时的覆盖结果分支
# overbaked: 过烤完成时的覆盖结果分支
result:
  success:
    outputs:
      - item_sources:
          - "minecraft-baked_potato"
        amount: 1
    actions:
      - 'send_message text="<gold>烤制完成。</gold>"'
  perfect:
    outputs:
      - item_sources:
          - "minecraft-baked_potato"
        amount: 1
    actions:
      - 'send_message text="<green>火候完美，烤制完成。</green>"'
  overbaked:
    outputs:
      - item_sources:
          - "minecraft-charcoal"
        amount: 1
    actions:
      - 'send_message text="<red>烤过头了。</red>"'
