# ============================================================
# EmakiCooking 烤炉配方示例
# ============================================================
# 此文件定义了一个烤炉（Oven）配方，展示所有可用字段和推荐写法。
# 烤炉是温度敏感型烹饪设备，玩家需要控制温度在合适范围内，
# 并在正确的时间取出食物，否则会烤焦或未熟。
#
# 文件放置位置: plugins/EmakiCooking/recipes/oven/
# 文件名即为配方的内部标识，加载时自动注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称
display_name: "烤马铃薯"

# ============================================================
# 输入食材
# ============================================================
# 放入烤炉的原料物品。
input:
  item_sources:
    - "minecraft-potato"

# ============================================================
# 烘烤参数
# ============================================================
# bake_time_seconds: 基础烘烤时间（秒）
# baking: 烘烤品质控制
#   perfect_heat: 完美温度范围（min-max）
#   perfect_required_ratio: 在完美温度范围内的时间占比要求（0.0-1.0）
#   overbake_seconds: 超时多少秒后视为烤焦
bake_time_seconds: 20

baking:
  perfect_heat:
    min: 45
    max: 60
  perfect_required_ratio: 0.7
  overbake_seconds: 10

# 使用此配方所需的权限节点
permission: "emakicooking.recipe.baked_potato"

# ============================================================
# 烘烤结果
# ============================================================
# output: 烘烤完成后的产出物品
result:
  output:
    item_sources:
      - "minecraft-baked_potato"
    amount: 1
    actions:
      - 'sendmessage text="<gold>烤制完成。</gold>"'
