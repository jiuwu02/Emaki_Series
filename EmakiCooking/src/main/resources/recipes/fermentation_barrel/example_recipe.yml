# ============================================================
# EmakiCooking 发酵桶配方示例
# ============================================================
# 发酵桶是长时间型加工设备，支持提前收取（半成品）和过度发酵（变质品）。
# ============================================================

id: "example_recipe"

display_name: "苹果酒"

# ============================================================
# 输入食材
# ============================================================
# 放入发酵桶的原料物品列表（支持多种原料）。
# 判定完全由 matcher 决定：matcher 是必填项，缺失该条原料永不命中。
# item_sources 已经不参与判定，这里保留它只有一个用途——作为该条原料的聚合键，
# 与桶内持久化的槽位状态对齐。所以两者并写：matcher 判"这一枚算不算这味原料"，
# item_sources 决定"投进去的量归并到哪个槽"。
inputs:
  - item_sources:
      - "minecraft-apple"
    matcher: { type: item_source, sources: ["minecraft-apple"] }
    amount: 3
  - item_sources:
      - "minecraft-sugar"
    matcher: { type: item_source, sources: ["minecraft-sugar"] }
    amount: 1

# ============================================================
# 发酵参数
# ============================================================
# fermentation_time_seconds: 正常发酵完成时间（秒）
# fermentation: 发酵过程控制
#   early_collect: 提前收取配置
#     min_progress_ratio: 最早可收取的进度比例（0.0-1.0）
#   over_time_seconds: 超时多少秒后视为过度发酵
# 提前收取和过度发酵产物统一配置在 result.early / result.over。
fermentation_time_seconds: 300

fermentation:
  early_collect:
    min_progress_ratio: 0.5
  over_time_seconds: 600

permission: "emakicooking.recipe.apple_cider"

# ============================================================
# 完成条件（true/false 动作分支）
# ============================================================
# 发酵桶会在收取（正常/提前/过度）时统一评估此条件。
# 注意：自动完成或破坏掉落时玩家可能离线，此时条件视为成立。
condition:
  type: all_of
  entries:
    - "%player_level% >= 4"
  on_pass:
    actions:
      - 'send_message text="<gold>发酵收取条件满足。</gold>"'
  on_fail:
    actions:
      - 'send_message text="<red>发酵收取条件不满足。</red>"'
    block_output: false

# ============================================================
# 发酵结果
# ============================================================
# success: 正常发酵完成后的结果分支
# early: 提前收取时的结果分支
# over: 过度发酵时的结果分支
result:
  success:
    outputs:
      - item_sources:
          - "minecraft-honey_bottle"
        amount: 1
    actions:
      - 'send_message text="<gold>发酵完成。</gold>"'
  early:
    outputs:
      - item_sources:
          - "minecraft-potion"
        amount: 1
    actions:
      - 'send_message text="<yellow>提前收取了半发酵苹果饮。</yellow>"'
  over:
    outputs:
      - item_sources:
          - "minecraft-honey_bottle"
        amount: 1
    actions:
      - 'send_message text="<gold>苹果酒已经继续转化为酸甜果醋。</gold>"'
