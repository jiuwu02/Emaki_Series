id: "apple_cider"

display_name: "苹果酒"

inputs:
  - item_sources:
      - "minecraft-apple"
    amount: 3
  - item_sources:
      - "minecraft-sugar"
    amount: 1

fermentation_time_seconds: 300

fermentation:
  early_collect:
    min_progress_ratio: 0.5
    output:
      item_sources:
        - "minecraft-potion"
      amount: 1
      actions:
        - "sendmessage text=\"<yellow>提前收取了半发酵苹果饮。</yellow>\""
  over_time_seconds: 600
  over_output:
    item_sources:
      - "minecraft-honey_bottle"
    amount: 1
    actions:
      - "sendmessage text=\"<gold>苹果酒已经继续转化为酸甜果醋。</gold>\""

permission: "emakicooking.recipe.apple_cider"

result:
  output:
    item_sources:
      - "minecraft-honey_bottle"
    amount: 1
    actions:
      - "sendmessage text=\"<gold>发酵完成。</gold>\""

structured_presentation: {}
