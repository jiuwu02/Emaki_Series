# ============================================================
# EmakiCooking 炒锅配方示例
# ============================================================
# 此文件定义了一个炒锅（Wok）配方，展示所有可用字段和推荐写法。
# 炒锅是交互式烹饪设备，玩家需要按照正确的顺序和次数翻炒食材。
#
# 文件放置位置: plugins/EmakiCooking/recipes/wok/
# 文件名即为配方的内部标识，加载时自动注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称
display_name: "简易炖菜"

# ============================================================
# 食材列表
# ============================================================
# 定义此配方需要的食材及其翻炒规则。
# item_sources: 食材物品来源
# amount: 需要的数量
# stir_rule: 翻炒规则（格式: "最早翻炒次序-最晚翻炒次序"）
#   例如 "1-3" 表示此食材应在第 1 到第 3 次翻炒时加入
ingredients:
  - item_sources:
      - "minecraft-carrot"
    amount: 1
    stir_rule: "1-3"
  - item_sources:
      - "minecraft-cooked_chicken"
    amount: 1
    stir_rule: "2-3"

# ============================================================
# 烹饪参数
# ============================================================
# heat_level: 火力等级（影响烹饪速度和结果品质）
# stir_total: 总翻炒次数范围（min-max）
# fault_tolerance: 容错次数（允许的错误翻炒次数，超过则失败）
heat_level: 1

stir_total:
  min: 2
  max: 5

fault_tolerance: 0

# 使用此配方所需的权限节点
permission: "emakicooking.recipe.simple_stew"

# ============================================================
# 烹饪结果
# ============================================================
# success: 正确烹饪时的产出
# undercooked: 翻炒不足时的产出
# overcooked: 翻炒过度时的产出
# invalid: 食材组合错误时的产出
result:
  success:
    item_sources:
      - "minecraft-rabbit_stew"
    amount: 1
    actions:
      - 'sendmessage text="<green>成功出锅。</green>"'
  undercooked:
    item_sources:
      - "minecraft-mushroom_stew"
    amount: 1
  overcooked:
    item_sources:
      - "minecraft-dried_kelp"
    amount: 1
  invalid:
    item_sources:
      - "minecraft-stone"
    amount: 1
