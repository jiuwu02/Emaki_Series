# ============================================================
# EmakiCooking 炒锅配方示例
# ============================================================
# 此文件定义了一个炒锅（Wok）配方，展示所有可用字段和推荐写法。
# 炒锅是交互式烹饪设备，玩家需要按照正确的顺序和次数翻炒食材。
#
# 文件放置位置: plugins/EmakiCooking/recipes/wok/
# 文件名仅用于组织和错误诊断；配方内部标识由必填 id 字段决定，加载时按 id 注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称
display_name: "简易炖菜"

# ============================================================
# 食材列表
# ============================================================
# 定义此配方需要的食材及其翻炒规则。
# item_sources: 食材物品来源
# amount: 需要的数量
# stir_rule: 翻炒规则（格式: "最早翻炒次序-最晚翻炒次序"）
#   例如 "1-3" 表示此食材应在第 1 到第 3 次翻炒时加入
# matcher: 可选的组件条件，逐个食材独立配置（详见下方说明）
ingredients:
  - item_sources:
      - "minecraft-carrot"
    amount: 1
    stir_rule: "1-3"
  - item_sources:
      - "minecraft-cooked_chicken"
    amount: 1
    stir_rule: "2-3"

# ============================================================
# 可选：食材的 matcher 组件条件
# ============================================================
# item_sources 决定"是哪种食材"，matcher 决定"这一枚具体够不够格"。
# 两者并存：先按 item_sources 对齐食材顺序，再用 matcher 复核玩家刚下锅的那一枚。
# 不写 matcher（或留空）时行为与旧版完全一致，不影响任何现有配方。
#
# 注意书写差异：
#   物品源简写用【连字符】       —— "minecraft-beef"
#   组件 ID / path 用【冒号】     —— component: custom_name / path: "minecraft:sharpness"
#
# 下例把上面第二味食材换成"只认极上牛肉"的写法，取消注释后替换 ingredients 即可：
#
# ingredients:
#   - item_sources:
#       - "minecraft-carrot"
#     amount: 1
#     stir_rule: "1-3"
#   - item_sources:
#       - "minecraft-beef"
#     amount: 1
#     stir_rule: "2-3"
#     # 只有名字含"极上"的牛肉才算这一味食材
#     matcher:
#       type: all_of
#       matchers:
#         - { type: item_source, sources: ["minecraft-beef"] }
#         - { type: component, component: custom_name, operator: contains, value: "极上" }
#
# 组合五态均可使用：
#   all_of(and) / any_of(or) / none_of(not)
#   at_least + required_count / exactly + required_count
#
# 例：以下三条至少满足两条才算合格食材
# matcher:
#   type: at_least
#   required_count: 2
#   matchers:
#     - { type: component, component: custom_name, operator: contains, value: "极上" }
#     - { type: component, component: rarity, operator: "==", value: epic }
#     - { type: component, component: enchantments, operator: exists }

# ============================================================
# 烹饪参数
# ============================================================
# heat_level: 火力等级（影响烹饪速度和结果品质）
# stir_total: 总翻炒次数范围（min-max）
# fault_tolerance: 容错次数（允许的错误翻炒次数，超过则失败）
heat_level: 1

stir_total:
  min: 2
  max: 5

fault_tolerance: 0

# 使用此配方所需的权限节点
permission: "emakicooking.recipe.simple_stew"

# ============================================================
# 完成条件（true/false 动作分支）
# ============================================================
# 字段说明详见 chopping_board/example_recipe.yml。
# 炒锅会在出锅（成功/欠火/过火/失败）时统一评估此条件。
condition:
  type: all_of
  entries:
    - "%player_level% >= 5"
  on_pass:
    actions:
      - 'send_message text="<green>厨艺达标，出锅成功。</green>"'
  on_fail:
    actions:
      - 'send_message text="<red>厨艺等级不足，出锅失败。</red>"'
    block_output: true

# ============================================================
# 烹饪结果
# ============================================================
# success: 正确烹饪时的结果分支
# undercooked: 翻炒不足时的结果分支
# overcooked: 翻炒过度时的结果分支
# invalid: 食材组合错误时的结果分支
# 每个结果分支都使用 outputs/actions 结构。
result:
  success:
    outputs:
      - item_sources:
          - "minecraft-rabbit_stew"
        amount: 1
    actions:
      - 'send_message text="<green>成功出锅。</green>"'
  undercooked:
    outputs:
      - item_sources:
          - "minecraft-mushroom_stew"
        amount: 1
    actions: []
  overcooked:
    outputs:
      - item_sources:
          - "minecraft-dried_kelp"
        amount: 1
    actions: []
  invalid:
    outputs:
      - item_sources:
          - "minecraft-stone"
        amount: 1
    actions: []
