# ============================================================
# EmakiCooking 研磨机配方示例
# ============================================================
# 此文件定义了一个研磨机（Grinder）配方，展示所有可用字段和推荐写法。
# 研磨机是时间型加工设备，将原料研磨成粉末或碎片。
#
# 文件放置位置: plugins/EmakiCooking/recipes/grinder/
# 文件名即为配方的内部标识，加载时自动注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称
display_name: "骨粉研磨"

# ============================================================
# 输入食材
# ============================================================
# 放入研磨机的原料物品。
input:
  item_sources:
    - "minecraft-bone"

# ============================================================
# 研磨参数
# ============================================================
# grind_time_seconds: 研磨所需时间（秒）
grind_time_seconds: 6

# 使用此配方所需的权限节点
permission: "emakicooking.recipe.bone_meal"

# ============================================================
# 研磨结果
# ============================================================
# outputs: 研磨完成后的产出物品列表（支持多种产出）
# actions: 研磨完成时执行的动作
result:
  outputs:
    - item_sources:
        - "minecraft-bone_meal"
      amount: 3
  actions:
    - 'sendmessage text="<gray>研磨结束。</gray>"'
