# ============================================================
# EmakiCooking 研磨机配方示例
# ============================================================
# 此文件定义了一个研磨机（Grinder）配方，展示所有可用字段和推荐写法。
# 研磨机是时间型加工设备，将原料研磨成粉末或碎片。
#
# 文件放置位置: plugins/EmakiCooking/recipes/grinder/
# 文件名仅用于组织和错误诊断；配方内部标识由必填 id 字段决定，加载时按 id 注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称
display_name: "骨粉研磨"

# ============================================================
# 输入食材
# ============================================================
# 放入研磨机的原料物品。判定完全由 matcher 决定，必填，缺失这条配方永不命中。
input:
  matcher: { type: item_source, sources: ["minecraft-bone"] }

# ============================================================
# 研磨参数
# ============================================================
# grind_time_seconds: 研磨所需时间（秒）
grind_time_seconds: 6

# 使用此配方所需的权限节点
permission: "emakicooking.recipe.bone_meal"

# ============================================================
# 完成条件（true/false 动作分支）
# ============================================================
# 字段说明详见 chopping_board/example_recipe.yml。
# type: all_of / any_of / none_of / at_least / exactly
# on_fail.block_output: 条件不成立是否阻止产出（默认 false）
condition:
  type: all_of
  entries:
    - "%player_level% >= 1"
  on_pass:
    actions:
      - 'send_message text="<gray>研磨条件满足。</gray>"'
  on_fail:
    actions:
      - 'send_message text="<red>研磨条件不满足。</red>"'
    block_output: false

# ============================================================
# 研磨结果
# ============================================================
# success: 研磨完成后的结果分支
#   outputs: 产出物品列表（支持多种产出）
#   actions: 完成时执行的动作
result:
  success:
    outputs:
      - item_sources:
          - "minecraft-bone_meal"
        amount: 3
    actions:
      - 'send_message text="<gray>研磨结束。</gray>"'
