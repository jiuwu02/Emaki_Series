# ============================================================
# EmakiCooking 蒸笼配方示例
# ============================================================
# 此文件定义了一个蒸笼（Steamer）配方，展示所有可用字段和推荐写法。
# 蒸笼是时间型烹饪设备，食材放入后需要积累足够的蒸汽量才能完成。
#
# 文件放置位置: plugins/EmakiCooking/recipes/steamer/
# 文件名即为配方的内部标识，加载时自动注册。
# ============================================================

# 配方唯一标识符（必填）
id: "example_recipe"

# 配方显示名称
display_name: "清蒸鳕鱼"

# ============================================================
# 输入食材
# ============================================================
# 放入蒸笼的原料物品。
input:
  item_sources:
    - "minecraft-cod"

# ============================================================
# 蒸制参数
# ============================================================
# required_steam: 完成蒸制所需的蒸汽量
# 蒸汽量随时间自然积累，积累速度取决于蒸笼的火力配置。
required_steam: 40

# 使用此配方所需的权限节点
permission: "emakicooking.recipe.steamed_cod"

# ============================================================
# 完成条件（true/false 动作分支）
# ============================================================
# 字段说明详见 chopping_board/example_recipe.yml。
condition:
  type: all_of
  entries:
    - "%player_level% >= 2"
  on_pass:
    actions:
      - 'sendmessage text="<aqua>蒸制条件满足。</aqua>"'
  on_fail:
    actions:
      - 'sendmessage text="<red>蒸制条件不满足。</red>"'
    block_output: false

# ============================================================
# 蒸制结果
# ============================================================
# success: 蒸制完成后的结果分支
#   outputs: 产出物品列表
#   actions: 完成时执行的动作
result:
  success:
    outputs:
      - item_sources:
          - "minecraft-cooked_cod"
        amount: 1
    actions:
      - 'sendmessage text="<aqua>蒸制完成。</aqua>"'
