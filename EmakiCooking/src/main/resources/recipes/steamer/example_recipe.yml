# ============================================================
# EmakiCooking 蒸笼配方示例
# ============================================================
# 蒸笼是时间型烹饪设备，食材放入后需要积累足够的蒸汽量才能完成。
# ============================================================

id: "example_recipe"

display_name: "清蒸鳕鱼"

# ============================================================
# 输入食材
# ============================================================
# 放入蒸笼的原料物品。判定由同级 item_sources 与 matcher 取 AND，
# 两者都省略则这条配方永不命中。⚠ matcher 内禁止写物品源条件。
input:
  item_sources:
    - minecraft-cod

# ============================================================
# 蒸制参数
# ============================================================
# required_steam: 完成蒸制所需的蒸汽量
# 蒸汽量随时间自然积累，积累速度取决于蒸笼的火力配置。
required_steam: 40

permission: "emakicooking.recipe.steamed_cod"

# ============================================================
# 完成条件（true/false 动作分支）
# ============================================================
condition:
  type: all_of
  entries:
    - "%player_level% >= 2"
  on_pass:
    actions:
      - 'send_message text="<aqua>蒸制条件满足。</aqua>"'
  on_fail:
    actions:
      - 'send_message text="<red>蒸制条件不满足。</red>"'
    block_output: false

# ============================================================
# 蒸制结果
# ============================================================
# success: 蒸制完成后的结果分支
#   outputs: 产出物品列表
#   actions: 完成时执行的动作
result:
  success:
    outputs:
      - item_source: "minecraft-cooked_cod"
        amount: 1
    actions:
      - 'send_message text="<aqua>蒸制完成。</aqua>"'
