# ============================================================
# EmakiCooking 蒸锅配方示例（连锁加工）
# ============================================================
# 此配方展示了 requires_previous_step 功能。
# 输入物品必须是经过砧板切制的胡萝卜（携带加工历史标记），
# 直接放入未经切制的胡萝卜无法匹配此配方。
# 连锁加工流程示例:
#   1. 砧板切制胡萝卜 → 产出"切制胡萝卜"（PDC 中记录 cooking_history: "example_recipe"）
#   2. 蒸锅蒸制切制胡萝卜 → 产出"蒸胡萝卜糕"（本配方）
# ============================================================

id: "steamed_carrot_cake"

display_name: "蒸胡萝卜糕"

# ============================================================
# 前置步骤要求（连锁加工核心字段）
# ============================================================
# 输入物品的 PDC 中必须包含指定的加工历史标记。
# 值为前置配方的 id（即砧板配方 "example_recipe" 的产出物品）。
# 留空或不配置则不检查前置步骤。
requires_previous_step: "example_recipe"

# ============================================================
# 输入食材
# ============================================================
# 判定完全由 matcher 决定，必填，缺失这条配方永不命中。
# 注意它与上方 requires_previous_step 是两件事：matcher 判"是不是这种物品"，
# requires_previous_step 判"它有没有前置加工痕迹"。
input:
  matcher:
    type: item_source
    sources:
      - minecraft-golden_carrot

# ============================================================
# 蒸制参数
# ============================================================
# required_steam: 完成蒸制所需的蒸汽量
required_steam: 60

permission: "emakicooking.recipe.steamed_carrot_cake"

# ============================================================
# 完成条件（true/false 动作分支）
# ============================================================
condition:
  type: all_of
  entries:
  on_pass:
    actions:
  on_fail:
    actions:
    block_output: false

# ============================================================
# 蒸制结果
# ============================================================
result:
  success:
    outputs:
      - item_sources:
          - "minecraft-pumpkin_pie"
        amount: 1
    actions:
      - 'send_message text="<green>蒸制完成！获得了胡萝卜糕。</green>"'
      - "play_sound sound=minecraft:block.brewing_stand.brew volume=0.8 pitch=1.2"
