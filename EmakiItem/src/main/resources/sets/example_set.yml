# ============================================================
# EmakiItem 套装定义示例
# ============================================================
# 此文件定义了一个装备套装，展示所有可用字段和推荐写法。
# 当玩家同时装备多件属于同一套装的物品时，
# 会根据已装备件数激活对应的套装效果。
#
# 文件放置位置: plugins/EmakiItem/sets/
# 文件名仅用于组织和错误诊断；套装内部标识由必填 id 字段决定，加载时按 id 注册。
# ============================================================

# 套装唯一标识符（必填）
id: "example_set"

# 套装显示名称（支持 MiniMessage 格式）
display_name: "<aqua>示例守护者套装</aqua>"

# ============================================================
# 套装部件定义
# ============================================================
# 定义套装包含哪些部件，每个部件对应一个 EmakiItem 物品。
# item: 对应的物品 ID（items/ 目录下的物品定义）
# slot: 装备槽位（main_hand/off_hand/helmet/chestplate/leggings/boots）
# display: 在套装 Lore 中显示的部件名称
pieces:
  blade:
    item: "example_item"
    slot: "main_hand"
    display: "示例之刃"
  helmet:
    item: "example_guardian_helmet"
    slot: "helmet"
    display: "守护者头盔"
  chestplate:
    item: "example_guardian_chestplate"
    slot: "chestplate"
    display: "守护者胸甲"
  boots:
    item: "example_guardian_boots"
    slot: "boots"
    display: "守护者战靴"

# ============================================================
# 套装 Lore 显示配置
# ============================================================
# 控制套装信息在物品 Lore 中的显示格式。
# header: 套装标题行（%active% = 已装备件数，%total% = 总件数）
# equipped_format: 已装备部件的显示格式
# missing_format: 未装备部件的显示格式
# active_threshold_format: 已激活阈值的显示格式
# inactive_threshold_format: 未激活阈值的显示格式
# separator: 部件列表与阈值列表之间的分隔行
lore:
  header: "<dark_gray>—— <aqua>示例守护者套装</aqua> <gray>(%active%/%total%)</gray> ——</dark_gray>"
  equipped_format: "<green>✔ %piece%</green>"
  missing_format: "<gray>✘ %piece%</gray>"
  active_threshold_format: "<green>%line%</green>"
  inactive_threshold_format: "<dark_gray>%line%</dark_gray>"
  separator: ""

# ============================================================
# 套装效果
# ============================================================
# 达到指定装备件数时激活的效果。
# 统一使用 effects 列表，通过 type 字段区分效果类型。
thresholds:
  2:
    # 套装 Lore 描述（显示在物品上，告知玩家此阈值的效果）
    lore:
      - "[2件套] 物理攻击 +5，解锁冲刺技能"
    # 套装效果
    effects:
      - type: "ea_attribute"
        ea_attributes:
          physical_attack: 5.0
      - type: "es_skill"
        es_skills:
          - "guardian_dash"

  4:
    lore:
      - "[4件套] 物理攻击 +15，物理防御 +10，解锁守护者光环"
    effects:
      - type: "ea_attribute"
        ea_attributes:
          physical_attack: 15.0
          physical_defense: 10.0
      - type: "es_skill"
        es_skills:
          - "guardian_aura"
