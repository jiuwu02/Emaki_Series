# EmakiItem 套装定义完整示例
# 展示所有可用字段的用法
id: "example_guardian"
display_name: "<aqua>示例守护者套装</aqua>"

# 套装部件定义
pieces:
  blade:
    item: "example_blade"
    slot: "main_hand"
    display: "示例之刃"
  helmet:
    item: "example_guardian_helmet"
    slot: "helmet"
    display: "守护者头盔"
  chestplate:
    item: "example_guardian_chestplate"
    slot: "chestplate"
    display: "守护者胸甲"
  boots:
    item: "example_guardian_boots"
    slot: "boots"
    display: "守护者战靴"

# 套装 Lore 显示配置
lore:
  header: "<dark_gray>—— <aqua>示例守护者套装</aqua> <gray>({active}/{total})</gray> ——</dark_gray>"
  equipped_format: "<green>✔ {piece}</green>"
  missing_format: "<gray>✘ {piece}</gray>"
  active_threshold_format: "<green>{line}</green>"
  inactive_threshold_format: "<dark_gray>{line}</dark_gray>"
  separator: ""

# 套装阈值效果 - 达到指定件数时激活
thresholds:
  2:
    # 套装 Lore 描述
    lore:
      - "[2件套] 物理攻击 +5，解锁冲刺技能"
    # EmakiAttribute PDC 属性 - 达到阈值时额外写入物品 PDC
    ea_attributes:
      physical_attack: 5.0
    # EmakiSkills PDC 技能 - 达到阈值时额外写入物品 PDC
    es_skills:
      - "guardian_dash"
  4:
    lore:
      - "[4件套] 物理攻击 +15，物理防御 +10，解锁守护者光环"
    ea_attributes:
      physical_attack: 15.0
      physical_defense: 10.0
    es_skills:
      - "guardian_aura"
