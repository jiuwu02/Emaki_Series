# ============================================================
# EmakiItem 主配置文件
# ============================================================
# 此文件包含插件的全局设置。修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiItem/config.yml
# ============================================================

# 配置文件版本。仅用于标识当前默认配置结构，不建议手动修改。
version: "2.7.1"

# 语言文件 ID，对应 lang/<language>.yml。
# 例如："zh_CN"、"en_US"。
language: "zh_CN"

# 是否释放默认数据文件。
# true：首次启动或缺失数据目录时释放 items/、sets/ 等默认示例数据。
# false：只加载已有数据，不再主动释放默认示例。
# 注意：config.yml 与语言文件不属于这里说的默认数据文件。
release_default_data: true

# 数据目录扫描设置。
# 作用于 items/ 与 sets/ 两个数据目录。
data_directories:
  # 子目录递归深度上限，用于给上千个文件分类归档。
  # 1：只读取 items/*.yml，忽略所有子目录。
  # 2：额外允许一层子目录，例如 items/武器/剑.yml。
  # 3：允许两层子目录，例如 items/武器/单手剑/铁剑.yml。
  # 超过上限的子目录会被跳过，并在控制台输出一条警告。
  # 最小值为 1，填入更小的值会按 1 处理。
  max_depth: 2

# 套装加成设置。
# 套装定义位于 sets/*.yml，物品通过自身配置声明所属套装和部位。
set_bonus:
  # 是否启用套装加成系统。
  enabled: true

  # 套装刷新触发器。
  # 玩家装备变化、背包变化或命令刷新时，会重新计算当前已穿戴/持有的套装件数和加成。
  refresh_triggers:
    # 玩家进服时刷新套装状态。
    join: true
    # 玩家切换手持物品时刷新套装状态。
    held_change: true
    # 玩家点击背包时刷新套装状态。
    inventory_click: true
    # 玩家拖拽物品时刷新套装状态。
    inventory_drag: true
    # 玩家拾取物品时刷新套装状态。
    pickup: true
    # 玩家交互时刷新套装状态。
    interact: true
    # 执行 EmakiItem 相关命令时允许触发套装刷新。
    command: true

# MythicMobs 集成设置。
# 未安装 MythicMobs 时自动跳过，不影响其他功能。
mythicmobs:
  # MythicMobs 集成总开关。关闭后不注册任何 Drop。
  enabled: true

  # 自定义 Drop 设置。
  # 启用后可在 MythicMobs 的 Drops 中直接掉落 EmakiItem 物品，
  # 写法示例：emakiitem{id=example_item;amount=1}
  drops:
    # 是否注册 MythicMobs 自定义 Drop。
    enabled: true

    # 可识别的 Drop 名称。为空时回退默认值。
    names:
      - "emakiitem"
      - "ei_item"
