# ============================================================
# EmakiItem 主配置文件
# ============================================================
# 此文件包含插件的全局设置。修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiItem/config.yml
# ============================================================

# 配置文件版本。仅用于标识当前默认配置结构，不建议手动修改。
version: "2.5.7"

# 语言文件 ID，对应 lang/<language>.yml。
# 例如："zh_CN"、"en_US"。
language: "zh_CN"

# 是否释放默认数据文件。
# true：首次启动或缺失数据目录时释放 items/、sets/ 等默认示例数据。
# false：只加载已有数据，不再主动释放默认示例。
# 注意：config.yml 与语言文件不属于这里说的默认数据文件。
release_default_data: true

# 套装加成设置。
# 套装定义位于 sets/*.yml，物品通过自身配置声明所属套装和部位。
set_bonus:
  # 是否启用套装加成系统。
  enabled: true

  # 套装刷新触发器。
  # 玩家装备变化、背包变化或命令刷新时，会重新计算当前已穿戴/持有的套装件数和加成。
  refresh_triggers:
    # 玩家进服时刷新套装状态。
    join: true
    # 玩家切换手持物品时刷新套装状态。
    held_change: true
    # 玩家点击背包时刷新套装状态。
    inventory_click: true
    # 玩家拖拽物品时刷新套装状态。
    inventory_drag: true
    # 玩家拾取物品时刷新套装状态。
    pickup: true
    # 玩家交互时刷新套装状态。
    interact: true
    # 执行 EmakiItem 相关命令时允许触发套装刷新。
    command: true
