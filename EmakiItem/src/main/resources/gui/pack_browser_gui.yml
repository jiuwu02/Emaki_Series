# ============================================================
# EmakiItem GUI 配置 - 物品包列表（一级界面）
# ============================================================
# /ei browse 打开的第一级界面，列出 items/ 下的每个物品包。
# 点击包图标进入第二级界面 item_browser_gui.yml 浏览包内物品。
# 包图标外观由各包目录下的 pack.yml 定义，缺省走兜底。
# 5 行布局：0 关闭 / 1-3 内容 / 4 翻页，无整行空行。
# ============================================================
id: "pack_browser_gui"

gui_type: CHEST
title: "<dark_gray>物品包浏览</dark_gray>"

rows: 5

slots:
  # 包图标区域，按 pack.yml 的 order 升序填充，超出则分页
  pack_entry:
    type: "pack_entry"
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    item:
      components:
        custom_name: "%pack_name%"
        lore:
          - "%pack_lore%"

  page_prev:
    type: "page_prev"
    slots:
      - 38
    item:
      source: "minecraft-arrow"
      components:
        custom_name: "<gray>上一页</gray>"
        lore:
          - "<dark_gray>点击翻到上一页</dark_gray>"

  page_info:
    type: "page_info"
    slots:
      - 40
    item:
      source: "minecraft-book"
      components:
        custom_name: "<gray>第 <white>%current_page%</white>/<white>%total_pages%</white> 页</gray>"
        lore:
          - "<dark_gray>物品包总数: %pack_count%</dark_gray>"
          - "<dark_gray>物品总数: %item_count%</dark_gray>"

  page_next:
    type: "page_next"
    slots:
      - 42
    item:
      source: "minecraft-arrow"
      components:
        custom_name: "<gray>下一页</gray>"
        lore:
          - "<dark_gray>点击翻到下一页</dark_gray>"

  close:
    type: "close"
    slots:
      - 0
    item:
      source: "minecraft-barrier"
      components:
        custom_name: "<red>关闭</red>"
        lore:
          - "<dark_gray>关闭浏览界面</dark_gray>"

  border:
    type: "filler"
    slots:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
      - 17
      - 18
      - 26
      - 27
      - 35
      - 36
      - 37
      - 39
      - 41
      - 43
      - 44
    item:
      source: "minecraft-gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true
