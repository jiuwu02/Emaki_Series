# ============================================================
# EmakiItem 物品定义示例
# ============================================================
# 物品 ID 取自 id，与文件名无关。
# EmakiStrengthen 示例配方按物品源显式引用；修改 ID 时需同步更新该引用。
# ============================================================

id: "example_item"

# ============================================================
# 基础物品与原版 data components
# ============================================================
# item 只描述基础来源、数量和 Minecraft 原版组件。
# equip_slot、effects、set、condition、repair、update、actions 等 EmakiItem 业务字段保持在根级。
item:
  # CoreLib ItemSource shorthand；原版物品推荐显式使用 minecraft- 前缀。
  source: "minecraft-diamond_sword"
  amount: 1
  components:
    # 组件 ID 省略命名空间时默认使用 minecraft:；显式命名空间保持不变。
    # 文本组件可直接使用 MiniMessage 字符串。
    custom_name: "<gold>示例之刃</gold>"

    # 也可把原版结构化 JSON 对象直接改写为等价 YAML map/list。
    item_name:
      text: "示例之刃"
      color: "gold"
      italic: false
    lore:
      - "<gray>一把用于演示的钻石剑</gray>"
      - ""
      - "<yellow>物理攻击: <white>+%physical_attack%</white></yellow>"
      - "<yellow>暴击率: <white>+%physical_crit_rate%%</white></yellow>"
      - ""
      - text: "品质: 示例"
        color: "dark_gray"
        italic: false

    # 自定义模型数据（1.21.4+ 多字段格式）。
    custom_model_data:
      floats:
        - 1.0
      flags:
        - true
      strings:
        - "example"
      colors:
        - 16733440

    # 资源包模型与提示框样式。
    item_model: "minecraft:custom/example_blade"
    tooltip_style: "minecraft:custom/rare_tooltip"

    # Minecraft 1.21.5+ 的 enchantments 值直接使用“附魔 ID → 等级”映射。
    enchantments:
      minecraft:sharpness: 5

    enchantment_glint_override: true
    max_stack_size: 1
    rarity: "rare"
    damage: 0
    max_damage: 1561
    enchantable:
      value: 15

    # Minecraft 1.21.5+ 的 attribute_modifiers 值直接使用修饰符列表。
    attribute_modifiers:
      - type: "minecraft:attack_damage"
        id: "emakiitem:example_item/attack_damage"
        amount: 12.0
        operation: "add_value"
        slot: "mainhand"
      - type: "minecraft:attack_speed"
        id: "emakiitem:example_item/attack_speed"
        amount: -2.4
        operation: "add_value"
        slot: "mainhand"

    # custom_data 等组件优先使用 JSON 等价的 YAML map/list。
    custom_data:
      emakiitem:
        example: true
        tags:
          - "demo"
          - "blade"

    # $unset 删除当前物品上的组件覆盖；$reset 恢复来源物品的默认组件。
    # 两者的值都是组件 ID 列表，同样允许省略 minecraft: 命名空间。
    $unset:
      - "repair_cost"
    $reset:
      - "dyed_color"

    # 无法用 JSON 等价 YAML 表达时，单个组件值可仅含 $snbt，并原样交给原版解析器。

# 物品生效槽位；控制属性/技能何时生效，不负责原版拖拽穿戴拦截。
# 支持 all / hand / main_hand / off_hand / helmet / chestplate / leggings / boots。
equip_slot: "main_hand"

# ============================================================
# 物品更新策略
# ============================================================
# 当配置变更时，自动更新玩家手中已有的物品。
# version: 配置版本号（每次修改配置后递增，触发更新）
# triggers: 在哪些时机检测并执行更新
update:
  enabled: true
  version: 1
  triggers:
    join: true
    held_change: true
    inventory_click: true
    inventory_drag: true
    pickup: true
    interact: true
    command: true

# ============================================================
# 物品效果
# ============================================================
# 统一使用 effects 列表，通过 type 字段区分效果类型:
#   - type: "variables"      → 表达式引擎变量（用于名称/Lore 中的占位符渲染）
#   - type: "ea_attribute"   → EmakiAttribute PDC 属性（写入物品 PDC）
#   - type: "es_skill"       → EmakiSkills 技能附加（装备时获得技能）
#     es_skill_triggers        → 可选，写入 skill_id: trigger_id 的装备强制触发器，不占用玩家技能槽
effects:
  - type: "variables"
    variables:
      physical_attack: 12
      physical_crit_rate: 5
  - type: "ea_attribute"
    ea_attributes:
      physical_attack: 12.0
      physical_crit_rate: 5.0
  - type: "es_skill"
    es_skills:
      - "fireball"
      - "flame_dash"
    es_skill_triggers:
      fireball: "right_click"

# ============================================================
# 套装归属
# ============================================================
# 将此物品关联到一个套装，装备多件套装物品时触发套装效果。
# id: 套装 ID（对应 sets/ 目录下的套装定义）
# piece: 此物品在套装中的部件标识
set:
  id: "example_set"
  piece: "blade"

# ============================================================
# 装备条件
# ============================================================
# 条件不满足时，以下内容全部不生效：
#   - EA 属性：本物品 Lore 词条与 PDC 属性两条来源同时失效
#   - 装备技能：Lore 与 PDC 两条来源同时失效
#   - 套装属性：emakiitem / emakiitem_set 两个 PDC 来源
#   - 本物品的触发器动作（attack、interact 等）
# 仍然生效、不受此条件门控的部分：
#   - EmakiGem 宝石、EmakiForge 锻造、EmakiStrengthen 强化各自写入的 PDC 属性
#     （它们由对应模块拥有，不随宿主物品条件失效）
# 条件按玩家实时求值，等级/职业变化后立即生效，无需重新装备。
# entries: 条件表达式列表（支持 CoreLib 占位符，例如 EmakiLevel 的 %emakilevel_level_main%）
# type: 条件组合方式（all_of = 全部满足 / any_of = 任一满足）
# required_count: 需要满足的最少条件数
# invalid_as_failure: 表达式解析失败时是否视为不满足
# on_fail.message: 条件不满足时发送给玩家的提示
# on_pass.actions: 条件满足时执行的动作
# on_fail.actions: 条件不满足时执行的动作
condition:
  type: "all_of"
  required_count: 2
  invalid_as_failure: true
  entries:
    - "%emakilevel_level_main% >= 10"
    - "%player_class% == 'warrior'"
  on_pass:
    actions:
      - 'send_message text="<green>装备条件满足，属性已生效。</green>"'
  on_fail:
    message: "<red>你不满足装备条件！</red>"
    actions:
      - 'send_message text="<red>需要等级 10 以上的战士才能装备此武器。</red>"'

# ============================================================
# 修复配置
# ============================================================
# 物品耐久耗尽后可以通过材料或经济修复。
# materials.item_sources: 修复材料的 CoreLib ItemSource shorthand 列表
# materials.amount: 每次修复消耗的材料数量
# materials.restore: 每次修复恢复的耐久值；支持固定值或百分比，例如 250 / 25%
# economy: 经济修复配置，货币接口复用 CoreLib EconomyManager
# economy.currencies.currency_id: 货币 ID；留空使用默认货币
# economy.currencies.cost_formula: 费用公式，可使用 missing_durability 等变量
# disabled_display: 物品损坏时的外观变化
# on_disabled/on_repaired: 损坏/修复时执行的动作
repair:
  enabled: true
  materials:
    - item_sources:
        - "minecraft-diamond"
      amount: 1
      restore: 250
    - item_sources:
        - "minecraft-netherite_ingot"
      amount: 1
      restore: 500
    # 新写法：用 matcher 做更精细的材料判定。
    # matcher 存在时优先于 item_sources；缺省 matcher 时行为与上面两条一致。
    # 下例要求：既是钻石，又满足 custom_name 组件包含"精炼"。
    - matcher:
        type: all_of
        matchers:
          - type: item_source,
            sources:
              - "minecraft-diamond"
          - type: component,
            component: custom_name,
            operator: contains,
            value: "精炼"
      amount: 1
      restore: 400
  economy:
    enabled: true
    restore: "100%"
    currencies:
      - provider: "vault"
        currency_id: "default"
        display_name: "金币"
        cost_formula: "100 + missing_durability * 0.25"
  disabled_display:
    name_prefix: "<dark_gray>[已损坏] </dark_gray>"
    lore_append:
      - ""
      - "<red>此物品已损坏，属性不生效</red>"
  on_disabled:
    - 'send_message text="<red>你的武器已损坏！</red>"'
  on_repaired:
    - 'send_message text="<green>武器已修复！</green>"'
    - "play_sound sound=minecraft:block.anvil.use volume=1 pitch=1.2"

# ============================================================
# 触发动作
# ============================================================
# 在特定事件发生时执行的动作列表。
# give: 物品被给予玩家时
# interact: 玩家使用物品交互时
actions:
  give:
    - "play_sound sound=entity.player.levelup volume=1.0 pitch=1.2"
    - 'send_message text="<green>你获得了 <gold>%var.item_name%</gold>！</green>"'
  interact:
    - 'send_action_bar text="<gray>你挥舞了示例之刃</gray>"'
