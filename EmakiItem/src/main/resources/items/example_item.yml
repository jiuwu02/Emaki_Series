# ============================================================
# EmakiItem 物品定义示例
# ============================================================
# 此文件定义了一个完整的自定义物品，展示所有可用字段和推荐写法。
# EmakiItem 负责创建、管理和更新自定义物品，
# 支持属性绑定、技能附加、套装系统、条件装备和修复系统。
#
# 文件放置位置: plugins/EmakiItem/items/
# 文件名即为物品的内部标识，加载时自动注册。
# ============================================================

# 物品唯一标识符（必填）
id: "example_item"

# 基础材质（Minecraft 原版物品类型）
material: "diamond_sword"

# ============================================================
# 物品更新策略
# ============================================================
# 当配置变更时，自动更新玩家手中已有的物品。
# version: 配置版本号（每次修改配置后递增，触发更新）
# triggers: 在哪些时机检测并执行更新
update:
  enabled: true
  version: 1
  triggers:
    join: true
    held_change: true
    inventory_click: true
    inventory_drag: true
    pickup: true
    interact: true
    command: true

# ============================================================
# 物品显示配置
# ============================================================
# display_name: 物品显示名称（支持 MiniMessage 格式和 {变量} 占位符）
# item_name: 原版 item_name 组件（不支持变量，用于物品堆叠判断）
# lore: 物品描述（支持 MiniMessage 格式和 {变量} 占位符）
# equip_slot: 物品生效槽位；支持 all / hand / main_hand / off_hand / helmet / chestplate / leggings / boots
#            注意：本字段控制“属性/技能何时生效”，不是原版拖拽穿戴拦截
display_name: "<gold>示例之刃</gold>"
item_name: "示例之刃"
equip_slot: "main_hand"
lore:
  - "<gray>一把用于演示的钻石剑</gray>"
  - ""
  - "<yellow>物理攻击: <white>+{physical_attack}</white></yellow>"
  - "<yellow>暴击率: <white>+{physical_crit_rate}%</white></yellow>"
  - ""
  - "<dark_gray>品质: 示例</dark_gray>"

# ============================================================
# 物品效果
# ============================================================
# 统一使用 effects 列表，通过 type 字段区分效果类型:
#   - type: "variables"      → 表达式引擎变量（用于 display_name/lore 中的占位符渲染）
#   - type: "ea_attribute"   → EmakiAttribute PDC 属性（写入物品 PDC）
#   - type: "es_skill"       → EmakiSkills 技能附加（装备时获得技能）
effects:
  - type: "variables"
    variables:
      physical_attack: 12
      physical_crit_rate: 5
  - type: "ea_attribute"
    ea_attributes:
      physical_attack: 12.0
      physical_crit_rate: 5.0
  - type: "es_skill"
    es_skills:
      - "fireball"
      - "flame_dash"

# ============================================================
# 原版物品组件配置
# ============================================================
# 对应 Minecraft 1.21+ 的物品组件系统。
components:
  # 自定义模型数据（1.21.4+ 多字段格式）
  custom_model_data:
    floats:
      - 1.0
    flags:
      - true
    strings:
      - "example"
    colors:
      - "#FF5500"
  # 物品模型（1.21.4+ item_model 组件）
  item_model: "minecraft:custom/example_blade"
  # 提示框样式
  tooltip_style: "minecraft:custom/rare_tooltip"
  # 附魔
  enchantments:
    sharpness: 5
  # 物品标志
  item_flags:
    - "HIDE_ENCHANTS"
    - "HIDE_ATTRIBUTES"
  # 隐藏提示框
  hide_tooltip: false
  # 不可破坏
  unbreakable: false
  # 附魔光效覆盖
  enchantment_glint_override: true
  # 最大堆叠数
  max_stack_size: 1
  # 稀有度
  rarity: "rare"
  # 耐久损伤
  damage: 0
  # 最大耐久
  max_damage: 1561
  # 可附魔等级
  enchantable: 15
  # 原版属性修饰符（Minecraft 原生 attribute_modifiers 组件）
  attribute_modifiers:
    - attribute: "attack_damage"
      amount: 12.0
      operation: "add_number"
      slot: "hand"
      name: "emakiitem:example_item/attack_damage"
    - attribute: "attack_speed"
      amount: -2.4
      operation: "add_number"
      slot: "hand"
      name: "emakiitem:example_item/attack_speed"
  # 原始物品组件字符串（高级用法，直接传递给 Bukkit）
  # raw: "[minecraft:custom_data={example:1}]"

# ============================================================
# 套装归属
# ============================================================
# 将此物品关联到一个套装，装备多件套装物品时触发套装效果。
# id: 套装 ID（对应 sets/ 目录下的套装定义）
# piece: 此物品在套装中的部件标识
set:
  id: "example_set"
  piece: "blade"

# ============================================================
# 装备条件
# ============================================================
# 不满足条件时，物品的 ea_attributes 不生效。
# entries: 条件表达式列表（支持 {player_level}、{player_class} 等变量）
# condition_type: 条件组合方式（all_of = 全部满足 / any_of = 任一满足）
# condition_required_count: 需要满足的最少条件数
# invalid_as_failure: 表达式解析失败时是否视为不满足
# deny_message: 条件不满足时发送给玩家的提示
# pass_actions: 条件满足时执行的动作
# fail_actions: 条件不满足时执行的动作
conditions:
  entries:
    - "{player_level} >= 10"
    - "{player_class} == 'warrior'"
  condition_type: "all_of"
  condition_required_count: 2
  invalid_as_failure: true
  deny_message: "<red>你不满足装备条件！</red>"
  pass_actions:
    - 'sendmessage text="<green>装备条件满足，属性已生效。</green>"'
  fail_actions:
    - 'sendmessage text="<red>需要等级 10 以上的战士才能装备此武器。</red>"'

# ============================================================
# 修复配置
# ============================================================
# 物品耐久耗尽后可以通过材料或金币修复。
# disabled_display: 物品损坏时的外观变化
# on_disabled/on_repaired: 损坏/修复时执行的动作
repair:
  enabled: true
  materials:
    - item_sources:
        - "minecraft-diamond"
      amount: 1
      repair_amount: 250
    - item_sources:
        - "minecraft-netherite_ingot"
      amount: 1
      repair_amount: 500
  economy:
    enabled: true
    currencies:
      - provider: "vault"
        currency_id: ""
        base_cost: 100
        cost_formula: "{base_cost} * {damage_percent}"
        display_name: "<gold>金币</gold>"
  disabled_display:
    name_prefix: "<dark_gray>[已损坏] </dark_gray>"
    lore_append:
      - ""
      - "<red>此物品已损坏，属性不生效</red>"
  on_disabled:
    - 'sendmessage text="<red>你的武器已损坏！</red>"'
  on_repaired:
    - 'sendmessage text="<green>武器已修复！</green>"'
    - "playsound sound=minecraft:block.anvil.use volume=1 pitch=1.2"

# ============================================================
# 触发动作
# ============================================================
# 在特定事件发生时执行的动作列表。
# give: 物品被给予玩家时
# interact: 玩家使用物品交互时
actions:
  give:
    - "playsound sound=entity.player.levelup volume=1.0 pitch=1.2"
    - 'sendmessage text="<green>你获得了 <gold>{item_name}</gold>！</green>"'
  interact:
    - 'sendactionbar text="<gray>你挥舞了示例之刃</gray>"'
