# ============================================================
# EmakiItem 示例：守护者护符
# ============================================================
# 演示功能：
#   - accessory_slot 声明该物品可放入 EmakiAccessory 的 charm 部位
#   - ea_attribute 同时提供物理防御与移动速度
#   - max_damage 让饰品在 EmakiAccessory 中按耐久规则损耗
# 获得方式：/ei give <玩家> example_charm
# 依赖：EmakiAccessory（饰品槽位与耐久）；EmakiAttribute（属性生效）
# ============================================================

id: "example_charm"

# ============================================================
# 基础物品与原版组件
# ============================================================
item:
  item_source: "minecraft-iron_ingot"
  components:
    custom_name: "<gold>守护者护符</gold>"
    lore:
      - "<gray>可放入饰品栏的护符</gray>"
      - ""
      - "<yellow>物理防御: <white>+%physical_defense%</white></yellow>"
      - "<yellow>移动速度: <white>+%movement_speed%</white></yellow>"
      - ""
      - "<dark_gray>饰品部位: 护符</dark_gray>"
    max_stack_size: 1
    rarity: "uncommon"
    max_damage: 120

# ============================================================
# 物品效果
# ============================================================
effects:
  - type: "variables"
    variables:
      physical_defense: 2
      movement_speed: 1
  - type: "ea_attribute"
    ea_attributes:
      physical_defense: 2.0
      movement_speed: 1.0
  - type: "accessory_slot"
    accessory_slots:
      - "charm"
