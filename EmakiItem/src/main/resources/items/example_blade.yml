id: "example_blade"
material: "diamond_sword"
update:
  enabled: true
  version: 1
  triggers:
    join: true
    held_change: true
    inventory_click: true
    inventory_drag: true
    pickup: true
    interact: true
    command: true
display_name: "<gold>示例之刃</gold>"
lore:
  - "<gray>一把用于演示的钻石剑</gray>"
  - ""
  - "<yellow>物理攻击: <white>+{physical_attack}</white></yellow>"
  - "<yellow>暴击率: <white>+{physical_crit_rate}%</white></yellow>"
  - ""
  - "<dark_gray>品质: 示例</dark_gray>"
variables:
  physical_attack: 12
  physical_crit_rate: 5
components:
  enchantments:
    sharpness: 5
  item_flags:
    - "HIDE_ENCHANTS"
    - "HIDE_ATTRIBUTES"
  enchantment_glint_override: true
  max_stack_size: 1
  rarity: "rare"
  attribute_modifiers:
    - attribute: "attack_damage"
      amount: 12.0
      operation: "add_number"
      slot: "hand"
    - attribute: "attack_speed"
      amount: -2.4
      operation: "add_number"
      slot: "hand"
attributes:
  physical_attack: 12.0
  physical_crit_rate: 5.0
skills:
  - "fireball"
set:
  id: "example_guardian"
  piece: "blade"
repair:
  enabled: true
  materials:
    - item_sources:
        - "minecraft-diamond"
      amount: 1
      repair_amount: 250
    - item_sources:
        - "minecraft-netherite_ingot"
      amount: 1
      repair_amount: 500
  economy:
    enabled: true
    currencies:
      - provider: "vault"
        currency_id: ""
        base_cost: 100
        cost_formula: "{base_cost} * {damage_percent}"
        display_name: "<gold>金币</gold>"
actions:
  give:
    - "playsound sound=entity.player.levelup volume=1.0 pitch=1.2"
    - "sendmessage text=\"<green>你获得了 <gold>{item_name}</gold>！</green>\""
