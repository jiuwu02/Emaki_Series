# EmakiItem English language resource.
# Messages use MiniMessage; preserve placeholders documented beside message groups.
# version is maintained by resource synchronization when default keys are merged.

version: "2.8.12"

general:
  prefix: "<gray>[ <gradient:#30F07D:#627DF5>EmakiItem</gradient> ]</gray>"
  no_permission: "<red>You do not have permission.</red>"
  player_only: "<red>This command can only be used by a player.</red>"
  player_not_found: "<red>Player not found.</red>"
  invalid_args: "<red>Invalid arguments.</red>"
  unknown_command: "<red>Unknown subcommand.</red>"
  reloading: "<gray>Reloading configuration...</gray>"
  reload_success: "<green>EmakiItem reloaded.</green>"
  reload_summary: "<gray>Loaded <white>%items%</white> item definitions.</gray>"
  # Command: reload elapsed time; placeholders: %elapsed_ms%
  reload_elapsed: "<gray>Reload took: <white>%elapsed_ms%</white>ms</gray>"
  item_not_found: "<red>Item not found: <white>%id%</white></red>"
  give_success: "<green>Gave <aqua>%player%</aqua> <gold>%id%</gold> x%amount%.</green>"
  update_success:
    "<green>Refreshed <aqua>%player%</aqua>'s item updates and set lore,
    processed <white>%count%</white> items.</green>"
console:
  plugin_starting: "<gray>Starting...</gray>"
  plugin_started: "<green>Started</green>"
  plugin_stopping: "Stopping EmakiItem..."
  plugin_stopped: "<yellow>Stopped</yellow>"
  config_precheck_passed: "<gray>Config precheck passed: <yellow>%issues%</yellow> issue(s).</gray>"
  config_precheck_failed: "<red>Config precheck failed: <yellow>%issues%</yellow> issue(s).</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray>(%hint%)</dark_gray>"
    messages:
      passed: "Item config precheck passed."
      required_file_missing: "Required file is missing."
      path_not_file: "Path is not a file."
      file_not_readable: "File is not readable."
      required_directory_missing: "Required directory is missing."
      path_not_directory: "Path is not a directory."
      directory_not_readable: "Directory is not readable."
  items_loaded: "<gray>Loaded <yellow>%count%</yellow> item(s)</gray>"
  sets_loaded: "<gray>Loaded <yellow>%count%</yellow> set(s)</gray>"
  bootstrap_start: "<gray>Syncing bundled resources...</gray>"
  bootstrap_complete: "Bundled resources synced."
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "Skipped default data release by config."
  default_file_missing: "Bundled resource missing: %path%"
  bootstrap_copy_failed: "Failed to copy default resource: %path% (%error%)"
  bootstrap_save_failed: "Failed to save versioned resource: %path% (%error%)"
  directory_create_failed: "Failed to create directory: %path%"
  papi_registered: "<gray>PlaceholderAPI expansion registered</gray>"
  mythic_drops_registered: "<gray>MythicMobs Drops registered</gray>"
  item_state_unknown_sound: "<yellow>Unresolvable item_state threshold sound: <white>%sound%</white></yellow>"
  # Console: item ID aliases loaded count; placeholders: %count%
  aliases_loaded: "<gray>Loaded <yellow>%count%</yellow> alias(es)</gray>"
  # Console: reload stage failure; placeholders: %stage%, %error%
  reload_stage_failed: "<red>Reload stage %stage% failed: %error%</red>"
  # Console: failed to open editor; placeholders: %item%, %error%
  editor_open_failed: "<red>Could not open EmakiItem editor for %item% (%error%)</red>"
  # Console: failed to create item definition; placeholders: %path%, %error%
  editor_create_failed: "<red>Could not create EmakiItem definition: %path% (%error%)</red>"
  # Console: editor GUI template missing; placeholders: %template%
  editor_template_missing: "<red>Missing EmakiItem editor GUI template: %template%</red>"
  # Console: failed to open set definition; placeholders: %file%, %error%
  editor_set_open_failed: "<red>Could not open EmakiItem set definition: %file% (%error%)</red>"
  # Console: failed to delete item definition; placeholders: %error%
  editor_delete_failed: "<red>Could not delete EmakiItem definition: %error%</red>"
  scripts:
    engine_unavailable: "<yellow>GraalJS runtime unavailable, script extension disabled; other features are unaffected.</yellow>"
    disabled: "<gray>Script extension is disabled in the config, no scripts were loaded.</gray>"
    loaded: "<gray>Script loading finished: <yellow>%loaded%</yellow> file(s), <yellow>%errors%</yellow> error(s).</gray>"
    file_error: "<red>Script failed to load: <white>%file%</white> -> %error%</red>"
    register_error: "<red>Script effect type registration failed: <white>%id%</white> -> %error%</red>"
command:
  help:
    header: "<gold>EmakiItem Commands</gold>"
    line: "<yellow>/ei %cmd%</yellow> <gray>- %desc%</gray>"
    footer: "<dark_gray>Item source example: ei-example_item</dark_gray>"
    desc:
      help: "Show help"
      list: "List item ids"
      browse: "Open the item browser GUI"
      edit: "Open the in-game editor for an item"
      give: "Give an item to a player"
      inspect: "Inspect held EmakiItem"
      components: "Print held item components (JSON by default, optional yaml)"
      repair: "Open the item repair GUI"
      state: "Query, repair or recompute held item custom state"
      update: "Refresh item updates and set lore"
      alias: "Manage item ID aliases"
      migrate: "Preview or run item ID migration"
      reload: "Reload config and items"
      debug: "Manage debug tracking"
  list:
    header: "<gold>EmakiItem Items</gold> <gray>(%page%/%pages%, %count% total)</gray>"
    line: "<gray>- <white>%id%</white> <dark_gray>%name%</dark_gray>"
  inspect:
    header: "<gold>%player%</gold><gray> held item</gray>"
    line: "<gray>%key%: <white>%value%</white></gray>"
  components:
    header: "<gold>%player%</gold><gray> held item components</gray> <dark_gray>(%count%)</dark_gray>"
    no_item: "<red><white>%player%</white> is not holding an item.</red>"
    empty: "<yellow><white>%player%</white>'s held item has no displayable components.</yellow>"
    not_found: "<red>Component not found: <white>%id%</white></red>"
  state:
    usage: "<red>Usage:</red> <yellow>/ei state query|repair|recompute [player]</yellow>"
    no_item: "<red><white>%player%</white> is not holding an item.</red>"
    header: "<gold>%player%</gold><gray> held item state</gray> <dark_gray>(%count% fields)</dark_gray>"
    meta: "<gray>schema=<white>%schema%</white> revision=<white>%revision%</white> instance=<white>%instance%</white> valid=<white>%valid%</white></gray>"
    line: "<gray>- <white>%key%</white> <dark_gray>(%type%)</dark_gray> = <aqua>%value%</aqua></gray>"
    repaired: "<green>Repaired held item state metadata for <aqua>%player%</aqua> (schema=<white>%schema%</white>, valid=<white>%valid%</white>).</green>"
    recomputed: "<green>Recomputed state derivations for <aqua>%player%</aqua>, <white>%count%</white> items processed.</green>"
  alias:
    # Command: alias list header; placeholders: %count%
    header: "<gray>EmakiItem aliases: <white>%count%</white></gray>"
    # Command: alias list line; placeholders: %old_id%, %target_id%
    line: "<gray>- <aqua>%old_id%</aqua> -> <green>%target_id%</green></gray>"
    # Command: alias added; placeholders: %old_id%, %new_id%
    added: "<green>Alias added:</green> <aqua>%old_id%</aqua> -> <green>%new_id%</green>"
    # Command: alias removed; placeholders: %old_id%
    removed: "<green>Alias removed:</green> <aqua>%old_id%</aqua>"
    # Command: alias not found; placeholders: %old_id%
    missing: "<yellow>Alias not found:</yellow> <aqua>%old_id%</aqua>"
    # Command: alias usage
    usage: "<red>Usage:</red> <yellow>/ei alias list | add <old> <new> | remove <old></yellow>"
  migrate:
    # Command: migration preview; placeholders: %old_id%, %new_id%, %count%
    preview: "<gray>Migration preview: <aqua>%old_id%</aqua> -> <green>%new_id%</green>, replacements <white>%count%</white></gray>"
    # Command: migration preview file line; placeholders: %file%
    preview_file: "<gray>- %file%</gray>"
    # Command: migration complete; placeholders: %count%
    applied: "<green>Migration complete:</green> <white>%count%</white> replacements, alias kept."
    # Command: migration failed; placeholders: %error%
    failed: "<red>Migration failed:</red> %error%"
    # Command: online player inventory migration complete; placeholders: %count%
    inventory_all_done: "<green>Online player inventory migration complete:</green> %count% item(s)."
    # Command: inventory migration complete; placeholders: %player%, %count%
    inventory_done: "<green>Inventory migration complete:</green> %player% / %count% item(s)."
    # Command: migration usage
    usage: "<red>Usage:</red> <yellow>/ei migrate id <old> <new> --dry-run|--apply</yellow> or <yellow>/ei migrate inventory <player|all></yellow>"
  debug:
    stats:
      # Command: refresh stats output; placeholders: %events%, %skipped%, %batches%, %rejected%, %coalesced%, %requested_local%, %requested_full%, %update_local%, %update_full%, %set_local%, %set_full%
      refresh: "<gray>EmakiItem refresh stats:</gray> <white>events=%events% skipped=%skipped% batches=%batches% rejected=%rejected% coalesced=%coalesced% requested_local=%requested_local% requested_full=%requested_full% update_local=%update_local% update_full=%update_full% set_local=%set_local% set_full=%set_full%</white>"
      # Command: refresh work stats output; placeholders: %cache_hits%, %cache_invalid%, %update_scanned%, %set_scanned%, %scanned%, %changed%, %conflicts%, %ledger_decodes%, %set_compiles%, %elapsed_ms%, %full_reasons%
      work: "<gray>Refresh work:</gray> <white>cache_hits=%cache_hits% cache_invalid=%cache_invalid% update_scanned=%update_scanned% set_scanned=%set_scanned% scanned=%scanned% changed=%changed% conflicts=%conflicts% ledger_decodes=%ledger_decodes% set_compiles=%set_compiles% elapsed_ms=%elapsed_ms% full_reasons=%full_reasons%</white>"
