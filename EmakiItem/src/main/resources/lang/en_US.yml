# ============================================================
# EmakiItem 语言文件 - English
# ============================================================
# 此文件包含插件的所有消息文本，支持 MiniMessage 格式。
# 修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiItem/lang/
# ============================================================

version: "2.4.10"
general:
  prefix: "<gray>[ <gradient:#A78BFA:#60A5FA>EmakiItem</gradient> ]</gray>"
  no_permission: "<red>You do not have permission.</red>"
  player_only: "<red>This command can only be used by a player.</red>"
  player_not_found: "<red>Player not found.</red>"
  invalid_args: "<red>Invalid arguments.</red>"
  unknown_command: "<red>Unknown subcommand.</red>"
  reloading: "<gray>Reloading configuration...</gray>"
  reload_success: "<green>EmakiItem reloaded.</green>"
  reload_summary: "<gray>Loaded <white>%items%</white> item definitions.</gray>"
  item_not_found: "<red>Item not found: <white>%id%</white></red>"
  give_success: "<green>Gave <aqua>%player%</aqua> <gold>%id%</gold> x%amount%.</green>"
  update_success:
    "<green>Refreshed <aqua>%player%</aqua>'s item updates and set lore,
    processed <white>%count%</white> items.</green>"
console:
  plugin_starting: "<gray>Starting...</gray>"
  plugin_started: "<green>Started</green>"
  plugin_stopping: "Stopping EmakiItem..."
  plugin_stopped: "<yellow>Stopped</yellow>"
  config_precheck_passed: "<gray>Config precheck passed: <yellow>%issues%</yellow> issue(s).</gray>"
  config_precheck_failed: "<red>Config precheck failed: <yellow>%issues%</yellow> issue(s).</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  items_loaded: "<gray>Loaded <yellow>%count%</yellow> item(s)</gray>"
  sets_loaded: "<gray>Loaded <yellow>%count%</yellow> set(s)</gray>"
  bootstrap_start: "Syncing bundled resources..."
  bootstrap_complete: "Bundled resources synced."
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "Skipped default data release by config."
  default_file_missing: "Bundled resource missing: %path%"
  bootstrap_copy_failed: "Failed to copy default resource: %path% (%error%)"
  bootstrap_save_failed: "Failed to save versioned resource: %path% (%error%)"
  directory_create_failed: "Failed to create directory: %path%"
  papi_registered: "<gray>PlaceholderAPI expansion registered</gray>"
command:
  help:
    header: "<gold>EmakiItem Commands</gold>"
    line: "<yellow>/ei %cmd%</yellow> <gray>- %desc%</gray>"
    footer: "<dark_gray>Item source example: ei-example_item</dark_gray>"
    desc:
      help: "Show help"
      list: "List item ids"
      give: "Give an item to a player"
      inspect: "Inspect held EmakiItem"
      components: "Print held item components as JSON"
      repair: "Open the item repair GUI"
      update: "Refresh item updates and set lore"
      reload: "Reload config and items"
      debug: "Manage debug tracking"
  list:
    header: "<gold>EmakiItem Items</gold> <gray>(%page%/%pages%, %count% total)</gray>"
    line: "<gray>- <white>%id%</white> <dark_gray>%name%</dark_gray>"
  inspect:
    header: "<gold>%player%</gold><gray> held item</gray>"
    line: "<gray>%key%: <white>%value%</white></gray>"
  components:
    header: "<gold>%player%</gold><gray> held item components</gray> <dark_gray>(%count%)</dark_gray>"
    no_item: "<red><white>%player%</white> is not holding an item.</red>"
    empty: "<yellow><white>%player%</white>'s held item has no displayable components.</yellow>"
    not_found: "<red>Component not found: <white>%id%</white></red>"
repair:
  gui_open_failed: "<red>Repair GUI is unavailable. Please check gui/repair_gui.yml.</red>"
  inventory_full: "<yellow>Your inventory is full. Remaining items were dropped nearby.</yellow>"
  success: "<green>Repair complete. Restored <white>%restore%</white> durability.</green>"
  error:
    invalid_item: "<red>Place a repairable EmakiItem first.</red>"
    insufficient_materials: "<red>Not enough repair materials.</red>"
    invalid_restore: "<red>Invalid repair restore amount.</red>"
    already_repaired: "<yellow>This item does not need repair.</yellow>"
    cancelled: "<yellow>The repair was cancelled.</yellow>"
    economy_disabled: "<red>Economy repair is not enabled for this item.</red>"
    not_repairable: "<red>This item has no repairable durability.</red>"
    economy_provider_unavailable: "<red>Economy service unavailable: <white>%provider%</white> / <white>%currency%</white></red>"
    invalid_cost: "<red>No valid economy repair cost is configured.</red>"
    insufficient_funds: "<red>Not enough <white>%name%</white>. Need <white>%required%</white>, available <white>%available%</white>.</red>"
  preview:
    title: "<gold>Repair Preview</gold>"
    no_target_1: "<gray>Place the item to repair in the left slot.</gray>"
    no_target_2: "<gray>Material and economy repair status will appear here.</gray>"
    invalid_title: "<red>Cannot repair</red>"
    invalid_item: "<red>This is not a repairable EmakiItem.</red>"
    repair_disabled: "<red>This item has no enabled repair config.</red>"
    not_repairable: "<red>This item has no durability component.</red>"
    item: "<gray>Item: <white>%id%</white></gray>"
    damage: "<gray>Damage: <white>%damage%</white>/<white>%max%</white></gray>"
    disabled: "<red>Status: disabled</red>"
    enabled: "<green>Status: available</green>"
    already_repaired: "<yellow>Durability is already full.</yellow>"
    materials_empty: "<dark_gray>No material repair configured.</dark_gray>"
    materials_header: "<yellow>Material repair:</yellow>"
    material_line_ready: "<green>✔ %material% x%required% (have %available%, restores %restore%)</green>"
    material_line_missing: "<red>✘ %material% x%required% (have %available%, restores %restore%)</red>"
    economy_disabled: "<dark_gray>No economy repair configured.</dark_gray>"
    economy_header: "<yellow>Economy repair:</yellow>"
    economy_line_ready: "<green>✔ %name% %required% (balance %available%)</green>"
    economy_line_missing: "<red>✘ %name% %required% (balance %available%)</red>"
  material_button:
    ready: "<green>Material Repair</green>"
    blocked: "<red>Material Repair Unavailable</red>"
    no_target: "<gray>Place a repairable item first.</gray>"
    need_material: "<gray>Place enough repair materials.</gray>"
    material: "<gray>Consumes <white>%material%</white> x%amount%, restores <white>%restore%</white>.</gray>"
  economy_button:
    ready: "<green>Economy Repair</green>"
    blocked: "<red>Economy Repair Unavailable</red>"
    disabled: "<gray>This item has no economy repair config.</gray>"
    restore: "<gray>Restores <white>%restore%</white> durability.</gray>"
    cost: "<gray>Costs <white>%name%</white> <white>%required%</white> (balance <white>%available%</white>).</gray>"

# Debug mode messages
debug:
  command:
    status_header: "<gold>========== EmakiItem Debug Status ==========</gold>"
    status_enabled: "<green>Debug enabled</green>"
    status_disabled: "<gray>Debug disabled</gray>"
    tracked_players: "<gray>Tracked players: <yellow>%players%</yellow></gray>"
    tracked_modules: "<gray>Tracked modules: <yellow>%modules%</yellow></gray>"
    player_added: "<green>Now tracking player: <aqua>%player%</aqua></green>"
    player_removed: "<yellow>Stopped tracking player: <aqua>%player%</aqua></yellow>"
    module_enabled: "<green>Module tracking enabled: <yellow>%module%</yellow></green>"
    module_disabled: "<yellow>Module tracking disabled: <gray>%module%</gray></yellow>"
    all_enabled: "<green>Global debug enabled (all players + all modules)</green>"
    all_disabled: "<yellow>All debug tracking disabled</yellow>"
    player_not_found: "<red>Online player not found: %player%</red>"
    available_modules: "<gray>Available modules: <yellow>%modules%</yellow></gray>"
  create:
    start: "Item creation start | ID=%id% | Amount=%amount%"
    definition_found: "Item definition found | ID=%id% | Version=%version%"
    definition_not_found: "Item definition not found | ID=%id%"
    layer_apply: "Layer applied | Layer=%layer% | Namespace=%namespace%"
    result: "Item creation complete | ID=%id% | Material=%material%"
  update:
    check: "Item update check | ID=%id% | Current version=%current% | Latest version=%latest%"
    updated: "Item updated | ID=%id% | Changes=%changes%"
    skipped: "Item update skipped | ID=%id%"
  identify:
    start: "Item identify | Material=%material% | PDC=%pdc%"
    result: "Identify result | ID=%id%"
