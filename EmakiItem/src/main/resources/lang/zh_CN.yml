    ready: "<green>经济修复</green>"
    blocked: "<red>经济修复不可用</red>"
    disabled: "<gray>该物品未配置经济修复。</gray>"
    restore: "<gray>恢复 <white>%restore%</white> 点耐久。</gray>"
    cost: "<gray>消耗 <white>%name%</white> <white>%required%</white>（余额 <white>%available%</white>）。</gray>"

# Debug 模式消息
debug:
  command:
    status_header: "<gold>========== EmakiItem Debug 状态 ==========</gold>"
    status_enabled: "<green>Debug 已开启</green>"
    status_disabled: "<gray>Debug 已关闭</gray>"
    tracked_players: "<gray>追踪玩家: <yellow>%players%</yellow></gray>"
    tracked_modules: "<gray>追踪模块: <yellow>%modules%</yellow></gray>"
    player_added: "<green>已开始追踪玩家: <aqua>%player%</aqua></green>"
    player_removed: "<yellow>已停止追踪玩家: <aqua>%player%</aqua></yellow>"
    module_enabled: "<green>已开启模块追踪: <yellow>%module%</yellow></green>"
    module_disabled: "<yellow>已关闭模块追踪: <gray>%module%</gray></yellow>"
    all_enabled: "<green>已开启全局 Debug（所有玩家+所有模块）</green>"
    all_disabled: "<yellow>已关闭所有 Debug 追踪</yellow>"
    player_not_found: "<red>找不到在线玩家: %player%</red>"
    available_modules: "<gray>可用模块: <yellow>%modules%</yellow></gray>"
  create:
    start: "开始创建物品 | ID=%id% | 数量=%amount%"
    definition_found: "找到物品定义 | ID=%id% | 版本=%version%"
    definition_not_found: "物品定义不存在 | ID=%id%"
    layer_apply: "应用层 | 层=%layer% | 命名空间=%namespace%"
    result: "物品创建完成 | ID=%id% | 材质=%material%"
  update:
    check: "检查物品更新 | ID=%id% | 当前版本=%current% | 最新版本=%latest%"
    updated: "物品已更新 | ID=%id% | 变更数=%changes%"
    skipped: "物品无需更新 | ID=%id%"
  identify:
    start: "识别物品 | 材质=%material% | PDC=%pdc%"
    result: "识别结果 | ID=%id%"
