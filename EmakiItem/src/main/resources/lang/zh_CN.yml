      passed: "物品配置预检通过。"
      required_file_missing: "缺少必需文件。"
      path_not_file: "路径不是文件。"
      file_not_readable: "文件不可读。"
      required_directory_missing: "缺少必需目录。"
      path_not_directory: "路径不是目录。"
      directory_not_readable: "目录不可读。"
  items_loaded: "<gray>已加载 <yellow>%count%</yellow> 个物品</gray>"
  sets_loaded: "<gray>已加载 <yellow>%count%</yellow> 个套装</gray>"
  bootstrap_start: "<gray>正在同步默认资源...</gray>"
  bootstrap_complete: "默认资源同步完成。"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "已按配置跳过默认数据释放。"
  default_file_missing: "内置资源不存在: %path%"
