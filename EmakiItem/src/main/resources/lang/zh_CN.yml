    not_repairable: "<red>该物品没有可修复耐久。</red>"
    economy_provider_unavailable: "<red>经济服务不可用：<white>%provider%</white> / <white>%currency%</white></red>"
    invalid_cost: "<red>经济修复未配置有效花费。</red>"
    insufficient_funds: "<red><white>%name%</white> 不足，需要 <white>%required%</white>，当前 <white>%available%</white>。</red>"
