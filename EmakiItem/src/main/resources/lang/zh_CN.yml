    item: "<gray>物品: <white>%id%</white></gray>"
    damage: "<gray>损伤: <white>%damage%</white>/<white>%max%</white></gray>"
    disabled: "<red>状态: 已损坏</red>"
    enabled: "<green>状态: 可用</green>"
    already_repaired: "<yellow>当前耐久已满。</yellow>"
    materials_empty: "<dark_gray>未配置材料修复。</dark_gray>"
