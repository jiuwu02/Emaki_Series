    invalid_item: "<red>请先放入可修复的 EmakiItem 装备。</red>"
    insufficient_materials: "<red>修复材料不足。</red>"
    invalid_restore: "<red>修复恢复值无效。</red>"
    already_repaired: "<yellow>该物品无需修复。</yellow>"
    cancelled: "<yellow>本次修复已被取消。</yellow>"
