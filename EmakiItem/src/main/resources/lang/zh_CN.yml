    title: "<gold>修复预览</gold>"
    no_target_1: "<gray>将待修复装备放入左侧槽位。</gray>"
    no_target_2: "<gray>材料修复和经济修复会在这里显示状态。</gray>"
    invalid_title: "<red>无法修复</red>"
    invalid_item: "<red>该物品不是可修复的 EmakiItem。</red>"
    repair_disabled: "<red>该物品未启用 repair 配置。</red>"
    not_repairable: "<red>该物品没有耐久组件。</red>"
    item: "<gray>物品: <white>%id%</white></gray>"
    damage: "<gray>损伤: <white>%damage%</white>/<white>%max%</white></gray>"
    disabled: "<red>状态: 已损坏</red>"
    enabled: "<green>状态: 可用</green>"
    already_repaired: "<yellow>当前耐久已满。</yellow>"
    materials_empty: "<dark_gray>未配置材料修复。</dark_gray>"
    materials_header: "<yellow>材料修复:</yellow>"
    material_line_ready: "<green>✔ %material% x%required%（已有 %available%，恢复 %restore%）</green>"
    material_line_missing: "<red>✘ %material% x%required%（已有 %available%，恢复 %restore%）</red>"
    economy_disabled: "<dark_gray>未配置经济修复。</dark_gray>"
    economy_header: "<yellow>经济修复:</yellow>"
    economy_line_ready: "<green>✔ %name% %required%（余额 %available%）</green>"
    economy_line_missing: "<red>✘ %name% %required%（余额 %available%）</red>"
  material_button:
    ready: "<green>材料修复</green>"
    blocked: "<red>材料修复不可用</red>"
    no_target: "<gray>请先放入可修复装备。</gray>"
    need_material: "<gray>请放入足够修复材料。</gray>"
    material: "<gray>消耗 <white>%material%</white> x%amount%，恢复 <white>%restore%</white>。</gray>"
