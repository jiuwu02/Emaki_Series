# EmakiItem 简体中文语言资源
# 消息使用 MiniMessage; 保留消息分组旁标明的占位符
# version 由资源同步流程维护, 用于合并新增默认键

version: "3.0.10"

tags:
  effect: '[ 效果 ]'
  repair: '[ 修理 ]'
  set: '[ 套装 ]'

general:
  prefix: "<gray>[ <gradient:#30F07D:#627DF5>EmakiItem</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行这个命令</red>"
  player_only: "<red>这个命令只能由玩家执行</red>"
  player_not_found: "<red>找不到目标玩家</red>"
  invalid_args: "<red>参数不正确</red>"
  unknown_command: "<red>未知子命令</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>EmakiItem 已重载</green>"
  reload_summary: "<gray>已加载 <white>%items%</white> 个物品定义</gray>"
  # 命令: 重载耗时提示; 占位符: %elapsed_ms%
  reload_elapsed: "<gray>重载耗时: <white>%elapsed_ms%</white>ms</gray>"
  item_not_found: "<red>找不到物品定义: <white>%id%</white></red>"
  give_success: "<green>已给予 <aqua>%player%</aqua> <gold>%id%</gold> x%amount%</green>"
  update_success:
    "<green>已刷新 <aqua>%player%</aqua> 的物品更新与套装 Lore, 共处理
    <white>%count%</white> 件.</green>"
console:
  plugin_starting: "<gray>正在启动...</gray>"
  plugin_started: "<green>启动完成</green>"
  plugin_stopping: "正在关闭..."
  plugin_stopped: "<yellow>已关闭</yellow>"
  config_precheck_passed: "<gray>配置预检通过: <yellow>%issues%</yellow> 个提示</gray>"
  config_precheck_failed: "<red>配置预检失败: <yellow>%issues%</yellow> 个问题</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray> (%hint%)</dark_gray>"
    messages:
      passed: "物品配置预检通过"
      required_file_missing: "缺少必需文件"
      path_not_file: "路径不是文件"
      file_not_readable: "文件不可读"
      required_directory_missing: "缺少必需目录"
      path_not_directory: "路径不是目录"
      directory_not_readable: "目录不可读"
  items_loaded: "<gray>已加载 <yellow>%count%</yellow> 个物品</gray>"
  sets_loaded: "<gray>已加载 <yellow>%count%</yellow> 个套装</gray>"
  bootstrap_start: "<gray>正在同步默认资源...</gray>"
  bootstrap_complete: "默认资源同步完成"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  loader_config_load_error: "<yellow>读取 Item 配置失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  bootstrap_skip: "已按配置跳过默认数据释放"
  default_file_missing: "内置资源不存在: %path%"
  bootstrap_copy_failed: "复制默认资源失败: %path%  (%error%)"
  bootstrap_save_failed: "保存版本化资源失败: %path%  (%error%)"
  directory_create_failed: "创建目录失败: %path%"
  papi_registered: "<gray>PlaceholderAPI 扩展已注册</gray>"
  mythic_drops_registered: "<gray>MythicMobs Drops 已注册</gray>"
  item_state_unknown_sound: "<yellow>item_state 阈值音效无法解析: <white>%sound%</white></yellow>"
  # 控制台: 物品 ID alias 加载数量; 占位符: %count%
  aliases_loaded: "<gray>已加载 <yellow>%count%</yellow> 个 alias</gray>"
  # 控制台: 重载阶段失败; 占位符: %stage%, %error%
  reload_stage_failed: "<red>重载阶段 %stage% 失败: %error%</red>"
  # 控制台: 打开编辑界面失败; 占位符: %item%, %error%
  editor_open_failed: "<red>无法打开 EmakiItem 编辑界面: %item%  (%error%)</red>"
  # 控制台: 创建物品定义失败; 占位符: %path%, %error%
  editor_create_failed: "<red>无法创建 EmakiItem 定义: %path%  (%error%)</red>"
  # 控制台: 编辑界面模板缺失; 占位符: %template%
  editor_template_missing: "<red>缺少 EmakiItem 编辑界面模板: %template%</red>"
  # 控制台: 打开套装定义失败; 占位符: %file%, %error%
  editor_set_open_failed: "<red>无法打开 EmakiItem 套装定义: %file%  (%error%)</red>"
  # 控制台: 删除物品定义失败; 占位符: %error%
  editor_delete_failed: "<red>无法删除 EmakiItem 定义: %error%</red>"
  scripts:
    engine_unavailable: "<yellow>GraalJS 运行库不可用, 脚本扩展已禁用, 其余功能不受影响</yellow>"
    disabled: "<gray>脚本扩展已在配置中关闭, 本次不加载脚本</gray>"
    loaded: "<gray>脚本加载完成: <yellow>%loaded%</yellow> 个文件,<yellow>%errors%</yellow> 个错误</gray>"
    file_error: "<red>脚本加载失败: <white>%file%</white> -> %error%</red>"
    register_error: "<red>脚本效果类型注册失败: <white>%id%</white> -> %error%</red>"
