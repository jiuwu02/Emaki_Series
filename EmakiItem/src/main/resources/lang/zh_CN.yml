    engine_unavailable: "<yellow>GraalJS 运行库不可用，脚本扩展已禁用，其余功能不受影响。</yellow>"
    disabled: "<gray>脚本扩展已在配置中关闭，本次不加载脚本。</gray>"
    loaded: "<gray>脚本加载完成: <yellow>%loaded%</yellow> 个文件，<yellow>%errors%</yellow> 个错误。</gray>"
    file_error: "<red>脚本加载失败: <white>%file%</white> -> %error%</red>"
    register_error: "<red>脚本效果类型注册失败: <white>%id%</white> -> %error%</red>"
command:
  help:
    header: "<gold>EmakiItem 命令</gold>"
    line: "<yellow>/ei %cmd%</yellow> <gray>- %desc%</gray>"
    footer: "<dark_gray>物品源示例: ei-example_item</dark_gray>"
    desc:
      help: "显示帮助"
      list: "分页列出物品 ID"
      browse: "打开物品浏览界面"
      edit: "打开物品的游戏内编辑界面"
      give: "给予玩家物品"
      inspect: "检查主手 EmakiItem"
      components: "输出主手物品组件（默认 JSON，可选 yaml）"
      repair: "打开物品修复界面"
      state: "查询、修复或重算主手物品自定义状态"
      update: "刷新玩家物品更新和套装 Lore"
      alias: "管理物品 ID alias"
      migrate: "预览或执行物品 ID 迁移"
      reload: "重载配置和物品定义"
      debug: "管理 Debug 模式"
  list:
    header: "<gold>EmakiItem 物品列表</gold> <gray>(%page%/%pages%, 共 %count% 个)</gray>"
    line: "<gray>- <white>%id%</white> <dark_gray>%name%</dark_gray>"
  inspect:
    header: "<aqua>%player%</aqua><gray> 主手物品</gray>"
    line: "<gray>%key%: <white>%value%</white></gray>"
  components:
    header: "<aqua>%player%</aqua><gray> 主手物品组件</gray> <dark_gray>(%count% 个)</dark_gray>"
    no_item: "<red><white>%player%</white> 主手没有物品。</red>"
    empty: "<yellow><white>%player%</white> 主手物品没有可展示组件。</yellow>"
    not_found: "<red>找不到组件: <white>%id%</white></red>"
  state:
    usage: "<red>用法：</red> <yellow>/ei state query|repair|recompute [player]</yellow>"
    no_item: "<red><white>%player%</white> 主手没有物品。</red>"
    header: "<aqua>%player%</aqua><gray> 主手物品状态</gray> <dark_gray>(%count% 个字段)</dark_gray>"
    meta: "<gray>schema=<white>%schema%</white> revision=<white>%revision%</white> instance=<white>%instance%</white> valid=<white>%valid%</white></gray>"
    line: "<gray>- <white>%key%</white> <dark_gray>(%type%)</dark_gray> = <aqua>%value%</aqua></gray>"
    repaired: "<green>已修复 <aqua>%player%</aqua> 主手物品状态元数据（schema=<white>%schema%</white>, valid=<white>%valid%</white>）。</green>"
    recomputed: "<green>已重算 <aqua>%player%</aqua> 的状态派生，共处理 <white>%count%</white> 件。</green>"
  alias:
    # 命令：alias 列表标题；占位符：%count%
    header: "<gray>EmakiItem alias 列表: <white>%count%</white></gray>"
    # 命令：alias 列表行；占位符：%old_id%、%target_id%
    line: "<gray>- <aqua>%old_id%</aqua> -> <green>%target_id%</green></gray>"
    # 命令：添加 alias 成功；占位符：%old_id%、%new_id%
    added: "<green>Alias 已添加：</green> <aqua>%old_id%</aqua> -> <green>%new_id%</green>"
    # 命令：删除 alias 成功；占位符：%old_id%
    removed: "<green>Alias 已删除：</green> <aqua>%old_id%</aqua>"
    # 命令：alias 不存在；占位符：%old_id%
    missing: "<yellow>Alias 不存在：</yellow> <aqua>%old_id%</aqua>"
    # 命令：alias 用法
    usage: "<red>用法：</red> <yellow>/ei alias list | add <old> <new> | remove <old></yellow>"
  migrate:
    # 命令：迁移预览；占位符：%old_id%、%new_id%、%count%
    preview: "<gray>迁移预览：<aqua>%old_id%</aqua> -> <green>%new_id%</green>，替换数 <white>%count%</white></gray>"
    # 命令：迁移预览文件行；占位符：%file%
    preview_file: "<gray>- %file%</gray>"
    # 命令：迁移完成；占位符：%count%
    applied: "<green>迁移完成：</green> 替换数 <white>%count%</white>，并保留 alias。"
    # 命令：迁移失败；占位符：%error%
    failed: "<red>迁移失败：</red> %error%"
    # 命令：在线玩家背包迁移完成；占位符：%count%
    inventory_all_done: "<green>在线玩家背包迁移完成：</green> %count% 件物品。"
    # 命令：背包迁移完成；占位符：%player%、%count%
    inventory_done: "<green>背包迁移完成：</green> %player% / %count% 件物品。"
    # 命令：迁移用法
    usage: "<red>用法：</red> <yellow>/ei migrate id <old> <new> --dry-run|--apply</yellow> 或 <yellow>/ei migrate inventory <player|all></yellow>"
  debug:
    stats:
      # 命令：刷新统计输出；占位符：%events%、%skipped%、%batches%、%rejected%、%coalesced%、%requested_local%、%requested_full%、%update_local%、%update_full%、%set_local%、%set_full%
      refresh: "<gray>EmakiItem 刷新统计:</gray> <white>events=%events% skipped=%skipped% batches=%batches% rejected=%rejected% coalesced=%coalesced% requested_local=%requested_local% requested_full=%requested_full% update_local=%update_local% update_full=%update_full% set_local=%set_local% set_full=%set_full%</white>"
      # 命令：刷新工作统计输出；占位符：%cache_hits%、%cache_invalid%、%update_scanned%、%set_scanned%、%scanned%、%changed%、%conflicts%、%ledger_decodes%、%set_compiles%、%elapsed_ms%、%full_reasons%
      work: "<gray>刷新工作:</gray> <white>cache_hits=%cache_hits% cache_invalid=%cache_invalid% update_scanned=%update_scanned% set_scanned=%set_scanned% scanned=%scanned% changed=%changed% conflicts=%conflicts% ledger_decodes=%ledger_decodes% set_compiles=%set_compiles% elapsed_ms=%elapsed_ms% full_reasons=%full_reasons%</white>"
