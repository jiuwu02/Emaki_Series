# ============================================================
# EmakiItem 语言文件 - 简体中文
# ============================================================
# 此文件包含插件的所有消息文本，支持 MiniMessage 格式。
# 修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiItem/lang/
# ============================================================

version: "2.5.7"
general:
  prefix: "<gray>[ <gradient:#A78BFA:#60A5FA>EmakiItem</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行这个命令。</red>"
  player_only: "<red>这个命令只能由玩家执行。</red>"
  player_not_found: "<red>找不到目标玩家。</red>"
  invalid_args: "<red>参数不正确。</red>"
  unknown_command: "<red>未知子命令。</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>EmakiItem 已重载。</green>"
  reload_summary: "<gray>已加载 <white>%items%</white> 个物品定义。</gray>"
  item_not_found: "<red>找不到物品定义: <white>%id%</white></red>"
  give_success: "<green>已给予 <aqua>%player%</aqua> <gold>%id%</gold> x%amount%。</green>"
  update_success:
    "<green>已刷新 <aqua>%player%</aqua> 的物品更新与套装 Lore，共处理
    <white>%count%</white> 件。</green>"
console:
  plugin_starting: "<gray>正在启动...</gray>"
  plugin_started: "<green>启动完成</green>"
  plugin_stopping: "EmakiItem 正在关闭..."
  plugin_stopped: "<yellow>已关闭</yellow>"
  config_precheck_passed: "<gray>配置预检通过：<yellow>%issues%</yellow> 个提示。</gray>"
  config_precheck_failed: "<red>配置预检失败：<yellow>%issues%</yellow> 个问题。</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray>（%hint%）</dark_gray>"
    messages:
      passed: "物品配置预检通过。"
      required_file_missing: "缺少必需文件。"
      path_not_file: "路径不是文件。"
      file_not_readable: "文件不可读。"
      required_directory_missing: "缺少必需目录。"
      path_not_directory: "路径不是目录。"
      directory_not_readable: "目录不可读。"
  items_loaded: "<gray>已加载 <yellow>%count%</yellow> 个物品</gray>"
  sets_loaded: "<gray>已加载 <yellow>%count%</yellow> 个套装</gray>"
  bootstrap_start: "正在同步默认资源..."
  bootstrap_complete: "默认资源同步完成。"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "已按配置跳过默认数据释放。"
  default_file_missing: "内置资源不存在: %path%"
  bootstrap_copy_failed: "复制默认资源失败: %path% (%error%)"
  bootstrap_save_failed: "保存版本化资源失败: %path% (%error%)"
  directory_create_failed: "创建目录失败: %path%"
  papi_registered: "<gray>PlaceholderAPI 扩展已注册</gray>"
command:
  help:
    header: "<gold>EmakiItem 命令</gold>"
    line: "<yellow>/ei %cmd%</yellow> <gray>- %desc%</gray>"
    footer: "<dark_gray>物品源示例: ei-example_item</dark_gray>"
    desc:
      help: "显示帮助"
      list: "分页列出物品 ID"
      give: "给予玩家物品"
      inspect: "检查主手 EmakiItem"
      components: "输出主手物品组件（默认 JSON，可选 yaml）"
      repair: "打开物品修复界面"
      update: "刷新玩家物品更新和套装 Lore"
      reload: "重载配置和物品定义"
      debug: "管理 Debug 模式"
  list:
    header: "<gold>EmakiItem 物品列表</gold> <gray>(%page%/%pages%, 共 %count% 个)</gray>"
    line: "<gray>- <white>%id%</white> <dark_gray>%name%</dark_gray>"
  inspect:
    header: "<aqua>%player%</aqua><gray> 主手物品</gray>"
    line: "<gray>%key%: <white>%value%</white></gray>"
  components:
    header: "<aqua>%player%</aqua><gray> 主手物品组件</gray> <dark_gray>(%count% 个)</dark_gray>"
    no_item: "<red><white>%player%</white> 主手没有物品。</red>"
    empty: "<yellow><white>%player%</white> 主手物品没有可展示组件。</yellow>"
    not_found: "<red>找不到组件: <white>%id%</white></red>"
