# EmakiItem Web Console 声明式注册
# 仅声明后端发现信息；字段文案与表单 schema 由前端扩展注册。

module:
  name: "Item 物品"
  summary: "物品定义、套装刷新与触发"
  tone: item

files:
  - title: "物品系统配置"
    path: "config.yml"
    kind: CONFIG
    comment: "物品系统主配置，包含套装、刷新、耐久和修复等设置。"
  - title: "物品定义"
    path: "items/**/*.yml"
    kind: ITEM
    comment: "EmakiItem 自定义物品定义文件。"

extensions:
  - id: "emakiitem:locale"
    resource: "web-extensions/emakiitem-locale.js"
