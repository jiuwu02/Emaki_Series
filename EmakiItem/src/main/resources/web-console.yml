# EmakiItem WebUIEdit 声明式注册
# 仅声明结构信息与资源入口，展示文案由前端扩展 i18n 注册。

module:
  tone: item
  icon: '<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"><path d="M960 253.184l-448-192-448 192v547.392l448 190.72 38.688-16.48h8.192v-3.488L960 800.608V253.184z m-448 163.424l-113.536-48.32 318.944-147.2c0.736-0.352 1.216-0.992 1.92-1.408l127.232 54.528L512 416.608z m128.704-230.624l-321.696 148.48-141.568-60.288L512 130.816l128.704 55.168zM128 322.688l128 54.496V576a32 32 0 1 0 64 0v-171.52l0.064-0.032 174.816 74.432v435.584L128 758.272V322.688z m430.88 579.104V466.208L896 322.688v435.616l-337.12 143.488z"/></svg>'

files:
  - path: "config.yml"
    kind: CONFIG
  - path: "items/**/*.yml"
    kind: ITEM
    editor: "emakiitem:item"
  - path: "sets/**/*.yml"
    kind: SET
    editor: "emakiitem:set"
  - path: "id_aliases.yml"
    kind: ALIAS
    editor: "yaml"

extensions:
  - id: "emakiitem:locale"
    resource: "web-extensions/emakiitem-locale.js"
