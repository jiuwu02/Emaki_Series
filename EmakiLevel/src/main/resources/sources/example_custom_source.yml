# ============================================================
# EmakiLevel 经验来源示例 - 自定义物品与事件区分
# ============================================================
# 演示点：
# 1. 同一个文件里放两条不同 trigger 的来源（craft_item 与 furnace_extract）
# 2. 用 item_sources + matcher 区分普通产物与附魔产物
# 3. 用 %result_amount% 参与经验公式
# 规则按从上到下取第一条匹配，条件更窄的规则必须写在前面。
# matcher 内禁止写物品源条件；item_sources 与 matcher 取 AND。
# 字段依据：docs/modules/level/sources.md。
# ============================================================

id: "example_custom_source"
enabled: true
sources:
  # 合成产物经验：附魔钻石工具给额外经验。
  example_craft_bonus:
    enabled: true
    type: "crafting"
    trigger: "craft_item"
    count_result_amount: true
    anti_abuse:
      exp_cooldown_ticks: 1
    rules:
      # 附魔钻石剑 / 钻石镐：高价值产物。
      - item_sources:
          - "minecraft-diamond_sword"
          - "minecraft-diamond_pickaxe"
        matcher:
          type: component
          component: enchantments
          operator: exists
        exp_formula: "40 * %result_amount%"
      # 同一物品的普通版本：兜底。
      - item_sources:
          - "minecraft-diamond_sword"
          - "minecraft-diamond_pickaxe"
        exp_formula: "10 * %result_amount%"
      # 基础功能方块：少量经验。
      - item_sources:
          - "minecraft-crafting_table"
          - "minecraft-furnace"
          - "minecraft-chest"
        exp_formula: "5 * %result_amount%"

  # 熔炉取出产物经验：按产物来源区分。
  example_smelt_bonus:
    enabled: true
    type: "smelting"
    trigger: "furnace_extract"
    count_result_amount: true
    anti_abuse:
      exp_cooldown_ticks: 1
    rules:
      - item_sources:
          - "minecraft-netherite_scrap"
        exp_formula: "20 * %result_amount%"
      - item_sources:
          - "minecraft-iron_ingot"
          - "minecraft-gold_ingot"
          - "minecraft-copper_ingot"
        exp_formula: "3 * %result_amount%"
