# EmakiLevel 经验来源 - 冶炼
#
# 熔炉类产出相关的经验来源定义。

id: "smelting_sources"
enabled: true
sources:
  furnace_extract:
    enabled: true
    type: "smelting"
    trigger: "furnace_extract"
    anti_abuse:
      exp_cooldown_ticks: 1
    rules:
      - result_item_sources:
          - "minecraft-iron_ingot"
          - "minecraft-copper_ingot"
          - "minecraft-gold_ingot"
        exp_formula: "3 * %result_amount%"
      - result_item_sources:
          - "minecraft-netherite_scrap"
        exp_formula: "20 * %result_amount%"
