# EmakiLevel 经验来源 - 合成
#
# 工作台与合成类操作的经验来源定义。

id: "crafting_sources"
enabled: true
sources:
  craft_item:
    enabled: true
    type: "crafting"
    trigger: "craft_item"
    count_result_amount: true
    anti_abuse:
      exp_cooldown_ticks: 1
    rules:
      - matcher:
          type: item_source
          sources:
            - "minecraft-crafting_table"
            - "minecraft-furnace"
        exp_formula: "5 * %result_amount%"
      - matcher:
          type: item_source
          sources:
            - "minecraft-diamond_pickaxe"
            - "minecraft-diamond_sword"
        exp_formula: "40 * %result_amount%"
      # 判定完全由 matcher 决定，它是每条规则的必填项，缺失该规则永不命中。
      # 按物品源筛产物就写 type: item_source（上面两条即是）；要按物品组件筛，
      # 就像下面这样写 type: component，两种写法都是同一个 matcher 字段。
      #
      # 形状差异（容易写错，注意区分）：
      #   物品源简写用连字符：      "minecraft-diamond"
      #   组件 ID 与 path 用冒号：  component: minecraft:enchantments / path: minecraft:sharpness
      #   组件 ID 省略命名空间时默认补 minecraft:，所以 enchantments 等价于 minecraft:enchantments
      #
      # operator 可用：exists / absent、==、!=、>、>=、<、<=、
      #                contains / starts_with / ends_with、regex、has_key / has_value、size
      - matcher:
          type: component
          component: enchantments
          path: sharpness
          operator: ">="
          value: 5
        exp_formula: "120 * %result_amount%"
