# EmakiLevel 主配置
#
# 控制等级类型、经验倍率、每日上限、来源集成与反滥用记录。
# 修改后按插件提供的重载命令应用。
# 文件位置：plugins/EmakiLevel/config.yml

# version 是配置结构标记，由项目资源同步流程维护，不是功能开关。
version: "1.5.3"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放 types/、sources/、gui/ 等内置默认数据。
# 关闭后只加载已有数据，不主动生成缺失的默认示例。
release_default_data: true

# 主等级类型 ID；调用方未指定类型时使用此值。
primary_type: "main"

level:
  # 等级类型未单独配置时使用的起始等级。
  default_start_level: 1
  # 等级类型未单独配置时使用的最高等级。
  default_max_level: 100
  # 单次结算最多自动提升的等级数；运行时至少按 1 处理。
  max_auto_upgrade_steps: 10
  # 达到最高等级后是否继续累计总经验。
  keep_total_exp_at_max_level: true

# 经验倍率。
# 实际入账经验 = 原始经验 × global × types.<type> × reasons.<reason>。
# 所有倍率为 1.0 时不改变经验值。
multipliers:
  enabled: true
  global: 1.0
  types:
    main: 1.0
    combat: 1.0
    cooking: 1.0
    forging: 1.0
  reasons:
    action: 1.0
    mythic_drop: 1.0
    event_bonus: 1.0

# 每日经验上限。
# -1 表示不限制；当前计数仅保存在本次服务器运行内存中，重启后清零。
daily_caps:
  enabled: true
  default_limit: -1
  types:
    main: -1
    combat: -1
    cooking: -1
    forging: -1

# 玩家等级数据的 PDC 存储。
pdc:
  enabled: true
  namespace: "emakilevel"

# EmakiAttribute 提供者注册。
attribute:
  enabled: true
  provider_id: "emakilevel"

# MythicMobs 集成。
mythicmobs:
  enabled: true
  kill_sources: true
  drops:
    enabled: true
    names:
      - "emakilevel_exp"
      - "elv_exp"

# 经验来源反滥用记录。
anti_abuse:
  # 是否记录玩家放置的方块。
  placed_block_tracking: true
  # 是否允许从被记录的方块获得经验。
  placed_block_exp: false
  # 放置方块记录保留时间，单位：tick；小于等于 0 时不执行该类清理。
  placed_block_record_ttl_ticks: 864000
  last_damager_tracking:
    # 是否记录最后攻击者，用于击杀归因。
    enabled: true
    # 最后攻击者记录保留时间，单位：tick。
    expire_ticks: 200

# 等级界面。
gui:
  enabled: true
  default_template: "level_gui"
