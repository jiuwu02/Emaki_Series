    page_info_lore: "<gray>排行榜条目: <white>%entry_count%</white></gray>"
    type_info_name: "<gold>%type_display_name%</gold>"
    type_info_lore: "<gray>等级类型: <white>%type%</white>, 收录 <aqua>%entry_count%</aqua> 名玩家</gray>"
