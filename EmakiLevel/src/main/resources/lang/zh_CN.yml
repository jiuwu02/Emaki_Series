# EmakiLevel 简体中文语言资源
# 消息使用 MiniMessage; 保留消息分组旁标明的占位符
# version 由资源同步流程维护, 用于合并新增默认键

version: "2.0.7"

tags:
  leaderboard: '[ 排行榜 ]'

general:
  prefix: "<gray>[ <gradient:#A855F7:#F472B6>EmakiLevel</gradient> ]</gray>"
console:
  plugin_starting: "<gray>正在启动...</gray>"
  plugin_started: "<green>启动完成</green>"
  plugin_stopped: "<yellow>已关闭</yellow>"
  config_precheck_passed: "<gray>配置预检通过: <yellow>%issues%</yellow> 个提示</gray>"
  config_precheck_failed: "<red>配置预检失败: <yellow>%issues%</yellow> 个问题</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray> (%hint%)</dark_gray>"
    messages:
      passed: "等级配置预检通过"
      required_file_missing: "缺少必需文件"
      path_not_file: "路径不是文件"
      file_not_readable: "文件不可读"
      required_directory_missing: "缺少必需目录"
      path_not_directory: "路径不是目录"
      directory_not_readable: "目录不可读"
  types_loaded: "<gray>已加载 <yellow>%count%</yellow> 个等级类型</gray>"
  sources_loaded: "<gray>已加载 <yellow>%count%</yellow> 条经验来源规则</gray>"
  actions_registered: "<gray>CoreLib Action 已注册</gray>"
  papi_registered: "<gray>PlaceholderAPI 扩展已注册</gray>"
  attribute_bridge_ready: "<gray>EmakiAttribute 属性贡献已接入</gray>"
  attribute_bridge_unavailable: "<gray>EmakiAttribute 属性贡献不可用, 已跳过</gray>"
  mythic_drops_registered: "<gray>MythicMobs Drops 已注册</gray>"
  bootstrap_start: "<gray>开始检查默认文件...</gray>"
  bootstrap_complete: "<green>默认文件检查完成</green>"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "<gray>release_default_data=false, 跳过默认数据文件生成</gray>"
  default_file_missing: "<yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  bootstrap_copy_failed: "<yellow>复制默认资源失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>保存版本化资源失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  directory_create_failed: "<yellow>创建目录失败: <red>%path%</red></yellow>"
  # 控制台: 重建等级排行榜失败
  leaderboard_rebuild_failed: "重建等级排行榜失败"
  # 控制台: EmakiAttribute 属性桥接注册失败; 占位符: %cause%
  attribute_bridge_register_failed: "属性桥接注册失败: provider=EmakiAttribute, operation=register_attribute_bridge, cause=%cause%"
  # 控制台: 流程阶段注册失败; 占位符: %stage%, %reason%
  stage_register_failed: "注册流程阶段 '%stage%' 失败: %reason%"
  # 控制台: 玩家数据异步操作失败; 占位符: %operation%, %player%
  async_operation_failed: "异步 %operation% 操作失败, 玩家 %player%"
  # 控制台: 经验来源规则需求判定抛出异常, 按未匹配处理; 占位符: %error%
  source_rule_requirement_failed: "经验来源规则需求判定抛出异常, 按未匹配处理: %error%"
  # 控制台: 无法打开编辑界面; 占位符: %item%, %error%
  editor_open_failed: "<red>无法打开 EmakiLevel 编辑界面: %item%  (%error%)</red>"
  # 控制台: 缺少编辑界面模板; 占位符: %template%
  editor_template_missing: "<red>缺少 EmakiLevel 编辑界面模板: %template%</red>"
  # 控制台: 无法创建定义文件; 占位符: %path%, %error%
  editor_browser_create_failed: "<red>无法创建定义: %path%  (%error%)</red>"
  # 控制台: 无法删除定义文件; 占位符: %path%, %error%
  editor_browser_delete_failed: "<red>无法删除定义: %path%  (%error%)</red>"
  # 控制台: 无法列举定义目录; 占位符: %path%, %error%
  editor_browser_list_failed: "<red>无法列举定义目录: %path%  (%error%)</red>"
command:
  no_permission: "%prefix%<red>你没有权限执行该指令</red>"
  player_only: "%prefix%<red>该指令只能由玩家执行</red>"
  player_not_found: "%prefix%<red>玩家不存在或不在线: <white>%player%</white></red>"
  type_not_found: "%prefix%<red>经验类型不存在: <white>%type%</white></red>"
  invalid_number: "%prefix%<red>数字无效: <white>%value%</white></red>"
  reload_success: "%prefix%<green>配置已重载</green>"
  usage: "%prefix%<gray>用法: /elevel help 查看帮助 | /elevel gui [type] | /elevel info [type] | /elevel levelup <type> | /elevel topgui [type] | /elevel edit [id]</gray>"
  help_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiLevel 命令帮助</gradient> <gray><st>        </st></gray>"
  help_entry_help: "- <hover:show_text:'<gray>help</gray> <dark_gray>·</dark_gray> <gray>显示本帮助页</gray><newline><newline><dark_gray>▸</dark_gray> <gray>所有子命令都需要权限 </gray><white>emakilevel.use</white>'><gray>help</gray></hover> <click:run_command:'%root% help'><green>[ ✦ 点击执行 ]</green></click>"
  help_entry_info: "- <hover:show_text:'<gray>info</gray> <dark_gray>·</dark_gray> <gray>查看自己的等级与经验</gray><newline><newline><dark_gray>▸</dark_gray> <gray>不带子命令时等同于 info</gray><newline><dark_gray>▸</dark_gray> <gray>可选参数:等级类型 - 不填显示全部类型, 如 </gray><white>%root% info [类型]</white><newline><dark_gray>▸</dark_gray> <gray>支持 Tab 补全类型</gray><newline><dark_gray>▸</dark_gray> <gray>只能由玩家执行</gray>'><gray>info</gray></hover> <click:run_command:'%root% info'><green>[ ✦ 点击执行 ]</green></click>"
  help_entry_gui: "- <hover:show_text:'<gray>gui</gray> <dark_gray>·</dark_gray> <gray>打开等级界面</gray><newline><newline><dark_gray>▸</dark_gray> <gray>别名 </gray><white>open</white><newline><dark_gray>▸</dark_gray> <gray>可选参数:等级类型 - 不填打开主类型, 如 </gray><white>%root% gui [类型]</white><newline><dark_gray>▸</dark_gray> <gray>支持 Tab 补全类型</gray><newline><dark_gray>▸</dark_gray> <gray>只能由玩家执行</gray>'><gray>gui</gray></hover> <click:run_command:'%root% gui'><green>[ ✦ 点击执行 ]</green></click>"
