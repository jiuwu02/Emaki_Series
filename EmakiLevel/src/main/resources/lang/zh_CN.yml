version: "1.1.9"
general:
  prefix: "<gray>[ <gradient:#A78BFA:#60A5FA>EmakiLevel</gradient> ]</gray>"
console:
  plugin_starting: "<gray>正在启动...</gray>"
  plugin_started: "<green>启动完成</green>"
  plugin_stopped: "<yellow>已关闭</yellow>"
  config_precheck_passed: "<gray>配置预检通过：<yellow>%issues%</yellow> 个提示。</gray>"
  config_precheck_failed: "<red>配置预检失败：<yellow>%issues%</yellow> 个问题。</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  types_loaded: "<gray>已加载 <yellow>%count%</yellow> 个等级类型</gray>"
  sources_loaded: "<gray>已加载 <yellow>%count%</yellow> 条经验来源规则</gray>"
  actions_registered: "<gray>CoreLib Action 已注册</gray>"
  papi_registered: "<gray>PlaceholderAPI 扩展已注册</gray>"
  attribute_bridge_ready: "<gray>EmakiAttribute 属性贡献已接入</gray>"
  attribute_bridge_unavailable: "<gray>EmakiAttribute 属性贡献不可用，已跳过</gray>"
  mythic_drops_registered: "<gray>MythicMobs Drops 已注册</gray>"
  bootstrap_start: "<white>开始检查默认文件...</white>"
  bootstrap_complete: "<green>默认文件检查完成。</green>"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "<gray>release_default_data=false，跳过默认数据文件生成。</gray>"
  default_file_missing: "<yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  bootstrap_copy_failed: "<yellow>复制默认资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>保存默认资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  directory_create_failed: "<yellow>创建目录失败: <red>%path%</red></yellow>"
command:
  no_permission: "%prefix%<red>你没有权限执行该指令。</red>"
  player_only: "%prefix%<red>该指令只能由玩家执行。</red>"
  player_not_found: "%prefix%<red>玩家不存在或不在线: <white>%player%</white></red>"
  type_not_found: "%prefix%<red>经验类型不存在: <white>%type%</white></red>"
  invalid_number: "%prefix%<red>数字无效: <white>%value%</white></red>"
  reload_success: "%prefix%<green>配置已重载。</green>"
  usage: "%prefix%<gray>用法: /elv gui [type] | /elv info [type] | /elv levelup <type> | /elv topgui [type]</gray>"
level:
  info_line: "%prefix%%type_display_name% <gray>Lv.%level% %exp%/%required_exp% (%progress_percent%%)</gray>"
  exp_gain: "%prefix%<green>%type_display_name% 经验 +%amount%</green>"
  levelup_success: "%prefix%<green>%type_display_name% 提升到了 <yellow>%new_level%</yellow> 级。</green>"
  levelup_failure: "%prefix%<red>升级失败: %failure_reason%</red>"
  reset_success: "%prefix%<green>已重置 %player% 的 %type_display_name%。</green>"
gui:
  open_failed: "%prefix%<red>等级界面暂不可用，请联系管理员检查 GUI 模板。</red>"
  level:
    unknown_type: "%prefix%<red>等级类型不存在: <white>%type%</white></red>"
    page_info_name: "<aqua>第 %current_page%/%total_pages% 页</aqua>"
    page_info_lore: "<gray>等级类型数量: <white>%type_count%</white></gray>"
    top_button_name: "<gold>%type_display_name% 排行榜</gold>"
    top_button_lore: "<gray>点击查看当前选中等级类型的排行榜</gray>"
    levelup_once_success: "%prefix%<green>%type_display_name% 提升到了 <yellow>%new_level%</yellow> 级。</green>"
    levelup_multi_success: "%prefix%<green>%type_display_name% 连续升级 <yellow>%count%</yellow> 次。</green>"
    levelup_failed: "%prefix%<red>升级失败: %failure_reason%</red>"
    lore:
      level: "<gray>等级: <yellow>%level%</yellow><dark_gray>/</dark_gray><gold>%max_level%</gold></gray>"
      exp: "<gray>经验: <aqua>%exp%</aqua><dark_gray>/</dark_gray><blue>%required_exp%</blue></gray>"
      total: "<gray>累计经验: <white>%total_exp%</white></gray>"
      progress: "<gray>进度: %progress_bar% <white>%progress_percent%%</white></gray>"
      left_click: "<yellow>左键</yellow><gray>查看详情</gray>"
      right_click: "<yellow>右键</yellow><gray>手动升级一次</gray>"
      shift_right_click: "<yellow>Shift+右键</yellow><gray>连续升级</gray>"
    status:
      locked: "<red>未启用</red>"
      max_level: "<gold>已满级</gold>"
      auto_only: "<aqua>自动升级</aqua>"
      ready: "<green>可升级</green>"
      not_enough_exp: "<gray>经验不足</gray>"
  top:
    unknown_type: "%prefix%<red>等级类型不存在: <white>%type%</white></red>"
    entry_name: "<gold>#%rank%</gold> <white>%player%</white>"
    entry_lore: "<gray>Lv.%level% / 累计 %total_exp%</gray>"
    page_info_name: "<aqua>第 %current_page%/%total_pages% 页</aqua>"
    page_info_lore: "<gray>排行榜条目: <white>%entry_count%</white></gray>"
    type_info_name: "<gold>%type_display_name%</gold>"
    type_info_lore: "<gray>等级类型: <white>%type%</white>，收录 <aqua>%entry_count%</aqua> 名玩家</gray>"
failure:
  success: "成功"
  player_not_found: "玩家不存在"
  type_not_found: "经验类型不存在"
  type_disabled: "经验类型未启用"
  upgrade_disabled: "该类型不允许升级"
  manual_upgrade_disabled: "该类型不允许手动升级"
  max_level: "已达到最高等级"
  not_enough_exp: "经验不足"
  invalid_amount: "数量无效"
  daily_cap_reached: "今日经验已达上限"
  not_enough_money: "金币不足"
  not_enough_material: "材料不足"
  invalid_requirement: "等级需求配置无效"
debug:
  command:
    status_header: "<gold>========== EmakiLevel Debug 状态 ==========</gold>"
    status_enabled: "<green>Debug 已开启</green>"
    status_disabled: "<gray>Debug 已关闭</gray>"
    tracked_players: "<gray>追踪玩家: <yellow>%players%</yellow></gray>"
    tracked_modules: "<gray>追踪模块: <yellow>%modules%</yellow></gray>"
    player_added: "<green>已开始追踪玩家: <aqua>%player%</aqua></green>"
    player_removed: "<yellow>已停止追踪玩家: <aqua>%player%</aqua></yellow>"
    module_enabled: "<green>已开启模块追踪: <yellow>%module%</yellow></green>"
    module_disabled: "<yellow>已关闭模块追踪: <gray>%module%</gray></yellow>"
    all_enabled: "<green>已开启全局 Debug（所有玩家+所有模块）</green>"
    all_disabled: "<yellow>已关闭所有 Debug 追踪</yellow>"
    player_not_found: "<red>找不到在线玩家: %player%</red>"
    available_modules: "<gray>可用模块: <yellow>%modules%</yellow></gray>"
