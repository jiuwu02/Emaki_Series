version: "1.0.5"
prefix: "<dark_gray>[<gold>EmakiLevel</gold>]</dark_gray> "
console:
  plugin_starting: "<gray>正在启动...</gray>"
  plugin_started: "<green>启动完成</green>"
  plugin_stopped: "<yellow>已关闭</yellow>"
  types_loaded: "<gray>已加载 <yellow>%count%</yellow> 个等级类型</gray>"
  sources_loaded: "<gray>已加载 <yellow>%count%</yellow> 条经验来源规则</gray>"
  actions_registered: "<gray>CoreLib Action 已注册</gray>"
  papi_registered: "<gray>PlaceholderAPI 扩展已注册</gray>"
  attribute_bridge_ready: "<gray>EmakiAttribute 属性贡献已接入</gray>"
  attribute_bridge_unavailable: "<gray>EmakiAttribute 属性贡献不可用，已跳过</gray>"
  mythic_drops_registered: "<gray>MythicMobs Drops 已注册</gray>"
  bootstrap_start: "<white>开始检查默认文件...</white>"
  bootstrap_complete: "<green>默认文件检查完成。</green>"
  bootstrap_skip: "<gray>release_default_data=false，跳过默认数据文件生成。</gray>"
  default_file_missing: "<yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  bootstrap_copy_failed: "<yellow>复制默认资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>保存默认资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  directory_create_failed: "<yellow>创建目录失败: <red>%path%</red></yellow>"
command:
  no_permission: "%prefix%<red>你没有权限执行该指令。</red>"
  player_only: "%prefix%<red>该指令只能由玩家执行。</red>"
  player_not_found: "%prefix%<red>玩家不存在或不在线: <white>%player%</white></red>"
  type_not_found: "%prefix%<red>经验类型不存在: <white>%type%</white></red>"
  invalid_number: "%prefix%<red>数字无效: <white>%value%</white></red>"
  reload_success: "%prefix%<green>配置已重载。</green>"
  usage: "%prefix%<gray>用法: /elv info [type] | /elv levelup <type></gray>"
level:
  info_line: "%prefix%%type_display_name% <gray>Lv.%level% %exp%/%required_exp% (%progress_percent%%)</gray>"
  exp_gain: "%prefix%<green>%type_display_name% 经验 +%amount%</green>"
  levelup_success: "%prefix%<green>%type_display_name% 提升到了 <yellow>%new_level%</yellow> 级。</green>"
  levelup_failure: "%prefix%<red>升级失败: %failure_reason%</red>"
  reset_success: "%prefix%<green>已重置 %player% 的 %type_display_name%。</green>"
failure:
  type_disabled: "经验类型未启用"
  upgrade_disabled: "该类型不允许升级"
  manual_upgrade_disabled: "该类型不允许手动升级"
  max_level: "已达到最高等级"
  not_enough_exp: "经验不足"
  invalid_amount: "数量无效"
  invalid_requirement: "等级需求配置无效"
