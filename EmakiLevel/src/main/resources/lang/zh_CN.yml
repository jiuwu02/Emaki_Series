# EmakiLevel 简体中文语言资源
# 消息使用 MiniMessage; 保留消息分组旁标明的占位符
# version 由资源同步流程维护, 用于合并新增默认键

version: "1.6.11"

general:
  prefix: "<gray>[ <gradient:#A855F7:#F472B6>EmakiLevel</gradient> ]</gray>"
console:
  plugin_starting: "[startup] <gray>正在启动...</gray>"
  plugin_started: "[startup] <green>启动完成</green>"
  plugin_stopped: "[shutdown] <yellow>已关闭</yellow>"
  config_precheck_passed: "[config] <gray>配置预检通过: <yellow>%issues%</yellow> 个提示</gray>"
  config_precheck_failed: "[config] <red>配置预检失败: <yellow>%issues%</yellow> 个问题</red>"
  config_precheck_issue: "[config] <gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "[config] <yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "[config] <red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray> (%hint%)</dark_gray>"
    messages:
      passed: "等级配置预检通过"
      required_file_missing: "缺少必需文件"
      path_not_file: "路径不是文件"
      file_not_readable: "文件不可读"
      required_directory_missing: "缺少必需目录"
      path_not_directory: "路径不是目录"
      directory_not_readable: "目录不可读"
  types_loaded: "[loader] <gray>已加载 <yellow>%count%</yellow> 个等级类型</gray>"
  sources_loaded: "[loader] <gray>已加载 <yellow>%count%</yellow> 条经验来源规则</gray>"
  actions_registered: "[integration] <gray>CoreLib Action 已注册</gray>"
  papi_registered: "[integration] <gray>PlaceholderAPI 扩展已注册</gray>"
  attribute_bridge_ready: "[integration] <gray>EmakiAttribute 属性贡献已接入</gray>"
  attribute_bridge_unavailable: "[integration] <gray>EmakiAttribute 属性贡献不可用, 已跳过</gray>"
  mythic_drops_registered: "[integration] <gray>MythicMobs Drops 已注册</gray>"
  bootstrap_start: "[loader] <gray>开始检查默认文件...</gray>"
  bootstrap_complete: "[loader] <green>默认文件检查完成</green>"
  versioned_file_updated: "[config] <green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "[loader] <gray>release_default_data=false, 跳过默认数据文件生成</gray>"
  default_file_missing: "[loader] <yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  bootstrap_copy_failed: "[loader] <yellow>复制默认资源失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  bootstrap_save_failed: "[loader] <yellow>保存版本化资源失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  directory_create_failed: "[loader] <yellow>创建目录失败: <red>%path%</red></yellow>"
  # 控制台: 重建等级排行榜失败
  leaderboard_rebuild_failed: "重建等级排行榜失败"
  # 控制台: EmakiAttribute 属性桥接注册失败; 占位符: %cause%
  attribute_bridge_register_failed: "[integration] 属性桥接注册失败: provider=EmakiAttribute, operation=register_attribute_bridge, cause=%cause%"
  # 控制台: 流程阶段注册失败; 占位符: %stage%, %reason%
  stage_register_failed: "[registry] 注册流程阶段 '%stage%' 失败: %reason%"
  # 控制台: 玩家数据异步操作失败; 占位符: %operation%, %player%
  async_operation_failed: "异步 %operation% 操作失败, 玩家 %player%"
  # 控制台: 经验来源规则需求判定抛出异常, 按未匹配处理; 占位符: %error%
  source_rule_requirement_failed: "[matcher] 经验来源规则需求判定抛出异常, 按未匹配处理: %error%"
  # 控制台: 无法打开编辑界面; 占位符: %item%, %error%
  editor_open_failed: "[editor] <red>无法打开 EmakiLevel 编辑界面: %item%  (%error%)</red>"
  # 控制台: 缺少编辑界面模板; 占位符: %template%
  editor_template_missing: "[editor] <red>缺少 EmakiLevel 编辑界面模板: %template%</red>"
  # 控制台: 无法创建定义文件; 占位符: %path%, %error%
  editor_browser_create_failed: "[editor] <red>无法创建定义: %path%  (%error%)</red>"
  # 控制台: 无法删除定义文件; 占位符: %path%, %error%
  editor_browser_delete_failed: "[editor] <red>无法删除定义: %path%  (%error%)</red>"
  # 控制台: 无法列举定义目录; 占位符: %path%, %error%
  editor_browser_list_failed: "[editor] <red>无法列举定义目录: %path%  (%error%)</red>"
command:
  no_permission: "%prefix%<red>你没有权限执行该指令</red>"
  player_only: "%prefix%<red>该指令只能由玩家执行</red>"
  player_not_found: "%prefix%<red>玩家不存在或不在线: <white>%player%</white></red>"
  type_not_found: "%prefix%<red>经验类型不存在: <white>%type%</white></red>"
  invalid_number: "%prefix%<red>数字无效: <white>%value%</white></red>"
  reload_success: "%prefix%<green>配置已重载</green>"
  usage: "%prefix%<gray>用法: /elv help 查看帮助 | /elv gui [type] | /elv info [type] | /elv levelup <type> | /elv topgui [type] | /elv edit [id]</gray>"
  # 命令: 帮助头/尾/行模板; 占位符: %cmd%, %desc%
  help:
    header: "<gold>========== EmakiLevel 帮助 ==========</gold>"
    footer: "<gold>=======================================</gold>"
    line: "<yellow>/elv %cmd%</yellow> <gray>- %desc%</gray>"
    # 命令: edit 子命令帮助说明
    desc:
      edit: "打开定义的游戏内编辑界面 (无 ID 打开浏览列表)"
    commands:
      info: "查看自己的等级与经验信息"
      gui: "打开等级界面"
      levelup: "提升当前等级"
      top: "查看排行榜文本列表"
      topgui: "打开排行榜界面"
      edit: "打开定义的游戏内编辑界面 (无 ID 打开浏览列表)"
      exp: "增加, 扣除或设置玩家经验"
      level: "增加, 扣除或设置玩家等级"
      reset: "重置玩家的等级进度"
      reload: "重载配置与语言"
      convert_legacy: "迁移旧版配置"
      debug: "管理 Debug 模式与诊断输出"
  # 命令: 排行榜标题; 占位符: %type%
  top_header: "<gold>===== EmakiLevel 排行榜: %type% =====</gold>"
  # 命令: 排行榜条目; 占位符: %rank%, %player%, %level%, %total_exp%
  top_entry: "<yellow>#%rank%</yellow> <white>%player%</white> <gray>Lv.%level% / %total_exp% 总计</gray>"
  # 命令: 经验操作用法提示; 占位符: %mode%
  usage_exp: "<red>/elv %mode%exp <player> <type> <amount></red>"
  # 命令: 等级操作用法提示; 占位符: %mode%
  usage_level: "<red>/elv %mode%level <player> <type> <amount></red>"
  # 命令: 重置用法提示
  usage_reset: "<red>/elv reset <player> <type></red>"
  # 命令: 重载耗时; 占位符: %elapsed%
  reload_time: "<gray>重载耗时: <white>%elapsed%ms</white></gray>"
  # 命令: 升级经验需求调试输出; 占位符: %type%, %level%, %required%, %source%
  debug_requirement: "<gray>需求 %type% -> %level%: <yellow>%required%</yellow> <dark_gray> (%source%)</dark_gray></gray>"
  # 命令: PDC 同步完成提示; 占位符: %player%
  debug_pdc_synced: "<green>已为 %player% 同步 PDC</green>"
  # 命令: 操作成功反馈; 占位符: %type%, %old_level%, %new_level%, %old_exp%, %new_exp%
  operation_success: "<green>操作成功: %type% Lv.%old_level% → Lv.%new_level%, exp %old_exp% → %new_exp%</green>"
  # 命令: 操作失败反馈; 占位符: %reason%
  operation_failed: "<red>操作失败: %reason%</red>"
  convert_legacy:
    header: "<gold>========== 旧 item_sources 转换 (%mode%, 共 %files% 个文件) ==========</gold>"
    mode:
      dry_run: "预演"
      apply: "写入"
    file: "<yellow>%file%</yellow> <gray>- %status% %detail%</gray>"
    backup: "<gray>  已备份为 <white>%backup%</white></gray>"
    diff_line: "<gray>  %line%</gray>"
    summary: "<gray>转换 %converted% 个, 无旧键 %skipped% 个, 键冲突 %conflict% 个, 无法转换 %unconvertible% 个, 失败 %failed% 个</gray>"
    breakdown: "<gray>其中: 直接转为 matcher 并移除旧键 <white>%plain%</white> 处, 与原有 matcher 合并为 all_of 以保持判定等价 <white>%merged%</white> 处, 补写 matcher 但保留旧键 (仍用于取物, 扣除或计数)<white>%duplicated%</white> 处</gray>"
    file_merged: "<gray>  合并为 all_of <white>%merged%</white> 处, 保留旧键 <white>%duplicated%</white> 处, 直接转换 <white>%plain%</white> 处</gray>"
    dry_run_hint: "<yellow>以上为预演结果, 未写入任何文件. 执行 <white>/emakilevel convert-legacy confirm</white> 才会写入并备份原文件</yellow>"
    nothing_to_do: "<gray>没有需要转换的配置</gray>"
    status:
      converted: "可转换"
      no_legacy_block: "无旧键"
      conflict: "键冲突, 已保留原样"
      unconvertible: "无等价写法, 已保留原样"
      failed: "转换失败, 已保留原样"
