# EmakiLevel English language resource.
# Messages use MiniMessage; preserve placeholders documented beside message groups.
# version is maintained by resource synchronization when default keys are merged.

version: "1.6.8"

general:
  prefix: "<gray>[ <gradient:#A855F7:#F472B6>EmakiLevel</gradient> ]</gray>"
console:
  plugin_starting: "[startup] <gray>Starting...</gray>"
  plugin_started: "[startup] <green>Started</green>"
  plugin_stopped: "[shutdown] <yellow>Stopped</yellow>"
  config_precheck_passed: "[config] <gray>Config precheck passed: <yellow>%issues%</yellow> issue(s).</gray>"
  config_precheck_failed: "[config] <red>Config precheck failed: <yellow>%issues%</yellow> problem(s).</red>"
  config_precheck_issue: "[config] <gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "[config] <yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "[config] <red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray>(%hint%)</dark_gray>"
    messages:
      passed: "Level config precheck passed."
      required_file_missing: "Required file is missing."
      path_not_file: "Path is not a file."
      file_not_readable: "File is not readable."
      required_directory_missing: "Required directory is missing."
      path_not_directory: "Path is not a directory."
      directory_not_readable: "Directory is not readable."
  types_loaded: "[loader] <gray>Loaded <yellow>%count%</yellow> level type(s)</gray>"
  sources_loaded: "[loader] <gray>Loaded <yellow>%count%</yellow> experience source rule(s)</gray>"
  actions_registered: "[integration] <gray>CoreLib actions registered</gray>"
  papi_registered: "[integration] <gray>PlaceholderAPI expansion registered</gray>"
  attribute_bridge_ready: "[integration] <gray>EmakiAttribute contribution bridge connected</gray>"
  attribute_bridge_unavailable: "[integration] <gray>EmakiAttribute contribution bridge unavailable, skipped</gray>"
  mythic_drops_registered: "[integration] <gray>MythicMobs drops registered</gray>"
  bootstrap_start: "[loader] <gray>Checking default files...</gray>"
  bootstrap_complete: "[loader] <green>Default file check complete.</green>"
  versioned_file_updated: "[config] <green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "[loader] <gray>release_default_data=false, skipped default data file generation.</gray>"
  default_file_missing: "[loader] <yellow>Missing bundled default resource: <red>%path%</red></yellow>"
  bootstrap_copy_failed: "[loader] <yellow>Failed to copy default resource: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "[loader] <yellow>Failed to save default resource: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  directory_create_failed: "[loader] <yellow>Failed to create directory: <red>%path%</red></yellow>"
  # Console: rebuilding the level leaderboard failed
  leaderboard_rebuild_failed: "Failed to rebuild level leaderboard"
  # Console: EmakiAttribute bridge registration failed; placeholders: %cause%
  attribute_bridge_register_failed: "[integration] Attribute bridge registration failed: provider=EmakiAttribute, operation=register_attribute_bridge, cause=%cause%"
  # Console: pipeline stage registration failed; placeholders: %stage%, %reason%
  stage_register_failed: "[registry] Failed to register pipeline stage '%stage%': %reason%"
  # Console: player data async operation failed; placeholders: %operation%, %player%
  async_operation_failed: "Async %operation% failed for %player%"
  # Console: source rule requirement test threw and is treated as no match; placeholder: %error%
  source_rule_requirement_failed: "[matcher] Source rule requirement threw and is treated as no match: %error%"
  # Console: could not open the editor; placeholders: %item%, %error%
  editor_open_failed: "[editor] <red>Could not open EmakiLevel editor for %item% (%error%)</red>"
  # Console: missing editor GUI template; placeholder: %template%
  editor_template_missing: "[editor] <red>Missing EmakiLevel editor GUI template: %template%</red>"
  # Console: could not create a definition file; placeholders: %path%, %error%
  editor_browser_create_failed: "[editor] <red>Could not create definition: %path% (%error%)</red>"
  # Console: could not delete a definition file; placeholders: %path%, %error%
  editor_browser_delete_failed: "[editor] <red>Could not delete definition: %path% (%error%)</red>"
  # Console: could not list a definition directory; placeholders: %path%, %error%
  editor_browser_list_failed: "[editor] <red>Could not list definition directory: %path% (%error%)</red>"
command:
  no_permission: "%prefix%<red>You do not have permission.</red>"
  player_only: "%prefix%<red>This command can only be used by players.</red>"
  player_not_found: "%prefix%<red>Player not found or offline: <white>%player%</white></red>"
  type_not_found: "%prefix%<red>Level type not found: <white>%type%</white></red>"
  invalid_number: "%prefix%<red>Invalid number: <white>%value%</white></red>"
  reload_success: "%prefix%<green>Configuration reloaded.</green>"
  usage: "%prefix%<gray>Usage: /elv gui [type] | /elv info [type] | /elv levelup <type> | /elv topgui [type] | /elv edit [id]</gray>"
  # Command: edit subcommand help text
  help:
    desc:
      edit: "Open the in-game editor for a definition (no id opens the browser)"
  # Command: leaderboard header; placeholder: %type%
  top_header: "<gold>===== EmakiLevel Top: %type% =====</gold>"
  # Command: leaderboard entry; placeholders: %rank%, %player%, %level%, %total_exp%
  top_entry: "<yellow>#%rank%</yellow> <white>%player%</white> <gray>Lv.%level% / %total_exp% total</gray>"
  # Command: experience operation usage hint; placeholder: %mode%
  usage_exp: "<red>/elv %mode%exp <player> <type> <amount></red>"
  # Command: level operation usage hint; placeholder: %mode%
  usage_level: "<red>/elv %mode%level <player> <type> <amount></red>"
  # Command: reset usage hint
  usage_reset: "<red>/elv reset <player> <type></red>"
  # Command: reload duration; placeholder: %elapsed%
  reload_time: "<gray>Reload took: <white>%elapsed%ms</white></gray>"
  # Command: level up exp requirement debug output; placeholders: %type%, %level%, %required%, %source%
  debug_requirement: "<gray>Requirement %type% -> %level%: <yellow>%required%</yellow> <dark_gray>(%source%)</dark_gray></gray>"
  # Command: PDC sync completion notice; placeholder: %player%
  debug_pdc_synced: "<green>PDC synced for %player%.</green>"
  # Command: operation success feedback; placeholders: %type%, %old_level%, %new_level%, %old_exp%, %new_exp%
  operation_success: "<green>Operation succeeded: %type% Lv.%old_level% → Lv.%new_level%, exp %old_exp% → %new_exp%</green>"
  # Command: operation failure feedback; placeholder: %reason%
  operation_failed: "<red>Operation failed: %reason%</red>"
  convert_legacy:
    header: "<gold>========== Legacy item_sources conversion (%mode%, %files% files) ==========</gold>"
    mode:
      dry_run: "dry run"
      apply: "apply"
    file: "<yellow>%file%</yellow> <gray>- %status% %detail%</gray>"
    backup: "<gray>  Backed up as <white>%backup%</white></gray>"
    diff_line: "<gray>  %line%</gray>"
    summary: "<gray>Converted %converted%, no legacy key %skipped%, conflict %conflict%, unconvertible %unconvertible%, failed %failed%.</gray>"
    breakdown: "<gray>Of those: <white>%plain%</white> turned straight into a matcher with the legacy key removed, <white>%merged%</white> folded together with an existing matcher into one all_of so the decision stays equivalent, <white>%duplicated%</white> given a matcher while keeping the legacy key it still needs for building, deducting or counting items.</gray>"
    file_merged: "<gray>  <white>%merged%</white> merged into all_of, <white>%duplicated%</white> kept the legacy key, <white>%plain%</white> converted directly</gray>"
    dry_run_hint: "<yellow>Dry run only, nothing was written. Run <white>/emakilevel convert-legacy confirm</white> to apply and back up the originals.</yellow>"
    nothing_to_do: "<gray>Nothing to convert.</gray>"
    status:
      converted: "convertible"
      no_legacy_block: "no legacy key"
      conflict: "key conflict, left unchanged"
      unconvertible: "no equivalent form, left unchanged"
      failed: "conversion failed, left unchanged"
level:
  info_line: "%prefix%%type_display_name% <gray>Lv.%level% %exp%/%required_exp% (%progress_percent%%)</gray>"
  exp_gain: "%prefix%<green>%type_display_name% exp +%amount%</green>"
