version: "1.2.3"
general:
  prefix: "<gray>[ <gradient:#A78BFA:#60A5FA>EmakiLevel</gradient> ]</gray>"
console:
  plugin_starting: "<gray>Starting...</gray>"
  plugin_started: "<green>Started</green>"
  plugin_stopped: "<yellow>Stopped</yellow>"
  config_precheck_passed: "<gray>Config precheck passed: <yellow>%issues%</yellow> issue(s).</gray>"
  config_precheck_failed: "<red>Config precheck failed: <yellow>%issues%</yellow> issue(s).</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  types_loaded: "<gray>Loaded <yellow>%count%</yellow> level type(s)</gray>"
  sources_loaded: "<gray>Loaded <yellow>%count%</yellow> experience source rule(s)</gray>"
  actions_registered: "<gray>CoreLib actions registered</gray>"
  papi_registered: "<gray>PlaceholderAPI expansion registered</gray>"
  attribute_bridge_ready: "<gray>EmakiAttribute contribution bridge connected</gray>"
  attribute_bridge_unavailable: "<gray>EmakiAttribute contribution bridge unavailable, skipped</gray>"
  mythic_drops_registered: "<gray>MythicMobs drops registered</gray>"
  bootstrap_start: "<white>Checking default files...</white>"
  bootstrap_complete: "<green>Default file check complete.</green>"
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "<gray>release_default_data=false, skipped default data file generation.</gray>"
  default_file_missing: "<yellow>Missing bundled default resource: <red>%path%</red></yellow>"
  bootstrap_copy_failed: "<yellow>Failed to copy default resource: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>Failed to save default resource: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  directory_create_failed: "<yellow>Failed to create directory: <red>%path%</red></yellow>"
command:
  no_permission: "%prefix%<red>You do not have permission.</red>"
  player_only: "%prefix%<red>This command can only be used by players.</red>"
  player_not_found: "%prefix%<red>Player not found or offline: <white>%player%</white></red>"
  type_not_found: "%prefix%<red>Level type not found: <white>%type%</white></red>"
  invalid_number: "%prefix%<red>Invalid number: <white>%value%</white></red>"
  reload_success: "%prefix%<green>Configuration reloaded.</green>"
  usage: "%prefix%<gray>Usage: /elv gui [type] | /elv info [type] | /elv levelup <type> | /elv topgui [type]</gray>"
level:
  info_line: "%prefix%%type_display_name% <gray>Lv.%level% %exp%/%required_exp% (%progress_percent%%)</gray>"
  exp_gain: "%prefix%<green>%type_display_name% exp +%amount%</green>"
  levelup_success: "%prefix%<green>%type_display_name% reached <yellow>%new_level%</yellow>.</green>"
  levelup_failure: "%prefix%<red>Level up failed: %failure_reason%</red>"
  reset_success: "%prefix%<green>Reset %player%'s %type_display_name%.</green>"
gui:
  open_failed: "%prefix%<red>The level GUI is unavailable. Please ask an administrator to check the template.</red>"
  level:
    unknown_type: "%prefix%<red>Level type not found: <white>%type%</white></red>"
    page_info_name: "<aqua>Page %current_page%/%total_pages%</aqua>"
    page_info_lore: "<gray>Level types: <white>%type_count%</white></gray>"
    top_button_name: "<gold>%type_display_name% leaderboard</gold>"
    top_button_lore: "<gray>Click to view the selected level leaderboard</gray>"
    levelup_once_success: "%prefix%<green>%type_display_name% reached <yellow>%new_level%</yellow>.</green>"
    levelup_multi_success: "%prefix%<green>%type_display_name% leveled up <yellow>%count%</yellow> time(s).</green>"
    levelup_failed: "%prefix%<red>Level up failed: %failure_reason%</red>"
    lore:
      level: "<gray>Level: <yellow>%level%</yellow><dark_gray>/</dark_gray><gold>%max_level%</gold></gray>"
      exp: "<gray>Exp: <aqua>%exp%</aqua><dark_gray>/</dark_gray><blue>%required_exp%</blue></gray>"
      total: "<gray>Total exp: <white>%total_exp%</white></gray>"
      progress: "<gray>Progress: %progress_bar% <white>%progress_percent%%</white></gray>"
      left_click: "<yellow>Left click</yellow><gray> for details</gray>"
      right_click: "<yellow>Right click</yellow><gray> to level up once</gray>"
      shift_right_click: "<yellow>Shift + right click</yellow><gray> to level repeatedly</gray>"
    status:
      locked: "<red>Disabled</red>"
      max_level: "<gold>Max level</gold>"
      auto_only: "<aqua>Auto upgrade</aqua>"
      ready: "<green>Ready</green>"
      not_enough_exp: "<gray>Not enough exp</gray>"
  top:
    unknown_type: "%prefix%<red>Level type not found: <white>%type%</white></red>"
    entry_name: "<gold>#%rank%</gold> <white>%player%</white>"
    entry_lore: "<gray>Lv.%level% / %total_exp% total</gray>"
    page_info_name: "<aqua>Page %current_page%/%total_pages%</aqua>"
    page_info_lore: "<gray>Leaderboard entries: <white>%entry_count%</white></gray>"
    type_info_name: "<gold>%type_display_name%</gold>"
    type_info_lore: "<gray>Level type: <white>%type%</white>, entries: <aqua>%entry_count%</aqua></gray>"
failure:
  success: "Success"
  player_not_found: "Player not found"
  type_not_found: "Level type not found"
  type_disabled: "Level type disabled"
  upgrade_disabled: "Upgrade disabled"
  manual_upgrade_disabled: "Manual upgrade disabled"
  max_level: "Already at max level"
  not_enough_exp: "Not enough exp"
  invalid_amount: "Invalid amount"
  daily_cap_reached: "Daily exp cap reached"
  not_enough_money: "Not enough money"
  not_enough_material: "Not enough material"
  invalid_requirement: "Invalid requirement"
debug:
  command:
    status_header: "<gold>========== EmakiLevel Debug Status ==========</gold>"
    status_enabled: "<green>Debug enabled</green>"
    status_disabled: "<gray>Debug disabled</gray>"
    tracked_players: "<gray>Tracked players: <yellow>%players%</yellow></gray>"
    tracked_modules: "<gray>Tracked modules: <yellow>%modules%</yellow></gray>"
    player_added: "<green>Started tracking player: <aqua>%player%</aqua></green>"
    player_removed: "<yellow>Stopped tracking player: <aqua>%player%</aqua></yellow>"
    module_enabled: "<green>Module tracking enabled: <yellow>%module%</yellow></green>"
    module_disabled: "<yellow>Module tracking disabled: <gray>%module%</gray></yellow>"
    all_enabled: "<green>Global debug enabled (all players + all modules)</green>"
    all_disabled: "<yellow>All debug tracking disabled</yellow>"
    player_not_found: "<red>Online player not found: %player%</red>"
    available_modules: "<gray>Available modules: <yellow>%modules%</yellow></gray>"
