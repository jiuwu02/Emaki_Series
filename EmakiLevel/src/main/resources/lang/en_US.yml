version: "1.0.6"
general:
  prefix: "<gray>[ <gradient:#A78BFA:#60A5FA>EmakiLevel</gradient> ]</gray>"
console:
  plugin_starting: "<gray>Starting...</gray>"
  plugin_started: "<green>Started</green>"
  plugin_stopped: "<yellow>Stopped</yellow>"
  types_loaded: "<gray>Loaded <yellow>%count%</yellow> level type(s)</gray>"
  sources_loaded: "<gray>Loaded <yellow>%count%</yellow> experience source rule(s)</gray>"
  actions_registered: "<gray>CoreLib actions registered</gray>"
  papi_registered: "<gray>PlaceholderAPI expansion registered</gray>"
  attribute_bridge_ready: "<gray>EmakiAttribute contribution bridge connected</gray>"
  attribute_bridge_unavailable: "<gray>EmakiAttribute contribution bridge unavailable, skipped</gray>"
  mythic_drops_registered: "<gray>MythicMobs drops registered</gray>"
  bootstrap_start: "<white>Checking default files...</white>"
  bootstrap_complete: "<green>Default file check complete.</green>"
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_skip: "<gray>release_default_data=false, skipped default data file generation.</gray>"
  default_file_missing: "<yellow>Missing bundled default resource: <red>%path%</red></yellow>"
  bootstrap_copy_failed: "<yellow>Failed to copy default resource: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>Failed to save default resource: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  directory_create_failed: "<yellow>Failed to create directory: <red>%path%</red></yellow>"
command:
  no_permission: "%prefix%<red>You do not have permission.</red>"
  player_only: "%prefix%<red>This command can only be used by players.</red>"
  player_not_found: "%prefix%<red>Player not found or offline: <white>%player%</white></red>"
  type_not_found: "%prefix%<red>Level type not found: <white>%type%</white></red>"
  invalid_number: "%prefix%<red>Invalid number: <white>%value%</white></red>"
  reload_success: "%prefix%<green>Configuration reloaded.</green>"
  usage: "%prefix%<gray>Usage: /elv info [type] | /elv levelup <type></gray>"
level:
  info_line: "%prefix%%type_display_name% <gray>Lv.%level% %exp%/%required_exp% (%progress_percent%%)</gray>"
  exp_gain: "%prefix%<green>%type_display_name% exp +%amount%</green>"
  levelup_success: "%prefix%<green>%type_display_name% reached <yellow>%new_level%</yellow>.</green>"
  levelup_failure: "%prefix%<red>Level up failed: %failure_reason%</red>"
  reset_success: "%prefix%<green>Reset %player%'s %type_display_name%.</green>"
failure:
  type_disabled: "Level type disabled"
  upgrade_disabled: "Upgrade disabled"
  manual_upgrade_disabled: "Manual upgrade disabled"
  max_level: "Already at max level"
  not_enough_exp: "Not enough exp"
  invalid_amount: "Invalid amount"
  invalid_requirement: "Invalid requirement"
