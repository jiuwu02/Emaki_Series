    entry_lore: "<gray>Lv.%level% / %total_exp% total</gray>"
    page_info_name: "<aqua>Page %current_page%/%total_pages%</aqua>"
    page_info_lore: "<gray>Leaderboard entries: <white>%entry_count%</white></gray>"
    type_info_name: "<gold>%type_display_name%</gold>"
    type_info_lore: "<gray>Level type: <white>%type%</white>, entries: <aqua>%entry_count%</aqua></gray>"
