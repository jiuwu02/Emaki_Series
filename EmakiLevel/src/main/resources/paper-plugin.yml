name: EmakiLevel
main: emaki.jiuwu.craft.level.EmakiLevelPlugin
version: ${project.version}
api-version: "26.1"
folia-supported: true
dependencies:
  server:
    EmakiCoreLib:
      load: BEFORE
      required: true
      join-classpath: true
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true
    EmakiAttribute:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  emakilevel.use:
    default: true
  emakilevel.levelup:
    default: true
  emakilevel.top:
    default: true
  emakilevel.edit:
    default: op
  emakilevel.reload:
    default: op
  emakilevel.debug:
    default: op
  emakilevel.admin:
    default: op
