# ============================================================
# EmakiCodex 手动配方补充（可选兜底）
# ============================================================
# 仅用于极少数没有注册到原版 recipe 系统的配方，或想自定义展示。
# CraftEngine/ItemsAdder 的配方都注册在原版上、会被自动遍历，
# 正常情况无需在此声明。
#
# 物品使用 corelib 来源 shorthand:
#   minecraft-diamond / craftengine-xxx / itemsadder-xxx ...
# ============================================================

# 配方唯一 id（命名空间形式）
id: "emakicodex:example_manual"

# 类型: SHAPED / SHAPELESS / FURNACE / BLASTING / SMOKING / CAMPFIRE / SMITHING / STONECUTTING / OTHER
type: "SHAPELESS"

# 输入材料列表
ingredients:
  - item: "minecraft-diamond"
    amount: 2
  - item: "minecraft-stick"
    amount: 1

# 产出
result:
  item: "minecraft-diamond_sword"
  amount: 1

# 附加元数据（可选，仅展示用）
metadata:
  note: "这是一个手动声明的示例配方"
