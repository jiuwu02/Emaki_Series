# EmakiCodex 示例成就页。
# advancements/ 下每个 YAML 文件定义一个原版成就标签页。
# 成就键格式：emakicodex:<page_id>/<节点本地 id>；完成条件由插件设置为 impossible，
# 通过 `/codex grant`、`codex_grant_advancement` 动作段或事件触发器授予。
#
# 节点坐标 x/y 仅在 PacketEvents 可用且 config.yml 的
# advancement.packet-coordinates=true 时发送给客户端；否则按 parent 树自动排布。
# x/y 同时为 0 视为未指定坐标。使用手工坐标时建议整页统一配置，避免重叠。
#
# 节点完成动作示例：
# actions:
#   complete:
#     - "send_message text=<green>达成成就！</green>"
#
# 事件触发器 triggers.entries（可选）：
# 在成就节点下写 triggers.entries，玩家完成对应事件且条件满足时自动授予该成就。
# 需 config.yml 的 advancement.triggers-enabled=true（默认开）。
# 每个 trigger 含:
#   event:     事件类型（见下表）
#   condition: CoreLib 条件组（可省略；省略=只要事件发生就触发）
#              推荐使用 type + entries，与其他插件的 condition 块保持一致。
#              entries 内支持 == != < <= > >= 与 && || !，字符串值建议加引号。
#              变量用 %名称%，会先替换成事件的实际值再求值。
# 同一节点可写多个 trigger，满足任意一个即授予（“或”关系）。
#
# 可用 event 及其条件变量:
#   entity_kill      击杀实体          %entity_type%（如 ZOMBIE）
#   mythic_mob_kill  击杀 MythicMobs   %mythic_id%, %mythic_level%（需装 MythicMobs）
#   block_break      破坏方块          %block_type%（如 DIAMOND_ORE）
#   crop_harvest     收割成熟作物      %block_type%
#   craft_item       合成物品          %result_type%, %result_amount%
#   furnace_extract  从熔炉取出        %result_type%, %result_amount%
#   player_fish      钓鱼              %fish_state%（如 CAUGHT_FISH）
#   brew_complete    酿造完成          %potion_type%
#   entity_tame      驯服生物          %entity_type%
# 所有事件都额外提供: %player%（玩家名）, %world%（所在世界名）
# ============================================================

# 成就页 id（也作为成就 key 的路径前缀）
page_id: "example"

# 标签页标题（MiniMessage）
title: "<gradient:#F59E0B:#EC4899>图鉴示例</gradient>"

# 背景材质路径（支持资源包路径）
background: "minecraft:textures/gui/advancements/backgrounds/adventure.png"

# 根成就的本地 id（对应下方 advancements 中的 key）
root: "root"

advancements:
  root:
    icon: "minecraft-enchanted_book"
    title: "<gold>图鉴之路</gold>"
    description: "<gray>开启你的探索之旅。</gray>"
    frame: "task"
    # 根成就不写 parent
    # 坐标（需 PacketEvents）：根节点在最左，纵向居中
    x: 0.0
    y: 1.0
    toast: false
    announce: false
    hidden: false
    actions:
      complete: []

  first_step:
    icon: "minecraft-crafting_table"
    title: "<yellow>初次尝试</yellow>"
    description: "<gray>迈出探索的第一步。</gray>"
    frame: "task"
    parent: "root"
    # 坐标（需 PacketEvents）：根节点右侧一格
    x: 1.0
    y: 1.0
    toast: true
    announce: false
    hidden: false
    # 完成时执行 corelib action：给玩家发消息
    actions:
      complete:
        - "send_message text=<green>你迈出了图鉴之路的第一步！</green>"
    # 事件触发：合成一个工作台即达成
    triggers:
      entries:
        - event: "craft_item"
          condition:
            type: "all_of"
            entries:
              - '%result_type% == "CRAFTING_TABLE"'

  challenge:
    icon: "minecraft-nether_star"
    title: "<light_purple>终极挑战</light_purple>"
    description: "<gray>完成一项艰巨的挑战。</gray>"
    frame: "challenge"
    parent: "first_step"
    # 坐标（需 PacketEvents）：再向右一格
    x: 2.0
    y: 1.0
    toast: true
    announce: true
    # 默认可见（未完成也在 GUI 中显示）
    hidden: false
    actions:
      complete:
        - "send_message text=<gold>恭喜达成终极挑战！</gold>"
    # 事件触发：击杀凋灵或末影龙任意其一即达成
    triggers:
      entries:
        - event: "entity_kill"
          condition:
            type: "any_of"
            entries:
              - '%entity_type% == "ENDER_DRAGON"'
              - '%entity_type% == "WITHER"'
