# EmakiCodex 简体中文语言资源。
# 消息使用 MiniMessage；保留消息分组旁标明的占位符。
# version 由资源同步流程维护，用于合并新增默认键。

version: "1.1.5"

general:
  prefix: "<gray>[ <gradient:#D946EF:#F59E0B>EmakiCodex</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此操作。</red>"
  player_only: "<red>此命令只能由玩家执行。</red>"
  player_not_found: "<red>找不到玩家 %player%。</red>"
  unknown_command: "<red>未知命令，输入 /codex help 查看帮助。</red>"
  invalid_args: "<red>参数错误，输入 /codex help 查看用法。</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>配置已重载。</green>"
  reload_summary: "<gray>已注册成就 %advancements% 个。</gray>"
  # 玩家：重载耗时反馈；占位符：%millis%
  reload_duration: "<gray>重载耗时: <white>%millis%ms</white></gray>"

command:
  help:
    header: "<gold>========== EmakiCodex 帮助 ==========</gold>"
    footer: "<gold>=====================================</gold>"
    line: "<yellow>/codex %cmd%</yellow> <gray>- %desc%</gray>"
    commands:
      reload: "重载配置、重注册成就并给全员重发成就"
      codex: "打开图鉴界面"
      grant: "授予玩家成就"
      revoke: "撤销玩家成就"
      admin_unlock: "强制为玩家解锁图鉴条目"
      admin_reset: "重置玩家的图鉴状态，省略条目则清空全部"
      debug: "管理 Debug 模式"
  grant:
    done: "<green>已授予 %player% 成就 %advancement%。</green>"
  revoke:
    done: "<green>已撤销 %player% 的成就 %advancement%。</green>"
  advancement:
    failed: "<red>成就 %advancement% 操作失败：%reason%</red>"
    reason_unknown: "<red>未知原因</red>"
  codex:
    unlocked: "<green>已为 %player% 解锁图鉴条目 %entry%。</green>"
    reset: "<green>已重置 %player% 的 %count% 个图鉴条目。</green>"
    failed: "<red>图鉴条目 %entry% 操作失败：%reason%</red>"
    bad_reference: "<red>条目引用 %entry% 格式错误，应为 <分类id>/<条目id>。</red>"

codex:
  player:
    required: "未指定玩家。"
  advancement:
    disabled: "成就子系统已在 config.yml 中关闭（advancement.enabled=false）。"
    id_required: "未指定成就 id。"
    not_found: "成就 id 未注册。请确认 advancements/ 下的页面已加载，且 id 形如 emakicodex:<页面id>/<节点id>；可用 /codex reload 查看已注册数量。"
    missing_on_server: "成就已在插件内注册，但服务端上找不到对应的原版成就。通常是注册后被 reloadData 清除、或数据包目录未落盘所致；请检查启动日志中的注册数量与告警。"
  grant:
    already_completed: "玩家已完成该成就。"
    cancelled: "授予被其他插件取消。"
    rejected: "服务端拒绝写入完成条件。"
  revoke:
    not_completed: "玩家尚未完成该成就。"
    cancelled: "撤销被其他插件取消。"
    rejected: "服务端拒绝撤销完成条件。"
  entry:
    not_found: "图鉴条目未配置。请检查 codex/ 下的分类文件是否包含该条目。"
    locked: "该图鉴条目尚未解锁。"
    already_unlocked: "该图鉴条目已经解锁。"
    already_activated: "该图鉴条目已经激活。"
    already_claimed: "该图鉴条目的奖励已领取。"
    no_reward: "该图鉴条目没有可领取的一次性奖励。"
    nothing_to_reset: "没有可重置的图鉴状态。"
    state_stale: "图鉴数据尚未就绪或已被其他会话更新，请稍后重试。"
  loader:
    entry_skipped: "已跳过 %file% 中无法解析的图鉴条目 %entry%。"
    category_empty: "%file% 的图鉴分类 %category% 没有任何条目。"

gui:
  open_failed: "<red>无法打开图鉴界面，请检查 gui/codex_gui.yml 是否存在。</red>"
  no_categories: "<red>当前没有可用的图鉴分类。</red>"
  entry_unknown: "<dark_gray>未知条目</dark_gray>"
  entry_unlocked: "<green>已解锁图鉴条目 %codex_title%。</green>"
  entry_action_done: "<green>操作成功。</green>"
  category_active: "<green>当前分类</green>"
  category_inactive: "<dark_gray>点击查看</dark_gray>"
  state_locked: "<dark_gray>未解锁</dark_gray>"
  state_unlocked: "<yellow>可激活</yellow>"
  state_activated: "<aqua>已激活</aqua>"
  state_claimed: "<green>已领取</green>"
  hint_locked: "<dark_gray>达成解锁条件后可激活</dark_gray>"
  hint_activate: "<yellow>左键</yellow> <gray>激活以开启属性加成</gray>"
  hint_claim: "<yellow>右键</yellow> <gray>领取一次性奖励</gray>"
  hint_done: "<dark_gray>该条目已全部完成</dark_gray>"
  reward_attribute: "<gray>- <white>%attribute%</white> <green>+%value%</green></gray>"
  reward_claimable: "<gray>- <yellow>可领取的一次性奖励</yellow></gray>"
  reward_hidden: "<dark_gray>- 解锁后可见</dark_gray>"
  reward_none: "<dark_gray>- 无</dark_gray>"

broadcast:
  frame:
    task: "<white>%player% 达成了成就 <green>[%title%]</green></white>"
    goal: "<white>%player% 达成了目标 <green>[%title%]</green></white>"
    challenge: "<white>%player% 完成了挑战 <light_purple>[%title%]</light_purple></white>"

emaki:
  api:
    unavailable: "成就服务当前不可用（插件未启用或注册表未就绪）。"
    target_offline: "目标玩家不在线。"
    wrong_thread: "当前线程不拥有该玩家，操作被拒绝。"

console:
  plugin_starting: "[startup] <gray>正在启动 EmakiCodex...</gray>"
  plugin_started: "[startup] <green>已启动</green>"
  bootstrap_start: "[loader] <gray>正在释放默认资源...</gray>"
  bootstrap_skip: "[loader] <yellow>已跳过默认数据写入</yellow>"
  bootstrap_complete: "[loader] <green>默认文件检查完成</green>"
  versioned_file_updated: "[loader] <green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "[loader] <yellow>复制默认资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "[loader] <yellow>保存合并资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  default_file_missing: "[loader] <yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  directory_create_failed: "[loader] <yellow>创建目录失败: <red>%path%</red></yellow>"
  advancements_registered: "[advancement] 已注册成就 %count% 个"
  codex_categories_loaded: "[loader] 已加载图鉴分类 %count% 个"
  # 控制台：GUI 模板未加载；占位符：%template%
  gui_template_missing: "[gui] 图鉴 GUI 模板 '%template%' 未加载"
  # 控制台：命令响应发送失败；占位符：%sender%、%cause%
  command_dispatch_failed: "[command] 命令响应发送失败: sender=%sender%, operation=send_to_sender, cause=%cause%"
  advancements_resynced: "[advancement] 已向 %count% 名在线玩家重新推送成就(PacketEvents)，无需重连"
  advancements_need_relog: "[advancement] 成就已注册，但未检测到 PacketEvents，无法向在线玩家实时推送；在线玩家需重新登录后才能在成就界面看到更新"
  advancement_packet_enabled: "[packet] 成就发包坐标注入已启用(PacketEvents)"
  advancement_packet_absent: "[packet] 未检测到 PacketEvents，成就 x/y 坐标不生效，节点位置由客户端自动排布"
  script_engine_unavailable: "[script] 未检测到 GraalJS 运行库，图鉴脚本扩展不可用，插件其余功能不受影响"
  script_disabled: "[script] 图鉴脚本扩展已在 config.yml 中关闭(scripts.enabled=false)"
  script_loaded: "[script] 图鉴脚本加载完成: 成功 %loaded% 个文件，失败 %skipped% 个"
  script_file_error: "[script] 脚本文件 %file% 加载失败: %reason%"
  script_release_failed: "[script] 释放示例触发器脚本失败: %reason%"
  script_register_invalid_payload: "[script] 脚本触发器注册失败: payload 必须是对象"
  script_register_id_blank: "[script] 脚本触发器注册失败: id 必须是非空字符串"
  script_register_advancements_missing: "[script] 脚本触发器 %id% 注册失败: advancements 必须是可执行函数"
  script_register_priority_invalid: "[script] 脚本触发器 %id% 注册失败: priority 必须是整数"
  script_register_failed: "[script] 脚本触发器 %id% 注册失败: %reason%"
  script_callback_failed: "[script] 脚本触发器 %id% 执行失败: %reason%"
  script_callback_invalid_element: "[script] 脚本触发器 %id% 返回了 %count% 个非字符串元素，已跳过"
  config_precheck_passed: "[config] <gray>配置预检通过: <yellow>%issues%</yellow> 个提示</gray>"
  config_precheck_failed: "[config] <red>配置预检失败: <yellow>%issues%</yellow> 个问题</red>"
  config_precheck_issue: "[config] <gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "[config] <yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "[config] <red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray>(%hint%)</dark_gray>"
    messages:
      passed: "EmakiCodex 配置预检通过"
      required_file_missing: "缺少必需文件"
      path_not_file: "指定路径不是文件"
      file_not_readable: "文件不可读"
      required_directory_missing: "缺少必需目录"
      path_not_directory: "指定路径不是目录"
      directory_not_readable: "目录不可读"
