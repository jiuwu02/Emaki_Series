# EmakiCodex 简体中文语言资源。
# 消息支持 MiniMessage；修改后通过 `/codex reload` 应用。
# version 由资源同步流程维护，用于合并新增默认键。

version: "1.0.1"

general:
  prefix: "<gray>[ <gradient:#D946EF:#F59E0B>EmakiCodex</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此操作。</red>"
  player_only: "<red>此命令只能由玩家执行。</red>"
  player_not_found: "<red>找不到玩家 %player%。</red>"
  unknown_command: "<red>未知命令，输入 /codex help 查看帮助。</red>"
  invalid_args: "<red>参数错误，输入 /codex help 查看用法。</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>配置已重载。</green>"
  reload_summary: "<gray>已注册成就 %advancements% 个。</gray>"

command:
  help:
    header: "<gold>========== EmakiCodex 帮助 ==========</gold>"
    footer: "<gold>=====================================</gold>"
    line: "<yellow>/codex %cmd%</yellow> <gray>- %desc%</gray>"
    commands:
      reload: "重载配置、重注册成就并给全员重发成就"
      grant: "授予玩家成就"
      revoke: "撤销玩家成就"
      debug: "管理 Debug 模式"
  grant:
    done: "<green>已授予 %player% 成就 %advancement%。</green>"
  revoke:
    done: "<green>已撤销 %player% 的成就 %advancement%。</green>"
  advancement:
    failed: "<red>成就 %advancement% 操作失败：%reason%</red>"
    reason_unknown: "<red>未知原因</red>"

# 授予/撤销失败的具体原因。由服务层的 reasonKey 直接解析，新增原因只需在此加一条。
codex:
  player:
    required: "未指定玩家。"
  advancement:
    disabled: "成就子系统已在 config.yml 中关闭（advancement.enabled=false）。"
    id_required: "未指定成就 id。"
    not_found: "成就 id 未注册。请确认 advancements/ 下的页面已加载，且 id 形如 emakicodex:<页面id>/<节点id>；可用 /codex reload 查看已注册数量。"
    missing_on_server: "成就已在插件内注册，但服务端上找不到对应的原版成就。通常是注册后被 reloadData 清除、或数据包目录未落盘所致；请检查启动日志中的注册数量与告警。"
  grant:
    already_completed: "玩家已完成该成就。"
    cancelled: "授予被其他插件取消。"
    rejected: "服务端拒绝写入完成条件。"
  revoke:
    not_completed: "玩家尚未完成该成就。"
    cancelled: "撤销被其他插件取消。"
    rejected: "服务端拒绝撤销完成条件。"

emaki:
  api:
    unavailable: "成就服务当前不可用（插件未启用或注册表未就绪）。"
    target_offline: "目标玩家不在线。"
    wrong_thread: "当前线程不拥有该玩家，操作被拒绝。"

console:
  plugin_starting: "<gray>正在启动 EmakiCodex...</gray>"
  plugin_started: "<green>EmakiCodex 已启动。</green>"
  bootstrap_start: "<gray>正在释放默认资源...</gray>"
  bootstrap_skip: "<yellow>已跳过默认数据写入。</yellow>"
  bootstrap_complete: "<green>默认文件检查完成。</green>"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "<yellow>复制默认资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>保存合并资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  default_file_missing: "<yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  directory_create_failed: "<yellow>创建目录失败: <red>%path%</red></yellow>"
  advancements_registered: "已注册成就 %count% 个。"
  advancements_resynced: "已向 %count% 名在线玩家重新推送成就（PacketEvents），无需重连。"
  advancements_need_relog: "成就已注册，但未检测到 PacketEvents，无法向在线玩家实时推送；在线玩家需重新登录后才能在成就界面看到更新。"
  advancement_packet_enabled: "成就发包坐标注入已启用（PacketEvents）。"
  advancement_packet_absent: "未检测到 PacketEvents，成就 x/y 坐标不生效，节点位置由客户端自动排布。"
  config_precheck_passed: "<gray>配置预检通过：<yellow>%issues%</yellow> 个提示。</gray>"
  config_precheck_failed: "<red>配置预检失败：<yellow>%issues%</yellow> 个问题。</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray>（%hint%）</dark_gray>"
    messages:
      passed: "EmakiCodex 配置预检通过。"
      required_file_missing: "缺少必需文件。"
      path_not_file: "指定路径不是文件。"
      file_not_readable: "文件不可读。"
      required_directory_missing: "缺少必需目录。"
      path_not_directory: "指定路径不是目录。"
      directory_not_readable: "目录不可读。"
