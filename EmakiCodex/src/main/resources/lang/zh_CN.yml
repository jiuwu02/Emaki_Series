# ============================================================
# EmakiCodex 语言文件 - 简体中文
# ============================================================
# 支持 MiniMessage 格式。修改后使用 /codex reload 重载。
# ============================================================

# version 由资源同步维护
version: "1.0.13"

general:
  prefix: "<gray>[ <gradient:#F59E0B:#EC4899>EmakiCodex</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此操作。</red>"
  player_only: "<red>此命令只能由玩家执行。</red>"
  player_not_found: "<red>找不到玩家 %player%。</red>"
  unknown_command: "<red>未知命令，输入 /codex help 查看帮助。</red>"
  invalid_args: "<red>参数错误，输入 /codex help 查看用法。</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>配置已重载。</green>"
  reload_summary: "<gray>已注册成就 %advancements% 个。</gray>"

command:
  help:
    header: "<gold>========== EmakiCodex 帮助 ==========</gold>"
    footer: "<gold>=====================================</gold>"
    line: "<yellow>/codex %cmd%</yellow> <gray>- %desc%</gray>"
    commands:
      reload: "重载配置、重注册成就并给全员重发成就"
      grant: "授予玩家成就"
      revoke: "撤销玩家成就"
      debug: "管理 Debug 模式"
  grant:
    done: "<green>已授予 %player% 成就 %advancement%。</green>"
  revoke:
    done: "<green>已撤销 %player% 的成就 %advancement%。</green>"
  advancement:
    failed: "<red>成就 %advancement% 未注册或状态无变化。</red>"

console:
  plugin_starting: "正在启动 EmakiCodex..."
  plugin_started: "EmakiCodex 已启动。"
  bootstrap_start: "正在释放默认资源..."
  bootstrap_skip: "已跳过默认示例数据释放。"
  bootstrap_complete: "默认资源就绪。"
  advancements_registered: "已注册成就 %count% 个。"
  advancements_resynced: "已向 %count% 名在线玩家重新推送成就（PacketEvents），无需重连。"
  advancements_need_relog: "成就已注册，但未检测到 PacketEvents，无法向在线玩家实时推送；在线玩家需重新登录后才能在成就界面看到更新。"
  advancement_packet_enabled: "成就发包坐标注入已启用（PacketEvents）。"
  advancement_packet_absent: "未检测到 PacketEvents，成就 x/y 坐标不生效，节点位置由客户端自动排布。"
