  script_disabled: "[script] 图鉴脚本扩展已在 config.yml 中关闭 (scripts.enabled=false)"
  script_loaded: "[script] 图鉴脚本加载完成: 成功 %loaded% 个文件, 失败 %skipped% 个"
  script_file_error: "[script] 脚本文件 %file% 加载失败: %reason%"
  script_release_failed: "[script] 释放示例触发器脚本失败: %reason%"
  script_register_invalid_payload: "[script] 脚本触发器注册失败: payload 必须是对象"
  script_register_id_blank: "[script] 脚本触发器注册失败: id 必须是非空字符串"
  script_register_advancements_missing: "[script] 脚本触发器 %id% 注册失败: advancements 必须是可执行函数"
