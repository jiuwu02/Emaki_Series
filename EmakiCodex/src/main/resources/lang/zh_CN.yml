  gui_template_missing: "[gui] 图鉴 GUI 模板 '%template%' 未加载"
  # 控制台: 命令响应发送失败; 占位符: %sender%, %cause%
  command_dispatch_failed: "[command] 命令响应发送失败: sender=%sender%, operation=send_to_sender, cause=%cause%"
