# EmakiCodex English language resource
# Messages use MiniMessage; preserve placeholders documented beside message groups
# version is maintained by resource synchronization when default keys are merged

version: "2.0.4"

tags:
  advancement: '[ advancement ]'
  packet: '[ packet ]'
  provider: '[ provider ]'

general:
  prefix: "<gray>[ <gradient:#D946EF:#F59E0B>EmakiCodex</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to do that</red>"
  player_only: "<red>This command can only be run by a player</red>"
  player_not_found: "<red>Player %player% not found</red>"
  unknown_command: "<red>Unknown command. Use /codex help</red>"
  invalid_args: "<red>Invalid arguments. Use /codex help</red>"
  reloading: "<gray>Reloading configuration...</gray>"
  reload_success: "<green>Configuration reloaded</green>"
  reload_summary: "<gray>Registered %advancements% advancements</gray>"
  # Player: reload duration feedback; placeholders: %millis%
  reload_duration: "<gray>Reload took: <white>%millis%ms</white></gray>"

command:
  help_header: "<gray><st>        </st></gray> <gradient:#D946EF:#F59E0B>EmakiCodex Command Help</gradient> <gray><st>        </st></gray>"
  help_entry_codex: "- <hover:show_text:'<gray>codex</gray> <dark_gray>·</dark_gray> <gray>Open the codex GUI</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Alias </gray><white>open</white><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakicodex.use</white> <gray>or </gray><white>emakicodex.admin</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>codex</gray></hover> <click:run_command:'%root% codex'><green>[ ✦ Run ]</green></click>"
  help_entry_reload: "- <hover:show_text:'<gray>reload</gray> <dark_gray>·</dark_gray> <gray>Reload config and re-register advancements</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakicodex.reload</white> <gray>or </gray><white>emakicodex.admin</white><newline><dark_gray>▸</dark_gray> <gray>Resyncs advancements for everyone and prints a summary</gray>'><gray>reload</gray></hover> <click:run_command:'%root% reload'><green>[ ✦ Run ]</green></click>"
  help_entry_edit: "- <hover:show_text:'<gray>edit</gray> <dark_gray>·</dark_gray> <gray>Open the in-game editor for a definition</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Argument: definition ID - click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Omit [definition ID] to open the definition browser</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakicodex.edit</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>edit</gray></hover> <click:run_command:'%root% help edit id'><yellow>[ ✦ Show values ]</yellow></click>"
  help_entry_grant: "- <hover:show_text:'<gray>grant</gray> <dark_gray>·</dark_gray> <gray>Grant an advancement to a player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakicodex.admin</white><newline><dark_gray>▸</dark_gray> <gray>Usage </gray><white>%root% grant [player] [advancement ID]</white><newline><dark_gray>▸</dark_gray> <gray>[advancement ID] looks like </gray><white>emakicodex:page/node</white>'><gray>grant</gray></hover> <hover:show_text:'<gray>Argument: player</gray><newline><gray>the target online player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ player ]</gray></hover> <hover:show_text:'<gray>Argument: advancement ID</gray><newline><gray>the advancement to grant</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ advancement ID ]</gray></hover>"
  help_entry_revoke: "- <hover:show_text:'<gray>revoke</gray> <dark_gray>·</dark_gray> <gray>Revoke an advancement from a player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakicodex.admin</white><newline><dark_gray>▸</dark_gray> <gray>Usage </gray><white>%root% revoke [player] [advancement ID]</white><newline><dark_gray>▸</dark_gray> <gray>[advancement ID] looks like </gray><white>emakicodex:page/node</white>'><gray>revoke</gray></hover> <hover:show_text:'<gray>Argument: player</gray><newline><gray>the target online player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ player ]</gray></hover> <hover:show_text:'<gray>Argument: advancement ID</gray><newline><gray>the advancement to revoke</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ advancement ID ]</gray></hover>"
  help_entry_admin: "- <hover:show_text:'<gray>admin</gray> <dark_gray>·</dark_gray> <gray>Codex entry management</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakicodex.admin</white>'><gray>admin</gray></hover> <click:run_command:'%root% help admin'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>unlock</gray> <dark_gray>·</dark_gray> <gray>force-unlock a codex entry</gray><newline><gray>reset</gray> <dark_gray>·</dark_gray> <gray>reset codex state</gray>'><gray>[ ✦ Args ]</gray></click>"
  help_entry_debug: "- <hover:show_text:'<gray>debug</gray> <dark_gray>·</dark_gray> <gray>Debug tools: debug switch, tracked players and modules, action pipeline debugging</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakicodex.debug</white> <gray>or </gray><white>emakicodex.admin</white><newline><dark_gray>▸</dark_gray> <gray>Without arguments it shows the debug status</gray>'><gray>debug</gray></hover> <click:run_command:'%root% help debug'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>status</gray> <dark_gray>·</dark_gray> <gray>show the debug status</gray><newline><gray>on</gray> <dark_gray>·</dark_gray> <gray>turn global debug on</gray><newline><gray>off</gray> <dark_gray>·</dark_gray> <gray>turn global debug off</gray><newline><gray>player</gray> <dark_gray>·</dark_gray> <gray>toggle debug tracking for a player</gray><newline><gray>module</gray> <dark_gray>·</dark_gray> <gray>toggle debug output for a module</gray><newline><gray>action</gray> <dark_gray>·</dark_gray> <gray>action pipeline debugging</gray>'><gray>[ ✦ Args ]</gray></click>"
  help_entry_help: "- <hover:show_text:'<gray>help</gray> <dark_gray>·</dark_gray> <gray>Show this help page</gray>'><gray>help</gray></hover> <click:run_command:'%root% help'><green>[ ✦ Run ]</green></click>"
  help_admin_header: "<gray><st>        </st></gray> <gradient:#D946EF:#F59E0B>EmakiCodex admin Command Help</gradient> <gray><st>        </st></gray>"
  help_admin_entry_unlock: "- <hover:show_text:'<gray>unlock</gray> <dark_gray>·</dark_gray> <gray>Force-unlock a codex entry for a player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Usage </gray><white>%root% admin unlock [player] [entry]</white><newline><dark_gray>▸</dark_gray> <gray>[entry] is written as [category ID]/[entry ID]</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakicodex.admin</white>'><gray>unlock</gray></hover> <hover:show_text:'<gray>Argument: player</gray><newline><gray>the target online player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ player ]</gray></hover> <hover:show_text:'<gray>Argument: entry</gray><newline><gray>codex entry reference, written as [category ID]/[entry ID]</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ entry ]</gray></hover>"
  help_admin_entry_reset: "- <hover:show_text:'<gray>reset</gray> <dark_gray>·</dark_gray> <gray>Reset the codex state of a player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Argument: player - click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Omit [entry] to clear all codex state of that player</gray><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakicodex.admin</white>'><gray>reset</gray></hover> <click:run_command:'%root% help admin reset player'><hover:show_text:'<gray>Argument: player</gray><newline><gray>an online player name; click to see available players</gray>'><gray>[ ✦ Player ]</gray></hover></click> <hover:show_text:'<gray>Argument: entry</gray><newline><gray>optional, written as [category ID]/[entry ID]</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ entry ]</gray></hover>"
  help_admin_reset_player_header: "<gray><st>        </st></gray> <gradient:#D946EF:#F59E0B>EmakiCodex admin reset [player] values</gradient> <gray><st>        </st></gray>"
  help_edit_id_header: "<gray><st>        </st></gray> <gradient:#D946EF:#F59E0B>EmakiCodex edit [definition ID] values</gradient> <gray><st>        </st></gray>"
  help_debug_header: "<gray><st>        </st></gray> <gradient:#D946EF:#F59E0B>EmakiCodex debug Command Help</gradient> <gray><st>        </st></gray>"
  help_debug_entry_status: "- <hover:show_text:'<gray>status</gray> <dark_gray>·</dark_gray> <gray>Show the debug switch, tracked players and modules</gray>'><gray>status</gray></hover> <click:run_command:'%root% debug status'><green>[ ✦ Run ]</green></click>"
  help_debug_entry_on: "- <hover:show_text:'<gray>on</gray> <dark_gray>·</dark_gray> <gray>Turn on global debug output</gray>'><gray>on</gray></hover> <click:run_command:'%root% debug on'><green>[ ✦ Run ]</green></click>"
  help_debug_entry_off: "- <hover:show_text:'<gray>off</gray> <dark_gray>·</dark_gray> <gray>Turn off global debug output</gray>'><gray>off</gray></hover> <click:run_command:'%root% debug off'><green>[ ✦ Run ]</green></click>"
  help_debug_entry_player: "- <hover:show_text:'<gray>player</gray> <dark_gray>·</dark_gray> <gray>Toggle debug tracking for the given player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Omit [player] to list the debuggable modules</gray>'><gray>player</gray></hover> <click:run_command:'%root% help debug player'><hover:show_text:'<gray>Argument: player</gray><newline><gray>an online player name; click to see available players</gray>'><gray>[ ✦ Player ]</gray></hover></click>"
  help_debug_entry_module: "- <hover:show_text:'<gray>module</gray> <dark_gray>·</dark_gray> <gray>Toggle debug output for the given module</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Omit [module ID] to list the debuggable modules</gray>'><gray>module</gray></hover> <hover:show_text:'<gray>Argument: module ID</gray><newline><gray>the module to toggle debug output for</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Must be typed by you</gray><newline><dark_gray>▸</dark_gray> <gray>Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>No click-to-run button</gray>'><gray>[ module ID ]</gray></hover>"
  help_debug_entry_action: "- <hover:show_text:'<gray>action</gray> <dark_gray>·</dark_gray> <gray>Action pipeline debugging: dry-run, static check, registry check</gray>'><gray>action</gray></hover> <click:run_command:'%root% help debug action'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>run</gray> <dark_gray>·</dark_gray> <gray>dry-run or execute one action pipeline</gray><newline><gray>check</gray> <dark_gray>·</dark_gray> <gray>statically check one action pipeline</gray><newline><gray>registry</gray> <dark_gray>·</dark_gray> <gray>check the stage registry</gray>'><gray>[ ✦ Args ]</gray></click>"
  help_debug_player_header: "<gray><st>        </st></gray> <gradient:#D946EF:#F59E0B>EmakiCodex debug player [player] values</gradient> <gray><st>        </st></gray>"
  help_debug_action_header: "<gray><st>        </st></gray> <gradient:#D946EF:#F59E0B>EmakiCodex debug action Command Help</gradient> <gray><st>        </st></gray>"
  help_debug_action_entry_run: "- <hover:show_text:'<gray>run</gray> <dark_gray>·</dark_gray> <gray>Dry-run preview or real execution of one action pipeline</gray>'><gray>run</gray></hover> <click:run_command:'%root% help debug action run'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>shadow</gray> <dark_gray>·</dark_gray> <gray>dry-run preview, no real effects</gray><newline><gray>execute</gray> <dark_gray>·</dark_gray> <gray>really run the action pipeline</gray>'><gray>[ ✦ Args ]</gray></click>"
