# EmakiCodex English language resource.
# Messages support MiniMessage; apply changes with /codex reload.
# version is maintained by the resource synchronization process and used to merge new default keys.

version: "1.0.1"

general:
  prefix: "<gray>[ <gradient:#D946EF:#F59E0B>EmakiCodex</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to do that.</red>"
  player_only: "<red>This command can only be run by a player.</red>"
  player_not_found: "<red>Player %player% not found.</red>"
  unknown_command: "<red>Unknown command. Use /codex help.</red>"
  invalid_args: "<red>Invalid arguments. Use /codex help.</red>"
  reloading: "<gray>Reloading configuration...</gray>"
  reload_success: "<green>Configuration reloaded.</green>"
  reload_summary: "<gray>Registered %advancements% advancements.</gray>"

command:
  help:
    header: "<gold>========== EmakiCodex Help ==========</gold>"
    footer: "<gold>=====================================</gold>"
    line: "<yellow>/codex %cmd%</yellow> <gray>- %desc%</gray>"
    commands:
      reload: "Reload config, re-register advancements, resync all"
      grant: "Grant an advancement to a player"
      revoke: "Revoke an advancement from a player"
      debug: "Manage debug mode"
  grant:
    done: "<green>Granted advancement %advancement% to %player%.</green>"
  revoke:
    done: "<green>Revoked advancement %advancement% from %player%.</green>"
  advancement:
    failed: "<red>Advancement %advancement% operation failed: %reason%</red>"
    reason_unknown: "<red>unknown reason</red>"

# Concrete reasons a grant/revoke was refused. Resolved straight from the service's reasonKey, so a new
# cause only needs an entry here.
codex:
  player:
    required: "No player given."
  advancement:
    disabled: "The advancement subsystem is disabled in config.yml (advancement.enabled=false)."
    id_required: "No advancement id given."
    not_found: "The advancement id is not registered. Check that the page under advancements/ loaded and that the id looks like emakicodex:<pageId>/<nodeId>; /codex reload reports how many are registered."
    missing_on_server: "The advancement is registered inside the plugin but the server has no matching vanilla advancement. Usually it was cleared by reloadData after registration, or the datapack directory was never written; check the registration count and warnings in the startup log."
  grant:
    already_completed: "The player has already completed this advancement."
    cancelled: "The grant was cancelled by another plugin."
    rejected: "The server refused to award the completion criterion."
  revoke:
    not_completed: "The player has not completed this advancement yet."
    cancelled: "The revoke was cancelled by another plugin."
    rejected: "The server refused to revoke the completion criterion."

emaki:
  api:
    unavailable: "The advancement service is unavailable (plugin disabled or registry not ready)."
    target_offline: "The target player is offline."
    wrong_thread: "The current thread does not own that player; the operation was refused."

console:
  plugin_starting: "<gray>Starting EmakiCodex...</gray>"
  plugin_started: "<green>EmakiCodex started.</green>"
  bootstrap_start: "<gray>Releasing default resources...</gray>"
  bootstrap_skip: "<yellow>Skipped default data generation.</yellow>"
  bootstrap_complete: "<green>Default file check complete.</green>"
  versioned_file_updated: "<green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "<yellow>Failed to copy default resource: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>Failed to save merged resource: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  default_file_missing: "<yellow>Missing built-in default resource: <red>%path%</red></yellow>"
  directory_create_failed: "<yellow>Failed to create directory: <red>%path%</red></yellow>"
  advancements_registered: "Registered %count% advancements."
  advancements_resynced: "Re-pushed advancements to %count% online player(s) via PacketEvents; no relog needed."
  advancements_need_relog: "Advancements registered, but PacketEvents was not detected, so online players cannot be refreshed live; they must reconnect to see the updated advancement screen."
  advancement_packet_enabled: "Advancement packet coordinate injection enabled (PacketEvents)."
  advancement_packet_absent: "PacketEvents not detected; advancement x/y coordinates are ignored and the client auto-lays-out nodes."
  config_precheck_passed: "<gray>Config precheck passed: <yellow>%issues%</yellow> hint(s).</gray>"
  config_precheck_failed: "<red>Config precheck failed: <yellow>%issues%</yellow> issue(s).</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "<yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "<red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray>(%hint%)</dark_gray>"
    messages:
      passed: "EmakiCodex configuration precheck passed."
      required_file_missing: "The required file is missing."
      path_not_file: "The specified path is not a file."
      file_not_readable: "The file is not readable."
      required_directory_missing: "The required directory is missing."
      path_not_directory: "The specified path is not a directory."
      directory_not_readable: "The directory is not readable."
