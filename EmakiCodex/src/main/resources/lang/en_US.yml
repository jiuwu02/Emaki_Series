# EmakiCodex English language resource
# Messages use MiniMessage; preserve placeholders documented beside message groups
# version is maintained by resource synchronization when default keys are merged

version: "1.1.8"

general:
  prefix: "<gray>[ <gradient:#D946EF:#F59E0B>EmakiCodex</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to do that</red>"
  player_only: "<red>This command can only be run by a player</red>"
  player_not_found: "<red>Player %player% not found</red>"
  unknown_command: "<red>Unknown command. Use /codex help</red>"
  invalid_args: "<red>Invalid arguments. Use /codex help</red>"
  reloading: "<gray>Reloading configuration...</gray>"
  reload_success: "<green>Configuration reloaded</green>"
  reload_summary: "<gray>Registered %advancements% advancements</gray>"
  # Player: reload duration feedback; placeholders: %millis%
  reload_duration: "<gray>Reload took: <white>%millis%ms</white></gray>"

command:
  help:
    header: "<gold>========== EmakiCodex Help ==========</gold>"
    footer: "<gold>=====================================</gold>"
    line: "<yellow>/codex %cmd%</yellow> <gray>- %desc%</gray>"
    commands:
      codex: "Open the codex GUI"
      reload: "Reload config, re-register advancements, resync all"
      edit: "Open the in-game editor for a definition"
      grant: "Grant an advancement to a player"
      revoke: "Revoke an advancement from a player"
      admin_unlock: "Force-unlock a codex entry for a player"
      admin_reset: "Reset a player's codex state; omit the entry to clear everything"
      debug: "Manage debug mode"
  grant:
    done: "<green>Granted advancement %advancement% to %player%</green>"
  revoke:
    done: "<green>Revoked advancement %advancement% from %player%</green>"
  advancement:
    failed: "<red>Advancement %advancement% operation failed: %reason%</red>"
    reason_unknown: "<red>unknown reason</red>"
  codex:
    unlocked: "<green>Unlocked codex entry %entry% for %player%</green>"
    reset: "<green>Reset %count% codex entries for %player%</green>"
    failed: "<red>Codex entry %entry% operation failed: %reason%</red>"
    bad_reference: "<red>Entry reference %entry% is malformed; expected <categoryId>/<entryId></red>"

codex:
  player:
    required: "No player given"
  advancement:
    disabled: "The advancement subsystem is disabled in config.yml  (advancement.enabled=false)"
    id_required: "No advancement id given"
    not_found: "The advancement id is not registered. Check that the page under advancements/ loaded and that the id looks like emakicodex:<pageId>/<nodeId>; /codex reload reports how many are registered"
    missing_on_server: "The advancement is registered inside the plugin but the server has no matching vanilla advancement. Usually it was cleared by reloadData after registration, or the datapack directory was never written; check the registration count and warnings in the startup log"
  grant:
    already_completed: "The player has already completed this advancement"
    cancelled: "The grant was cancelled by another plugin"
    rejected: "The server refused to award the completion criterion"
  revoke:
    not_completed: "The player has not completed this advancement yet"
    cancelled: "The revoke was cancelled by another plugin"
    rejected: "The server refused to revoke the completion criterion"
  entry:
    not_found: "The codex entry is not configured. Check whether the category files under codex/ contain it"
    locked: "That codex entry is not unlocked yet"
    already_unlocked: "That codex entry is already unlocked"
    already_activated: "That codex entry is already activated"
    already_claimed: "The reward for that codex entry has already been claimed"
    no_reward: "That codex entry has no one-off reward to claim"
    nothing_to_reset: "There is no codex state to reset"
    state_stale: "Codex data is not ready or was updated by another session; try again shortly"
  loader:
    entry_skipped: "Skipped unreadable codex entry %entry% in %file%"
    category_empty: "Codex category %category% in %file% has no entries"

gui:
  open_failed: "<red>Could not open the codex GUI; check that gui/codex_gui.yml exists</red>"
  no_categories: "<red>No codex categories are available</red>"
  entry_unknown: "<dark_gray>Unknown entry</dark_gray>"
  entry_unlocked: "<green>Unlocked codex entry %codex_title%</green>"
  entry_action_done: "<green>Done</green>"
  category_active: "<green>Current category</green>"
  category_inactive: "<dark_gray>Click to view</dark_gray>"
  state_locked: "<dark_gray>Locked</dark_gray>"
  state_unlocked: "<yellow>Ready to activate</yellow>"
  state_activated: "<aqua>Activated</aqua>"
  state_claimed: "<green>Claimed</green>"
  hint_locked: "<dark_gray>Meet the unlock condition to activate</dark_gray>"
  hint_activate: "<yellow>Left click</yellow> <gray>to activate the attribute bonus</gray>"
  hint_claim: "<yellow>Right click</yellow> <gray>to claim the one-off reward</gray>"
  hint_done: "<dark_gray>This entry is fully completed</dark_gray>"
  reward_attribute: "<gray>- <white>%attribute%</white> <green>+%value%</green></gray>"
  reward_claimable: "<gray>- <yellow>One-off reward available</yellow></gray>"
  reward_hidden: "<dark_gray>- Visible once unlocked</dark_gray>"
  reward_none: "<dark_gray>- None</dark_gray>"

broadcast:
  frame:
    task: "<white>%player% has made the advancement <green>[%title%]</green></white>"
    goal: "<white>%player% has reached the goal <green>[%title%]</green></white>"
    challenge: "<white>%player% has completed the challenge <light_purple>[%title%]</light_purple></white>"

emaki:
  api:
    unavailable: "The advancement service is unavailable  (plugin disabled or registry not ready)"
    target_offline: "The target player is offline"
    wrong_thread: "The current thread does not own that player; the operation was refused"

console:
  plugin_starting: "[startup] <gray>Starting EmakiCodex...</gray>"
  plugin_started: "[startup] <green>started</green>"
  bootstrap_start: "[loader] <gray>Releasing default resources...</gray>"
  bootstrap_skip: "[loader] <yellow>Skipped default data generation</yellow>"
  bootstrap_complete: "[loader] <green>Default file check complete</green>"
  versioned_file_updated: "[loader] <green>Updated bundled file version: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "[loader] <yellow>Failed to copy default resource: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  bootstrap_save_failed: "[loader] <yellow>Failed to save merged resource: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  default_file_missing: "[loader] <yellow>Missing built-in default resource: <red>%path%</red></yellow>"
  directory_create_failed: "[loader] <yellow>Failed to create directory: <red>%path%</red></yellow>"
  editor_open_failed: "[editor] <red>Could not open EmakiCodex editor for %item%  (%error%)</red>"
  editor_template_missing: "[editor] <red>Missing EmakiCodex editor template: %template%</red>"
  editor_browser_create_failed: "[editor] <red>Could not create definition: %path%  (%error%)</red>"
  editor_browser_delete_failed: "[editor] <red>Could not delete definition: %path%  (%error%)</red>"
  editor_browser_list_failed: "[editor] <red>Could not list definition directory: %path%  (%error%)</red>"
  advancements_registered: "[advancement] Registered %count% advancements"
  codex_categories_loaded: "[loader] Loaded %count% codex categories"
  # Console: GUI template not loaded; placeholders: %template%
  gui_template_missing: "[gui] Codex GUI template '%template%' is not loaded"
  # Console: command response dispatch failed; placeholders: %sender%, %cause%
  command_dispatch_failed: "[command] command response dispatch failed: sender=%sender%, operation=send_to_sender, cause=%cause%"
  advancements_resynced: "[advancement] Re-pushed advancements to %count% online player (s) via PacketEvents; no relog needed"
  advancements_need_relog: "[advancement] Advancements registered, but PacketEvents was not detected, so online players cannot be refreshed live; they must reconnect to see the updated advancement screen"
  advancement_packet_enabled: "[packet] Advancement packet coordinate injection enabled  (PacketEvents)"
  advancement_packet_absent: "[packet] PacketEvents not detected; advancement x/y coordinates are ignored and the client auto-lays-out nodes"
  script_engine_unavailable: "[script] GraalJS runtime not detected; the codex script extension is unavailable and the rest of the plugin is unaffected"
  script_disabled: "[script] The codex script extension is disabled in config.yml  (scripts.enabled=false)"
  script_loaded: "[script] Codex scripts loaded: %loaded% file (s) succeeded, %skipped% failed"
  script_file_error: "[script] Script file %file% failed to load: %reason%"
  script_release_failed: "[script] Failed to release the example trigger script: %reason%"
  script_register_invalid_payload: "[script] Script trigger registration failed: payload must be an object"
  script_register_id_blank: "[script] Script trigger registration failed: id must be a non-blank string"
  script_register_advancements_missing: "[script] Script trigger %id% registration failed: advancements must be an executable function"
  script_register_priority_invalid: "[script] Script trigger %id% registration failed: priority must be an integer"
  script_register_failed: "[script] Script trigger %id% registration failed: %reason%"
  script_callback_failed: "[script] Script trigger %id% execution failed: %reason%"
  script_callback_invalid_element: "[script] Script trigger %id% returned %count% non-string element (s); skipped"
  config_precheck_passed: "[config] <gray>Config precheck passed: <yellow>%issues%</yellow> hint (s)</gray>"
  config_precheck_failed: "[config] <red>Config precheck failed: <yellow>%issues%</yellow> issue (s)</red>"
  config_precheck_issue: "[config] <gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "[config] <yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "[config] <red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray> (%hint%)</dark_gray>"
    messages:
      passed: "EmakiCodex configuration precheck passed"
      required_file_missing: "The required file is missing"
      path_not_file: "The specified path is not a file"
      file_not_readable: "The file is not readable"
      required_directory_missing: "The required directory is missing"
      path_not_directory: "The specified path is not a directory"
      directory_not_readable: "The directory is not readable"

