# EmakiCodex 图鉴分类示例。
# codex/ 下每个 YAML 文件定义一个图鉴分类，对应图鉴 GUI 的一个分类标签。
# 这里的分类与 advancements/ 下的 page_id（原版成就标签页）是两个独立概念，不要混用。
# 条目的复合 id 为 <category_id>/<条目 id>，命令与数据文件都用这个形式。
# 解锁与奖励是两条独立通路：
#   unlock   条件命中后条目变为已解锁，此时才能激活。
#   rewards.attributes  激活后长期生效，数值按当前配置实时推导（改配置立刻生效）。
#   rewards.actions     领取时执行一次，走 CoreLib 动作行。
# 激活与领取是两个独立操作：激活只开属性，领取只发一次性奖励。
# unlock.triggers 的 event 取值与 advancements/ 的事件触发器一致：
#   entity_kill / mythic_mob_kill / block_break / crop_harvest / craft_item
#   furnace_extract / player_fish / brew_complete / entity_tame
# condition 省略时表示只要事件发生就命中。
# ============================================================

# 分类 id，留空则整份文件被丢弃。
category_id: "example"
title: "<gold>试炼图鉴</gold>"
icon: "minecraft-book"
# 分类在 GUI 中的排序，升序。
order: 100

entries:
  first_blood:
    title: "<yellow>初次讨伐</yellow>"
    description: "<gray>击败任意敌对生物。</gray>"
    icon: "minecraft-iron_sword"
    # 未解锁时是否从 GUI 中隐藏；false 则显示为未知条目。
    hidden: false
    # triggers 与 advancements 可并存，任一命中即解锁。
    unlock:
      triggers:
        - event: "entity_kill"
    rewards:
      attributes:
        physical_attack: 2.0
      actions:
        - "send_message text=<green>已领取初次讨伐的奖励。</green>"

  master_miner:
    title: "<aqua>掘进者</aqua>"
    description: "<gray>挖掘一块钻石矿石。</gray>"
    icon: "minecraft-diamond_pickaxe"
    hidden: true
    unlock:
      triggers:
        - event: "block_break"
          condition:
            type: "all_of"
            entries:
              - '%block_type% == "DIAMOND_ORE"'
      advancements:
        - "emakicodex:example/first_step"
    rewards:
      attributes:
        max_health: 5.0
