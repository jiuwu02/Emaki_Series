# EmakiCodex 主配置
# 控制动态成就注册、触发与界面坐标。

version: "1.0.6"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放 advancements/ 下的内置示例数据。
release_default_data: true

# OP 是否绕过本插件的权限检查。
op_bypass: false

# ============================================================
# 原版成就
# ============================================================
advancement:
  # 动态成就注册总开关；关闭后跳过加载与注册。
  enabled: true
  # 成就完成时是否默认向全服广播；单个成就可覆盖此默认值。
  announce_default: false
  # 停用时移除本插件注册的动态成就。
  remove_on_disable: true
  # 是否使用 PacketEvents 注入成就节点坐标。
  # 未安装 PacketEvents 时本项与节点坐标会被忽略，由客户端自动排布。
  # x/y 同时为 0 表示该节点未指定坐标；需要稳定布局时请统一配置同一页面的节点坐标。
  packet_coordinates: true
  # 是否启用按游戏事件自动授予成就。
  # 关闭后仍可通过命令或动作手动授予；具体事件规则由 advancements/ 文件定义。
  triggers_enabled: true
