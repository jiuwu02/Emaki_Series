# ============================================================
# EmakiCodex 主配置文件
# ============================================================
# 配方桥接 + 原版成就编排。修改后使用 /codex reload 重载。
#
# 文件放置位置: plugins/EmakiCodex/config.yml
# ============================================================

# version 由资源同步维护
version: "1.0.1"

# 语言文件 ID
language: "zh_CN"

# 是否写入默认示例数据（advancements/、recipes/ 示例文件）
release_default_data: true

# OP 是否绕过权限限制
op_bypass: false

# ------------------------------------------------------------
# 配方桥接
# ------------------------------------------------------------
recipe-bridge:
  enabled: true
  # true=默认所有配方对所有人可见；false=仅显示玩家已解锁的配方
  default-unlock-all: true
  # 玩家加入时自动补发配方
  sync-on-join: true
  # reload 时给所有在线玩家全量重发完整配方表
  resync-on-reload: true
  # 永不桥接的配方 id，支持整个命名空间通配（如 "someplugin:*"）
  global-blacklist: []
  # 始终可见的配方 id（无视 default-unlock-all）
  unlock-whitelist:
    - "minecraft:crafting_table"
  # 客户端下发通道（探测降级，可叠加）
  client-channel:
    # 通道0：原生配方书 discoverRecipe/undiscoverRecipe（纯 Bukkit，始终可用）
    vanilla-book: true
    # 通道1：PacketEvents 补发完整配方表（检测到 PacketEvents 才启用）
    packet-emulation: true
    # 通道2：JEI/REI plugin-message（实验通道，默认关闭）
    # 注意：自 Minecraft 1.21.2 起，原版把配方改为“只存服务端”，客户端不再收到完整配方表，
    # 标准 JEI/REI 客户端因此无法在纯 Spigot 服上显示配方（会提示“请在服务器安装 JEI”）。
    # 本通道发送的是自定义帧，标准 JEI/REI 客户端并不会据此重建配方，对未改造的原版客户端无效。
    # 要让标准 JEI 在 1.21.2+ 显示配方，需服务端另装专门的 JEI 桥接插件（如 JEI Recipe Bridge），
    # 或客户端安装自带兜底配方的 mod（如 JESR）。此开关仅供自建/改造客户端联调其私有协议帧。
    jei-message: false

# ------------------------------------------------------------
# 原版成就
# ------------------------------------------------------------
advancement:
  enabled: true
  # 动态注册平台：unsafe（Bukkit.getUnsafe().loadAdvancement）
  platform: unsafe
  # 成就完成默认是否全服广播（可被单个成就的 announce 覆盖）
  announce-default: false
  # 插件禁用/重载时是否移除已注册的动态成就
  remove-on-disable: true
  # 发包坐标注入（软依赖 PacketEvents）
  # true=装了 PacketEvents 时，把成就页每个节点在 GUI 中的位置改成 yml 里配置的 x/y。
  # 未安装 PacketEvents 时该开关不生效，x/y 被忽略，节点位置由客户端按 parent 树自动排布。
  # 注意：x/y 都为 0 视为“未设置”，该节点回退自动排布。若要用坐标，建议整页所有节点都配 x/y，
  # 避免“部分显式坐标 + 部分自动排布”导致节点重叠。
  packet-coordinates: true

# ------------------------------------------------------------
# 存储
# ------------------------------------------------------------
storage:
  # 玩家解锁记录自动保存间隔（秒），0 表示关闭定时保存
  auto-save-interval-seconds: 300

debug: false
