# ============================================================
# EmakiCodex 主配置文件
# ============================================================
# 原版成就编排。修改后使用 /codex reload 重载。
#
# 文件放置位置: plugins/EmakiCodex/config.yml
# ============================================================

# version 由资源同步维护
version: "1.0.14"

# 语言文件 ID
language: "zh_CN"

# 是否写入默认示例数据（advancements/ 示例文件）
release_default_data: true

# OP 是否绕过权限限制
op_bypass: false

# ------------------------------------------------------------
# 原版成就
# ------------------------------------------------------------
advancement:
  enabled: true
  # 动态注册平台：unsafe（Bukkit.getUnsafe().loadAdvancement）
  platform: unsafe
  # 成就完成默认是否全服广播（可被单个成就的 announce 覆盖）
  announce-default: false
  # 插件禁用/重载时是否移除已注册的动态成就
  remove-on-disable: true
  # 发包坐标注入（软依赖 PacketEvents）
  # true=装了 PacketEvents 时，把成就页每个节点在 GUI 中的位置改成 yml 里配置的 x/y。
  # 未安装 PacketEvents 时该开关不生效，x/y 被忽略，节点位置由客户端按 parent 树自动排布。
  # 注意：x/y 都为 0 视为“未设置”，该节点回退自动排布。若要用坐标，建议整页所有节点都配 x/y，
  # 避免“部分显式坐标 + 部分自动排布”导致节点重叠。
  packet-coordinates: true
  # 事件触发器：玩家完成配置的游戏事件（且满足条件）时自动授予成就。
  # true=启用；false=关闭后成就只能通过 /codex grant 命令或 codex-grant-advancement 动作手动授予。
  # 具体在每个成就节点下用 triggers.entries 配置，见 advancements/ 示例文件。
  triggers-enabled: true

debug: false
