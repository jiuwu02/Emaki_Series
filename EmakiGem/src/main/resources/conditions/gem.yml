# ============================================================
# EmakiGem 条件定义 - 宝石条件
# ============================================================
# EmakiAttribute 通过 source_id 引用此条件源。
# ============================================================

enabled: true

source_id: "gem"

# entries 为空时不附加表达式条件，仅执行宝石条件逻辑。
condition:
  # 条件组合方式: "all_of"（全部满足）/ "any_of"（任一满足）
  type: "all_of"
  # 表达式解析失败时是否视为不满足条件
  invalid_as_failure: true
  # 条件表达式列表
