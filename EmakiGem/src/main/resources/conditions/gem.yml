# ============================================================
# EmakiGem 条件定义 - 宝石条件
# ============================================================
# 此文件定义了 EmakiAttribute 的条件源，用于判断宝石相关的装备条件。
# 当 EmakiAttribute 需要检查物品是否满足宝石相关条件时，
# 会调用此条件源进行判断。
#
# 文件放置位置: plugins/EmakiGem/conditions/
# ============================================================

# 是否启用此条件源
enabled: true

# 条件源标识符（供 EmakiAttribute 引用）
source_id: "gem"

# 条件组合方式: "all_of"（全部满足）/ "any_of"（任一满足）
condition_type: "all_of"

# 表达式解析失败时是否视为不满足条件
invalid_as_failure: true

# 条件表达式列表（空列表表示无额外条件，仅由代码逻辑判断）
conditions: []
