# EmakiGem Web Console 声明式注册
# 仅声明后端发现信息；字段文案、表单 schema 与编辑器描述由前端扩展注册。

module:
  name: "Gem 宝石"
  summary: "开孔、镶嵌、升级与 GUI"
  tone: gem
  icon: '<svg viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 14l10-8 10 8-10 18L9 14zM13 10h12M9 14h20M14 14l5 18 5-18M19 6v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'

files:
  - title: "宝石系统配置"
    path: "config.yml"
    kind: CONFIG
    comment: "宝石系统主配置，包含开孔器、镶嵌、升级和 GUI 入口设置。"
  - title: "宝石 GUI 模板"
    path: "gui/**/*.yml"
    kind: GUI
    editor: "emakigem:gui"
    comment: "宝石镶嵌、开孔、升级 GUI 模板文件。"
  - title: "宝石物品定义"
    path: "items/**/*.yml"
    kind: ITEM
    editor: "emakigem:socket-item"
    comment: "宝石插件物品定义文件。"
  - title: "宝石定义"
    path: "gems/**/*.yml"
    kind: ITEM
    editor: "emakigem:gem"
    comment: "宝石定义文件，包含宝石物品来源、效果、插槽兼容和升级配置。"

extensions:
  - id: "emakigem:item-surface"
    resource: "web-extensions/emakigem-item-surface.js"
