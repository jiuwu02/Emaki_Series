# 货币字段仅接受 currency_id。
id: "ruby_attack"
gem_type: "attack"
tier: 1
item_sources:
  - "minecraft-redstone"

variables:
  physical_attack: 8
  physical_crit_rate: 3

socket_compatibility:
  - "attack"
  - "universal"

name_actions:
  - action: "append_suffix"
    value: " <red>[{display_name}]</red>"

lore_actions:
  - action: "append"
    content:
      - "<red>◆ {display_name}: 物理攻击+{physical_attack} 暴击率+{physical_crit_rate}%</red>"

inlay_cost:
  currencies:
    - provider: "vault"
      currency_id: ""
      base_cost: 1000
      cost_formula: "{base_cost} * {tier}"
      display_name: "<gold>金币</gold>"
  materials:
    - item_sources:
        - "minecraft-gold_nugget"
      amount: 1

extract_cost:
  currencies:
    - provider: "vault"
      currency_id: ""
      base_cost: 500
      cost_formula: "{base_cost} * {tier}"
      display_name: "<gold>金币</gold>"
  materials:
    - item_sources:
        - "minecraft-iron_nugget"
      amount: 1

extract_return:
  mode: "original"

upgrade:
  enabled: true
  max_level: 4
  gui_template: "upgrade/default"
  economy:
    enabled: true
    currencies:
      - provider: "vault"
        currency_id: ""
        base_cost: 2000
        cost_formula: "{base_cost} * {target_level}"
        display_name: "<gold>金币</gold>"
  success_rates:
    2: 100.0
    3: 80.0
    4: 60.0
  failure_penalty: "none"
  levels:
    2:
      variables:
        physical_attack: 12
        physical_crit_rate: 4
      name_actions:
        - action: "append_suffix"
          value: " <red>[{display_name}]</red>"
      lore_actions:
        - action: "append"
          content:
            - "<red>◆ {display_name}: 物理攻击+{physical_attack} 暴击率+{physical_crit_rate}%</red>"
      materials:
        - item_sources:
            - "minecraft-gold_nugget"
          amount: 3
        - item_sources:
            - "minecraft-blaze_powder"
          amount: 1
      success_rate: 100.0
      actions:
        success: []
        failure: []

    3:
      variables:
        physical_attack: 16
        physical_crit_rate: 5
      name_actions:
        - action: "append_suffix"
          value: " <red>[{display_name}]</red>"
      lore_actions:
        - action: "append"
          content:
            - "<red>◆ {display_name}: 物理攻击+{physical_attack} 暴击率+{physical_crit_rate}%</red>"
      materials:
        - item_sources:
            - "minecraft-gold_ingot"
          amount: 2
        - item_sources:
            - "minecraft-blaze_rod"
          amount: 1
      actions:
        success: []
        failure: []

    4:
      variables:
        physical_attack: 22
        physical_crit_rate: 7
      name_actions:
        - action: "append_suffix"
          value: " <red>[{display_name}]</red>"
      lore_actions:
        - action: "append"
          content:
            - "<red>◆ {display_name}: 物理攻击+{physical_attack} 暴击率+{physical_crit_rate}%</red>"
      materials:
        - item_sources:
            - "minecraft-netherite_ingot"
          amount: 1
        - item_sources:
            - "minecraft-blaze_rod"
          amount: 3
      economy:
        enabled: true
        currencies:
          - provider: "vault"
            currency_id: ""
            base_cost: 5000
            cost_formula: "{base_cost}"
            display_name: "<gold>金币</gold>"
      success_rate: 60.0
      actions:
        success:
          - "sendmessage text=\"<gold>{player}</gold> <yellow>成功将红宝石升级至 IV！</yellow>\""
        failure: []

actions:
  inlay_success: []
  extract_success: []
