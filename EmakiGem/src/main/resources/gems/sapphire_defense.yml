# 货币字段仅接受 currency_id。
id: "sapphire_defense"
gem_type: "defense"
tier: 1
item_sources:
  - "minecraft-lapis_lazuli"

variables:
  physical_defense: 6
  max_health: 10

socket_compatibility:
  - "defense"
  - "universal"

name_actions:
  - action: "append_suffix"
    value: " <blue>[{display_name}]</blue>"

lore_actions:
  - action: "append"
    content:
      - "<blue>◆ {display_name}: 物理防御+{physical_defense} 生命+{max_health}</blue>"

inlay_cost:
  currencies:
    - provider: "vault"
      currency_id: ""
      base_cost: 900
      cost_formula: "{base_cost} * {tier}"
      display_name: "<gold>金币</gold>"
  materials:
    - item_sources:
        - "minecraft-lapis_lazuli"
      amount: 2

extract_cost:
  currencies:
    - provider: "vault"
      currency_id: ""
      base_cost: 450
      cost_formula: "{base_cost} * {tier}"
      display_name: "<gold>金币</gold>"

extract_return:
  mode: "original"

upgrade:
  enabled: true
  max_level: 3
  gui_template: "upgrade/default"
  economy:
    enabled: true
    currencies:
      - provider: "vault"
        currency_id: ""
        base_cost: 1800
        cost_formula: "{base_cost} * {target_level}"
        display_name: "<gold>金币</gold>"
  success_rates:
    2: 100.0
    3: 75.0
  failure_penalty: "none"
  levels:
    2:
      variables:
        physical_defense: 9
        max_health: 14
      name_actions:
        - action: "append_suffix"
          value: " <blue>[{display_name}]</blue>"
      lore_actions:
        - action: "append"
          content:
            - "<blue>◆ {display_name}: 物理防御+{physical_defense} 生命+{max_health}</blue>"
      materials:
        - item_sources:
            - "minecraft-lapis_lazuli"
          amount: 6
      success_rate: 100.0
      actions:
        success: []
        failure: []

    3:
      variables:
        physical_defense: 13
        max_health: 20
      name_actions:
        - action: "append_suffix"
          value: " <blue>[{display_name}]</blue>"
      lore_actions:
        - action: "append"
          content:
            - "<blue>◆ {display_name}: 物理防御+{physical_defense} 生命+{max_health}</blue>"
      materials:
        - item_sources:
            - "minecraft-diamond"
          amount: 1
        - item_sources:
            - "minecraft-lapis_lazuli"
          amount: 12
      actions:
        success: []
        failure: []

actions:
  inlay_success: []
  extract_success: []
