# ============================================================
# EmakiGem 宝石定义示例
# ============================================================
# 此文件定义了一颗完整的宝石，展示所有可用字段和推荐写法。
# 宝石可以镶嵌到装备的插槽中，为装备提供额外属性、技能和外观变化。
#
# 文件放置位置: plugins/EmakiGem/gems/
# 文件名仅用于组织和错误诊断；宝石内部标识由必填 id 字段决定，加载时按 id 注册。
# ============================================================

# 宝石唯一标识符（必填）
id: "example_gem"

# 宝石显示名称（支持 MiniMessage 格式）
display_name: "<red>红宝石</red>"

# 宝石类型（用于插槽兼容性匹配）
# 常见类型: attack / defense / utility / universal
gem_type: "attack"

# 宝石等级（基础等级，升级后会递增）
level: 1

# ============================================================
# 宝石物品来源
# ============================================================
# 必填，但它已经不参与"这枚物品算不算这颗宝石"的识别判定。
# 这里只剩一个职责：发放宝石时的构造底材——给宝石时始终按 item_sources 造出实物。
# 格式: "提供者-物品ID"，minecraft 原版物品使用 "minecraft-物品名"
item_sources:
  - "minecraft-redstone"

# ============================================================
# 宝石识别条件（必填）
# ============================================================
# 识别判定完全由 matcher 决定。matcher 缺失时这颗宝石永不被识别，
# 所以下面写了一条与构造底材同源的 matcher 作为等价基线。
# 构造底材那一侧不受影响：发放宝石时始终用上方 item_sources 构造。
#
matcher:
  type: item_source
  sources:
    - "minecraft-redstone"

# 注意两种 ID 形状不同，不要混写：
#   物品源用连字符 —— "minecraft-redstone"
#   组件用冒号     —— component / path 里写 "minecraft:custom_name"，命名空间可省略
#
# 下面是收窄识别条件的写法示例，含义：只有名字含"红宝石"的红石才算这颗宝石，
# 普通红石不算。默认注释掉，避免示例宝石开箱即用时被组件条件挡住。
# 要启用就用它【替换】上方那条 matcher（同一份配置里 matcher 只能有一个），
# 不要连同上方一起保留。
#matcher:
#  type: all_of
#  matchers:
#    - type: item_source
#      sources:
#        - "minecraft-redstone"
#    - type: component
#      component: custom_name
#      operator: contains
#      value: "红宝石"

# 自定义模型数据（可选，用于资源包识别）
custom_model_data: 1001

# ============================================================
# 宝石效果
# ============================================================
# 统一使用 effects 列表，通过 type 字段区分效果类型:
#   - type: "variables"     → 表达式引擎变量（用于 Lore 占位符渲染）
#   - type: "ea_attribute"  → EmakiAttribute PDC 属性（写入装备 PDC）
#   - type: "es_skill"      → EmakiSkills 技能附加
#   - type: "name_action"   → 镶嵌后对装备名称的修改
#   - type: "lore_action"   → 镶嵌后对装备 Lore 的修改
effects:
  - type: "variables"
    variables:
      physical_attack: 8
      physical_crit_rate: 3
  - type: "ea_attribute"
    ea_attributes:
      physical_attack: 8.0
      physical_crit_rate: 3.0
  - type: "name_action"
    name_actions:
      - action: "append_suffix"
        value: " <red>[%display_name%]</red>"
  - type: "lore_action"
    lore_actions:
      # 第 1 个匹配替换成 ■；如果匹配数更少，会替换最后一个匹配。
      - action: "replace_text"
        anchor: "□"
        index: 1
        content:
          - "■"
      # 全量替换，适合把一行里所有空槽字符一次性改成已镶嵌字符。
      - action: "replace_text_all"
        anchor: "□"
        content:
          - "■"
      - action: "append"
        content:
          - "<red>◆ %display_name%: 物理攻击+%physical_attack% 暴击率+%physical_crit_rate%%</red>"

# ============================================================
# 插槽兼容性
# ============================================================
# 此宝石可以镶嵌到哪些类型的插槽中。
# 只有当装备的插槽类型在此列表中时，才允许镶嵌。
socket_compatibility:
  - "attack"
  - "universal"

# ============================================================
# 宝石关系
# ============================================================
# required_gems: 镶嵌本宝石前，装备中必须已经存在的宝石 ID。
# conflicting_gems: 不能与本宝石同时存在于同一件装备中的宝石 ID；冲突按双向规则校验。
# ID 会自动转为小写、去重并固化为不可变列表。
# 同一个 ID 不得同时出现在 required_gems 与 conflicting_gems 中，否则整份宝石配置会被拒绝加载。
required_gems: []
conflicting_gems: []

# ============================================================
# 镶嵌费用
# ============================================================
# 镶嵌宝石时需要支付的货币和材料。
# cost_formula 支持表达式，可引用 %base_cost%、%level% 等变量。
inlay_cost:
  currencies:
    - provider: "vault"
      currency_id: ""
      base_cost: 1000
      cost_formula: "%base_cost% * %level%"
      display_name: "<gold>金币</gold>"
  materials:
    - item_sources:
        - "minecraft-gold_nugget"
      amount: 1

# ============================================================
# 拆卸费用
# ============================================================
# 从装备中拆卸宝石时需要支付的费用。
extract_cost:
  currencies:
    - provider: "vault"
      currency_id: ""
      base_cost: 500
      cost_formula: "%base_cost% * %level%"
      display_name: "<gold>金币</gold>"
  materials:
    - item_sources:
        - "minecraft-iron_nugget"
      amount: 1

# ============================================================
# 拆卸返还模式
# ============================================================
# mode: 拆卸后宝石的处理方式
#   - "original": 原样返还宝石
#   - "destroy": 销毁宝石（不返还）
#   - "downgrade": 降级返还（等级 -1）
# downgrade_levels: 降级时降低的等级数
# degraded_chance: 降级概率（0.0 = 必定降级，1.0 = 必定不降级）
extract_return:
  mode: "original"
  downgrade_levels: 1
  degraded_chance: 0.0

# ============================================================
# 宝石分等级配置
# ============================================================
# 同一个宝石可以拥有多个等级，每个等级有各自的显示名与效果。
# 高等级宝石可由管理员直接发放(/emakigem give 或 give 类动作指定 level)，
# 也可由玩家在宝石 GUI 的「升级模式」中消耗材料与货币逐阶提升。
# 升级的材料、费用、成功率、保底与动作全部由 EmakiStrengthen 的同名配方定义
# (plugins/EmakiStrengthen/enhancement_recipes/<本宝石 id>.yml)，本文件只描述各阶段的效果。
stages:
  # 启用后，EmakiStrengthen 的 gem 配方可以驱动阶段升级。
  enabled: true
  # 该宝石允许的最高等级，同时作为物品层预览的等级上界。
  max_level: 4

  # 各等级详细配置。未在此声明的等级沿用上方基础 effects。
  levels:
    2:
      display_name: "<red>红宝石 II</red>"
      # 升级后的效果（覆盖基础 effects）
      effects:
        - type: "variables"
          variables:
            physical_attack: 12
            physical_crit_rate: 4
        - type: "ea_attribute"
          ea_attributes:
            physical_attack: 12.0
            physical_crit_rate: 4.0
        - type: "name_action"
          name_actions:
            - action: "append_suffix"
              value: " <red>[%display_name%]</red>"
        - type: "lore_action"
          lore_actions:
            - action: "append"
              content:
                - "<red>◆ %display_name%: 物理攻击+%physical_attack% 暴击率+%physical_crit_rate%%</red>"

    3:
      display_name: "<red>红宝石 III</red>"
      effects:
        - type: "variables"
          variables:
            physical_attack: 16
            physical_crit_rate: 5
        - type: "ea_attribute"
          ea_attributes:
            physical_attack: 16.0
            physical_crit_rate: 5.0
        - type: "name_action"
          name_actions:
            - action: "append_suffix"
              value: " <red>[%display_name%]</red>"
        - type: "lore_action"
          lore_actions:
            - action: "append"
              content:
                - "<red>◆ %display_name%: 物理攻击+%physical_attack% 暴击率+%physical_crit_rate%%</red>"

    # 满级：解锁技能效果
    4:
      display_name: "<red>红宝石 IV</red>"
      effects:
        - type: "variables"
          variables:
            physical_attack: 22
            physical_crit_rate: 7
        - type: "ea_attribute"
          ea_attributes:
            physical_attack: 22.0
            physical_crit_rate: 7.0
        # 满级时附加技能
        - type: "es_skill"
          es_skills:
            - "ruby_burst"
        - type: "name_action"
          name_actions:
            - action: "append_suffix"
              value: " <red>[%display_name%]</red>"
        - type: "lore_action"
          lore_actions:
            - action: "append"
              content:
                - "<red>◆ %display_name%: 物理攻击+%physical_attack% 暴击率+%physical_crit_rate%%</red>"
                - "<gold>  ★ 解锁技能: 红宝石爆发</gold>"

# ============================================================
# 宝石动作
# ============================================================
# 镶嵌/拆卸成功时执行的动作列表。
actions:
  inlay_success:
    - 'send_message text="<green>红宝石镶嵌成功！</green>"'
    - "play_sound sound=minecraft:block.enchantment_table.use volume=1 pitch=1.2"
  extract_success:
    - 'send_message text="<yellow>红宝石已拆卸。</yellow>"'
