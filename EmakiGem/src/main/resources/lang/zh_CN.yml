# Debug 模式消息
debug:
  common:
    placeholder:
      papi_resolved: "PlaceholderAPI 解析完成 | 来源=%source% | 原文=%before% | 结果=%after%"
      papi_failed: "PlaceholderAPI 解析失败 | 来源=%source% | 错误=%error% | 文本=%text%"
      variables: "应用变量 | 来源=%source% | 变量=%values%"
      internal_resolved: "内部占位符解析完成 | 来源=%source% | 命中=%hits% | 缺失=%missing% | 文本=%text%"
      resolver_changed: "占位符解析器修改文本 | 解析器=%resolver% | 修改前=%before% | 修改后=%after%"
    script:
      expression: "脚本表达式执行 | 表达式=%expression% | 参数=%args% | 结果=%result% | 耗时=%duration_ms%ms | 错误=%error%"
