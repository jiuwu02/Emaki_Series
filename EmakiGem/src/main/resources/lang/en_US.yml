  gems_loaded: "<gray>Loaded <yellow>%count%</yellow> gem(s)</gray>"
  papi_registered: "<gray>PlaceholderAPI expansion registered</gray>"

loader:
  type:
    gem: "Gem"
    gem_item: "Gem Item"
    resonance: "Resonance"
