# ============================================================
# EmakiGem 插槽物品配置示例
# ============================================================
# 此文件定义了哪些物品可以拥有宝石插槽，以及插槽的类型和数量。
# 当玩家持有匹配的物品时，EmakiGem 会为其显示宝石插槽界面。
#
# 文件放置位置: plugins/EmakiGem/items/
# 文件名即为配置的内部标识，加载时自动注册。
# ============================================================

# 配置唯一标识符（必填）
id: "example_socket_item"

# ============================================================
# 物品匹配规则
# ============================================================
# 定义哪些物品会被此配置匹配，从而拥有宝石插槽。
# item_sources: 按物品来源匹配（格式: "提供者-物品ID"）
# slot_groups: 按装备槽位组匹配（weapon/armor/offhand）
# lore_contains: 按 Lore 包含文本匹配（空列表表示不限制）
match:
  item_sources:
    - "minecraft-diamond_sword"
  slot_groups:
    - "weapon"
  lore_contains: []

# ============================================================
# 插槽定义
# ============================================================
# 定义此物品拥有的宝石插槽列表。
# index: 插槽索引（从 0 开始，唯一）
# type: 插槽类型（决定哪些宝石可以镶嵌）
# display_name: 插槽在 GUI 中的显示名称
slots:
  - index: 0
    type: "attack"
    display_name: "<red>攻击插槽</red>"
  - index: 1
    type: "universal"
    display_name: "<white>通用插槽</white>"
  - index: 2
    type: "defense"
    display_name: "<blue>防御插槽</blue>"

# ============================================================
# 默认开放插槽
# ============================================================
# 物品初始时哪些插槽是已开放的（可直接镶嵌）。
# 未列出的插槽需要玩家通过开槽操作来解锁。
default_open_slots:
  - 0

# ============================================================
# 宝石类型限制
# ============================================================
# allowed_gem_types: 此物品允许镶嵌的宝石类型白名单
# max_same_type: 同类型宝石最大数量（0 = 不限制）
# max_same_id: 同 ID 宝石最大数量（防止重复镶嵌同一颗宝石）
allowed_gem_types:
  - "attack"
  - "defense"
  - "utility"
  - "universal"

max_same_type: 0
max_same_id: 1

# ============================================================
# GUI 模板配置
# ============================================================
# gem_template: 宝石镶嵌/查看界面模板
# open_template: 开槽界面模板
gui:
  gem_template: "gem/default"
  open_template: "open/default"

# ============================================================
# 插槽激活后的外观修改
# ============================================================
# 当物品拥有已开放的插槽时，对物品名称和 Lore 的修改。
name_actions:
  - action: "prepend_prefix"
    value: "<gold>✦</gold> "

lore_actions:
  - action: "append"
    content:
      - "<dark_gray>─────────────</dark_gray>"
