# ============================================================
# EmakiGem GUI 配置 - 开槽界面
# ============================================================
# 玩家解锁装备宝石插槽的界面
#
# 文件放置位置: plugins/EmakiGem/gui/
# ============================================================
id: "open/default"
gui_type: CHEST
title: "<dark_gray>开孔台</dark_gray>"
rows: 4
slots:
  top_frame:
    slots:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  bottom_frame:
    slots:
      - 27
      - 28
      - 29
      - 31
      - 32
      - 33
      - 34
      - 35
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  side_frame:
    slots:
      - 9
      - 17
      - 18
      - 26
    item:
      source: "black_stained_glass_pane"
      components:
        custom_name: "<dark_gray>"
        tooltip_display:
          hide_tooltip: true

  target_item:
    slots:
      - 10
    type: "target_item"
    item:
      source: "light_blue_stained_glass_pane"
      components:
        custom_name: "<aqua>放入装备</aqua>"
        lore:
          - "<gray>将需要开孔的装备放入此处</gray>"

  opener_item:
    slots:
      - 16
    type: "opener_item"
    item:
      source: "amethyst_shard"
      components:
        custom_name: "<light_purple>放入开孔器</light_purple>"
        lore:
          - "<gray>放入对应的开孔道具</gray>"

  socket_info:
    slots:
      - 19
    type: "socket_info"
    item:
      source: "book"
      components:
        custom_name: "<gold>开孔信息</gold>"
        lore:
          - "<gray>查看当前装备的插槽状态</gray>"

  socket_slots:
    slots:
      - 12
      - 13
      - 14
      - 21
      - 22
      - 23
    type: "socket_slot"
    item:
      source: "white_stained_glass_pane"
      components:
        custom_name: "<white>锁定插槽</white>"
        lore:
          - "<gray>装备放入后显示插槽详情</gray>"

  preview_display:
    slots:
      - 25
    type: "preview_display"
    item:
      source: "writable_book"
      components:
        custom_name: "<gold>开孔预览</gold>"
        lore:
          - "<gray>开孔操作预览将在此显示</gray>"

  confirm:
    slots:
      - 30
    type: "confirm"
    item:
      source: "lime_stained_glass_pane"
      components:
        custom_name: "<green>确认开孔</green>"
        lore:
          - "<gray>点击执行开孔操作</gray>"
