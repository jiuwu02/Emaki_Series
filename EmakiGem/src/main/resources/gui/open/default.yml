# ============================================================
# EmakiGem GUI 配置 - 开槽界面
# ============================================================
# 玩家解锁装备宝石插槽的界面
#
# 文件放置位置: plugins/EmakiGem/gui/
# ============================================================
id: "open/default"
gui_type: CHEST
title: "<dark_gray>开孔台</dark_gray>"
rows: 4
slots:
  top_frame:
    slots:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  bottom_frame:
    slots:
      - 27
      - 28
      - 29
      - 31
      - 32
      - 33
      - 34
      - 35
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  side_frame:
    slots:
      - 9
      - 17
      - 18
      - 26
    item:
      source: "black_stained_glass_pane"
      components:
        custom_name: "<dark_gray>"
        tooltip_display:
          hide_tooltip: true

  target_item:
    slots:
      - 10
    type: "target_item"
    item:
      source: "light_blue_stained_glass_pane"
      components:
        custom_name: "%target_title%"
        lore:
          - "%target_lines%"

  opener_item:
    slots:
      - 16
    type: "opener_item"
    item:
      source: "amethyst_shard"
      components:
        custom_name: "%opener_title%"
        lore:
          - "%opener_lines%"

  socket_info:
    slots:
      - 19
    type: "socket_info"
    item:
      source: "book"
      components:
        custom_name: "%info_title%"
        lore:
          - "%info_lines%"

  socket_slots:
    slots:
      - 12
      - 13
      - 14
      - 21
      - 22
      - 23
    type: "socket_slot"
    item:
      source: "white_stained_glass_pane"
      components:
        custom_name: "%slot_title%"
        lore:
          - "%slot_lines%"

  preview_display:
    slots:
      - 25
    type: "preview_display"
    item:
      source: "writable_book"
      components:
        custom_name: "%preview_title%"
        lore:
          - "%preview_lines%"

  confirm:
    slots:
      - 30
    type: "confirm"
    item:
      source: "lime_stained_glass_pane"
      components:
        custom_name: "%confirm_title%"
        lore:
          - "%confirm_lines%"
