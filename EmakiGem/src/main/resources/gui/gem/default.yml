# ============================================================
# EmakiGem GUI 配置 - 宝石镶嵌界面
# ============================================================
# 玩家进行宝石镶嵌和查看的界面
#
# 文件放置位置: plugins/EmakiGem/gui/
# ============================================================
id: "gem/default"
gui_type: CHEST
title: "<dark_gray>宝石工坊 - 装备宝石界面</dark_gray>"
rows: 5
slots:
  top_frame:
    slots:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  # 39/40/42 分别由 mode_inlay / mode_extract / mode_upgrade 占用，
  # 43/44 由 mode_reroll_full / mode_reroll_value 占用，均不能重复声明：
  # GuiTemplate 用无序 Map 解析槽位，重复声明会让同一格由哪个定义生效变得不确定。
  bottom_frame:
    slots:
      - 36
      - 37
      - 38
      - 41
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  side_frame:
    slots:
      - 9
      - 17
      - 18
      - 26
      - 27
      - 35
    item:
      source: "black_stained_glass_pane"
      components:
        custom_name: "<dark_gray>"
        tooltip_display:
          hide_tooltip: true

  filler_frame:
    slots:
      - 11
      - 20
      - 24
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
    item:
      source: "black_stained_glass_pane"
      components:
        custom_name: "<dark_gray>"
        tooltip_display:
          hide_tooltip: true

  target_item:
    slots:
      - 10
    type: "target_item"
    item:
      source: "light_blue_stained_glass_pane"
      components:
        custom_name: "<aqua>放入装备</aqua>"
        lore:
          - "<gray>将可镶嵌宝石的装备放入此槽</gray>"
          - "<gray>支持从光标放入，也可点击取回</gray>"

  socket_info:
    slots:
      - 19
    type: "socket_info"
    item:
      source: "book"
      components:
        custom_name: "<gold>操作说明</gold>"
        lore:
          - "<gray>拖着宝石点击已开孔空槽，可进入镶嵌预览</gray>"
          - "<gray>点击已镶嵌宝石槽，可进入取出确认</gray>"
          - "<gray>未开孔槽位请使用独立开孔 GUI 处理</gray>"

  socket_summary:
    slots:
      - 25
    type: "socket_summary"
    item:
      source: "compass"
      components:
        custom_name: "<gold>宝石槽统计</gold>"
        lore:
          - "<gray>这里会展示当前装备的宝石槽统计</gray>"
          - "<gray>放入装备后可查看总槽位与已镶嵌数量</gray>"

  socket_slots:
    slots:
      - 12
      - 13
      - 14
      - 15
      - 21
      - 22
      - 23
    type: "socket_slot"
    item:
      source: "white_stained_glass_pane"
      components:
        custom_name: "<white>宝石插槽</white>"
        lore:
          - "<gray>放入装备后将按实际宝石孔数量展示</gray>"

  preview_display:
    slots:
      - 16
    type: "preview_display"
    item:
      source: "writable_book"
      components:
        custom_name: "<gold>操作预览</gold>"
        lore:
          - "<gray>这里会显示待确认操作预览</gray>"
          - "<gray>按当前模式点击目标插槽后可查看详情</gray>"

  confirm:
    slots:
      - 34
    type: "confirm"
    item:
      source: "lime_stained_glass_pane"
      components:
        custom_name: "<green>确认操作</green>"
        lore:
          - "<dark_gray>请先选择一个待执行操作</dark_gray>"

  mode_inlay:
    slots:
      - 39
    type: "mode_inlay"
    item:
      source: "green_stained_glass_pane"
      components:
        custom_name: "<green>镶嵌模式</green>"
        lore:
          - "<gray>拖着宝石点击已开孔的空槽进入镶嵌预览</gray>"

  mode_upgrade:
    slots:
      - 42
    type: "mode_upgrade"
    item:
      source: "purple_stained_glass_pane"
      components:
        custom_name: "<light_purple>升级模式</light_purple>"
        lore:
          - "<gray>放入宝石与强化材料，使用 Strengthen 执行升级</gray>"

  mode_extract:
    slots:
      - 40
    type: "mode_extract"
    item:
      source: "yellow_stained_glass_pane"
      components:
        custom_name: "<yellow>取出模式</yellow>"
        lore:
          - "<gray>点击已镶嵌的宝石槽进入取出确认</gray>"

  mode_reroll_full:
    slots:
      - 43
    type: "mode_reroll_full"
    item:
      source: "magenta_stained_glass_pane"
      components:
        custom_name: "<light_purple>洗炼模式</light_purple>"
        lore:
          - "<gray>把宝石拿在主手，重掷全部词条</gray>"
          - "<gray>先生成候选，确认后才写入</gray>"

  mode_reroll_value:
    slots:
      - 44
    type: "mode_reroll_value"
    item:
      source: "cyan_stained_glass_pane"
      components:
        custom_name: "<aqua>调数模式</aqua>"
        lore:
          - "<gray>把宝石拿在主手，只重算词条数值</gray>"
          - "<gray>先生成候选，确认后才写入</gray>"
