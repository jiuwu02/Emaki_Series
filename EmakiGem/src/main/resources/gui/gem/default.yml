# ============================================================
# EmakiGem GUI 配置 - 宝石镶嵌界面
# ============================================================
# 玩家进行宝石镶嵌和查看的界面
#
# 文件放置位置: plugins/EmakiGem/gui/
# ============================================================
id: "gem/default"
gui_type: CHEST
title: "<dark_gray>宝石工坊 - 装备宝石界面</dark_gray>"
rows: 5
slots:
  top_frame:
    slots:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  # 39/40/42 分别由 mode_inlay / mode_extract / mode_upgrade 占用，
  # 43/44 由 mode_reroll_full / mode_reroll_value 占用，均不能重复声明：
  # GuiTemplate 用无序 Map 解析槽位，重复声明会让同一格由哪个定义生效变得不确定。
  bottom_frame:
    slots:
      - 36
      - 37
      - 38
      - 41
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  side_frame:
    slots:
      - 9
      - 17
      - 18
      - 26
      - 27
      - 35
    item:
      source: "black_stained_glass_pane"
      components:
        custom_name: "<dark_gray>"
        tooltip_display:
          hide_tooltip: true

  filler_frame:
    slots:
      - 11
      - 20
      - 24
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
    item:
      source: "black_stained_glass_pane"
      components:
        custom_name: "<dark_gray>"
        tooltip_display:
          hide_tooltip: true

  target_item:
    slots:
      - 10
    type: "target_item"
    item:
      source: "light_blue_stained_glass_pane"
      components:
        custom_name: "%target_title%"
        lore:
          - "%target_lines%"

  socket_info:
    slots:
      - 19
    type: "socket_info"
    item:
      source: "book"
      components:
        custom_name: "%info_title%"
        lore:
          - "%info_lines%"

  socket_summary:
    slots:
      - 25
    type: "socket_summary"
    item:
      source: "compass"
      components:
        custom_name: "%summary_title%"
        lore:
          - "%summary_lines%"

  socket_slots:
    slots:
      - 12
      - 13
      - 14
      - 15
      - 21
      - 22
      - 23
    type: "socket_slot"
    item:
      source: "white_stained_glass_pane"
      components:
        custom_name: "%slot_title%"
        lore:
          - "%slot_lines%"

  preview_display:
    slots:
      - 16
    type: "preview_display"
    item:
      source: "writable_book"
      components:
        custom_name: "%preview_title%"
        lore:
          - "%preview_lines%"

  confirm:
    slots:
      - 34
    type: "confirm"
    item:
      source: "lime_stained_glass_pane"
      components:
        custom_name: "%confirm_title%"
        lore:
          - "%confirm_lines%"

  mode_inlay:
    slots:
      - 39
    type: "mode_inlay"
    item:
      source: "green_stained_glass_pane"
      components:
        custom_name: "%mode_title%"
        lore:
          - "%mode_lines%"

  mode_upgrade:
    slots:
      - 42
    type: "mode_upgrade"
    item:
      source: "purple_stained_glass_pane"
      components:
        custom_name: "%mode_title%"
        lore:
          - "%mode_lines%"

  mode_extract:
    slots:
      - 40
    type: "mode_extract"
    item:
      source: "yellow_stained_glass_pane"
      components:
        custom_name: "%mode_title%"
        lore:
          - "%mode_lines%"

  mode_reroll_full:
    slots:
      - 43
    type: "mode_reroll_full"
    item:
      source: "magenta_stained_glass_pane"
      components:
        custom_name: "%mode_title%"
        lore:
          - "%mode_lines%"

  mode_reroll_value:
    slots:
      - 44
    type: "mode_reroll_value"
    item:
      source: "cyan_stained_glass_pane"
      components:
        custom_name: "%mode_title%"
        lore:
          - "%mode_lines%"
