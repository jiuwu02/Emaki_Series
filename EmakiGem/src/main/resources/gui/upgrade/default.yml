# ============================================================
# EmakiGem GUI 配置 - 宝石升级界面
# ============================================================
# 玩家进行宝石升级操作的界面
#
# 文件放置位置: plugins/EmakiGem/gui/
# ============================================================
id: "upgrade/default"
gui_type: CHEST
title: "<dark_gray>宝石升级台</dark_gray>"
rows: 4
slots:
  top_frame:
    slots:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    item: "gray_stained_glass_pane"
    display_name: "<gray>"
    hidden_components:
      - "tooltip"

  bottom_frame:
    slots:
      - 27
      - 28
      - 29
      - 31
      - 32
      - 33
      - 34
      - 35
    item: "gray_stained_glass_pane"
    display_name: "<gray>"
    hidden_components:
      - "tooltip"

  target_gem:
    slots:
      - 10
    type: "target_gem"
    item: "red_stained_glass_pane"
    display_name: "<red>放入宝石</red>"
    lore:
      - "<gray>将需要升级的宝石放入此处</gray>"

  level_info:
    slots:
      - 19
    type: "level_info"
    item: "book"
    display_name: "<gold>等级信息</gold>"
    lore:
      - "<gray>查看当前宝石等级与升级详情</gray>"

  material_slots:
    slots:
      - 12
      - 13
      - 14
      - 21
      - 22
      - 23
    type: "material_slot"
    item: "blaze_powder"
    display_name: "<aqua>升级材料</aqua>"
    lore:
      - "<gray>放入升级所需材料</gray>"

  preview:
    slots:
      - 16
    type: "preview"
    item: "writable_book"
    display_name: "<gold>升级预览</gold>"
    lore:
      - "<gray>升级结果预览将在此显示</gray>"

  success_rate:
    slots:
      - 25
    type: "success_rate"
    item: "experience_bottle"
    display_name: "<gold>成功率</gold>"
    lore:
      - "<gray>显示当前升级成功概率</gray>"

  confirm:
    slots:
      - 30
    type: "confirm"
    item: "lime_stained_glass_pane"
    display_name: "<green>确认升级</green>"
    lore:
      - "<gray>点击执行升级操作</gray>"
