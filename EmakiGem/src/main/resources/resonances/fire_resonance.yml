# EmakiGem 宝石共鸣定义完整示例
# 展示所有可用字段的用法
# 火焰共鸣 - 当装备上同时镶嵌 2 颗攻击型宝石时触发
id: "fire_resonance"
display_name: "<red>火焰共鸣</red>"

# 共鸣链配置 - 定义触发条件
chain:
  # mode: unordered (无序匹配，只要有足够数量即可) / ordered (有序匹配，按插槽顺序)
  mode: "unordered"
  # 匹配模式 - 需要哪些宝石类型/ID 组合
  pattern:
    - type: "attack"
    - type: "attack"

# 共鸣效果
effects:
  # EmakiAttribute PDC 属性 - 共鸣激活时额外叠加到装备的 PDC 属性上
  ea_attributes:
    physical_attack: 5
    fire_damage: 3

  # EmakiSkills PDC 技能 - 共鸣激活时额外附加的技能 ID
  es_skills:
    - "fire_resonance_passive"

  # 共鸣触发时执行的 action 列表
  actions:
    - 'sendmessage text="<gold>火焰共鸣已激活！</gold>"'
    - "playsound sound=minecraft:item.firecharge.use volume=0.5 pitch=1.2"

  # 共鸣触发时对装备名称的修改（CoreLib name_actions 标准格式）
  name_actions:
    - action: "prepend_prefix"
      value: "<red>[焰] </red>"

  # 共鸣触发时对装备 Lore 的修改（CoreLib lore_actions 标准格式）
  lore_actions:
    - action: "append"
      content:
        - ""
        - "<red>◆ 火焰共鸣</red>"
        - "<gray>  物理攻击 +5</gray>"
        - "<gray>  火焰伤害 +3</gray>"
        - "<gray>  技能: 火焰共鸣被动</gray>"
