# ============================================================
# EmakiGem 宝石共鸣定义示例
# ============================================================
# 此文件定义了一个宝石共鸣效果，展示所有可用字段和推荐写法。
# 当装备上镶嵌的宝石满足特定组合条件时，会触发共鸣效果，
# 为装备提供额外的属性加成、技能和外观变化。
#
# 文件放置位置: plugins/EmakiGem/resonances/
# 文件名即为共鸣的内部标识，加载时自动注册。
# ============================================================

# 共鸣唯一标识符（必填）
id: "example_resonance"

# 共鸣显示名称（支持 MiniMessage 格式）
display_name: "<red>火焰共鸣</red>"

# ============================================================
# 共鸣优先级与互斥组（可选）
# ============================================================
# priority: 优先级数值，越高越优先匹配（默认 0）
#   当多个共鸣都能匹配时，高优先级的先占用宝石。
# exclusive_group: 互斥组名称（默认空 = 不互斥）
#   同一互斥组内只有优先级最高的共鸣会激活。
#   用于设计互斥的元素共鸣体系（如火焰共鸣和冰霜共鸣互斥）。
priority: 10
exclusive_group: "elemental"

# ============================================================
# 共鸣链配置
# ============================================================
# 定义触发此共鸣所需的宝石组合条件。
# mode: 匹配模式
#   - "unordered": 无序匹配（只要有足够数量即可，不关心插槽顺序）
#   - "ordered": 有序匹配（按插槽索引顺序匹配）
# pattern: 需要匹配的宝石条件列表
#   - type: 按宝石类型匹配（如 "attack"、"defense"）
#   - id: 按宝石 ID 精确匹配（如 "ruby_attack"）
#   - min_level: 宝石最低等级要求（默认 0 = 不限制）
#     低于此等级的宝石不参与共鸣匹配。
chain:
  mode: "unordered"
  pattern:
    - type: "attack"
      min_level: 3
    - type: "attack"
      min_level: 3

# ============================================================
# 共鸣效果
# ============================================================
# 统一使用 effects 列表，通过 type 字段区分效果类型。
# 共鸣激活时，这些效果会叠加到装备上。
effects:
  # 额外属性加成
  - type: "ea_attribute"
    ea_attributes:
      physical_attack: 5
      fire_damage: 3
  # 附加技能
  - type: "es_skill"
    es_skills:
      - "fire_resonance_passive"
  # 修改装备名称
  - type: "name_action"
    name_actions:
      - action: "prepend_prefix"
        value: "<red>[焰] </red>"
  # 修改装备 Lore
  - type: "lore_action"
    lore_actions:
      - action: "append"
        content:
          - ""
          - "<red>◆ 火焰共鸣</red>"
          - "<gray>  物理攻击 +5</gray>"
          - "<gray>  火焰伤害 +3</gray>"
          - "<gray>  技能: 火焰共鸣被动</gray>"

# ============================================================
# 共鸣触发动作
# ============================================================
# 共鸣激活时执行的动作列表（音效、消息等）。
actions:
  - 'sendmessage text="<gold>火焰共鸣已激活！</gold>"'
  - "playsound sound=minecraft:item.firecharge.use volume=0.5 pitch=1.2"
