id: "weapon_spell"

display_name: "<aqua>法术武器强化</aqua>"

gui_template: "strengthen_gui"

economy:
  enabled: true
  currencies:
    - provider: "vault"
      currency_id: ""
      base_cost: 320
      cost_formula: "{base_cost} * {star}"
      display_name: "<gold>金币</gold>"

limits:
  max_star: 12
  max_temper: 4
  temper_chance_bonus_per_level: 5.0
  success_chance_cap: 90.0

success_rates:
  1: 100.0
  2: 100.0
  3: 95.0
  4: 85.0
  5: 75.0
  6: 60.0
  7: 45.0
  8: 32.0
  9: 22.0
  10: 20.0
  11: 12.0
  12: 6.0

match:
  lore_contains:
    - "法术伤害"
  stats_any:
    - "spell_attack"

name_actions:
  - action: "append_suffix"
    value: " <aqua>[+{star}]</aqua>"

lore_actions:
  - action: "append"
    content:
      - ""
      - "<gradient:#7DD3FC:#3B82F6>强化等级 +{star}</gradient>"
      - "<gray>锻印: {temper_color}{temper}/{max_temper}</gray>"

stars:
  1:
    variables:
      spell_attack: 4
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 1
      - item_sources:
          - "gunpowder"
        amount: 2
  2:
    variables:
      spell_attack: 4
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 1
      - item_sources:
          - "gunpowder"
        amount: 3
  3:
    variables:
      spell_attack: 5
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 2
      - item_sources:
          - "gunpowder"
        amount: 4
  4:
    variables:
      spell_attack: 6
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 2
      - item_sources:
          - "gunpowder"
        amount: 5
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true
  5:
    name: "<aqua>暴击率提升</aqua>"
    variables:
      spell_attack: 6
      spell_crit_rate: 2
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 3
      - item_sources:
          - "gunpowder"
        amount: 6
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true
    lore_actions:
      - action: "append"
        content:
          - "<gray>强化达到 +5 后，法术武器会额外提供暴击率。</gray>"
    actions:
      success:
        - "sendmessage text=\"<aqua>强化达到 +5，解锁额外法术暴击率。</aqua>\""
        - "playsound sound=minecraft:block.enchantment_table.use volume=1
          pitch=1.1"
      failure:
        - "sendmessage text=\"<red>强化失败，锻印加深。</red>\""
  6:
    variables:
      spell_attack: 7
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 4
      - item_sources:
          - "gunpowder"
        amount: 8
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true
  7:
    variables:
      spell_attack: 8
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 5
      - item_sources:
          - "gunpowder"
        amount: 10
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true
  8:
