id: "weapon_projectile"

display_name: "<green>投射物武器强化</green>"

gui_template: "strengthen_gui"

economy:
  enabled: true
  currencies:
    - provider: "vault"
      currency_id: ""
      base_cost: 320
      cost_formula: "{base_cost} * {star}"
      display_name: "<gold>金币</gold>"

limits:
  max_star: 12
  max_temper: 4
  temper_chance_bonus_per_level: 5.0
  success_chance_cap: 90.0

success_rates:
  1: 100.0
  2: 100.0
  3: 95.0
  4: 85.0
  5: 75.0
  6: 60.0
  7: 45.0
  8: 32.0
  9: 22.0
  10: 14.0
  11: 8.0
  12: 4.0

match:
  lore_contains:
    - "投射物伤害"
  stats_any:
    - "projectile_attack"

name_actions:
  - action: "append_suffix"
    value: " <green>[+{star}]</green>"

lore_actions:
  - action: "append"
    content:
      - ""
      - "<gradient:#7DCE82:#3DAF5C>强化等级 +{star}</gradient>"
      - "<gray>锻印: {temper_color}{temper}/{max_temper}</gray>"

