id: "generic_visual"

display_name: "<gray>通用强化</gray>"

gui_template: "strengthen_gui"

economy:
  enabled: true
  currencies:
    - provider: "vault"
      currency_id: ""
      base_cost: 160
      cost_formula: "{base_cost} * {star}"
      display_name: "<gold>金币</gold>"

limits:
  max_star: 12
  max_temper: 4
  temper_chance_bonus_per_level: 5.0
  success_chance_cap: 90.0

success_rates:
  1: 100.0
  2: 100.0
  3: 95.0
  4: 85.0
  5: 75.0
  6: 60.0
  7: 45.0
  8: 32.0
  9: 22.0
  10: 14.0
  11: 8.0
  12: 4.0

name_actions:
  - action: "append_suffix"
    value: " <gray>[+{star}]</gray>"

lore_actions:
  - action: "append"
    content:
      - ""
      - "<gradient:#D4D4D4:#A3A3A3>强化等级 +{star}</gradient>"
      - "<gray>锻印: {temper_color}{temper}/{max_temper}</gray>"

stars:
  1:
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 1
      - item_sources:
          - "gunpowder"
        amount: 2
  2:
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 1
      - item_sources:
          - "gunpowder"
        amount: 3
