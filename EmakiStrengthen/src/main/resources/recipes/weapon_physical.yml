# EmakiStrengthen 强化配方完整示例
# 展示所有可用字段的用法，包括 variables、ea_attributes 和 es_skill effects
id: "weapon_physical"

display_name: "<gold>物理武器强化</gold>"

gui_template: "strengthen_gui"

# 经济系统配置
economy:
  enabled: true
  currencies:
    - provider: "vault"
      currency_id: ""
      base_cost: 320
      cost_formula: "{base_cost} * {star}"
      display_name: "<gold>金币</gold>"

# 强化限制
limits:
  max_star: 12
  max_temper: 4
  temper_chance_bonus_per_level: 5.0
  success_chance_cap: 90.0

# 各星级成功率
success_rates:
  1: 100.0
  2: 100.0
  3: 95.0
  4: 85.0
  5: 75.0
  6: 60.0
  7: 45.0
  8: 32.0
  9: 22.0
  10: 14.0
  11: 8.0
  12: 4.0

# 匹配规则 - 哪些物品可以使用此配方
match:
  slot_groups:
    - "weapon"

# 强化条件
condition_type: "all_of"
conditions: []

# stat_lines 定义变量如何渲染为 lore 行
# template 中可用变量: {id} {sign} {value} 以及所有当前累积变量值
stat_lines:
  physical_attack:
    template: "<gray>物理伤害: <gold>{sign}{value}</gold></gray>"
    section_id: "strengthen.stats.primary"
    section_order: 210
  physical_crit_rate:
    template: "<gray>物理暴击率: <gold>{sign}{value}%</gold></gray>"
    section_id: "strengthen.stats.secondary"
    section_order: 240
  physical_damage_bonus:
    template: "<gray>物理增伤: <gold>{sign}{value}%</gold></gray>"
    section_id: "strengthen.stats.secondary"
    section_order: 240
  physical_crit_damage:
    template: "<gray>物理暴伤: <gold>{sign}{value}%</gold></gray>"
    section_id: "strengthen.stats.secondary"
    section_order: 240
  physical_armor_penetration:
    template: "<gray>物理穿透: <gold>{sign}{value}</gold></gray>"
    section_id: "strengthen.stats.secondary"
    section_order: 240

# 星级阶段定义
# variables: 表达式引擎变量，支持表达式字符串（如 "4 + star * 2"），用于 stat_lines 渲染和 PDC 属性
# ea_attributes: 显式 EmakiAttribute PDC 属性覆盖（可选，如果不配置则使用 variables 解析后的值）
# effects: 技能效果列表（type: "es_skill"）
stars:
  1:
    variables:
      physical_attack: 4
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 1
      - item_sources:
          - "gunpowder"
        amount: 2

  2:
    variables:
      physical_attack: 4
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 1
      - item_sources:
          - "gunpowder"
        amount: 3

  3:
    variables:
      physical_attack: 5
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 2
      - item_sources:
          - "gunpowder"
        amount: 4

  4:
    variables:
      physical_attack: 6
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 2
      - item_sources:
          - "gunpowder"
        amount: 5
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true

  5:
    name: "<gold>暴击率提升</gold>"
    # variables 支持表达式字符串，可以引用 star 等上下文变量
    variables:
      physical_attack: 6
      physical_crit_rate: 2
    # ea_attributes 显式覆盖 - 如果配置了此字段，PDC 属性将使用此处的值
    # 如果不配置，则使用 variables 解析后的累积值
    ea_attributes:
      physical_attack: 25.0
      physical_crit_rate: 2.0
    # effects 中的 es_skill 类型 - 达到此星级时附加技能
    effects:
      - type: "es_skill"
        es_skills:
          - "weapon_crit_passive"
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 3
      - item_sources:
          - "gunpowder"
        amount: 6
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true
    # lore_actions - 达到此星级时对装备 Lore 的修改（CoreLib lore_actions 标准格式）
    lore_actions:
      - action: "append"
        content:
          - "<gray>强化达到 +5 后，物理武器会额外提供暴击率。</gray>"
          - "<gold>★ 解锁被动: 暴击强化</gold>"
    actions:
      success:
        - 'sendmessage text="<gold>强化达到 +5，解锁额外物理暴击率。</gold>"'
        - "playsound sound=minecraft:block.anvil.use volume=1 pitch=1.15"

  6:
    variables:
      physical_attack: 7
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 4
      - item_sources:
          - "gunpowder"
        amount: 8
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true

  7:
    variables:
      physical_attack: 8
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 5
      - item_sources:
          - "gunpowder"
        amount: 10
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true

  8:
    name: "<gold>伤害提升</gold>"
    variables:
      physical_attack: 9
      physical_damage_bonus: 4
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 6
      - item_sources:
          - "gunpowder"
        amount: 12
      - item_sources:
          - "paper"
        amount: 2
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true
    lore_actions:
      - action: "append"
        content:
          - "<gray>强化达到 +8 后，物理武器会额外提供增伤。</gray>"
    actions:
      success:
        - 'sendtitle title="<gold><bold>+8 物理伤害提升</bold></gold>"
          subtitle="<yellow>额外增伤已解锁</yellow>"'
        - "playsound sound=minecraft:entity.player.levelup volume=1.1 pitch=1.2"

  9:
    variables:
      physical_attack: 10
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 8
      - item_sources:
          - "gunpowder"
        amount: 16
      - item_sources:
          - "paper"
        amount: 2
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true

  10:
    name: "<gold>暴击伤害提升</gold>"
    variables:
      physical_attack: 12
      physical_crit_damage: 6
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 10
      - item_sources:
          - "gunpowder"
        amount: 20
      - item_sources:
          - "echo_shard"
        amount: 2
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true
    lore_actions:
      - action: "append"
        content:
          - "<gray>强化达到 +10 后，物理武器会额外提供暴击伤害。</gray>"
    actions:
      success:
        - 'sendtitle title="<gold><bold>+10 物理暴伤提升</bold></gold>"
          subtitle="<yellow>额外暴伤已解锁</yellow>"'
        - "playsound sound=minecraft:entity.firework_rocket.twinkle_far volume=1
          pitch=1"

  11:
    variables:
      physical_attack: 14
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 13
      - item_sources:
          - "gunpowder"
        amount: 26
      - item_sources:
          - "echo_shard"
        amount: 3
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true

  12:
    name: "<gold>穿透提升</gold>"
    variables:
      physical_attack: 16
      physical_armor_penetration: 8
    # 满星时附加终极技能
    effects:
      - type: "es_skill"
        es_skills:
          - "weapon_penetration_ultimate"
    materials:
      - item_sources:
          - "copper_ingot"
        amount: 16
      - item_sources:
          - "gunpowder"
        amount: 32
      - item_sources:
          - "echo_shard"
        amount: 4
      - item_sources:
          - "gold_nugget"
        amount: -1
        optional: true
        protection: true
      - item_sources:
          - "potion"
        amount: -1
        optional: true
        temper_boost: 1
    lore_actions:
      - action: "append"
        content:
          - "<gray>强化达到 +12 后，物理武器会额外提供穿透。</gray>"
          - "<gold>★ 解锁终极: 穿甲一击</gold>"
    actions:
      success:
        - 'sendtitle title="<gold><bold>+12 物理穿透提升</bold></gold>"
          subtitle="<yellow>额外穿透已解锁</yellow>"'
        - "playsound sound=minecraft:ui.toast.challenge_complete volume=1
          pitch=1"

# name_actions 控制物品名称的修改（CoreLib name_actions 标准格式）
# lore_actions 控制物品 Lore 的修改（CoreLib lore_actions 标准格式）
name_actions:
  - action: "append_suffix"
    value: " [+{star}]"

lore_actions:
  - action: "prepend"
    content:
      - "<gradient:#F2C46D:#C9703D>强化等级 +{star}</gradient>"
      - "<gray>锻印: {temper_color}{temper}/{max_temper}</gray>"
