# structured_presentation 控制物品名称和 lore 的渲染
# 这是 CoreLib 统一的展示层系统，所有 Emaki 插件共用
#
# name 操作:
#   base_name_policy: SOURCE_EFFECTIVE_NAME (保持原名) | EXPLICIT_TEMPLATE (覆盖名称)
#   base_name_template: 当 policy 为 EXPLICIT_TEMPLATE 时的模板
#   name_contributions: 名称前缀/后缀列表
#     - slot_id: 唯一标识 (用于去重)
#       position: PREFIX | POSTFIX
#       order: 排序权重 (越小越靠前)
#       content_template: 内容模板 (支持变量如 {star})
#
# lore 操作:
#   lore_sections: lore 段落列表
#     - section_id: 段落标识 (用于排序和去重)
#       order: 排序权重 (越小越靠前)
#       lines: 行列表 (支持 MiniMessage 和变量)
#
structured_presentation:
  name_contributions:
    - slot_id: "strengthen.badge"
      position: "POSTFIX"
      order: 200
      content_template: " [+{star}]"
  lore_sections:
    - section_id: "strengthen.header.primary"
      order: 200
      lines:
        - "<gradient:#F2C46D:#C9703D>强化等级 +{star}</gradient>"
    - section_id: "strengthen.header.secondary"
      order: 220
      lines:
        - "<gray>锻印: {temper_color}{temper}/{max_temper}</gray>"
