name: EmakiStrengthen
main: emaki.jiuwu.craft.strengthen.EmakiStrengthenPlugin
version: ${project.version}
api-version: "1.21.8"
folia-supported: true
dependencies:
  server:
    EmakiCoreLib:
      load: BEFORE
      required: true
      join-classpath: true
    EmakiAttribute:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  emakistrengthen.use:
    default: true
  emakistrengthen.reload:
    default: op
  emakistrengthen.debug:
    default: op
  emakistrengthen.admin:
    default: op
