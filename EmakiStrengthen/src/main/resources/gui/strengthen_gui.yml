# ============================================================
# EmakiStrengthen GUI 配置 - 强化界面
# ============================================================
# 玩家进行装备强化操作的主界面
# ============================================================
id: "strengthen_gui"

gui_type: CHEST
title: "<dark_gray>装备强化</dark_gray>"

rows: 5

slots:
  top_frame:
    slots:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  bottom_frame:
    slots:
      - 36
      - 37
      - 38
      - 39
      - 41
      - 42
      - 43
      - 44
    item:
      source: "gray_stained_glass_pane"
      components:
        custom_name: "<gray>"
        tooltip_display:
          hide_tooltip: true

  side_frame:
    slots:
      - 9
      - 17
      - 18
      - 26
      - 27
      - 35
    item:
      source: "black_stained_glass_pane"
      components:
        custom_name: "<dark_gray>"
        tooltip_display:
          hide_tooltip: true

  target_item:
    slots:
      - 13
    type: "target_item"
    item:
      source: "light_blue_stained_glass_pane"
      components:
        custom_name: "<aqua>放入待强化装备</aqua>"
        lore:
          - "<gray>支持所有可识别为 Emaki 来源的装备"
          - "<gray>会叠加 strengthen 层，不覆盖 forge 层"

  preview_display:
    slots:
      - 15
    type: "preview_display"
    item:
      source: "book"
      components:
        # 标题与内容都由插件按当前状态供给，文案见 lang 的 gui.preview.*
        custom_name: "%preview_title%"
        lore:
          # %preview_lines% 每项各占一行：成功率、花费、失败惩罚与材料清单
          # 材料按「已放入 GUI 的量 / 需要的量」计数，满足为绿色、不足为红色
          - "%preview_lines%"

  temper_display:
    slots:
      - 22
    type: "temper_display"
    item:
      source: "ink_sac"
      components:
        custom_name: "<gold>强化值状态</gold>"
        lore:
          # %temper_lines% 每项各占一行，文案见 lang 的 gui.temper.*
          - "%temper_lines%"

  material_input_1:
    slots:
      - 19
    type: "material_input_1"
    item:
      source: "gold_nugget"
      components:
        custom_name: "<yellow>强化材料槽 I</yellow>"
        lore:
          - "<gray>可放入本次强化要消耗的任意材料"

  material_input_2:
    slots:
      - 20
    type: "material_input_2"
    item:
      source: "paper"
      components:
        custom_name: "<yellow>强化材料槽 II</yellow>"
        lore:
          - "<gray>包括固定材料、保护材料和强化值材料"

  material_input_3:
    slots:
      - 29
    type: "material_input_3"
    item:
      source: "echo_shard"
      components:
        custom_name: "<yellow>强化材料槽 III</yellow>"
        lore:
          - "<gray>支持拆分放置不同材料组合"

  material_input_4:
    slots:
      - 30
    type: "material_input_4"
    item:
      source: "potion"
      components:
        custom_name: "<yellow>强化材料槽 IV</yellow>"
        lore:
          - "<gray>放入后只会从 GUI 槽位中扣除对应数量"

  confirm:
    slots:
      - 40
    type: "confirm"
    item:
      source: "anvil"
      components:
        # 不满足强化条件时插件会把图标换成 BARRIER 并改写标题
        custom_name: "%confirm_title%"
        lore:
          # %confirm_lines% 每项各占一行，文案见 lang 的 gui.confirm.* 与 gui.preview.cost_*
          - "%confirm_lines%"
    sounds:
      click:
        sound: "ui.button.click"
        volume: 1.0
        pitch: 1.0
