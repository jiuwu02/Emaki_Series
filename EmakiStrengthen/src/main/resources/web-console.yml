# EmakiStrengthen Web Console 声明式注册
# 仅声明结构信息与资源入口，不承载展示文案。

module:
  tone: strengthen
  icon: '<svg viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 30V12M13 18l6-6 6 6M12 8l1.6 3.2 3.4.5-2.5 2.4.6 3.4-3.1-1.6-3.1 1.6.6-3.4-2.5-2.4 3.4-.5L12 8zM27 7l1.2 2.5 2.8.4-2 1.9.5 2.7-2.5-1.3-2.5 1.3.5-2.7-2-1.9 2.8-.4L27 7zM11 31h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'

files:
  - path: "config.yml"
    kind: CONFIG
  - path: "recipes/**/*.yml"
    kind: CONFIG
  - path: "gui/**/*.yml"
    kind: GUI
    editor: "emakistrengthen:gui"

extensions:
  - id: "emakistrengthen:gui-surface"
    resource: "web-extensions/emakistrengthen-gui-surface.js"
