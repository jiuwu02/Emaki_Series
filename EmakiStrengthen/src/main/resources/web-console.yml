# EmakiStrengthen Web Console 声明式注册
# 仅声明后端发现信息；字段文案、表单 schema 与编辑器描述由前端扩展注册。

module:
  name: "Strengthen 强化"
  summary: "星级、广播、成功率"
  tone: strengthen

files:
  - title: "强化系统配置"
    path: "config.yml"
    kind: CONFIG
    comment: "强化系统主配置，包含成功率、材料、经济和显示策略。"
  - title: "强化 GUI 模板"
    path: "gui/**/*.yml"
    kind: GUI
    editor: "emakistrengthen:gui"
    comment: "强化界面 GUI 模板文件。"

extensions:
  - id: "emakistrengthen:gui-surface"
    resource: "web-extensions/emakistrengthen-gui-surface.js"
