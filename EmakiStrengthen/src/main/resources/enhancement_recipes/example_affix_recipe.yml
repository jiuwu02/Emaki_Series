# 词条强化示例配方（mode: affix）
# 由 /emakistrengthen affix [recipe] 打开的词条界面使用。与整件星级强化完全分离：
# target.provider 为 affix 时，level 指「选中词条的强化等级」，temper 指「词条层剩余容量」，
# 执行过程不读取也不写入整件装备的星级。

# 配方唯一 ID，缺失则整份配方被跳过
id: example_affix_enhance

# 配方模式：affix 表示词条强化
mode: affix

# 目标配置：provider 必须为已注册的 affix Provider
target:
  provider: affix

# 材料槽列表：matcher 为 CoreLib Matcher 配置，quantity 为 CoreLib Quantity 配置
# consume 取值：always / success / failure / never（默认 always）
# required（默认 true）：true 时缺料使整次匹配失败；false 时缺料只不贡献可用量，不阻断强化。
#   等价的反向写法是 optional: true，两者同时出现时 optional 生效。
# target_compare：把该槽材料与「当前目标」比较，合法值 same_affix / same_affix_set /
#   same_item_type / same_level / level_at_least。留空表示不做目标感知比较。
materials:
  - matcher:
      type: item_source
      sources:
        - "minecraft-lapis_lazuli"
    quantity: 1
    consume: always
  - matcher:
      type: item_source
      sources:
        - "minecraft-amethyst_shard"
    quantity: 1
    consume: success
    required: false
    target_compare: same_affix

# 货币消耗列表：词条等级越高越贵
costs:
  - provider: vault
    currency_id: money
    amount:
      type: formula
      expression: "50 * (target.level + 1)"

# 成功率：随词条等级递减
chance:
  type: formula
  expression: "max(0.1, 0.85 - target.level * 0.05)"

# 保底配置：按玩家累计失败次数触发强制成功
pity:
  scope: player
  group: example_affix_enhance
  threshold: 8
  effect: force_success
  decay:
    type: reset
    value: 0

# 多轨保底（可选）：一次尝试可同时推进多条计数器，每条独立 scope / group / threshold。
# 与上方单轨 pity 同时存在时两者都会参与；两条 track 的 scope+group 相同会被预检判为错误，
# 因为它们会共用同一个计数器并对同一次尝试重复计数。
# isolate：把该 track 的计数按维度分桶，合法值 recipe / mode / target / affix / level。
#   后缀加在 group 上而非 owner key 上，因此不影响按身份检索。留空（默认）时 group 逐字不变，
#   旧磁盘记录仍按原键命中。写入未知或重复维度会使该配方加载失败并在控制台报 load_failed。
pity_tracks:
  - scope: player
    group: example_affix_enhance_per_affix
    threshold: 5
    effect: force_success
    isolate:
      - affix
  - scope: item
    group: example_affix_enhance_item
    threshold: 12
    effect: chance_bonus
    bonus_value: 0.15
    decay:
      type: reset
      value: 0

# 进入条件（可选）：在 prepare() 内求值，因此预览与正式强化同时生效，
# 不满足时 GUI 会显示原因且不会扣除任何费用或材料。
condition:
  type: "all_of"
  invalid_as_failure: true
  entries:

# 动作分组：键名自由，值为 CoreLib Action 行列表
actions:
  on_success:
    - "sound: BLOCK_ENCHANTMENT_TABLE_USE"
  on_failure:
    - "sound: BLOCK_ANVIL_LAND"
