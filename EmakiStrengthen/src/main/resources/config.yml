# ============================================================
# EmakiStrengthen 主配置文件
# ============================================================
# 此文件包含插件的全局设置。修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiStrengthen/config.yml
# ============================================================

# 强化系统主配置
# version 由资源同步维护
version: "4.7.6"

# 语言文件 ID
language: "zh_CN"

# 是否释放内置示例资源。
# false 时不会自动生成示例强化配方等默认数据。
release_default_data: true

# 本地广播半径
local_broadcast_radius: 48

broadcast:
  # 达到这些星级时发送附近广播
  local_stars:
    - 8
  # 达到这些星级时发送全服广播
  global_stars:
    - 10
    - 12

# 配方未单独配置时使用这里的全局成功率
success_rates:
  1: 100.0
  2: 100.0
  3: 95.0
  4: 85.0
  5: 75.0
  6: 60.0
  7: 45.0
  8: 32.0
  9: 22.0
  10: 14.0
  11: 8.0
  12: 4.0

# 词条强化（ES-01 / ES-02）。与整件星级强化相互独立，不共用 currentStar。
# 该容量也不与 Forge 的锻造材料容量共用。
affix:
  # 单条词条的强化等级上限；0 表示不限
  max_level: 10
  # 装备的词条容量上限
  capacity_max: 100
  # 每提升一级词条占用的容量；容量不足时禁止强化且不扣费
  capacity_cost_per_level: 10
  # 每提升一级词条获得的属性增量
  bonus_per_level: 1.0
