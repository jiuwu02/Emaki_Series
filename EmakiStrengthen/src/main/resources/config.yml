# EmakiStrengthen 主配置
#
# 控制强化广播、默认成功率与词条强化参数。
# 修改后按插件提供的重载命令应用。
# 文件位置：plugins/EmakiStrengthen/config.yml

# version 是配置结构标记，由项目资源同步流程维护，不是功能开关。
version: "4.7.19"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放内置的强化配方等默认示例数据。
# 关闭后只加载已有数据，不主动生成缺失的默认示例。
release_default_data: true

# 附近广播的半径，单位：方块；小于 1 的值会按 1 处理。
local_broadcast_radius: 48

broadcast:
  # 强化达到以下星级时，向半径内玩家广播。
  local_stars:
    - 8
  # 强化达到以下星级时，向全服广播。
  global_stars:
    - 10
    - 12

# 配方未单独配置成功率时使用的默认值；数值按百分比填写。
success_rates:
  1: 100.0
  2: 100.0
  3: 95.0
  4: 85.0
  5: 75.0
  6: 60.0
  7: 45.0
  8: 32.0
  9: 22.0
  10: 14.0
  11: 8.0
  12: 4.0

# 词条强化参数。它与整件物品的星级强化独立计算。
affix:
  # 单条词条的强化等级上限；0 表示不设上限。
  max_level: 10
  # 单件装备可分配给词条的总容量。
  capacity_max: 100
  # 每提升一级词条消耗的容量；容量不足时本次强化不会执行。
  capacity_cost_per_level: 10
  # 每提升一级词条增加的属性值。
  bonus_per_level: 1.0

# 通用强化框架的事务边界设置。
enhancement:
  # 是否拒绝把「外部容器槽位里的物品」直接作为强化目标。
  # 打开后，玩家在箱子等非自身背包的界面里对容器内物品发起强化会被拒绝，
  # 避免物品在预览与确认之间被其他玩家取走。默认 false 保持既有行为不变。
  reject_container_target: false

  # 是否拒绝把「外部容器槽位里的物品」作为强化材料。
  # 与 reject_container_target 同理：材料同样可能在预览与确认之间被取走，
  # 造成按旧数量扣费但实际扣不到。默认 false 保持既有行为不变。
  reject_container_material: false

  # 成功率的最低下限，按 0.0-1.0 的比例填写。
  # 只在递减把成功率压得过低时抬升，不会压低本来更高的成功率；
  # 保底触发的强制成功不受此项影响。默认 0.0 表示不设下限。
  min_success_rate: 0.0

  # 收益递减：等级越高，配方给出的基础成功率被按比例削减得越多。
  diminishing_returns:
    # 每超出 start_level 一级削减的比例，按 0.0-1.0 填写。默认 0.0 关闭。
    per_level: 0.0
    # 从该等级起开始递减；低于此等级的强化不受影响。
    start_level: 1

  # 成本递增：等级越高，本次强化的货币费用越贵。
  cost_growth:
    # 每一级追加的费用比例，按 0.0 起的倍率填写。默认 0.0 关闭。
    per_level: 0.0
    # 费用倍率上限；0 表示不设上限。
    max_multiplier: 0.0

  # 失败降级：强化失败时把等级往回退。默认 levels 为 0，失败不掉级。
  failure_demotion:
    # 单次失败回退的等级数；0 表示不降级。
    levels: 0
    # 回退不会低于该等级。
    floor_level: 0

  # 保底状态落盘失败后的重试。默认 interval_ticks 为 0，不启动重试，
  # 保持「等待下一次生命周期 flush」的既有行为。
  pity_retry:
    # 重试间隔，单位 tick；0 表示不启动重试任务。
    interval_ticks: 0
    # 连续失败达到该次数后停止重试并告警；0 表示不启动重试任务。
    max_attempts: 0

  # 物品熟练度。经验只在一次强化的费用、材料与目标全部提交成功后才记账。
  # 两项经验都为 0 时完全不写熟练度数据，保持既有行为不变。
  mastery:
    # 每次强化（无论成败）获得的经验。
    exp_per_attempt: 0.0
    # 强化成功时额外获得的经验。
    exp_per_success: 0.0
    # 熟练度等级软上限；0 表示不限。每 100 点累计经验为一级。
    soft_cap: 0
