# EmakiStrengthen 主配置
#
# 控制强化广播、默认成功率与词条强化参数。
# 修改后按插件提供的重载命令应用。
#
# 文件位置：plugins/EmakiStrengthen/config.yml
#

# version 是配置结构标记，由项目资源同步流程维护，不是功能开关。
version: "4.7.11"

# 语言文件名，对应 lang/<language>.yml。
language: "zh_CN"

# 是否在启动时释放内置的强化配方等默认示例数据。
# 关闭后只加载已有数据，不主动生成缺失的默认示例。
release_default_data: true

# 附近广播的半径，单位：方块；小于 1 的值会按 1 处理。
local_broadcast_radius: 48

broadcast:
  # 强化达到以下星级时，向半径内玩家广播。
  local_stars:
    - 8
  # 强化达到以下星级时，向全服广播。
  global_stars:
    - 10
    - 12

# 配方未单独配置成功率时使用的默认值；数值按百分比填写。
success_rates:
  1: 100.0
  2: 100.0
  3: 95.0
  4: 85.0
  5: 75.0
  6: 60.0
  7: 45.0
  8: 32.0
  9: 22.0
  10: 14.0
  11: 8.0
  12: 4.0

# 词条强化参数。它与整件物品的星级强化独立计算。
affix:
  # 单条词条的强化等级上限；0 表示不设上限。
  max_level: 10
  # 单件装备可分配给词条的总容量。
  capacity_max: 100
  # 每提升一级词条消耗的容量；容量不足时本次强化不会执行。
  capacity_cost_per_level: 10
  # 每提升一级词条增加的属性值。
  bonus_per_level: 1.0
