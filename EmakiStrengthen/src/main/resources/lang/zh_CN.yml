# ============================================================
# EmakiStrengthen 语言文件 - 简体中文
# ============================================================
# 此文件包含插件的所有消息文本，支持 MiniMessage 格式。
# 修改后使用 reload 命令重载。
#
# 文件放置位置: plugins/EmakiStrengthen/lang/
# ============================================================

# version 由资源同步维护
version: "4.6.9"

general:
  prefix: "<gray>[ <gradient:#FACC15:#F97316>EmakiStrengthen</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此操作。</red>"
  player_only: "<red>此命令只能由玩家执行。</red>"
  player_not_found: "<red>未找到目标玩家。</red>"
  unknown_command: "<red>未知命令。</red>"
  invalid_args: "<red>参数错误。</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>配置已重载。</green>"
  reload_summary: "<gray>已重载配方 %recipes% 个、材料 %materials% 个、GUI %guis% 个。</gray>"

command:
  help:
    header: "<gold>========== 强化帮助 ==========</gold>"
    footer: "<gold>==================================</gold>"
    line: "<yellow>%cmd%</yellow> <gray>- %desc%</gray>"
    desc:
      help: "显示帮助信息"
      open: "打开强化界面"
      reload: "重载强化配置和 GUI"
      inspect: "查看手持物品强化状态"
      refresh: "刷新玩家背包中的强化层"
      setstar: "直接设置主手物品星级"
      clearstate: "移除主手物品上的强化层"
      clearcrack: "清除主手物品裂痕"
      givecatalyst: "发放强化材料"
      debug: "管理 Debug 追踪"
  inspect:
    header: "<gold>========== %player% 的强化状态 ==========</gold>"
    line: "<yellow>%key%</yellow> <gray>- %value%</gray>"
  refresh:
    success: "<green>已刷新 <aqua>%player%</aqua> 背包中的强化层。</green>"
  setstar:
    success: "<green>主手物品已设置为 <gold>+%star%</gold>。</green>"
  clearstate:
    success: "<green>已清空主手物品上的强化层。</green>"
    no_layer: "<yellow>主手物品当前没有可移除的强化层。</yellow>"
  clearcrack:
    success: "<green>主手物品的锻印已清零。</green>"
  givecatalyst:
    success: "<green>已向 <aqua>%player%</aqua> 发放 <gold>%amount%</gold> 个
      %material%。</green>"
  catalyst_not_found: "<red>未找到该强化材料 ID。</red>"
  catalyst_create_failed: "<red>无法创建该强化材料物品。</red>"
  admin_state_failed: "<red>无法将主手物品写回强化状态。</red>"

console:
  plugin_starting: "<gray>正在启动...</gray>"
  plugin_started: "<green>启动完成</green>"
  plugin_stopped: "<yellow>已关闭</yellow>"
  config_precheck_passed: "<gray>配置预检通过：<yellow>%issues%</yellow> 个提示。</gray>"
  config_precheck_failed: "<red>配置预检失败：<yellow>%issues%</yellow> 个问题。</red>"
  config_precheck_issue: "<gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray>（%hint%）</dark_gray>"
    messages:
      passed: "强化配置预检通过。"
      required_file_missing: "缺少必需文件。"
      path_not_file: "路径不是文件。"
      file_not_readable: "文件不可读。"
      required_directory_missing: "缺少必需目录。"
      path_not_directory: "路径不是目录。"
      directory_not_readable: "目录不可读。"
  bootstrap_start: "<white>开始检查默认文件...</white>"
  bootstrap_complete: "<green>默认文件检查完成。</green>"
  bootstrap_skip: "<yellow>release_default_data=false，已跳过默认数据生成。</yellow>"
  versioned_file_updated: "<green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "<yellow>复制默认资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "<yellow>保存合并资源失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  default_file_missing: "<yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  directory_create_failed: "<yellow>创建目录失败: <red>%path%</red></yellow>"
  loader_config_load_error: "<yellow>读取强化配置失败: <red>%path%</red> <gray>(%error%)</gray></yellow>"
  recipe_action_failed:
    "<yellow>强化动作链执行失败: <red>%recipe%</red> <gray>阶段 %phase%
    星级 %star% (%error%)</gray></yellow>"
  pdc_source_registered: "<gray>PDC 属性源已注册: <aqua>%source%</aqua></gray>"
  recipes_loaded: "<gray>已加载 <yellow>%count%</yellow> 个强化配方</gray>"
  papi_registered: "<gray>PlaceholderAPI 扩展已注册</gray>"

loader:
  lang_directory_create_failed: "<yellow>无法创建语言目录: <red>%path%</red></yellow>"
  bundled_language_load_failed: "<yellow>读取内置语言失败: <red>%error%</red></yellow>"
  directory_create_failed: "<yellow>无法创建 %type% 目录: <red>%path%</red></yellow>"
  invalid_blank_id: "<yellow>%type% ID 为空: <red>%file%</red></yellow>"
  duplicate_id: "<yellow>重复的 %type% ID <red>%id%</red>，来源 <gray>%file%</gray></yellow>"
  load_failed: "<yellow>读取 %type% 文件失败: <red>%file%</red> <gray>(%error%)</gray></yellow>"
  type:
    recipe: "强化配方"

strengthen:
  misc:
    default_item_name: "物品"
    free_cost: "免费"
    unknown_material: "未知材料"
  error:
    no_target: "<red>请先放入需要强化的物品。</red>"
    no_source: "<red>该物品无法识别为 Emaki 物品来源。</red>"
    no_recipe: "<red>当前物品未命中可用的强化配方。</red>"
    already_max: "<red>该物品已经达到最高星级。</red>"
    material_missing: "<red>GUI 中放入的强化材料不足。</red>"
    invalid_optional_material: "<red>放入 GUI 的强化材料与当前星级配方不匹配。</red>"
    insufficient_funds: "<red>本次强化所需费用不足: %costs%</red>"
    economy_provider_unavailable: "<red>经济提供者当前不可用。</red>"
    rebuild_failed: "<red>强化结果写回失败，未执行本次强化。</red>"
  preview:
    failure_keep: "<gray>失败后保留当前星级，并累积锻印。</gray>"
    failure_drop: "<red>失败后掉落 1 星，并累积锻印。</red>"
    failure_drop_protected: "<gold>失败后消耗保护材料，不会掉星。</gold>"
  broadcast:
    local_reach: "<aqua>%player%</aqua> <yellow>将 %show_item% 强化到
      <gold>+%star%</gold>。</yellow>"
    global_reach: "<aqua>%player%</aqua> <yellow>成功将 %show_item% 强化到
      <gold>+%star%</gold>。</yellow>"

gui:
  open_failed: "<red>无法打开强化界面，请检查 GUI 模板是否加载成功。</red>"
  attempt_success: "<green>强化成功，当前星级提升至 <gold>+%star%</gold>。</green>"
  attempt_failed: "<yellow>强化失败，但仍维持在 <gold>+%star%</gold>。</yellow>"
  attempt_failed_downgrade: "<red>强化失败，星级掉落至 <gold>+%star%</gold>。</red>"
  inventory_full: "<yellow>背包空间不足，多余物品已掉落在脚边。</yellow>"
  preview:
    title: "<gold>强化预览</gold>"
    hint_no_target_1: "<gray>放入待强化装备后显示成功率、材料与花费</gray>"
    hint_no_target_2: "<gray>所有强化材料都需要放入 GUI 才会计数与扣除</gray>"
    ineligible_title: "<red>强化条件未满足</red>"
    ineligible_hint: "<gray>当前无法强化</gray>"
    current_star: "<gray>当前星级: <gold>+%star%</gold></gray>"
    target_star: "<gray>目标星级: <yellow>+%star%</yellow></gray>"
    success_rate: "<gray>成功率: <green>%rate%%</green></gray>"
    cost_free: "<gray>花费: <green>免费</green></gray>"
    cost_header: "<gray>花费:</gray>"
    cost_line: "<gold> - %amount% %name%</gold>"
    required_materials_header: "<gray>阶段材料（GUI）:</gray>"
    optional_materials_header: "<gray>已放入 GUI 材料:</gray>"
    delta_stats_header: "<gray>强化提升:</gray>"
    delta_stats_line: "<gold> - %id% +%value%</gold>"
  temper:
    title: "<gold>锻印状态</gold>"
    current: "<gray>当前锻印: <gold>%temper%/%max%</gold></gray>"
    bonus: "<gray>本次额外锻印加成: <aqua>+%bonus%</aqua></gray>"
    hint: "<gray>失败后会累积锻印，提高后续成功率</gray>"
  confirm:
    title: "<green>确认强化</green>"
    ineligible_title: "<red>无法强化</red>"
    ineligible_hint: "<gray>请先满足所有强化条件</gray>"

