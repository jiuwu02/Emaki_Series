# EmakiStrengthen 简体中文语言资源
# 消息使用 MiniMessage; 保留消息分组旁标明的占位符
# version 由资源同步流程维护, 用于合并新增默认键

version: "4.8.9"

general:
  prefix: "<gray>[ <gradient:#3636F5:#E02492>EmakiStrengthen</gradient> ]</gray>"
  no_permission: "<red>你没有权限执行此操作</red>"
  player_only: "<red>此命令只能由玩家执行</red>"
  player_not_found: "<red>未找到目标玩家</red>"
  unknown_command: "<red>未知命令</red>"
  invalid_args: "<red>参数错误</red>"
  reloading: "<gray>正在重载配置...</gray>"
  reload_success: "<green>配置已重载</green>"
  reload_summary: "<gray>已重载配方 %recipes% 个, 材料 %materials% 个, GUI %guis% 个</gray>"
  # 玩家: 重载耗时反馈; 占位符: %elapsed%
  reload_elapsed: "<gray>重载耗时: <white>%elapsed%ms</white></gray>"

command:
  help:
    header: "<gold>========== 强化帮助 ==========</gold>"
    footer: "<gold>==================================</gold>"
    line: "<yellow>%cmd%</yellow> <gray>- %desc%</gray>"
    desc:
      help: "显示帮助信息"
      open: "打开强化界面"
      affix: "打开词条强化界面"
      edit: "打开定义的游戏内编辑界面"
      reload: "重载强化配置和 GUI"
      inspect: "查看手持物品强化状态"
      refresh: "刷新玩家背包中的强化层"
      setstar: "直接设置主手物品星级"
      branch: "查看或选择主手物品的强化分支"
      clearstate: "移除主手物品上的强化层"
      clearcrack: "清除主手物品强化值"
      givecatalyst: "发放强化材料"
      operation: "查询强化操作号与补偿状态"
      pity: "查询, 设置, 清除与诊断保底计数"
      convert_legacy: "把 recipes/ 的旧 match 块转换为 matcher 与顶层字段"
      debug: "管理 Debug 追踪"
  branch:
    options: "<gold>该物品已到达分叉点, 请选择一条强化路线:</gold>"
    invalid: "<red>没有这条分支. 可选路线如下:</red>"
    option: "<yellow>%id%</yellow> <gray>- %name%</gray>"
    success: "<green>已选择 <yellow>%name%</yellow> 路线 (路径 <gray>%path%</gray>)</green>"
  convert_legacy:
    header: "<gold>========== 旧 match 块转换 (%mode%, 共 %files% 个文件) ==========</gold>"
    mode:
      dry_run: "预演"
      apply: "写入"
    file: "<yellow>%file%</yellow> <gray>- %status% %detail%</gray>"
    backup: "<gray>  已备份为 <white>%backup%</white></gray>"
    diff_line: "<gray>  %line%</gray>"
    summary: "<gray>转换 %converted% 个, 无旧块 %skipped% 个, 键冲突 %conflict% 个, 无法转换 %unconvertible% 个, 失败 %failed% 个</gray>"
    breakdown: "<gray>其中: 直接转为 matcher 并移除旧键 <white>%plain%</white> 处, 与原有 matcher 合并为 all_of 以保持判定等价 <white>%merged%</white> 处, 补写 matcher 但保留旧键 (仍用于取物, 扣除或计数)<white>%duplicated%</white> 处</gray>"
    file_merged: "<gray>  合并为 all_of <white>%merged%</white> 处, 保留旧键 <white>%duplicated%</white> 处, 直接转换 <white>%plain%</white> 处</gray>"
    dry_run_hint: "<yellow>以上为预演结果, 未写入任何文件. 执行 <white>/emakistrengthen convert-legacy confirm</white> 才会写入并备份原文件</yellow>"
    nothing_to_do: "<gray>没有需要转换的配置</gray>"
    status:
      converted: "可转换"
      no_legacy_block: "无旧块"
      conflict: "键冲突, 已保留原样"
      unconvertible: "字段无等价写法, 已保留原样"
      failed: "转换失败, 已保留原样"
  pity:
    header: "<gold>========== 保底计数 (%count% 条) ==========</gold>"
    line: "<yellow>%group%</yellow> <gray>作用域=%scope% 键=%key% 计数=%counter% 已触发=%triggered%</gray>"
    empty: "<gray>当前没有任何保底计数记录</gray>"
    unavailable: "<red>保底存储当前不可用</red>"
    not_found: "<red>未找到匹配的保底记录</red>"
    set_success: "<green>已将 <yellow>%group%</yellow> 的保底计数设为 <gold>%counter%</gold></green>"
    clear_success: "<green>已清除 <gold>%count%</gold> 条保底记录</green>"
    invalid_scope: "<red>保底作用域只能是 <yellow>%legal%</yellow></red>"
    diagnose_header: "<gold>========== 保底诊断 ==========</gold>"
    diagnose_line: "<yellow>%key%</yellow> <gray>- %value%</gray>"
  operation:
    header: "<gold>========== 强化操作日志 (%count% 条) ==========</gold>"
    line: "<yellow>%operation_id%</yellow> <gray>玩家=%player% 阶段=%phase% 待补偿=%pending%</gray>"
    empty: "<gray>当前没有保留中的强化操作</gray>"
    not_found: "<red>未找到操作号 <yellow>%operation_id%</yellow>, 它可能已经结算并被清理</red>"
    unavailable: "<red>强化框架当前不可用, 无法查询操作号</red>"
  inspect:
    header: "<gold>========== %player% 的强化状态 ==========</gold>"
    line: "<yellow>%key%</yellow> <gray>- %value%</gray>"
  refresh:
    success: "<green>已刷新 <aqua>%player%</aqua> 背包中的强化层</green>"
  affix:
    no_recipe: "<red>当前没有任何 mode: affix 的词条强化配方</red>"
    recipe_not_found: "<red>未找到词条强化配方 <yellow>%recipe%</yellow></red>"
    ambiguous_recipe: "<red>存在多个词条强化配方, 请指定其中一个: <yellow>%recipes%</yellow></red>"
  setstar:
    success: "<green>主手物品已设置为 <gold>+%star%</gold></green>"
  clearstate:
    success: "<green>已清空主手物品上的强化层</green>"
    no_layer: "<yellow>主手物品当前没有可移除的强化层</yellow>"
  clearcrack:
    success: "<green>主手物品的强化值已清零</green>"
  givecatalyst:
    success: "<green>已向 <aqua>%player%</aqua> 发放 <gold>%amount%</gold> 个
      %material%.</green>"
  catalyst_not_found: "<red>未找到该强化材料 ID</red>"
  catalyst_create_failed: "<red>无法创建该强化材料物品</red>"
  admin_state_failed: "<red>无法将主手物品写回强化状态</red>"

console:
  plugin_starting: "[startup] <gray>正在启动...</gray>"
  plugin_started: "[startup] <green>启动完成</green>"
  plugin_stopped: "[shutdown] <yellow>已关闭</yellow>"
  config_precheck_passed: "[config] <gray>配置预检通过: <yellow>%issues%</yellow> 个提示</gray>"
  config_precheck_failed: "[config] <red>配置预检失败: <yellow>%issues%</yellow> 个问题</red>"
  config_precheck_issue: "[config] <gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "[config] <yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "[config] <red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "致命"
      error: "错误"
      warn: "警告"
      info: "信息"
    hint: " <dark_gray> (%hint%)</dark_gray>"
    messages:
      passed: "强化配置预检通过"
      required_file_missing: "缺少必需文件"
      path_not_file: "路径不是文件"
      file_not_readable: "文件不可读"
      required_directory_missing: "缺少必需目录"
      path_not_directory: "路径不是目录"
      directory_not_readable: "目录不可读"
      # 控制台: 强化配方材料槽 target_compare 未知; 占位符: %recipe%, %index%, %token%, %legal%
      enhancement_recipe_unknown_target_compare: "强化配方 %recipe% 的 material_%index% 声明了未知的 target_compare '%token%'; 合法取值为 %legal%"
      # 控制台: 强化配方材料槽 required/optional 冲突; 占位符: %recipe%, %index%
      enhancement_recipe_required_optional_conflict: "强化配方 %recipe% 的 material_%index% 同时声明了 'required' 与 'optional'; 以 'optional' 为准, 'required' 会被忽略"
      # 控制台: 强化配方材料槽既无 matcher 也无 item_sources; 占位符: %recipe%, %index%
      enhancement_recipe_empty_matcher: "强化配方 %recipe% 的 material_%index% 既没有 matcher 也没有 item_sources, 任意投入的物品都会满足该槽位"
      # 控制台: 强化配方无必需材料槽; 占位符: %recipe%
      enhancement_recipe_no_required_slot: "强化配方 %recipe% 有材料, 但没有任何材料被标记为 required, 这些槽位永远不会阻止强化"
      # 控制台: 强化配方保底轨道重复; 占位符: %recipe%, %track%
      enhancement_recipe_duplicate_pity_track: "强化配方 %recipe% 声明了重复的保底轨道 '%track%'; 重复轨道共用同一计数器, 会重复累计同一次强化"
      # 控制台: 强化配方保底轨道按等级隔离; 占位符: %recipe%, %track%
      enhancement_recipe_pity_level_isolation: "强化配方 %recipe% 的保底轨道 '%track%' 在 player 作用域下按等级隔离, 目标等级变化时计数器会重置"
      # 控制台: 强化配方 mode 与目标 provider 不一致; 占位符: %recipe%, %mode%, %provider%
      enhancement_recipe_mode_provider_mismatch: "强化配方 %recipe% 声明了 mode '%mode%', 但目标 provider 为 '%provider%'; 分发以 provider 为准, mode 只用于填充 enhancement_mode 占位符, 两者不一致通常是配置错误"
      # 控制台: forge 变量路径不在 forge 前缀下; 占位符: %path%
      forge_variable_path_prefix: "forge 变量路径 '%path%' 必须位于 forge 前缀之下"
      # 控制台: 规范 forge 变量缺少别名来源; 占位符: %variable%
      forge_variable_canonical_missing: "规范 forge 变量 '%variable%' 未由任何别名路径产出"
      # 控制台: 旧版 forge 变量不再产出; 占位符: %variable%
      forge_variable_legacy_missing: "旧版 forge 变量 '%variable%' 已不再产出, 会破坏既有配方"
      # 控制台: forge PDC 命名空间不匹配; 占位符: %namespace%
      forge_pdc_namespace_mismatch: "forge PDC 命名空间期望为 'emakiforge', 实际为 '%namespace%'"
  bootstrap_start: "[loader] <gray>开始检查默认文件...</gray>"
  bootstrap_complete: "[loader] <green>默认文件检查完成</green>"
  bootstrap_skip: "[loader] <yellow>release_default_data=false, 已跳过默认数据生成</yellow>"
  versioned_file_updated: "[loader] <green>已自动更新默认文件版本: <yellow>%path%</yellow> <gray> (%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "[loader] <yellow>复制默认资源失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  bootstrap_save_failed: "[loader] <yellow>保存合并资源失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  default_file_missing: "[loader] <yellow>缺少内置默认资源: <red>%path%</red></yellow>"
  directory_create_failed: "[loader] <yellow>创建目录失败: <red>%path%</red></yellow>"
  loader_config_load_error: "[loader] <yellow>读取强化配置失败: <red>%path%</red> <gray> (%error%)</gray></yellow>"
  recipe_action_failed:
    "[attempt] <yellow>强化动作链执行失败: <red>%recipe%</red> <gray>阶段 %phase%
    星级 %star%  (%error%)</gray></yellow>"
  pdc_source_registered: "[integration] <gray>PDC 属性源已注册: <aqua>%source%</aqua></gray>"
  recipes_loaded: "[loader] <gray>已加载 <yellow>%count%</yellow> 个强化配方</gray>"
  papi_registered: "[integration] <gray>PlaceholderAPI 扩展已注册</gray>"
  editor_open_failed: "[editor] <red>无法打开 EmakiStrengthen 编辑界面: %item%  (%error%)</red>"
  editor_template_missing: "[editor] <red>缺少 EmakiStrengthen 编辑界面模板: %template%</red>"
  editor_browser_create_failed: "[editor] <red>无法创建定义: %path%  (%error%)</red>"
  editor_browser_delete_failed: "[editor] <red>无法删除定义: %path%  (%error%)</red>"
  editor_browser_list_failed: "[editor] <red>无法列举定义目录: %path%  (%error%)</red>"
  # 控制台: 重载进度提示
  reload_loading_files: "[reload] <gray>正在加载配置文件...</gray>"
  reload_loading_configs: "[reload] <gray>正在读取配置...</gray>"
  reload_applying: "[reload] <gray>正在应用配置...</gray>"
  reload_complete: "[reload] <green>重载完成</green>"
  # 控制台: 重载阶段失败; 占位符: %stage%, %error%
  reload_stage_failed: "[reload] <yellow>重载阶段 %stage% 失败: %error%</yellow>"
  # 控制台: 强化尝试安全失败; 占位符: %operation_id%, %error%
  strengthen_attempt_failed_closed: "[attempt] <red>强化尝试安全失败 | operationId=%operation_id% | error=%error%</red>"
  # 控制台: 强化结果事件分发失败; 占位符: %operation_id%, %error%
  strengthen_result_dispatch_failed: "[event] <yellow>强化结果事件分发失败 | operationId=%operation_id% | error=%error%</yellow>"
  # 控制台: GUI 结果动作分发失败; 占位符: %operation_id%, %error%
  gui_result_action_dispatch_failed: "[gui] <yellow>强化结果动作分发失败 | operationId=%operation_id% | error=%error%</yellow>"
  # 控制台: 已提交结果归属者离线; 占位符: %operation_id%
  gui_owner_retired: "[gui] <yellow>强化已提交结果的归属者已离线, 结算仍待处理 | operationId=%operation_id%</yellow>"
  # 控制台: 已提交结果调度被拒绝; 占位符: %operation_id%
  gui_schedule_rejected: "[gui] <red>强化已提交结果的调度被拒绝, 结算仍待处理 | operationId=%operation_id%</red>"
  # 控制台: 已提交结果调度失败; 占位符: %operation_id%, %error%
  gui_schedule_failed: "[gui] <red>强化已提交结果的调度失败, 结算仍待处理 | operationId=%operation_id% | error=%error%</red>"
  # 控制台: 已提交结果结算失败将重试; 占位符: %operation_id%, %error%
  gui_settlement_retry: "[gui] <red>强化已提交结果的结算失败, 将重试 | operationId=%operation_id% | error=%error%</red>"
  # 控制台: 结算后结果通知失败; 占位符: %operation_id%, %error%
  gui_notification_failed: "[gui] <yellow>结算后强化结果通知失败 | operationId=%operation_id% | error=%error%</yellow>"
  # 控制台: 背包已满通知失败; 占位符: %error%
  gui_inventory_full_notify_failed: "[gui] <yellow>背包已满通知失败 | error=%error%</yellow>"

loader:
  lang_directory_create_failed: "[loader] <yellow>无法创建语言目录: <red>%path%</red></yellow>"
  bundled_language_load_failed: "[loader] <yellow>读取内置语言失败: <red>%error%</red></yellow>"
