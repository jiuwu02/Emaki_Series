# EmakiStrengthen English language resource.
# Messages use MiniMessage; preserve placeholders documented beside message groups.
# version is maintained by resource synchronization when default keys are merged.

version: "4.8.8"

general:
  prefix: "<gray>[ <gradient:#3636F5:#E02492>EmakiStrengthen</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to perform this action.</red>"
  player_only: "<red>This command can only be executed by a player.</red>"
  player_not_found: "<red>Target player not found.</red>"
  unknown_command: "<red>Unknown command.</red>"
  invalid_args: "<red>Invalid arguments.</red>"
  reloading: "<gray>Reloading configuration...</gray>"
  reload_success: "<green>Config reloaded.</green>"
  reload_summary:
    "<gray>Reloaded %recipes% recipes, %materials% materials, %guis%
    GUIs.</gray>"
  # Player: reload elapsed feedback; placeholders: %elapsed%
  reload_elapsed: "<gray>Reload took <white>%elapsed%ms</white></gray>"

command:
  help:
    header: "<gold>========== Strengthen Help ==========</gold>"
    footer: "<gold>==================================</gold>"
    line: "<yellow>%cmd%</yellow> <gray>- %desc%</gray>"
    desc:
      help: "Show help"
      open: "Open strengthen GUI"
      affix: "Open affix enhancement GUI"
      edit: "Open the in-game editor for a definition"
      reload: "Reload strengthen config and GUI"
      inspect: "Inspect held item strengthen state"
      refresh: "Refresh strengthen layers in player inventory"
      setstar: "Set main-hand item star level"
      branch: "View or choose the strengthen branch of the main-hand item"
      clearstate: "Remove strengthen layer from main-hand item"
      clearcrack: "Clear main-hand item temper"
      givecatalyst: "Give strengthen material"
      operation: "Query enhancement operation ids and compensation state"
      pity: "Query, set, clear and diagnose pity counters"
      convert_legacy: "Convert legacy match blocks in recipes/ to matcher and top-level fields"
      debug: "Manage debug tracking"
  branch:
    options: "<gold>This item reached a fork. Choose a strengthen route:</gold>"
    invalid: "<red>No such branch. Available routes:</red>"
    option: "<yellow>%id%</yellow> <gray>- %name%</gray>"
    success: "<green>Selected the <yellow>%name%</yellow> route (path <gray>%path%</gray>).</green>"
  convert_legacy:
    header: "<gold>========== Legacy match conversion (%mode%, %files% files) ==========</gold>"
    mode:
      dry_run: "dry run"
      apply: "apply"
    file: "<yellow>%file%</yellow> <gray>- %status% %detail%</gray>"
    backup: "<gray>  Backed up as <white>%backup%</white></gray>"
    diff_line: "<gray>  %line%</gray>"
    summary: "<gray>Converted %converted%, no legacy block %skipped%, key conflict %conflict%, unconvertible %unconvertible%, failed %failed%.</gray>"
    breakdown: "<gray>Of those: <white>%plain%</white> turned straight into a matcher with the legacy key removed, <white>%merged%</white> folded together with an existing matcher into one all_of so the decision stays equivalent, <white>%duplicated%</white> given a matcher while keeping the legacy key it still needs for building, deducting or counting items.</gray>"
    file_merged: "<gray>  <white>%merged%</white> merged into all_of, <white>%duplicated%</white> kept the legacy key, <white>%plain%</white> converted directly</gray>"
    dry_run_hint: "<yellow>The above is a dry run; no file was written. Run <white>/emakistrengthen convert-legacy confirm</white> to write and back up the originals.</yellow>"
    nothing_to_do: "<gray>No configuration needs conversion.</gray>"
    status:
      converted: "convertible"
      no_legacy_block: "no legacy block"
      conflict: "key conflict, left unchanged"
      unconvertible: "field has no equivalent, left unchanged"
      failed: "conversion failed, left unchanged"
  pity:
    header: "<gold>========== Pity Counters (%count%) ==========</gold>"
    line: "<yellow>%group%</yellow> <gray>scope=%scope% key=%key% counter=%counter% triggered=%triggered%</gray>"
    empty: "<gray>No pity counter records exist.</gray>"
    unavailable: "<red>The pity store is currently unavailable.</red>"
    not_found: "<red>No matching pity record found.</red>"
    set_success: "<green>Set the pity counter of <yellow>%group%</yellow> to <gold>%counter%</gold>.</green>"
    clear_success: "<green>Cleared <gold>%count%</gold> pity records.</green>"
    invalid_scope: "<red>Pity scope must be one of <yellow>%legal%</yellow>.</red>"
    diagnose_header: "<gold>========== Pity Diagnostics ==========</gold>"
    diagnose_line: "<yellow>%key%</yellow> <gray>- %value%</gray>"
  operation:
    header: "<gold>========== Enhancement Operations (%count%) ==========</gold>"
    line: "<yellow>%operation_id%</yellow> <gray>player=%player% phase=%phase% pending=%pending%</gray>"
    empty: "<gray>No enhancement operations are currently retained.</gray>"
    not_found: "<red>No operation id <yellow>%operation_id%</yellow>; it may already be settled and pruned.</red>"
    unavailable: "<red>The enhancement runtime is unavailable, operation ids cannot be queried.</red>"
  inspect:
    header: "<gold>========== %player% Strengthen State ==========</gold>"
    line: "<yellow>%key%</yellow> <gray>- %value%</gray>"
  refresh:
    success: "<green>Refreshed strengthen layers for <aqua>%player%</aqua>.</green>"
  affix:
    no_recipe: "<red>No enhancement recipe with mode: affix is loaded.</red>"
    recipe_not_found: "<red>Affix enhancement recipe <yellow>%recipe%</yellow> was not found.</red>"
    ambiguous_recipe: "<red>Multiple affix recipes exist, specify one: <yellow>%recipes%</yellow></red>"
  setstar:
    success: "<green>Main-hand item set to <gold>+%star%</gold>.</green>"
  clearstate:
    success: "<green>Strengthen layer removed from main-hand item.</green>"
    no_layer: "<yellow>Main-hand item has no removable strengthen layer.</yellow>"
  clearcrack:
    success: "<green>Main-hand item temper cleared.</green>"
  givecatalyst:
    success: "<green>Gave <gold>%amount%</gold> %material% to
      <aqua>%player%</aqua>.</green>"
  catalyst_not_found: "<red>Strengthen material ID not found.</red>"
  catalyst_create_failed: "<red>Failed to create strengthen material item.</red>"
  admin_state_failed: "<red>Failed to write strengthen state back to main-hand item.</red>"

console:
  plugin_starting: "[startup] <gray>Starting...</gray>"
  plugin_started: "[startup] <green>Started</green>"
  plugin_stopped: "[shutdown] <yellow>Stopped</yellow>"
  config_precheck_passed: "[config] <gray>Config precheck passed: <yellow>%issues%</yellow> issue(s)</gray>"
  config_precheck_failed: "[config] <red>Config precheck failed: <yellow>%issues%</yellow> issue(s)</red>"
  config_precheck_issue: "[config] <gray>[<aqua>%severity%</aqua>] <yellow>%module%</yellow>:<white>%path%</white> -> %message%%hint%</gray>"
  config_precheck_issue_warn: "[config] <yellow>[%severity%] %module%:%path% -> %message%%hint%</yellow>"
  config_precheck_issue_error: "[config] <red>[%severity%] %module%:%path% -> %message%%hint%</red>"
  config_precheck:
    severity:
      fatal: "Fatal"
      error: "Error"
      warn: "Warning"
      info: "Info"
    hint: " <dark_gray>(%hint%)</dark_gray>"
    messages:
      passed: "Strengthen config precheck passed"
      required_file_missing: "Required file is missing"
      path_not_file: "Path is not a file"
      file_not_readable: "File is not readable"
      required_directory_missing: "Required directory is missing"
      path_not_directory: "Path is not a directory"
      directory_not_readable: "Directory is not readable"
      # Console: enhancement recipe material slot target_compare unknown; placeholders: %recipe%, %index%, %token%, %legal%
      enhancement_recipe_unknown_target_compare: "Enhancement recipe %recipe% material_%index% declares unknown target_compare '%token%'; legal values are %legal%"
      # Console: enhancement recipe material slot required/optional conflict; placeholders: %recipe%, %index%
      enhancement_recipe_required_optional_conflict: "Enhancement recipe %recipe% material_%index% declares both 'required' and 'optional'; 'optional' wins and 'required' is ignored"
      # Console: enhancement recipe material slot has neither matcher nor item_sources; placeholders: %recipe%, %index%
      enhancement_recipe_empty_matcher: "Enhancement recipe %recipe% material_%index% declares no matcher and no item_sources, so every supplied item satisfies this slot"
      # Console: enhancement recipe has no required material slot; placeholders: %recipe%
      enhancement_recipe_no_required_slot: "Enhancement recipe %recipe% has materials but none of them is required, so the slots never block an attempt"
      # Console: enhancement recipe duplicate pity track; placeholders: %recipe%, %track%
      enhancement_recipe_duplicate_pity_track: "Enhancement recipe %recipe% declares duplicate pity track '%track%'; duplicate tracks share one counter and double-count the same attempt"
      # Console: enhancement recipe pity track isolated by level; placeholders: %recipe%, %track%
      enhancement_recipe_pity_level_isolation: "Enhancement recipe %recipe% pity track '%track%' isolates by level under player scope, so the counter resets whenever the target level changes"
      # Console: enhancement recipe mode disagrees with target provider; placeholders: %recipe%, %mode%, %provider%
      enhancement_recipe_mode_provider_mismatch: "Enhancement recipe %recipe% declares mode '%mode%' but target provider '%provider%'; dispatch follows the provider and the mode only feeds the enhancement_mode placeholder, so the two disagreeing is usually a configuration mistake"
      # Console: forge variable path not under forge prefix; placeholders: %path%
      forge_variable_path_prefix: "forge variable path '%path%' must live under the forge prefix"
      # Console: canonical forge variable has no alias path; placeholders: %variable%
      forge_variable_canonical_missing: "canonical forge variable '%variable%' is not produced by any alias path"
      # Console: legacy forge variable no longer produced; placeholders: %variable%
      forge_variable_legacy_missing: "legacy forge variable '%variable%' is no longer produced, breaking existing recipes"
      # Console: forge PDC namespace mismatch; placeholders: %namespace%
      forge_pdc_namespace_mismatch: "forge pdc namespace expected 'emakiforge' but was '%namespace%'"
  bootstrap_start: "[loader] <gray>Checking default files...</gray>"
  bootstrap_complete: "[loader] <green>Default file check complete</green>"
  bootstrap_skip: "[loader] <yellow>release_default_data=false, skipped default data generation</yellow>"
  versioned_file_updated: "[loader] <green>Updated bundled file version: <yellow>%path%</yellow> <gray>(%old_version% → %new_version%)</gray></green>"
  bootstrap_copy_failed: "[loader] <yellow>Failed to copy default resource:
    <red>%path%</red> <gray>(%error%)</gray></yellow>"
  bootstrap_save_failed: "[loader] <yellow>Failed to save merged resource:
    <red>%path%</red> <gray>(%error%)</gray></yellow>"
  default_file_missing: "[loader] <yellow>Missing bundled default resource: <red>%path%</red></yellow>"
  directory_create_failed: "[loader] <yellow>Failed to create directory: <red>%path%</red></yellow>"
  loader_config_load_error: "[loader] <yellow>Failed to load strengthen config:
    <red>%path%</red> <gray>(%error%)</gray></yellow>"
  recipe_action_failed: "[attempt] <yellow>Strengthen action chain failed:
    <red>%recipe%</red> <gray>phase %phase% star %star%
    (%error%)</gray></yellow>"
  pdc_source_registered: "[integration] <gray>PDC attribute source registered: <aqua>%source%</aqua></gray>"
  recipes_loaded: "[loader] <gray>Loaded <yellow>%count%</yellow> strengthen recipe(s)</gray>"
  papi_registered: "[integration] <gray>PlaceholderAPI expansion registered</gray>"
  editor_open_failed: "[editor] <red>Could not open EmakiStrengthen editor for %item% (%error%)</red>"
  editor_template_missing: "[editor] <red>Missing EmakiStrengthen editor template: %template%</red>"
  editor_browser_create_failed: "[editor] <red>Could not create definition: %path% (%error%)</red>"
  editor_browser_delete_failed: "[editor] <red>Could not delete definition: %path% (%error%)</red>"
  editor_browser_list_failed: "[editor] <red>Could not list definition directory: %path% (%error%)</red>"
  # Console: reload progress notice
  reload_loading_files: "[reload] <gray>Loading configuration files...</gray>"
  reload_loading_configs: "[reload] <gray>Loading configs...</gray>"
  reload_applying: "[reload] <gray>Applying configuration...</gray>"
  reload_complete: "[reload] <green>Reload complete</green>"
  # Console: reload stage failed; placeholders: %stage%, %error%
  reload_stage_failed: "[reload] <yellow>Stage %stage% failed: %error%</yellow>"
  # Console: strengthen attempt failed closed; placeholders: %operation_id%, %error%
  strengthen_attempt_failed_closed: "[attempt] <red>Strengthen attempt failed closed | operationId=%operation_id% | error=%error%</red>"
  # Console: strengthen result event dispatch failed; placeholders: %operation_id%, %error%
  strengthen_result_dispatch_failed: "[event] <yellow>Strengthen result event dispatch failed | operationId=%operation_id% | error=%error%</yellow>"
  # Console: GUI result action dispatch failed; placeholders: %operation_id%, %error%
  gui_result_action_dispatch_failed: "[gui] <yellow>Strengthen result action dispatch failed | operationId=%operation_id% | error=%error%</yellow>"
  # Console: committed result owner retired; placeholders: %operation_id%
  gui_owner_retired: "[gui] <yellow>Strengthen committed result owner retired; settlement remains pending | operationId=%operation_id%</yellow>"
  # Console: committed result scheduling rejected; placeholders: %operation_id%
  gui_schedule_rejected: "[gui] <red>Strengthen committed result scheduling was rejected; settlement remains pending | operationId=%operation_id%</red>"
  # Console: committed result scheduling failed; placeholders: %operation_id%, %error%
  gui_schedule_failed: "[gui] <red>Strengthen committed result scheduling failed; settlement remains pending | operationId=%operation_id% | error=%error%</red>"
  # Console: committed result settlement failed and will be retried; placeholders: %operation_id%, %error%
  gui_settlement_retry: "[gui] <red>Strengthen committed result settlement failed and will be retried | operationId=%operation_id% | error=%error%</red>"
  # Console: result notification failed after settlement; placeholders: %operation_id%, %error%
  gui_notification_failed: "[gui] <yellow>Strengthen committed result notification failed after settlement | operationId=%operation_id% | error=%error%</yellow>"
  # Console: inventory-full notification failed; placeholders: %error%
  gui_inventory_full_notify_failed: "[gui] <yellow>Strengthen inventory-full notification failed | error=%error%</yellow>"

loader:
  lang_directory_create_failed: "[loader] <yellow>Failed to create language directory: <red>%path%</red></yellow>"
  bundled_language_load_failed: "[loader] <yellow>Failed to load bundled language: <red>%error%</red></yellow>"
  directory_create_failed: "[loader] <yellow>Failed to create %type% directory: <red>%path%</red></yellow>"
  invalid_blank_id: "[loader] <yellow>%type% ID is blank: <red>%file%</red></yellow>"
