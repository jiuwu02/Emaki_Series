# EmakiStrengthen English language resource
# Messages use MiniMessage; preserve placeholders documented beside message groups
# version is maintained by resource synchronization when default keys are merged

version: "5.0.8"

tags:
  affix: '[ affix ]'
  attempt: '[ attempt ]'
  lifecycle: '[ lifecycle ]'
  mastery: '[ mastery ]'

general:
  prefix: "<gray>[ <gradient:#3636F5:#E02492>EmakiStrengthen</gradient> ]</gray>"
  no_permission: "<red>You do not have permission to perform this action</red>"
  player_only: "<red>This command can only be executed by a player</red>"
  player_not_found: "<red>Target player not found</red>"
  unknown_command: "<red>Unknown command</red>"
  invalid_args: "<red>Invalid arguments</red>"
  reloading: "<gray>Reloading configuration...</gray>"
  reload_success: "<green>Config reloaded</green>"
  reload_summary:
    "<gray>Reloaded %recipes% recipes, %materials% materials, %guis%
    GUIs.</gray>"
  # Player: reload elapsed feedback; placeholders: %elapsed%
  reload_elapsed: "<gray>Reload took <white>%elapsed%ms</white></gray>"

command:
  branch:
    options: "<gold>This item reached a fork. Choose a strengthen route:</gold>"
    invalid: "<red>No such branch. Available routes:</red>"
    option: "<yellow>%id%</yellow> <gray>- %name%</gray>"
    success: "<green>Selected the <yellow>%name%</yellow> route  (path <gray>%path%</gray>)</green>"
  pity:
    header: "<gold>========== Pity Counters  (%count%) ==========</gold>"
    line: "<yellow>%group%</yellow> <gray>scope=%scope% key=%key% counter=%counter% triggered=%triggered%</gray>"
    empty: "<gray>No pity counter records exist</gray>"
    unavailable: "<red>The pity store is currently unavailable</red>"
    not_found: "<red>No matching pity record found</red>"
    set_success: "<green>Set the pity counter of <yellow>%group%</yellow> to <gold>%counter%</gold></green>"
    clear_success: "<green>Cleared <gold>%count%</gold> pity records</green>"
    invalid_scope: "<red>Pity scope must be one of <yellow>%legal%</yellow></red>"
    diagnose_header: "<gold>========== Pity Diagnostics ==========</gold>"
    diagnose_line: "<yellow>%key%</yellow> <gray>- %value%</gray>"
  operation:
    header: "<gold>========== Enhancement Operations  (%count%) ==========</gold>"
    line: "<yellow>%operation_id%</yellow> <gray>player=%player% phase=%phase% pending=%pending%</gray>"
    empty: "<gray>No enhancement operations are currently retained</gray>"
    not_found: "<red>No operation id <yellow>%operation_id%</yellow>; it may already be settled and pruned</red>"
    unavailable: "<red>The enhancement runtime is unavailable, operation ids cannot be queried</red>"
  inspect:
    header: "<gold>========== %player% Strengthen State ==========</gold>"
    line: "<yellow>%key%</yellow> <gray>- %value%</gray>"
  refresh:
    success: "<green>Refreshed strengthen layers for <aqua>%player%</aqua></green>"
  affix:
    no_recipe: "<red>No enhancement recipe with mode: affix is loaded</red>"
    recipe_not_found: "<red>Affix enhancement recipe <yellow>%recipe%</yellow> was not found</red>"
    ambiguous_recipe: "<red>Multiple affix recipes exist, specify one: <yellow>%recipes%</yellow></red>"
  setstar:
    success: "<green>Main-hand item set to <gold>+%star%</gold></green>"
  clearstate:
    success: "<green>Strengthen layer removed from main-hand item</green>"
    no_layer: "<yellow>Main-hand item has no removable strengthen layer</yellow>"
  clearcrack:
    success: "<green>Main-hand item temper cleared</green>"
  givecatalyst:
    success: "<green>Gave <gold>%amount%</gold> %material% to
      <aqua>%player%</aqua>.</green>"
  catalyst_not_found: "<red>Strengthen material ID not found</red>"
  catalyst_create_failed: "<red>Failed to create strengthen material item</red>"
  admin_state_failed: "<red>Failed to write strengthen state back to main-hand item</red>"
  help_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiStrengthen Command Help</gradient> <gray><st>        </st></gray>"
  help_entry_help: "- <hover:show_text:'<gray>help</gray> <dark_gray>·</dark_gray> <gray>Show this help page</gray>'><gray>help</gray></hover> <click:run_command:'%root% help'><green>[ ✦ Run ]</green></click>"
  help_entry_open: "- <hover:show_text:'<gray>open</gray> <dark_gray>·</dark_gray> <gray>Open the strengthen window</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.use</white><newline><dark_gray>▸</dark_gray> <gray>Admin permission also works</gray><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>open</gray></hover> <click:run_command:'%root% open'><green>[ ✦ Run ]</green></click>"
  help_entry_affix: "- <hover:show_text:'<gray>affix</gray> <dark_gray>·</dark_gray> <gray>Open the affix enhancement window</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.use</white><newline><dark_gray>▸</dark_gray> <gray>Admin permission also works</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [recipe ID] optional, opens the picker when omitted, Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>affix</gray></hover> <click:run_command:'%root% affix'><green>[ ✦ Run ]</green></click>"
  help_entry_edit: "- <hover:show_text:'<gray>edit</gray> <dark_gray>·</dark_gray> <gray>Open the in-game editor for a definition</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.edit</white><newline><dark_gray>▸</dark_gray> <gray>Argument [ID] optional, opens the browser when omitted, Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>edit</gray></hover> <click:run_command:'%root% edit'><green>[ ✦ Run ]</green></click>"
  help_entry_reload: "- <hover:show_text:'<gray>reload</gray> <dark_gray>·</dark_gray> <gray>Reload strengthen config and GUI</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.reload</white><newline><dark_gray>▸</dark_gray> <gray>Admin permission also works</gray>'><gray>reload</gray></hover> <click:run_command:'%root% reload'><green>[ ✦ Run ]</green></click>"
  help_entry_inspect: "- <hover:show_text:'<gray>inspect</gray> <dark_gray>·</dark_gray> <gray>Inspect the strengthen state of the held item</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.use</white><newline><dark_gray>▸</dark_gray> <gray>Admin permission also works</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [player] optional, inspects yourself when omitted, Tab completion suggests online players</gray>'><gray>inspect</gray></hover> <click:run_command:'%root% inspect'><green>[ ✦ Run ]</green></click>"
  help_entry_refresh: "- <hover:show_text:'<gray>refresh</gray> <dark_gray>·</dark_gray> <gray>Refresh strengthen layers in the inventory of a player</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.admin</white><newline><dark_gray>▸</dark_gray> <gray>Argument [player] optional, refreshes yourself when omitted, Tab completion suggests online players</gray>'><gray>refresh</gray></hover> <click:run_command:'%root% refresh'><green>[ ✦ Run ]</green></click>"
  help_entry_setstar: "- <hover:show_text:'<gray>setstar</gray> <dark_gray>·</dark_gray> <gray>Set the star level of the held item</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.admin</white><newline><dark_gray>▸</dark_gray> <gray>Argument [star] required, click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [recipe ID] optional, keeps the current recipe when omitted, Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>setstar</gray></hover> <click:run_command:'%root% help setstar'><yellow>[ ✦ Show values ]</yellow></click>"
  help_entry_branch: "- <hover:show_text:'<gray>branch</gray> <dark_gray>·</dark_gray> <gray>View or choose the strengthen branch of the held item</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.use</white><newline><dark_gray>▸</dark_gray> <gray>Admin permission also works</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [branch ID] optional, lists the options when omitted</gray><newline><dark_gray>▸</dark_gray> <gray>Options depend on the held item, Tab completion suggests values</gray><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>branch</gray></hover> <click:run_command:'%root% branch'><green>[ ✦ Run ]</green></click>"
  help_entry_clearstate: "- <hover:show_text:'<gray>clearstate</gray> <dark_gray>·</dark_gray> <gray>Remove the strengthen layer from the held item</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.admin</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>clearstate</gray></hover> <click:run_command:'%root% clearstate'><green>[ ✦ Run ]</green></click>"
  help_entry_clearcrack: "- <hover:show_text:'<gray>clearcrack</gray> <dark_gray>·</dark_gray> <gray>Clear the temper of the held item</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.admin</white><newline><dark_gray>▸</dark_gray> <gray>Player only</gray>'><gray>clearcrack</gray></hover> <click:run_command:'%root% clearcrack'><green>[ ✦ Run ]</green></click>"
  help_entry_givecatalyst: "- <hover:show_text:'<gray>givecatalyst</gray> <dark_gray>·</dark_gray> <gray>Give strengthen materials</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.admin</white><newline><dark_gray>▸</dark_gray> <gray>Argument [material ID] required, click to see available values</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [amount] optional, defaults to 1</gray><newline><dark_gray>▸</dark_gray> <gray>Argument [player] optional, gives to yourself when omitted, Tab completion suggests online players</gray>'><gray>givecatalyst</gray></hover> <click:run_command:'%root% help givecatalyst'><yellow>[ ✦ Show values ]</yellow></click>"
  help_entry_operation: "- <hover:show_text:'<gray>operation</gray> <dark_gray>·</dark_gray> <gray>Query enhancement operation ids and compensation state</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.admin</white><newline><dark_gray>▸</dark_gray> <gray>Argument [operation id] optional, list is shown when omitted, Tab completion suggests values</gray>'><gray>operation</gray></hover> <click:run_command:'%root% operation'><green>[ ✦ Run ]</green></click>"
  help_entry_pity: "- <hover:show_text:'<gray>pity</gray> <dark_gray>·</dark_gray> <gray>Pity counters: query, set, clear and diagnose</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.admin</white><newline><dark_gray>▸</dark_gray> <gray>Lists all pity counters without arguments</gray>'><gray>pity</gray></hover> <click:run_command:'%root% help pity'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>list</gray> <dark_gray>·</dark_gray> <gray>query pity counters</gray><newline><gray>set</gray> <dark_gray>·</dark_gray> <gray>overwrite one pity counter</gray><newline><gray>clear</gray> <dark_gray>·</dark_gray> <gray>clear every record of one pity group</gray><newline><gray>diagnose</gray> <dark_gray>·</dark_gray> <gray>diagnose the pity store</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_entry_debug: "- <hover:show_text:'<gray>debug</gray> <dark_gray>·</dark_gray> <gray>Debug tools: toggle debug output, player tracking, module toggles, action pipeline debugging</gray><newline><newline><dark_gray>▸</dark_gray> <gray>Requires permission </gray><white>emakistrengthen.debug</white><newline><dark_gray>▸</dark_gray> <gray>Admin permission also works</gray><newline><dark_gray>▸</dark_gray> <gray>Shows the debug status without arguments</gray>'><gray>debug</gray></hover> <click:run_command:'%root% help debug'><hover:show_text:'<gray>Optional arguments</gray><newline><gray>status</gray> <dark_gray>·</dark_gray> <gray>show the debug switch and tracking status</gray><newline><gray>on</gray> <dark_gray>·</dark_gray> <gray>turn on all debug output</gray><newline><gray>off</gray> <dark_gray>·</dark_gray> <gray>turn off all debug output</gray><newline><gray>player</gray> <dark_gray>·</dark_gray> <gray>toggle player debug tracking</gray><newline><gray>module</gray> <dark_gray>·</dark_gray> <gray>toggle one debug module</gray><newline><gray>action</gray> <dark_gray>·</dark_gray> <gray>action pipeline debugging</gray>'><gray>[ ✦ Args ]</gray></hover></click>"
  help_setstar_header: "<gray><st>        </st></gray> <gradient:#FF80FF:#00FFFF>EmakiStrengthen setstar [star] values</gradient> <gray><st>        </st></gray>"
  help_value_desc_setstar: "Set the star level of the held item to %value%"
