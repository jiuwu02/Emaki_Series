      level: "<gray>Level: <gold>%previous%</gold> <dark_gray>-></dark_gray> <yellow>%resulting%</yellow></gray>"
      capacity: "<gray>Capacity: <gold>%used%/%max%</gold> <dark_gray>(%remaining% left)</dark_gray></gray>"
