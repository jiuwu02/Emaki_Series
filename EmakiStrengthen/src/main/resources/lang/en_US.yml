  confirm:
    title: "<green>Confirm Strengthen</green>"
    ineligible_title: "<red>Cannot Strengthen</red>"
    ineligible_hint: "<gray>Please meet all strengthen conditions first</gray>"
  affix:
    select:
      title: "<gold>Select Affix</gold>"
      hint_no_target: "<gray>Place equipment to list enhanceable affixes</gray>"
      no_candidate: "<red>This equipment has no enhanceable affix</red>"
      current: "<gray>Current affix: <yellow>%affix%</yellow> <dark_gray>(%index%/%total%)</dark_gray></gray>"
      next_hint: "<gray>Left click: next affix</gray>"
      previous_hint: "<gray>Right click: previous affix</gray>"
    preview:
      title: "<gold>Affix Enhancement Preview</gold>"
      hint_no_target: "<gray>Place equipment to see before/after, capacity, cost and chance</gray>"
