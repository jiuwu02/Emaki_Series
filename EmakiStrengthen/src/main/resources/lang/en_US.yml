    attribute_bridge_unavailable: "<red>The attribute system is unavailable; nothing was enhanced and nothing was charged.</red>"
    refresh_failed: "<red>Failed to refresh the attributes and lore of the result; nothing was enhanced and nothing was charged.</red>"
