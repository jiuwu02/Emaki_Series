      pity_triggered: "<gold>Pity triggered, this attempt is forced to succeed <dark_gray>(counter %counter%)</dark_gray></gold>"
      cost_free: "<gray>Cost: <green>Free</green></gray>"
      cost_header: "<gray>Cost:</gray>"
      cost_line: "<gold> - %amount% %name%</gold>"
      material_ok: "<green> - %slot%: %supplied%/%required%</green>"
      material_missing: "<red> - %slot%: %supplied%/%required%</red>"
    confirm:
      title: "<green>Confirm Affix Enhancement</green>"
      hint: "<gray>Click to run this affix enhancement</gray>"
      ineligible_title: "<red>Cannot enhance this affix</red>"
      ineligible_hint: "<gray>Check affix selection, capacity, materials and cost</gray>"

# Debug mode messages
debug:
  attempt:
    operation: "Strengthen operation | operation_id=%operation_id% | outcome=%outcome% | phase=%phase%"
    start: "Strengthen start | player=%player% | item=%item% | current_star=%star%"
    probability: "Probability calc | base=%base% | bonus=%bonus% | final=%final%"
    roll: "Random result | roll=%roll% | threshold=%threshold% | success=%success%"
    success: "Strengthen success | new_star=%star%"
    failed: "Strengthen failed | type=%type% | temper=%crack%"
    destroyed: "Strengthen destroyed | item=%item%"
  state:
    read: "Read strengthen state | item=%item% | star=%star% | temper=%crack% | recipe=%recipe%"
    write: "Write strengthen state | item=%item% | change=%change%"
  gui:
    open: "Open GUI | player=%player%"
    click: "Strengthen GUI click | slot=%slot% | click=%click% | action=%action%"
